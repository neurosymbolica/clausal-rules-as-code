  reason: The general Texas rule on computing periods is not pinned. This order counts
    calendar days from the event, the day of the event not counted, and moves no last
    day for a Saturday, Sunday or legal holiday (reading (4); Q1). If that rule applies
    to the periods of Secs. 541.052, 541.053 and 541.154, a last day may move to a
    later day.
