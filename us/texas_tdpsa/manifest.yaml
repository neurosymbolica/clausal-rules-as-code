# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib,
# kit/deadline_lib) and library(datetime); no shared backbone package.
uses: []

scope: >-
  Tex. Bus. & Com. Code ch. 541 (Texas Data Privacy and Security Act): for one
  person or controller the caller describes, whether the chapter applies
  (Sec. 541.002(a), (b); the SBA small-business determination is an attested
  outside fact, never computed); the last day to respond to a consumer request
  or to tell the consumer the controller declines to act (Sec. 541.052(b), (c));
  the last day of the once-extended response period or that no extension is
  available (Sec. 541.052(b)); the last day to answer an appeal in writing
  (Sec. 541.053(c)); the last day of the 30-day cure period after the attorney
  general's written notice (Sec. 541.154); on a reference day, whether the cure
  period is running, the attorney general may bring an action, or no action may
  be brought for a cured violation (Secs. 541.154, 541.155(a)); and the maximum
  civil penalty in whole US dollars (Sec. 541.155(a)). Periods are calendar days
  from the event, the event day not counted, never moved for weekends or
  holidays (Tex. Gov't Code 311.014 not pinned). Out of scope (handed to the
  caller or a lawyer): whether conducting business in Texas or the necessity of
  an extension holds (open-textured judgements), the SBA size standards, the
  consumer rights themselves, fees, authentication, exempt data (Sec. 541.003),
  the Subchapter C duties, the small-business rule of Sec. 541.107, injunctions,
  fees and expenses, and the meaning of the Sec. 541.001 definitions.

sources:
  - "Tex. Bus. & Com. Code ch. 541 (Texas Data Privacy and Security Act), Secs. 541.002(a), (a)(1)-(3), (b), (b)(1)-(6); 541.052(b), (c); 541.053(c); 541.154, 541.154(1), (2), (2)(A)-(D); 541.155([quotation omitted]. Pinned text: document tx-bc-ch541-2026-11-16-pdf-save, the current chapter saved to PDF from the Texas statutes website on 2026-11-16 and extracted as text (a secondary copy, not the official printed code; no 'current through' line was read)."

