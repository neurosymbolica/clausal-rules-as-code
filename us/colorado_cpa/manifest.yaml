# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib,
# kit/query_combinators, kit/deadline_lib), no shared backbone package.
uses: []

scope: "Who [quotation omitted] to 6-1-1315) covers and when
  certain of its duties fall due. Decided here: whether part 13, other than the
  minors' sections, applies to a controller ([quotation omitted]) and the exempt
  persons of 6-1-1304(2)(l), (m), (q)); whether the minors' [quotation omitted]
  [quotation omitted] (6-1-1304(1)(b), (2)); the last day
  to inform a consumer of action on a request, with the extension (6-1-1306(2)(a),
  (b)); the last day to answer an appeal, with the extension (6-1-1306(3)(b)); the
  last day of the sixty-day cure period for the minors' sections and how that
  provision bears on an action on a given day (6-1-1311(1)(d)(II), read as in
  force from 1 October 2025 to 30 December 2026); and the first day a controller
  must recognise a universal opt-out mechanism on the public list
  (6-1-1306(1)(a)(IV)(B); 4 CCR 904-3, Rules 5.07(F), 5.08(A), 5.08(A)(3)).
  Out of scope: whether a duty was broken or met, the consumer rights and their
  exceptions, the data exemptions of 6-1-1304(2), penalties (C.R.S. 6-1-112, not
  pinned), the computation-of-time statute (C.R.S. 2-4-108, not pinned) and every
  other rule of 4 CCR 904-3 (see deferred_set). The open-textured business links
  and the reasonable necessity of an extension are handed to a lawyer as
  needs_legal_review."

