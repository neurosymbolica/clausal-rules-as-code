- what: computing_time_rules_not_pinned
  units: []
  instrument: Va. Code § 1-210 (computing time; not pinned)
  reason: The general Virginia rules on computing time are not pinned. This order
    counts calendar days from the event, the day of the event not counted, and moves
    no last day for a Saturday, Sunday or public holiday (reading (4); open question
    Q2). If those rules apply to the periods of 59.1-577 and 59.1-584, a last day
    may move.
  consequence: A date this order gives that falls on a Saturday, Sunday or public
    holiday is given unmoved; the caller or a lawyer checks whether a later day applies.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: enforcement_authority_expenses_and_no_private_action
  units:
