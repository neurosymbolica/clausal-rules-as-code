scope: "Consumer Data Protection Act, Code of Virginia Title 59.1 chapter 53, as pinned from the Virginia LIS web copy fetched 2026-11-16. Decided here: whether the chapter applies to a person (Va. Code 59.1-576(A), (B)); the last day for a controller's response to a consumer request and for its notice of a decline (59.1-577(B)(1), (B)(2)); the last day of the once-only 45-day extension (59.1-577(B)(1)); the last day for the controller's written answer to an appeal (59.1-577(C)); the last day of the Attorney General's 30-day cure period (59.1-584(B)); whether, on a day the caller names, the Attorney General may initiate an action on the noticed violation (59.1-584(B), (C)); and the most that may be sought in civil penalties, 7,500 US dollars per violation (59.1-584(C)). Days are calendar days, the day of the event not counted, and no last day is moved for a weekend or holiday. Open-textured terms (business link to Virginia; reasonable necessity of an extension) are handed to a lawyer as needs_legal_review. Out of scope (the deferred set): the definitions of 59.1-575 the caller applies, the data exemptions and COPPA deeming of 59.1-576(C), (D), the consumer rights, fees, authentication and deletion rules of 59.1-577(A) and (B)(3) to (B)(5), 59.1-577.1, 59.1-578 to 59.1-583, 59.1-584(A), (D), (E) and the computing-time rules of Va. Code 1-210. The answers never say that a duty was broken or met."

sources:
  - "Consumer Data Protection Act, Code of Virginia Title 59.1 chapter 53 (Va. Code 59.1-575 to 59.1-585), Virginia LIS web copy fetched 2026-11-16, document va-code-59-1-ch53-2026-11-16-lis-copy, sha256 62c62e78b55d4eb681b9de8ce2d5cdde04862e58fff66191c79b52934164065b (secondary copy; no in-force-as-of line, open question Q13)"
  - "Va. Code 59.1-576(A), (B): applicability and exempt persons"
  - "Va. Code 59.1-577(B)(1), (B)(2), (C): response, extension, decline and appeal periods"
  - "Va. Code 59.1-584(B), (C): cure period, Attorney General action and civil penalties"

