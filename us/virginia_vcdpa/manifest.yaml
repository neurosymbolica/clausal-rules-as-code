    processor roles and contracts), 59.1-580 (data protection assessments; subsection
    G applies them to processing activities created or generated after January 1,
    2023), 59.1-581 (de-identified and pseudonymous data), 59.1-582 (limitations and
    exemptions for processing) and 59.1-583 (civil investigative demand) set duties
    and limits that are not part of this order's dated-duties slice.
