  reason: 59.1-584(A) gives the Attorney General exclusive authority to enforce; (D)
    lets the Attorney General recover reasonable expenses including attorney fees;
    (E) excludes a private right of action. attorney_general_action_status speaks
    of the Attorney General's action only and civil_penalty_maximum of civil penalties
    only; these three subsections change no answer this order gives.
  consequence: The answers never say what expenses may be recovered and never speak
    of an action by anyone but the Attorney General (reading (9), (10)).
  declaration: answered_with_caveat
