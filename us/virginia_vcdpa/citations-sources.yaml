us_va_code_59_1_576_a:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-576/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_576_A"
  note: >-
    This is the applicability test. It requires the business link
    (a judgement) and either 'at least 100,000 consumers' (count >= 100000)
    or 'at least 25,000 consumers' (count >= 25000) together with 'over 50
    percent' of gross revenue from sale. 'Over 50 percent' is strictly more
    than half and is the caller's crisp fact.
us_va_code_59_1_576_b:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-576/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_576_B"
  note: >-
    These are the five exempt kinds of person. An exempt entity_category
    decides first (Q5). The data exemption in clause (ii) is deferred.
