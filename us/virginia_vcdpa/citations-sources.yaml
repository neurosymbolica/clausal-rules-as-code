us_va_code_59_1_577_b_1:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-577/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_577_B_1"
  note: >-
    The response is due 'within 45 days of receipt' (RECEIVED + 45). The
    period may be 'extended once by 45 additional days' (RECEIVED + 90) if
    the extension is reasonably necessary (a judgement) and notice with the
    reason is given within the initial 45-day period (a crisp fact).
us_va_code_59_1_577_b_2:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-577/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_577_B_2"
  note: >-
    The notice of a decline is due 'at the latest within 45 days of
    receipt'. The extension does not reach this notice (Q6).
us_va_code_59_1_577_c:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-577/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_577_C"
  note: >-
    The written answer to an appeal is due 'Within 60 days of receipt of
    an appeal' (APPEAL_RECEIVED + 60). No extension is applied. The
    verbatim is the load-bearing sentence of the pinned unit.
us_va_code_59_1_584_b:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-584/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_584_B"
  note: >-
    The Attorney General gives '30 days'' written notice' before any action
    (NOTICE_DATE + 30 is the last day of the cure period). A cure with an
    express written statement within the period bars the action.
us_va_code_59_1_584_c:
  status: verified
  url: "https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-584/"
  retrieved: 2026-11-16
  unit: "va-code-59-1-ch53-2026-11-16-lis-copy#s59_1_584_C"
  note: >-
    An action is allowed after the cure period on a continued violation or
    a breach of the statement. Civil penalties are 'of up to $7,500 for each
    violation' (7500 x violation_count, in whole US dollars). The verbatim
    is the first sentence of the pinned unit.
