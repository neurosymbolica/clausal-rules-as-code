# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib,
# kit/deadline_lib), which are not domain backbone packages.
uses: []

scope: "Swiss Federal Act on Data Protection (DSG, SR 235.1, German text, fedlex consolidation Stand 7 July 2025) Arts 60 to 66, criminal provisions, on given facts: whether conduct falls under the one examined offence of Arts 60(1)(a), 60(1)(b) numbers 1 and 2, 60(2), 61(a) to (c), 62(1), 62(2) or 63 (fine of up to 250 000 francs); whether its prosecution needs a criminal complaint and whether one was filed; whether the five-year limitation period of Art 66 has run between two dates; and whether under Art 64(2) the authority may order the business to pay the fine (fine in consideration at most 50 000 francs, inclusive). For comparison, the ceiling of administrative fines under EU GDPR Art 83(4), (5) and (6), and whether each law provides a fine on the same facts. Out of scope (handed to the lawyer): the amount of any fine; who in a business is punishable under VStrR Arts 6 and 7 (Art 64(1)); the competent authority (Art 65); the duties the offences refer to; Swiss Criminal Code rules on intent, complaint and limitation; whether an EU fine is imposed and its amount; GDPR Art 84 penalties under Member State law."

sources:
  - "Bundesgesetz ueber den Datenschutz (DSG), SR 235.1, Arts 60(1), 60(2), 61, 62(1) to (3), 63, 64(2), 66 (Art 64(1) quoted and deferred); German text authoritative, fedlex consolidation Stand 7 July 2025, Akoma Ntoso, fetched 2026-11-14"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, Art 83(4), (5) and (6) (Art 83(2)(b) quoted for reading (9)); Formex consolidation 02016R0679-20160504"

query_interface:
  3: "swiss_offence_punishable/3"                                  # status: punishable under the examined offence
  5: "compare_swiss_eu_fine_provided/5"                            # comparison: Swiss offence vs EU ceiling
  6: "swiss_fadp_s4_criminal_provisions_business_threshold/1"      # threshold: DSG Art 64(2) flip point (50 000 francs)
  7: "swiss_fadp_s4_criminal_provisions_checklist/2"               # justification: cite(...) per checklist item
  15: "swiss_prosecution_limitation_last_day/2"                    # deadline: last day before DSG Art 66 bar
  16: "swiss_fadp_s4_criminal_provisions_what_if/4"                # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_60
  - ch-fadp-sr-235-1-2025-07-07#art_61
  - ch-fadp-sr-235-1-2025-07-07#art_62
  - ch-fadp-sr-235-1-2025-07-07#art_63
  - ch-fadp-sr-235-1-2025-07-07#art_64
  - ch-fadp-sr-235-1-2025-07-07#art_65
  - ch-fadp-sr-235-1-2025-07-07#art_66
  - 02016R0679-20160504#art_083
  reason: 'The titles of the pinned articles (DSG Arts 60 to 66, GDPR Art 83) carry
    no rule: document structure. Deferred so every unit of the pinned extracts is
    accounted for.'
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: persons_punishable_in_businesses
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_64/para_1
  instrument: Federal Act of 22 March 1974 on Administrative Criminal Law (VStrR,
    SR 313.0) Arts 6 and 7
  reason: 'DSG Art 64(1) makes Arts 6 and 7 of the Administrative Criminal Law Act
    apply to offences committed in businesses: who in a business is punishable (the
    person who acted and, under VStrR Art 6, others) and when the business itself
    is liable. The VStrR is not pinned, so the order does not formalise it (reading
    (7), open question Q8).'
  consequence: No answer says which persons in a business are punishable.
  declaration: answered_with_caveat
  debt: true
  open: formalisable once VStrR Arts 6 and 7 are pinned; the deferral stands for this
    run.
- what: criminal_jurisdiction_and_commissioner_rights
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_65/para_1
  - ch-fadp-sr-235-1-2025-07-07#art_65/para_2
  reason: 'DSG Art 65(1) gives the prosecution and the judgement of offences to the
    cantons; Art 65(2) lets the Commissioner make a report to the prosecuting authority
    and exercise the rights of a private claimant: the competence and powers of authorities,
    not a duty of the caller (reading (6)).'
  consequence: No answer names the competent authority.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: eu_fine_effective_proportionate_dissuasive
  units:
  - 02016R0679-20160504#parag_083.001
  reason: 'GDPR Art 83(1) requires each fine to be effective, proportionate and dissuasive
    in each individual case: a standard for the fine imposed, not for the ceiling
    this order answers.'
  consequence: The EU answer is a ceiling, not a fine.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a later order; the deferral stands for this run.
- what: eu_whether_and_how_much_to_fine
  units:
  - 02016R0679-20160504#parag_083.002
  - 02016R0679-20160504#point_083.002_a
  - 02016R0679-20160504#point_083.002_b
  - 02016R0679-20160504#point_083.002_c
  - 02016R0679-20160504#point_083.002_d
  - 02016R0679-20160504#point_083.002_e
  - 02016R0679-20160504#point_083.002_f
  - 02016R0679-20160504#point_083.002_g
  - 02016R0679-20160504#point_083.002_h
  - 02016R0679-20160504#point_083.002_i
  - 02016R0679-20160504#point_083.002_j
  - 02016R0679-20160504#point_083.002_k
  reason: GDPR Art 83(2) says fines are imposed in addition to or instead of the Art
    58(2) measures, depending on the circumstances, and lists the matters weighed
    in deciding whether to fine and how much (points (a) to (k)); the order answers
    the ceiling only. Point (b) is quoted for reading (9) (intent is weighed, not
    required).
  consequence: No answer says whether an EU fine is imposed or how much it is.
  declaration: answered_with_caveat
  debt: true
  partial: true
  open: formalisable in a later order; the deferral stands for this run.
- what: eu_several_infringements
  units:
  - 02016R0679-20160504#parag_083.003
  reason: GDPR Art 83(3) caps the total fine for several infringements in the same
    or linked processing operations at the amount for the gravest; the order answers
    one infringement at a time.
  consequence: No answer combines several EU infringements.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a later order; the deferral stands for this run.
- what: eu_public_authorities
  units:
  - 02016R0679-20160504#parag_083.007
  reason: 'GDPR Art 83(7) leaves to each Member State whether and how far fines may
    be imposed on public authorities and bodies: Member State law, not pinned.'
  consequence: For a public authority the caller must check the Member State rule.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: eu_procedural_safeguards
  units:
  - 02016R0679-20160504#parag_083.008
  reason: 'GDPR Art 83(8) subjects the power to fine to procedural safeguards: a rule
    of procedure with no output of this order.'
  consequence: None for the ceiling.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: eu_member_states_without_administrative_fines
  units:
  - 02016R0679-20160504#parag_083.009
  reason: 'GDPR Art 83(9) lets a Member State without administrative fines have them
    initiated by the authority and imposed by courts: Member State law and procedure,
    not pinned.'
  consequence: None for the ceiling.
  declaration: not_an_exception
  not_formalized_because: national_law

excluded_set:
- what: duties_referred_to_by_the_offences
  instrument: DSG (SR 235.1) Arts 8(3), 9, 16, 17, 19, 21, 25 to 27, 49(3); DSV (SR
    235.11) minimum requirements for data security
  cites:
  - ch-fadp-sr-235-1#art_8
  - ch-fadp-sr-235-1#art_9
  - ch-fadp-sr-235-1#art_16
  - ch-fadp-sr-235-1#art_17
  - ch-fadp-sr-235-1#art_19
  - ch-fadp-sr-235-1#art_21
  - ch-fadp-sr-235-1#art_25
  - ch-fadp-sr-235-1#art_26
  - ch-fadp-sr-235-1#art_27
  - ch-fadp-sr-235-1#art_49
  reason: The offences of Arts 60 and 61 refer to duties in other articles, which
    are not pinned for this order; the caller judges whether the duty was breached
    in conduct_meets_offence_description (reading (2)).
  consequence: The order does not test the referred duties itself.
- what: swiss_criminal_code_general_rules
  instrument: Swiss Criminal Code (StGB, SR 311.0) Arts 12, 30, 31, 97, 98
  cites:
  - ch-stgb-sr-311-0#art_12
  - ch-stgb-sr-311-0#art_30
  - ch-stgb-sr-311-0#art_31
  - ch-stgb-sr-311-0#art_97
  - ch-stgb-sr-311-0#art_98
  reason: Intent (Art 12), the complaint (Arts 30 and 31) and the running of limitation
    (Arts 97 and 98) are general rules of the Criminal Code, not pinned (reading (3),
    reading (6), reading (8), open question Q2, open question Q7).
  consequence: Intent is a caller judgement; the complaint's validity and the limitation's
    start, interruption and end rules are not checked.
- what: administrative_criminal_law_act
  instrument: Federal Act of 22 March 1974 on Administrative Criminal Law (VStrR,
    SR 313.0) Arts 6 and 7
  cites:
  - ch-vstrr-sr-313-0#art_6
  - ch-vstrr-sr-313-0#art_7
  reason: DSG Art 64(2) refers to the persons punishable under VStrR Art 6 and to
    the business of VStrR Art 7; the VStrR is not pinned (reading (7)).
  consequence: The caller judges the Art 64(2) conditions; the VStrR rules are not
    tested.
- what: eu_obligations_listed_in_article_83
  instrument: Regulation (EU) 2016/679 Arts 5 to 9, 11, 12 to 22, 25 to 39, 41 to
    49, 58
  cites:
  - 32016R0679#art_005
  - 32016R0679#art_012
  - 32016R0679#art_025
  - 32016R0679#art_032
  - 32016R0679#art_044
  - 32016R0679#art_058
  reason: The obligations named in the lists of GDPR Art 83(4) and (5) are not pinned
    for this order; the caller judges the infringement in eu_infringement_established
    and classifies it in eu_infringed_obligation_listed_in (reading (9)).
  consequence: The order does not test the EU obligations itself.
- what: eu_penalties_under_member_state_law
  instrument: Regulation (EU) 2016/679 Art 84
  cites:
  - 32016R0679#art_084
  reason: GDPR Art 84 (penalties laid down by Member States for infringements not
    subject to administrative fines) is not in the corpus; the comparison with it
    was not done (reading (11), open question Q11).
  consequence: No answer compares the Swiss fines with Member State penalties.
- what: scope_of_application
  instrument: DSG (SR 235.1) Arts 2 and 3; Regulation (EU) 2016/679 Arts 2 and 3
  cites:
  - ch-fadp-sr-235-1#art_2
  - ch-fadp-sr-235-1#art_3
  - 32016R0679#art_002
  - 32016R0679#art_003
  reason: The personal, material and territorial scope of the DSG and of the EU GDPR
    are not pinned; the order assumes that each applies (reading (11)).
  consequence: No answer says whether the DSG or the EU GDPR applies.
- what: entry_into_force_and_transitional_provisions
  instrument: DSG (SR 235.1) Arts 69 to 74
  cites:
  - ch-fadp-sr-235-1#art_69
  - ch-fadp-sr-235-1#art_70
  - ch-fadp-sr-235-1#art_74
  reason: 'The entry-into-force and transitional provisions were not pinned or read:
    a missing fact named under the ruling (reading (11), open question Q11).'
  consequence: The order answers under the pinned consolidation only; conduct before
    the DSG entered into force is not checked.
