- what: eu_processor_notice
  units:
  - 02016R0679-20160504#parag_033.002
  reason: GDPR Art 33(2), the processor's notice to the controller, is formalised
    in the sibling order gdpr-breach-notification; this order compares the controller's
    notification of Art 33(1) only.
  consequence: No EU answer for the processor.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-breach-notification
- what: eu_notification_content_phases_and_documentation
  units:
  - 02016R0679-20160504#parag_033.003
  - 02016R0679-20160504#point_033.003_a
  - 02016R0679-20160504#point_033.003_b
  - 02016R0679-20160504#point_033.003_c
  - 02016R0679-20160504#point_033.003_d
  - 02016R0679-20160504#parag_033.004
  - 02016R0679-20160504#parag_033.005
  reason: GDPR Art 33(3) to (5), the content of the notification, the information
