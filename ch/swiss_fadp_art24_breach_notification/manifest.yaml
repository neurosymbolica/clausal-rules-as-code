  consequence: No EU answer on content, phases or documentation.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-breach-notification

excluded_set:
- what: restriction_grounds_of_article_26
  instrument: DSG (SR 235.1) Art 26(1)(b) and (2)(b)
  cites:
  - ch-fadp-sr-235-1#art_26
  reason: DSG Art 24(5)(a) refers to the grounds of Art 26(1)(b) and (2)(b), which
    are not pinned; the caller judges whether such a ground exists, or a statutory
    duty of secrecy forbids the information, in the one key article_26_ground_or_statutory_secrecy_obligation_applies
    (reading (6), open question Q9).
  consequence: The order does not test the Art 26 grounds itself.
- what: eu_definition_of_personal_data_breach
  instrument: Regulation (EU) 2016/679 Art 4(12)
  cites:
  - 32016R0679#art_004
  reason: The EU definition of a personal data breach is not pinned for this order;
    the caller judges it as personal_data_breach (reading (2), open question Q3).
  consequence: The caller states whether the incident is a personal data breach in
    the meaning of the EU GDPR.
- what: scope_of_application
  instrument: DSG (SR 235.1) Arts 2 and 3; Regulation (EU) 2016/679 Arts 2 and 3
  cites:
  - ch-fadp-sr-235-1#art_2
  - ch-fadp-sr-235-1#art_3
  - 32016R0679#art_002
  - 32016R0679#art_003
  reason: The personal, material and territorial scope of the DSG and of the EU GDPR
    are not pinned; the order assumes that each applies to the processing (reading
    (10), open question Q6).
  consequence: No answer says whether the DSG or the EU GDPR applies.
- what: entry_into_force_and_transitional_provisions
  instrument: DSG (SR 235.1) Arts 69 to 74; DSV (SR 235.11) final provisions
  cites:
  - ch-fadp-sr-235-1#art_69
  - ch-fadp-sr-235-1#art_70
  - ch-fadp-sr-235-1#art_74
  - ch-fadp-ord-sr-235-11#final_provisions
  reason: 'The entry-into-force and transitional provisions were not pinned or read:
    a missing fact named under the status rule (reading (10)(iii), open question Q8).'
  consequence: The order answers under the pinned consolidations only and has no date
    argument.
