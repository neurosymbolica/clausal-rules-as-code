scope: >-
  Swiss law in force (a reading, not a lawyer's). The breach-reporting
  duties of the Swiss Federal Act on Data Protection (DSG, SR 235.1, German text,
  fedlex consolidation Stand 7 July 2025, authoritative; English glosses
  unofficial) Art 24: the controller's report to the Federal Data Protection and
  Information Commissioner (EDOeB) under Art 24(1), the processor's report to the
  controller under Art 24(3), and the information of the data subject under Art
  24(4) with its restriction, deferral or omission under Art 24(5), with the
  definition of a breach of data security in DSG Art 5 letter h. For comparison
  its own limb for Regulation (EU) 2016/679 (GDPR) Art 33(1), the controller's
  notification to the supervisory authority, compared on the same facts with the
  Swiss authority duty (the two threshold provisions make any difference).
  Every open-textured matter (breach, likely high risk, necessity, the Art 24(5)
  grounds, the EU breach and unlikely-risk judgements) is a tri-state judgement
  of the caller; an unsure one that decides goes to a lawyer as
  needs_legal_review. No date argument and no deadline: 'so rasch als moeglich'
  has no number and the EU 72 hours are not read. Out of scope: timeliness and
  content of a report or information, DSV Art 15, the documentation duty, the
  Commissioner's forwarding (Art 24(5bis)), use in criminal proceedings (Art
  24(6)), penalties (DSG Arts 60, 61, which name no Art 24 duty), GDPR Art 33(2)
  to (5) (sibling order gdpr-breach-notification), the Art 26 grounds, the GDPR
  Art 4(12) definition and the scope of application of either instrument.

sources:
  - "Bundesgesetz ueber den Datenschutz (DSG), SR 235.1, fedlex consolidation Stand 7 July 2025, German text (authoritative), Akoma Ntoso, fetched 2026-11-14: Art 5 Bst. h (definition of Verletzung der Datensicherheit)"
  - "Bundesgesetz ueber den Datenschutz (DSG), SR 235.1, fedlex consolidation Stand 7 July 2025, German text (authoritative): Art 24 Abs. 1, 3, 4 and 5 Bst. a to c (Meldung von Verletzungen der Datensicherheit)"
  - "Bundesgesetz ueber den Datenschutz (DSG), SR 235.1, fedlex consolidation Stand 7 July 2025, German text: Arts 60 and 61 (Strafbestimmungen; pinned, deferred: name no Art 24 duty)"
  - "Verordnung ueber den Datenschutz (DSV), SR 235.11, fedlex consolidation Stand 1 December 2025, German text: Art 15 (pinned, deferred: content, phases, documentation)"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, Formex consolidation 02016R0679-20160504: Art 33(1) (notification of a personal data breach to the supervisory authority; comparison limb)"

query_interface:
  2: "swiss_fadp_art24_breach_notification_status/2"      # status verdict: the controller's report to the Commissioner
  5: "compare_swiss_eu_authority_notification/5"          # comparison: Swiss DSG Art 24(1) against GDPR Art 33(1)
  7: "swiss_fadp_art24_breach_notification_checklist/2"   # justification: one item per obligation with cite(...) provenance
  14: "swiss_fadp_art24_breach_notification_obligations/2" # obligation surfacing: each bearer's duty and its answer
  16: "swiss_fadp_art24_breach_notification_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_24
  - ch-fadp-sr-235-1-2025-07-07#art_60
  - ch-fadp-sr-235-1-2025-07-07#art_61
  - ch-fadp-sr-235-1-2025-07-07#art_8
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15
  - 02016R0679-20160504#art_033
  reason: 'The titles of the pinned articles (DSG Arts 8, 24, 60 and 61, DSV Art 15,
    GDPR Art 33) carry no rule: document structure. Deferred so every unit of the
    pinned extracts is accounted for.'
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: swiss_report_content
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_24/para_2
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/listintro
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_a
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_b
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_c
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_d
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_e
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_f
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_1/lbl_g
  reason: DSG Art 24(2) and DSV Art 15(1) list what a report to the Commissioner must
    at least contain (the kind of breach, its consequences, the measures, and in the
    DSV the time and duration, the categories and numbers, and a contact person, several
    'soweit möglich'); the order does not check a report's content (reading (3)).
  consequence: No answer says whether a report contains what it must.
  declaration: answered_with_caveat
  debt: true
  open: formalisable as a content check in a later order; the deferral stands for
    this run.
- what: swiss_report_in_phases
  units:
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_2
  reason: DSV Art 15(2) lets the controller supply missing items later, as quickly
    as possible, when it cannot report them all at once; the order does not check
    a report's content or timing (readings (3) and (4)).
  consequence: No answer says whether items supplied later were supplied in time.
  declaration: answered_with_caveat
  debt: true
  open: formalisable with the content check; the deferral stands for this run.
- what: swiss_information_content
  units:
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_3
  reason: DSV Art 15(3) sets what the information to the data subject must at least
    contain, in simple and understandable language; the order says only whether the
    information is owed (reading (5)).
  consequence: No answer says whether an information contains what it must.
  declaration: answered_with_caveat
  debt: true
  open: formalisable with the content check; the deferral stands for this run.
- what: swiss_documentation_duty
  units:
  - ch-fadp-ord-sr-235-11-2025-12-01#art_15/para_4
  reason: DSV Art 15(4) requires the controller to document breaches and keep the
    documentation for at least two years from the report; it is a duty this order
    does not answer.
  consequence: No answer says what must be documented or for how long.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a later order; the deferral stands for this run.
- what: commissioner_forwarding_to_cybersecurity_office
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_24/para_5_bis
  reason: 'DSG Art 24(5bis) lets the Commissioner forward a report, with the controller''s
    consent, to the Federal Office for Cybersecurity for analysis: a power of an authority,
    not a duty of the caller.'
  consequence: None for the duties answered here.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: use_of_report_in_criminal_proceedings
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_24/para_6
  reason: 'DSG Art 24(6) limits the use of a report in criminal proceedings against
    the person bound to report to the case where that person consents: a rule of procedure
    with no output of this order.'
  consequence: None for the duties answered here.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: swiss_data_security_duty
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_8/para_1
  - ch-fadp-sr-235-1-2025-07-07#art_8/para_2
  - ch-fadp-sr-235-1-2025-07-07#art_8/para_3
  reason: DSG Art 8 sets the duty of data security and the Federal Council's power
    to set minimum requirements; pinned because Art 61(c) refers to Art 8(3) (reading
    (9)); the order does not answer whether security was adequate.
  consequence: No answer says whether the measures were adequate.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a later order; the deferral stands for this run.
- what: swiss_penalties
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1/listintro
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1/lbl_a
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1/lbl_b
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1/lbl_b/listintro
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1/lbl_b/lbl_1
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_1/lbl_b/lbl_2
  - ch-fadp-sr-235-1-2025-07-07#art_60/para_2
  - ch-fadp-sr-235-1-2025-07-07#art_61/para/listintro
  - ch-fadp-sr-235-1-2025-07-07#art_61/para/lbl_a
  - ch-fadp-sr-235-1-2025-07-07#art_61/para/lbl_b
  - ch-fadp-sr-235-1-2025-07-07#art_61/para/lbl_c
  reason: DSG Arts 60 and 61 set fines for private persons for breaches of other listed
    duties; neither names Art 24 (reading (9)); no query answers on penalties.
  consequence: No answer says whether a fine can be imposed.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a later order; the deferral stands for this run (open question
