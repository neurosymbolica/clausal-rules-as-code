uses: []

scope: >-
  Swiss Federal Act on Data Protection (DSG, SR 235.1, German text, fedlex
  consolidation Stand 7 July 2025) Art 19 paras 1 to 4 (the controller's duty
  to inform the data subject on the collection of personal data and the minimum
  items it must tell), Art 20 (exceptions to that duty, and the controller's
  permission to restrict, defer or dispense with the information), Art 21 (the
  duty to inform of an automated individual decision, the rights to state a
  point of view and to human review, and the marking of such a decision by a
  federal body) and Art 22 paras 1, 2, 4 and 5 (whether a data protection
  impact assessment is required, exempted or may be omitted). For comparison it
  carries its own readings of EU GDPR Arts 13(1), (2)(f), (4), 14(1), (2)(g),
  (5), 22(1) and 35(1), (3), (10) and sets three pairs of answers side by side
  on the same facts. Open-textured terms are judgements of the caller (true,
  false or unsure); an unsure judgement that decides is referred to a lawyer.
  Not decided here: when the information must be given (DSG Art 19(5), GDPR
  Art 14(3)), what an impact assessment must contain (DSG Art 22(3), GDPR Art
  35(7)), the EU lists of information items, whether an automated decision is
  lawful (GDPR Art 22(2) to (4)), and the provisions referred to but not
  pinned (DSG Arts 2, 3, 5, 11, 13, 16, 17, 27; VwVG Art 30(2); GDPR Arts 4, 6,
  9, 10, 23). The order has no date argument and states the law of the pinned
  texts.

sources:
  - "Bundesgesetz ueber den Datenschutz (Datenschutzgesetz, DSG) vom 25. September 2020, SR 235.1, German text, fedlex consolidation Stand 7 July 2025 (Akoma Ntoso), Arts 19(1)-(4), 20, 21, 22(1), (2), (4), (5); Art 19(5) and Art 22(3) pinned and deferred"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, Formex consolidation 02016R0679-20160504, Arts 13(1), 13(2)(f), 13(4), 14(1), 14(2)(g), 14(5)(a)-(d), 22(1), 35(1), 35(3)(a)-(c), 35(10); Art 22(2)-(4) pinned and deferred"

