  - 02016R0679-20160504#art_014
  - 02016R0679-20160504#art_022
  - 02016R0679-20160504#art_035
  reason: 'The titles of the pinned articles (DSG Arts 19 to 22; GDPR Arts 13, 14,
    22 and 35) carry no rule: document structure. Deferred so every unit of the pinned
    extracts is accounted for.'
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: swiss_information_timing
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_19/para_5
  reason: 'DSG Art 19(5) sets when the information is given where the data are not
    collected from the data subject: at the latest one month after the controller
    received the data, or at the latest at a disclosure made before that month ends.
    The order computes no date (reading (6)).'
  consequence: No answer says by when the information must be given.
  declaration: answered_with_caveat
  debt: true
  open: formalisable as a deadline query with date arguments in a later order; the
    deferral stands for this run.
- what: swiss_impact_assessment_content
  units:
  - ch-fadp-sr-235-1-2025-07-07#art_22/para_3
  reason: DSG Art 22(3) sets what an impact assessment contains (a description of
    the planned processing, an assessment of the risks to the personality or the fundamental
    rights of the data subject, and the protective measures); the order says only
    whether an assessment is needed (reading (11)).
  consequence: No answer says whether an assessment contains what it must.
  declaration: answered_with_caveat
  debt: true
  open: formalisable as a content check in a later order; the deferral stands for
    this run.
