scope: >-
  Swiss law in force (drafter's reading, not a lawyer's). Whether a disclosure of
  personal data abroad is permitted under the Swiss Federal Act on Data Protection
  (DSG, SR 235.1, Stand 7 July 2025) Arts 16 and 17 with the Data Protection
  Ordinance (DSV, SR 235.11, Stand 1 December 2025) Art 8(1), Annex 1 and Art 12,
  and on which route: a finding of the Federal Council (DSG Art 16(1), stated by the
  caller as an outside fact), one of the seven safeguard ways of DSG Art 16(2)(a)-(e)
  and Art 16(3) with DSV Art 12, or one of the eight derogations of DSG Art 17(1),
  in that cascade; whether the controller or processor must inform the Commissioner
  (EDOEB) on request under DSG Art 17(2); and, for comparison, the EU route under
  Regulation (EU) 2016/679 Arts 45(1) and 46(1), set beside the Swiss route of DSG
  Art 16 on the same facts. Every suitability, consent, necessity and remedy question
  is the caller's tri-state judgement and an unsure judgement goes to a lawyer; the
  acts of authorities (the Federal Council's finding, the Commissioner's approval of
  standard clauses, the approval of binding corporate rules, the Commission's adequacy
  decision) are attested outside facts referred to a lawyer when absent. Out of scope:
  the content of clauses, guarantees and rules, the measures to make the recipient
  comply, the procedures of the Federal Council, the Commissioner and the Commission,
  DSV Art 9(3), DSV Annex 1 notes on Directive (EU) 2016/680, GDPR Arts 44, 46(2)-(5)
  and 49 (so the EU answer no_adequacy_decision_or_safeguards is not a refusal), the
  scope and definitions of the DSG and GDPR, penalties (DSG Art 61), and transitional
  provisions. No date argument: every fact is the caller's fact for the time of the
  disclosure.

sources:
  - "Bundesgesetz ueber den Datenschutz (DSG), SR 235.1, fedlex consolidation Stand 7 July 2025 (German text authoritative): Art 16 paras 1, 2 (letters a to e) and 3; Art 17 paras 1 (letters a to f) and 2"
  - "Verordnung ueber den Datenschutz (DSV), SR 235.11, fedlex consolidation Stand 1 December 2025 (German text authoritative): Art 8 para 1; Annex 1 (44 entries); Art 12 paras 1 to 3"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), OJ L 119, 4.5.2016, Formex consolidation 02016R0679-20160504: Art 45(1) and Art 46(1)"

query_interface:
  2: "swiss_fadp_s1_international_transfers_status/2"       # status verdict: the route of a disclosure abroad
  5: "compare_swiss_eu_transfer_routes/5"                    # comparison: Swiss DSG Art 16 route vs EU GDPR Arts 45/46 route
  7: "swiss_fadp_s1_international_transfers_checklist/2"    # justification: checklist items carry cite(...)
  14: "swiss_information_of_commissioner_on_request/3"      # obligation surfacing: duty to inform the Commissioner (DSG Art 17(2))
  16: "swiss_fadp_s1_international_transfers_what_if/4"     # what_if: re-evaluate under an overridden key

