uses: []

scope: "For ONE financial entity presupposed to be within the scope of Regulation (EU) 2022/2554 (DORA): which of the duties of protection and prevention (Article 9) and of detection (Article 10) apply to it, whether it has performed all of them, and which are outstanding, with the rule of Article 16(1), first subparagraph, that Articles 5 to 15 do not apply to the entities it lists (answered simplified_framework_entity). Each duty is a caller judgement (true, false, unsure); an unsure judgement that matters is referred to a lawyer. Out of scope: whether the entity is a financial entity within scope (the order on scope and entity types), the simplified ICT risk management framework of Article 16(1), second subparagraph, (2) and (3) (the order on proportionality and the simplified framework), Articles 5 to 8 and 11 to 15 (their own orders), Articles 17 and 25, and Commission Delegated Regulation (EU) 2024/1774. Every reading is the drafter's reading, not a lawyer's."

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), CELEX 32022R2554, OJ L 333, 27.12.2022, p. 1 (original OJ text as published): Article 9(1) to (4), Article 10(1) to (4)"
  - "Regulation (EU) 2022/2554 (DORA), CELEX 32022R2554, OJ L 333, 27.12.2022, p. 1: Article 16(1), first subparagraph (the entities to which Articles 5 to 15 do not apply)"

query_interface:
  2: "decide_dora_ict_risk_protection_and_detection/2"          # eligibility: complete / status / incomplete verdict with citations
  7: "dora_ict_risk_protection_and_detection_checklist/2"       # justification: one cited item per duty
  13: "ict_risk_protection_and_detection_duties_complete/3"     # compliance_check: are all applicable duties performed
  16: "dora_ict_risk_protection_and_detection_what_if/4"        # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_016
  reason: The headings of Articles 9, 10 and 16 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the entities
    it lists), is formalised as the gate of every query (reading (2)). Not formalised:
    who those entities are, which the caller states, and the lead words of the second
    subparagraph, which introduce the duties of the simplified ICT risk management
    framework; those are the subject of the order on proportionality and the simplified
    framework.'
  consequence: simplified_framework_entity says only that Articles 9 and 10 do not
    apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: Art 16(1), second subparagraph, points (a) to (h), list the duties of the
    simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (reading (18)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of the Regulation is presupposed (reading (1)); the entity type atoms
    are those of the order on scope and entity types, which formalises Article 2 (readings
    (10), (11)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The principle of proportionality, also named
    in Art 9(3), is read as removing no duty (readings (4), (13)).
  consequence: No duty is removed for size (open question (Q13)).
- what: other_ict_risk_management_articles
  instrument: Regulation (EU) 2022/2554 Articles 5 to 8 and 11 to 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain. Articles 5 to 8 (governance, framework, systems,
    identification), 11 and 12 (response and recovery, backup), 13 (learning and evolving)
    and 14 and 15 (communication, harmonisation) are formalised, or to be formalised,
    in their own orders; Art 9(4) names the framework of Article 6(1) (reading (18)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q18)).
- what: incident_management_and_testing
  instrument: Regulation (EU) 2022/2554 Articles 17 and 25
  cites:
  - 32022R2554#art_017
  - 32022R2554#art_025
  reason: Not pinned in this domain. Art 10(1) names the incident management process
    of Article 17 and the testing of Article 25; the order reads only whether the
    mechanisms are in place and regularly tested (reading (9)).
  consequence: The order does not test the mechanisms against Articles 17 and 25 (open
    question (Q9)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order answers on the Regulation as it applies and reads no date (reading (12)).
  consequence: No answer depends on a date (open question (Q12)).
- what: ict_risk_management_technical_standards
  instrument: Commission Delegated Regulation (EU) 2024/1774 (the ICT risk management
    tools, methods, processes and policies and the simplified framework)
  cites:
  - 32024R1774#art_001
  reason: Not pinned in this domain. It specifies the elements of Articles 9 and 10
    in detail; the order reads them as part of the caller's judgement (reading (14)).
  consequence: The order does not check the detail of the technical standards (open
    question (Q14)).
