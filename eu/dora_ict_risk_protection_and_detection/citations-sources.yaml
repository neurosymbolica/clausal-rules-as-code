eu_reg_2022_2554_art_9_1:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(1), unit 32022R2554#parag_009.001. Anchors two duties: continuous monitoring
    and control of the security and functioning of ICT systems and tools (first limb),
    and deployment of appropriate ICT security tools, policies and procedures (second limb).
eu_reg_2022_2554_art_9_2:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(2), unit 32022R2554#parag_009.002. Anchors the duty to design, procure and
    implement ICT security policies, procedures, protocols and tools; 'in particular for
    those supporting critical or important functions' is read as emphasis, not a condition.
eu_reg_2022_2554_art_9_3:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(3), lead words, unit 32022R2554#parag_009.003. Anchors the duty to use ICT
    solutions and processes appropriate in accordance with Article 4 (the reference to
    Article 4 is part of the caller's judgement and removes no duty).
eu_reg_2022_2554_art_9_3_a:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(3)(a), unit 32022R2554#point_009.003_a. Security of the means of transfer of data.
eu_reg_2022_2554_art_9_3_b:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(3)(b), unit 32022R2554#point_009.003_b. Minimising corruption or loss of data,
    unauthorised access and technical flaws.
