eu_reg_2022_2554_art_9_4:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(4), unit 32022R2554#parag_009.004. The pinned unit joins to the lead words the
    two closing subparagraphs (for points (b) and (e)), each read as a duty of its own:
    network connection infrastructure that can be instantaneously severed or segmented,
    and an ICT change management process approved by appropriate lines of management with
    specific protocols. Also the eighth paragraph key cited by complete, incomplete and
    none_outstanding.
