eu_reg_2022_2554_art_9_3_d:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(3)(d), unit 32022R2554#point_009.003_d. Protection of data from data management
