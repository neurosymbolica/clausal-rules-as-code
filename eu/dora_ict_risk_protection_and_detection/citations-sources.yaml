eu_reg_2022_2554_art_10_1:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 10(1), unit 32022R2554#parag_010.001. Anchors three duties: anomaly detection
    mechanisms, mechanisms to identify material single points of failure (first
    subparagraph), and regular testing of all detection mechanisms (second subparagraph).
    How Articles 17 and 25 shape them is not read.
eu_reg_2022_2554_art_10_2:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 10(2), unit 32022R2554#parag_010.002. Detection mechanisms enable multiple layers
    of control, alert thresholds and criteria, and automatic alert mechanisms.
eu_reg_2022_2554_art_10_3:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 10(3), unit 32022R2554#parag_010.003. Sufficient resources and capabilities to
    monitor user activity, ICT anomalies and ICT-related incidents.
eu_reg_2022_2554_art_10_4:
  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 10(4), unit 32022R2554#parag_010.004. Trade report checking systems; applies only
    when dora_entity_type is data_reporting_service_provider; 'in addition' read as every
    other duty of Articles 9 and 10 as well.
