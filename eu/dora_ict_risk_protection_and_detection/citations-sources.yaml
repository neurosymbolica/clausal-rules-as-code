  status: verified
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
  retrieved: 2026-11-20
  note: >-
    Art 9(3)(c), unit 32022R2554#point_009.003_c. Preventing lack of availability,
