    execution of appropriate tests; the tests after 'such as' are examples
    (reading (10)).
eu_reg_2022_2554_art_25_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
    Art 25(2), unit 32022R2554#parag_025.002: central securities depositories and
    central counterparties perform vulnerability assessments before any
    deployment or redeployment; the type gate of duty
    vulnerability_assessments_before_deployment (reading (6)).
eu_reg_2022_2554_art_25_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
