eu_reg_2022_2554_art_24_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
    Art 24(1), unit 32022R2554#parag_024.001: financial entities, other than
    microenterprises, establish, maintain and review a sound and comprehensive
    testing programme (duty resilience_testing_programme). The words 'other
    than microenterprises' are the microenterprise gate of every Art 24 duty.
eu_reg_2022_2554_art_24_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
    Art 24(2), unit 32022R2554#parag_024.002: the programme includes a range of
    assessments, tests, methodologies, practices and tools (duty
    range_of_assessments_and_tests); Article 26 is not read (reading (11)).
eu_reg_2022_2554_art_24_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
    Art 24(3), unit 32022R2554#parag_024.003: the programme follows a risk-based
    approach (duty risk_based_testing_approach).
eu_reg_2022_2554_art_24_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
    Art 24(4), unit 32022R2554#parag_024.004: first sentence, tests undertaken by
    independent parties (duty independent_testers); second sentence, 'Where tests
    are undertaken by an internal tester', sufficient resources and no conflicts
    of interest (duty internal_tester_resources_and_conflicts_of_interest).
eu_reg_2022_2554_art_24_5:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
    Art 24(5), unit 32022R2554#parag_024.005: two duties, procedures and policies
    to prioritise, classify and remedy issues, and internal validation
    methodologies (reading (8)).
eu_reg_2022_2554_art_24_6:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554"
  retrieved: 2026-11-20
  note: >-
