  - 32022R2554#point_003_18
  - 32022R2554#point_003_20
  - 32022R2554#point_003_21
  - 32022R2554#point_003_22
  - 32022R2554#point_003_23
  - 32022R2554#point_003_24
  - 32022R2554#point_003_25
  - 32022R2554#point_003_26
  - 32022R2554#point_003_27
  - 32022R2554#point_003_28
  - 32022R2554#point_003_29
  - 32022R2554#point_003_30
  - 32022R2554#point_003_34
  - 32022R2554#point_003_53
  - 32022R2554#point_003_61
  - 32022R2554#point_003_62
  - 32022R2554#point_003_65
  reason: The other points of Article 3 define words that no limb of this order reads
    (for example digital operational resilience, ICT risk, ICT-related incident, ICT
    services, critical or important function, critical ICT third-party service provider,
    management body, small and non-interconnected investment firm, small institution
    for occupational retirement provision, Lead Overseer, public authority). Other
    DORA orders read some of them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: structural
- what: exclusion_lead_words
  units:
  - 32022R2554#parag_002.003
  reason: The lead words of Art 2(3) ('This Regulation does not apply to:') introduce
    points (a) to (f) and carry no rule of their own; each point is formalised in
    THE EXCLUSION TABLE and cited where it decides (readings (1), (6)).
  consequence: None for a caller; each out_of_scope answer of an exclusion cites the
    point of Art 2(3) that decides.
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: referenced_union_acts
  instrument: the Union acts Article 3 refers to for the types of Art 2(1) and the
    acts Art 2(3) names (Directives 2011/61/EU, 2009/138/EC, 2014/65/EU, 2013/36/EU,
    (EU) 2015/2366, 2009/110/EC, (EU) 2016/97, (EU) 2016/2341; Regulations (EU) No
    575/2013, No 648/2012, No 909/2014, No 600/2014, (EC) No 1060/2009, (EU) 2016/1011,
    (EU) 2020/1503, (EU) 2017/2402 and the Regulation on markets in crypto-assets)
  cites:
  - 32013L0036#art_002
  reason: Not pinned in this domain. The type and the exclusion facts are the caller's
    classification (readings (2), (6)).
  consequence: The answers take the type and the exclusion facts as given.
- what: nis2_article_4
  instrument: Directive (EU) 2022/2555 Article 4
  cites:
  - 32022L2555#art_004
  reason: Not pinned in this domain. How DORA relates to NIS2 as a sector-specific
    Union legal act is named for a lawyer (reading (11)).
  consequence: in_scope says nothing about the NIS2 duties of the entity (open question
    (Q5)).
- what: sme_recommendation
  instrument: Commission Recommendation 2003/361/EC
  cites:
  - 32003H0361#art_002
  reason: 'Not read: Art 2(3)(e) is read with the Regulation''s own size definitions,
    Article 3, points (60), (63) and (64) (reading (7)).'
  consequence: The caller states the size by the Regulation's definitions (open question
    (Q3)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order reads no date (reading (14)).
  consequence: No answer depends on a date (open question (Q11)).
