# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only the kit's formalize_lib and
# library(reif) / library(clpz), none of which is a backbone package.
uses: []

scope: >-
  Who is within the scope of Regulation (EU) 2022/2554 (the Digital Operational
  Resilience Act, DORA), and as which type of entity, from the original OJ text
  (32022R2554): Article 2(1) points (a) to (u), Article 2(2) (financial
  entities), the exclusions of Article 2(3) points (a) to (f) and the option of
  the Member States in the first sentence of Article 2(4), read with Article 3
  points (19), (32), (36), (39), (60), (63) and (64). For ONE entity of ONE type
  stated by the caller, dora_scope_decision/3 answers in_scope(TYPE) or
  out_of_scope, and dora_entity_category/3 answers financial_entity,
  ict_third_party_service_provider or out_of_scope, each with fixed citations;
  an absent key the answer needs gives indeterminate([KEY]) and a badly formed
  profile gives input_problems(PROBLEMS). Out of scope: whether an entity meets
  the definition of a type in the Union act Article 3 refers to (the caller's
  classification), the relation to Article 4 of Directive (EU) 2022/2555 (NIS2),
  the duties of an entity in scope, the notice and publication duties of
  Article 2(4), second and third sentences, and the date of application
  (Article 64). Every reading is the drafter's, not a lawyer's.

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), original text: Article 2(1) points (a) to (u), Article 2(2), Article 2(3) points (a) to (f), Article 2(4) first sentence"
  - "Regulation (EU) 2022/2554 (DORA), Article 3, points (19) ICT third-party service provider, (32) institution exempted pursuant to Directive 2013/36/EU, (36) payment institution exempted pursuant to Directive (EU) 2015/2366, (39) electronic money institution exempted pursuant to Directive 2009/110/EC, (60) microenterprise, (63) small enterprise, (64) medium-sized enterprise"

query_interface:
  2: "dora_scope_decision/3"                        # eligibility: in_scope(TYPE) / out_of_scope / statuses, cited
  7: "dora_scope_and_entity_types_checklist/2"      # justification: checklist items carry cite(...) provenance
  16: "dora_scope_and_entity_types_what_if/4"       # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: The heading of Article 2, and the heading of Article 3 with the words introducing
    the definitions, carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: member_state_notice_and_publication
  units:
  - 32022R2554#parag_002.004
  partial: true
  reason: 'Art 2(4), first sentence, the option of a Member State to exclude the institutions
    of Article 2(5), points (4) to (23), of Directive 2013/36/EU located in its territory,
    is formalised through exempted_from_dora_scope_by_member_state (reading (8)).
    Not formalised: the second sentence (the Member State informs the Commission of
    its use of the option and of later changes) and the third sentence (the Commission
    makes that information publicly available).'
  consequence: The answers take the exclusion as the caller states it; the order does
    not check the notice to the Commission or its publication.
  declaration: answered_with_caveat
  debt: true
  open: duties of the Member State and the Commission with no output for the entity;
    the deferral stands for this run.
- what: type_definitions_by_reference
  units:
  - 32022R2554#point_003_31
  - 32022R2554#point_003_33
  - 32022R2554#point_003_35
  - 32022R2554#point_003_37
  - 32022R2554#point_003_38
  - 32022R2554#point_003_40
  - 32022R2554#point_003_41
  - 32022R2554#point_003_42
  - 32022R2554#point_003_43
  - 32022R2554#point_003_44
  - 32022R2554#point_003_45
  - 32022R2554#point_003_46
  - 32022R2554#point_003_47
  - 32022R2554#point_003_48
  - 32022R2554#point_003_49
  - 32022R2554#point_003_50
  - 32022R2554#point_003_51
  - 32022R2554#point_003_52
  - 32022R2554#point_003_54
  - 32022R2554#point_003_55
  - 32022R2554#point_003_56
  - 32022R2554#point_003_57
  - 32022R2554#point_003_58
  - 32022R2554#point_003_59
  reason: These points of Article 3 define the types of Art 2(1) (credit institution,
    investment firm, payment institution, account information service provider, electronic
    money institution, central counterparty, trade repository, central securities
    depository, trading venue, manager of alternative investment funds, management
    company, data reporting service provider, insurance and reinsurance undertaking,
    the three kinds of insurance intermediary, institution for occupational retirement
    provision, credit rating agency, crypto-asset service provider, issuer of asset-referenced
    tokens, administrator of critical benchmarks, crowdfunding service provider and
    securitisation repository) by reference to other Union acts, which are not pinned
    here. Whether an entity meets one of them is the caller's classification, stated
    in dora_entity_type (reading (2)).
  consequence: The order takes the type as given; it does not test the definition
    in the act referred to.
  declaration: answered_with_caveat
  debt: true
  open: each definition needs its Union act pinned; the deferral stands for this run
    (open question (Q1)).
- what: definitions_this_order_does_not_read
  units:
  - 32022R2554#point_003_1
  - 32022R2554#point_003_2
  - 32022R2554#point_003_3
  - 32022R2554#point_003_4
  - 32022R2554#point_003_5
