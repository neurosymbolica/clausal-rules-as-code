# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only kit modules (formalize_lib,
# kit/query_combinators), no shared backbone package.
uses: []

scope: "For ONE financial entity: which of the twenty-three duties of Articles 25
  (testing of the ICT business continuity plans) and 26 (ICT response and recovery
  plans) of Commission Delegated Regulation (EU) 2024/1774 apply to it, whether it
  has performed all of them as the caller judges each, and which are outstanding;
  gated by Article 16(1), first subparagraph, of Regulation (EU) 2022/2554 (DORA),
  under which those articles do not bind the entities it lists (answered
  simplified_framework_entity). Conditions read: the microenterprise size class
  (Art 25(2)(c)), the entity type central counterparty or central securities
  depository (Art 25(3), 25(4)) and the use of ICT third-party service providers
  (Art 25(2)(b), 26(4)). Each duty is one caller judgement (true, false, unsure);
  an unsure judgement that decides is referred to a lawyer (needs_legal_review).
  Out of scope: whether the entity is a financial entity within DORA (Art 2, 3),
  DORA Article 11 itself, the other articles of the RTS, the simplified ICT risk
  management framework (DORA Art 16(1) second subparagraph, 16(2), 16(3); RTS
  Title III) and dates of application."

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 of 13 March 2024 supplementing Regulation (EU) 2022/2554 with regulatory technical standards specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework (CELEX 32024R1774, original OJ text), Articles 25 and 26"
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, original OJ text), Article 16(1), first subparagraph"

query_interface:
  2: "dora_rts_continuity_testing_and_recovery_eligibility/2"         # eligibility verdict with a cited checklist
  7: "dora_rts_continuity_testing_and_recovery_eligibility/2"         # justification: every checklist item carries cite(...)
  13: "dora_rts_continuity_testing_and_recovery_compliance_check/2"   # compliance_check: does the current state comply
  16: "dora_rts_continuity_testing_and_recovery_what_if/4"            # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_025
  - 32024R1774#art_026
  - 32022R2554#art_016
  reason: The headings of Articles 25 and 26 of the RTS and of Article 16 of DORA
    carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'Art 16(1), first subparagraph, of DORA (Articles 5 to 15 do not apply to
    the entities it lists) is formalised as the gate of every query (reading (2)).
    Not formalised: who those entities are, which the caller states, and the lead
    words of the second subparagraph, which introduce the duties of the simplified
    ICT risk management framework; those are the subject of the orders on proportionality
    and the simplified framework.'
  consequence: simplified_framework_entity says only that Articles 25 and 26 of the
    RTS do not apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the orders on proportionality and the simplified framework;
    the deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: Art 16(1), second subparagraph, points (a) to (h), of DORA list the duties
    of the simplified ICT risk management framework, among them business continuity
    plans (point (f)) and their testing (point (g)), and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the orders on proportionality and the simplified framework;
    the deferral stands for this order (reading (19)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: Art 16(3) of DORA gives the European Supervisory Authorities a mandate to
    draft regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); the entity type atoms are those
    of the order on scope and entity types, which formalises Article 2 (reading (7));
    the size class of Article 3(60) is the caller's statement (reading (6)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: dora_response_and_recovery
  instrument: Regulation (EU) 2022/2554 Article 11
  cites:
  - 32022R2554#art_011
  reason: Not pinned in this domain. Art 25(1), 25(2)(c) and 26(1) of the RTS name
    the plans and testing of DORA Article 11(3) and 11(6); whether the plans exist
    and are tested is formalised in the order on ICT risk response and recovery (reading
    (14)).
  consequence: complete and none_outstanding say nothing about DORA Article 11 (open
    question (Q14)).
- what: dora_communication
  instrument: Regulation (EU) 2022/2554 Article 14
  cites:
  - 32022R2554#art_014
  reason: Not pinned in this domain. Art 25(2)(d) of the RTS names the crisis communication
    plans; DORA Article 14 is formalised in its own order (reading (19)).
  consequence: The order does not test the crisis communication plans against Article
    14 (open question (Q19)).
- what: rts_general_and_other_title_ii_provisions
  instrument: Delegated Regulation (EU) 2024/1774 Articles 1 to 24
  cites:
