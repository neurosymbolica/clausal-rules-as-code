- what: rts_review_report
  instrument: Delegated Regulation (EU) 2024/1774 Article 27
  cites:
  - 32024R1774#art_027
  reason: Not pinned in this domain. The report on the review of the ICT risk management
    framework is formalised in its own order (reading (19)).
  consequence: complete and none_outstanding say nothing about that article (open
    question (Q19)).
- what: rts_simplified_framework
  instrument: Delegated Regulation (EU) 2024/1774 Title III (Articles 28 to 41)
  cites:
  - 32024R1774#art_028
  - 32024R1774#art_029
  - 32024R1774#art_030
  - 32024R1774#art_031
  - 32024R1774#art_032
