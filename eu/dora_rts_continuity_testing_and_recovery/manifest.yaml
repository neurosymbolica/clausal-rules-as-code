  - 32024R1774#art_038
  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. Title III of the RTS specifies the simplified
    ICT risk management framework of the entities of DORA Article 16(1), including
    their business continuity testing; its scope rule is not read, and the gate is
    read through DORA Art 16(1) alone (reading (2)).
  consequence: simplified_framework_entity gives none of the Title III duties (open
