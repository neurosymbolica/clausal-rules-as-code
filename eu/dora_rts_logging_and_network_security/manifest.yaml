    not read (readings (13), (18)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q18)).
- what: dora_ict_risk_management_articles
  instrument: Regulation (EU) 2022/2554 Articles 5 to 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain. DORA Articles 5 to 15 are formalised in the DORA
    orders on ICT risk management; Art 13(a)(ii) and the closing subparagraph of Article
    13 name the classification of DORA Article 8(1), which is not read (reading (13)).
  consequence: The order does not check the classification it names (open question
    (Q13)).
- what: european_standardisation
  instrument: Regulation (EU) No 1025/2012 Article 2
  cites:
  - 32012R1025#art_002
  reason: Not pinned in this domain. Art 13(k) names the standards defined in Article
    2, point (1), of that Regulation; they are part of the caller's judgement (readings
    (12), (13)).
  consequence: The order does not check which standards apply (open question (Q11)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64 and Delegated Regulation (EU) 2024/1774
    Article 42
  cites:
  - 32022R2554#art_064
  - 32024R1774#art_042
  reason: Not pinned in this domain. The order answers on the technical standards
    as they apply and reads no date (reading (15)).
  consequence: No answer depends on a date (open question (Q15)).
