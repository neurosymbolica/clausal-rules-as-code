# modules, no shared backbone package.
uses: []

scope: "For ONE financial entity within the scope of DORA (presupposed, not decided):
  which of the duties on logging (Article 12), network security management (Article 13)
  and securing information in transit (Article 14) of Commission Delegated Regulation
  (EU) 2024/1774 apply to it, whether it has performed all of them, and which are outstanding,
  with the rule of Regulation (EU) 2022/2554 (DORA) Article 16(1), first subparagraph,
  that Articles 5 to 15 of DORA do not apply to the entities it lists (answered
  simplified_framework_entity). Each duty is the caller's judgement (true, false or
  unsure); an unsure judgement that decides goes to a lawyer as needs_legal_review.
  Out of scope: the simplified ICT risk management framework of DORA Article 16(1),
  second subparagraph, (2) and (3) (deferred); the other articles of the technical
  standards, DORA Articles 2 to 15, the proportionality principle, the standards of
  Regulation (EU) No 1025/2012 and the dates of application (excluded; sibling orders)."

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 of 13 March 2024 supplementing Regulation (EU) 2022/2554 with regard to regulatory technical standards specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework (CELEX 32024R1774, base act as published), Article 12 (logging), Article 13 (network security management), Article 14 (securing information in transit)"
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), Article 16(1), first subparagraph"

query_interface:
  2: "dora_rts_logging_and_network_security_status/2"        # eligibility/status verdict over the completeness query
  7: "dora_rts_logging_and_network_security_checklist/2"     # justification: one cited item per duty
  13: "rts_logging_and_network_security_duties_complete/3"   # compliance_check: are the obligations performed
  16: "dora_rts_logging_and_network_security_what_if/4"      # what_if: re-evaluate under one changed key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_012
  - 32024R1774#art_014
  - 32022R2554#art_016
  reason: The headings of Articles 12 and 14 of the technical standards and of Article
    16 of DORA carry no rule of their own. The heading of Article 13 is part of the
    article unit that holds its lead words and is quoted with it.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the
    entities it lists), is formalised as the gate of every query (reading (2)). Not
    formalised: who those entities are, which the caller states, and the lead words
    of the second subparagraph, which introduce the duties of the simplified ICT risk
    management framework; those are the subject of the orders on the simplified framework.'
  consequence: simplified_framework_entity says only that Articles 12 to 14 of the
    technical standards do not apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the orders on the simplified framework; the deferral stands
    for this order (open question (Q1)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the orders on the simplified framework; the deferral stands
    for this order (reading (18)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); the definitions of microenterprise
    (Article 3(60)) and of critical or important function (Article 3(22)) are applied
    by the caller (readings (7), (8)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q5)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4 and Delegated Regulation (EU) 2024/1774
    Article 1
  cites:
  - 32022R2554#art_004
  - 32024R1774#art_001
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (14)).
  consequence: No duty is removed for size beyond Art 16(1) and Art 13(i) (open question
    (Q14)).
- what: other_articles_of_the_technical_standards
  instrument: Delegated Regulation (EU) 2024/1774 Articles 1 to 11 and 15 to 41
  cites:
  - 32024R1774#art_001
