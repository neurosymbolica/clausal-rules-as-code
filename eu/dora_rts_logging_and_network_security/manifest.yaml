  - 32024R1774#art_038
  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. The other articles of the technical standards
    are formalised, or to be formalised, in their own orders; Art 12(2)(b) names Article
