# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only the kit (formalize_lib,
# kit/deadline_lib) and library modules, no shared backbone package.
uses: []

scope: >-
  The oversight framework of Articles 32 to 35 of Regulation (EU) 2022/2554 (DORA)
  for ONE ICT third-party service provider designated as critical (THE PROVIDER):
  the duties those Articles place on THE PROVIDER (Art 35(1), point (d), closing
  words; Art 35(5)); the powers the Lead Overseer has in respect of it (Art 35(1),
  points (a) to (d) and (d)(iv)); whether its two windows to answer the Lead
  Overseer are open (Art 33(4), fourth sentence; Art 35(3), second sentence); when
  the ground for a periodic penalty payment is met (Art 35(6)); the outer period and
  the daily ceiling of such a payment (Art 35(7); Art 35(8), first sentence); and
  when competent authorities need the Lead Overseer's agreement for a measure
  concerning THE PROVIDER (Art 33(5)). The designation itself (Art 31) is the
  caller's statement in the key of the order eu/dora-ctpp-designation. Out of scope
  (see the deferred and excluded sets): the Oversight Forum, the Lead Overseer's
  assessment, plan adoption and procedure, the JON, the areas of recommendation of
  point (d)(i) to (iii), the amount within the ceiling and its criteria, enforcement,
  disclosure and the right to be heard, NIS2, Articles 36 to 44 and the financial
  entities' own duties. The order reads Articles 32 to 35 as placing no duty on a
  financial entity. Every reading is the drafter's, not a lawyer's.

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), original OJ text, Articles 32 to 35; formalised: Art 33(4) third and fourth sentences, Art 33(5), Art 35(1) lead words and points (a) to (d) with point (d)(iv) and the closing words of point (d), Art 35(3) second sentence, Art 35(5), Art 35(6), Art 35(7) and Art 35(8) first sentence; pin folder eu/dora_ctpp_oversight/sources/"

query_interface:
  2: "dora_ctpp_oversight_status/2"          # eligibility: is THE PROVIDER under the oversight framework
  7: "dora_ctpp_oversight_checklist/2"       # justification: one cited item per order query
  15: "ctpp_response_window_status/3"        # deadline: the last day of THE PROVIDER's response window
  16: "dora_ctpp_oversight_what_if/4"        # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_032
  - 32022R2554#art_033
  - 32022R2554#art_034
  - 32022R2554#art_035
  reason: The headings of Articles 32 to 35 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: oversight_forum
  units:
  - 32022R2554#parag_032.001
  - 32022R2554#parag_032.002
  - 32022R2554#parag_032.003
  - 32022R2554#parag_032.004
  - 32022R2554#point_032.004_a
  - 32022R2554#point_032.004_b
  - 32022R2554#point_032.004_c
  - 32022R2554#point_032.004_d
  - 32022R2554#point_032.004_e
  - 32022R2554#parag_032.005
  - 32022R2554#parag_032.006
  - 32022R2554#parag_032.007
  - 32022R2554#parag_032.009
  reason: 'Art 32(1) to (7) and (9): the Oversight Forum, its tasks, its yearly collective
    assessment, its benchmarks, its composition (points (a) to (e) of paragraph 4,
    including an observer of the NIS2 authorities where a critical provider is an
    essential or important entity under Directive (EU) 2022/2555), the designation
    of the high-level representatives, the independent experts, the ESAs'' guidelines
    and their yearly report. They address the Joint Committee, the Oversight Forum,
    the Member States and the ESAs.'
  consequence: No answer says who sits on the Oversight Forum or what it assesses.
    Art 32(2) is quoted for reading (11) only.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: without_prejudice_nis2
  units:
  - 32022R2554#parag_032.008
  reason: 'Art 32(8): the Section is without prejudice to Directive (EU) 2022/2555
    and to other Union rules on oversight of cloud computing providers. It sets no
    rule on facts; reading (12) says that no answer here is a NIS2 answer.'
  consequence: A provider that is also a NIS2 entity has its NIS2 duties elsewhere
    (open question (Q16)).
  declaration: answered_with_caveat
  not_formalized_because: structural
- what: lead_overseer_assessment
  units:
  - 32022R2554#parag_033.001
  - 32022R2554#parag_033.002
  - 32022R2554#parag_033.003
  - 32022R2554#point_033.003_a
  - 32022R2554#point_033.003_b
  - 32022R2554#point_033.003_c
  - 32022R2554#point_033.003_d
  - 32022R2554#point_033.003_e
  - 32022R2554#point_033.003_f
  - 32022R2554#point_033.003_g
  - 32022R2554#point_033.003_h
  - 32022R2554#point_033.003_i
  reason: 'Art 33(1) to (3): the Lead Overseer conducts the oversight and is the primary
    point of contact; it assesses whether each critical provider has comprehensive,
    sound and effective rules, procedures, mechanisms and arrangements to manage the
    ICT risk it may pose, focusing on ICT services supporting critical or important
    functions, and the assessment covers the areas of points (a) to (i). These are
    the Lead Overseer''s assessment; Art 35(1), point (d), refers to these areas,
    and the order lists that power without them (reading (3)).'
  consequence: No answer assesses THE PROVIDER's arrangements. Art 33(2) and (3) are
    quoted for readings (3) and (11) only.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: oversight_plan_adoption
  units:
  - 32022R2554#parag_033.004
  partial: true
  reason: 'Art 33(4), third and fourth sentences (the draft oversight plan is communicated
    to THE PROVIDER, which may submit a reasoned statement within 15 calendar days
    of its receipt), are formalised (reading (6)). Not formalised here: the adoption
    of the individual oversight plan on the basis of the assessment and in coordination
    with the JON, its content (the annual oversight objectives and main oversight
    actions) and its yearly communication.'
  consequence: No answer says what the oversight plan contains or when it is adopted.
  declaration: answered_with_caveat
  debt: true
  open: the Lead Overseer's adoption of the plan is an authority-side step; a later
    order on oversight procedure (Articles 36 to 44, not pinned here).
- what: joint_oversight_network
  units:
  - 32022R2554#parag_034.001
  - 32022R2554#parag_034.002
  - 32022R2554#parag_034.003
  reason: 'Art 34: the three Lead Overseers set up the JON, draw up and revise a common
    oversight protocol, and may call on the ECB and ENISA. These address the Lead
    Overseers.'
  consequence: No answer says how the Lead Overseers coordinate.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: recommendation_areas
  units:
  - 32022R2554#point_035.001_d_i
  - 32022R2554#point_035.001_d_ii
  - 32022R2554#point_035.001_d_iii
  reason: 'Art 35(1), point (d)(i) to (iii): the areas of recommendation (ICT security
    and quality requirements, conditions and terms of the services, planned subcontracting),
    each resting on what the Lead Overseer deems relevant or deems to trigger risks.
    They are the Lead Overseer''s assessment; point (d) is listed as issue_recommendations
    without them (reading (3)). All three are quoted for readings (3) and (4) only.'
  consequence: No answer says what a recommendation should contain.
  declaration: answered_with_caveat
  not_formalized_because: institutional
- what: exercise_of_powers
  units:
  - 32022R2554#parag_035.002
  - 32022R2554#point_035.002_a
  - 32022R2554#point_035.002_b
  - 32022R2554#point_035.002_c
  - 32022R2554#parag_035.004
  reason: Art 35(2) (regular coordination within the JON, due account of the NIS2
    framework and consultation of the NIS2 authorities, minimising disruption to customers
    outside the scope of the Regulation) and Art 35(4) (the Lead Overseer informs
    the JON of the outcome of points (a) and (b) and transmits the reports of point
    (c) to the JON and to the competent authorities of the financial entities using
    THE PROVIDER). They address the Lead Overseer. Art 35(2) is quoted for reading
    (3) only, and Art 35(4) for reading (11) only.
  consequence: No answer says how the Lead Overseer must use its powers or to whom
    it reports; the reports reaching the competent authorities of the financial entities
    is not formalised (SCOPE).
  declaration: not_an_exception
  not_formalized_because: institutional
- what: consultation_before_powers
  units:
  - 32022R2554#parag_035.003
  partial: true
  reason: 'Art 35(3), second sentence (THE PROVIDER''s opportunity to provide information
    within 30 calendar days before recommendations), is formalised (reading (6)).
    Not formalised here: its first sentence, the Lead Overseer''s consultation of
    the Oversight Forum before exercising the powers of Art 35(1).'
  consequence: No answer says whether the Oversight Forum has been consulted.
  declaration: answered_with_caveat
  debt: true
  open: an authority-side step of the Lead Overseer, for a later order on oversight
    procedure.
- what: penalty_amount_within_ceiling
  units:
  - 32022R2554#parag_035.008
  partial: true
  reason: 'Art 35(8), first sentence (the ceiling of 1 % of the average daily worldwide
    turnover of the preceding business year), is formalised (reading (10)). Not formalised
    here: the date stipulated in the decision from which the amount is calculated,
    the criteria the Lead Overseer takes into account when determining the amount
    (points (a) to (c)), and its consultation within the JON.'
  consequence: The answer gives the ceiling only, never the amount the Lead Overseer
    sets.
  declaration: answered_with_caveat
  debt: true
  open: the amount within the ceiling is the Lead Overseer's decision; open question
    (Q6).
- what: penalty_amount_criteria
  units:
  - 32022R2554#point_035.008_a
  - 32022R2554#point_035.008_b
  - 32022R2554#point_035.008_c
  reason: 'Art 35(8), points (a) to (c): the gravity and duration of non-compliance,
    intent or negligence, and THE PROVIDER''s cooperation, which the Lead Overseer
    takes into account when determining the amount.'
  consequence: No answer weighs these criteria. They are quoted for reading (10) only.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: penalty_enforcement_and_procedure
  units:
  - 32022R2554#parag_035.009
  - 32022R2554#parag_035.010
  - 32022R2554#parag_035.011
  reason: Art 35(9) (penalty payments are administrative and enforceable under the
    civil procedure of the Member State of the inspection; the amounts go to the Union
    budget), Art 35(10) (the Lead Overseer discloses every periodic penalty payment
    unless disclosure would seriously jeopardise the financial markets or cause disproportionate
    damage) and Art 35(11) (the right to be heard, the rights of the defence and access
    to the file; quoted for reading (8)). They govern the authorities' procedure and
    enforcement.
  consequence: penalty_decision_required says only that the ground of Art 35(6) is
    met (open question (Q8)).
  declaration: answered_with_caveat
  not_formalized_because: institutional

excluded_set:
- what: designation
  instrument: Regulation (EU) 2022/2554 Article 31
  cites:
  - 32022R2554#art_031
  reason: Not pinned in this domain. The designation of critical providers and the
    appointment of the Lead Overseer are formalised in the order eu/dora-ctpp-designation,
    whose key provider_designated_as_critical this order reuses by name (reading (1)).
  consequence: The answers take the designation as the caller states it (open question
    (Q14)).
- what: oversight_procedure_and_follow_up
  instrument: Regulation (EU) 2022/2554 Articles 36 to 44
  cites:
  - 32022R2554#art_036
  - 32022R2554#art_037
  - 32022R2554#art_038
  - 32022R2554#art_039
  - 32022R2554#art_040
  - 32022R2554#art_041
  - 32022R2554#art_042
  reason: 'Not pinned in this domain: oversight outside the Union (36), requests for
    information (37), general investigations (38), inspections (39), ongoing oversight
    (40), harmonisation of conditions, including the template of Art 41(1)(b) (41),
    follow-up by competent authorities, which carries the consequences for the financial
    entities using a critical provider (42), oversight fees (43) and international
    cooperation (44).'
  consequence: No answer says what a financial entity must do about a recommendation
    or a critical provider's non-compliance (SCOPE).
- what: entity_duties_on_ict_third_party_risk
  instrument: Regulation (EU) 2022/2554 Articles 28 to 30
  cites:
  - 32022R2554#art_028
  - 32022R2554#art_029
  - 32022R2554#art_030
  reason: Not pinned in this domain. The financial entities' own duties on ICT third-party
    risk are formalised in eu/dora-ict-third-party-entity-duties and the order on
    contractual provisions.
  consequence: 'None for these answers: the order reads Articles 32 to 35 as placing
    no duty on a financial entity (reading (11)).'
- what: referenced_union_acts
  instrument: Directive (EU) 2022/2555; Regulations (EU) No 1093/2010, 1094/2010 and
    1095/2010; Regulation (EEC, Euratom) No 1182/71; Regulation (EU) 2022/2554 Article
    46
  cites:
  - 32022L2555#art_001
  - 32010R1093#art_001
  - 31971R1182#art_003
  reason: 'Not pinned in this domain. NIS2 (reading (12)), the ESAs'' founding Regulations,
    the general rules on periods, dates and time limits (readings (6), (7), (9): their
    counting is named as a lawyer question, not relied on) and the competent authorities
    of Article 46.'
  consequence: The counting of periods is the order's own reading of the pinned words
    (open questions (Q3), (Q4), (Q5)).
