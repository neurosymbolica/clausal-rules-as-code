  # (dora_ctpp_oversight_input_problems/2 is re-exported by queries.clausal)
  # -- citations.clausal --
  - "citation/2"
  # -- dora_ctpp_oversight.clausal --
  - "ctpp_oversight_duties_required/3"
  - "ctpp_lead_overseer_powers/3"
  - "ctpp_response_window_status/3"
  - "ctpp_periodic_penalty_payment_status/3"
  - "ctpp_periodic_penalty_payment_limits/3"
  - "ctpp_competent_authority_measure_condition/3"
  - "decide_dora_ctpp_oversight/2"
  - "dora_ctpp_oversight_status/2"
  - "dora_ctpp_oversight_checklist/2"
  - "dora_ctpp_oversight_decision_resolvable/1"
  - "dora_ctpp_oversight_status_values/1"
  # -- queries.clausal --
  - "dora_ctpp_oversight_profile_keys/1"
