# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only kit modules (formalize_lib,
# kit/query_combinators) and library(reif), none a shared backbone package.
uses: []

scope: >-
  The duties that Articles 1 to 3 of Commission Delegated Regulation (EU)
  2024/1774 (the RTS on ICT risk management tools, methods, processes and
  policies) place on ONE financial entity: taking its size, overall risk
  profile and complexity into account (Article 1, for Title II only), the
  general elements of its ICT security policies, procedures, protocols and
  tools (Article 2(1) and 2(2)) and its ICT risk management policies and
  procedures (Article 3, both paragraphs): twenty-seven duties, each a caller
  judgement (true, false or unsure), behind the gate of DORA Article 16(1),
  first subparagraph (an entity listed there applies the simplified framework
  of Title III instead, answered as simplified_framework_entity). Three
  queries: which duties are required, whether all are performed, and which are
  outstanding. An unsure judgement is handed to a lawyer (needs_legal_review,
  open_textured); no crisp test is invented. Out of scope: whether the entity
  is a financial entity within DORA (presupposed), the other articles of the
  RTS (Articles 4 to 42), the simplified framework and the qualification of the
  entities of DORA Article 16(1), the duties of DORA itself, and any date.
  Every reading is the drafter's, not a lawyer's.

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 of 13 March 2024 supplementing Regulation (EU) 2022/2554 with regulatory technical standards specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework, OJ L, 2024/1774, 25.6.2024 (CELEX 32024R1774), Articles 1, 2(1), 2(2) and 3, original OJ text as published"
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), Article 16(1), first subparagraph (the gate), original OJ text as published"

query_interface:
  2: "dora_rts_policies_and_risk_management_status/2"            # eligibility: the verdict of the complete query
  7: "dora_rts_policies_and_risk_management_checklist/2"         # justification: one cited item per duty
  13: "dora_rts_policies_and_risk_management_compliance_check/4" # compliance_check: may the entity certify a duty or all duties
  16: "dora_rts_policies_and_risk_management_what_if/4"          # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_002
  - 32022R2554#art_016
  reason: The heading of Article 2 of the RTS and the heading of Article 16 of DORA
    carry no rule of their own (the headings of Articles 1 and 3 of the RTS share
    a pinned unit with their lead words and are quoted with them).
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 of DORA do not apply
    to the entities it lists), is formalised as the gate of every query (reading (2)).
    Not formalised: who those entities are, which the caller states, and the lead
    words of the second subparagraph, which introduce the duties of the simplified
    ICT risk management framework; those are the subject of the order on proportionality
    and the simplified framework and of the order on Title III of the RTS.'
  consequence: simplified_framework_entity says only that Articles 1 to 3 of the RTS,
    as Title II provisions, do not apply; it gives none of the duties the entity has
    instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (reading (11)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)). The order on scope and entity
    types formalises Article 2.
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (13)).
  consequence: No duty is removed for size (open question (Q11)).
- what: dora_ict_risk_management_articles
  instrument: Regulation (EU) 2022/2554 Articles 5 to 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain. DORA Article 6(5) (the review named in Art 2(2)(j)),
    Article 6(8) (the strategy and the risk tolerance named in Art 2(2)(a) and Art
    3, point (a)) and Article 9(2) (the policies named in Art 2(1)) are formalised,
    or to be formalised, in their own orders, as are the rest of Articles 5 to 15
    (readings (10), (11)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q9)).
