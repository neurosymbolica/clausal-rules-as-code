# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports only kit modules (formalize_lib,
# kit/query_combinators), no shared backbone package.
uses: []

scope: "Article 45 of Regulation (EU) 2022/2554 (DORA), information-sharing arrangements on cyber threat information and intelligence. Decided here: (1) information_sharing_within_article_45 -- whether an exchange is one that Article 45(1), points (a) to (c), read with Article 45(2) as part of point (c), covers (all five conditions required; a false condition decides alone; an absent condition is named before an unsure one is referred); sharing_outside_article_45 means only not covered, never forbidden. (2) membership_notification_duty -- which notification Article 45(3) requires on validation of membership or once its cessation takes effect. Out of scope (handed to the caller or a lawyer): who is a financial entity (presupposed), what a cyber threat is, which authority is competent, the time for notifying, and whether rules of conduct respect Regulation (EU) 2016/679 and competition guidelines; every unsure judgement is referred as needs_legal_review, never decided."

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council on digital operational resilience for the financial sector (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, original OJ text): Article 45(1), lead words and points (a), (b) and (c); Article 45(2); Article 45(3)."

query_interface:
  2: "dora_information_sharing_arrangements_status/2"      # eligibility: covered / not covered by Art 45(1), or a status compound
  7: "dora_information_sharing_arrangements_checklist/2"   # justification: one cited item per condition of Art 45(1) and (2)
  16: "dora_information_sharing_arrangements_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: heading
  units:
  - 32022R2554#art_045
  reason: The heading of Article 45 carries no rule of its own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: 'Not pinned in this domain. The order does not answer who is a financial
    entity or what a cyber threat is; neither is formalised in this order, which quotes
    and relies on no text of the instrument named: the entity is presupposed to be
    a financial entity, and whether information is cyber threat information and intelligence
    is the caller''s judgement.'
  consequence: The answers presuppose a financial entity (open questions (Q6), (Q7)).
- what: competent_authorities
  instrument: Regulation (EU) 2022/2554 Article 46
  cites:
  - 32022R2554#art_046
  reason: Not pinned in this domain. The order does not answer which authority is
    the competent authority to be notified under Article 45(3); this is not formalised
    in this order, which quotes and relies on no text of the instrument named.
  consequence: membership_notification_duty says which notification is due, not to
    which authority.
- what: data_protection_and_competition_guidelines
  instrument: Regulation (EU) 2016/679 (GDPR)
  cites:
  - 32016R0679#art_005
  reason: 'Not pinned in this domain. The quoted Article 45(1)(c) names Regulation
    (EU) 2016/679 and guidelines on competition policy. Neither is formalised in this
    order, which quotes and relies on no text of either: whether the rules of conduct
    respect them is inside the caller''s judgement on point (c). The guidelines on
    competition policy have no pinnable instrument in this order''s pin, so this row
    cites Regulation (EU) 2016/679 only.'
  consequence: The answers take the respect of data protection law and competition
    guidelines as the caller's judgement (open question (Q7)).
