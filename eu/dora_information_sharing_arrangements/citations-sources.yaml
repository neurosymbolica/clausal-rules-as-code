eu_reg_2022_2554_art_45_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554"
  retrieved: 2026-11-23
  note: >-
    Art 45(1), lead words (unit 32022R2554#parag_045.001). The permission
    ('may exchange') and the condition that the information is cyber threat
    information and intelligence; the examples after 'including' are read
    inside that judgement. 'to the extent that' introduces points (a) to (c),
    read as cumulative (Q1).
eu_reg_2022_2554_art_45_1_a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554"
  retrieved: 2026-11-23
  note: >-
    Art 45(1)(a) (unit 32022R2554#point_045.001_a). The sharing aims to enhance
    the digital operational resilience of financial entities; the ways after
    'in particular' are emphasis inside the judgement, not further conditions.
eu_reg_2022_2554_art_45_1_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554"
  retrieved: 2026-11-23
  note: >-
    Art 45(1)(b) (unit 32022R2554#point_045.001_b). The sharing takes place
    within trusted communities of financial entities (the OJ text reads
    'takes places', reproduced as published).
eu_reg_2022_2554_art_45_1_c:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554"
  retrieved: 2026-11-23
  note: >-
    Art 45(1)(c) (unit 32022R2554#point_045.001_c). One judgement: the
    arrangement protects the sensitive information AND is governed by rules
    of conduct respecting business confidentiality, Regulation (EU) 2016/679
    and competition guidelines (those instruments are not formalised; Q7).
eu_reg_2022_2554_art_45_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554"
  retrieved: 2026-11-23
  note: >-
    Art 45(2) (unit 32022R2554#parag_045.002). Stated 'for the purpose of
    paragraph 1, point (c)', so read as part of condition (c) (Q2); 'where
    appropriate' is inside the judgement.
eu_reg_2022_2554_art_45_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554"
  retrieved: 2026-11-23
  note: >-
    Art 45(3) (unit 32022R2554#parag_045.003). The duty to notify participation
    upon validation of membership, or the cessation of membership once it
    takes effect. No time limit is read (Q8); the competent authority is not
    modelled.
