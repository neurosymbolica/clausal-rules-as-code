# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: no shared backbone package is imported (only the
# kit's formalize_lib, which is not a backbone package).
uses: []

scope: >-
  Article 4(1), first sentence, and Article 4(2) with points (a) and (b) of
  Directive (EU) 2022/2555 (NIS 2), read with Article 1(2) of Regulation (EU)
  2022/2554 (DORA), for a financial entity presupposed to be within DORA (open
  question Q5). Two questions are answered, one per group of requirements:
  nis2_risk_management_provisions_status (point (a) test) and
  nis2_incident_notification_provisions_status (point (b) test, both of its
  conditions), each giving nis2_provisions_disapplied, nis2_provisions_apply or
  out_of_scope, or a status (indeterminate, needs_legal_review, input_problems).
  The entity class (essential, important, out of scope) is a caller key; whether
  DORA's requirements are at least equivalent in effect is the caller's judgement,
  and an unsure judgement that decides is referred to a lawyer as open-textured.
  Out of scope: who is a financial entity and DORA's scope, the entity's class
  under Articles 2 and 3 of the Directive, the content of Articles 21 and 23 and
  Chapter VII, Article 4(1) second sentence, Article 4(3) guidelines, Articles 6
  and 25 of the Directive and DORA Article 1 except paragraph 2. Every reading is
  the drafter's, not a lawyer's.

sources:
  - "Directive (EU) 2022/2555 (NIS 2 Directive), OJ L 333, 27.12.2022, p. 80 (CELEX 32022L2555): Article 4(1), first sentence; Article 4(2), lead words and points (a) and (b); Article 4(3), Articles 6 and 25 pinned and deferred"
  - "Regulation (EU) 2022/2554 (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554): Article 1(2); the rest of Article 1 pinned and deferred"

query_interface:
  2: "nis2_lex_specialis_and_definitions_status/2"      # eligibility/status verdict over both groups
  7: "nis2_lex_specialis_and_definitions_checklist/2"   # justification: one item per group with its cite(...) list
  16: "nis2_lex_specialis_and_definitions_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022L2555#art_004
  - 32022L2555#art_025
  reason: The headings of Articles 4 and 25 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: entities_not_covered_by_the_sector_specific_act
  units:
  - 32022L2555#parag_004.001
  partial: true
  debt: true
  reason: Article 4(1) is quoted and its first sentence is formalised. Its second
    sentence (the relevant provisions continue to apply to entities of the sector
    that the sector-specific Union legal act does not cover) never decides an answer
    here, because the order presupposes a financial entity to which DORA applies;
    it is not formalised.
  consequence: The order does not answer for an entity that DORA does not cover; such
    an entity keeps the Directive's provisions under the quoted second sentence (open
    question (Q5)).
- what: commission_guidelines
  units:
  - 32022L2555#parag_004.003
  reason: Article 4(3) binds the Commission to provide and review guidelines on the
    application of Article 4(1) and (2); it gives no rule on facts about an entity.
  consequence: None for a caller; the guidelines are not read, and a caller's judgements
    on equivalence may rest on them (open question (Q7)).
  declaration: not_an_exception
  not_formalized_because: institutional
