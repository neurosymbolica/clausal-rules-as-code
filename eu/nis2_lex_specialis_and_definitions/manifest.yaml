  reason: 'Article 6 gives the definitions for the whole Directive. No answer of this
    order turns on any of them: the terms Article 4 uses are not defined there, or
    sit inside the caller''s judgements. An order that reads a defined term takes
    it as a caller key.'
  consequence: None for a caller of this order.
  declaration: not_an_exception
  not_formalized_because: structural
- what: standardisation
  units:
  - 32022L2555#parag_025.001
  - 32022L2555#parag_025.002
  reason: Article 25 binds the Member States to encourage the use of European and
    international standards and technical specifications, and ENISA to draw up advice
    and guidelines; it gives no rule on facts about an entity.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: dora_article_1_other_than_paragraph_2
  units:
  - 32022R2554#art_001
  - 32022R2554#parag_001.001
  - 32022R2554#point_001.001_a
  - 32022R2554#point_001.001_a_i
  - 32022R2554#point_001.001_a_ii
  - 32022R2554#point_001.001_a_iii
  - 32022R2554#point_001.001_a_iv
  - 32022R2554#point_001.001_a_v
  - 32022R2554#point_001.001_a_vi
  - 32022R2554#point_001.001_b
  - 32022R2554#point_001.001_c
  - 32022R2554#point_001.001_d
  - 32022R2554#parag_001.003
  reason: Of Article 1 of DORA the order relies on paragraph 2 only. The heading,
    paragraph 1 with its points (the subject matter of DORA) and paragraph 3 (the
    responsibility of the Member States for essential State functions) carry no rule
    this order applies, and the order says nothing about what they or any other provision
    of DORA require.
  consequence: 'None for a caller: whether DORA''s requirements are at least equivalent
    in effect is the caller''s judgement.'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: scope_and_class
  instrument: Directive (EU) 2022/2555 Articles 2 and 3
  cites:
  - 32022L2555#art_002
  - 32022L2555#art_003
  reason: Not pinned in this domain. The order does not decide whether the Directive
    applies to the entity or its class; that is decided in the order nis2-scope-entity-class,
    whose answer the caller gives as the key entity_class. The order quotes and relies
    on no text of the instrument named.
  consequence: The answers take the entity's class as given.
- what: dora_scope
  instrument: Regulation (EU) 2022/2554 Article 2
  cites:
  - 32022R2554#art_002
  reason: Not pinned in this domain. The order does not decide whether the entity
    is a financial entity or whether DORA applies to it; that is presupposed. The
    order quotes and relies on no text of the instrument named.
  consequence: The answers presuppose a financial entity to which DORA applies (open
    question (Q5)).
- what: provisions_compared
  instrument: Directive (EU) 2022/2555 Articles 21 and 23 and Chapter VII
  cites:
  - 32022L2555#art_021
  - 32022L2555#art_023
  reason: 'Not pinned in this domain. The quoted Article 4 names Article 21(1) and
    (2), Article 23(1) to (6) and Chapter VII. The order does not formalise them and
    relies on no text of them: the comparison with DORA is inside the caller''s judgements,
    and the answers name the group of provisions, not the articles.'
  consequence: The answers do not list the articles that cease to apply (open question
    (Q3)).
