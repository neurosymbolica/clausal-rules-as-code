# Citation sourcing manifest for eu/nis2_lex_specialis_and_definitions.
# Instruments: Directive (EU) 2022/2555 (NIS 2 Directive), CELEX 32022L2555,
#   OJ L 333, 27.12.2022, p. 80; Regulation (EU) 2022/2554 (DORA),
#   CELEX 32022R2554, OJ L 333, 27.12.2022, p. 1. Source of record: the
#   original OJ texts as published, pinned in sources/.
# status: verified (verbatim is an exact substring of the fetched source at url)
#         | unverified (no verbatim yet)
# retrieved: 2026-11-23
eu_dir_2022_2555_art_4_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-23
  note: >-
    Art 4(1), first sentence [32022L2555#parag_004.001]: where a sector-specific
    Union act's risk-management or notification requirements are at least
    equivalent in effect, the relevant provisions of the Directive, Chapter VII
    supervision and enforcement included, shall not apply. Anchors the
    nis2_provisions_disapplied answer. The second sentence is quoted, not
    formalised (deferred).
eu_dir_2022_2555_art_4_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-23
  note: >-
    Art 4(2), lead words [32022L2555#parag_004.002]: the requirements are
    considered equivalent in effect where point (a) or point (b) is met; read
    as one test per group (reading (3), Q1).
eu_dir_2022_2555_art_4_2_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-23
  note: >-
    Art 4(2)(a) [32022L2555#point_004.002_a]: the test for the risk-management
    group; anchors the judgement
    dora_risk_management_measures_at_least_equivalent_in_effect and its
    open_textured referral.
eu_dir_2022_2555_art_4_2_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-23
  note: >-
    Art 4(2)(b) [32022L2555#point_004.002_b]: the test for the notification
    group, two conditions joined by 'and where' (immediate access; notification
    requirements at least equivalent in effect to Art 23(1) to (6)); anchors
    both notification judgements and their referrals.
eu_reg_2022_2554_art_1_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2022/2554/oj"
  retrieved: 2026-11-23
  note: >-
    DORA Art 1(2) [32022R2554#parag_001.002]: for financial entities identified
    as essential or important entities, DORA is the sector-specific Union legal
    act for Art 4 of the Directive. Read as settling only that point, not
    equivalence (reading (2), Q2).
