uses: []

scope: >-
  For one provider of one online platform service and, for Art 28(2), one practice
  of presenting advertisements to one recipient (or recipients treated alike), this
  domain answers four questions under Regulation (EU) 2022/2065 (Digital Services
  Act), original act, English text: (1) whether Section 3 of Chapter III applies to
  the provider under the micro and small enterprise exclusion of Art 19(1) and its
  derogation for designated very large online platforms in Art 19(2); (2) whether the
  obligation of Art 28(1) to put in place appropriate and proportionate measures for
  a high level of privacy, safety and security of minors applies; (3) whether the
  provider meets that obligation; (4) whether presenting advertisements based on
  profiling of a recipient the provider is aware with reasonable certainty is a minor
  is prohibited by Art 28(2). Out of scope and left to the caller or a lawyer: the
  open-textured judgements (accessibility to minors, appropriateness and
  proportionality of the measures, profiling, reasonable-certainty awareness), the
  enterprise findings under Recommendation 2003/361/EC, the Commission designation
  under Art 33 (an attested outside fact), the definitions of Art 3, Art 28(3) and
  28(4), Arts 20 to 27, the date of application, and supervision and enforcement.
  An answer is the author's formalisation, not a finding of an authority.

sources:
  - 'Regulation (EU) 2022/2065 of the European Parliament and of the Council of 19 October 2022 on a Single Market For Digital Services (Digital Services Act), OJ L 277, 27.10.2022, p. 1 (original act, English text; source xhtml sha256 11b119a7d45f3a10cd41714061f9d907839ef5d1634e41774490f00b95856bbf), Art 19(1) [32022R2065#parag_019.001]'
  - 'Regulation (EU) 2022/2065 (Digital Services Act), Art 19(2) [32022R2065#parag_019.002]'
  - 'Regulation (EU) 2022/2065 (Digital Services Act), Art 28(1) [32022R2065#parag_028.001]'
  - 'Regulation (EU) 2022/2065 (Digital Services Act), Art 28(2) [32022R2065#parag_028.002]'

query_interface:
  2: 'decide_dsa_art_28_minors_order/2'      # eligibility: one verdict with fixed citations when final
  7: 'dsa_art_28_minors_order_checklist/2'   # justification: one row per question, each with its cite(...) list
  16: 'dsa_art_28_minors_order_what_if/4'    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 32022R2065#art_019
  - 32022R2065#art_028
  reason: 'The titles of Articles 19 and 28 carry no obligation: document structure.
    Deferred so every unit of the pinned extracts is accounted for.'
  consequence: 'None for a caller: a title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: no_duty_to_process_additional_personal_data
  units:
  - 32022R2065#parag_028.003
  reason: 'Art 28(3) says that compliance with the obligations of Art 28 shall not
    oblige providers of online platforms to process additional personal data in order
    to assess whether the recipient of the service is a minor. It limits what the
    obligations require and sets no condition this order reads: no limb asks for an
    age check, and the awareness of Art 28(2) is the caller''s judgement (reading
    (7), Q11).'
  consequence: The answers never say that the provider must assess the age of a recipient;
    a caller judging the measures of Art 28(1) or the awareness of Art 28(2) does
    so without assuming any such duty.
  declaration: not_an_exception
  not_formalized_because: structural
- what: commission_guidelines
  units:
  - 32022R2065#parag_028.004
  reason: 'Art 28(4) lets the Commission, after consulting the Board, issue guidelines
    to assist providers in the application of paragraph 1. It binds the Commission
    and sets no condition. The guidelines the Commission issued in 2025 are guidance,
    not law: they are not pinned and are not a source of any rule of this order (excluded
    as a source).'
  consequence: None for a caller's answer; a caller may consult the guidelines in
    making its judgements of Art 28(1), which remain the caller's.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: definitions
  instrument: Regulation (EU) 2022/2065 Art 3
  cites:
  - 32022R2065#art_003
  reason: Art 3 defines online platform (point (i)), recipient of the service (point
    (b)), advertisement (point (r)) and online interface (point (m)). That the service
    is an online platform, that the person is a recipient and that what is presented
    is an advertisement on the online interface are the caller's premises (reading
    (2)).
  consequence: The caller establishes these premises first.
- what: very_large_online_platform_designation
  instrument: Regulation (EU) 2022/2065 Art 33
  cites:
  - 32022R2065#art_033
  reason: Art 33 sets the thresholds and procedure by which the Commission designates
    very large online platforms. The order reads the designation only as the attested
    outside fact designated_as_very_large_online_platform (reading (4)).
  consequence: A designation reaches the order as a statement of the outside fact.
- what: date_of_application
  instrument: Regulation (EU) 2022/2065 Art 93
  cites:
  - 32022R2065#parag_093.002
  reason: Art 93(2) says the Regulation applies from 17 February 2024. The order has
    no date key and takes the profile to describe conduct on or after that date (reading
    (8), Q12).
  consequence: The caller does not use the order for conduct before 17 February 2024.
- what: rest_of_section_3
  instrument: Regulation (EU) 2022/2065 Arts 20 to 27
  cites:
  - 32022R2065#art_020
  - 32022R2065#art_021
  - 32022R2065#art_022
  - 32022R2065#art_023
  - 32022R2065#art_024
  - 32022R2065#art_025
  - 32022R2065#art_026
  - 32022R2065#art_027
  reason: Art 19 speaks of 'This Section' and excepts Art 24(3); the other articles
    of Section 3 (Arts 20 to 27) are not read by this order, which answers for Art
    28 only.
  consequence: section_3_applies says only that Art 19 does not take the provider
    out of Section 3; the answers never say what Arts 20 to 27 require. section_3_not_applicable
    says only that Art 19 takes the provider out of Section 3 for Art 28; it says
    nothing about Art 24(3), which Art 19(1) excepts and keeps applicable.
- what: micro_and_small_enterprise_definition
  instrument: Commission Recommendation 2003/361/EC (definition of micro, small and
    medium-sized enterprises)
  cites:
  - 32003H0361#anx_1
  reason: Art 19(1) refers to micro and small enterprises as defined in the Recommendation
    and to the loss of that status pursuant to Article 4(2) of its Annex. The order
    takes both as the caller's crisp findings provider_qualifies_as_micro_or_small_enterprise
    and provider_within_12_months_after_losing_micro_or_small_status (Q5).
  consequence: The caller applies the Recommendation's headcount and financial ceilings
    and its 12-month rule itself.
- what: profiling_definition
  instrument: Regulation (EU) 2016/679 Art 4, point (4)
  cites:
  - 02016R0679-20160504#point_004_4
  reason: Art 28(2) refers to profiling as defined in Article 4, point (4), of Regulation
    (EU) 2016/679. Whether the advertisements are based on such profiling using personal
    data of the recipient is the caller's judgement advertisements_based_on_profiling_of_recipient
    (Q3).
  consequence: The caller applies the GDPR definition of profiling in making the judgement.
- what: supervision_and_enforcement
  instrument: Regulation (EU) 2022/2065 Chapter IV (Arts 49 to 88)
  cites:
  - 32022R2065#art_049
  - 32022R2065#art_051
  - 32022R2065#art_052
  reason: Digital Services Coordinators and the Commission supervise and enforce the
    Regulation; the order's answers are not their findings (reading (9)).
  consequence: An answer is not a finding of an authority.
