  retrieved: 2026-11-16
  note: >-
    Art 19(1): Section 3 of Chapter III (which holds Art 28), except Art 24(3),
    does not apply to providers of online platforms that qualify as micro or
    small enterprises (Recommendation 2003/361/EC), nor, during the 12 months
    following loss of that status, to providers that previously qualified,
    except very large online platforms. Anchors limbs 1 to 5.
eu_reg_2022_2065_art_19_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065"
  unit: "32022R2065#parag_019.002"
  sha256: "11b119a7d45f3a10cd41714061f9d907839ef5d1634e41774490f00b95856bbf"
  retrieved: 2026-11-16
  note: >-
    Art 19(2): by derogation, Section 3 applies to providers designated as very
    large online platforms under Art 33, irrespective of enterprise size. Read
    as overriding both sentences of Art 19(1) (Q6). The CITATION of the one
    cross-reference whose TARGET is commission_vlop_designation_decision.
eu_reg_2022_2065_art_28_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065"
  unit: "32022R2065#parag_028.001"
  sha256: "11b119a7d45f3a10cd41714061f9d907839ef5d1634e41774490f00b95856bbf"
  retrieved: 2026-11-16
  note: >-
    Art 28(1): the obligation of providers of online platforms accessible to
    minors to put in place appropriate and proportionate measures for a high
    level of privacy, safety and security of minors. Two open-textured
    judgements: accessibility to minors (Q4) and the measures standard as one
    judgement (Q2).
eu_reg_2022_2065_art_28_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065"
  unit: "32022R2065#parag_028.002"
  sha256: "11b119a7d45f3a10cd41714061f9d907839ef5d1634e41774490f00b95856bbf"
  retrieved: 2026-11-16
  note: >-
    Art 28(2): the prohibition on presenting advertisements based on profiling
    (GDPR Art 4(4)) using the recipient's personal data when the provider is
    aware with reasonable certainty that the recipient is a minor. Binds every
    provider of an online platform within Section 3, not only platforms
    accessible to minors (Q1).
