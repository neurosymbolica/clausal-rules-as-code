# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. None: only the kit's formalize_lib is used.
uses: []

scope: >-
  For ONE financial entity presupposed to be within the scope of DORA, the duties
  of Commission Delegated Regulation (EU) 2024/1774 Article 22 (the ICT-related
  incident management policy: the policy itself, points (a) to (e) and the secure
  retention of evidence) and Article 23 (roles and responsibilities, the detection
  mechanism of paragraph 2 points (a) to (d) and its automated alerts on data source
  and log integrity, protection of recordings, logging of each detected anomalous
  activity, the criteria to trigger detection and response, and the criticality of
  the services affected): which of the seventeen duties apply, whether all are
  performed, and which are outstanding, each performance being a caller judgement
  (true, false or unsure; an unsure judgement is referred to a lawyer as
  open_textured). The only relief is Regulation (EU) 2022/2554 Article 16(1), first
  subparagraph: an entity listed there answers simplified_framework_entity. Out of
  scope: whether the entity is a financial entity in scope of DORA, the simplified
  ICT risk management framework (DORA Art 16(1) second subparagraph, 16(2), 16(3)
  and RTS Title III), DORA Articles 10 and 17, RTS Article 12, Delegated Regulation
  (EU) 2024/1772 Article 15 and every other article of the RTS, each handled by its
  own sibling order or a lawyer.

sources:
  - 'Commission Delegated Regulation (EU) 2024/1774 (regulatory technical standards specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework), OJ L, 2024/1774, CELEX 32024R1774, original OJ text as published: Article 22 (lead words, points (a) to (e), second subparagraph) and Article 23(1) to (6)'
  - 'Regulation (EU) 2022/2554 (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, CELEX 32022R2554, original OJ text as published: Article 16(1), first subparagraph'

query_interface:
  2: "dora_rts_incident_policy_and_detection_status/2"           # eligibility: the facade verdict status
  7: "dora_rts_incident_policy_and_detection_checklist/2"        # justification: cited checklist, one item per duty
  13: "rts_incident_policy_and_detection_duties_complete/3"      # compliance_check: are the duties performed
  16: "dora_rts_incident_policy_and_detection_what_if/4"         # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_023
  - 32022R2554#art_016
  reason: The heading of RTS Article 23 and the heading of DORA Article 16 carry no
    rule of their own (the heading of RTS Article 22 sits in the article unit that
    holds its lead words, which is quoted and cited).
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the
    entities it lists), is formalised as the gate of every query (reading (2)). Not
    formalised: who those entities are, which the caller states, and the lead words
    of the second subparagraph, which introduce the duties of the simplified ICT risk
    management framework; those are the subject of the order on proportionality and
    the simplified framework.'
  consequence: simplified_framework_entity says only that RTS Articles 22 and 23 do
    not apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, among them that sources of ICT
    risk and anomalies are allowed to be promptly identified and detected and ICT-related
    incidents promptly handled (point (d)), and DORA Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of DORA Article 16(1),
    for which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (reading (18)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); no size class or entity type is
    read (reading (13)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4 and Commission Delegated Regulation
    (EU) 2024/1774 Article 1
  cites:
  - 32022R2554#art_004
  - 32024R1774#art_001
  reason: Not pinned in this domain. The principle of proportionality and the overall
    risk profile and complexity are read as removing no duty (reading (14)).
  consequence: No duty is removed for size (open question (Q14)).
- what: ict_risk_protection_and_detection
  instrument: Regulation (EU) 2022/2554 Articles 9 and 10
  cites:
  - 32022R2554#art_009
  - 32022R2554#art_010
  reason: Not pinned in this domain. RTS Art 23(2) specifies the detection mechanism
    of DORA Art 10(1), and RTS Art 23(5) names the processes of DORA Art 10(2); DORA
    Articles 9 and 10 are formalised in the order on ICT risk protection and detection
    (reading (11), reading (12)).
  consequence: complete and none_outstanding say nothing about DORA Article 10 (open
    question (Q11)).
- what: incident_management_classification_and_reporting
  instrument: Regulation (EU) 2022/2554 Articles 17 to 20
  cites:
  - 32022R2554#art_017
  - 32022R2554#art_018
  - 32022R2554#art_019
  - 32022R2554#art_020
  reason: Not pinned in this domain. RTS Art 22(a) names the ICT-related incident
    management process of DORA Article 17; incident management, classification and
    reporting are formalised in the order on incident reporting (reading (12)).
  consequence: The order does not test the process against DORA Article 17 (open question
    (Q12)).
- what: evidence_retention_rules
  instrument: Commission Delegated Regulation (EU) 2024/1772 Article 15 and retention
    requirements of Union law
  cites:
  - 32024R1772#art_015
  reason: Not pinned in this domain. RTS Art 22(d) names them for the retention period
    of the evidence; the order reads no period (reading (9)).
  consequence: The order does not check the period against those rules (open question
    (Q9)).
- what: rts_logging
  instrument: Commission Delegated Regulation (EU) 2024/1774 Article 12
  cites:
  - 32024R1774#art_012
  reason: Not pinned in this domain. RTS Art 23(2)(a)(i) names the logs collected
    under RTS Article 12, which its own order formalises (reading (12)).
  consequence: The order does not check the logs against RTS Article 12 (open question
    (Q12)).
- what: rts_other_articles
  instrument: Commission Delegated Regulation (EU) 2024/1774 Articles 2 to 11, 13
    to 21 and 24 to 41
  cites:
  - 32024R1774#art_002
  - 32024R1774#art_024
  - 32024R1774#art_028
  reason: Not pinned in this domain. The other articles of RTS Title II and the simplified
    framework of Title III are formalised, or to be formalised, in their own orders
    (reading (3), reading (18)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q18)).
- what: ict_risk_management_mandate
  instrument: Regulation (EU) 2022/2554 Article 15
  cites:
  - 32022R2554#art_015
  reason: Not pinned in this domain. DORA Article 15 is the mandate under which RTS
    Title II was adopted; it binds the European Supervisory Authorities and the Commission,
    not the financial entity (reading (3)).
  consequence: None for these answers (open question (Q3)).
- what: dates_of_application
  instrument: Regulation (EU) 2022/2554 Article 64 and Commission Delegated Regulation
    (EU) 2024/1774 Article 42
  cites:
  - 32022R2554#art_064
  - 32024R1774#art_042
  reason: Not pinned in this domain. The order answers on DORA and the RTS as they
    apply and reads no date (reading (15)).
  consequence: No answer depends on a date (open question (Q15)).
