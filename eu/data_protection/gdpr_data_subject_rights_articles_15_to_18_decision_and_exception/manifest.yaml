  units:
  - 02016R0679-20160504#parag_012.003
  reason: 'No limb of this order reads Art 12(3): its first three sentences (the one-month
    period, the extension by two further months and the notice of an extension) are
    decided in the sibling order on the response period, whose deadline is not a query
    of this order. Its last sentence (where the request is made by electronic form
    means, the information shall be provided by electronic means where possible) is
    a modality of the answer; not scored here or there.'
  consequence: 'No answer says how the information is to be delivered: where the request
    was made by electronic form means, the caller checks that the information is provided
    by electronic means where possible, unless the data subject asked otherwise (Art
