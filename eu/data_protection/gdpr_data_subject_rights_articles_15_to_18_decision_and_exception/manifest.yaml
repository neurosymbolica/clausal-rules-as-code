scope: "Regulation (EU) 2016/679 (GDPR), Art 12(2) second sentence, Art 12(5), Art 12(6), Art 15(1), Art 16, Art 17(1) and (3), Art 18(1) and Art 23(1): for one data subject request whose request_type is access, rectification, erasure or restriction, whether the controller must comply (the right invoked is engaged, no exception relieves the controller and the Art 12(6) identity suspension does not hold) and which exception, if any, relieves it (request_decision/2 and request_exception/2), behind the input check of the typed contract. Decided here: the engagement of each of the four rights, the Art 17(3) exceptions, the common exceptions of Art 12(5), Art 12(2) and Art 23(1), the Art 12(6) suspension, missing required facts (every one is named) and referrals. Explicitly out of scope: portability, objection and automated decisions (Arts 20 to 22, a sibling order), the response period of Art 12(3) and the response duties of Art 12(4) (sibling orders), the content and cost of the answer (Art 15(1)(a)-(h), Art 15(2)-(4)), Art 17(2), Art 18(2)-(3), the grounds of Art 23(1)(a)-(j) and Art 23(2). Every open-textured judgement the user marks unsure, and an unattested Union or Member State law requiring erasure, is handed to a lawyer (needs_legal_review)."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the processing of personal data and on the free movement of such data (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504: Art 12(2), 12(3), 12(4), 12(5) points (a) and (b), 12(6), Art 15(1), Art 16, Art 17(1) and (3), Art 18(1), Art 23(1)"

query_interface:
  2: "request_exception_status/2"      # status verdict: the COMPLY field
  7: "request_exception_checklist/2"   # justification: one item(Id, Status, cite(Key)) per limb
  13: "request_exception_status/2"     # compliance_check: may the controller not act? need_not_comply = allowed
  16: "gdpr_data_subject_rights_articles_15_to_18_decision_and_exception_what_if/4"    # what_if: re-evaluate under an overridden key

