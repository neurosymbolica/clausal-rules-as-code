eu_reg_2016_679_art_4_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_1"
  retrieved: 2026-11-18
  note: >-
    Art 4(1) personal data. Formula PD: information relating to a natural person
    (judgement) AND identified (crisp) OR identifiable (judgement, 'can be identified,
    directly or indirectly'). The 'in particular ... such as' identifier list illustrates.
eu_reg_2016_679_art_4_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_2"
  retrieved: 2026-11-18
  note: >-
    Art 4(2) processing. Formula PR = PD AND operation_performed_on_the_data; means
    are irrelevant ('whether or not by automated means'); the 'such as' list illustrates.
eu_reg_2016_679_art_4_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_3"
  retrieved: 2026-11-18
  note: >-
    Art 4(3) restriction of processing: PD AND stored data marked to limit future processing.
eu_reg_2016_679_art_4_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_4"
  retrieved: 2026-11-18
  note: >-
    Art 4(4) profiling: PR AND processing_automated ('any form', not 'solely') AND
    evaluation of personal aspects (judgement).
eu_reg_2016_679_art_4_5:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_5"
  retrieved: 2026-11-18
  note: >-
    Art 4(5) pseudonymisation: PR AND attribution needs additional information
    (judgement) AND kept separately (crisp) AND measures prevent attribution (judgement).
eu_reg_2016_679_art_4_6:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_6"
  retrieved: 2026-11-18
  note: >-
    Art 4(6) filing system: PD AND structured set accessible by specific criteria
    (judgement); physical form irrelevant.
eu_reg_2016_679_art_4_9:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_9"
  retrieved: 2026-11-18
  note: >-
    Art 4(9) recipient: PD AND disclosed to the receiving body AND NOT the
    particular-inquiry public-authority exception (defeater). Third-party status not read;
    the last clause (a duty) is not formalized.
eu_reg_2016_679_art_4_10:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_10"
  retrieved: 2026-11-18
  note: >-
    Art 4(10) third party: NOT data subject AND NOT controller or processor AND NOT
    person authorised under their direct authority (three crisp defeaters).
eu_reg_2016_679_art_4_11:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_11"
  retrieved: 2026-11-18
  note: >-
    Art 4(11) consent of the data subject: five judgement elements (freely given,
    specific, informed, unambiguous, statement or clear affirmative action).
eu_reg_2016_679_art_4_12:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_12"
  retrieved: 2026-11-18
  note: >-
    Art 4(12) personal data breach: PR AND breach of security (judgement) AND led to a
    listed outcome (crisp).
eu_reg_2016_679_art_4_25:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#point_004_25"
  retrieved: 2026-11-18
  note: >-
    Art 4(25) information society service: cross-reference to Directive (EU) 2015/1535
    Art 1(1)(b), read only as the attested outside fact service_is_information_society_service.
    The Formex footnote (Directive title and OJ reference) is omitted from the quotation.
eu_reg_2016_679_art_4_26:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
