# SPDX-License-Identifier: EUPL-1.2
id: eu/data_protection/gdpr_territorial_material_scope
shape_family: classification
kit_version: "0.1.0"
# The domain's .clausal file set, in import-DAG order (determination slices
# over a shared kernel). SINGLE SOURCE OF TRUTH for the module list.
modules:
