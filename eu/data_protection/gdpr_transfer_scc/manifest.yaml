  reason: 'The units of the decision that hold only a heading or marker (the Annex
    title, the section headings, the clause and sub-clause headings and the module
    headings printed above a clause''s text), the footnotes (references to other acts,
    case law and opinions) and the signature, and the heading of Article 46 of the
    GDPR, carry no rule of their own: document structure. The module headings of the
    Appendix are quoted inside the Annex units that hold them (reading (2), reading
    (9)).'
  consequence: 'None for a caller: a heading, a footnote reference or a signature
    carries no rule.'
