- what: art_2_and_3_member_state_information_and_commission_evaluation
  units:
  - 32021D0914#art2
  - 32021D0914#art3
  reason: Article 2 (a Member State informs the Commission when its authorities suspend
    or ban transfers under Article 58 of the GDPR because the importer is subject
    to laws or practices that prevent compliance) and Article 3 (the Commission evaluates
    the practical application of the clauses) are acts of public authorities, not
    conditions a transfer must meet.
  consequence: No answer says whether an authority has suspended or banned a transfer,
    or what the Commission's evaluation found; a suspension or ban is for the caller
    to take into account.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: art_4_entry_into_force_repeal_and_transition
  units:
  - 32021D0914#art4
  reason: 'Spent: the transitional periods of Article 4 have run out (27 December
    2022). Article 4(2) and (3) repealed Decisions 2001/497/EC and 2010/87/EU with
    effect from 27 September 2021, and that repeal has taken effect, so no transfer
    after that date can rely on those decisions; Article 4(4) deemed contracts concluded
    before 27 September 2021 on the old clauses to provide appropriate safeguards
    only until 27 December 2022. Article 4(1) (entry into force) is a past event;
    whether the decision is still in force is the outside fact standard_contractual_clauses_decision_in_force.
    No answer of this order can turn on Article 4 for a transfer after 27 December
    2022.'
  consequence: No answer applies the old clauses of Decisions 2001/497/EC or 2010/87/EU
    or the transitional period; a caller asking about a transfer before 27 December
    2022 must apply Article 4 itself.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
