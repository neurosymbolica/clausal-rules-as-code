# domain imports. The domain imports only the kit's formalize_lib, which is
# not a backbone package.
uses: []

scope: >-
  Whether one transfer of personal data from a data exporter to a data importer
  relies validly on the standard contractual clauses of Commission Implementing
  Decision (EU) 2021/914, so that Article 46(2)(c) of Regulation (EU) 2016/679
  provides appropriate safeguards: (A) which module of the clauses fits the roles
  of the Parties (Annex I module headings); (B) whether the clauses are available
  for the transfer under Article 1(1) of the decision; (C) whether the clauses, as
  used, provide the safeguards (Article 1(1), Clause 1(b), Clause 2(a), Clause 14
  (a), (b) and (d) with the Module Four heading words); (D) whether the Appendix
  (Clause 1(d), Annexes I to III, Clause 9(a) options) is completed as the module
  requires. Out of scope: whether a transfer takes place and Chapter V as a whole
  (gdpr-chapter-v-transfers), the material and territorial scope of the GDPR
  (gdpr-territorial-material-scope, arriving as attested outside facts), the
  roles of controller and processor (stated by the caller), the assessment of the
  third country's laws and practices (an attested outside fact), the Parties'
  performance of the clauses, and Article 4 transitional rules. Open-textured
  judgements (added clauses contradicting the Clauses; Annex II measures in
  specific terms) are handed to the user and, when unsure and decisive, to a
  lawyer.

sources:
  - "Commission Implementing Decision (EU) 2021/914 of 4 June 2021 on standard contractual clauses for the transfer of personal data to third countries pursuant to Regulation (EU) 2016/679 (OJ L 199, 7.6.2021, p. 31), CELEX 32021D0914, as adopted: Article 1(1)"
  - "Commission Implementing Decision (EU) 2021/914, Annex (standard contractual clauses): Clause 1(b) with points (i) and (ii), Clause 1(d), Clause 2(a), Clause 9(a) under Modules Two and Three, Clause 14 (Module Four heading words, (a), (b) with (i) to (iii), (d))"
  - "Commission Implementing Decision (EU) 2021/914, Annex, Appendix: explanatory note, Annex I (A, B, C), Annex II, Annex III"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), consolidated text 02016R0679-20160504: Article 46(2)(c); Article 46(1) and (2) opening words quoted only, decided in gdpr-chapter-v-transfers"

