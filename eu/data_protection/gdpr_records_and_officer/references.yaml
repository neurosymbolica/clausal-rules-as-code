  kind: guidance
  author: Article 29 Working Party (endorsed by the EDPB)
  title: Position Paper on the derogations from the obligation to maintain records of processing activities pursuant to Article
    30(5) GDPR
  date: 2018-04
  url: https://ec.europa.eu/newsroom/article29/redirection/document/51422
  accept: application/pdf
  fetched: '2026-10-30'
  file: sources/reference/wp29_art30_5.pdf
  bytes: 144630
  sha256: 4758dabbe7fd67ce5fceb864cb266e24ab939e8df4861dada1a5e3595570f7aa
  text_file: sources/reference/wp29_art30_5.pdf.txt
  text_sha256: 6f07ad941a9a133b94dee04efc25b7068f78605e762d9de401167084a02a9647
  question: 'Q13: does one Art 30(5) trigger remove the exemption for the whole record, or per activity?'
  finding: Any one trigger suffices, but the record is owed only for the types of processing that trigger it (per activity).
    The risk trigger is any risk, not only a high risk.
  verdict: guidance_only
  verbatim:
  - at: page 1-2
    text: the three types of processing to which the derogation does not apply are alternative (“or”) and the occurrence of
      any one of them alone triggers the obligation to maintain the record of processing activities.
  - at: page 2
    text: such organisations need only maintain records of processing activities for the types of processing mentioned by
      Article 30(5).
  - at: page 2
    text: a risk (not just a high risk)
  found_by: automated retrieval, 2026-10-30
  checked_by: 'the build process re-fetched 2026-10-30 with the same Accept header: identical bytes; every verbatim checked as a
    substring of the extracted text (whitespace-insensitive for PDF extraction)'
