  question: 'Q15: is "public authority or body" (Art 37(1)(a)) defined by national law?'
  finding: Yes, determined under national law; it typically includes other bodies governed by public law. The national definitions
    are on the national-facts list.
  verdict: guidance_only
  verbatim:
  - at: section 2.1.1
    text: The WP29 considers that such a notion is to be determined under national law. Accordingly, public authorities and
      bodies include national, regional and local authorities, but the concept, under the applicable national laws, typically
      also includes a range of other bodies governed by public law.
