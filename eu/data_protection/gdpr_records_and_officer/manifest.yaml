  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  reason: 'Art 4 is pinned whole because the smallest document element containing
    Art 4(7), (8) and (18) is the article. The other points define terms no limb reads
    (personal data, processing, recipient, personal data breach, ...): the profile
    states the facts in those terms already.'
  consequence: whether the data is personal data and who is a recipient are not tested.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: art4_7_8_18_definitions_as_context
  units:
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_8
  - 02016R0679-20160504#point_004_18
  partial: true
  reason: Points (7), (8) and (18) are quoted as the context of the two role flags
    acts_as_controller and acts_as_processor (Art 4(7), (8); open question Q5) and
    of the words 'an enterprise or an organisation' of Art 30(5) (Art 4(18)), which
    are read as covering every caller (open question Q28); the order has no enterprise
    flag. Whether the caller is a controller, a processor or both is stated by the
    user through the two role flags, not derived.
  consequence: 'The answers take the two role flags as given: the caller must decide
    under Art 4(7) and (8) itself whether it is a controller, a processor or both,
    and is taken to be an enterprise or an organisation within Art 30(5) without being
    asked.'
  declaration: exception_modelled
  open: formalisable as a definition shared by the data-protection orders; to be formalised
    in a later change to the orders, not in this order's rules; the deferral stands
    for this run.
- debt: true
  what: art30_1_2_representative
  units:
  - 02016R0679-20160504#parag_030.001
  - 02016R0679-20160504#parag_030.002
  partial: true
  reason: Art 30(1) and (2) also bind 'where applicable, the controller's representative'
    and 'the processor's representative' (Art 27). The profile is the controller's
    or processor's; the representative's own duty to keep the record is not modelled.
  consequence: a representative runs the order as the entity it represents.
  declaration: not_an_exception
- debt: true
  what: art30_3_form_of_the_record
  units:
  - 02016R0679-20160504#parag_030.003
  reason: The record must be in writing, including in electronic form. A property
    of the record, not a content item and not a question of whether a record is owed
    (open question Q14).
  consequence: 'The checklist does not test the form of the record: the caller must
    check that it is kept in writing, including in electronic form, under Art 30(3)
    itself.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: art30_4_availability_on_request
  units:
  - 02016R0679-20160504#parag_030.004
  reason: The record is to be made available to the supervisory authority on request.
    A duty that follows from having a record; not asked, not modelled (open question
    Q14).
  consequence: 'The answers do not cover making the record available: the caller must
    make it available to the supervisory authority on request under Art 30(4) itself.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: art37_2_group_single_officer
  units:
  - 02016R0679-20160504#parag_037.002
  reason: 'A group of undertakings MAY appoint a single officer if easily accessible
    from each establishment: a permission about how to designate, not whether. Not
    modelled.'
  consequence: 'None for whether an officer must be designated: a group of undertakings
    that wants one officer for all its members must check the accessibility condition
    of Art 37(2) itself.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
