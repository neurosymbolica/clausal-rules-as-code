# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only the kit (formalize_lib), no shared
# backbone package.
uses: []

scope: 'Regulation (EU) 2016/679 (GDPR), three entry points over one attribute-list
  profile. ENTRY 1: whether a controller (Art 30(1)) or a processor (Art 30(2)), or
  both, owes a record of processing activities for ONE processing activity, given
  the Art 30(5) exemption below 250 persons employed and its four triggers (a risk,
  not occasional, special categories, criminal offence data), and which content items
  of Art 30(1)(a)-(g) and Art 30(2)(a)-(d) the record lacks. ENTRY 2: whether a data
  protection officer must be designated under the three limbs of Art 37(1) or because
  Union or Member State law requires it (Art 37(4), an attested outside fact), and
  which of the Art 39(1) tasks the officer''s mandate lacks. ENTRY 3: whether the
  position of the officer meets one duty of Art 38(1), (2), (3) or (6), each read
  from an attested outside fact or, for the conflict of interests, the user''s judgement.
  Open-textured terms (risk, occasional, core activity, large scale, where possible,
  conflict of interests) are the user''s judgements and an unsure one is referred to
  a lawyer; whether an entity is a public authority or body and the content of national
  law are outside facts. Out of scope: the representative''s own duty, Art 30(3)-(4),
  Art 37(2), (3), (5)-(7), Art 38(4)-(5), Art 39(2), the scope of Arts 9 and 10, Chapter
  V transfers, impact assessments and fines (see deferred_set and excluded_set).'

sources:
  - 'Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April
    2016 on the protection of natural persons with regard to the processing of personal
    data and on the free movement of such data (General Data Protection Regulation),
    OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504: Art 4(7), 4(8)
    and 4(18) (definitions, reasoning only), Art 30(1), 30(2) and 30(5), Art 37(1) and
    37(4), Art 38(1), (2), (3) and (6), Art 39(1).'
  - 'Article 29 Working Party, position paper on the derogations from the obligation
    to maintain records of processing activities pursuant to Article 30(5) GDPR (April
    2018): authority of the ruling that the exemption is lost per processing activity
    (Q1).'
  - 'Article 29 Working Party, Guidelines on Data Protection Officers (WP243 rev.01):
    authority of the ruling that is_public_authority_or_body is an outside fact classified
    by national law (Q3).'

query_interface:
  2: 'gdpr_records_and_officer_exemption_verdict/2'     # eligibility: the Art 30(5) exemption
  13: 'gdpr_records_and_officer_compliance_verdict/3'   # compliance: operate without a record or an officer
  14: 'gdpr_records_and_officer_obligations/2'          # obligation surfacing: records and designation
  16: 'gdpr_records_and_officer_what_if/4'              # what_if: re-evaluate under a replaced key

