  units:
  - 02016R0679-20160504#parag_037.003
  reason: 'A single officer MAY be designated for several public authorities or bodies:
    a permission about how to designate, not whether. Not modelled.'
  consequence: 'None for whether an officer must be designated: public authorities
    or bodies that want one officer for several of them must check Art 37(3) itself.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
