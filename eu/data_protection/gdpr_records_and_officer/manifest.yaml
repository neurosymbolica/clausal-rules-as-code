- debt: true
  what: art37_7_publish_and_communicate_contact_details
  units:
  - 02016R0679-20160504#parag_037.007
  reason: The controller or processor shall publish the officer's contact details
    and communicate them to the supervisory authority. A crisp duty that follows designation;
    the lawyer's question is whether to designate, so it is deferred (open question
    Q14).
  consequence: 'A designate answer does not list the follow-on duty: a caller that
    designates an officer must publish the contact details and communicate them to
    the supervisory authority under Art 37(7) itself.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art38_4_data_subjects_may_contact_the_officer
  units:
  - 02016R0679-20160504#parag_038.004
  reason: 'Art 38(4): data subjects may contact the data protection officer with regard
    to all issues related to processing of their personal data and to the exercise
    of their rights. It states a right of data subjects and adds no duty of the controller
    or processor to check beside the right; no result a query could return.'
  consequence: 'None for a caller: the answers never say whether a data subject may
    contact the officer.'
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: art38_5_officer_secrecy_under_union_or_member_state_law
  units:
  - 02016R0679-20160504#parag_038.005
  reason: 'Art 38(5): the officer is bound by secrecy or confidentiality concerning
    the performance of the tasks, in accordance with Union or Member State law. The
    content of the secrecy duty is the law of the Union or of the Member State, which
    this order does not formalize.'
  consequence: 'The answers do not say whether the officer is bound by secrecy or
    what it covers: the caller must read the applicable Union or Member State law
    itself.'
  declaration: answered_with_caveat
  not_formalized_because: national_law
- debt: true
  what: art39_2_risk_based_approach
  units:
  - 02016R0679-20160504#parag_039.002
  reason: 'The officer shall have due regard to the risk associated with processing
    operations: a standard for the officer''s performance, evaluative, no crisp item.
    Not modelled.'
  consequence: 'None for the answers: the officer''s due regard to risk under Art
    39(2) is not checked, and the caller must assess the officer''s performance itself.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: art30_1_c_two_descriptions
  units:
  - 02016R0679-20160504#point_030.001_c
  partial: true
  reason: Item (c) asks for a description of the categories of data subjects AND of
    the categories of personal data; the profile carries one flag for both (open question
    Q12).
  consequence: 'One flag stands for both descriptions: the caller must set it false
    when either the categories of data subjects or the categories of personal data
    are missing from the record.'
  declaration: exception_modelled
- what: national_designation_rules
  units:
  - 02016R0679-20160504#parag_037.004
  partial: true
  reason: The existence of such a law is the outside fact union_or_member_state_law_requires_data_protection_officer;
    its content (for example a headcount threshold for persons constantly processing
    personal data) is not formalized.
  consequence: The order takes the attested answer to union_or_member_state_law_requires_data_protection_officer
    as given; whoever attests it must read the national law, including any threshold
    such as a headcount, and decide whether it requires an officer for this controller
    or processor.
  declaration: answered_with_caveat
  not_formalized_because: national_law

excluded_set:
- what: art35_36_impact_assessment_and_prior_consultation
  instrument: Regulation (EU) 2016/679 Arts 35 and 36
  cites:
  - 02016R0679-20160504#art_035
  - 02016R0679-20160504#art_036
  reason: Art 39(1)(c) and (e) refer to the data protection impact assessment and
    the prior consultation. Not pinned; they are tasks the officer has, not conditions
    this order tests.
  consequence: The order does not test whether an impact assessment or a prior consultation
    was required or carried out; a caller uses the sibling order gdpr-impact-assessment
    for that.
- what: art32_security_measures
  instrument: Regulation (EU) 2016/679 Art 32(1)
  cites:
  - 02016R0679-20160504#parag_032.001
  reason: Art 30(1)(g) and 30(2)(d) refer to the security measures of Art 32(1); whether
    the measures are adequate is a separate question. The checklist asks only whether
    the record describes them.
  consequence: The order checks only that the record describes the security measures;
    a caller judges their adequacy under Art 32(1) itself.
- what: art49_transfer_derogations
  instrument: Regulation (EU) 2016/679 Art 49(1), second subparagraph
  cites:
  - 02016R0679-20160504#parag_049.001
  reason: Art 30(1)(e) and 30(2)(c) refer to transfers under the second subparagraph
    of Art 49(1); the user states whether the transfers rely on it (a crisp flag).
    Chapter V is the sibling order eu/data-protection/gdpr-chapter-v-transfers.
  consequence: The order does not test whether a transfer qualifies under the second
    subparagraph of Art 49(1); the caller states it, using the sibling order gdpr-chapter-v-transfers
    where needed.
- what: art9_and_art10_scope
  instrument: Regulation (EU) 2016/679 Arts 9(1) and 10
  cites:
  - 02016R0679-20160504#parag_009.001
  - 02016R0679-20160504#art_010
  reason: Art 30(5) and 37(1)(c) refer to special categories and offence data. Whether
    data falls within them is the sibling order eu/data-protection/gdpr-special-categories;
    here it is a crisp flag the user states (open question Q7).
  consequence: The order does not decide whether data are special-category or offence
    data; the caller states it, using the sibling order gdpr-special-categories where
    needed.
- what: art27_representative
  instrument: Regulation (EU) 2016/679 Art 27
  cites:
  - 02016R0679-20160504#art_027
  reason: The representative of a controller or processor not established in the Union.
    Not pinned; see the deferral of the representative's own duty.
  consequence: The order does not test whether a representative must be designated
    or what it must do; a caller applies Art 27 itself (see the sibling order gdpr-territorial-material-scope).
- what: art83_fines_for_breach
  instrument: Regulation (EU) 2016/679 Art 83(4)(a)
  cites:
  - 02016R0679-20160504#point_083.004_a
  reason: Infringing Arts 30, 37, 38 or 39 is in the lower fine tier. The sibling
    eu/data-protection/gdpr-administrative-fine-maximum owns the cap; whether an infringement
    occurred is not decided here.
  consequence: The order does not decide whether an infringement occurred or what
    fine follows; a caller uses the sibling gdpr-administrative-fine-maximum for the
    maximum.
- what: regulatory_guidance
  instrument: Article 29 Working Party and EDPB guidance on data protection officers
    and on the Art 30(5) exemption
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  reason: 'Soft law, not pinned and not quoted. Since AMENDMENT 2026-11-01 two rulings
    name it as their authority: the WP29 position paper on Art 30(5) (April 2018)
    for the per-activity reading of the exemption (Q1) and the WP29 Guidelines on
    Data Protection Officers (WP243) for is_public_authority_or_body as an outside
    fact (Q3).'
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance
    itself. A caller who relies on the guidance beyond the two rulings that name it
    reads it and applies it itself.
