- debt: true
  what: art37_5_professional_qualities
  units:
  - 02016R0679-20160504#parag_037.005
  reason: 'The officer is to be designated on the basis of professional qualities
    and expert knowledge: a standard for choosing the person, evaluative, no crisp
    item. Not modelled.'
  consequence: 'The answers do not test who is designated: the caller must check the
