  - "Regulation (EU) 2016/679 (GDPR) Art 8(2), unit 02016R0679-20160504#parag_008.002"
  - "Regulation (EU) 2016/679 (GDPR) Art 8(3), unit 02016R0679-20160504#parag_008.003 (saving clause, excluded)"
  - "Regulation (EU) 2016/679 (GDPR) Art 4(25), unit 02016R0679-20160504#point_004_25"

