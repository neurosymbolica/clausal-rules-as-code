independence: no_external_scorer

uses: []

scope: "Regulation (EU) 2016/679 Art 8(1) and 8(2): for one processing based on consent (Art 6(1)(a)) in relation to an information society service offered directly to a child, whether the child's own consent suffices (age at least 16, or at least the lower national age of 13 to 15 in force on the consent date) or the consent or authorisation of the holder of parental responsibility is needed, and, as a separate field, whether the Art 8(2) verification duty is discharged. Out of scope: validity of the consent itself (Art 4(11), Art 7; gdpr-art6-lawfulness), lawfulness of the processing on the whole, and validity of a contract with a child (Art 8(3))."

sources:
