deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_008
  reason: 'The titles of Articles 4 and 8 carry no obligation: document structure.
    Deferred so every unit of the pinned extracts is accounted for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- debt: true
  what: art_4_11_consent_validity
  units:
  - 02016R0679-20160504#point_004_11
  reason: Art 8(1) speaks of consent without defining it; whether the consent is freely
    given, specific, informed and unambiguous is the question of gdpr-art6-lawfulness.
    This order assumes the consent exists and tests only who may give it (open question
    Q4).
  consequence: 'An eligible answer does not say the consent itself is valid: the caller
    must check under Art 4(11) (and Art 7) itself that the consent is freely given,
    specific, informed and unambiguous, for example with the sibling Article 6 order.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: definitions_not_applied
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_4
