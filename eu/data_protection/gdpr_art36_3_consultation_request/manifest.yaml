# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only the kit (formalize_lib, library(reif)).
uses: []

scope: "What the controller must provide to the supervisory authority when it consults
  the authority under Article 36(1) of Regulation (EU) 2016/679: the six items of
  Article 36(3), points (a) to (f), read as a checklist of presence (not adequacy).
  Decided here: whether the consultation request holds every item that applies
  (consultation_request_status/4) and which items that apply are not provided
  (missing_consultation_request_items/4); a consultation not under Article 36(1) is
  not_governed_by_article_36_3. Out of scope: whether the controller must consult
  (Art 36(1) and 36(5), gdpr-impact-assessment-prior-consultation), whether an impact
  assessment was required or has its Art 35(7) contents (gdpr-impact-assessment-assessment-duty-stated-risk),
  who is a controller, joint controller or processor (attested outside fact; Arts
  4(7), 4(8), 26, 28), whether a data protection officer must be designated (Art 37),
  and what the supervisory authority does after the request (Art 36(2)). No date is computed."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504; Article 36(3) opening words and points (a) to (f) (units parag_036.003, point_036.003_a to point_036.003_f)"
  - "Regulation (EU) 2016/679, Article 36(1) (unit parag_036.001), read only to fix which consultation Article 36(3) governs (reading (1))"
  - "Regulation (EU) 2016/679, Article 36(5) (unit parag_036.005), read only for reading (1) and open question Q1"

query_interface:
  2: "gdpr_art36_3_consultation_request_status/2"        # status projection of the verdict
  4: "missing_consultation_request_items/4"              # enumeration: every item that applies and is missing
  7: "gdpr_art36_3_consultation_request_checklist/2"     # justification: one item per point with its cite
  13: "consultation_request_status/4"                    # compliance_check: complete / incomplete / not governed
  16: "gdpr_art36_3_consultation_request_what_if/4"      # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_035
  - 02016R0679-20160504#art_036
  reason: 'The headings of Articles 4, 35 and 36 (with the opening words of Article
    4, ''For the purposes of this Regulation:'') carry no obligation: document structure,
    not operative law.'
  consequence: 'None for a caller: a heading carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: consultation_duty
  units:
  - 02016R0679-20160504#parag_036.001
  - 02016R0679-20160504#parag_036.005
  reason: Whether the controller must consult the supervisory authority under Art
    36(1), or under Member State law adopted under Art 36(5), is decided in gdpr-impact-assessment-prior-consultation.
    This order quotes both paragraphs for reading (1) only and takes, as the crisp
    key consultation_under_article_36_1, the caller's statement that it consults under
    Art 36(1).
  consequence: No answer of this order says whether a consultation is required; the
    caller asks gdpr-impact-assessment-prior-consultation, and states consultation_under_article_36_1.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-impact-assessment-prior-consultation
- debt: true
  what: authority_response_periods
  units:
  - 02016R0679-20160504#parag_036.002
  reason: Art 36(2) (written advice within up to eight weeks of receipt of the request,
    extension by six weeks, suspension until the authority has obtained information
    it has requested) binds the supervisory authority after the request; no answer
    of this order computes a period or says whether a period runs while the request
    is incomplete (reading (7)).
  consequence: A caller who needs to know when the written advice is due, or whether
    an incomplete request delays it, reads Art 36(2) itself.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later order, not in this order's rules;
    the deferral stands for this run.
- what: member_state_legislative_consultation
  units:
  - 02016R0679-20160504#parag_036.004
  reason: Art 36(4) binds Member States preparing legislative or regulatory measures,
    not controllers.
  consequence: 'None for a caller: Art 36(4) binds Member States, not controllers.'
  declaration: not_an_exception
  not_formalized_because: institutional
- what: impact_assessment_duty_and_contents
  units:
  - 02016R0679-20160504#parag_035.001
  - 02016R0679-20160504#parag_035.003
  - 02016R0679-20160504#point_035.003_a
  - 02016R0679-20160504#point_035.003_b
  - 02016R0679-20160504#point_035.003_c
  - 02016R0679-20160504#parag_035.004
  - 02016R0679-20160504#parag_035.005
  - 02016R0679-20160504#parag_035.007
  - 02016R0679-20160504#point_035.007_a
  - 02016R0679-20160504#point_035.007_b
  - 02016R0679-20160504#point_035.007_c
  - 02016R0679-20160504#point_035.007_d
  - 02016R0679-20160504#parag_035.010
  reason: Whether an impact assessment is required (Art 35(1), (3), (4), (5), (10))
    and which of its Art 35(7) contents are missing are decided in gdpr-impact-assessment-assessment-duty-stated-risk.
    This order reads only whether the controller provides the assessment it carried
    out (Art 36(3)(e); reading (2) and (4)).
  consequence: An answer consultation_request_complete does not say that the impact
    assessment has the Art 35(7) contents; the caller asks gdpr-impact-assessment-assessment-duty-stated-risk.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-impact-assessment-assessment-duty-stated-risk
- debt: true
  what: impact_assessment_procedure_points
  units:
  - 02016R0679-20160504#parag_035.002
  - 02016R0679-20160504#parag_035.008
  - 02016R0679-20160504#parag_035.009
  - 02016R0679-20160504#parag_035.011
  reason: Art 35(2) (the advice of the data protection officer), 35(8) (codes of conduct
    taken into account), 35(9) (the views of data subjects) and 35(11) (review of
    the assessment) are steps in carrying out an assessment; no answer of this order
    reads them.
  consequence: No answer checks how the impact assessment was carried out or reviewed.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later order, not in this order's rules;
    the deferral stands for this run.
- what: consistency_mechanism_for_lists
  units:
  - 02016R0679-20160504#parag_035.006
  reason: Art 35(6) binds the competent supervisory authority (the consistency mechanism
    for its lists), not controllers.
  consequence: 'None for a caller: Art 35(6) binds the supervisory authority.'
  declaration: not_an_exception
  not_formalized_because: institutional
