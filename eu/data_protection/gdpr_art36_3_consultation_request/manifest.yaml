excluded_set:
- what: joint_controller_and_processor_rules
  instrument: Regulation (EU) 2016/679 Arts 26 and 28
  cites:
  - 02016R0679-20160504#art_026
  - 02016R0679-20160504#art_028
  reason: The arrangement between joint controllers and the processor's position are
    in Articles 26 and 28, not pinned here; whether a joint controller or processor
    is involved is the attested outside fact joint_controllers_or_processors_involved
    (reading (3)).
  consequence: No answer checks the joint controllers' arrangement or the processor
    contract; the caller attests the roles.
- what: data_protection_officer_designation
  instrument: Regulation (EU) 2016/679 Art 37
  cites:
  - 02016R0679-20160504#art_037
  reason: Whether the controller must designate a data protection officer is decided
    under Article 37, not pinned here; the order reads only whether one is designated
    (data_protection_officer_designated; reading (5), Q3).
  consequence: No answer says whether a data protection officer must be designated.
- what: authority_competence_and_powers
  instrument: Regulation (EU) 2016/679 Arts 51, 55, 56 and 58
  cites:
  - 02016R0679-20160504#art_051
  - 02016R0679-20160504#art_055
  - 02016R0679-20160504#art_056
  - 02016R0679-20160504#art_058
  reason: Which supervisory authority is competent to be consulted and what it may
    do after the request are in Articles 51, 55, 56 and 58, not pinned here.
  consequence: No answer names the authority to consult or says what it may do with
    an incomplete request.
