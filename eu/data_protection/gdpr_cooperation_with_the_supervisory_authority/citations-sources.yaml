  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-12
  note: >-
    GDPR Art 31, the whole article (one paragraph). Anchors the four rules of
    the order: who is bound ('the controller and the processor and, where
    applicable, their representatives'), the trigger ('on request'), the scope
    of the request ('in the performance of its tasks', tasks in Art 57, not
    pinned: a caller judgement) and the duty ('shall cooperate', open-textured:
    an attested outside fact). No figure, period or form is set.
