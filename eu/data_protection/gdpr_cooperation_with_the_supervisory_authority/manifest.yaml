uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR) Art 31 (the whole article, one paragraph):
  whether, on the caller's statement of its role, of the supervisory
  authority's request and of its own judgement that the request is made in the
  performance of the authority's tasks, the caller is bound to cooperate on
  that one request, and whether an attested statement says it cooperated
  (cooperation_not_required, cooperation_met, cooperation_not_met). Decided
  here: who is bound (controller, processor, representative where applicable),
  the 'on request' condition, and the hand-off of 'in the performance of its
  tasks' as a tri-state judgement. Out of scope: who is a controller, processor
  or representative (Art 4, Art 27, sibling orders), the authority's tasks
  (Art 57), its powers and corrective measures (Art 58), fines (Art 83), and
  whether the cooperation given was enough, timely or complete (the attested
  statement is copied, never judged). An unsure judgement or an absent
  cooperation statement goes to a lawyer.

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, Art 31 (Cooperation with the supervisory authority); pinned unit 02016R0679-20160504#art_031, consolidated text of 2016-05-04, fetched 2026-11-12"

query_interface:
  2: "gdpr_cooperation_with_the_supervisory_authority_status/2"      # eligibility: the Art 31 duty verdict
  7: "gdpr_cooperation_with_the_supervisory_authority_checklist/2"   # justification: cited checklist, cite(...) per item
  16: "gdpr_cooperation_with_the_supervisory_authority_what_if/4"    # what_if: re-evaluate under an overridden key

excluded_set:
- what: supervisory_authority_tasks
  instrument: Regulation (EU) 2016/679 Art 57
  cites:
  - 02016R0679-20160504#art_057
  reason: Art 31 refers to the supervisory authority's tasks, which Art 57 lists;
    this order does not model them. Whether a request is made in the performance of
    those tasks is the caller's judgement (reading (3)).
  consequence: The answers never say which tasks the authority has; an unsure judgement
    goes to a lawyer.
- what: supervisory_authority_powers_and_corrective_measures
  instrument: Regulation (EU) 2016/679 Art 58
  cites:
  - 02016R0679-20160504#art_058
  reason: What the authority may do when a controller or processor does not cooperate
    (investigative and corrective powers) is a separate matter and not a limb of Art
    31.
  consequence: cooperation_not_met never says what follows from it.
- what: fines_for_infringement_of_article_31
  instrument: Regulation (EU) 2016/679 Art 83(4)(a)
  cites:
  - 02016R0679-20160504#art_083
  reason: An infringement of the obligations of the controller and the processor under
    Art 31 is within the lower tier of administrative fines; the fine order for GDPR
    fines carries that, not this order.
  consequence: The answers never say that a fine is due or how large.
- what: representatives_of_controllers_and_processors
  instrument: Regulation (EU) 2016/679 Art 27
  cites:
  - 02016R0679-20160504#art_027
  reason: Who must designate a representative and what the representative is are decided
    by Art 27 and the sibling order on jurisdiction; this order takes the caller's
    statement that it acts as a representative.
  consequence: The caller establishes its role first.
- what: roles_controller_processor
  instrument: Regulation (EU) 2016/679 Art 4(7) and (8)
  cites:
  - 02016R0679-20160504#art_004
  reason: Whether the caller is a controller or a processor is decided by the sibling
    order on roles; this order takes the position of the caller as given.
  consequence: The caller establishes its role first.
