independence: no_external_scorer

uses: []

scope: "Whether a controller must comply with a data subject request for portability (GDPR Art 20) or objection (Art 21), after the Art 12(2), 12(5), 12(6) and 23(1) reliefs and the Art 12(6) identity suspension. Decides only request_type portability and objection; other request types (access, rectification, erasure, restriction, automated_decision) are outside this order. Open-textured judgements (public task, rights of others, legal claims, compelling grounds, particular situation, manifestly unfounded or excessive, reasonable doubts about identity) are handed to the user or referred to a lawyer; Art 23 grounds and Art 23(2) content, the response period and the fee amount are not formalized."

sources:
  - "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: Art 12(2), 12(3), 12(4), 12(5), 12(6)"
  - "Regulation (EU) 2016/679 (GDPR) Art 20(1), 20(3), 20(4) (right to data portability)"
  - "Regulation (EU) 2016/679 (GDPR) Art 21(1), 21(2), 21(3), 21(6) (right to object)"
  - "Regulation (EU) 2016/679 (GDPR) Art 23(1), opening words (restrictions by Union or Member State law)"

