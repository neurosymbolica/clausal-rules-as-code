deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_012
  - 02016R0679-20160504#art_020
  - 02016R0679-20160504#art_021
  - 02016R0679-20160504#art_023
  reason: 'The titles of Articles 4, 12, 20, 21, 23 carry no obligation: document
    structure, not operative law. Deferred so every unit of the pinned extracts is
    accounted for.'
  consequence: 'None for a caller: the article titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: definitions_not_applied
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
