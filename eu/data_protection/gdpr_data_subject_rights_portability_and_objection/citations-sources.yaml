eu_reg_2016_679_art_12_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 12(2) second sentence: the controller shall not refuse to act unless it
    demonstrates that it cannot identify the data subject (exception art12_2_unable_to_identify).
eu_reg_2016_679_art_12_5:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 12(5): manifestly unfounded or excessive requests; fee or refusal; burden on the controller.
eu_reg_2016_679_art_12_6:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 12(6): reasonable doubts about identity allow a request for additional
    information (suspension; used in the referral reason only).
eu_reg_2016_679_art_20_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 20(1): right to data portability; engaged by provided data, consent or
    contract basis, and automated means.
eu_reg_2016_679_art_20_3:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 20(3) second sentence: portability does not apply to public-task processing.
eu_reg_2016_679_art_20_4:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 20(4): portability must not adversely affect the rights and freedoms of
    others (read as a bar on the whole request, Q5).
eu_reg_2016_679_art_21_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 21(1): objection to Art 6(1)(e) or (f) processing; compelling legitimate
    grounds or legal claims relieve the controller.
eu_reg_2016_679_art_21_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 21(2): absolute right to object to direct marketing.
eu_reg_2016_679_art_21_3:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 21(3): after objection to direct marketing the data are no longer processed for it.
eu_reg_2016_679_art_21_6:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-07
  note: >-
    Art 21(6): objection to research or statistical processing unless necessary
