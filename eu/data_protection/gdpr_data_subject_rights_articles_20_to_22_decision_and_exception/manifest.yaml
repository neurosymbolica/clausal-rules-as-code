  declaration: exception_modelled
- debt: true
  what: art89_research_safeguards
  instrument: Regulation (EU) 2016/679 Art 89(1)
  reason: the safeguards for archiving, research and statistics arrive inside the
    judgements that read them; Art 89 is not pinned
  consequence: 'Whether the processing meets the Art 89(1) safeguards is folded into
    the archiving, research or statistics judgements: the caller assesses Art 89(1)
    itself before answering those judgements true.'
  declaration: exception_modelled
- debt: true
  what: art12_4_reasons_for_not_acting
  units:
  - 02016R0679-20160504#parag_012.004
  reason: The duty to inform the data subject within one month of the reasons for
    not taking action and of the complaint and judicial remedy is a duty about the
    response and its period; this order decides only whether the controller must comply,
    and the response period is out of its scope.
  consequence: 'The answer does not say whether, when or how the controller informs
    the data subject of the reasons for not acting and of the possibility of a complaint
    and a judicial remedy (Art 12(4)): the caller checks that duty and its one-month
