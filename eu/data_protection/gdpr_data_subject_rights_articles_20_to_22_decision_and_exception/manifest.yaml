  what: art22_2_exceptions_as_profile_facts
  units:
  - 02016R0679-20160504#parag_022.002
  - 02016R0679-20160504#point_022.002_a
  - 02016R0679-20160504#point_022.002_b
  - 02016R0679-20160504#point_022.002_c
