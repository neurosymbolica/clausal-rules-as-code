excluded_set:
- what: art11_2_identification_not_required
  instrument: Regulation (EU) 2016/679 Art 11(2)
  cites:
  - 02016R0679-20160504#parag_011.002
  reason: Art 12(2) refers to the cases of Art 11(2) (the controller does not need to identify the data subject). Not pinned; the key controller_demonstrates_unable_to_identify_data_subject presupposes such a case (reading 6).
  consequence: The caller states through controller_demonstrates_unable_to_identify_data_subject whether the controller can show it is not in a position to identify the data subject; the order does not check the Art 11(2) case itself.
- what: art13_art14_information_duties
  instrument: Regulation (EU) 2016/679 Arts 13 and 14
  cites:
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: Information provided when data are collected; Art 12 governs both, but this order is about the requests of Arts 15 to 22.
  consequence: The order does not test the information to be given when data are collected; a caller checks Arts 13 and 14 itself (see the sibling order gdpr-information-duties).
- what: art34_communication_of_a_breach
  instrument: Regulation (EU) 2016/679 Art 34
  cites:
  - 02016R0679-20160504#art_034
  reason: Art 12 also governs the communication under Art 34; the sibling eu/data-protection/gdpr-arts33-34-breach-notification owns it.
  consequence: The order does not test the communication of a breach to the data subject; a caller uses the sibling eu/data-protection/gdpr-arts33-34-breach-notification for it.
- what: art26_joint_controllers_and_art28_processors
  instrument: Regulation (EU) 2016/679 Arts 26 and 28
  cites:
  - 02016R0679-20160504#art_026
  - 02016R0679-20160504#art_028
  reason: Who answers a request when there are joint controllers or a processor is a separate question; not pinned (Q18).
  consequence: The order assumes the request reached the controller who must answer it; where there are joint controllers or a processor, the caller works out who answers under Arts 26 and 28 itself.
- what: art77_to_art79_remedies
  instrument: Regulation (EU) 2016/679 Arts 77 to 79
  cites:
  - 02016R0679-20160504#art_077
  - 02016R0679-20160504#art_078
  - 02016R0679-20160504#art_079
  reason: The complaint and judicial remedy that Art 12(4) requires the controller to mention are not formalized; the duty term names them only through its constructor.
  consequence: The order does not test whether a complaint or a judicial remedy is available or succeeds; a caller applies Arts 77 to 79 itself.
- what: art83_5_b_fines_for_breach_of_data_subject_rights
  instrument: Regulation (EU) 2016/679 Art 83(5)(b)
  cites:
  - 02016R0679-20160504#point_083.005_b
  reason: The consequence of failing a duty here is owned by the sibling eu/data-protection/gdpr-administrative-fine-maximum.
  consequence: The order says whether a duty is met, not what fine follows; a caller uses the sibling eu/data-protection/gdpr-administrative-fine-maximum for the maximum fine.
- what: regulatory_guidance
  instrument: EDPB Guidelines 01/2022 on data subject rights - right of access; Guidelines 4/2019 on Article 25; WP29 Guidelines on automated individual decision-making and on data portability
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  - 02016R0679-20160504#point_070.001_f
  reason: Soft law, not pinned, not quoted and relied on by no reading here (the 'provided by' scope of Art 20, the clock start, and the meaning of 'solely' in Art 22 are in the guidance and are open questions).
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance itself. A caller who relies on the guidance on access, portability or automated decisions reads it and applies it itself.
