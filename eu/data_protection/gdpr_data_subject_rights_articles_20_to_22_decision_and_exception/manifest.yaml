scope: "Regulation (EU) 2016/679 (GDPR), Arts 20 to 22 with the Art 12(2) second
  sentence, 12(5), 12(6) and the Art 23(1) restriction: for ONE data subject request
  whose request_type is portability (Art 20), objection (Art 21, claim-driven by
  objection_ground_claimed: art21_1, art21_2 or art21_6) or automated_decision
  (Art 22), decides whether the controller must comply (must_comply / need_not_comply,
  or the non-final statuses indeterminate, needs_legal_review, suspended under Art
  12(6), input_problems) and which exception relieves it (Art 20(3) second sentence,
  Art 20(4), Art 21(1) compelling grounds and legal claims, Art 21(6) public-interest
  task, Art 22(2)(a)-(c) subject to the Art 22(4) bar, Art 12(5), Art 12(2), Art 23).
  Out of scope: access, rectification, erasure and restriction (sibling order), the
  response period and the Art 19 communication, Art 12(3) and 12(4) response duties,
  the Art 23(1)(a)-(j) grounds and Art 23(2) content (attested outside fact), Art 20(2),
  Art 21(4)-(5), the adequacy of the Art 22(3) safeguards, and every open-textured
  judgement, which is handed to the user or a lawyer."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April
    2016 on the protection of natural persons with regard to the processing of personal
    data and on the free movement of such data (General Data Protection Regulation),
    OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504: Art 12(2), 12(5),
    12(6), Art 20(1), 20(3), 20(4), Art 21(1), 21(2), 21(3), 21(6), Art 22(1)-(4), Art
    23(1) opening words."

query_interface:
  2: "request_exception_status/2"      # status verdict: the exception that relieves, or none
  7: "request_exception_checklist/2"   # justification: one item per limb, each with cite(...)
  13: "request_decision/2"             # compliance_check: must the controller comply?
  16: "gdpr_data_subject_rights_articles_20_to_22_decision_and_exception_what_if/4"    # what_if: re-evaluate under an overridden key

