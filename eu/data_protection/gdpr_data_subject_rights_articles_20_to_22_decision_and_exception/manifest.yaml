independence: no_external_scorer

uses: []

scope: 'Whether a controller must comply with one data subject request of type portability (GDPR Art 20), objection (Art 21) or automated decision (Art 22), under Regulation (EU) 2016/679 Arts 12(2)-(6), 20(1),(3),(4), 21(1),(2),(3),(6), 22(1)-(4) and 23(1) opening words. Decided: engagement of the right, the first relieving exception (Art 12(5), Art 12(2), Art 23 and the specific ones), and the Art 12(6) identity suspension. Out of scope and handed to the lawyer or a sibling order: access, rectification, erasure and restriction requests, the response period, Art 20(2), Arts 21(4)-(5), the grounds and content rules of Art 23, and the lawfulness of the processing under Arts 6 and 9.'

sources:
  - 'Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: Art 12(2)-(6), Art 20(1),(3),(4), Art 21(1),(2),(3),(6), Art 22(1)-(4), Art 23(1) opening words'

query_interface:
  13: request_decision/2
  7: request_exception_checklist/2
  16: gdpr_data_subject_rights_articles_20_to_22_decision_and_exception_what_if/4

