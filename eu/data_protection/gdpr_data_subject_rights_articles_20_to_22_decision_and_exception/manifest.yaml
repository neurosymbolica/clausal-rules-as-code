- debt: true
  what: art20_1_engagement_conditions_as_profile_facts
  units:
  - 02016R0679-20160504#parag_020.001
  - 02016R0679-20160504#point_020.001_a
  - 02016R0679-20160504#point_020.001_b
  partial: true
  reason: The conditions of Art 20(1) (data provided by the data subject, processing
    based on consent or contract, processing by automated means) are read from three
    profile flags; the technical format and the transmission without hindrance are
    not scored.
  consequence: 'The answer takes the three Art 20(1) conditions as facts stated in
    the profile and does not check the structured, commonly used and machine-readable
    format or that the transmission to another controller is without hindrance: the
    caller checks those.'
  declaration: exception_modelled
  open: formalisable; to be formalised in a later change to the orders, not in this
