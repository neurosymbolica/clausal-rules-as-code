# Citation sourcing manifest for eu/data_protection/gdpr_data_subject_rights_articles_20_to_22_decision_and_exception.
# Instrument: Regulation (EU) 2016/679 (GDPR), CELEX 02016R0679-20160504 (consolidated text, in force from 2016-05-04).
# status: verified (verbatim is an exact substring of the pinned unit text at url)
# retrieved: 2026-11-09
eu_reg_2016_679_art_12_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "the controller shall not refuse to act on the request of the data subject for exercising his or her rights under Articles 15 to 22, unless the controller demonstrates that it is not in a position to identify the data subject"
  note: >-
    Art 12(2) second sentence: a demonstrated inability to identify the data subject relieves the controller.
eu_reg_2016_679_art_12_5:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "Where requests from a data subject are manifestly unfounded or excessive, in particular because of their repetitive character, the controller may either"
  note: >-
    Art 12(5): fee or refusal for manifestly unfounded or excessive requests; burden on the controller.
eu_reg_2016_679_art_12_6:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "where the controller has reasonable doubts concerning the identity of the natural person making the request referred to in Articles 15 to 21, the controller may request the provision of additional information necessary to confirm the identity of the data subject"
  note: >-
    Art 12(6): reasonable identity doubts; read here as a suspension of the duty and the clock.
eu_reg_2016_679_art_20_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "the right to receive the personal data concerning him or her, which he or she has provided to a controller, in a structured, commonly used and machine-readable format"
  note: >-
    Art 20(1): engagement of portability (provided data, consent or contract basis, automated means).
eu_reg_2016_679_art_20_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "That right shall not apply to processing necessary for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller."
  note: >-
    Art 20(3) second sentence: public task exception to portability.
eu_reg_2016_679_art_20_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "The right referred to in paragraph 1 shall not adversely affect the rights and freedoms of others."
  note: >-
    Art 20(4): rights and freedoms of others, read as a bar on the whole request (Q5).
eu_reg_2016_679_art_21_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "The data subject shall have the right to object, on grounds relating to his or her particular situation, at any time to processing of personal data concerning him or her which is based on point (e) or (f) of Article 6(1), including profiling based on those provisions."
  note: >-
    Art 21(1): engagement and the compelling-grounds and legal-claims exceptions.
eu_reg_2016_679_art_21_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "the data subject shall have the right to object at any time to processing of personal data concerning him or her for such marketing"
  note: >-
    Art 21(2): absolute right to object to direct marketing.
eu_reg_2016_679_art_21_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "the personal data shall no longer be processed for such purposes"
  note: >-
    Art 21(3): consequence of an objection to direct marketing.
eu_reg_2016_679_art_21_6:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "the data subject, on grounds relating to his or her particular situation, shall have the right to object to processing of personal data concerning him or her, unless the processing is necessary for the performance of a task carried out for reasons of public interest"
  note: >-
    Art 21(6): research or statistical processing; public-interest task exception.
eu_reg_2016_679_art_22_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "The data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her."
  note: >-
    Art 22(1): engagement of the automated decision right.
eu_reg_2016_679_art_22_2_a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "is necessary for entering into, or performance of, a contract between the data subject and a data controller"
  note: >-
    Art 22(2)(a): contract necessity exception.
eu_reg_2016_679_art_22_2_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "is authorised by Union or Member State law to which the controller is subject"
  note: >-
    Art 22(2)(b): authorisation by law; blocking outside fact, cited in a cross_reference_unresolved target.
eu_reg_2016_679_art_22_2_c:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "is based on the data subject's explicit consent"
  note: >-
    Art 22(2)(c): explicit consent exception.
eu_reg_2016_679_art_22_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "at least the right to obtain human intervention on the part of the controller, to express his or her point of view and to contest the decision"
  note: >-
    Art 22(3): the three safeguards carried as CONDITIONS for Art 22(2)(a) and (c).
eu_reg_2016_679_art_22_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "Decisions referred to in paragraph 2 shall not be based on special categories of personal data referred to in Article 9(1)"
  note: >-
    Art 22(4): special-category bar on all three Art 22(2) limbs.
eu_reg_2016_679_art_23_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "Union or Member State law to which the data controller or processor is subject may restrict by way of a legislative measure the scope of the obligations and rights provided for in Articles 12 to 22 and Article 34"
  note: >-
    Art 23(1) opening words only; points (a)-(j) and Art 23(2) are not formalized.
