# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. None: the domain imports only kit modules (formalize_lib).
uses: []

scope: "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504. Decided here: whether a controller must comply with ONE data subject request for ERASURE (request_type erasure only; split 2026-11-03 of the order gdpr-data-subject-rights): the engagement of the right under Art 17(1)(a)-(f) (BASIS the first met ground), the exceptions of Art 17(3)(a)-(e) (whole-request relief, Q5), the manifestly unfounded or excessive relief of Art 12(5) with the condition reasonable_fee_may_be_charged, the unable-to-identify relief of Art 12(2) second sentence, a legislative restriction under Art 23(1) (attested outside fact, blocking) and the Art 12(6) identity suspension (non-final). Out of scope: the other request types (sibling orders), the response period and duties of Art 12(3) and 12(4), Art 17(2), the grounds of Art 23(1)(a)-(j) and the content rules of Art 23(2). Open-textured judgements given as unsure and an unattested Art 17(1)(e) legal obligation are handed to a lawyer as needs_legal_review."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the processing of personal data and on the free movement of such data (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504; Art 12(2), Art 12(5), Art 12(6), Art 17(1), Art 17(3) and Art 23(1) opening words (Art 12(3) and Art 12(4) quoted for context and deferred)"

query_interface:
  7: "request_exception_checklist/2"   # justification: one item per exception and the suspension, each with cite(...)
  13: "gdpr_data_subject_rights_erasure_compliance_check/3"   # compliance_check: is a proposed controller action allowed
  16: "gdpr_data_subject_rights_erasure_what_if/4"    # what_if: re-evaluate under an overridden key

