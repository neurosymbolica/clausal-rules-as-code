- debt: true
  what: art17_2_inform_other_controllers
  units:
  - 02016R0679-20160504#parag_017.002
  reason: Where the controller made the data public and must erase, it shall take
    reasonable steps (taking account of available technology and cost) to inform controllers
    processing the data. A separate duty with its own reasonableness judgement; not
    scored.
  consequence: 'Where the controller must erase data it has made public, no answer
    includes the Art 17(2) duty to take reasonable steps to inform the other controllers
    processing the data of the erasure request: the caller checks whether the data
    were made public and what steps are reasonable, taking account of available technology
    and cost.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
