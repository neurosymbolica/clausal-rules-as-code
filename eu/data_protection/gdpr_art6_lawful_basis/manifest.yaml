  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_13
  - 02016R0679-20160504#point_004_14
  - 02016R0679-20160504#point_004_15
  - 02016R0679-20160504#point_004_16
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_17
  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_20
  - 02016R0679-20160504#point_004_21
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  reason: 'Art 4 is pinned whole because the smallest document element that contains
    Art 4(11) is the article. The other points define terms (personal data, processing,
    controller, third party, ...) that no step reads: the profile states the facts
    in those terms already.'
  consequence: Whether the data are personal data, and who is the controller or a
    third party, are not tested; the caller establishes them before relying on an
    answer.
  declaration: answered_with_caveat
  debt: true
  open: formalisable as definitions shared by the data-protection orders; the deferral
    stands for this run.
- what: art_4_11_consent_definition
  units:
  - 02016R0679-20160504#point_004_11
  reason: The definition of consent (freely given, specific, informed and unambiguous
    indication of the data subject's wishes) is carried by the attested statement
    consent_given_and_conditions_met; this order does not test it (reading (3), Q8).
  consequence: An eligible answer on point (a) rests on the host's statement that
    there is a consent; the order does not check that it is one.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a definitions order; the deferral stands for this run.
- what: art_6_2_member_state_specific_provisions
  units:
  - 02016R0679-20160504#parag_006.002
  reason: 'Art 6(2) lets Member States maintain or introduce more specific provisions
    for points (c) and (e): national law, not pinned.'
  consequence: No answer reads a Member State's specific provisions.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: art_6_3_rest_of_paragraph
  units:
  - 02016R0679-20160504#parag_006.003
  partial: true
  debt: true
  reason: Only the first sentence of Art 6(3) (the basis of points (c) and (e) shall
    be laid down by Union law or by Member State law to which the controller is subject)
    is read, as the outside facts legal_obligation_laid_down_by_law and public_interest_task_laid_down_by_law
    (reading (5)). The other sentences (the purpose determined in the legal basis
    or necessary for the task; the specific provisions the legal basis may contain;
    the law meeting an objective of public interest and being proportionate to the
    legitimate aim pursued) are not checked (Q2).
  consequence: An eligible answer on point (c) or (e) does not say that the law meets
    the other requirements of Art 6(3).
  declaration: answered_with_caveat
  open: formalisable as further outside facts; the deferral stands for this run.
- what: art_6_3_a_b_which_law
  units:
  - 02016R0679-20160504#point_006.003_a
  - 02016R0679-20160504#point_006.003_b
  debt: true
  reason: Art 6(3)(a) (Union law) and (b) (Member State law to which the controller
    is subject) are the two laws the outside facts of reading (5) name together; the
    order does not ask which of them lays the basis down.
  consequence: No answer says whether the basis is laid down by Union law or by Member
    State law.
  declaration: answered_with_caveat
  open: formalisable as a split of the two outside facts; the deferral stands for
    this run.
- what: art_6_4_first_words_route_keys
  units:
  - 02016R0679-20160504#parag_006.004
  partial: true
  debt: true
  reason: 'Art 6(4) first words: the two routes (based on the data subject''s consent;
    based on a Union or Member State law which constitutes a necessary and proportionate
    measure to safeguard the objectives of Art 23(1)) have no keys of their own; new_purpose_processing
    carries them (Q13, Q18). The route keys can change an answer, so absent cannot
    read as today; a later amendment.'
  consequence: The caller states the routes only through new_purpose_processing; no
    answer reads a route separately.
  declaration: answered_with_caveat
  open: formalisable as two route keys once a ruling says how an absent one reads;
    the deferral stands for this run.
- what: art_7_conditions_for_consent
  units:
  - 02016R0679-20160504#parag_007.001
  - 02016R0679-20160504#parag_007.002
  - 02016R0679-20160504#parag_007.003
  - 02016R0679-20160504#parag_007.004
  reason: The conditions for consent of Art 7 are decided by the order gdpr-consent-conditions;
    this order does not recompute them and reads only the host's attested statement
    consent_given_and_conditions_met (reading (3)).
  consequence: The caller runs the consent package and the host attests its answer.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-consent-conditions
- what: art_8_child_consent_information_society_services
  units:
  - 02016R0679-20160504#parag_008.001
  - 02016R0679-20160504#parag_008.002
  - 02016R0679-20160504#parag_008.003
  debt: true
  reason: 'Art 8 sets the conditions of a child''s consent in relation to information
    society services offered directly to a child (an age of 16, or a lower age not
    below 13 set by Member State law; consent given or authorised by the holder of
    parental responsibility; reasonable efforts to verify; no effect on contract law).
    It is pinned only so that it can be deferred: the order does not decide the age
    of a data subject and does not check Art 8 (Q9, Q10).'
  consequence: An eligible answer on point (a) does not check Art 8; where the processing
    concerns information society services offered directly to a child, the caller
    checks Art 8 before relying on it.
  declaration: answered_with_caveat
  open: formalisable with the consent package; the deferral stands for this run.
- what: art_9_special_categories
  units:
  - 02016R0679-20160504#parag_009.001
  - 02016R0679-20160504#parag_009.002
  - 02016R0679-20160504#point_009.002_a
  - 02016R0679-20160504#point_009.002_b
  - 02016R0679-20160504#point_009.002_c
  - 02016R0679-20160504#point_009.002_d
  - 02016R0679-20160504#point_009.002_e
  - 02016R0679-20160504#point_009.002_f
  - 02016R0679-20160504#point_009.002_g
  - 02016R0679-20160504#point_009.002_h
  - 02016R0679-20160504#point_009.002_i
  - 02016R0679-20160504#point_009.002_j
  - 02016R0679-20160504#parag_009.003
  - 02016R0679-20160504#parag_009.004
  debt: true
  reason: 'Art 9 (the prohibition of processing of special categories of personal
    data and its exceptions) is pinned only so that it can be deferred: the order
    does not decide it; the outside fact special_category is only flagged on an eligible
    answer (reading (8), Q11).'
  consequence: An eligible answer does not say that the processing of special categories
    is permitted; the caller checks Art 9 separately.
  declaration: answered_with_caveat
  open: formalisable in a special-categories order; the deferral stands for this run.

excluded_set:
- what: principle_of_lawfulness_fairness_transparency
  instrument: Regulation (EU) 2016/679 Art 5(1)(a)
  cites:
  - 02016R0679-20160504#point_005.001_a
  reason: The verdict is about Art 6 lawfulness only; the principle that personal
    data shall be processed lawfully, fairly and in a transparent manner is not pinned
    and not answered.
  consequence: An eligible answer does not say that the processing is fair or transparent.
- what: criminal_convictions_and_offences_data
  instrument: Regulation (EU) 2016/679 Art 10
  cites:
  - 02016R0679-20160504#art_010
  reason: Processing of personal data relating to criminal convictions and offences
    is outside the verdict; not pinned.
  consequence: An eligible answer does not say that Art 10 is met.
- what: transparency_and_information_duties
  instrument: Regulation (EU) 2016/679 Arts 12 to 14
  cites:
  - 02016R0679-20160504#art_012
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: The transparency and information duties are outside the verdict; not pinned.
  consequence: An eligible answer does not say that the data subject was informed.
- what: restrictions_of_article_23_1
  instrument: Regulation (EU) 2016/679 Art 23(1)
  cites:
  - 02016R0679-20160504#parag_023.001
  reason: Art 6(4) names a Union or Member State law which constitutes a necessary
    and proportionate measure to safeguard the objectives referred to in Art 23(1);
    Art 23(1) is not pinned, and the crisp key new_purpose_processing carries the
    condition.
  consequence: The caller decides whether the processing is based on such a law when
    it states new_purpose_processing.
