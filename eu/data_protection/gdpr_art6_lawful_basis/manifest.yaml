uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504, no date
  argument. Two bounded questions. (1) lawful_basis_status/4: whether one processing,
  described by one attribute-list profile, has a lawful basis under Art 6(1), and
  which of points (a) to (f) holds: point (a) read as the host's attested statement
  that consent was given with its conditions met (Art 7 is decided by the order
  gdpr-consent-conditions); points (b) to (e) as caller judgements of necessity;
  points (c) and (e) also need the attested statement that the basis is laid down by
  Union or Member State law (Art 6(3) first sentence); point (f) needs the caller's
  judgement of the legitimate interest and of the balance, and is barred for a public
  authority in its tasks (Art 6(1) last subparagraph). basis_claimed restricts the
  question to one point. (2) purpose_compatibility/4: the Art 6(4) compatibility test
  for processing for a new purpose, with the five factors of points (a) to (e) as
  optional crisp keys and the weighing left to the caller's judgement. Open-textured
  judgements are stated by the caller and an unsure one goes to a lawyer
  (needs_legal_review). Out of scope: compliance with the Regulation as a whole,
  Art 5(1)(a), Art 9 (special categories only flagged), Art 10, Arts 12 to 14, Art 8
  (a child only flagged in the balance of point (f)), Art 6(2), the rest of Art 6(3)
  and Art 23(1).

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated English Formex text 02016R0679-20160504: Art 6(1) first words, points (a) to (f) and last subparagraph; Art 6(3) first sentence; Art 6(4) first words and points (a) to (e)"
  - "Regulation (EU) 2016/679, consolidated text 02016R0679-20160504: Art 9(1) (flagged only); Art 4(11), Art 6(2), Art 6(3)(a) and (b), Art 7(1) to (4), Art 8(1) to (3) and Art 9 (pinned and deferred)"

query_interface:
  2: "lawful_basis_status/4"                 # eligibility: eligible | ineligible | status compound, cited
  3: "purpose_compatibility/4"               # status determination: Art 6(4) compatibility status
  7: "gdpr_art6_lawful_basis_checklist/2"    # justification: one cited item per considered way
  16: "gdpr_art6_lawful_basis_what_if/4"     # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_006
  - 02016R0679-20160504#art_007
  - 02016R0679-20160504#art_008
  - 02016R0679-20160504#art_009
  reason: 'The titles of Articles 4, 6, 7, 8 and 9 (with the lead-in ''For the purposes
    of this Regulation:'' of Art 4) carry no rule: document structure. Deferred so
    every unit of the pinned extract is accounted for.'
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: art_4_other_definitions
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
