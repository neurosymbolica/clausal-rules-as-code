scope: "GDPR Article 35, split order of 2026-11-03 as amended 2026-11-18. Entry A (decide_impact_assessment_duty/2) decides whether a data protection impact assessment is required (Art 35(1) on the user's stated high-risk judgement, the always-required cases of Art 35(3)(a)-(c), the supervisory authority lists of Art 35(4) and (5) as attested outside facts, and the Art 35(10) legal-basis exemption, which outranks every trigger) and, when it is required, which Art 35(7)(a)-(d) minimum contents are missing. Entry O (impact_assessment_officer_advice/2) decides whether a controller that carried out an assessment and has designated a data protection officer sought that officer's advice (Art 35(2)). Open-textured judgements are the user's and an unsure one is referred to a lawyer; an absent Member State decision under Art 35(10) is referred as an unresolved cross-reference. Out of scope: prior consultation (Art 36), the proof routes, assessment bases and status queries of the sibling split orders, whether an officer had to be designated (Art 37), the competent authority (Arts 55, 56), the content of national lists or laws, and Art 35(8), (9) and (11)."

sources:
  - "Regulation (EU) 2016/679 [quotation omitted] 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, consolidated text 02016R0679-20160504: Article 35(1), (2), (3)(a)-(c), (4), (5), (7)(a)-(d) and (10)"
  - "Regulation (EU) 2016/679 Article 4(4) (definition of profiling), used for reasoning only, never cited in a verdict"
  - "Supervisory authority lists under Article 35(4) and (5): Datenschutzkonferenz (de_dsk) items 1-17, Irish Data Protection Commission (ie_dpc) items 1-10, CNIL (fr_cnil) Art 35(4) and Art 35(5) lists, as attested national list item facts"

