  - 02016R0679-20160504#point_004_20
  - 02016R0679-20160504#point_004_21
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  reason: 'Art 4 is pinned whole because the smallest document element that contains
    Art 4(4) is the article. Only point (4), profiling, is read (it explains the flag
    automated_evaluation_including_profiling). The other points define terms (personal
    data, processing, controller, processor, consent, personal data breach, ...) that
    no limb reads: the profile states the facts in those terms already.'
  consequence: whether the data is personal data and who the controller is are not
    tested. The caller must establish both itself (Art 4(1) and Art 4(7)) before relying
    on any answer.
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: consistency_mechanism_for_lists
  units:
  - 02016R0679-20160504#parag_035.006
  reason: Art 35(6) binds the supervisory authority when it adopts the lists of Art
    35(4) and (5); it does not change what the controller must do. The lists are outside
    facts.
  consequence: 'None for a caller: Art 35(6) binds the supervisory authority; the
    caller attests the Art 35(4) or (5) list as the authority published it.'
  declaration: not_an_exception
  not_formalized_because: institutional
- debt: true
  what: codes_of_conduct_and_views_and_review
  units:
  - 02016R0679-20160504#parag_035.008
  - 02016R0679-20160504#parag_035.009
  - 02016R0679-20160504#parag_035.011
  reason: Art 35(8) (due account of approved codes of conduct), 35(9) (views of data
    subjects where appropriate) and 35(11) (review when the risk changes) are conduct
    duties in carrying out and maintaining an assessment; none decides whether an
    assessment or a consultation is required.
  consequence: The answers do not check Art 35(8) codes of conduct, Art 35(9) views
    of data subjects or the Art 35(11) review; an empty list of missing contents covers
    Art 35(7) only, so the caller must check those duties itself and review the assessment
    when the risk changes.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- not_formalized_because: in_sibling
  decided_in: gdpr-art6-lawfulness
  what: art6_lawful_basis
  instrument: Regulation (EU) 2016/679 Art 6(1)(c) and (e)
  reason: Art 35(10) refers to [quotation omitted]
    [quotation omitted]); whether the processing rests on those points is the crisp flag lawful_basis_is_legal_obligation_or_public_task,
    determined by the sibling eu/data-protection/gdpr-art6-lawfulness.
  consequence: The order takes lawful_basis_is_legal_obligation_or_public_task as
    stated; the caller must establish under Art 6(1)(c) or (e) itself (for example
    with the sibling Article 6 order) whether the processing rests on those points,
    because the flag decides whether the Art 35(10) exemption can apply.
  declaration: exception_modelled
- not_formalized_because: in_sibling
  decided_in: gdpr-special-categories
  what: special_categories_and_criminal_data_meaning
  instrument: Regulation (EU) 2016/679 Arts 9(1) and 10
  reason: Art 35(3)(b) refers to them; whether the data is of those kinds is the crisp
    flags special_category_data_processed and criminal_offence_data_processed (sibling
    eu/data-protection/gdpr-special-categories).
  consequence: The order takes special_category_data_processed and criminal_offence_data_processed
    as stated; the caller must decide under Art 9(1) and Art 10 itself whether the
    data is of those kinds, collapsing any judgement of the sibling special-categories
    order to true or false first.
  declaration: exception_modelled
- not_formalized_because: institutional
  what: member_state_and_authority_law_content
  instrument: Union and Member State law and supervisory authority lists referred
    to in Art 35(4), (5), (10) and Art 36(5)
  reason: The existence of the list or law as it applies to this processing is an
    outside fact (attested; fetcher none); its content is not formalized here.
  consequence: The caller must find the supervisory authority list or the Union or
    Member State law itself and attest whether it applies to this processing; the
    answer copies the attestation and never checks the content of the list or law.
  declaration: exception_modelled
- debt: true
  what: profiling_definition_read_through_the_flag
  units:
  - 02016R0679-20160504#point_004_4
  reason: 'Art 4(4) defines profiling; the order uses it for reasoning only and never
    cites it in a verdict (reading (11)). No limb tests the definition: whether the
    evaluation is automated processing including profiling is the crisp flag automated_evaluation_including_profiling,
    stated by the caller in the sense of Art 4(4).'
  consequence: The answers do not check whether the processing meets the Art 4(4)
    definition of profiling; the caller must apply Art 4(4) itself before setting
    automated_evaluation_including_profiling.
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.

excluded_set:
- what: recitals_and_guidelines
  instrument: Regulation (EU) 2016/679 recitals and supervisory-authority or Board
    guidelines on impact assessments
  cites:
  - 32016R0679#rct_84
  - 32016R0679#rct_89
  - 32016R0679#rct_90
  - 32016R0679#rct_91
  - 32016R0679#rct_92
  - 32016R0679#rct_93
  - 32016R0679#rct_94
  - 32016R0679#rct_95
  - 32016R0679#rct_96
  - 02016R0679-20160504#parag_070.001
  reason: No recital and no guideline is pinned, so none is quoted or cited. They
    bear on what a high risk, a large scale and a residual risk are; that is why those
    are judgements.
  consequence: The order gives no test of high risk, large scale or residual risk;
    the caller states those judgements itself, reading the recitals and any list or
    guidelines of the supervisory authority or the Board.
- what: competence_and_powers
  instrument: Regulation (EU) 2016/679 Arts 55, 56, 58, 63, 68
  cites:
  - 02016R0679-20160504#art_055
  - 02016R0679-20160504#art_056
  - 02016R0679-20160504#art_058
  - 02016R0679-20160504#art_063
  - 02016R0679-20160504#art_068
  reason: Which authority is competent for the lists, its powers after a consultation,
    the consistency mechanism and the Board are not pinned. The authority whose list
    is meant is named in the attestation of the outside fact.
  consequence: The order does not identify the competent supervisory authority or
    say what it may do after a consultation; a caller works out competence, powers
    and the consistency mechanism under Arts 55, 56, 58, 63 and 68 itself.
