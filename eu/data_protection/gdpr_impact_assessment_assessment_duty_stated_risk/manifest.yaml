  16: "gdpr_impact_assessment_assessment_duty_stated_risk_what_if/4"           # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_035
  reason: 'The titles of Articles 4 and 35 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- debt: true
  what: definitions_not_applied
  units:
