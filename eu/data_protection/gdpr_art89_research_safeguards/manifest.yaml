  - "kernel"
  - "citations"
  - "parameters"
  - "safeguards_status"
  - "queries"
  - "fixtures"
# public_interface: name/arity PREDICATES only (atoms need no export), grouped
# per submodule -- keep in sync with the :- module(...) export lists re-exported
# via the package facade __init__.clausal (regenerate from _tools/gen_interface_catalog.py).
public_interface:
  # -- kernel.clausal --
  # (gdpr_art89_research_safeguards_input_problems/2 is listed under queries.clausal)
  # -- citations.clausal --
  - "citation/2"
  # -- safeguards_status.clausal --
  - "decide_safeguards/2"
  - "safeguards_status/2"
  - "unmet_requirements/2"
  - "decide_safeguards_status/2"
  - "safeguards_status_status/2"
  - "safeguards_status_checklist/2"
  - "safeguards_status_decision_resolvable/1"
  - "safeguards_status_status_values/1"
  # -- queries.clausal --
  - "gdpr_art89_research_safeguards_profile_keys/1"
  - "gdpr_art89_research_safeguards_input_problems/2"
  - "gdpr_art89_research_safeguards_what_if/4"
  - "gdpr_art89_research_safeguards_justification/2"
  - "gdpr_art89_research_safeguards_compliance_check/2"
  - "gdpr_art89_verdict/3"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "open_textured/2"
