  - "gdpr_art89_research_safeguards_assess/2"

# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This package imports only formalize_lib (a kit module, not a
# backbone package).
uses: []

scope: "Regulation (EU) 2016/679 (GDPR) Art 89(1): whether processing for archiving in the public interest, scientific or historical research, or statistical purposes is subject to appropriate safeguards. Decides four requirements (technical and organisational measures, minimisation measures, the identification requirement of the fourth sentence, and appropriateness of the safeguards) by strong Kleene logic, with the two judgements (non_identifying_processing_sufficient, safeguards_appropriate) handed to the user as needs_legal_review. Pseudonymisation (third sentence) permits and requires nothing and is not read. Out of scope: the derogations of Art 89(2) to (4) (Union or Member State law), the lawfulness basis of the processing, and any purpose other than the four named ones (reported as not_applicable)."

sources:
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), Art 89(1), unit 02016R0679-20160504#parag_089.001, consolidated text in force from 2016-05-04"

query_interface:
  3: "safeguards_status/2"
  7: "gdpr_art89_research_safeguards_justification/2"
  13: "gdpr_art89_research_safeguards_compliance_check/2"
  16: "gdpr_art89_research_safeguards_what_if/4"

deferred_set:
- what: article_heading
  units:
  - 02016R0679-20160504#art_089
  reason: 'The title of Article 89 carries no obligation: document structure, not
    operative law. Deferred so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- debt: true
  what: art89_2_to_4_derogations_by_union_or_member_state_law
  units:
  - 02016R0679-20160504#parag_089.002
  - 02016R0679-20160504#parag_089.003
  - 02016R0679-20160504#parag_089.004
  reason: Art 89(2) to (4) let Union or Member State law provide derogations from
    the rights in Articles 15, 16, 18, 19, 20 and 21; whether a derogation exists
    and what it provides is national or Union law that this order does not carry.
    The conditions they put on a derogation (the safeguards of paragraph 1, impossibility
    or serious impairment, necessity) are applied by that law.
  consequence: 'The answer tests the safeguards of Art 89(1) only: it does not say
    whether a derogation from any right exists; the caller must check the Union or
    Member State law itself.'
  declaration: exception_modelled
  open: formalisable; the content of each derogation is Union or Member State law
    (a sourced table of national provisions is the intended shape, with German BDSG
    s27(2) first sentence and s28(2)-(4) and Austrian FOG s2d(6) as the first rows);
    the EU-level conditions (impossibility or serious impairment, necessity, the safeguards
    of paragraph 1) can be formalised; to be done in a later change, not in this order's
    rules; the deferral stands for this run.
