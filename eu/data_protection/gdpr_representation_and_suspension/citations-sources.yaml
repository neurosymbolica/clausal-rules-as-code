eu_reg_2016_679_art_80_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_080.001"
  retrieved: 2026-11-20
  note: >-
    Art 80(1): the data subject may mandate a not-for-profit body, properly
    constituted under Member State law, with public-interest statutory
    objectives and active in data protection, to lodge the complaint and
    exercise the rights of Arts 77, 78 and 79, and the Art 82 compensation
    right where provided for by Member State law. Anchors mandated_representation.
eu_reg_2016_679_art_80_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_080.002"
  retrieved: 2026-11-20
  note: >-
    Art 80(2): Member States may provide that such a body, independently of a
    mandate, may lodge an Art 77 complaint and exercise the Art 78 and 79
    rights if it considers the data subject's rights infringed by the
    processing. Anchors representation_without_mandate.
eu_reg_2016_679_art_81_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_081.001"
  retrieved: 2026-11-20
  note: >-
    Art 81(1): a competent court with information on proceedings on the same
    subject matter as regards processing by the same controller or processor
    pending in another Member State shall contact that court. Anchors
    court_contact_duty.
eu_reg_2016_679_art_81_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_081.002"
  retrieved: 2026-11-20
  note: >-
    Art 81(2): any competent court other than the court first seized may
    suspend its proceedings. Anchors court_suspension_option.
eu_reg_2016_679_art_81_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_081.003"
  retrieved: 2026-11-20
  note: >-
    Art 81(3): where those proceedings are pending at first instance, any
    court other than the court first seized may, on a party's application,
    decline jurisdiction if the court first seized has jurisdiction and its
    law permits consolidation. Anchors court_declining_jurisdiction_option.
