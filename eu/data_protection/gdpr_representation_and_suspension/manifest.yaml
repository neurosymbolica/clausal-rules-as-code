# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only kit modules (formalize_lib,
# library(reif)), no shared backbone package.
uses: []

scope: "Regulation (EU) 2016/679 (GDPR) Art 80 (representation of data subjects) and
  Art 81 (suspension of proceedings), from the pinned text of 02016R0679-20160504 only.
  Decided here: whether a not-for-profit body, organisation or association may act on
  a data subject mandate for one of the four actions Art 80(1) names (mandated_representation);
  whether such a body may act without a mandate where a Member State has so provided
  (representation_without_mandate, Art 80(2)); whether a competent court must contact
  the court of another Member State (court_contact_duty, Art 81(1)); whether a court
  other than the court first seized may suspend its proceedings (court_suspension_option,
  Art 81(2)) or decline jurisdiction (court_declining_jurisdiction_option, Art 81(3)).
  Out of scope: whether the data subject has the rights of Arts 77, 78, 79 or 82 (sibling
  orders gdpr-complaints-and-judicial-remedies and gdpr-compensation-and-liability);
  the law of the Member States on the constitution of bodies, mandates, compensation
  claims, competence, seising, jurisdiction and consolidation, read only as attested
  outside facts or caller statements and never decided; how a court should use its
  options. The open-textured words properly constituted, public interest, active in
  the field and same subject matter are the caller's judgements; unsure is referred
  to a lawyer."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April
    2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, consolidated
    text 02016R0679-20160504: Art 80(1) [parag_080.001], Art 80(2) [parag_080.002],
    Art 81(1) [parag_081.001], Art 81(2) [parag_081.002], Art 81(3) [parag_081.003]"

query_interface:
  2: "gdpr_representation_and_suspension_status/2"      # eligibility: the verdict (may / may not; duty applies / does not; option available / not) or a status compound
  7: "gdpr_representation_and_suspension_checklist/2"   # justification: one item per condition read, each with cite(...) provenance
  16: "gdpr_representation_and_suspension_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_080
  - 02016R0679-20160504#art_081
  not_formalized_because: structural
  reason: 'The titles of Articles 80 and 81 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception

excluded_set:
- what: the_data_subject_rights_exercised
  instrument: Regulation (EU) 2016/679 Arts 77, 78 and 79
  cites:
  - 02016R0679-20160504#art_077
  - 02016R0679-20160504#art_078
  - 02016R0679-20160504#art_079
  reason: Not pinned here. Whether the data subject has the right to lodge a complaint
    (Art 77) or a judicial remedy (Arts 78, 79) is decided by gdpr-complaints-and-judicial-remedies;
    Art 80 lets a body exercise those rights for the data subject and this order reads
    only Art 80 (reading (1)).
  consequence: The answers of mandated_representation and representation_without_mandate
    never say that the right exists; the caller asks gdpr-complaints-and-judicial-remedies.
- what: the_right_to_compensation
  instrument: Regulation (EU) 2016/679 Art 82
  cites:
  - 02016R0679-20160504#art_082
  reason: Not pinned here. Whether the data subject has a right to receive compensation
    is decided by gdpr-compensation-and-liability; Art 80(1) lets a mandated body
    exercise it where Member State law provides (reading (4)).
  consequence: may_act_on_mandate for the compensation action never says that compensation
    is owed.
- what: competence_of_courts_and_procedural_law
  instrument: Regulation (EU) 2016/679 Art 79(2), and the procedural law of the Member
    States
  cites:
  - 02016R0679-20160504#parag_079.002
  reason: Not pinned here. Which courts are competent (Art 79(2) and national rules),
    when a court is seized, and whether the law of the court first seized permits
    consolidation are not read; the order takes the caller's statements court_is_competent_court
    and court_is_court_first_seized and the attested outside facts court_first_seized_has_jurisdiction_over_the_actions
    and law_of_court_first_seized_permits_consolidation (readings (7), (10), (11)).
  consequence: Competence, seising, jurisdiction and consolidation are never decided
    by this order.
