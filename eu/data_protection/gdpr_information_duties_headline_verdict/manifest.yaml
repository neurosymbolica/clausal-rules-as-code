  - information_outside_facts/2
  - decide_information_duty_verdict/2
  - information_duty_verdict_status/2
  - information_duty_verdict_checklist/2
  - information_duty_verdict_decision_resolvable/1
  - information_duty_verdict_status_values/1
  # -- queries.clausal --
  - gdpr_information_duties_headline_verdict_profile_keys/1
  - gdpr_information_duties_headline_verdict_input_problems/2
  - gdpr_information_duties_headline_verdict_what_if/4
  - gdpr_information_duties_headline_verdict_compliance_check/3
  - gdpr_information_duties_headline_verdict_obligations/2
  - gdpr_information_duties_headline_verdict_deadline/2
