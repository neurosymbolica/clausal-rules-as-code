  - outside_fact/2
  - attested/2
  - attestation/4
  - provenance/2
  - url/2
  - document/2
  # -- fixtures.clausal --
  - gdpr_information_duties_headline_verdict_subject/1
  - gdpr_information_duties_headline_verdict_profile_for/2
  - gdpr_information_duties_headline_verdict_assess/2

# Independence classification: no external scorer yet.
independence: no_external_scorer

uses: []

scope: 'The headline question of the GDPR information duties: given a profile of one processing situation, is the controller''s duty to inform the data subject satisfied or disapplied (eligible) or not (ineligible) under Regulation (EU) 2016/679 Arts 13 and 14, with the route (Art 13 or Art 14), the items owed and missing, the deadline (Art 13(1) at collection; Art 14(3) earliest of one month by Regulation 1182/71 Art 3, first communication, first disclosure), further processing (Arts 13(3), 14(4)), the already-has exemption (Arts 13(4), 14(5)(a)) and the Art 14(5)(b), (c), (d) exemptions. Also answers information_duty_exemption/2 and information_outside_facts/2 and the input check. Out of scope, handed to the lawyer or a sibling order: the adequacy of the content of an item given, Art 12 modalities, Art 22, Arts 6, 7 and 9 lawfulness, Art 89 safeguards, remedies and fines.'

sources:
  - 'Regulation (EU) 2016/679 (GDPR), consolidated text of 2016-05-04 with the 2018 corrigendum, Arts 13(1)-(4), 14(1)-(5), and definitions Art 4(1), (4), (7), (9)'
  - 'Regulation (EEC, Euratom) No 1182/71, OJ L 124, 8.6.1971 (CELEX 31971R1182), Art 3(1), 3(2)(c), 3(4), applied to the GDPR periods'

query_interface:
  2: information_duty_verdict/3
  13: gdpr_information_duties_headline_verdict_compliance_check/3
  14: gdpr_information_duties_headline_verdict_obligations/2
  15: gdpr_information_duties_headline_verdict_deadline/2
  16: gdpr_information_duties_headline_verdict_what_if/4

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: 'The titles of Articles 4, 13 and 14 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: art4_definitions_used_for_reasoning
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_9
  reason: 'Quoted above for the terms data subject (Art 4(1)), profiling (Art 4(4),
    inside the automated decision-making item), controller (Art 4(7)) and recipient
    (Art 4(9), whose exception for public authorities in a particular inquiry bounds
    recipients_exist). No limb reads them: the profile states the facts in those terms
    already.'
  consequence: whether data is personal data, who is the controller and whether a
    body is a recipient are not tested. The caller must establish them under Art 4(1),
    (7) and (9) itself before stating the profile, in particular recipients_exist.
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art4_definitions_not_read
  units:
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_5
  - 02016R0679-20160504#point_004_6
  - 02016R0679-20160504#point_004_8
  - 02016R0679-20160504#point_004_10
  - 02016R0679-20160504#point_004_11
  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_13
  - 02016R0679-20160504#point_004_14
  - 02016R0679-20160504#point_004_15
  - 02016R0679-20160504#point_004_16
  - 02016R0679-20160504#point_004_17
  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_20
  - 02016R0679-20160504#point_004_21
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  reason: Art 4 is pinned whole because the smallest document element that contains
    Art 4(1), (4), (7) and (9) is the article. The other definitions (processing,
    restriction, pseudonymisation, filing system, processor, third party, consent,
    personal data breach, genetic, biometric and health data, main establishment,
    representative, enterprise, group, binding corporate rules, supervisory authority
    and the rest) are read by no limb. Consent as such is reached through the crisp
    flag processing_based_on_consent.
  consequence: 'None for a caller: no answer turns on these definitions; consent reaches
    the order only as the flag processing_based_on_consent, which the caller states.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art13_1_a_representative_detail
  units:
  - 02016R0679-20160504#point_013.001_a
  partial: true
  reason: 'Formalized as the controller_identity_and_contact_details item. The words
    "and, where applicable, of the controller''s representative" are inside the item:
    whether the controller has a representative (Art 27) is not tested, and a provided
    item counts as complete (open question Q11).'
  consequence: 'A missing representative is not detected: where the controller must
    designate a representative under Art 27, the caller must check itself that the
    notice gives the representative''s identity and contact details, since a provided
    controller_identity_and_contact_details item counts as complete.'
  declaration: answered_with_caveat
- what: art14_5_b_archiving_research_and_art89_conditions
  units:
  - 02016R0679-20160504#point_014.005_b
  partial: true
  reason: Formalized through the judgement provision_impossible_or_disproportionate_effort
    and the flag protective_measures_taken. The archiving, scientific or historical
    research and statistical purposes and the Art 89(1) conditions and safeguards
    are inside the judgement; Art 89 is not pinned.
  consequence: The answer takes provision_impossible_or_disproportionate_effort as
    the caller's judgement; for archiving, research or statistical processing the
    caller must check the Art 89(1) conditions and safeguards itself before judging
    it true.
  declaration: exception_modelled
- what: art14_3_a_specific_circumstances
  units:
  - 02016R0679-20160504#point_014.003_a
  partial: true
  reason: Formalized as the one-month outer limit (exact) and the judgement provided_within_reasonable_period.
    The words "having regard to the specific circumstances in which the personal data
    are processed" are inside the judgement.
  consequence: The answer takes provided_within_reasonable_period as the caller's
    judgement and checks only the one-month outer limit; the caller must weigh the
    specific circumstances of the processing under Art 14(3)(a) itself before judging
    it.
  declaration: exception_modelled
- what: regulation_1182_71_article_headings
  units:
  - 31971R1182#art_002
  - 31971R1182#art_003
  - 31971R1182#art_004
  - 31971R1182#art_005
  reason: 'The titles of Articles 2 to 5 of Regulation (EEC, Euratom) No 1182/71 carry
    no rule: document structure, not operative law. Deferred so every unit of the
    pinned extracts is accounted for.'
  consequence: 'None for a caller: an article title carries no rule.'
  declaration: not_an_exception
- what: regulation_1182_71_article_1_scope
  units:
  - 31971R1182#art_001
  reason: Article 1 limits Regulation (EEC, Euratom) No 1182/71 to acts of the Council
    or Commission; Regulation (EU) 2016/679 is an act of the European Parliament and
    of the Council. This order applies Article 3 to the periods of Regulation (EU)
    2016/679 by analogy (a lawyer point, see PERIODS), so no rule reads Article 1.
  consequence: 'Every deadline this order gives rests on applying Article 3 of Regulation
    (EEC, Euratom) No 1182/71 to Regulation (EU) 2016/679, which Article 1 of that
    Regulation does not itself provide: a caller that relies on the date accepts that
    reading, or computes the period under the rule it holds applicable.'
  declaration: answered_with_caveat
- what: regulation_1182_71_article_2_public_holidays_and_working_days
  units:
  - 31971R1182#parag_002.001
  - 31971R1182#parag_002.002
  reason: 'Article 2(1) defines public holidays as the days designated as such in
    the Member State or in the Community institution in which action is to be taken,
    as published by the Commission in the Official Journal; Article 2(2) defines working
    days as all days other than public holidays, Sundays and Saturdays. This order
    chooses no Member State or institution and reads no published list: public holidays
    arrive as the outside fact public_holidays, and PERIODS states the working day
    of the Article 3(4) shift itself.'
  consequence: The caller attests in public_holidays the public holidays of the Member
    State or Community institution in which the action is to be taken (Article 2(1));
    a public holiday missing from that list, or an absent list, leaves a deadline
    that falls on that day unmoved, one working day early.
  declaration: answered_with_caveat
- what: regulation_1182_71_article_3_rules_not_applied
  units:
  - 31971R1182#parag_003.002
  - 31971R1182#point_003.002_a
  - 31971R1182#point_003.002_b
  - 31971R1182#point_003.002_d
  - 31971R1182#parag_003.003
  - 31971R1182#parag_003.005
  reason: The periods of this order are expressed in months and run from an event,
    so they read only Article 3(1), second subparagraph, Article 3(2)(c) and Article
    3(4) (PERIODS). The opening words of Article 3(2) only make point (c) subject
    to paragraphs 1 and 4, which is how PERIODS applies them; points (a), (b) and
    (d) govern periods expressed in hours, in days and in parts of months; Article
    3(3) (Saturdays, Sundays and public holidays count within a period) holds by construction
    in a count of calendar months; Article 3(5) (a period of two days or more includes
    at least two working days) is not applied.
  consequence: 'None for a caller: no period of this order is expressed in hours,
    in days or in parts of months, and a period of a month or more holds the two working
    days of Article 3(5).'
  declaration: not_an_exception
- what: regulation_1182_71_articles_4_and_5_acts_and_specified_dates
  units:
  - 31971R1182#parag_004.001
  - 31971R1182#parag_004.002
  - 31971R1182#parag_004.003
  - 31971R1182#parag_005.001
  - 31971R1182#parag_005.002
  reason: 'Article 4 governs the entry into force, taking effect, application and
    expiry of acts of the Council or Commission; Article 5 governs an action to be
    effected at a specified moment or date in implementation of such an act. No period
    of this order is either: each runs from an event (PERIODS).'
  consequence: 'None for a caller: no answer of this order concerns the entry into
    force or expiry of an act, or an action fixed at a specified moment or date.'
  declaration: not_an_exception
- what: already_has_the_information_and_exemption_chapeau
  units:
  - 02016R0679-20160504#parag_013.004
  - 02016R0679-20160504#parag_014.005
  - 02016R0679-20160504#point_014.005_a
  partial: true
  reason: Art 13(4), the Art 14(5) chapeau and Art 14(5)(a) are applied through the
    list items_data_subject_already_has (an item in it is covered and never missing)
    and through the evaluation of points (b), (c), (d) in the exemption slice. They
    are not decided by a separate rule of their own that the citation gate can attribute
    to the unit.
  consequence: The list items_data_subject_already_has is the controller's statement
    of fact and is not proved (open question Q7); the exemptions of points (b), (c),
    (d) are all-or-nothing, not item by item (open question Q6).
  declaration: answered_with_caveat

excluded_set:
- what: transparent_information_and_modalities
  instrument: Regulation (EU) 2016/679 Art 12
  cites:
  - 02016R0679-20160504#art_012
  reason: Art 12 (concise, transparent, intelligible and easily accessible form; clear and plain language; free of charge; standardised icons) governs HOW the information is given. It is pinned for the sibling data-subject-rights order, not here.
  consequence: The form of the notice is not tested; an item "provided" in an unreadable notice counts as provided.
- what: automated_decision_making_rules
  instrument: Regulation (EU) 2016/679 Art 22
  cites:
  - 02016R0679-20160504#parag_022.001
  - 02016R0679-20160504#parag_022.004
  reason: Not pinned. Whether a decision is within Art 22(1) and (4) arrives as the judgement automated_decision_making_under_article_22.
  consequence: The order does not test whether a decision falls within Art 22(1) or (4); the caller decides and states automated_decision_making_under_article_22.
- what: lawful_basis_and_consent_conditions
  instrument: Regulation (EU) 2016/679 Arts 6, 7 and 9
  cites:
  - 02016R0679-20160504#art_006
  - 02016R0679-20160504#art_007
  - 02016R0679-20160504#art_009
  reason: Whether processing rests on Art 6(1)(f), Art 6(1)(a) or Art 9(2)(a) is stated by the caller (processing_based_on_legitimate_interests, processing_based_on_consent); whether the basis is valid is the question of the sibling orders gdpr-art6-lawfulness and gdpr-special-categories.
  consequence: The order does not test whether the stated basis is valid; a caller checks lawfulness and consent under Arts 6, 7 and 9 with the sibling orders gdpr-art6-lawfulness and gdpr-special-categories.
- what: research_archiving_safeguards
  instrument: Regulation (EU) 2016/679 Art 89(1)
  cites:
  - 02016R0679-20160504#parag_089.001
  reason: Not pinned; folded into the judgement provision_impossible_or_disproportionate_effort.
  consequence: The order does not test the Art 89(1) safeguards; a caller who relies on research or archiving checks them itself before stating provision_impossible_or_disproportionate_effort.
- what: information_rights_of_the_data_subject_and_remedies
  instrument: Regulation (EU) 2016/679 Arts 15-22, 77-84
  cites:
  - 02016R0679-20160504#art_015
  - 02016R0679-20160504#art_016
  - 02016R0679-20160504#art_017
  - 02016R0679-20160504#art_018
  - 02016R0679-20160504#art_019
  - 02016R0679-20160504#art_020
  - 02016R0679-20160504#art_021
  - 02016R0679-20160504#art_022
  - 02016R0679-20160504#art_077
  - 02016R0679-20160504#art_078
  - 02016R0679-20160504#art_079
  - 02016R0679-20160504#art_080
  - 02016R0679-20160504#art_081
  - 02016R0679-20160504#art_082
  - 02016R0679-20160504#art_083
  - 02016R0679-20160504#art_084
  reason: The rights whose existence the data_subject_rights item announces, and the remedies for a breach of Arts 13 and 14 (including the administrative fine of Art 83(5)(b), see the sibling order gdpr-administrative-fine-maximum), are separate questions.
  consequence: The order says whether the information duties are met, not what rights or remedies follow; a caller applies Arts 15 to 22 and 77 to 84 itself, and the sibling gdpr-administrative-fine-maximum for the fine.
- what: regulatory_guidance
  instrument: Article 29 Working Party Guidelines on transparency (WP260 rev.01) as endorsed by the EDPB
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  reason: Soft law, not pinned and not quoted; named as the authority of the Q1 ruling (reading 4, the earliest date binds). Reading (5) and Q5 are where it would also matter.
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance itself. A caller who relies on the guidance beyond the earliest-date ruling reads it and applies it itself.
