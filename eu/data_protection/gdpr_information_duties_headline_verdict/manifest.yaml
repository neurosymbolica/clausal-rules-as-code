# Shared backbone packages imported (kit modules are not backbone packages).
uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR) Articles 13 and 14, headline part of the split
  gdpr-information-duties order: whether the controller's duty to inform the data
  subject is satisfied or disapplied for one processing situation
  (information_duty_verdict/3), whether an Art 14(5)(b), (c) or (d) exemption applies
  (information_duty_exemption/2), and which outside facts were attested
  (information_outside_facts/2), with the shared input check. The headline is built
  internally from the route (Art 13 or Art 14), the items owed and missing (Art 13(1),
  13(2), 14(1), 14(2), with Art 13(4) and 14(5)(a) item by item), the timing (Art 13(1)
  at obtaining; Art 14(3) earliest applicable limb, the one-month limb computed under
  Regulation (EEC, Euratom) No 1182/71 Art 3 with attested public holidays) and further
  processing (Art 13(3), 14(4)). Open-textured questions (automated decision-making
  under Art 22, reasonable period, impossibility or disproportionate effort, relevance
  of paragraph-2 information) are the user's judgements and refer to a lawyer when
  unsure. Out of scope: the content adequacy of an item, Art 12 modalities, the
  validity of the lawful basis (Arts 6, 7, 9), Art 22 and Art 89 themselves, rights and
  remedies (Arts 15-22, 77-84), and the per-relation answers of the sibling parts.

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council (GDPR), OJ L 119, 4.5.2016, consolidated text 02016R0679-20160504 with the 2018 corrigendum: Art 4(1), (4), (7), (9) (definitions, reasoning only); Art 13(1)-(4); Art 14(1)-(5)"
  - "Regulation (EEC, Euratom) No 1182/71 determining the rules applicable to periods, dates and time limits, OJ L 124, 8.6.1971 (CELEX 31971R1182): Art 2(2), Art 3(1) second subparagraph, Art 3(2)(c), Art 3(4), applied to the GDPR by the PERIODS ruling (G4, 2026-11-01)"

query_interface:
  2: "information_duty_verdict/3"                                   # eligibility: headline verdict with cited checklist
  13: "gdpr_information_duties_headline_verdict_compliance_check/3"  # compliance check: is a proposed provision/start allowed
  14: "gdpr_information_duties_headline_verdict_obligations/2"       # obligation surfacing: what the controller must still do
  15: "gdpr_information_duties_headline_verdict_deadline/2"          # deadline: last timely day, binding limb, consequence
  16: "gdpr_information_duties_headline_verdict_what_if/4"           # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
