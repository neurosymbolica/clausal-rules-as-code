uses: []

scope: "Regulation (EU) 2016/679 (GDPR) Art 4, points (7), (8), (13), (14), (15),
  (16), (18), (19), (22), (23) and (24): given one profile of facts about one situation,
  whether each defined term is met (controller, processor, genetic data, biometric
  data, data concerning health, main establishment, enterprise, group of undertakings,
  supervisory authority concerned, cross-border processing, relevant and reasoned
  objection), with personal data (Art 4(1)) carried as one judgement and the one
  outside fact of Art 4(7) (law providing for the controller) read as an attested
  value. Open-textured judgements are the user's; an unsure judgement or an absent
  outside fact that decides is referred for legal review. Out of scope: whether any
  obligation applies or which supervisory authority leads; points 4(17), 4(20) and
  4(21) (deferred; 4(20) in the sibling order gdpr-binding-corporate-rules) and the
  other points of Art 4 (sibling order gdpr-common-definitions-data-and-processing)."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April
    2016 on the protection of natural persons with regard to the processing of personal
    data and on the free movement of such data (General Data Protection Regulation),
    OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504 with the 2018
    corrigendum; Art 4 points (1) (reasoning only), (7), (8), (13), (14), (15), (16)(a)-(b),
    (18), (19), (22)(a)-(c), (23)(a)-(b) and (24)"

query_interface:
  3: "gdpr_common_definitions_roles_and_establishments_status/2"      # status_determination: every definition's definition_answer
  7: "gdpr_common_definitions_roles_and_establishments_checklist/2"   # justification: one item per definition with cite(...) provenance
  16: "gdpr_common_definitions_roles_and_establishments_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: art_4_17_representative
  units:
  - 02016R0679-20160504#point_004_17
  reason: 'The operative content of 4(17) is a designation in writing pursuant to
    Article 27, which is not pinned here; without it a relation would only restate
    who the caller says was designated. No order decides 4(17) itself: the sibling
    order gdpr-territorial-material-scope pins Article 27 and reads the designation,
    but does not formalise 4(17).'
  consequence: The order does not say whether a person is a representative; the caller
    checks the designation under Article 27, for example with gdpr-territorial-material-scope.
  declaration: not_an_exception
  debt: true
  open: 'formalisable once Article 27 is pinned here or a sibling relation may be
    called; the deferral stands for this run (open question Q13). Amended 2026-11-18:
    a debt row, since no sibling order decides 4(17).'
- what: art_4_20_binding_corporate_rules
  units:
  - 02016R0679-20160504#point_004_20
  reason: Art 4(20) is formalised in the sibling order gdpr-binding-corporate-rules
    (binding_corporate_rules_definition/3, the seven elements of the definition);
    no relation of this order reads it, and binding corporate rules serve the transfer
    rules of Chapter V, which are not pinned here.
  consequence: The order does not say whether policies are binding corporate rules;
    the caller checks 4(20) with the sibling order gdpr-binding-corporate-rules (binding_corporate_rules_definition/3).
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-binding-corporate-rules
- what: art_4_21_supervisory_authority
  units:
  - 02016R0679-20160504#point_004_21
  reason: Whether a body is a supervisory authority turns on its establishment by
    a Member State pursuant to Article 51 and on its independence, neither pinned
    here; it is a fact about which bodies Member States set up, not a structure in
    the text. 4(22) takes the authority asked about to be one (reading (8)).
  consequence: The order does not say whether a body is a supervisory authority; the
    caller establishes it.
  declaration: not_an_exception
  not_formalized_because: national_law
  open: formalisable as an outside fact; the deferral stands for this run (open question
    Q13).
- what: points_disposed_of_in_gdpr_common_definitions_data_and_processing
  units:
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_5
  - 02016R0679-20160504#point_004_6
  - 02016R0679-20160504#point_004_9
  - 02016R0679-20160504#point_004_10
  - 02016R0679-20160504#point_004_11
  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-common-definitions-data-and-processing
  reason: formalized in gdpr-common-definitions-data-and-processing, the other half
    of the Art 4 definitions; one disposition per point across the two orders. Point
    (1) is NOT listed here, because this order formalizes it as the one judgement
    key data_are_personal_data
  consequence: This order gives no answer for these points; the caller uses gdpr-common-definitions-data-and-processing.
- what: article_heading_and_chapeau
  units:
  - 02016R0679-20160504#art_004
  declaration: not_an_exception
  not_formalized_because: structural
  reason: the title and chapeau of Art 4 are document structure, not a rule
  consequence: None; every point is disposed of in one of the two definition orders.

excluded_set:
- what: articles_referred_to_by_deferred_definitions
  instrument: Regulation (EU) 2016/679 Arts 27 and 51
  cites:
