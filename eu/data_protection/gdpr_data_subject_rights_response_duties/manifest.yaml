uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: for one
  request by a data subject under Art 15 (access), 16 (rectification), 17 (erasure),
  18 (restriction), 20 (portability), 21 (objection) or 22 (automated decision),
  this order decides internally whether the controller must comply (the right is
  engaged under Art 15(1), 16, 17(1), 18(1), 20(1), 21(1), (2) or (6), or 22(1);
  no exception of Art 17(3), 20(3) second sentence, 20(4), 21(1), 21(6), 22(2)
  read with 22(4), 12(5), 12(2) or 23(1) relieves it; Art 12(6) suspends the duty
  while the identity is unconfirmed) and answers three queries: the deadline of
  the response (request_response_deadline/2: one month from receipt, or three
  months from receipt when an extension is claimed and necessary, Art 12(3);
  one month for a refusal, Art 12(4); computed by Regulation (EEC, Euratom)
  No 1182/71 Art 3(1), 3(2)(c) and 3(4), applied to the GDPR as a lawyer point,
  with attested public holidays), the response duties (response_duties/2, Art
  12(3) and 12(4)) and the Art 19 communication to recipients
  (recipient_notification/2). Open-textured judgements are the user's (unsure
  refers to a lawyer); Union or Member State law arrives as attested outside
  facts. Out of scope: the content of the answer (Art 15(1)(a)-(h), 15(2)-(4)),
  Art 17(2), Arts 18(2)-(3), 20(2), 21(4)-(5), the grounds and content of an
  Art 23 measure, Arts 13, 14, 34, joint controllers and processors, remedies
  and fines (see deferred_set and excluded_set).

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, consolidated text 02016R0679-20160504: Art 12(2) to 12(6), Art 15(1) opening words, Art 16, Art 17(1) and 17(3), Art 18(1), Art 19, Art 20(1), 20(3) and 20(4), Art 21(1), 21(2), 21(3) and 21(6), Art 22(1) to 22(4), Art 23(1) opening words"
  - "Regulation (EEC, Euratom) No 1182/71 of the Council of 3 June 1971 determining the rules applicable to periods, dates and time limits, OJ L 124, 8.6.1971, p. 1 (CELEX 31971R1182): Art 2(2), Art 3(1) second subparagraph, Art 3(2)(c), Art 3(4)"

query_interface:
  2: "gdpr_data_subject_rights_response_duties_status/2"      # status of the internal decision
  14: "response_duties/2"                                    # obligation_surfacing: what the controller must do (Art 12(3), 12(4)); see also recipient_notification/2 (Art 19)
  15: "request_response_deadline/2"                          # deadline: when the response is due (Art 12(3), 12(4); Reg 1182/71 Art 3)
  16: "gdpr_data_subject_rights_response_duties_what_if/4"    # what_if: re-evaluate under an overridden key

