# Independence classification: no external scorer yet -- the only check is a
# same-author differential one.
independence: no_external_scorer

# No shared backbone package is imported.
uses: []

scope: 'Regulation (EU) 2016/679 Arts 13 and 14 (items part of the split order): which route applies (Art 13 data collected from the data subject, Art 14 not obtained from the data subject), the checklist of information items owed (Art 13(1), 13(2), 14(1), 14(2)) once each conditional item''s condition is applied, the items still missing given the items provided and the items the data subject already has (Art 13(4), 14(5)(a)), and the further-processing verdict for another purpose (Art 13(3), 14(4)): information on the other purpose and any relevant paragraph-2 information strictly before the further processing. Out of scope (sibling parts or lawyer): the Art 14(3) deadline, the timing verdict, the Art 14(5)(b)-(d) exemptions, the headline verdict, the adequacy of the content of an item given, Art 12 modalities, Art 22.'

sources:
  - 'Regulation (EU) 2016/679 (GDPR) Art 13(1)-(4), consolidated text in force from 2016-05-04'
  - 'Regulation (EU) 2016/679 (GDPR) Art 14(1), (2), (4), (5)(a)-(d), consolidated text in force from 2016-05-04'
  - 'Regulation (EU) 2016/679 (GDPR) Art 4(1), (4), (7), (9) (definitions, used for reasoning only)'

query_interface:
  2: 'further_processing_information_verdict_status/2'
  13: 'gdpr_information_duties_items_and_further_processing_compliance_check/3'
  14: 'gdpr_information_duties_items_and_further_processing_obligations/2'
  15: 'gdpr_information_duties_items_and_further_processing_deadline/2'
  16: 'gdpr_information_duties_items_and_further_processing_what_if/4'

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: 'The titles of Articles 4, 13 and 14 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: art4_definitions_used_for_reasoning
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_9
  reason: 'Quoted above for the terms data subject (Art 4(1)), profiling (Art 4(4),
    inside the automated decision-making item), controller (Art 4(7)) and recipient
    (Art 4(9), whose exception for public authorities in a particular inquiry bounds
    recipients_exist). No limb reads them: the profile states the facts in those terms
    already.'
  consequence: whether data is personal data, who is the controller and whether a
    body is a recipient are not tested. The caller must establish them under Art 4(1),
    (7) and (9) itself before stating the profile, in particular recipients_exist.
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art4_definitions_not_read
  units:
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_5
  - 02016R0679-20160504#point_004_6
  - 02016R0679-20160504#point_004_8
  - 02016R0679-20160504#point_004_10
  - 02016R0679-20160504#point_004_11
  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_13
  - 02016R0679-20160504#point_004_14
  - 02016R0679-20160504#point_004_15
  - 02016R0679-20160504#point_004_16
  - 02016R0679-20160504#point_004_17
  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_20
  - 02016R0679-20160504#point_004_21
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  reason: Art 4 is pinned whole because the smallest document element that contains
    Art 4(1), (4), (7) and (9) is the article. The other definitions (processing,
    restriction, pseudonymisation, filing system, processor, third party, consent,
    personal data breach, genetic, biometric and health data, main establishment,
    representative, enterprise, group, binding corporate rules, supervisory authority
    and the rest) are read by no limb. Consent as such is reached through the crisp
    flag processing_based_on_consent.
  consequence: 'None for a caller: no answer turns on these definitions; consent reaches
    the order only as the flag processing_based_on_consent, which the caller states.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art13_1_a_representative_detail
  units:
  - 02016R0679-20160504#point_013.001_a
  partial: true
  reason: 'Formalized as the controller_identity_and_contact_details item. The words
    "and, where applicable, of the controller''s representative" are inside the item:
    whether the controller has a representative (Art 27) is not tested, and a provided
    item counts as complete (open question Q11).'
  consequence: 'A missing representative is not detected: where the controller must
    designate a representative under Art 27, the caller must check itself that the
    notice gives the representative''s identity and contact details, since a provided
    controller_identity_and_contact_details item counts as complete.'
  declaration: answered_with_caveat
- what: regulation_1182_71_not_applied_by_this_order
  units:
  - 31971R1182#art_001
  - 31971R1182#art_002
  - 31971R1182#parag_002.001
  - 31971R1182#parag_002.002
  - 31971R1182#art_003
  - 31971R1182#parag_003.001
  - 31971R1182#parag_003.002
  - 31971R1182#point_003.002_a
  - 31971R1182#point_003.002_b
  - 31971R1182#point_003.002_c
  - 31971R1182#point_003.002_d
  - 31971R1182#parag_003.003
  - 31971R1182#parag_003.004
  - 31971R1182#parag_003.005
  - 31971R1182#art_004
  - 31971R1182#parag_004.001
  - 31971R1182#parag_004.002
  - 31971R1182#parag_004.003
  - 31971R1182#art_005
  - 31971R1182#parag_005.001
  - 31971R1182#parag_005.002
  reason: 'Regulation (EEC, Euratom) No 1182/71 is pinned for the one-month limit
    of Article 14(3)(a). This order answers no date: its relations are information_route/2,
    information_items_owed/2, information_items_missing/2 and further_processing_information_verdict/3,
    and public_holidays is checked by the input check and read by no relation. No
    rule reads any article of the Regulation.'
  consequence: 'None for a caller of this order: it gives no deadline. A caller that
    needs the Article 14(3)(a) date computes it under Article 3 of Regulation (EEC,
    Euratom) No 1182/71 itself.'
  declaration: not_an_exception
- what: already_has_the_information_exemption_applied_through_item_lists
  units:
  - 02016R0679-20160504#parag_013.004
  - 02016R0679-20160504#point_014.005_a
  reason: 'Art 13(4) and Art 14(5)(a) (the data subject already has the information)
    are applied item by item through the profile list items_data_subject_already_has:
    an item in that list is covered like an item provided and is never missing, and
    it also covers the further-processing items. The list is the controller''s statement
    of fact (open question Q7); no separate citation key of the order is cited for
    these two units.'
  consequence: Whether the data subject really has the information is not proved or
    tested; the caller states the items and must establish for itself that the data
    subject already holds them.
  declaration: answered_with_caveat
  open: formalisable; the exemption is applied by the item-list coverage test, not
    by a clause citing these units; the deferral stands for this run.
- what: art14_3_deadline_sibling_part
  units:
  - 02016R0679-20160504#parag_014.003
  - 02016R0679-20160504#point_014.003_a
  - 02016R0679-20160504#point_014.003_b
  - 02016R0679-20160504#point_014.003_c
  reason: The Art 14(3) deadline (reasonable period, at the latest within one month;
    first communication; first disclosure) is answered by the sibling timing part
    of the split order, not by this part.
  consequence: This order gives no Art 14(3) deadline; a caller takes it from the
    sibling timing part.
  declaration: answered_with_caveat
  open: formalisable; answered by the sibling part gdpr-information-duties-timing.
- what: art14_5_exemptions_b_to_d_sibling_part
  units:
  - 02016R0679-20160504#parag_014.005
  - 02016R0679-20160504#point_014.005_b
  - 02016R0679-20160504#point_014.005_c
  - 02016R0679-20160504#point_014.005_d
  reason: The Art 14(5) chapeau and the exemptions of points (b)-(d) (impossible or
    disproportionate effort, laid down by law, professional secrecy) are answered
    by the sibling parts; this part reads only point (a), the data subject already
    has the information.
  consequence: This order does not test the Art 14(5)(b)-(d) exemptions; a caller
    applies them through the sibling parts.
  declaration: answered_with_caveat
  open: formalisable; answered by the sibling parts of the split order.

excluded_set:
- what: transparent_information_and_modalities
  instrument: Regulation (EU) 2016/679 Art 12
  cites:
  - 02016R0679-20160504#art_012
  reason: Art 12 (concise, transparent, intelligible and easily accessible form; clear
    and plain language; free of charge; standardised icons) governs HOW the information
    is given. It is pinned for the sibling data-subject-rights order, not here.
  consequence: The form of the notice is not tested; an item "provided" in an unreadable
    notice counts as provided.
- what: automated_decision_making_rules
  instrument: Regulation (EU) 2016/679 Art 22
  cites:
  - 02016R0679-20160504#parag_022.001
  - 02016R0679-20160504#parag_022.004
  reason: Not pinned. Whether a decision is within Art 22(1) and (4) arrives as the
    judgement automated_decision_making_under_article_22.
  consequence: The order does not test whether a decision falls within Art 22(1) or
    (4); the caller decides and states automated_decision_making_under_article_22.
- what: lawful_basis_and_consent_conditions
  instrument: Regulation (EU) 2016/679 Arts 6, 7 and 9
  cites:
  - 02016R0679-20160504#art_006
  - 02016R0679-20160504#art_007
  - 02016R0679-20160504#art_009
  reason: Whether processing rests on Art 6(1)(f), Art 6(1)(a) or Art 9(2)(a) is stated
    by the caller (processing_based_on_legitimate_interests, processing_based_on_consent);
    whether the basis is valid is the question of the sibling orders gdpr-art6-lawfulness
    and gdpr-special-categories.
  consequence: The order does not test whether the stated basis is valid; a caller
    checks lawfulness and consent under Arts 6, 7 and 9 with the sibling orders gdpr-art6-lawfulness
    and gdpr-special-categories.
- what: information_rights_of_the_data_subject_and_remedies
  instrument: Regulation (EU) 2016/679 Arts 15-22, 77-84
  cites:
  - 02016R0679-20160504#art_015
  - 02016R0679-20160504#art_016
  - 02016R0679-20160504#art_017
  - 02016R0679-20160504#art_018
  - 02016R0679-20160504#art_019
  - 02016R0679-20160504#art_020
  - 02016R0679-20160504#art_021
  - 02016R0679-20160504#art_022
  - 02016R0679-20160504#art_077
  - 02016R0679-20160504#art_078
  - 02016R0679-20160504#art_079
  - 02016R0679-20160504#art_080
  - 02016R0679-20160504#art_081
  - 02016R0679-20160504#art_082
  - 02016R0679-20160504#art_083
  - 02016R0679-20160504#art_084
  reason: The rights whose existence the data_subject_rights item announces, and the
    remedies for a breach of Arts 13 and 14 (including the administrative fine of
    Art 83(5)(b), see the sibling order gdpr-administrative-fine-maximum), are separate
    questions.
  consequence: The order says whether the information duties are met, not what rights
    or remedies follow; a caller applies Arts 15 to 22 and 77 to 84 itself, and the
    sibling gdpr-administrative-fine-maximum for the fine.
