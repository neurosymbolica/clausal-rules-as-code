  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  reason: 'Art 4 is pinned whole. Its points define terms (personal data, processing,
    restriction of processing, profiling, controller, recipient, consent, special
    categories ...) that no limb reads: the profile states the facts in those terms
    already, so no definition is applied or cited (reading 17).'
  consequence: 'The answer takes the profile''s facts as already stated in the Art
    4 terms (personal data, processing, controller, recipient, consent, profiling
    and the others) and applies no definition: the caller checks that what it supplies
    fits those definitions, for example that the data are personal data and that the
    addressee of the request is the controller.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art12_1_form_of_communication
  units:
  - 02016R0679-20160504#parag_012.001
  reason: The duty to give information in a concise, transparent, intelligible and
    easily accessible form, in writing or orally, is a quality-of-communication duty;
    the profile carries no input for it.
  consequence: the caller checks the form of the answer.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art12_2_first_sentence_facilitate
  units:
  - 02016R0679-20160504#parag_012.002
  partial: true
  reason: The first sentence of Art 12(2) (the controller shall facilitate the exercise
    of the rights) is a general duty, not a condition scored. The second sentence
    is in scope (reading 6).
  consequence: 'No answer tests whether the controller facilitates the exercise of
    the rights (Art 12(2), first sentence), for example by offering a usable way to
    make a request: the caller checks that general duty itself.'
  declaration: not_an_exception
- what: art12_3_electronic_means
  units:
  - 02016R0679-20160504#parag_012.003
  partial: true
  reason: The last sentence of Art 12(3) (where the request is made by electronic
    form means, the information shall be provided by electronic means where possible)
    is a modality of the answer; not scored. The first three sentences are in scope
    (readings 2 and 3).
  consequence: 'No answer says how the information is to be delivered: where the request
    was made by electronic form means, the caller checks that the information is provided
    by electronic means where possible, unless the data subject asked otherwise (Art
    12(3), last sentence).'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-response-period
- what: art12_5_fee_amount
  units:
  - 02016R0679-20160504#point_012.005_a
  - 02016R0679-20160504#point_012.005_b
  reason: Point (a) (a reasonable fee taking into account administrative costs) and
    point (b) (refuse to act) are the two alternatives of the Art 12(5) relief; the
    order reports the relief and the fee option as the CONDITIONS item reasonable_fee_may_be_charged
    (reading 5, Q4 RULED), not the controller's choice between them.
  consequence: 'The answer does not say whether the controller charges a reasonable
    fee (Art 12(5)(a)) or refuses to act (Art 12(5)(b)), nor what fee is reasonable:
    the caller decides that choice and checks that any fee reflects the administrative
    costs of the information, communication or action.'
  declaration: exception_modelled
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  name_placeholder: unused
- what: art12_7_and_12_8_icons
  units:
  - 02016R0679-20160504#parag_012.007
  - 02016R0679-20160504#parag_012.008
  reason: 'Standardised icons for Arts 13 and 14 information, and the delegated act
    on them: not a data subject request under Arts 15-22.'
  consequence: 'None for a caller: the standardised icons of Art 12(7) and the delegated
    acts of Art 12(8) concern Arts 13 and 14 information, not a request under Arts
    15 to 22.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art23_1_grounds_of_restriction
  units:
  - 02016R0679-20160504#point_023.001_a
  - 02016R0679-20160504#point_023.001_b
  - 02016R0679-20160504#point_023.001_c
  - 02016R0679-20160504#point_023.001_d
  - 02016R0679-20160504#point_023.001_e
  - 02016R0679-20160504#point_023.001_f
  - 02016R0679-20160504#point_023.001_g
  - 02016R0679-20160504#point_023.001_h
  - 02016R0679-20160504#point_023.001_i
  - 02016R0679-20160504#point_023.001_j
  reason: 'The ten grounds (national security, defence, public security, criminal
    law enforcement, other important public interests, judicial independence, regulated
    professions ethics, official-authority monitoring, protection of the data subject
    or others, civil law claims) that a restriction must safeguard are not formalized:
    whether a restriction applies is the OUTSIDE FACT legislative_restriction_applies_to_the_right.'
  consequence: 'The grounds of Art 23(1)(a) to (j) are not checked: a restriction
    arrives only as the attested outside fact legislative_restriction_applies_to_the_right,
    so the caller, or whoever attests it, checks that the restricting measure safeguards
    one of those grounds. Without an attestation no restriction is assumed.'
  declaration: exception_modelled
  not_formalized_because: national_law
- what: art23_2_content_of_a_restricting_measure
  units:
  - 02016R0679-20160504#parag_023.002
  - 02016R0679-20160504#point_023.002_a
  - 02016R0679-20160504#point_023.002_b
  - 02016R0679-20160504#point_023.002_c
  - 02016R0679-20160504#point_023.002_d
  - 02016R0679-20160504#point_023.002_e
  - 02016R0679-20160504#point_023.002_f
  - 02016R0679-20160504#point_023.002_g
  - 02016R0679-20160504#point_023.002_h
  reason: The specific provisions any restricting legislative measure shall contain
    (purposes, categories of data, scope, safeguards, controllers, storage periods,
    risks, the right to be informed) are conditions on the Union or Member State measure,
    not on the controller; they are part of what the outside fact stands for.
  consequence: 'The answer does not check that the restricting Union or Member State
    measure contains what Art 23(2) requires (purposes, categories of data, scope,
    safeguards, storage periods, the right to be informed and the rest): whoever attests
    legislative_restriction_applies_to_the_right checks it, and the caller relies
    on that attestation.'
  declaration: exception_modelled
  not_formalized_because: national_law
- what: art23_1_chapeau_essence_and_proportionality
  units:
  - 02016R0679-20160504#parag_023.001
  partial: true
  reason: The words 'respects the essence of the fundamental rights and freedoms and
    is a necessary and proportionate measure in a democratic society' (Art 23(1))
    and the extent to which the restriction reaches Arts 12-22, Art 34 and Art 5 are
    assessed by whoever attests the outside fact; not formalized.
  consequence: 'The answer does not assess whether a restriction respects the essence
    of the fundamental rights and is necessary and proportionate, or how far it reaches
    the right invoked (Art 23(1)): the caller relies on whoever attests legislative_restriction_applies_to_the_right
    to have checked that.'
  declaration: exception_modelled
- what: art22_3_safeguards_content
  units:
  - 02016R0679-20160504#parag_022.003
  partial: true
  reason: The CONTENT of the safeguards (human intervention, express point of view,
    contest) is carried as the CONDITIONS atoms; their adequacy is not assessed.
  consequence: 'The answer does not check that the Art 22(3) safeguards (at least
    human intervention, the data subject''s point of view and a way to contest the
    decision) are actually in place or adequate when the decision relies on Art 22(2)(a)
    or (c): the caller checks that.'
  declaration: exception_modelled
- what: art6_art9_lawfulness_and_special_categories
  instrument: Regulation (EU) 2016/679 Arts 6 and 9
  reason: whether the processing is lawful or rests on a given basis is the work of
    the siblings eu/data-protection/gdpr-art6-lawfulness and eu/data-protection/gdpr-special-categories;
    this order takes the answer as a profile fact (personal_data_unlawfully_processed,
    consent_is_the_basis_of_processing, processing_based_on_art6_1_e_or_f)
  consequence: 'The answer takes whether the processing is lawful, and on which Art
    6 or Art 9 basis it rests, as facts stated in the profile: the caller establishes
    those facts under Arts 6 and 9 before relying on the answer.'
  declaration: exception_modelled
- what: art12_4_reasons_for_not_acting
  units:
  - 02016R0679-20160504#parag_012.004
  reason: The duty to inform the data subject, within one month, of the reasons for
    not taking action and of the possibility of a complaint and a judicial remedy
    concerns the content and timing of the controller's reply; this order decides
    only whether the controller must comply, and the profile carries no input for
    the reply.
  consequence: 'The answer does not say whether the controller has informed the data
    subject of the reasons for not acting, of the complaint to a supervisory authority
    or of the judicial remedy, nor whether it did so within one month: the caller
    checks that itself.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-response-period
- what: art22_4_special_category_bar_content
  units:
  - 02016R0679-20160504#parag_022.004
  partial: true
  reason: The bar of Art 22(4) is applied through the profile facts decision_based_on_special_categories
    and special_category_condition_and_safeguards_met_for_decision; whether Art 9(2)(a)
    or (g) really applies and whether the safeguards are suitable is not assessed
    here.
  consequence: 'The answer takes the fact that an Art 9(2)(a) or (g) condition applies
    and that suitable safeguards are in place as stated in the profile: the caller
    checks that under Art 9 and Art 22(4) before relying on the answer.'
  declaration: exception_modelled

excluded_set:
- what: art11_2_identification_not_required
  instrument: Regulation (EU) 2016/679 Art 11(2)
  cites:
  - 02016R0679-20160504#parag_011.002
  reason: Art 12(2) refers to the cases of Art 11(2) (the controller does not need
    to identify the data subject). Not pinned; the key controller_demonstrates_unable_to_identify_data_subject
    presupposes such a case (reading 6).
  consequence: The caller states through controller_demonstrates_unable_to_identify_data_subject
    whether the controller can show it is not in a position to identify the data subject;
    the order does not check the Art 11(2) case itself.
- what: art13_art14_information_duties
  instrument: Regulation (EU) 2016/679 Arts 13 and 14
  cites:
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: Information provided when data are collected; Art 12 governs both, but this
    order is about the requests of Arts 15 to 22.
  consequence: The order does not test the information to be given when data are collected;
    a caller checks Arts 13 and 14 itself (see the sibling order gdpr-information-duties).
- what: art34_communication_of_a_breach
  instrument: Regulation (EU) 2016/679 Art 34
  cites:
  - 02016R0679-20160504#art_034
  reason: Art 12 also governs the communication under Art 34; the sibling eu/data-protection/gdpr-arts33-34-breach-notification
    owns it.
  consequence: The order does not test the communication of a breach to the data subject;
    a caller uses the sibling eu/data-protection/gdpr-arts33-34-breach-notification
    for it.
- what: art26_joint_controllers_and_art28_processors
  instrument: Regulation (EU) 2016/679 Arts 26 and 28
  cites:
  - 02016R0679-20160504#art_026
  - 02016R0679-20160504#art_028
  reason: Who answers a request when there are joint controllers or a processor is
    a separate question; not pinned (Q18).
  consequence: The order assumes the request reached the controller who must answer
    it; where there are joint controllers or a processor, the caller works out who
    answers under Arts 26 and 28 itself.
- what: art77_to_art79_remedies
  instrument: Regulation (EU) 2016/679 Arts 77 to 79
  cites:
  - 02016R0679-20160504#art_077
  - 02016R0679-20160504#art_078
  - 02016R0679-20160504#art_079
  reason: The complaint and judicial remedy that Art 12(4) requires the controller
    to mention are not formalized; the duty term names them only through its constructor.
  consequence: The order does not test whether a complaint or a judicial remedy is
    available or succeeds; a caller applies Arts 77 to 79 itself.
- what: art83_5_b_fines_for_breach_of_data_subject_rights
  instrument: Regulation (EU) 2016/679 Art 83(5)(b)
  cites:
  - 02016R0679-20160504#point_083.005_b
  reason: The consequence of failing a duty here is owned by the sibling eu/data-protection/gdpr-administrative-fine-maximum.
  consequence: The order says whether a duty is met, not what fine follows; a caller
    uses the sibling eu/data-protection/gdpr-administrative-fine-maximum for the maximum
    fine.
- what: regulatory_guidance
  instrument: EDPB Guidelines 01/2022 on data subject rights - right of access; Guidelines
    4/2019 on Article 25; WP29 Guidelines on automated individual decision-making
    and on data portability
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  - 02016R0679-20160504#point_070.001_f
  reason: Soft law, not pinned, not quoted and relied on by no reading here (the 'provided
    by' scope of Art 20, the clock start, and the meaning of 'solely' in Art 22 are
    in the guidance and are open questions).
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance
    itself. A caller who relies on the guidance on access, portability or automated
    decisions reads it and applies it itself.
