  - "citations"
  - "parameters"
  - "request_basis"
  - "queries"
  - "fixtures"
public_interface:
  # -- kernel.clausal --
  - "gdpr_data_subject_rights_automated_decision_input_problems/2"
  # -- citations.clausal --
  - "citation/2"
  # -- request_basis.clausal --
  - "decide_data_subject_request/2"
  - "request_basis/2"
  - "decide_request_basis/2"
  - "request_basis_status/2"
  - "request_basis_checklist/2"
  - "request_basis_decision_resolvable/1"
  - "request_basis_status_values/1"
  - "gdpr_data_subject_request_verdict/5"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "open_textured/2"
  - "inputs_relied_on/1"
  - "provenance/2"
  - "suspended/1"
  - "input_problems/1"
  - "unknown_key/1"
  - "wrong_type/1"
  - "duplicate_key/1"
  - "attested/2"
  - "attestation/4"
  - "url/2"
  - "document/2"
  # -- queries.clausal --
  - "gdpr_data_subject_rights_automated_decision_profile_keys/1"
  - "gdpr_data_subject_rights_automated_decision_what_if/4"
  # -- fixtures.clausal --
  - "gdpr_data_subject_rights_automated_decision_subject/1"
  - "gdpr_data_subject_rights_automated_decision_profile_for/2"
  - "gdpr_data_subject_rights_automated_decision_assess/2"

independence: no_external_scorer

uses: []

scope: "Whether a controller must comply with a data subject's request invoking the right not to be subject to a decision based solely on automated processing (GDPR Art 22(1)-(4)), with the Art 12(2), 12(5), 12(6) identity and manifestly-unfounded rules and the Art 23(1) legislative restriction. Decides engagement, exceptions (Art 22(2)(a)-(c), special-category bar), suspension for unconfirmed identity, and referral of open-textured judgements. Out of scope: other request types, response periods and deadlines, fees, Art 23 grounds and content, Arts 6 and 9 lawfulness (handed to the lawyer or a sibling domain)."

sources:
  - "Regulation (EU) 2016/679 (GDPR), Art 12(2), 12(3), 12(4), 12(5), 12(6)"
  - "Regulation (EU) 2016/679 (GDPR), Art 22(1), 22(2), 22(3), 22(4)"
  - "Regulation (EU) 2016/679 (GDPR), Art 23(1) (opening words)"

query_interface:
  2: "request_basis_status/2"
  7: "request_basis_checklist/2"
  13: "decide_data_subject_request/2"
  16: "gdpr_data_subject_rights_automated_decision_what_if/4"

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_012
  - 02016R0679-20160504#art_022
  - 02016R0679-20160504#art_023
  reason: 'The titles of Articles 4, 12, 22, 23 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: the article titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: definitions_not_applied
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
