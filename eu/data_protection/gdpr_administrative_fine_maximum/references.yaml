  text_sha256: 1a0823a7804ac7661d3bd437d79c4336ae00c088c4fded26e78773b8c9790562
  question: 'Q8: is the Art 83(4)-(6) turnover that of the undertaking in the competition-law sense (the group)?'
  finding: Yes. The maximum is a percentage of the total worldwide annual turnover in the preceding business year of the undertaking
    within the meaning of Arts 101 and 102 TFEU (the economic unit). The undertaking concept does not decide WHO can be fined
    (para 19).
  verdict: settled
  verbatim:
  - at: paragraph 22
    text: that concept covers any entity engaged in an economic activity, irrespective of the legal status of that entity
      and the way in which it is financed. The concept of an undertaking therefore designates an economic unit even if in
      law that economic unit consists of several persons, natural or legal.
  - at: paragraph 23
    text: where the addressee of the administrative fine is or forms part of an undertaking, within the meaning of Articles
      101 and 102 TFEU, the maximum amount of the administrative fine is calculated on the basis of a percentage of the total
      worldwide annual turnover in the preceding business year of the undertaking concerned
  - at: paragraph 36 and operative part
    text: the term ‘undertaking’ in those provisions corresponds to the concept of ‘undertaking’, within the meaning of Articles
      101 and 102 TFEU, with the result that, where a fine for infringement of Regulation 2016/679 is imposed on a controller
      of personal data which is or forms part of an undertaking, the maximum amount of the fine is to be determined on the
      basis of a percentage of the undertaking’s total worldwide annual turnover in the preceding business year.
  found_by: automated retrieval, 2026-10-30
  checked_by: 'the build process re-fetched 2026-10-30 with the same Accept header: identical bytes; every verbatim checked as a
    substring of the extracted text (whitespace-insensitive for PDF extraction)'
