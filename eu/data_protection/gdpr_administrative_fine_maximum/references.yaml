european_data_protection_board_guidelines_04_2022:
  kind: guidance
  author: European Data Protection Board
  title: Guidelines 04/2022 on the calculation of administrative fines under the GDPR, version 2.1
  date: '2023-05-24'
  url: https://www.edpb.europa.eu/system/files/documents/2023-06/edpb_guidelines_042022_calculationofadministrativefines_en.pdf
  accept: application/pdf
  fetched: '2026-10-30T07:54:09Z'
  file: sources/reference/edpb_04_2022.pdf
  bytes: 802133
  sha256: 9e1ce64002f26700db89084cb1734ff5cb6fe54dec5c9203ea0dc27a3871d72a
  text_file: sources/reference/edpb_04_2022.pdf.txt
  text_sha256: cb3f44bb7f8149cc3afb9b1f50023503bfd757fcffe36d6f1e1cd211cccfdb89
  question: 'Q7: for several infringements NOT in the same or linked processing operations, is there a combined maximum?'
  finding: No. Art 83(3) applies only to infringements arising from the same or linked processing operations; otherwise each
    infringement gets its own fine, with no single legal maximum for their sum. No Court of Justice ruling searched yet.
  verdict: guidance_only
  verbatim:
  - at: paragraph 39
    text: Article 83(3) GDPR is limited in its application and will not apply to every single case in which multiple infringements
      are found to have occurred, but only to those cases where multiple infringements have arisen from “the same or linked
      processing operations”
  - at: chapter 3, under Article 83(3)
    text: the total amount of the administrative fine shall not exceed the amount specified for the gravest infringement
  - at: example before chapter 4
    text: individual fines for each, without there being a single legal maximum applicable to their sum
  found_by: automated retrieval, 2026-10-30
  checked_by: 'the build process re-fetched 2026-10-30 with the same Accept header: identical bytes; every verbatim checked as a
    substring of the extracted text (whitespace-insensitive for PDF extraction)'
