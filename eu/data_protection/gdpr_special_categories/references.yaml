  question: 'Q5: does one Art 9(2) exception cover every special category in the processing? Q3: is the controller held to
    the Art 9(2) exception it relied on?'
  finding: 'Q5, settled in part: a mixed set collected en bloc is prohibited if it holds one sensitive item and no Art 9(2)
    derogation applies; the ruling does not say whether one derogation covers several categories. Q3: nothing found on switching
    between Art 9(2) exceptions.'
  verdict: settled_in_part
  verbatim:
  - at: paragraph 89
    text: where a set of data containing both sensitive data and non-sensitive data is subject to such operations and is,
      in particular, collected en bloc without it being possible to separate the data items from each other at the time of
      collection, the processing of that set of data must be regarded as being prohibited, within the meaning of Article 9(1)
      of the GDPR, if it contains at least one sensitive data item and none of the derogations in Article 9(2) of that regulation
