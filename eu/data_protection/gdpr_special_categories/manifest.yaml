  # -- citations.clausal --
  - "citation/2"
  # -- processing_permitted.clausal --
  - "decide_processing_permitted/2"
  - "processing_permitted_status/2"
  - "processing_permitted_checklist/2"
  - "processing_permitted_decision_resolvable/1"
  - "processing_permitted_status_values/1"
  - "decide_special_category_processing/2"
  - "processing_permitted/2"
  - "special_category_scope/2"
  - "special_category_outside_facts/2"
  # -- permitted_bases.clausal --
  - "decide_permitted_bases/2"
  - "permitted_bases_status/2"
  - "permitted_bases_checklist/2"
  - "permitted_bases_decision_resolvable/1"
  - "permitted_bases_status_values/1"
  - "permitted_bases/2"
  # -- queries.clausal --
  - "gdpr_special_categories_profile_keys/1"
  - "gdpr_special_categories_input_problems/2"
  - "gdpr_special_categories_what_if/4"
  - "input_problems/1"
  - "unknown_key/1"
  - "wrong_type/1"
  - "duplicate_key/1"
  - "special_category_verdict/4"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "open_textured/2"
  - "cross_reference_unresolved/2"
  - "resolution/2"
  - "inputs_relied_on/1"
  - "provenance/2"
  - "outside_fact/2"
  - "attested/2"
  - "attestation/4"
