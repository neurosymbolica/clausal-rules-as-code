eu_reg_2016_679_art_91_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_091.001"
  retrieved: 2026-11-20
  note: >-
    GDPR Art 91(1). Anchors the five conjunctive conditions read by both
    queries: churches and religious associations or communities; in a
    Member State; comprehensive rules relating to the protection of natural
    persons with regard to processing; applied at the time of entry into
    force; brought into line with the Regulation. The load-bearing words are
    'such rules may continue to apply, provided that they are brought into
    line with this Regulation'.
eu_reg_2016_679_art_91_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_091.002"
  retrieved: 2026-11-20
  note: >-
    GDPR Art 91(2). Anchors church_supervision: the body applying rules in
    accordance with paragraph 1 'shall be subject to the supervision of an
    independent supervisory authority, which may be specific, provided that
    it fulfils the conditions laid down in Chapter VI'. Chapter VI itself is
    not pinned; its fulfilment is the attested outside fact
    specific_authority_fulfils_chapter_vi_conditions.
