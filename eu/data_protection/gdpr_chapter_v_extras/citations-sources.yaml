eu_reg_2016_679_art_44:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-16
  unit: "02016R0679-20160504#art_044"
  note: >-
    Art 44, first sentence: the Chapter V conditions apply including for onward
    transfers. Anchors onward_transfer_condition/4. The second sentence (level of
    protection) is deferred (art_44_level_of_protection).
eu_reg_2016_679_art_48:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-16
  unit: "02016R0679-20160504#art_048"
  note: >-
    Art 48: a third-country judgment or decision requiring a transfer may only be
    recognised or enforceable if based on an international agreement in force with
    the Union or a Member State. Read as a bar, not a ground (Q7). Anchors
    foreign_judgment_or_decision_recognition/4.
eu_reg_2016_679_art_49_1_second_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-16
  unit: "02016R0679-20160504#parag_049.001"
  note: >-
    Art 49(1), second subparagraph: second sentence (inform the supervisory
    authority) and third sentence (inform the data subject of the transfer and of the
    compelling legitimate interests). The first-sentence conditions are deferred to
    gdpr-chapter-v-transfers. Anchors second_subparagraph_duty/5 for the duties to inform.
