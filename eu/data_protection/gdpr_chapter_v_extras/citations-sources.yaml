eu_reg_2016_679_art_44:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  note: >-
    Art 44, first sentence: the conditions of Chapter V apply including for
    onward transfers. Anchors onward_transfer_condition/4. The second sentence
    (level of protection not undermined) is deferred (art_44_level_of_protection).
eu_reg_2016_679_art_48:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  note: >-
    Art 48, read as a bar, not a ground: a third-country judgment or decision
    requiring a transfer or disclosure may only be recognised or enforceable if
    based on an international agreement in force with the Union or a Member
    State. Anchors foreign_judgment_or_decision_recognition/4.
eu_reg_2016_679_art_49_1_second_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  note: >-
    Art 49(1), second subparagraph, second and third sentences: the controller
    informs the supervisory authority of the transfer, and the data subject of
    the transfer and of the compelling legitimate interests pursued. Anchors the
    duties inform_supervisory_authority and inform_data_subject, and
    not_a_processor_duty. The first sentence is decided by gdpr-chapter-v-transfers
    and read only through the outside fact
    transfer_relies_on_article_49_1_second_subparagraph.
eu_reg_2016_679_art_49_6:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  note: >-
    Art 49(6): the controller or processor documents the assessment and the
    suitable safeguards in its Art 30 records. Anchors the duty
    document_assessment_and_safeguards.
