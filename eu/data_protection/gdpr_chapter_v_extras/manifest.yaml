# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Shared backbone packages imported: none (only the kit's formalize_lib).
uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR), beside gdpr-chapter-v-transfers (which it
  never re-decides). Decided here, from the pinned text only: the controller's
  two duties to inform (the supervisory authority; the data subject of the
  transfer and of the compelling legitimate interests) in the second and third
  sentences of the second subparagraph of Art 49(1), and the Art 49(6) duty of
  the controller or processor to document the assessment and the suitable
  safeguards in its Art 30 records, for a transfer made under that
  subparagraph (second_subparagraph_duty/5); Art 48 as a bar on recognising or
  enforcing a third-country judgment or decision requiring a transfer or
  disclosure without an international agreement
  (foreign_judgment_or_decision_recognition/4); and Art 44, first sentence, for
  an onward transfer, whose own Chapter V answer is supplied as an outside fact
  (onward_transfer_condition/4). Out of scope: whether a transfer may take
  place under Chapter V and on which basis (gdpr-chapter-v-transfers), the
  conditions of the first sentence of the second subparagraph of Art 49(1),
  whether an Art 30 record is required and what else it holds
  (gdpr-records-and-officer, including Art 30(5)), the information of
  Articles 13 and 14, the second sentence of Art 44, and every lawyer
  question named in the order (Q1 to Q9). Drafter's reading, not a lawyer's.

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504"
  - "GDPR Art 44 (unit 02016R0679-20160504#art_044), first sentence read by onward_transfer_condition/4"
  - "GDPR Art 48 (unit 02016R0679-20160504#art_048), read by foreign_judgment_or_decision_recognition/4"
  - "GDPR Art 49(1), second subparagraph (unit 02016R0679-20160504#parag_049.001), last two sentences read by second_subparagraph_duty/5"
  - "GDPR Art 49(6) (unit 02016R0679-20160504#parag_049.006), read by second_subparagraph_duty/5 for document_assessment_and_safeguards"
  - "GDPR Art 30(1)(e), Art 30(2)(c) and Art 30(5) (quoted for reading (6) and Q5; deferred, no limb)"

query_interface:
  2: "gdpr_chapter_v_extras_status/2"                 # facade status (Art 44 onward-transfer limb)
  3: "foreign_judgment_or_decision_recognition/4"     # status_determination: Art 48 status
  13: "second_subparagraph_duty/5"                    # compliance_check: is the Art 49(1)/(6) duty met
  16: "gdpr_chapter_v_extras_what_if/4"               # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_030
  - 02016R0679-20160504#art_045
  - 02016R0679-20160504#art_046
  - 02016R0679-20160504#art_049
  reason: The article units of Articles 30, 45, 46 and 49 hold only the article number
    and title; their paragraphs and points are separate units. Document structure,
    not operative law. Deferred so every unit of the pinned extract is accounted for.
  consequence: 'None for a caller: an article title carries no rule.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: chapter_v_cascade
  not_formalized_because: in_sibling
  decided_in: gdpr-chapter-v-transfers
  units:
  - 02016R0679-20160504#parag_045.001
  - 02016R0679-20160504#parag_045.003
  - 02016R0679-20160504#parag_045.008
  - 02016R0679-20160504#parag_046.001
  - 02016R0679-20160504#parag_046.002
  - 02016R0679-20160504#point_046.002_b
  - 02016R0679-20160504#point_049.001_a
  - 02016R0679-20160504#point_049.001_b
  - 02016R0679-20160504#point_049.001_c
  - 02016R0679-20160504#point_049.001_d
  - 02016R0679-20160504#point_049.001_e
  - 02016R0679-20160504#point_049.001_f
  - 02016R0679-20160504#point_049.001_g
  - 02016R0679-20160504#parag_049.002
  - 02016R0679-20160504#parag_049.003
  - 02016R0679-20160504#parag_049.004
  reason: Art 45(1), (3) and (8), Art 46(1), Art 46(2) opening words and point (b),
    the points (a) to (g) of Art 49(1) and Art 49(2) to (4) are the units by which
    gdpr-chapter-v-transfers decides whether a transfer may take place and on which
    basis. This order reads only that order's answer, through the outside facts transfer_relies_on_article_49_1_second_subparagraph
    and onward_transfer_has_chapter_v_basis (readings (1), (2) and (9)).
  consequence: 'No answer of this order says whether a transfer may take place or
    on which basis: the caller asks gdpr-chapter-v-transfers and supplies its answer
    as an outside fact.'
  declaration: not_an_exception
- what: chapter_v_units_read_by_no_order
  debt: true
  units:
  - 02016R0679-20160504#parag_045.002
  - 02016R0679-20160504#point_045.002_a
  - 02016R0679-20160504#point_045.002_b
  - 02016R0679-20160504#point_045.002_c
  - 02016R0679-20160504#parag_045.004
  - 02016R0679-20160504#parag_045.005
  - 02016R0679-20160504#parag_045.006
  - 02016R0679-20160504#parag_045.007
  - 02016R0679-20160504#parag_045.009
  - 02016R0679-20160504#point_046.002_a
  - 02016R0679-20160504#point_046.002_c
  - 02016R0679-20160504#point_046.002_d
  - 02016R0679-20160504#point_046.002_e
  - 02016R0679-20160504#point_046.002_f
  - 02016R0679-20160504#parag_046.003
  - 02016R0679-20160504#point_046.003_a
  - 02016R0679-20160504#point_046.003_b
  - 02016R0679-20160504#parag_046.004
  - 02016R0679-20160504#parag_046.005
  - 02016R0679-20160504#parag_049.005
  reason: Art 45(2), (4) to (7) and (9) (the Commission's assessment, review, repeal
    and older decisions), Art 46(2) points (a) and (c) to (f), Art 46(3) to (5) (which
    instrument supplies the safeguards, the consistency mechanism, transitional validity)
    and Art 49(5) (limits set by Union or Member State law) are read by no limb of
    this order, and gdpr-chapter-v-transfers defers them too.
  consequence: 'No answer checks an adequacy decision''s machinery, which safeguard
    instrument applies, or a limit under Art 49(5): the caller checks them before
    asking gdpr-chapter-v-transfers.'
  declaration: exception_modelled
  open: formalisable; a later change could add it; the deferral stands for this order.
- what: art_49_1_first_subparagraph_and_conditions
  debt: true
  partial: true
  units:
  - 02016R0679-20160504#parag_049.001
  reason: The paragraph unit of Art 49(1) holds the first subparagraph (its opening
    words) and the second subparagraph. Its last two sentences (the duties to inform)
    are formalised here (second_subparagraph_duty). The opening words of the first
    subparagraph and the conditions in the first sentence of the second subparagraph
    are decided by gdpr-chapter-v-transfers and read here only through the outside
    fact transfer_relies_on_article_49_1_second_subparagraph (reading (2)).
  consequence: 'No answer tests whether a transfer meets the conditions of the second
    subparagraph: the caller supplies transfer_relies_on_article_49_1_second_subparagraph
    from gdpr-chapter-v-transfers or a human statement.'
  declaration: answered_with_caveat
  open: formalisable; a later change could add it; the deferral stands for this order.
- what: art_44_level_of_protection
  debt: true
  partial: true
  units:
  - 02016R0679-20160504#art_044
  reason: Art 44 is one unit. Its first sentence (the conditions of the Chapter apply,
    including for onward transfers) is read by onward_transfer_condition; its second
    sentence (all provisions of the Chapter are applied so that the level of protection
    of natural persons is not undermined) is a rule of interpretation that gives no
    answer this order returns (reading (9)).
  consequence: No answer applies the level-of-protection sentence of Art 44 on its
    own.
  declaration: not_an_exception
  open: formalisable; a later change could add it; the deferral stands for this order.
- what: records_of_processing_activities
  not_formalized_because: in_sibling
  decided_in: gdpr-records-and-officer
  units:
  - 02016R0679-20160504#parag_030.001
  - 02016R0679-20160504#point_030.001_a
  - 02016R0679-20160504#point_030.001_b
  - 02016R0679-20160504#point_030.001_c
  - 02016R0679-20160504#point_030.001_d
  - 02016R0679-20160504#point_030.001_e
  - 02016R0679-20160504#point_030.001_f
  - 02016R0679-20160504#point_030.001_g
  - 02016R0679-20160504#parag_030.002
  - 02016R0679-20160504#point_030.002_a
  - 02016R0679-20160504#point_030.002_b
  - 02016R0679-20160504#point_030.002_c
  - 02016R0679-20160504#point_030.002_d
  - 02016R0679-20160504#parag_030.005
  reason: Whether a controller or a processor must keep a record of processing activities
    (Art 30(1), (2) and (5)) and which items it must hold, the documentation of suitable
    safeguards for transfers under the second subparagraph of Art 49(1) in point (e)
    of Art 30(1) and point (c) of Art 30(2) included, is decided by gdpr-records-and-officer.
    This order reads only the Art 49(6) duty to document the assessment and the safeguards
    in those records (reading (6)).
  consequence: 'duty_met for document_assessment_and_safeguards does not say that
    the record as a whole is complete or required: the caller asks gdpr-records-and-officer.'
  declaration: not_an_exception
- what: records_form_and_availability
  debt: true
  units:
  - 02016R0679-20160504#parag_030.003
  - 02016R0679-20160504#parag_030.004
  reason: Art 30(3) (the records in writing, including in electronic form) and Art
    30(4) (the record made available to the supervisory authority on request) are
    read by no limb of this order; gdpr-records-and-officer defers them too.
  consequence: No answer checks the form of the record or its availability to the
    supervisory authority.
  declaration: exception_modelled
  open: formalisable; a later change could add it; the deferral stands for this order.
- what: information_under_articles_13_and_14
  not_formalized_because: in_sibling
  decided_in: gdpr-information-duties-items-and-further-processing
  units: []
  instrument: Regulation (EU) 2016/679 Arts 13 and 14
  reason: The duty to inform the data subject under the second subparagraph of Art
    49(1) applies 'in addition to providing the information referred to in Articles
    13 and 14'; that information is decided by gdpr-information-duties-items-and-further-processing
    (reading (4)).
  consequence: 'duty_met for inform_data_subject does not say that the information
    of Articles 13 and 14 was given: the caller asks that order.'
  declaration: not_an_exception
