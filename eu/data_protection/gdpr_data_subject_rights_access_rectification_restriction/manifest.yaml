independence: no_external_scorer

uses: []

scope: "Regulation (EU) 2016/679 (GDPR) Arts 12(2), 12(3)-(6), 15(1), 16, 18(1) and 23(1): whether a controller must comply with one data subject request of type access, rectification or restriction (right engaged, no Art 12(5), Art 12(2) or Art 23 relief, Art 12(6) identity suspension). Out of scope: erasure, portability, objection and automated decisions (other orders), the content of the answer, the response period, fees, remedies and fines (handed to the lawyer or to sibling orders)."

sources:
  - "Regulation (EU) 2016/679 (GDPR), consolidated text in force from 2016-05-04: Art 12(2), 12(3), 12(4), 12(5), 12(6), 15(1) opening words, 16, 18(1), 23(1) opening words"

query_interface:
