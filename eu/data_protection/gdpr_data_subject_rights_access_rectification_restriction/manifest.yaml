  7: "gdpr_data_subject_rights_access_rectification_restriction_justification/2"
  16: "gdpr_data_subject_rights_access_rectification_restriction_what_if/4"

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_012
  - 02016R0679-20160504#art_015
  - 02016R0679-20160504#art_018
  - 02016R0679-20160504#art_023
  reason: 'The titles of Articles 4, 12, 15, 18, 23 carry no obligation: document
    structure, not operative law. Article 16 is not listed: it has one undivided paragraph,
    so its article unit holds the operative text, which this order formalizes. Deferred
    so every unit of the pinned extracts is accounted for.'
  consequence: 'None for a caller: the article titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
