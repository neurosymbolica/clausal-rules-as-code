# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The slice imports only the kit primitive formalize_lib and
# library(reif), neither a shared backbone package.
uses: []

scope: >-
  Regulation (EU) 2025/2518 (GDPR Procedural Regulation), additional procedural
  rules for the enforcement of Regulation (EU) 2016/679 in cases concerning
  cross-border processing. Decided here, from the pinned text only: whether a
  complaint is admissible (Art 4(1), 4(2), 4(5)); whether the prior request to
  the controller of Art 4(3) applies and was made; what follows once an
  authority examines a complaint for early resolution (Art 5(1) to (4) and
  (6)); whether the simple cooperation procedure is available, excluded by an
  objection or outside Chapter III (Art 6(1), 6(3), 6(5)); which time limit
  applies to the draft decision and any extension ceiling (Art 6(1), Art 12(1)
  to (3) and (6)); the effect of a procedural step taken late (Art 14); the
  sixteen time limits of Arts 4 to 6, 10 and 12 as number, unit, relation,
  event and extension; and from when Chapters II to VI apply (Art 36, Art
  37(2)). Out of scope: calendar end dates of periods (deferred,
  period_end_dates), whether a case is cross-border and the roles of the
  authorities (given by the caller), determinations under Regulation (EU)
  2016/679 (Art 56, 60, 65, 66, 77, 78, 80) and national law (supplied as
  attested outside facts), and open-textured judgements (Art 4(3), Art
  6(1)(b), Art 12(3)), which are handed to the user and referred to a lawyer
  when unsure.

sources:
  - "Regulation (EU) 2025/2518 of the European Parliament and of the Council laying down additional procedural rules relating to the enforcement of Regulation (EU) 2016/679, OJ L, 12.12.2025 (CELEX 32025R2518): Art 4(1), (2), (3), (5), (6); Art 5(1), (2) opening words and point (c), (3), (4), (6); Art 6(1), (2), (3), (5); Art 10(3), (4), (5); Art 12(1), (2), (3), (4), (6); Art 14; Art 36; Art 37(2)"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation): Arts 56(2), 60(3), 65(1)(b), 65(6) and 80 referred to, not formalised (outside facts and caller-supplied roles)"

query_interface:
  3: "complaint_admissibility/3"                # status_determination: admissibility of a complaint
  13: "simple_cooperation_procedure/4"          # compliance_check: may the lead authority use the simple procedure
  15: "procedural_time_limit/4"                 # deadline: the time limit of a procedural step
  16: "gdpr_procedural_regulation_what_if/4"    # what_if: re-evaluate under an overridden key

