  - 32025R2518#parag_003.005
  reason: Article 3 states general principles (expedient and efficient proceedings
    and sincere cooperation, joining or separating proceedings under national law,
    the complainant communicating with the authority where it lodged, a decision subject
    to a judicial remedy, limits on the length of submissions). None gives an answer
    this order returns.
  consequence: None of these principles is tested by any answer.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
