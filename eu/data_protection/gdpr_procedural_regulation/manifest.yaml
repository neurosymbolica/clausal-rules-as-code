- what: subject_matter_and_definitions
  units:
  - 32025R2518#art_001
  - 32025R2518#art_002
  reason: 'Article 1 (subject matter and scope: procedural rules for complaints and
    investigations in cases concerning cross-border processing, including the determination
    whether a case concerns cross-border processing) and Article 2 (the definitions
    of Article 4 of Regulation (EU) 2016/679 apply; ''party under investigation'')
    are read by no limb: every query is asked about a cross-border case (reading (1))
    and no limb turns on a definition.'
  consequence: The caller establishes that the case concerns cross-border processing
    before asking (reading (1)); no answer decides it.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; a later change could add it; the deferral stands for this order.
