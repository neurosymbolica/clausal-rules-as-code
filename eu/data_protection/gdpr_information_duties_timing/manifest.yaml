# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib,
# kit/deadline_lib) and libraries, no shared backbone package.
uses: []

scope: "When must the controller give the data subject the information of GDPR Art 13(1)
  and Art 14(3), and did it come in time? Given one profile of one processing situation
  (one set of personal data from one source), this package answers (D) the DEADLINE, (E)
  the limb that fixes it and (F) whether the provision_date was timely or late. Art 13
  route (data collected from the data subject): the deadline is the obtaining day. Art
  14 route: the earliest of the limb (a) date (one month by Regulation (EEC, Euratom) No
  1182/71 Art 3(1), 3(2)(c), 3(4) and 2(2), applied to the GDPR as a lawyer point), the
  first communication (b) and the first disclosure (c); the reasonable period of Art
  14(3)(a) is the user's judgement, handed back when unsure; an absent public_holidays
  list refers only where a public holiday could change the answer. Out of scope, in the
  sibling orders: which items are owed or missing, further processing, the Art 14(5)
  exemptions and the headline verdict; Art 12 (form of the notice) is excluded; the
  adequacy of the content given is never decided."

sources:
  - "Regulation (EU) 2016/679 (GDPR), OJ L 119, 4.5.2016, consolidated text 02016R0679-20160504 with the 2018 corrigendum: Art 13(1) chapeau and points (a)-(f); Art 14(3) chapeau and points (a)-(c); Art 4(1), (4), (7), (9) used for reasoning only"
  - "Regulation (EEC, Euratom) No 1182/71 determining the rules applicable to periods, dates and time limits, CELEX 31971R1182, OJ L 124, 8.6.1971: Art 3(1) second subparagraph, Art 3(2)(c), Art 3(4), Art 2(2) (PERIODS, G4, ruled 2026-11-01)"
  - "Article 29 Working Party Guidelines on transparency under Regulation 2016/679 (WP260 rev.01), as endorsed by the EDPB: authority of the Q1 ruling only (the earliest applicable Art 14(3) date binds); not pinned and not cited in any answer"

query_interface:
  2: "information_timing_verdict/3"                          # eligibility: timely/late verdict with its citation
  13: "gdpr_information_duties_timing_compliance_check/3"    # compliance_check: is a proposed provision date timely
  14: "gdpr_information_duties_timing_obligation/2"          # obligation_surfacing: provide the information by DEADLINE under BASIS
  15: "information_deadline/2"                               # deadline: when the information must be given (missing it is late)
  16: "gdpr_information_duties_timing_what_if/4"             # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: 'The titles of Articles 4, 13 and 14 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: art4_definitions_used_for_reasoning
  debt: true
  partial: true
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_9
  reason: 'Quoted above for the terms data subject (Art 4(1)), profiling (Art 4(4),
    inside the automated decision-making item), controller (Art 4(7)) and recipient
    (Art 4(9), whose exception for public authorities in a particular inquiry bounds
    recipients_exist). No limb reads them: the profile states the facts in those terms
    already.'
  consequence: whether data is personal data, who is the controller and whether a
    body is a recipient are not tested. The caller must establish them under Art 4(1),
    (7) and (9) itself before stating the profile, in particular recipients_exist.
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art4_definitions_not_read
  debt: true
  units:
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_5
  - 02016R0679-20160504#point_004_6
