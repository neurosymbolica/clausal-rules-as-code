excluded_set:
- what: transparent_information_and_modalities
  instrument: Regulation (EU) 2016/679 Art 12
  cites:
  - 02016R0679-20160504#art_012
  reason: Art 12 (concise, transparent, intelligible and easily accessible form; clear
    and plain language; free of charge; standardised icons) governs HOW the information
    is given. It is pinned for the sibling data-subject-rights order, not here.
  consequence: The form of the notice is not tested; an item "provided" in an unreadable
    notice counts as provided.
- what: regulatory_guidance
  instrument: Article 29 Working Party Guidelines on transparency (WP260 rev.01) as
    endorsed by the EDPB
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  reason: Soft law, not pinned and not quoted; named as the authority of the Q1 ruling
    (reading 4, the earliest date binds). Reading (5) and Q5 are where it would also
    matter.
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance
    itself. A caller who relies on the guidance beyond the earliest-date ruling reads
    it and applies it itself.
