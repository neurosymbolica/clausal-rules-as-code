uses: []

scope: "WHEN the controller must give the data subject the information of GDPR
  Art 13(1) (data collected from the data subject: at the time the personal data
  are obtained) or Art 14 (data not obtained from the data subject: Art 14(3)(a)
  within a reasonable period and at the latest within one month, (b) at the latest
  at the first communication, (c) at the latest at the first disclosure to another
  recipient, the earliest applicable date binding), and whether the one provision
  carried by the profile came in time. The one-month period is computed by
  Regulation (EEC, Euratom) No 1182/71 Art 3(1), 3(2)(c) and 3(4), applied to the
  GDPR by the G4 order, with an attested public-holiday list. Answers
  information_deadline/2 (the date), information_deadline_basis/2 (the limb) and
  information_timing_verdict/3 (timely | late, cited), with the input check
  gdpr_information_duties_timing_input_problems/2. The reasonable period is the
  user's judgement provided_within_reasonable_period; unsure refers to a lawyer.
  Out of scope: which items are owed or missing, the Art 14(5) exemptions,
  further processing and the headline verdict (sibling orders), the adequacy of
  an item's content (Q11), the form of the notice under Art 12, layered notices
  and as-of dates (Q12)."

sources:
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), OJ L 119, 4.5.2016, consolidated text 02016R0679-20160504 with the 2018 corrigendum: Art 13(1) chapeau and points (a)-(f)"
  - "Regulation (EU) 2016/679, Art 14(3), chapeau and points (a)-(c) (time limits), with Art 14(1) for the route"
  - "Regulation (EU) 2016/679, Art 4(1), 4(4), 4(7) and 4(9) (definitions used for reasoning, never cited in a result)"
  - "Regulation (EEC, Euratom) No 1182/71 determining the rules applicable to periods, dates and time limits, OJ L 124, 8.6.1971 (CELEX 31971R1182): Art 3(1) second subparagraph, Art 3(2)(c), Art 3(4)"

query_interface:
  2: "information_timing_verdict/3"                   # eligibility: timely | late with citations (checklist information_timing_verdict_checklist/2)
  13: "gdpr_information_duties_timing_what_if/4"      # compliance_check: is a proposed provision in time
  14: "gdpr_information_duties_timing_obligation/2"   # obligation_surfacing: provide the information by DATE under LIMB
  15: "information_deadline/2"                        # deadline: the date; consequence of missing it is late
  16: "gdpr_information_duties_timing_what_if/4"      # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
