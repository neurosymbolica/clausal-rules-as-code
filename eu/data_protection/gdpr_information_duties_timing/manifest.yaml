  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_20
  - 02016R0679-20160504#point_004_21
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  reason: Art 4 is pinned whole because the smallest document element that contains
    Art 4(1), (4), (7) and (9) is the article. The other definitions (processing,
    restriction, pseudonymisation, filing system, processor, third party, consent,
    personal data breach, genetic, biometric and health data, main establishment,
    representative, enterprise, group, binding corporate rules, supervisory authority
