  - 02016R0679-20160504#point_014.002_e
  - 02016R0679-20160504#point_014.002_f
  - 02016R0679-20160504#point_014.002_g
  reason: Which items of information Art 13(2), Art 14(1) and Art 14(2) require, and
    which of them are missing, is decided in gdpr-information-duties-items-and-further-processing
    (information_items_owed/2 and information_items_missing/2); that order defers
    none of these units. This order reads only the route words of the Art 14(1) chapeau,
    quoted in reading (1), to choose between the deadline of Art 13(1) and that of
    Art 14(3) for the information referred to in paragraphs 1 and 2.
  consequence: 'No answer of this order says which items are owed or missing: timely
    means only that the provision_date is not after the deadline (and, on the Art
    14 route, that the period was judged reasonable), not that the information given
    was complete; the caller asks gdpr-information-duties-items-and-further-processing.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-information-duties-items-and-further-processing
- what: art13_3_art14_4_further_processing_information
  units:
  - 02016R0679-20160504#parag_013.003
  - 02016R0679-20160504#parag_014.004
  reason: Information before further processing for another purpose (Art 13(3) and
    Art 14(4)) is decided in gdpr-information-duties-items-and-further-processing
    (further_processing_information_verdict/3), which defers neither unit. This order
    reads none of the further-processing keys.
  consequence: 'No answer of this order concerns information before further processing:
    the deadline and verdict of this order are for the initial information of Art
    13(1) and Art 14(3) only; the caller asks gdpr-information-duties-items-and-further-processing.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-information-duties-items-and-further-processing
- what: art13_4_art14_5_a_information_already_held
  units:
  - 02016R0679-20160504#parag_013.004
  - 02016R0679-20160504#point_014.005_a
  reason: Whether the data subject already has an item of the information, so that
    Art 13(4) or Art 14(5)(a) takes it out of the duty, is decided in gdpr-information-duties-items-and-further-processing
    (information_items_missing/2, which reads items_data_subject_already_has); that
    order defers neither unit.
  consequence: 'This order does not read items_data_subject_already_has (SPLIT SCOPE):
    its deadline and verdict are given whatever the data subject already has; whether
    an item is still owed is answered by gdpr-information-duties-items-and-further-processing.'
  declaration: answered_with_caveat
  not_formalized_because: in_sibling
  decided_in: gdpr-information-duties-items-and-further-processing
- what: art14_5_exemptions
  units:
  - 02016R0679-20160504#parag_014.005
  - 02016R0679-20160504#point_014.005_b
  - 02016R0679-20160504#point_014.005_c
  - 02016R0679-20160504#point_014.005_d
  reason: 'Whether an exemption of Art 14(5)(b), (c) or (d) disapplies the information
    duty (the Art 14(5) chapeau) is decided in gdpr-information-duties-headline-verdict
    (information_duty_exemption/2). That order decides points (c) and (d) and the
    chapeau, and point (b) in part: the archiving, research and statistical purposes
    and the Art 89(1) conditions inside point (b) are its own partial deferral, decided
    by no order.'
  consequence: 'This order does not read provision_impossible_or_disproportionate_effort,
    protective_measures_taken or the two law facts (SPLIT SCOPE): its deadline and
    verdict are given whatever exemption may apply; whether Art 14(5) disapplies the
    duty is answered by gdpr-information-duties-headline-verdict.'
  declaration: answered_with_caveat
  not_formalized_because: in_sibling
  decided_in: gdpr-information-duties-headline-verdict
- what: regulation_1182_71_article_headings
  not_formalized_because: structural
  units:
  - 31971R1182#art_002
  - 31971R1182#art_003
  - 31971R1182#art_004
  - 31971R1182#art_005
  reason: 'The titles of Articles 2 to 5 of Regulation (EEC, Euratom) No 1182/71 carry
    no rule: document structure, not operative law. Deferred so every unit of the
    pinned extracts is accounted for.'
  consequence: 'None for a caller: an article title carries no rule.'
  declaration: not_an_exception
- what: regulation_1182_71_article_1_scope
  debt: true
  units:
  - 31971R1182#art_001
  reason: Article 1 limits Regulation (EEC, Euratom) No 1182/71 to acts of the Council
    or Commission; Regulation (EU) 2016/679 is an act of the European Parliament and
    of the Council. This order applies Article 3 to the periods of Regulation (EU)
    2016/679 by analogy (a lawyer point, see PERIODS), so no rule reads Article 1.
  consequence: 'Every deadline this order gives rests on applying Article 3 of Regulation
    (EEC, Euratom) No 1182/71 to Regulation (EU) 2016/679, which Article 1 of that
    Regulation does not itself provide: a caller that relies on the date accepts that
    reading, or computes the period under the rule it holds applicable.'
  declaration: answered_with_caveat
- what: regulation_1182_71_article_2_1_public_holidays
  not_formalized_because: national_law
  units:
  - 31971R1182#parag_002.001
  reason: 'Article 2(1) defines public holidays as the days designated as such in
    the Member State or in the Community institution in which action is to be taken,
    as published by the Commission in the Official Journal. This order chooses no
    Member State or institution and reads no published list: public holidays arrive
    as the outside fact public_holidays. Article 2(2), the working day of the Article
    3(4) shift, is Union law and is quoted and read (PERIODS); it is not in this row.'
  consequence: The caller attests in public_holidays the public holidays of the Member
    State or Community institution in which the action is to be taken (Article 2(1));
    a public holiday missing from an attested list leaves a deadline that falls on
    that day unmoved, one working day early; an absent list refers where a public
    holiday could change the answer (DEADLINE is a date only when a limb (b) or (c)
    date falls on or before the limb (a) date counted without public holidays, and
    is otherwise always the referral, whatever the date or weekday) (THE ANSWERS (P)).
  declaration: answered_with_caveat
- what: regulation_1182_71_article_3_rules_not_applied
  debt: true
  units:
  - 31971R1182#parag_003.002
  - 31971R1182#point_003.002_a
  - 31971R1182#point_003.002_b
  - 31971R1182#point_003.002_d
  - 31971R1182#parag_003.003
  - 31971R1182#parag_003.005
  reason: The periods of this order are expressed in months and run from an event,
    so they read only Article 3(1), second subparagraph, Article 3(2)(c) and Article
    3(4) (PERIODS). The opening words of Article 3(2) only make point (c) subject
    to paragraphs 1 and 4, which is how PERIODS applies them; points (a), (b) and
    (d) govern periods expressed in hours, in days and in parts of months; Article
    3(3) (Saturdays, Sundays and public holidays count within a period) holds by construction
    in a count of calendar months; Article 3(5) (a period of two days or more includes
    at least two working days) is not applied.
  consequence: 'None for a caller: no period of this order is expressed in hours,
    in days or in parts of months, and a period of a month or more holds the two working
    days of Article 3(5).'
  declaration: not_an_exception
- what: regulation_1182_71_articles_4_and_5_acts_and_specified_dates
  not_formalized_because: institutional
  units:
  - 31971R1182#parag_004.001
  - 31971R1182#parag_004.002
  - 31971R1182#parag_004.003
  - 31971R1182#parag_005.001
  - 31971R1182#parag_005.002
  reason: 'Article 4 governs the entry into force, taking effect, application and
    expiry of acts of the Council or Commission; Article 5 governs an action to be
    effected at a specified moment or date in implementation of such an act. No period
    of this order is either: each runs from an event (PERIODS).'
  consequence: 'None for a caller: no answer of this order concerns the entry into
    force or expiry of an act, or an action fixed at a specified moment or date.'
  declaration: not_an_exception
- what: art13_1_points_a_to_f_information_items
  units:
  - 02016R0679-20160504#point_013.001_a
  - 02016R0679-20160504#point_013.001_b
  - 02016R0679-20160504#point_013.001_c
  - 02016R0679-20160504#point_013.001_d
  - 02016R0679-20160504#point_013.001_e
  - 02016R0679-20160504#point_013.001_f
  reason: Points (a) to (f) of Art 13(1) list the items of information owed on the
    Art 13 route (identity and contact details of the controller, the data protection
    officer, purposes and legal basis, legitimate interests, recipients, third-country
    transfers). Which of them are owed and which are missing is decided in gdpr-information-duties-items-and-further-processing
    (information_items_owed/2 and information_items_missing/2) (SPLIT SCOPE). This
    order reads only the chapeau of Art 13(1), its route words and 'at the time when
    personal data are obtained', for the deadline.
  consequence: 'No answer of this order says which Art 13(1) items are owed or missing:
    timely means only that the provision_date is not after the obtaining day, not
    that the information given was complete; the caller asks gdpr-information-duties-items-and-further-processing.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-information-duties-items-and-further-processing

excluded_set:
- what: transparent_information_and_modalities
  instrument: Regulation (EU) 2016/679 Art 12
  cites:
  - 02016R0679-20160504#art_012
  reason: Art 12 (concise, transparent, intelligible and easily accessible form; clear
    and plain language; free of charge; standardised icons) governs HOW the information
    is given. It is pinned for the sibling data-subject-rights order, not here.
  consequence: The form of the notice is not tested; an item "provided" in an unreadable
    notice counts as provided.
- what: regulatory_guidance
  instrument: Article 29 Working Party Guidelines on transparency (WP260 rev.01) as
    endorsed by the EDPB
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  reason: Soft law, not pinned and not quoted; named as the authority of the Q1 ruling
    (reading 4, the earliest date binds). Reading (5) and Q5 are where it would also
    matter.
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance
    itself. A caller who relies on the guidance beyond the earliest-date ruling reads
    it and applies it itself.
