- what: chapter_v_cascade
  not_formalized_because: in_sibling
  decided_in: gdpr-chapter-v-transfers
  units:
  - 02016R0679-20160504#parag_045.003
  - 02016R0679-20160504#parag_045.008
  reason: Art 45(3) (the Commission may decide by implementing act that a third country
    ensures an adequate level of protection) and Art 45(8) (the list of adequacy decisions
    published in the Official Journal) are read by gdpr-chapter-v-transfers, whose
    cascade (Arts 45, 46 and 49) decides whether a transfer may take place and on
    which basis; this order formalises only the conditions of one decision under Art
    45(3) (reading (9)).
  consequence: 'No answer of this order says whether a transfer that this decision
    does not cover may take place on another basis: the caller asks gdpr-chapter-v-transfers.'
  declaration: not_an_exception
