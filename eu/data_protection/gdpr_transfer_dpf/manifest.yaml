  # -- citations.clausal --
  - "citation/2"
  # -- gdpr_transfer_dpf.clausal --
  - "data_privacy_framework_adequacy/4"
  - "decide_gdpr_transfer_dpf/2"
  - "gdpr_transfer_dpf_status/2"
  - "gdpr_transfer_dpf_checklist/2"
  - "gdpr_transfer_dpf_decision_resolvable/1"
  - "gdpr_transfer_dpf_status_values/1"
  # -- queries.clausal --
  - "gdpr_transfer_dpf_profile_keys/1"
  - "gdpr_transfer_dpf_input_problems/2"
  - "gdpr_transfer_dpf_what_if/4"
  - "gdpr_transfer_dpf_compliance_check/2"
  - "covered_by_data_privacy_framework_adequacy/0"
  - "not_covered_by_data_privacy_framework_adequacy/0"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "cross_reference_unresolved/2"
  - "resolution/2"
  - "inputs_relied_on/1"
  - "outside_fact/2"
  - "attested/2"
  - "attestation/4"
  - "url/2"
  - "document/2"
  - "cite/1"
