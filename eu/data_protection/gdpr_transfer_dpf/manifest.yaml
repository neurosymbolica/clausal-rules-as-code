# root_exports: the bare atoms the scorer resolves on the package root (the
# profile keys, the result atoms, absent and not_attempted). Atoms need no
# export; this list records them.
root_exports:
  - transfer_from_union
  - recipient_is_organisation_in_united_states
  - data_privacy_framework_decision_in_force
  - recipient_on_data_privacy_framework_list
  - certification_covers_transferred_data
  - covered_by_data_privacy_framework_adequacy
  - not_covered_by_data_privacy_framework_adequacy
  - absent
  - not_attempted

# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports none (formalize_lib is kit, not a backbone package).
uses: []

scope: >-
  Commission Implementing Decision (EU) 2023/1795 (EU-U.S. Data Privacy Framework)
  Article 1, read with Regulation (EU) 2016/679 (GDPR) Article 45(1). The bounded
  question: does Decision (EU) 2023/1795 cover THIS transfer of personal data to an
  organisation in the United States, so that Art 45(1) GDPR lets it take place without
  any specific authorisation? Decided here, as one limb (data_privacy_framework_adequacy/4):
  five conditions that must all hold, each deciding by itself when it fails -- the data
  are transferred from the Union and the recipient is an organisation in the United
  States (crisp caller facts); the decision is in force for the transfer, the recipient
  is on the Data Privacy Framework List, and the data fall within what its certification
  covers (attested outside facts, never decided here). An absent outside fact is referred
  before a missing crisp key is named. Out of scope, quoted or deferred: Articles
  2 to 4 of the decision (Member State information, monitoring, review, suspension,
  amendment, repeal, addressees), the recitals, the footnotes and the Annexes (the
  Principles, the List mechanics, the human-resources and journalistic limits, the U.S.
  letters); the Chapter V cascade of Arts 44 to 49 GDPR (gdpr-chapter-v-transfers) and
  onward transfers (gdpr-chapter-v-extras); the lawfulness of the processing in every
  other respect. A not-covered answer says only that this one decision does not cover
  the transfer, nothing about any other adequacy decision; the open questions (EEA
  States, further certification limits, listing in error, a supervisory authority order,
  removal from the List after a transfer) are handed to a lawyer.

sources:
  - 'Commission Implementing Decision (EU) 2023/1795 of 10 July 2023 pursuant to Regulation (EU) 2016/679 on the adequate level of protection of personal data under the EU-US Data Privacy Framework, OJ L 231, 20.9.2023, p. 118 -- Article 1 (the one operative rule applied)'
  - 'Regulation (EU) 2016/679 (General Data Protection Regulation), consolidated text in force from 2016-05-04 -- Article 45(1) (the effect of a covered transfer, no specific authorisation)'
  - 'Commission Implementing Decision (EU) 2023/1795 -- Articles 2, 3 and 4, recitals (7) to (10) and (52) to (55), footnote (14), Annex I Section I points 3 and 6 (quoted for readings and open questions; not formalised, see deferred_set)'

query_interface:
  2: "gdpr_transfer_dpf_status/2"      # eligibility/status verdict: the limb's RESULT
  13: "gdpr_transfer_dpf_compliance_check/2"   # compliance_check: may the proposed transfer take place without specific authorisation
  16: "gdpr_transfer_dpf_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: decision_member_state_information
  not_formalized_because: institutional
  units:
  - 32023D1795#art2
  reason: Art 2 obliges the Member State concerned to inform the Commission when its
    authorities use their Art 58 GDPR powers on transfers under Art 1. A duty between
    the Member States and the Commission; no answer of this order turns on it (reading
    (7)).
  consequence: A supervisory authority's order about the transfer is not read (Q6).
  declaration: not_an_exception
- what: decision_monitoring_and_review
  debt: true
  units:
  - 32023D1795#art3
  - 32023D1795#art3_p1
  - 32023D1795#art3_p2
  - 32023D1795#art3_p3
  - 32023D1795#art3_p4
  reason: 'Art 3 (its heading, and paragraphs 1 to 4: the Commission''s monitoring,
    the exchange of information with the Member States and the periodic review) is
    operative text with legal consequences that no limb of this order formalises;
    the outcome of a review reaches the order only through the attested fact data_privacy_framework_decision_in_force
    (readings (4) and (8)).'
  consequence: No answer follows the Commission's monitoring or review; a caller states
    their outcome as data_privacy_framework_decision_in_force (Q4).
  declaration: exception_modelled
  open: formalisable; a later change could add it; the deferral stands for this order.
- what: decision_suspension_amendment_repeal
  debt: true
  partial: true
  units:
  - 32023D1795#art3_p5
  reason: 'Art 3(5) (the Commission may suspend, amend or repeal the decision, or
    limit its scope, in accordance with Art 45(5) GDPR) is read for the meaning of
    the attested fact data_privacy_framework_decision_in_force but not formalised:
    the effect of a suspension, amendment, repeal or limitation arrives through that
    fact attested false (reading (4)).'
  consequence: 'No answer decides whether the Commission has suspended, amended, repealed
    or limited the decision: the caller states it as data_privacy_framework_decision_in_force
    (Q4).'
  declaration: answered_with_caveat
  open: formalisable; a later change could add it; the deferral stands for this order.
