eu_dec_2023_1795_art_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dec_impl/2023/1795/oj"
  retrieved: 2026-11-16
  note: >-
    Article 1, the one operative rule (unit 32023D1795#art1): the United States
    ensures an adequate level of protection for personal data transferred from
    the Union to organisations in the United States included in the Data Privacy
    Framework List, in accordance with Section I.3 of Annex I. Read as five
    conjunctive conditions (reading (1)); cited on every final answer and as the
    CITATION of every absent referral.
eu_reg_2016_679_art_45_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
  retrieved: 2026-11-16
  note: >-
    Article 45(1) GDPR (unit 02016R0679-20160504#parag_045.001): a transfer
    covered by an adequacy decision shall not require any specific
    authorisation. Cited on covered_by_data_privacy_framework_adequacy only
    (reading (2)).
