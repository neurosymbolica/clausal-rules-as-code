eu_reg_2016_679_art_8_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "the processing of the personal data of a child shall be lawful where the child is at least 16 years old"
  note: >-
    Art 8(1), first subparagraph: engagement and the age of 16.
eu_reg_2016_679_art_8_1_second_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "Member States may provide by law for a lower age for those purposes provided that such lower age is not below 13 years."
  note: >-
    Art 8(1), second subparagraph: the floor of 13 and the national age.
eu_reg_2016_679_art_8_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "The controller shall make reasonable efforts to verify in such cases that consent is given or authorised by the holder of parental responsibility over the child, taking into consideration available technology."
  note: >-
    Art 8(2): the verification duty.
eu_reg_2016_679_art_8_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-09
  verbatim: "Paragraph 1 shall not affect the general contract law of Member States such as the rules on the validity, formation or effect of a contract in relation to a child."
  note: >-
    Art 8(3): excluded by this order; recorded, never returned.
