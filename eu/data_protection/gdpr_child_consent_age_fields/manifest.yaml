# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. None: the package imports only formalize_lib primitives.
uses: []

scope: "Regulation (EU) 2016/679 Art 8(1) and 8(2), with the Art 4(25) cross-reference. Given one processing based on consent (Art 6(1)(a)) in relation to an information society service offered directly to a child, decides whether Art 8 bars the processing: is the child's own consent enough (age at least 16, or at least the national age of digital consent in force on the consent date, never below 13) or is consent or authorisation of the holder of parental responsibility needed. A separate field says whether the Art 8(2) duty to make reasonable efforts to verify parental consent is discharged. Out of scope, handed to the lawyer or a sibling order: validity of the consent itself (Art 4(11), Art 7, gdpr-art6-lawfulness), lawfulness of the processing on the whole, validity of a contract with a child (Art 8(3), national contract law), who holds parental responsibility, and which Member State's law applies (an input)."

sources:
  - "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504 (in force from 2016-05-04, with the 2018 corrigendum), Art 8(1) unit 02016R0679-20160504#parag_008.001, both subparagraphs"
  - "Regulation (EU) 2016/679 Art 8(2) unit 02016R0679-20160504#parag_008.002"
  - "Regulation (EU) 2016/679 Art 8(3) unit 02016R0679-20160504#parag_008.003 (saving clause, excluded)"
  - "Regulation (EU) 2016/679 Art 4(25) unit 02016R0679-20160504#point_004_25 (information society service)"

query_interface:
  3: "child_consent_status_status/2"      # status_determination: eligible / ineligible / compound statuses
  7: "gdpr_child_consent_age_fields_justification/2"    # justification: checklist with cite(...) per item
  13: "gdpr_child_consent_age_fields_compliance_check/3"  # compliance_check: may the processing on consent go ahead
  16: "gdpr_child_consent_age_fields_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_008
  reason: 'The titles of Articles 4 and 8 carry no obligation: document structure.
    Deferred so every unit of the pinned extracts is accounted for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- debt: true
  what: art_4_11_consent_validity
  units:
  - 02016R0679-20160504#point_004_11
  reason: Art 8(1) speaks of consent without defining it; whether the consent is freely
    given, specific, informed and unambiguous is the question of gdpr-art6-lawfulness.
    This order assumes the consent exists and tests only who may give it (open question
    Q4).
  consequence: 'An eligible answer does not say the consent itself is valid: the caller
    must check under Art 4(11) (and Art 7) itself that the consent is freely given,
    specific, informed and unambiguous, for example with the sibling Article 6 order.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: definitions_not_applied
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_5
  - 02016R0679-20160504#point_004_6
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_8
  - 02016R0679-20160504#point_004_9
  - 02016R0679-20160504#point_004_10
  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_13
  - 02016R0679-20160504#point_004_14
  - 02016R0679-20160504#point_004_15
  - 02016R0679-20160504#point_004_16
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_17
  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_20
  - 02016R0679-20160504#point_004_21
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  - 02016R0679-20160504#point_004_24
  - 02016R0679-20160504#point_004_26
  reason: 'Art 4 is pinned whole because the smallest document element that contains
    Art 4(25) is the article. The other definitions (personal data, processing, controller,
    main establishment, supervisory authority and the rest) are not read by any limb
    of Art 8: the profile states the facts in those terms already. The Art 4(7) controller
    is the subject of Art 8(2) but the profile does not need the definition.'
  consequence: The answers do not test whether the data is personal data (Art 4(1))
    or who the controller is (Art 4(7)); the caller must establish both itself, and
    the Art 8(2) verification falls on that controller.
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- not_formalized_because: national_law
  what: art_8_3_general_contract_law
  units:
  - 02016R0679-20160504#parag_008.003
  reason: 'A saving clause: Art 8(1) does not affect the general contract law of Member
    States (validity, formation or effect of a contract with a child). It is national
    law, not formalized here, and no limb of Art 8(1) or (2) reads it.'
  consequence: the order never says whether a contract with a child is valid (open
    question Q13). The caller decides the validity, formation or effect of a contract
    with a child under the general contract law of the Member State itself.
  declaration: not_an_exception

excluded_set:
- what: directive_2015_1535_definition
  instrument: Directive (EU) 2015/1535 Art 1(1)(b)
  cites:
  - 32015L1535#point_001.001_b
  reason: Art 4(25) defines information society service by it; not pinned here. The
    profile carries the judgement information_society_service instead (open question
    Q8).
  consequence: The order does not decide whether a service is an information society
    service; the caller applies Art 1(1)(b) of Directive (EU) 2015/1535 and states
    the judgement information_society_service.
- what: art_6_1_a_consent_basis
  instrument: Regulation (EU) 2016/679 Art 6(1)(a)
  cites:
  - 02016R0679-20160504#point_006.001_a
  reason: Art 8(1) applies where Art 6(1)(a) applies; Art 6 is pinned in gdpr-art6-lawfulness,
    not here. The crisp flag processing_rests_on_consent carries the condition.
  consequence: The order does not test whether processing rests on consent; the caller
    establishes the Art 6(1)(a) basis (see the sibling order gdpr-art6-lawfulness)
    and states processing_rests_on_consent.
- what: recitals_on_children
  instrument: Regulation (EU) 2016/679 recitals on the protection of children and
    on parental consent
  cites:
  - 32016R0679#rct_38
  - 32016R0679#rct_58
  reason: Not pinned here. No recital is relied on.
  consequence: The order gives no test for who holds parental responsibility or what
    a reasonable verification is beyond the pinned operative text.
