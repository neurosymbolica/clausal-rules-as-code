# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports only the kit's formalize_lib, which is not a
# backbone package of the corpus.
uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR), three rules that sibling orders leave open,
  each answered from the position of one party for one processing and, for
  Art 82, one claim for one damage. (1) Art 26(3) read with Art 28(10):
  whether the data subject may exercise its rights in respect of and against
  the caller whatever the arrangement between joint controllers says
  (rights_against_each_joint_controller/3); joint determination of the
  purposes and means is the caller's tri-state judgement and is handed to a
  lawyer when unsure, never tested here. (2) Art 82(4): whether the caller,
  stated responsible under Art 82(2) and (3) by an attested outside fact, is
  liable for the entire damage because at least one other involved party is
  responsible for the same damage (liability_for_the_entire_damage/4).
  (3) Art 82(5): whether a caller that paid full compensation in accordance
  with Art 82(4) may claim back from the listed other responsible parties
  (recourse_after_full_compensation/4); full payment is the caller's
  tri-state judgement. The input check is gdpr_joint_controllers_input_problems/2.
  Out of scope and decided elsewhere: Art 26(1) and (2) (gdpr-accountability-security),
  Art 82(1) to (3) (gdpr-compensation-and-liability), the other paragraphs of
  Art 28 (gdpr-processor-contract), the definitions of Art 4 (the common
  definitions orders). No answer states an amount, a part of responsibility,
  a competent court (Art 82(6), Art 79), a fine or penalty (Arts 83, 84), which
  data-subject rights exist (Arts 12 to 22) or any national rule on contribution.
  Drafter's reading, not a lawyer's.

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504"
  - "GDPR Art 26(3) [02016R0679-20160504#parag_026.003] rights in respect of and against each of the joint controllers"
  - "GDPR Art 28(10) [02016R0679-20160504#parag_028.010] a processor that determines the purposes and means is considered a controller"
  - "GDPR Art 82(4) [02016R0679-20160504#parag_082.004] each responsible controller or processor liable for the entire damage"
  - "GDPR Art 82(5) [02016R0679-20160504#parag_082.005] claim back after paying full compensation"
  - "GDPR Art 26(1), Art 82(2) and Art 82(3) quoted for readings (2) and (5) only; decided in sibling orders and cited by no limb"

query_interface:
  2: "gdpr_joint_controllers_status/2"      # eligibility verdict on the Art 82(5) claim back
  7: "gdpr_joint_controllers_checklist/2"   # justification: one cited item per condition
  16: "gdpr_joint_controllers_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_026
  - 02016R0679-20160504#art_028
  - 02016R0679-20160504#art_082
  reason: 'The titles of Articles 4, 26, 28 and 82 carry no obligation: document structure.
    Deferred so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: joint_controllers_and_their_arrangement
  units:
  - 02016R0679-20160504#parag_026.001
  - 02016R0679-20160504#parag_026.002
  reason: Art 26(1) (who are joint controllers; the arrangement determining their
    responsibilities; a contact point) and Art 26(2) (what the arrangement reflects;
    its essence made available) are decided in gdpr-accountability-security. This
    order reads only whether the caller jointly determines the purposes and means,
    as the judgement key controllers_jointly_determine_purposes_and_means with the
    same meaning as there (reading (2)); Art 26(1) is quoted for that reading and
    cited by no limb.
  consequence: The answers never say whether an arrangement is required, in place
    or adequate; the caller uses gdpr-accountability-security.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-accountability-security
- what: right_to_compensation_and_one_party_liability
  units:
  - 02016R0679-20160504#parag_082.001
  - 02016R0679-20160504#parag_082.002
  - 02016R0679-20160504#parag_082.003
  reason: Art 82(1) to (3) (the right to compensation, the liability of a controller
    and of a processor, the exemption) are decided for one party and one claim in
    gdpr-compensation-and-liability. This order reads their outcome only through responsible_under_article_82_2_and_3
    and other_responsible_parties (reading (5), reading (6)); Art 82(2) and (3) are
    quoted for those readings and cited by no limb.
  consequence: The answers never say whether a party is liable under Art 82(1) to
    (3); the caller uses gdpr-compensation-and-liability for each party.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-compensation-and-liability
- what: courts_competent_for_the_proceedings
  units:
  - 02016R0679-20160504#parag_082.006
  reason: Art 82(6) says court proceedings are brought before the courts competent
    under the law of the Member State referred to in Art 79(2). It is a step of procedure
    with no answer in this order.
  consequence: The answers never say which court is competent.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: processor_contract_and_processor_duties
  units:
  - 02016R0679-20160504#parag_028.001
  - 02016R0679-20160504#parag_028.002
  - 02016R0679-20160504#parag_028.003
  - 02016R0679-20160504#point_028.003_a
  - 02016R0679-20160504#point_028.003_b
  - 02016R0679-20160504#point_028.003_c
  - 02016R0679-20160504#point_028.003_d
  - 02016R0679-20160504#point_028.003_e
  - 02016R0679-20160504#point_028.003_f
  - 02016R0679-20160504#point_028.003_g
  - 02016R0679-20160504#point_028.003_h
  - 02016R0679-20160504#parag_028.004
  - 02016R0679-20160504#parag_028.006
  - 02016R0679-20160504#parag_028.007
  - 02016R0679-20160504#parag_028.009
  reason: Art 28(1) to (4), (6), (7) and (9), with the points of Art 28(3), govern
    the choice of processor, sub-processors and the processor contract; they are formalised
    in gdpr-processor-contract (which defers the last sentence of Art 28(4), on the
    initial processor's liability, as debt). No limb of this order reads them.
  consequence: The answers never say whether a processor contract is adequate; the
    caller uses gdpr-processor-contract.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-processor-contract
- what: art_28_5_codes_of_conduct_and_certification
  units:
  - 02016R0679-20160504#parag_028.005
  reason: Art 28(5) lets adherence to an approved code of conduct or certification
    mechanism serve as an element to demonstrate sufficient guarantees; gdpr-processor-contract
    defers it as debt and no limb of this order reads it.
  consequence: The answers never say what a code of conduct or certification shows.
  declaration: not_an_exception
  debt: true
  open: formalisable in the processor-contract order; the deferral stands for this
    run.
- what: art_28_8_adoption_of_standard_clauses
  units:
  - 02016R0679-20160504#parag_028.008
  reason: 'Art 28(8) lets a supervisory authority adopt standard contractual clauses
    in accordance with the consistency mechanism: an act of an institution, not a
    rule a caller applies.'
  consequence: The answers never say whether clauses were adopted.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: definitions_decided_in_the_data_and_processing_order
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_5
