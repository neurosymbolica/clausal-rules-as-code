  - 02016R0679-20160504#point_004_11
  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  reason: Art 4(1) to (6), (9) to (12), (25) and (26) are formalised in gdpr-common-definitions-data-and-processing;
    no limb of this order reads them.
  consequence: This order gives no answer for these points; the caller uses gdpr-common-definitions-data-and-processing.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-common-definitions-data-and-processing
- what: definitions_decided_in_the_roles_order
  units:
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_8
  - 02016R0679-20160504#point_004_13
  - 02016R0679-20160504#point_004_14
  - 02016R0679-20160504#point_004_15
  - 02016R0679-20160504#point_004_16
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  - 02016R0679-20160504#point_004_24
  reason: Art 4(7), (8), (13) to (16), (18), (19), (22) to (24), with the lettered
    parts of 4(16), 4(22) and 4(23), are formalised in gdpr-common-definitions-roles-and-establishments;
    this order asks no key about the caller's role (reading (1)) and reads none of
    them.
  consequence: This order does not decide who is a controller or a processor; the
    caller uses gdpr-common-definitions-roles-and-establishments.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-common-definitions-roles-and-establishments
- what: definitions_of_representative_and_binding_corporate_rules
  units:
  - 02016R0679-20160504#point_004_17
  - 02016R0679-20160504#point_004_20
  reason: Art 4(17) (representative) and Art 4(20) (binding corporate rules) are not
    read by any limb of this order; no order on main cites them (both are deferred
    in gdpr-common-definitions-roles-and-establishments), and gdpr-binding-corporate-rules
    is in draft for Art 4(20).
  consequence: The answers never say whether a person is a representative or whether
    rules are binding corporate rules.
  declaration: not_an_exception
  debt: true
  open: formalisable elsewhere; this order does not need them.
- what: definition_of_supervisory_authority
  units:
  - 02016R0679-20160504#point_004_21
  reason: Whether a body is a supervisory authority turns on its establishment by
    a Member State pursuant to Article 51; no limb of this order reads it.
  consequence: The answers never say whether a body is a supervisory authority.
  declaration: not_an_exception
  not_formalized_because: national_law

excluded_set:
- what: administrative_fines_and_penalties
  instrument: Regulation (EU) 2016/679 Arts 83 and 84
  cites:
  - 02016R0679-20160504#art_083
  - 02016R0679-20160504#art_084
  reason: Art 28(10) is without prejudice to Arts 83 and 84; fines and penalties are
    a separate matter and no limb reads them.
  consequence: The answers never say that a fine or penalty is due, nor that it is
    not.
- what: data_subject_rights
  instrument: Regulation (EU) 2016/679 Arts 12 to 22
  cites:
  - 02016R0679-20160504#art_012
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  - 02016R0679-20160504#art_015
  - 02016R0679-20160504#art_016
  - 02016R0679-20160504#art_017
  - 02016R0679-20160504#art_018
  - 02016R0679-20160504#art_019
  - 02016R0679-20160504#art_020
  - 02016R0679-20160504#art_021
  - 02016R0679-20160504#art_022
  reason: Art 26(3) speaks of the data subject's 'rights under this Regulation'; which
    rights exist and how a request is answered is decided by the data-subject-rights
    orders (reading (3)).
  consequence: The answers never say whether a given request must be granted or how
    it is answered.
- what: judicial_remedy_against_a_controller_or_processor
  instrument: Regulation (EU) 2016/679 Art 79
  cites:
  - 02016R0679-20160504#art_079
  reason: Art 82(6) points to Art 79(2) for the competent courts; the judicial remedy
    is not modelled by this order.
  consequence: The answers never say which court hears a claim.
