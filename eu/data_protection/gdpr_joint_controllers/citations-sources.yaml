eu_reg_2016_679_art_26_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_026.003"
  retrieved: 2026-11-12
  note: >-
    Art 26(3): the data subject may exercise its rights in respect of and against
    each of the joint controllers, irrespective of the terms of the arrangement.
    Anchors limbs A1 and A4 of rights_against_each_joint_controller and the A3
    open_textured referral.
eu_reg_2016_679_art_28_10:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_028.010"
  retrieved: 2026-11-12
  note: >-
    Art 28(10): a processor that determines the purposes and means of processing is
    considered a controller for that processing; read as the pointer that brings a
    jointly-determining processor within 'each of the controllers' of Art 26(3).
    Cited beside Art 26(3) at limb A4.
