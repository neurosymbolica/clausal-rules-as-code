eu_reg_2016_679_art_26_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  unit: "02016R0679-20160504#parag_026.003"
  note: >-
    Art 26(3): the data subject may exercise its rights against each joint
    controller irrespective of the terms of the arrangement. Anchors limbs A1
    (the rule whose reach not_joint_controllers denies), A3 (open_textured
    citation) and A4 (rights_exercisable_against_this_controller).
eu_reg_2016_679_art_28_10:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  unit: "02016R0679-20160504#parag_028.010"
  note: >-
    Art 28(10): a processor determining the purposes and means is considered a
    controller for that processing. Read as the pointer that brings a processor
    that jointly determines within 'each of the controllers' of Art 26(3);
    cited beside Art 26(3) in every A4 answer (reading (4), Q2, Q12).
eu_reg_2016_679_art_82_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-15
  unit: "02016R0679-20160504#parag_082.004"
  note: >-
    Art 82(4): each responsible controller or processor in the same processing
    is liable for the entire damage. Load-bearing wording 'where they are, under
    paragraphs 2 and 3, responsible' (read as at least two responsible parties,
    Q1). Anchors B1, B4, B5 and is the citation of the outside-fact referral
    (B2, C4).
