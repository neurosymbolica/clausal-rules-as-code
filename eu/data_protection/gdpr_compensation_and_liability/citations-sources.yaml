eu_reg_2016_679_art_82_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_082.001"
  retrieved: 2026-11-12
  note: >-
    Art 82(1): the right to compensation. Load-bearing for the three judgement
    keys (damage, infringement, causal link 'as a result of'); a false judgement
    gives right_not_established; an unsure one refers as open_textured.
eu_reg_2016_679_art_82_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_082.002"
  retrieved: 2026-11-12
  note: >-
    Art 82(2): first sentence, the controller 'involved in processing'
    (involved_in_the_processing); second sentence, the processor 'only where'
    it breached processor obligations or acted outside or contrary to lawful
    instructions (the two crisp processor keys). Outside the limb gives
    not_liable_for_damage.
