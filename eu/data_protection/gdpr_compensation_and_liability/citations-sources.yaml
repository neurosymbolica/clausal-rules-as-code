  retrieved: 2026-11-16
  note: >-
    Art 82(1), unit 02016R0679-20160504#parag_082.001: the right to compensation
    and its three conditions (damage, infringement, 'as a result of'), read as
    three tri-state judgements of the caller; a false one gives
    right_not_established, an unsure one is referred as open_textured.
eu_reg_2016_679_art_82_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-16
  note: >-
    Art 82(2), unit 02016R0679-20160504#parag_082.002: the controller limb
    ('any controller involved in processing') and the processor limb ('only
    where' it breached processor obligations or acted outside or contrary to
    lawful instructions); a caller outside the limb is not_liable_for_damage.
