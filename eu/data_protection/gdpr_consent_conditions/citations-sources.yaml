eu_reg_2016_679_art_7_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-11
  note: >-
    Art 7(1), unit parag_007.001: where processing is based on consent the
    controller shall be able to demonstrate consent. Limb L1 (outside fact
    consent_demonstrable); citation of its referral row.
eu_reg_2016_679_art_7_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-11
  note: >-
    Art 7(2), unit parag_007.002: the request for consent in a written
    declaration also concerning other matters is presented clearly
    distinguishable, intelligible, easily accessible, in clear and plain
    language (limb L2, one judgement, outside fact
    request_clearly_distinguishable_and_intelligible); last sentence: an
    infringing part of the declaration is not binding (consent_declaration_effect).
eu_reg_2016_679_art_7_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-11
  note: >-
    Art 7(3), unit parag_007.003, third and fourth sentences only: informed of
    the right to withdraw before consent (crisp key) and withdrawal as easy as
    giving consent (outside fact). Limb L3. First two sentences deferred (Q4).
eu_reg_2016_679_art_7_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-11
  note: >-
    Art 7(4), unit parag_007.004: utmost account of whether performance of a
    contract is conditional on consent not necessary for it. Limb L4 (outside
    fact consent_freely_given, Q10) and the reported non-binding factor
    contract_conditional_on_unneeded_consent.
eu_reg_2016_679_art_11_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-11
  note: >-
    Art 11(1), unit parag_011.001: where the purposes do not or no longer
    require identification, no obligation to acquire identifying information
    for the sole purpose of complying with the Regulation (identification_obligation;
    the qualifier has no key, Q8).
eu_reg_2016_679_art_11_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-11
  note: >-
    Art 11(2), unit parag_011.002: engaged when the Art 11(1) case holds and the
    controller can demonstrate it cannot identify the data subject; inform the
    data subject if possible (identification_information_duty); Articles 15 to
    20 do not apply unless identifying information is provided
    (identification_rights_effect, Q5).
