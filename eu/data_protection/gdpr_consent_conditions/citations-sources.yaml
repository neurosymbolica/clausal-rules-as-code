# Citation sourcing manifest for eu/data_protection/gdpr_consent_conditions.
# Source of record: Regulation (EU) 2016/679 (GDPR), consolidated English Formex text 02016R0679-20160504.
# status: verified (verbatim is an exact substring of the pinned unit text)
# The seven *_statement keys are referral targets (caller statements), unverified: no verbatim.
eu_reg_2016_679_art_7_1:
  status: verified
  url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
  retrieved: 2026-11-11
  verbatim: 'Where processing is based on consent, the controller shall be able to demonstrate that the data subject has consented to processing of his or her personal data.'
  note: >-
    Art 7(1): the controller must be able to demonstrate consent.
eu_reg_2016_679_art_7_2:
  status: verified
  url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
  retrieved: 2026-11-11
  verbatim: 'the request for consent shall be presented in a manner which is clearly distinguishable from the other matters, in an intelligible and easily accessible form, using clear and plain language'
  note: >-
    Art 7(2): presentation of a consent request within a declaration that concerns other matters; the last sentence (non-binding part) is a consequence.
eu_reg_2016_679_art_7_3:
  status: verified
  url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
  retrieved: 2026-11-11
  verbatim: 'Prior to giving consent, the data subject shall be informed thereof. It shall be as easy to withdraw as to give consent.'
  note: >-
    Art 7(3) third and fourth sentences; the first two sentences are deferred.
eu_reg_2016_679_art_7_4:
  status: verified
  url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
  retrieved: 2026-11-11
  verbatim: 'When assessing whether consent is freely given, utmost account shall be taken of whether, inter alia, the performance of a contract, including the provision of a service, is conditional on consent to the processing of personal data that is not necessary for the performance of that contract.'
  note: >-
    Art 7(4): the named factor is reported and decides nothing.
eu_reg_2016_679_art_11_1:
  status: verified
  url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
  retrieved: 2026-11-11
  verbatim: 'the controller shall not be obliged to maintain, acquire or process additional information in order to identify the data subject for the sole purpose of complying with this Regulation.'
  note: >-
    Art 11(1): relief from acquiring identifying information.
eu_reg_2016_679_art_11_2:
  status: verified
  url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
  retrieved: 2026-11-11
  verbatim: 'Where, in cases referred to in paragraph 1 of this Article, the controller is able to demonstrate that it is not in a position to identify the data subject, the controller shall inform the data subject accordingly, if possible.'
  note: >-
    Art 11(2): informing duty and disapplication of Arts 15 to 20.
