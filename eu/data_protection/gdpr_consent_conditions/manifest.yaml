# Reuse-declaration lever: shared backbone packages this domain imports.
# It imports only the kit (formalize_lib), no shared backbone package.
uses: []

scope: "Regulation (EU) 2016/679 (GDPR) Art 7(1), 7(2), 7(3) third and fourth
  sentences and 7(4), and Art 11(1) and 11(2). Decided here, on facts the caller
  states: whether the conditions for consent in Art 7 are met for processing the
  caller states is based on consent (consent_conditions_status); the consequence
  of Art 7(2) last sentence that an infringing part of a written declaration is
  not binding (consent_declaration_effect); the one Art 7(4) factor, reported and
  deciding nothing (consent_assessment_factors); the Art 11(1) relief from
  acquiring identifying information (identification_obligation); the Art 11(2)
  duty to inform the data subject, if possible (identification_information_duty);
  and whether Arts 15 to 20 apply under Art 11(2) (identification_rights_effect).
  The seven open-textured limbs are OUTSIDE FACTS (operator rulings
  of 2026-11-11): each is stated as attested(true or false, attestation(By, At,
  Reason, Evidence)), copied into the answer and never decided; an absent one the
  answer turns on refers (cross_reference_unresolved). Out of scope: whether a
  statement is a consent (Art 4(11)), whether processing rests on consent (Art
  6(1)(a)), Arts 8 and 9(2)(a), the content of Arts 15 to 20 (sibling orders), and
  Art 7(3) first two sentences (deferred, open question Q4)."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April
    2016 on the protection of natural persons with regard to the processing of
    personal data and on the free movement of such data (General Data Protection
    Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504
    (English Formex, fetched 2026-11-11), Art 7(1) [parag_007.001], Art 7(2)
    [parag_007.002], Art 7(3) [parag_007.003] third and fourth sentences, Art 7(4)
    [parag_007.004], Art 11(1) [parag_011.001], Art 11(2) [parag_011.002]."

query_interface:
  2: "gdpr_consent_conditions_eligibility/2"     # eligibility verdict with a cited checklist
  13: "gdpr_consent_conditions_compliance/3"     # compliance check of a proposed action
  14: "gdpr_consent_conditions_obligations/2"    # obligation surfacing
  16: "gdpr_consent_conditions_what_if/4"        # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_007
  - 02016R0679-20160504#art_011
  reason: 'The titles of Articles 7 and 11 carry no obligation: document structure.
    Deferred so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- debt: true
  partial: true
  what: art_7_3_right_to_withdraw_and_its_effect
  units:
  - 02016R0679-20160504#parag_007.003
  reason: The first two sentences of Art 7(3) (the data subject has the right to withdraw
    consent at any time; withdrawal does not affect the lawfulness of processing based
    on consent before the withdrawal) state a right and an effect on EARLIER processing.
    The text gives no outcome for processing after the withdrawal, and a date comparison
    needs a ruling on the day of the withdrawal (open question Q4). The third and
    fourth sentences ARE formalised (the keys informed_of_withdrawal_right_before_consent
    and withdrawal_as_easy_as_giving_consent).
  consequence: The answers do not say whether processing on a given date was lawful
    given a withdrawal; the caller checks Art 7(3) first two sentences.
  declaration: answered_with_caveat

excluded_set:
- what: consent_definition
  instrument: Regulation (EU) 2016/679 Art 4(11)
  cites:
  - 02016R0679-20160504#point_004_11
  reason: Whether a statement is a consent (freely given, specific, informed and unambiguous)
    is decided by the sibling order gdpr-common-definitions-data-and-processing; not
    pinned here.
  consequence: The caller establishes that there is a consent; the order decides only
    the conditions of Art 7.
- what: art_6_1_a_consent_basis
  instrument: Regulation (EU) 2016/679 Art 6(1)(a)
  cites:
  - 02016R0679-20160504#point_006.001_a
  reason: Whether processing rests on consent as a ground is decided by the sibling
    order gdpr-art6-lawfulness; the crisp key processing_based_on_consent carries
    the condition.
  consequence: The caller states processing_based_on_consent.
- what: children_and_special_categories
  instrument: Regulation (EU) 2016/679 Arts 8 and 9(2)(a)
  cites:
  - 02016R0679-20160504#art_008
  - 02016R0679-20160504#point_009.002_a
  reason: The age of a child who may consent (Art 8) and explicit consent for special
    categories (Art 9(2)(a)) are decided by sibling orders; Art 7 applies to them
    as to any consent.
  consequence: The caller runs the sibling orders for those questions.
- what: data_subject_rights_articles_15_to_20
  instrument: Regulation (EU) 2016/679 Arts 15 to 20
  cites:
  - 02016R0679-20160504#art_015
  - 02016R0679-20160504#art_020
  reason: Art 11(2) says Arts 15 to 20 do not apply in a case; what those rights require
    is decided by the data-subject-rights sibling orders, not here.
  consequence: identification_rights_effect reports only whether Arts 15 to 20 apply;
    the caller runs the sibling orders for their content.
