# SPDX-License-Identifier: EUPL-1.2
# Single source of truth for this domain's profile keys (GDPR Ch V transfer inputs).
rulebase: transfer_lawfulness.clausal
keys:
  adequacy_decision_in_force: bool     # Art 45: an adequacy decision covers this third country/territory
  safeguard_in_place: bool             # Art 46: a valid appropriate safeguard instrument exists
  derogation_claimed: value            # Art 49: which specific derogation is claimed (atom or absent);
                                       # statutory atoms: art49_1_a..art49_1_g (corrected letters per OJ)
                                       # or art49_1_second_subpara for the CLI limb.
  # Art 49(3) cross-cutting negative element
  public_authority_public_powers: bool # Art 49(3): transferor is a public authority exercising
                                       # public powers (defeats (a),(b),(c) and the CLI limb)
  # Art 49(1) first-subparagraph enabling keys
  explicit_consent_obtained: bool      # Art 49(1)(a): data subject gave explicit informed consent
                                       # to the proposed transfer (includes informed-of-risks element)
  contract_necessity: bool             # Art 49(1)(b): transfer necessary for performance of a
                                       # contract with the data subject / pre-contractual measures
  ds_interest_contract_necessity: bool # Art 49(1)(c): transfer necessary for a contract concluded
                                       # in the interest of the data subject between the controller
                                       # and ANOTHER natural or legal person
  important_public_interest: bool      # Art 49(1)(d): important public interest recognised in
                                       # Union or Member State law (Art 49(4) qualification)
  legal_claims_necessity: bool         # Art 49(1)(e): establishment, exercise or defence of
                                       # legal claims
  vital_interests_necessity: bool      # Art 49(1)(f): vital interests where data subject is
                                       # physically or legally incapable of giving consent
  # Art 49(1)(g) register derogation enabling keys (plus Art 49(2) limits)
  register_public_by_law: bool         # Art 49(1)(g): register is open to public consultation
                                       # by Union/MS law
  register_consultation_conditions_fulfilled: bool  # Art 49(1)(g) tail: conditions for
                                       # consultation fulfilled in the particular case
  register_not_entire: bool            # Art 49(2) s.1: transfer does not involve the entirety of
                                       # the personal data or entire categories in the register
  register_requester_condition_met: bool  # Art 49(2) s.2: legitimate-interest register ->
                                       # transfer only at those persons' request or to them as
                                       # recipients (set True when register is open to general public)
  # Art 49(1) second subparagraph (CLI limb) enabling key
  legitimate_interests_derogation: bool  # Art 49(1) subpara 2: compelling legitimate interests
                                         # (not repetitive, limited data subjects, necessity,
                                         # balancing, assessment+safeguards, inform SA, inform DS)
