independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports no shared backbone package (only the kit).
uses: []

scope: "Regulation (EU) 2016/679 Art 12(3), with Regulation (EEC, Euratom) No 1182/71 Art 3(1) second subparagraph, 3(2)(c) and 3(4) applied to its periods (ruling Q3, 2026-11-01, a lawyer point). Decided here: which period binds the controller for information on action taken on a request under Articles 15 to 22 (the one-month first_period, or the extended_period of three months counted from receipt when the controller claims the extension and the user judges it necessary for the complexity and number of the requests; an unsure judgement is referred, an absent one is indeterminate); the deadline date for a receipt date and a period (same date in the last month, else its last day, a Saturday or Sunday moved to the following working day; no public-holiday shift, as response_deadline/3 takes no profile); the record of the five outside facts as given or absent; and the input check of the fifty-four-key profile contract. Out of scope: 'without undue delay' (only the outer limit is computed), Art 12(2), 12(4), 12(5) and 12(6) (sibling orders on response duties), the electronic-means modality of Art 12(3), any later clock start (Q23), and the public-holiday shift of the original relation request_response_deadline/2."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council (General Data Protection Regulation), OJ L 119, 4.5.2016, consolidated text 02016R0679-20160504: Article 12(3) (operative), Article 12(2), 12(4), 12(5), 12(6) (quoted for context, deferred)"
  - "Regulation (EEC, Euratom) No 1182/71 of the Council determining the rules applicable to periods, dates and time limits, OJ L 124, 8.6.1971 (CELEX 31971R1182): Article 3(1) second subparagraph, Article 3(2)(c), Article 3(4)"

query_interface:
  2: "gdpr_data_subject_rights_response_period_status/2"      # status verdict: which period binds
  15: "response_deadline/3"                                   # deadline: date by which the information is due
  16: "gdpr_data_subject_rights_response_period_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_012
  reason: 'The titles of Article 12 carry no obligation: document structure, not operative
    law. Deferred so every unit of the pinned extracts is accounted for.'
  consequence: 'None for a caller: the article titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: art12_4_no_action_notice
  units:
  - 02016R0679-20160504#parag_012.004
  reason: Art 12(4) (informing the data subject of the reasons for not taking action,
    and of the complaint and remedy, within one month) is a duty of the response,
    decided in the sibling order on response duties; this order answers only the applicable
    period and the deadline.
  consequence: A caller asking whether a notice of no action is owed, and by when,
    uses the response-duties answer.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-response-duties
- what: art12_5_free_of_charge_and_relief
  units:
  - 02016R0679-20160504#parag_012.005
  reason: Art 12(5) (the response is free of charge; for a manifestly unfounded or
    excessive request the controller may charge a reasonable fee or refuse to act)
    decides whether and on what terms the controller acts, decided in the sibling
    order on response duties; it does not change the period this order computes.
  consequence: A caller asking whether a fee may be charged or the request refused
    uses the response-duties answer.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-response-duties
- what: art12_6_identity_doubt
  units:
  - 02016R0679-20160504#parag_012.006
  reason: Art 12(6) (the controller may request information confirming the identity
    of the data subject where it has reasonable doubts) is a step of the response,
    decided in the sibling order on response duties; the Regulation does not say it
    changes the one-month period, and this order reads no such effect.
  consequence: A caller asking whether identity information may be requested uses
    the response-duties answer.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-response-duties
- debt: true
  what: art12_1_form_of_communication
  units:
  - 02016R0679-20160504#parag_012.001
  reason: The duty to give information in a concise, transparent, intelligible and
    easily accessible form, in writing or orally, is a quality-of-communication duty;
    the profile carries no input for it.
  consequence: the caller checks the form of the answer.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: art12_2_first_sentence_facilitate
  units:
  - 02016R0679-20160504#parag_012.002
  reason: Art 12(2) is read by no query of this order. Its first sentence (the controller
    shall facilitate the exercise of the rights) is a general duty, not a condition
    scored; its second sentence (the controller shall not refuse to act on a request
    under Arts 15 to 22 unless it demonstrates that it is not in a position to identify
    the data subject) concerns whether the controller acts, not the period or the
    deadline.
  consequence: 'No answer tests whether the controller facilitates the exercise of
    the rights (Art 12(2), first sentence), for example by offering a usable way to
    make a request, nor whether it may refuse to act for want of identification (Art
    12(2), second sentence): the caller checks both itself.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights
- debt: true
  what: art12_3_electronic_means
  units:
  - 02016R0679-20160504#parag_012.003
  partial: true
  reason: The last sentence of Art 12(3) (where the request is made by electronic
    form means, the information shall be provided by electronic means where possible)
    is a modality of the answer; not scored. The first three sentences are in scope
    (readings 2 and 3).
  consequence: 'No answer says how the information is to be delivered: where the request
    was made by electronic form means, the caller checks that the information is provided
    by electronic means where possible, unless the data subject asked otherwise (Art
    12(3), last sentence).'
  declaration: not_an_exception
- debt: true
  what: art12_5_fee_amount
  units:
  - 02016R0679-20160504#point_012.005_a
  - 02016R0679-20160504#point_012.005_b
  reason: Point (a) (a reasonable fee taking into account administrative costs) and
    point (b) (refuse to act) are the two alternatives of the Art 12(5) relief; no
    query of this order reports the relief or the fee option (the sibling order on
    response duties does), so the controller's choice between them is not decided
    here.
  consequence: 'The answer does not say whether the controller charges a reasonable
    fee (Art 12(5)(a)) or refuses to act (Art 12(5)(b)), nor what fee is reasonable:
    the caller decides that choice and checks that any fee reflects the administrative
    costs of the information, communication or action.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- debt: true
  what: art12_7_and_12_8_icons
  units:
  - 02016R0679-20160504#parag_012.007
  - 02016R0679-20160504#parag_012.008
  reason: 'Standardised icons for Arts 13 and 14 information, and the delegated act
    on them: not a data subject request under Arts 15-22.'
  consequence: 'None for a caller: the standardised icons of Art 12(7) and the delegated
    acts of Art 12(8) concern Arts 13 and 14 information, not a request under Arts
    15 to 22.'
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- not_formalized_because: structural
  what: regulation_1182_71_article_headings
  units:
  - 31971R1182#art_002
  - 31971R1182#art_003
  - 31971R1182#art_004
  - 31971R1182#art_005
  reason: 'The titles of Articles 2 to 5 of Regulation (EEC, Euratom) No 1182/71 carry
    no rule: document structure, not operative law. Deferred so every unit of the
    pinned extracts is accounted for.'
  consequence: 'None for a caller: an article title carries no rule.'
  declaration: not_an_exception
- debt: true
  what: regulation_1182_71_article_1_scope
  units:
  - 31971R1182#art_001
  reason: Article 1 limits Regulation (EEC, Euratom) No 1182/71 to acts of the Council
    or Commission; Regulation (EU) 2016/679 is an act of the European Parliament and
    of the Council. This order applies Article 3 to the periods of Regulation (EU)
    2016/679 by analogy (a lawyer point, see PERIODS), so no rule reads Article 1.
  consequence: 'Every deadline this order gives rests on applying Article 3 of Regulation
    (EEC, Euratom) No 1182/71 to Regulation (EU) 2016/679, which Article 1 of that
    Regulation does not itself provide: a caller that relies on the date accepts that
    reading, or computes the period under the rule it holds applicable.'
  declaration: answered_with_caveat
- not_formalized_because: national_law
  what: regulation_1182_71_article_2_public_holidays_and_working_days
  units:
  - 31971R1182#parag_002.001
  - 31971R1182#parag_002.002
  reason: 'Article 2(1) defines public holidays as the days designated as such in
    the Member State or in the Community institution in which action is to be taken,
    as published by the Commission in the Official Journal; Article 2(2) defines working
    days as all days other than public holidays, Sundays and Saturdays. This order
    chooses no Member State or institution and reads no published list: public holidays
    arrive as the outside fact public_holidays, and PERIODS states the working day
    of the Article 3(4) shift itself.'
  consequence: 'response_deadline/3 moves a deadline only for a Saturday or a Sunday:
    where the date it gives is a public holiday of the Member State or Community institution
    in which the action is to be taken (Article 2(1)), the caller moves it to the
    following working day itself. public_holidays is only recorded by request_outside_facts/2.'
  declaration: answered_with_caveat
- debt: true
  what: regulation_1182_71_article_3_rules_not_applied
  units:
  - 31971R1182#parag_003.002
  - 31971R1182#point_003.002_a
  - 31971R1182#point_003.002_b
  - 31971R1182#point_003.002_d
  - 31971R1182#parag_003.003
  - 31971R1182#parag_003.005
  reason: The periods of this order are expressed in months and run from an event,
    so they read only Article 3(1), second subparagraph, Article 3(2)(c) and Article
    3(4) (PERIODS). The opening words of Article 3(2) only make point (c) subject
    to paragraphs 1 and 4, which is how PERIODS applies them; points (a), (b) and
    (d) govern periods expressed in hours, in days and in parts of months; Article
    3(3) (Saturdays, Sundays and public holidays count within a period) holds by construction
    in a count of calendar months; Article 3(5) (a period of two days or more includes
    at least two working days) is not applied.
  consequence: 'None for a caller: no period of this order is expressed in hours,
    in days or in parts of months, and a period of a month or more holds the two working
    days of Article 3(5).'
  declaration: not_an_exception
- not_formalized_because: institutional
  what: regulation_1182_71_articles_4_and_5_acts_and_specified_dates
  units:
  - 31971R1182#parag_004.001
  - 31971R1182#parag_004.002
  - 31971R1182#parag_004.003
  - 31971R1182#parag_005.001
  - 31971R1182#parag_005.002
  reason: 'Article 4 governs the entry into force, taking effect, application and
    expiry of acts of the Council or Commission; Article 5 governs an action to be
    effected at a specified moment or date in implementation of such an act. No period
    of this order is either: each runs from an event (PERIODS).'
  consequence: 'None for a caller: no answer of this order concerns the entry into
    force or expiry of an act, or an action fixed at a specified moment or date.'
  declaration: not_an_exception

excluded_set:
- what: art11_2_identification_not_required
  instrument: Regulation (EU) 2016/679 Art 11(2)
  cites:
  - 02016R0679-20160504#parag_011.002
  reason: Art 12(2) refers to the cases of Art 11(2) (the controller does not need
    to identify the data subject). Not pinned; the key controller_demonstrates_unable_to_identify_data_subject
    presupposes such a case, but no query of this order reads that key.
  consequence: The caller states through controller_demonstrates_unable_to_identify_data_subject
    whether the controller can show it is not in a position to identify the data subject;
    the order does not check the Art 11(2) case itself.
- what: art13_art14_information_duties
  instrument: Regulation (EU) 2016/679 Arts 13 and 14
  cites:
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  reason: Information provided when data are collected; Art 12 governs both, but this
    order is about the requests of Arts 15 to 22.
  consequence: The order does not test the information to be given when data are collected;
    a caller checks Arts 13 and 14 itself (see the sibling order gdpr-information-duties).
- what: art34_communication_of_a_breach
  instrument: Regulation (EU) 2016/679 Art 34
  cites:
  - 02016R0679-20160504#art_034
  reason: Art 12 also governs the communication under Art 34; the sibling order gdpr-breach-notification
    (domain eu/data-protection/gdpr-arts33-34-breach-notification) owns it.
  consequence: The order does not test the communication of a breach to the data subject;
    a caller uses the sibling order gdpr-breach-notification for it.
- what: art26_joint_controllers_and_art28_processors
  instrument: Regulation (EU) 2016/679 Arts 26 and 28
  cites:
  - 02016R0679-20160504#art_026
  - 02016R0679-20160504#art_028
  reason: Who answers a request when there are joint controllers or a processor is
    a separate question; not pinned.
  consequence: The order assumes the request reached the controller who must answer
    it; where there are joint controllers or a processor, the caller works out who
    answers under Arts 26 and 28 itself.
- what: art77_to_art79_remedies
  instrument: Regulation (EU) 2016/679 Arts 77 to 79
  cites:
  - 02016R0679-20160504#art_077
  - 02016R0679-20160504#art_078
  - 02016R0679-20160504#art_079
  reason: The complaint and judicial remedy that Art 12(4) requires the controller
    to mention are not formalized; no query of this order says what the controller
    must mention.
  consequence: The order does not test whether a complaint or a judicial remedy is
    available or succeeds; a caller applies Arts 77 to 79 itself.
- what: art83_5_b_fines_for_breach_of_data_subject_rights
  instrument: Regulation (EU) 2016/679 Art 83(5)(b)
  cites:
  - 02016R0679-20160504#point_083.005_b
  reason: The consequence of failing a duty here is owned by the sibling eu/data-protection/gdpr-administrative-fine-maximum.
  consequence: The order says which period and deadline apply, not whether a duty
    is met or what fine follows; a caller uses the sibling eu/data-protection/gdpr-administrative-fine-maximum
    for the maximum fine.
- what: regulatory_guidance
  instrument: EDPB Guidelines 01/2022 on data subject rights - right of access; Guidelines
    4/2019 on Article 25; WP29 Guidelines on automated individual decision-making
    and on data portability
  cites:
  - 02016R0679-20160504#parag_070.001
  - 02016R0679-20160504#point_070.001_e
  - 02016R0679-20160504#point_070.001_f
  reason: Soft law, not pinned, not quoted and relied on by no reading here (the 'provided
    by' scope of Art 20 and the meaning of 'solely' in Art 22 are in the guidance
    and concern the sibling orders, not this one; what the guidance says on the start
    of the one-month clock is open question (Q23)).
  consequence: The cites are the Board's guideline mandate in Art 70(1), not the guidance
    itself. A caller who relies on the guidance on access, portability or automated
    decisions reads it and applies it itself.
