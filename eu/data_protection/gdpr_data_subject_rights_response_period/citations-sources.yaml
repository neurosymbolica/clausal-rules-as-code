eu_reg_1971_1182_art_3_1:
  status: verified
  url: "http://publications.europa.eu/resource/celex/31971R1182.ENG.fmx4"
  retrieved: 2026-11-05
  note: >-
    Art 3(1), second subparagraph: the day of receipt is not counted. Marker only
    (implements/1); never returned in a result.
eu_reg_1971_1182_art_3_2_c:
  status: verified
  url: "http://publications.europa.eu/resource/celex/31971R1182.ENG.fmx4"
  retrieved: 2026-11-05
  note: >-
    Art 3(2)(c): a period in months ends on the same date in the last month, or
    on the last day of that month when it has no such date. The extended period
    is three months counted from receipt in one step. Marker only.
eu_reg_1971_1182_art_3_4:
  status: verified
  url: "http://publications.europa.eu/resource/celex/31971R1182.ENG.fmx4"
  retrieved: 2026-11-05
  note: >-
    Art 3(4): a last day on a Saturday, Sunday or public holiday moves to the end
    of the following working day. response_deadline/3 applies the Saturday and
    Sunday part only; public holidays are only recorded. Marker only.
