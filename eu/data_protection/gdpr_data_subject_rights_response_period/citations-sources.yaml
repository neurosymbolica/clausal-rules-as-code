eu_reg_2016_679_art_12_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  retrieved: 2026-11-12
  note: >-
    GDPR Art 12(3), pinned unit 02016R0679-20160504#parag_012.003. Anchors the
    one-month outer limit counted from receipt of the request and the extension
    by two further months where necessary, taking into account the complexity
    and number of the requests (the open-textured judgement
    extension_necessary_for_complexity_and_number). 'Without undue delay', the
    extension notice and the electronic-means sentence are not modelled.
