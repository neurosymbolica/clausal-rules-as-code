eu_reg_2016_679_art_77_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_077.001"
  retrieved: 2026-11-12
  note: >-
    Art 77(1): the right of every data subject to lodge a complaint with a
    supervisory authority 'if the data subject considers' that the processing
    infringes the Regulation. Anchors complaint_right/3 (the consideration is
    the caller's crisp statement; 'in particular' is not a closed list).
eu_reg_2016_679_art_78_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_078.001"
  retrieved: 2026-11-12
  note: >-
    Art 78(1): the remedy of each natural or legal person against a 'legally
    binding decision' of a supervisory authority 'concerning them'. Both are
    open-textured tri-state judgements. Anchors authority_decision_remedy_right/3
    and the CITATION of its open_textured referral.
eu_reg_2016_679_art_78_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_078.002"
  retrieved: 2026-11-12
  note: >-
    Art 78(2): the data subject's remedy where the authority competent under
    Arts 55 and 56 does not handle a complaint or does not inform within three
    months on the progress or outcome of the Art 77 complaint. The pinned text
    reads 'a an effective judicial remedy'; quoted verbatim. Anchors
    authority_inaction_remedy_right/4 and the CITATION of its
    cross_reference_unresolved referral. The three months are a caller-stated
    boolean, not counted.
eu_reg_2016_679_art_79_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_079.001"
  retrieved: 2026-11-12
  note: >-
    Art 79(1): the data subject's remedy where he or she 'considers' that his or
    her rights have been infringed by non-compliant processing. Anchors
    controller_processor_remedy_right/3.
eu_reg_2016_679_art_79_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_079.002"
  retrieved: 2026-11-12
  note: >-
    Art 79(2): courts of the Member State of an establishment of the controller
    or processor; alternatively those of the data subject's habitual residence,
    unless the defendant is a public authority of a Member State acting in the
    exercise of its public powers. Anchors controller_processor_forum/3.
