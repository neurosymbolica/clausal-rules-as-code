eu_reg_2016_679_art_77_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_077.001"
  retrieved: 2026-11-16
  note: >-
    Art 77(1): every data subject has the right to lodge a complaint with a
    supervisory authority if the data subject considers that the processing
    infringes the Regulation. Anchors complaint_right/3.
eu_reg_2016_679_art_78_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_078.001"
  retrieved: 2026-11-16
  note: >-
    Art 78(1): each natural or legal person has the right to an effective
    judicial remedy against a legally binding decision of a supervisory
    authority concerning them. Both characterisations are open-textured
    judgements. Anchors authority_decision_remedy_right/3.
eu_reg_2016_679_art_78_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_078.002"
  retrieved: 2026-11-16
  note: >-
    Art 78(2): the remedy where the authority competent under Arts 55 and 56
    does not handle a complaint or does not inform within three months. The
    doubled article in the pinned text is quoted verbatim. The three months are
    stated by the caller, not counted. Anchors authority_inaction_remedy_right/4.
eu_reg_2016_679_art_79_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_079.001"
  retrieved: 2026-11-16
  note: >-
    Art 79(1): the data subject's right to an effective judicial remedy where
    he or she considers that his or her rights have been infringed by
    non-compliant processing. Anchors controller_processor_remedy_right/3.
eu_reg_2016_679_art_79_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_079.002"
  retrieved: 2026-11-16
  note: >-
    Art 79(2): courts of the establishment State; alternatively courts of the
    habitual-residence State, unless the defendant is a Member State public
    authority acting in the exercise of its public powers. Anchors
    controller_processor_forum/3.
