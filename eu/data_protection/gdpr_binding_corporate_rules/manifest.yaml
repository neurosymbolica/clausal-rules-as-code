# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports no shared backbone package (only the kit
# library formalize_lib and library(reif)).
uses: []

scope: >-
  Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504,
  Art 4(20) and Art 47(2), points (a) to (n). Given a profile of one set of
  policies, the party that adheres to them and the transfers they are for, the
  package answers: (A) whether the policies are binding corporate rules within
  the meaning of Art 4(20), read as seven elements
  (binding_corporate_rules_definition/3); (B) whether the rules specify
  everything Art 47(2) says binding corporate rules shall specify at least,
  the whole of each point, presence not adequacy except point (n)
  (binding_corporate_rules_content/3); (C) the state of each point (a) to (n)
  with its citation (binding_corporate_rules_content_checklist/2). The roles
  of controller and processor, the group element and the appropriateness of
  training are the caller's judgements; an unsure judgement goes to a lawyer
  (needs_legal_review). OUT OF SCOPE: the approval of binding corporate rules
  by the competent supervisory authority under Art 47(1) (an act of the
  authority; read by gdpr-chapter-v-transfers as binding_corporate_rules_approved),
  whether a transfer may take place (Chapter V, gdpr-chapter-v-transfers),
  whether the group applies its rules in practice, Art 47(3), the other
  safeguards of Art 46, and the definitions of controller, processor and group
  of undertakings (gdpr-common-definitions-roles-and-establishments). A
  content_complete answer is not an approval. a reading, not a
  lawyer's.

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the processing of personal data and on the free movement of such data (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1; consolidated text 02016R0679-20160504: Art 4(20) (definition of binding corporate rules)"
  - "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: Art 47(2), opening words and points (a) to (n) (content binding corporate rules shall specify at least)"
  - "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: Art 4(7), 4(8), 4(19), Art 47 heading, Art 47(1) and (1)(a)-(c), quoted to tie readings only (deferred)"

query_interface:
  3: "binding_corporate_rules_definition/3"          # status_determination: Art 4(20) classification
  13: "binding_corporate_rules_content/3"            # compliance_check: Art 47(2) content check (not an approval)
  7: "binding_corporate_rules_content_checklist/2"   # justification: per-point checklist with cite(...) provenance
  16: "gdpr_binding_corporate_rules_what_if/4"       # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings_and_chapeau
  units:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_046
  - 02016R0679-20160504#art_047
  reason: 'The units of Articles 4, 46 and 47 that hold only the article number and
    title (and for Article 4 the chapeau ''For the purposes of this Regulation:'')
    carry no rule: document structure. Deferred so every unit of the pinned extracts
    is accounted for; the heading of Article 47 is quoted for its title only.'
  consequence: 'None for a caller: an article title carries no rule.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: art_47_1_approval_by_the_competent_supervisory_authority
  units:
  - 02016R0679-20160504#parag_047.001
  - 02016R0679-20160504#point_047.001_a
  - 02016R0679-20160504#point_047.001_b
  - 02016R0679-20160504#point_047.001_c
  reason: 'Art 47(1) is the approval of binding corporate rules by the competent supervisory
    authority in accordance with the consistency mechanism of Article 63, with its
    conditions in points (a) to (c): an act of the authority, not a rule this order
    applies (reading (13)). The order gdpr-chapter-v-transfers reads the approval
    as its outside fact binding_corporate_rules_approved; this order does not decide
    it again. Point (c) refers to paragraph 2, which binding_corporate_rules_content
    formalises.'
  consequence: No answer says whether binding corporate rules are approved or meet
    the conditions of Art 47(1)(a) and (b); a content_complete answer is one condition
    the authority checks, not an approval.
  declaration: not_an_exception
  not_formalized_because: institutional
  decided_in: gdpr-chapter-v-transfers
- what: art_47_3_commission_implementing_acts
  units:
  - 02016R0679-20160504#parag_047.003
  reason: 'Art 47(3) empowers the Commission to specify, by implementing acts, the
    format and procedures for the exchange of information on binding corporate rules:
    an act of the Commission, with no condition on the content of the rules.'
  consequence: No answer applies an implementing act on the format or procedures for
    binding corporate rules.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: art_46_safeguards_decided_in_chapter_v
  units:
  - 02016R0679-20160504#parag_046.001
  - 02016R0679-20160504#parag_046.002
  - 02016R0679-20160504#point_046.002_b
  reason: Art 46(1) (transfers subject to appropriate safeguards), the opening words
    of Art 46(2) and its point (b) (binding corporate rules in accordance with Article
    47 as an appropriate safeguard) are decided in gdpr-chapter-v-transfers, which
    reads binding corporate rules through the approval (its outside fact binding_corporate_rules_approved).
    No query of this order decides whether a transfer may take place.
  consequence: No answer says whether a transfer may take place on the basis of binding
    corporate rules; the caller uses gdpr-chapter-v-transfers.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-chapter-v-transfers
- what: art_46_other_safeguards_and_transition
  debt: true
  units:
  - 02016R0679-20160504#point_046.002_a
  - 02016R0679-20160504#point_046.002_c
  - 02016R0679-20160504#point_046.002_d
  - 02016R0679-20160504#point_046.002_e
  - 02016R0679-20160504#point_046.002_f
  - 02016R0679-20160504#parag_046.003
  - 02016R0679-20160504#point_046.003_a
  - 02016R0679-20160504#point_046.003_b
  - 02016R0679-20160504#parag_046.004
  - 02016R0679-20160504#parag_046.005
  reason: 'Art 46(2) points (a) and (c) to (f), Art 46(3) with its points, Art 46(4)
    and Art 46(5): the other appropriate safeguards (a public-authority instrument,
    standard data protection clauses, codes of conduct, certification, contractual
    clauses and administrative arrangements authorised by the authority), the consistency
    mechanism and the transitional validity of older authorisations. None concerns
    binding corporate rules; gdpr-chapter-v-transfers also leaves them as debt.'
  consequence: No answer deals with the other safeguards of Art 46; the caller checks
    them itself.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this order.
- what: art_4_points_decided_in_gdpr_common_definitions_data_and_processing
  units:
  - 02016R0679-20160504#point_004_1
  - 02016R0679-20160504#point_004_2
  - 02016R0679-20160504#point_004_3
  - 02016R0679-20160504#point_004_4
  - 02016R0679-20160504#point_004_5
  - 02016R0679-20160504#point_004_6
  - 02016R0679-20160504#point_004_9
  - 02016R0679-20160504#point_004_10
  - 02016R0679-20160504#point_004_11
  - 02016R0679-20160504#point_004_12
  - 02016R0679-20160504#point_004_25
  - 02016R0679-20160504#point_004_26
  reason: Art 4(1) to (6), (9) to (12), (25) and (26) are formalised in gdpr-common-definitions-data-and-processing;
    no query of this order reads them.
  consequence: This order gives no answer for these definitions; the caller uses gdpr-common-definitions-data-and-processing.
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: gdpr-common-definitions-data-and-processing
- what: art_4_points_decided_in_gdpr_common_definitions_roles_and_establishments
  units:
  - 02016R0679-20160504#point_004_7
  - 02016R0679-20160504#point_004_8
  - 02016R0679-20160504#point_004_13
  - 02016R0679-20160504#point_004_14
  - 02016R0679-20160504#point_004_15
  - 02016R0679-20160504#point_004_16
  - 02016R0679-20160504#point_004_16_a
  - 02016R0679-20160504#point_004_16_b
  - 02016R0679-20160504#point_004_18
  - 02016R0679-20160504#point_004_19
  - 02016R0679-20160504#point_004_22
  - 02016R0679-20160504#point_004_22_a
  - 02016R0679-20160504#point_004_22_b
  - 02016R0679-20160504#point_004_22_c
  - 02016R0679-20160504#point_004_23
  - 02016R0679-20160504#point_004_23_a
  - 02016R0679-20160504#point_004_23_b
  - 02016R0679-20160504#point_004_24
  reason: 'Art 4(7), (8), (13) to (16) with (16)(a) and (b), (18), (19), (22) with
    (22)(a) to (c), (23) with (23)(a) and (b), and (24) are formalised in gdpr-common-definitions-roles-and-establishments.
    Art 4(7), (8) and (19) are quoted to tie readings (4) and (7): the roles of controller
    and processor and the group element of Art 4(20) are the caller''s judgements
    here and are not decided again.'
  consequence: This order gives no answer for these definitions; the caller uses gdpr-common-definitions-roles-and-establishments,
