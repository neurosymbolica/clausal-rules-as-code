  - 02016R0679-20160504#point_004_21
  reason: Art 4(17) (representative) and Art 4(21) (supervisory authority) are read
    by no query of this order; neither definitions order formalises them (gdpr-common-definitions-roles-and-establishments
    defers both).
  consequence: No answer says who is a representative or a supervisory authority.
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this order.

excluded_set:
- what: articles_named_in_the_content_points
  instrument: Regulation (EU) 2016/679 Arts 13, 14, 22, 37 and 79
  cites:
  - 02016R0679-20160504#art_013
  - 02016R0679-20160504#art_014
  - 02016R0679-20160504#art_022
  - 02016R0679-20160504#art_037
  - 02016R0679-20160504#art_079
  reason: Points (e), (g) and (h) of Art 47(2) name Articles 13, 14, 22, 37 and 79
    of Regulation (EU) 2016/679, not pinned here; the point flags test only that the
    rules specify what the point says (reading (9)).
  consequence: No answer applies those articles; the caller states each point flag
    from the rules as written.
- what: consistency_mechanism
  instrument: Regulation (EU) 2016/679 Art 63
  cites:
  - 02016R0679-20160504#art_063
  reason: The consistency mechanism under which the competent supervisory authority
    approves binding corporate rules (Art 47(1)) is not pinned here, and the approval
    is not decided (reading (13)).
  consequence: No answer says whether the approval procedure was followed.
