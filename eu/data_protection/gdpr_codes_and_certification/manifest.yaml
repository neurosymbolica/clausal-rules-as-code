# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only kit modules (formalize_lib,
# kit/deadline_lib), no shared backbone package.
uses: []

scope: "Regulation (EU) 2016/679 (GDPR) Articles 40 to 43, from the pinned text of the consolidated version of 4 May 2016 only, as rules over facts the caller states. certification_status/5: for one certification at a CHECK_DATE, whether the conditions of Articles 42(5), 42(7) and 43(1) on its issuer, its approved criteria, informing the supervisory authority, the maximum period of three years and withdrawal hold, and, answered on its own, whether the conditions of Article 42(2) for its use in transfers hold. code_monitoring_status/3: for one code of conduct, whether its compliance is monitored by an accredited body as Articles 40(2), 40(4), 40(5), 41(1) and 41(6) state, naming the two duties Article 41(4) gives that body, and, answered on its own, whether the conditions of Articles 40(3) and 40(9) for its use in transfers hold. accreditation_status/6: for one monitoring body (Articles 41(2) and 41(5)) or one certification body (Articles 43(1), 43(2), 43(4) and 43(7), maximum period of five years) at a CHECK_DATE, whether the conditions the text states for its accreditation hold. Out of scope: whether processing complies with the Regulation, whether a code or a certification is good or must be sought, whether an authority should approve, accredit, withdraw or revoke, and whether a transfer meets Chapter V (gdpr-chapter-v-transfers); Article 3 scope (gdpr-territorial-material-scope); the institutional procedures listed in deferred_set. Every open-textured judgement is stated by the caller and, when unsure, handed to a lawyer (needs_legal_review)."

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, consolidated text 02016R0679-20160504: Article 40(2), 40(3), 40(4), 40(5) and 40(9)"
  - "Regulation (EU) 2016/679, consolidated text 02016R0679-20160504: Article 41(1), 41(2)(a) to (d), 41(4), 41(5) and 41(6)"
  - "Regulation (EU) 2016/679, consolidated text 02016R0679-20160504: Article 42(2), 42(3) (quoted for reading (1) only), 42(4), 42(5) and 42(7)"
  - "Regulation (EU) 2016/679, consolidated text 02016R0679-20160504: Article 43(1)(a) and (b), 43(2)(a) to (e), 43(4) and 43(7)"

query_interface:
  1: "gdpr_codes_and_certification_provision/3"         # factual lookup: what a pinned provision says
  2: "gdpr_codes_and_certification_status/2"            # status of the profile-only query
  4: "gdpr_codes_and_certification_key_read/2"          # enumeration: every key a query (or BODY) reads
  7: "gdpr_codes_and_certification_checklist/2"         # justification: one item per step with cite(...)
  16: "gdpr_codes_and_certification_what_if/4"          # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_040
  - 02016R0679-20160504#art_041
  - 02016R0679-20160504#art_042
  - 02016R0679-20160504#art_043
  reason: 'The titles of Articles 40 to 43 (''Codes of conduct'', ''Monitoring of
    approved codes of conduct'', ''Certification'', ''Certification bodies'') carry
    no obligation: document structure. No reading rests on a title.'
  consequence: 'None for a caller: a title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: encouragement_of_codes_and_certification
  units:
  - 02016R0679-20160504#parag_040.001
  - 02016R0679-20160504#parag_042.001
  reason: 'Articles 40(1) and 42(1): the Member States, the supervisory authorities,
    the Board and the Commission shall encourage the drawing up of codes of conduct
    and the establishment of certification mechanisms, seals and marks, taking account
    of sectors and of micro, small and medium-sized enterprises. CHALLENGED, not assumed:
    is there a rule a caller can check inside? The duty is addressed to institutions
    and has no output for a controller, a processor, a code or a certification; the
    only crisp statement near it, that certification is voluntary, is Article 42(3),
    quoted for reading (1). So nothing in these two paragraphs is left unformalised
    that this order''s answers could use.'
  consequence: No answer says whether an institution has encouraged codes or certification.
  declaration: not_an_exception
  not_formalized_because: institutional
- debt: true
  what: examples_of_code_subjects
  units:
  - 02016R0679-20160504#point_040.002_a
  - 02016R0679-20160504#point_040.002_b
  - 02016R0679-20160504#point_040.002_c
  - 02016R0679-20160504#point_040.002_d
  - 02016R0679-20160504#point_040.002_e
  - 02016R0679-20160504#point_040.002_f
  - 02016R0679-20160504#point_040.002_g
  - 02016R0679-20160504#point_040.002_h
  - 02016R0679-20160504#point_040.002_i
  - 02016R0679-20160504#point_040.002_j
  - 02016R0679-20160504#point_040.002_k
  reason: 'Article 40(2) points (a) to (k): the subjects a code may specify, introduced
    by ''such as with regard to:''. An open list of examples (reading (9)): a code
    on another subject is not excluded, so no answer turns on the subject of a code
    and no limb reads the points. Formalisable only as an items list naming the point
    a stated subject matches, which would decide nothing; left for a later order if
    a use appears.'
  consequence: No answer names or checks the subject of a code.
  declaration: not_an_exception
  open: formalisable as an items list; to be formalised in a later order if wanted,
    not in this order's rules; the deferral stands for this run.
- what: approval_registration_and_board_procedure
  units:
  - 02016R0679-20160504#parag_040.006
  - 02016R0679-20160504#parag_040.007
  - 02016R0679-20160504#parag_040.008
  reason: 'Articles 40(6) to 40(8): the authority registers and publishes an approved
    code; a code for processing in several Member States goes through the Board''s
    opinion under Article 63, which the Board submits to the Commission. CHALLENGED:
    the one fact a caller needs from this procedure, that the code was approved, is
    read as the key code_approved_by_competent_supervisory_authority (reading (11));
    the steps themselves are acts of institutions with no output for the caller.'
  consequence: No answer checks registration, publication or the Board's opinion.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: publicity_and_register_of_codes
  units:
  - 02016R0679-20160504#parag_040.010
  - 02016R0679-20160504#parag_040.011
  reason: 'Articles 40(10) and 40(11): the Commission ensures publicity for codes
    of general validity; the Board keeps a register of approved codes. Duties of institutions;
    no output for a caller. The general validity itself is read as the key code_has_general_validity
    (reading (15)).'
  consequence: No answer checks publicity or a register.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: draft_accreditation_requirements_to_the_board
  units:
  - 02016R0679-20160504#parag_041.003
  reason: 'Article 41(3): the competent authority submits draft requirements for the
    accreditation of monitoring bodies to the Board under Article 63. A procedure
    between institutions; the conditions a body must meet are those of Article 41(2),
    read in reading (16).'
  consequence: No answer checks the requirements procedure.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: voluntary_and_transparent_process
  units:
  - 02016R0679-20160504#parag_042.003
  reason: 'Article 42(3): certification is voluntary and available via a transparent
    process. It imposes nothing a caller can check for one certification: no answer
    ever says a certification must be sought (reading (1)), and how transparent the
    process is has no output here. Quoted in sources for reading (1) only.'
  consequence: No answer checks the transparency of the process.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: information_and_access_for_the_certification_procedure
  units:
  - 02016R0679-20160504#parag_042.006
  reason: 'Article 42(6): the controller or processor that submits its processing
    to certification provides the certification body or the authority with all information
    and access necessary to conduct the procedure. CHALLENGED: an items line would
    need the text to name the items; it names only ''all information and access to
    its processing activities which are necessary'', which this order cannot list.
    A duty inside the procedure with no output for the status of a certification.'
  consequence: No answer says what information must be given.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: register_of_certification_mechanisms
  units:
  - 02016R0679-20160504#parag_042.008
  reason: 'Article 42(8): the Board keeps a register of certification mechanisms,
    seals and marks and makes it public. A duty of an institution; no output for a
    caller.'
  consequence: No answer checks the register.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: accreditation_requirements_approval
  units:
  - 02016R0679-20160504#parag_043.003
  reason: 'Article 43(3): accreditation takes place on the basis of requirements approved
    by the competent authority or the Board, complementing Regulation (EC) No 765/2008
    for accreditation by a national accreditation body. The approval of requirements
    is an act of institutions; the conditions a body must meet are read from Article
    43(2) (reading (17)).'
  consequence: No answer checks which requirements were approved.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: reasons_to_the_authority
  units:
  - 02016R0679-20160504#parag_043.005
  reason: 'Article 43(5): certification bodies provide the competent authorities with
    the reasons for granting or withdrawing a certification. A duty of reporting inside
    the procedure, with no output for the status of a certification or of an accreditation;
    it is not one of the conditions of Article 43(2).'
  consequence: No answer checks whether reasons were given.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: publication_of_requirements_and_criteria
  units:
  - 02016R0679-20160504#parag_043.006
  reason: 'Article 43(6): the authority publishes the requirements and criteria and
    transmits them to the Board. Duties of an institution; no output for a caller.'
  consequence: No answer checks publication.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: commission_acts_on_certification
  units:
  - 02016R0679-20160504#parag_043.008
  - 02016R0679-20160504#parag_043.009
  reason: 'Articles 43(8) and 43(9): the Commission may adopt delegated acts specifying
    requirements, and implementing acts laying down technical standards, for certification
    mechanisms. Powers of an institution; no such act is pinned or read.'
  consequence: No answer reads a delegated or implementing act.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: adherence_and_certification_as_an_element
  instrument: Regulation (EU) 2016/679 Arts 24(3), 25(3), 28(5) and 32(3)
  cites:
  - 02016R0679-20160504#art_024
  - 02016R0679-20160504#art_025
  - 02016R0679-20160504#art_028
  - 02016R0679-20160504#art_032
  reason: These articles let adherence to an approved code or an approved certification
    mechanism be used as an element to demonstrate compliance; they are not pinned
    here. Their use is decided in gdpr-accountability-security (Arts 24, 25, 32) and
    gdpr-processor-contract (Art 28); this order does not change them.
  consequence: No answer says that adherence or a certification demonstrates compliance
    (reading (1)) (Q1).
- what: transfers_subject_to_appropriate_safeguards
  instrument: Regulation (EU) 2016/679 Art 46 and Chapter V
  cites:
  - 02016R0679-20160504#art_044
  - 02016R0679-20160504#art_046
  reason: Articles 40(3) and 42(2) refer to point (e) and point (f) of Article 46(2);
    Chapter V is not pinned here and is decided in gdpr-chapter-v-transfers.
  consequence: transfer_conditions_met says only that the conditions of Article 40(3)
    or 42(2) hold, not that a transfer is lawful.
- what: territorial_scope
  instrument: Regulation (EU) 2016/679 Art 3
  cites:
  - 02016R0679-20160504#art_003
  reason: Articles 40(3) and 42(2) speak of controllers or processors 'not subject
    to this Regulation pursuant to Article 3'; Article 3 is not pinned here and is
    decided in gdpr-territorial-material-scope.
  consequence: The caller states whether the controller or processor is subject to
    the Regulation.
- what: powers_and_competence_of_authorities
  instrument: Regulation (EU) 2016/679 Arts 55, 56, 57, 58(2)(h) and 58(3)
  cites:
  - 02016R0679-20160504#art_055
  - 02016R0679-20160504#art_056
  - 02016R0679-20160504#art_057
  - 02016R0679-20160504#art_058
  reason: Articles 40 to 43 name the competent authority (Articles 55 and 56), its
    tasks and powers (Articles 57 and 58), the power to withdraw a certification (Article
    58(2)(h), named in gdpr-corrective-powers-named) and the approval of criteria
    (Article 58(3)). Not pinned here; 'the competent supervisory authority' means
    the one the caller takes to be competent.
  consequence: No answer names the competent authority or a power it should use.
- what: consistency_mechanism_and_committee_procedure
  instrument: Regulation (EU) 2016/679 Arts 63, 92 and 93
  cites:
  - 02016R0679-20160504#art_063
  - 02016R0679-20160504#art_092
  - 02016R0679-20160504#art_093
  reason: The Board's opinions and approvals under Article 63 and the Commission's
    delegated and implementing acts under Articles 92 and 93 are institutional procedures,
    not pinned here.
  consequence: No answer checks those procedures.
- what: administrative_fines_for_codes_and_certification
  instrument: Regulation (EU) 2016/679 Art 83
  cites:
  - 02016R0679-20160504#art_083
  reason: Article 83(2)(j) makes adherence to approved codes or certification a factor
    in fines, and Article 83(4)(b) and (c) fines infringements of the obligations
    of certification and monitoring bodies; not pinned here. The legal maximum is
    decided in gdpr-administrative-fine-maximum.
  consequence: No answer says anything about a fine.
- what: accreditation_regulation_and_standard
  instrument: Regulation (EC) No 765/2008 and EN-ISO/IEC 17065/2012
  cites:
  - 32008R0765#art_002
  reason: Article 43(1)(b) names the national accreditation body named in accordance
    with Regulation (EC) No 765/2008, accrediting in accordance with EN-ISO/IEC 17065/2012.
    Neither is pinned, read or fetched (Q14).
  consequence: The caller states who accredited the certification body (reading (17)).
- what: time_limits_regulation
  instrument: Regulation (EEC, Euratom) No 1182/71
  cites:
  - 31971R1182#art_003
  reason: The rules on periods, dates and time limits are not pinned here and are
    not applied to the maximum periods of Articles 42(7) and 43(4); the order states
    its own counting rule as reading (19) (Q10).
  consequence: The order counts the maximum periods by reading (19) only; a caller
    who reads Regulation (EEC, Euratom) No 1182/71 as applying counts them himself
    or herself.
