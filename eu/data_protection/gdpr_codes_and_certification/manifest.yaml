  - "gdpr_codes_and_certification_decision_resolvable/1"
  - "gdpr_codes_and_certification_status_values/1"
  # -- queries.clausal --
  - "gdpr_codes_and_certification_profile_keys/1"
  - "gdpr_codes_and_certification_input_problems/2"
  - "gdpr_codes_and_certification_what_if/4"
  - "gdpr_codes_and_certification_provision/3"
  - "gdpr_codes_and_certification_ground_provision/3"
  - "gdpr_codes_and_certification_key_read/2"
  - "not_yet_issued/0"
  - "maximum_period_ended/0"
