  # -- citations.clausal --
  - "citation/2"
  # -- gdpr_codes_and_certification.clausal --
  - "certification_status/5"
  - "code_monitoring_status/3"
  - "accreditation_status/6"
  - "decide_gdpr_codes_and_certification/2"
  - "gdpr_codes_and_certification_status/2"
