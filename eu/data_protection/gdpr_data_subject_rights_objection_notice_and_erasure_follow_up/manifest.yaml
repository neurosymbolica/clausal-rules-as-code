  13: "gdpr_data_subject_rights_objection_notice_and_erasure_follow_up_action_compliance/3"   # compliance_check: is a proposed action allowed
  16: "gdpr_data_subject_rights_objection_notice_and_erasure_follow_up_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02016R0679-20160504#art_017
  - 02016R0679-20160504#art_021
  not_formalized_because: structural
  reason: 'The titles of Articles 17 and 21 carry no obligation: document structure,
    not operative law. Deferred so every unit of the pinned extracts is accounted
    for.'
  consequence: 'None for a caller: an article title carries no obligation.'
  declaration: not_an_exception
- what: art17_1_erasure_obligation
  units:
  - 02016R0679-20160504#parag_017.001
  - 02016R0679-20160504#point_017.001_a
  - 02016R0679-20160504#point_017.001_b
  - 02016R0679-20160504#point_017.001_c
  - 02016R0679-20160504#point_017.001_d
  - 02016R0679-20160504#point_017.001_e
  - 02016R0679-20160504#point_017.001_f
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-erasure
  reason: Art 17(1) (the right to erasure and the controller's obligation to erase
    where one of the grounds (a) to (f) applies) is quoted above for the words 'obliged
    pursuant to paragraph 1' of Art 17(2) (reading (9)); no limb of this order reads
    it. It is decided, the paragraph and all six points, by gdpr-data-subject-rights-erasure,
    whose answer this order reads only as the attested outside fact controller_obliged_to_erase_under_article_17_1.
  consequence: 'Whether the controller is obliged to erase is not tested here: the
    caller supplies the attested statement (from gdpr-data-subject-rights-erasure
    or a human).'
  declaration: answered_with_caveat
- what: art17_3_exceptions
  units:
  - 02016R0679-20160504#parag_017.003
  - 02016R0679-20160504#point_017.003_a
  - 02016R0679-20160504#point_017.003_b
  - 02016R0679-20160504#point_017.003_c
  - 02016R0679-20160504#point_017.003_d
  - 02016R0679-20160504#point_017.003_e
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-erasure
  reason: Art 17(3) (paragraphs 1 and 2 shall not apply to the extent that processing
    is necessary for the purposes in points (a) to (e)) is quoted above (reading (9));
    no limb of this order reads it. Its effect on the obligation of paragraph 1 is
    decided, the paragraph and all five points, by gdpr-data-subject-rights-erasure;
    its effect on paragraph 2 reaches this order only through the attested outside
    fact controller_obliged_to_erase_under_article_17_1, which is false where Art
    17(3) removes the obligation (reading (9), Q6).
  consequence: Where an exception of Art 17(3) applies, the caller supplies controller_obliged_to_erase_under_article_17_1
    attested false, and the follow-up duty does not apply; how far a partial exception
    reaches is not tested.
  declaration: answered_with_caveat
- what: art21_1_to_21_3_and_21_6_right_to_object
  units:
  - 02016R0679-20160504#parag_021.001
  - 02016R0679-20160504#parag_021.002
  - 02016R0679-20160504#parag_021.003
  - 02016R0679-20160504#parag_021.006
  not_formalized_because: in_sibling
  decided_in: gdpr-data-subject-rights-portability-and-objection
  reason: Art 21(1) and (2) (the right to object to processing based on Art 6(1)(e)
    or (f) and to processing for direct marketing) are quoted above because Art 21(4)
    names 'the right referred to in paragraphs 1 and 2' (reading (2)); Art 21(3) (no
    further processing for direct marketing after an objection) and Art 21(6) (objection
    to processing for research or statistical purposes) are not quoted. No limb of
    this order reads any of the four; they are decided by gdpr-data-subject-rights-portability-and-objection,
    whose answer on Art 21(1) and (2) this order reads only as the attested outside
    fact right_to_object_applies.
  consequence: 'Whether the data subject has a right to object, and what follows from
    an objection, are not tested here: the caller supplies the attested statement
    for right_to_object_applies.'
  declaration: answered_with_caveat
- what: art21_5_objection_by_automated_means
  units:
  - 02016R0679-20160504#parag_021.005
  debt: true
  reason: Art 21(5) (in the context of information society services, and notwithstanding
    Directive 2002/58/EC, the data subject may exercise the right to object by automated
    means using technical specifications) is a permission to the data subject with
    no duty of the controller that this order could test, and it turns on another
    Union act; no order on main formalises it.
  consequence: Whether an objection made by automated means is valid is not tested
    by any order; the caller checks it itself.
  declaration: not_an_exception
  open: formalisable only with a reading of Directive 2002/58/EC and of 'technical
    specifications'; the deferral stands for this order.

excluded_set:
- what: form_of_communication_under_article_12_1
  instrument: Regulation (EU) 2016/679 Art 12(1)
  cites:
  - 02016R0679-20160504#parag_012.001
  reason: Not pinned here. Art 12(1) (a concise, transparent, intelligible and easily
    accessible form, using clear and plain language) governs every communication under
    Arts 15 to 22, the notice of Art 21(4) included; this order reads only the words
    of Art 21(4) itself, and its judgement right_presented_clearly is the caller's
    judgement of 'presented clearly' (reading (6)).
  consequence: Whether the notice meets Art 12(1) is not tested here; the caller checks
    it itself.
