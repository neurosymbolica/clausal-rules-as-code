scope: >-
  Two duties of the controller under Regulation (EU) 2016/679 (GDPR) that
  follow a data subject's right, on the pinned consolidated text
  02016R0679-20160504. (A) Art 21(4), objection_right_notice/4: whether the
  right to object of Art 21(1) and (2) was explicitly brought to the data
  subject's attention at the latest at the time of the first communication
  with the data subject, and presented clearly and separately from any other
  information (notice_not_owed, notice_not_yet_due, notice_complies,
  notice_does_not_comply). (B) Art 17(2), erasure_follow_up_duty/4: whether a
  controller that has made personal data public and is obliged under Art 17(1)
  to erase them has taken reasonable steps to inform the controllers processing
  the data of the request for erasure (follow_up_duty_does_not_apply,
  follow_up_duty_met, follow_up_duty_not_met). Out of scope and read only as
  attested outside facts: whether the right to object exists (Art 21(1), (2);
  gdpr-data-subject-rights-portability-and-objection) and whether the controller
  is obliged to erase (Art 17(1) with Art 17(3); gdpr-data-subject-rights-erasure).
  The open-textured words 'presented clearly' and 'reasonable steps' are the
  caller's judgements; unsure goes to a lawyer (needs_legal_review). Art 21(5)
  is deferred; Art 12(1) is excluded.

sources:
  - "Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, consolidated text 02016R0679-20160504 with the 2018 corrigendum: Art 21(4) [02016R0679-20160504#parag_021.004]"
  - "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: Art 17(2) [02016R0679-20160504#parag_017.002]"
  - "Regulation (EU) 2016/679 (GDPR), consolidated text 02016R0679-20160504: Art 21(1), Art 21(2), Art 17(1), Art 17(3) (quoted for cross-reference only; deferred, read through attested outside facts)"

