eu_reg_2016_679_art_21_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_021.004"
  retrieved: 2026-11-17
  note: >-
    Art 21(4): the right to object of Art 21(1) and (2) shall be explicitly
    brought to the data subject's attention at the latest at the time of the
    first communication, and presented clearly and separately from any other
    information. Load-bearing for objection_right_notice/4, the
    right_presented_clearly referral and the right_to_object_applies referral.
eu_reg_2016_679_art_17_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02016R0679-20160504"
  unit: "02016R0679-20160504#parag_017.002"
  retrieved: 2026-11-17
  note: >-
    Art 17(2): a controller that has made personal data public and is obliged
    under Art 17(1) to erase shall take reasonable steps, including technical
    measures, taking account of available technology and the cost of
    implementation, to inform other controllers of the erasure request.
    Load-bearing for erasure_follow_up_duty/4, the
    reasonable_steps_taken_to_inform_other_controllers referral and the
    controller_obliged_to_erase_under_article_17_1 referral.
