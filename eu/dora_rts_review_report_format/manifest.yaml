# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: this domain imports no shared backbone package
# (only the kit's formalize_lib, which is not a backbone package).
uses: []

scope: >-
  What a financial entity's report on the review of its ICT risk management
  framework must be and contain under Article 27 of Commission Delegated
  Regulation (EU) 2024/1774 (the RTS on ICT risk management tools, methods,
  processes and policies): the searchable electronic format of Article 27(1)
  and the items of Article 27(2), points (a) to (l), with the sentences of its
  second subparagraph for points (c) and (f). The report is the one of DORA
  Article 6(5), submitted to the competent authority upon its request (third
  sentence, the request key); the entities of DORA Article 16(1), first
  subparagraph, are outside Title II (the gate). Three questions about one
  financial entity and its report: which duties apply
  (ict_risk_framework_review_report_duties_required), whether the report meets
  all of them (ict_risk_framework_review_report_duties_complete), and which are
  outstanding (ict_risk_framework_review_report_duties_outstanding). Each item
  is a caller judgement (true, false or unsure); unsure goes to a lawyer as an
  open-textured question. Out of scope: whether the entity is a financial
  entity within DORA (Article 2), the review itself, the request and the duty
  to submit (DORA Article 6), the other articles of the RTS, the simplified
  framework and report of Title III (Article 41), and the entry into force
  (Article 42).

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 (RTS on ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework), OJ L, 2024/1774, 25.6.2024, Article 27(1) and (2), points (a) to (l) and second subparagraph (pinned text 32024R1774, original OJ text)"
  - "Regulation (EU) 2022/2554 (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, p. 1, Article 6(5), third sentence (the request) and Article 16(1), first subparagraph (the gate) (pinned text 32022R2554, original OJ text)"

query_interface:
  2: "dora_rts_review_report_format_status/2"           # eligibility/status verdict (complete / incomplete / gate / request)
  7: "dora_rts_review_report_format_checklist/2"        # justification: one cited checklist item per gate, request and duty
  13: "dora_rts_review_report_format_compliance_check/3" # compliance_check: submit_review_report as it stands
  16: "dora_rts_review_report_format_what_if/4"         # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_006
  - 32022R2554#art_016
  - 32024R1774#art_027
  reason: The headings of DORA Articles 6 and 16 and RTS Article 27 carry no rule
    of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: entry_into_force
  units:
  - 32024R1774#art_042
  reason: RTS Article 42 fixes the entry into force of the RTS. It gives no output
    of any query; the order answers on Article 27 as it applies and reads no date
    (reading (17)).
  consequence: No answer depends on a date (open question (Q18)).
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: report_on_review_upon_request
  units:
  - 32022R2554#parag_006.005
  partial: true
  reason: 'DORA Art 6(5), third sentence (a report on the review of the ICT risk management
    framework is submitted to the competent authority upon its request), is the ground
    of the request key and of step (G4) of every query (reading (3)); the key is read
    with the key and meaning of the DORA order on ICT risk governance and framework.
    Not formalised here: the first two sentences, the documentation and review of
    the framework and its occasions, and its continuous improvement.'
  consequence: The answers do not say whether or when the framework was reviewed,
    or whether the report was submitted; they say what Article 27 requires of the
    report the authority requested.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on ICT risk governance and framework; the deferral
    stands for this order (open question (Q3)).
- what: ict_risk_management_framework
  units:
  - 32022R2554#parag_006.001
  - 32022R2554#parag_006.002
  - 32022R2554#parag_006.003
  - 32022R2554#parag_006.004
  - 32022R2554#parag_006.006
  - 32022R2554#parag_006.007
  - 32022R2554#parag_006.008
  - 32022R2554#point_006.008_a
  - 32022R2554#point_006.008_b
  - 32022R2554#point_006.008_c
  - 32022R2554#point_006.008_d
  - 32022R2554#point_006.008_e
  - 32022R2554#point_006.008_f
  - 32022R2554#point_006.008_g
  - 32022R2554#point_006.008_h
  - 32022R2554#parag_006.009
  - 32022R2554#parag_006.010
  reason: 'DORA Art 6(1) to (4) and (6) to (10), with the points of paragraph 8, set
    the ICT risk management framework itself: its content, the management of ICT risk,
    the control function, internal audit, the digital operational resilience strategy
    and the options of paragraphs 9 and 10. No limb of this order reads them.'
  consequence: complete and none_outstanding say nothing about the framework itself
    (open question (Q17)).
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on ICT risk governance and framework; the deferral
    stands for this order.
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the
    entities it lists), is formalised as the gate of every query (reading (2)). Not
    formalised: who those entities are, which the caller states, and the lead words
    of the second subparagraph, which introduce the duties of the simplified ICT risk
    management framework; those are the subject of the order on proportionality and
    the simplified framework.'
  consequence: simplified_framework_entity says only that Article 27 does not apply;
    it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (reading (15)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); whether it is a microenterprise
    (Article 3(60)) is the caller's statement (reading (12)). The order on scope and
    entity types formalises Article 2.
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
