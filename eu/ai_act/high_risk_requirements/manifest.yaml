scope: >-
  Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text
  02024R1689-20260727, Chapter III, Section 2. Decided here: whether, on an
  assessment day, each of nine requirements (risk management system Art 9(1);
  data and data governance Art 10(1) and (6); technical documentation Art 11(1),
  with the simplified form for SMEs and SMCs; record-keeping Art 12(1); minimum
  logging capabilities Art 12(3); transparency and instructions for use Art 13(1)
  and (2); human oversight Art 14(1); separate verification by two natural
  persons Art 14(5); accuracy, robustness and cybersecurity Art 15(1)) applies to
  one AI system through Art 8(1), under the application dates of Art 113, third
  paragraph, point (c), and the transitional rules of Art 111(1) and (2); and
  whether each element of Annex IV, Art 11(2), Art 13(3) and Art 15(3) is
  required. Out of scope: whether the system meets a requirement (open words),
  the scope of the Regulation (Art 2), the classification (Art 6, Annexes I and
  III), the provider duties (Art 16), Art 4a and Annex X membership; the open
  judgements significant changes in design and intended use by public
  authorities are stated by the caller and, when unsure, referred to a lawyer.

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 as amended by Regulation (EU) 2026/1744: Art 3 points (8), (9), (11), (14a), (14b); Art 8(1); Art 9(1); Art 10(1) and (6); Art 11(1) and (2); Art 12(1) and (3); Art 13(1), (2) and (3); Art 14(1) and (5); Art 15(1) and (3); Art 111(1) and (2); Art 113, third paragraph, point (c); Annex IV"

