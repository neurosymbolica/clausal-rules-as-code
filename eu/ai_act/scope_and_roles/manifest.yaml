- what: general_purpose_ai_models
  units:
  - 02024R1689-20260727#point_002.001_a
  - 02024R1689-20260727#parag_002.006
  - 02024R1689-20260727#parag_002.008
  - 02024R1689-20260727#point_003_3
  - 02024R1689-20260727#point_003_5
  - 02024R1689-20260727#point_003_9
  - 02024R1689-20260727#point_003_10
  partial: true
  reason: The words on general-purpose AI models and AI models in Art 2(1)(a) ('or
    placing on the market general-purpose AI models'), Art 2(6) and (8) ('or AI models')
    and Art 3(3), (5), (9) and (10) belong with the rules on general-purpose AI models
    (Chapter V), which are not pinned here; this order formalises AI systems only.
    The second sentence of Art 2(8) ('Such activities shall be conducted in accordance
    with applicable Union law') adds no rule this order applies.
  consequence: A provider, authorised representative or activity concerning only a
    general-purpose AI model or an AI model gets no answer from this order; the caller
    uses the rules on general-purpose AI models.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: articles_57_to_59_for_section_b_products
  units:
  - 02024R1689-20260727#parag_002.002
  partial: true
  reason: The second sentence of Art 2(2) ('Articles 57, 58 and 59 shall apply only
    in so far as the requirements for high-risk AI systems under this Regulation have
    been integrated in that Union harmonisation legislation') turns on the content
    of other Union law, which is not pinned.
  consequence: The answer only_listed_provisions_apply names Art 6(1), Art 60a and
    Arts 102 to 112; it does not say whether Arts 57 to 59 apply in part.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: areas_outside_union_law_and_national_security_competences
  units:
  - 02024R1689-20260727#parag_002.003
  partial: true
  reason: The first sentence of Art 2(3) (no application to areas outside the scope
    of Union law; the competences of the Member States concerning national security
    are not affected) states the limits of Union law and gives no test on a system;
    the second and third sentences are formalised.
  consequence: None for these answers beyond the military, defence and national security
    key.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: without_prejudice_paragraphs
  units:
  - 02024R1689-20260727#parag_002.005
  - 02024R1689-20260727#parag_002.007
  - 02024R1689-20260727#parag_002.009
  reason: Art 2(5) (liability of intermediary services under Regulation (EU) 2022/2065),
    Art 2(7) (Union law on personal data and privacy applies; the data protection
    acts are not affected, without prejudice to Arts 4a and 59) and Art 2(9) (consumer
    protection and product safety law) say what the Regulation does not affect; they
    do not change whether it applies.
  consequence: An answer that the Regulation applies does not say that other Union
    law does not; the caller checks it.
  declaration: not_an_exception
  not_formalized_because: structural
- what: more_favourable_rules_for_workers
  units:
  - 02024R1689-20260727#parag_002.011
  reason: 'Art 2(11): the Union or Member States may keep or introduce laws more favourable
    to workers, or collective agreements; such rules are national law, not this Regulation.'
  consequence: The answers do not say whether more favourable national rules apply.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: limitation_by_delegated_acts_for_section_a_products
  units:
  - 02024R1689-20260727#parag_002.013
  - 02024R1689-20260727#point_002.013_a
  - 02024R1689-20260727#point_002.013_b
  reason: Art 2(13) (inserted by Regulation (EU) 2026/1744) lets the Commission limit,
    by delegated acts to be adopted by 2 August 2027, requirements or obligations
    of Arts 9 to 15 and 17 to 25 for high-risk systems under Section A of Annex I;
    no such act is pinned, and the limitation applies only through those acts.
  consequence: The answers of the Art 25 queries do not take into account a limitation
    a delegated act may make.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: intended_purpose_definition_applied_by_the_caller
  units:
  - 02024R1689-20260727#point_003_12
  reason: Art 3(12) (intended purpose) is quoted because the key on modifying the
    intended purpose uses it; the caller applies it when it gives the key. The order
    does not formalise it.
  consequence: The answers rest on the caller's application of this definition in
    the key it gives.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: contractual_allocation_of_obligations
  units:
  - 02024R1689-20260727#point_025.001_a
  partial: true
  reason: Art 25(1)(a) is 'without prejudice to contractual arrangements stipulating
    that the obligations are otherwise allocated'; the order reads these words as
    not changing who is considered to be the provider, and does not check such arrangements
    (Q9).
  consequence: An answer considered_provider does not say how a contract allocates
    the provider's obligations between the parties; the caller checks it.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: content_of_the_duty_to_cooperate
  units:
  - 02024R1689-20260727#parag_025.002
  - 02024R1689-20260727#point_025.002_a
  - 02024R1689-20260727#point_025.002_b
  - 02024R1689-20260727#point_025.002_c
  partial: true
  reason: The second subparagraph of Art 25(2) and its points (a) to (c) say what
    the initial provider's cooperation includes (information, technical access, technical
    documentation, known limitations and failure modes, targeted technical access);
    the order answers that the duty applies, not whether it was met.
  consequence: The answer no_longer_provider_must_cooperate does not say what was
    made available or whether the cooperation was enough.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: content_of_the_agreement_and_voluntary_model_terms
  units:
  - 02024R1689-20260727#parag_025.004
  partial: true
  reason: Art 25(4) also says what the written agreement specifies ('based on the
    generally acknowledged state of the art') and lets the AI Office develop and recommend
    voluntary model terms; the order answers whether an agreement is required, not
    its content, and the model terms bind no party.
  consequence: The answer written_agreement_required does not say what the agreement
    must contain.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: intellectual_property
  units:
  - 02024R1689-20260727#parag_025.005
  reason: 'Art 25(5): paragraphs 2 and 3 are without prejudice to intellectual property
    rights, confidential business information and trade secrets; it changes no answer
    of this order.'
  consequence: The caller protects such rights when it cooperates or shares information.
  declaration: not_an_exception
  not_formalized_because: structural
- what: application_dates_of_other_provisions
  units:
  - 02024R1689-20260727#art_113
  - 02024R1689-20260727#point_113_b
  - 02024R1689-20260727#point_113_d
  reason: Art 113's entry into force, its general date (2 August 2026) and the third
    paragraph points (b) and (d) date provisions outside Chapter I and Chapter III,
    Sections 1 to 3; no limb of this order reads them.
  consequence: 'None for these answers: Arts 2 and 3 are dated by point (a), Art 25
    by point (c).'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: classification_as_high_risk
  instrument: Regulation (EU) 2024/1689 Art 6 with Annexes I and III (not in this
    pin)
  cites:
  - 02024R1689-20260727#art_006
  reason: Whether a system is high-risk under Art 6, and by which route (Annex I or
    Annex III), decides the Art 2(2), Art 2(12) and Art 25 keys; the classification
    rules are not pinned here.
  consequence: The caller takes the high-risk keys and the route from the classification
    rules.
- what: obligations_of_the_provider
  instrument: Regulation (EU) 2024/1689 Art 16 (not in this pin)
  cites:
  - 02024R1689-20260727#art_016
  reason: A person considered to be the provider under Art 25(1) or (3) is 'subject
    to the obligations of the provider under Article 16'; what those obligations are
    is not this order's.
  consequence: The caller takes the obligations from Art 16 and the articles it names.
- what: prohibited_practices_and_transparency
  instrument: Regulation (EU) 2024/1689 Arts 5 and 50 (not in this pin)
  cites:
  - 02024R1689-20260727#art_005
  - 02024R1689-20260727#art_050
  reason: The exception of Art 2(12) for systems that fall under Art 5 or 50 is read
    through a crisp key; whether a system falls under them is decided by those Articles.
  consequence: The caller takes that key from the prohibition and transparency rules.
