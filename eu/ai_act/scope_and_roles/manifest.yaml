uses: []

scope: "Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text
  02024R1689-20260727 (as amended by Regulation (EU) 2026/1744), for AI systems only.
  Decided here: whether the Regulation applies to one actor, in one capacity, for one
  AI system (Art 2(1) to (4), (6), (8), (10), (12)); whether the actor holds a role
  defined in Art 3(3) to (8) (provider, deployer, authorised representative, importer,
  distributor, operator); whether an actor other than the initial provider is considered
  the provider of a high-risk AI system under Art 25(1) or (3); what Art 25(2) does to
  the initial provider; whether Art 25(4) requires a written supplier agreement; each
  dated by Art 113, third paragraph, points (a) and (c). Out of scope (deferred or
  excluded): general-purpose AI models, the text of Arts 2 and 3 before 27 July 2026,
  classification as high-risk (Art 6), the provider obligations of Art 16, the content
  of the duty to cooperate and of the written agreement, delegated acts under Art 2(13).
  Open-textured judgements (AI system, placing on the market, putting into service,
  substantial modification, clearly specified and the like) are the caller's, and an
  unsure one that matters goes to a lawyer as needs_legal_review."

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June
    2024 laying down harmonised rules on artificial intelligence (Artificial Intelligence
    Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 (as amended
    by Regulation (EU) 2026/1744): Art 2, Art 3 points (1), (3) to (12) and (23), Art 25,
    Art 113 third paragraph points (a) and (c)."

