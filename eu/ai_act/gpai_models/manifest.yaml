# root_exports: bare atoms read by the test cases as package-root module
# attributes. Each is a /0 fact exported by queries.clausal. The ten profile
# keys come first, in the key order of the input contract; then the ten
# OBLIGATION atoms; then the DOCUMENT atom not already listed
# (technical_documentation and information_for_downstream_providers are both
# OBLIGATION and DOCUMENT atoms, listed once); then the judgement value unsure.
root_exports:
  - general_purpose_ai_model
  - used_for_research_development_or_prototyping_before_being_placed_on_the_market
  - cumulative_training_computation_in_floating_point_operations
  - high_impact_capabilities
  - designated_by_a_commission_decision_as_a_model_with_systemic_risk
  - commission_accepted_the_providers_arguments_that_the_model_presents_no_systemic_risks
  - released_under_a_free_and_open_source_licence_allowing_access_usage_modification_and_distribution
  - parameters_weights_architecture_and_usage_information_made_publicly_available
  - provider_established_in_a_third_country
  - placed_on_the_market_before_2_august_2025
  - technical_documentation
  - information_for_downstream_providers
  - copyright_policy
  - training_content_summary
  - cooperation_with_authorities
  - authorised_representative
  - model_evaluation
  - systemic_risk_assessment_and_mitigation
  - serious_incident_reporting
  - cybersecurity_protection
  - additional_technical_documentation_for_models_with_systemic_risk
  - unsure

# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib,
# kit/deadline_lib) and library(datetime), which are not backbone packages.
uses: []

scope: >-
  For one general-purpose AI model and the provider the caller names, under
  Regulation (EU) 2024/1689 (Artificial Intelligence Act) as consolidated on
  27 July 2026 (02024R1689-20260727): (1) whether on a day the model is a
  general-purpose AI model with systemic risk (Art 3(63), Art 51(1) and (2),
  Art 52(2) to (4)); (2) whether the provider's notification to the Commission
  under Art 52(1) came within the outer limit of two weeks, read with
  Art 111(3) and Art 113(b); (3) whether one of the ten duties of Art 53(1)(a)
  to (d), Art 53(3), Art 54(1) and (2) and Art 55(1)(a) to (d) applies to the
  provider on a day, with the open-source exceptions of Art 53(2) and
  Art 54(6), the transitional period of Art 111(3) and the date of
  Art 113(b); (4) the minimum elements Annex XI and Annex XII list for the
  technical documentation and the information to downstream providers.
  Out of scope and left to the caller or a lawyer: the scope of the
  Regulation under Art 2, who the provider is and when the model is placed
  on the market, the content of each duty and whether it is met (codes of
  practice under Art 56, harmonised standards), the words 'without delay'
  and the content of the notification, the criteria of Annex XIII for a
  designation, delegated acts amending the threshold or the Annexes, and
  fines under Art 101. Open-textured judgements (general-purpose AI model,
  high impact capabilities, the free and open-source licence) are the
  caller's, and an unsure judgement that matters is referred to a lawyer.

sources:
  - >-
    Regulation (EU) 2024/1689 of the European Parliament and of the Council
    of 13 June 2024 laying down harmonised rules on artificial intelligence
    (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024, consolidated
    text 02024R1689-20260727 as amended by Regulation (EU) 2026/1744:
    Art 3, point (63) (points (64), (65), (67) and (68) read into the keys)
  - >-
    Regulation (EU) 2024/1689, Art 51(1), points (a) and (b), and Art 51(2)
    (systemic risk; the presumption above ten to the power twenty-five
    floating-point operations)
  - >-
    Regulation (EU) 2024/1689, Art 52(1) to (4) (notification within two
    weeks; the provider's arguments; designation by the Commission)
  - >-
    Regulation (EU) 2024/1689, Art 53(1) points (a) to (d), Art 53(2),
    Art 53(3), Art 54(1), (2) and (6), Art 55(1) points (a) to (d)
    (obligations of providers of general-purpose AI models)
  - >-
    Regulation (EU) 2024/1689, Art 111(3) and Art 113, third paragraph,
    point (b) (dates of application and the transitional period)
  - >-
    Regulation (EU) 2024/1689, Annex XI Sections 1 and 2 and Annex XII
    (minimum elements of the technical documentation and of the information
    to downstream providers)

query_interface:
  1: documentation_elements/3                 # factual_lookup: the Annex XI and XII element lists
  2: gpai_models_status/2                     # status projection of the facade request
  3: systemic_risk_classification_status/4    # status_determination: systemic risk classification
  7: gpai_models_checklist/2                  # justification: one cite(...) per checklist item
  14: provider_obligation_status/5            # obligation_surfacing: which duty applies
  15: systemic_risk_notification_status/5     # deadline: the two-week notification limit
  16: gpai_models_what_if/4                   # what_if: re-evaluate under an overridden key

