excluded_set:
- what: scope_of_the_regulation
  instrument: Regulation (EU) 2024/1689 Art 2 (not in this pin; the scope order)
  cites:
  - 02024R1689-20260727#art_002
  reason: Art 2(1)(a) makes the Regulation apply to providers placing on the market
    general-purpose AI models in the Union, irrespective of where they are established;
    Art 2 excludes, among others, AI models used exclusively for military, defence
    or national security purposes (Art 2(3)), models specifically developed and put
    into service for the sole purpose of scientific research and development (Art
    2(6)) and research, testing or development activity regarding models before they
    are placed on the market (Art 2(8)). Art 2 is not pinned in this domain. The research
    key of this order reads only the exception in the definition of Art 3(63); whether
    Art 2(8) or 2(6) excludes the case is the caller's check before it asks (reading
    (1); for the notification of a model to be placed on the market, reading (8)).
  consequence: The caller first checks that the Regulation applies to the case under
    Art 2; the answers assume it does.
- what: text_before_27_july_2026
  instrument: Regulation (EU) 2026/1744 (not pinned) and the text of Regulation (EU)
    2024/1689 in force before 27 July 2026 (not pinned)
  cites:
  - 32026R1744#art_001
  reason: The order applies the consolidated text valid from 27 July 2026 to every
    day from 2 August 2025, on the a reading that Regulation (EU) 2026/1744
    amends none of the units this order reads (reading (2), Q8); neither the amending
    act nor the earlier text is pinned, so the claim cannot be checked from the pin.
  consequence: For a day before 27 July 2026 the caller checks that the text then
    in force reads as the pinned units do; where it differs, the answer for that day
    may differ.
- what: codes_of_practice
  instrument: Regulation (EU) 2024/1689 Art 56 (not in this pin)
  cites:
  - 02024R1689-20260727#art_056
  reason: Art 56 governs the codes of practice that Art 53(4) and Art 55(2) let providers
    rely on; their content is not pinned.
  consequence: The caller looks at the codes of practice for the content of the duties.
- what: fines_for_providers_of_general_purpose_ai_models
  instrument: Regulation (EU) 2024/1689 Art 101 (not in this pin; the penalties order)
  cites:
  - 02024R1689-20260727#art_101
  reason: Art 101 sets the fines the Commission may impose on providers of general-purpose
    AI models; Art 113(b) excepts it from the date of 2 August 2025.
  consequence: An answer obligation_applies says nothing about fines; the caller uses
    the penalties rules.
- what: copyright_reservation_of_rights
  instrument: Directive (EU) 2019/790 Art 4(3)
  cites:
