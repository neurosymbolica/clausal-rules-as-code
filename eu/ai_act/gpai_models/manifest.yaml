  declaration: not_an_exception
  reason: 'Annex XI Section 1 asks for the information ''as appropriate to the size
    and risk profile of the model''; points 1 and 2 of Annex XI Section 1 and of Annex
    XII ask for a general or detailed description ''including'' the lettered elements
    (point 2 of Annex XI Section 1: ''A detailed description of the elements of the
    model referred to in point 1, and relevant information of the process for the
    development''); point 2 of Annex XI Section 1 lets the energy consumption be based
    on information about computational resources where it is unknown; and Annex XI
    Section 1 point 2(c), Section 2 points 2 and 3 and Annex XII points 1(d), 1(e)
    and 2(c) hold the words ''where applicable''. The order lists the lettered and
    numbered elements as the minimum and does not judge how far each goes, whether
    it applies to the model, or what else the open words ''including'' may require
