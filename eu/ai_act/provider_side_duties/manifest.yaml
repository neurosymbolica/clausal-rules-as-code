uses: []

scope: 'For ONE AI system and ONE actor in one role (provider, deployer, importer,
  distributor, product manufacturer, authorised representative or affected person),
  whether a named duty of Regulation (EU) 2024/1689 (consolidated text 02024R1689-20260727,
  as amended by Regulation (EU) 2026/1744) applies on the day asked: the forty duties
  of Art 16 and Arts 18 to 24 (providers, authorised representatives, importers and
  distributors of high-risk AI systems) and of Art 4(1) (AI literacy, providers and
  deployers of any AI system), at their own dates of application (Art 113, third paragraph,
  points (a) and (c)) and under the transitional rules of Art 111(1) and (2); and,
  for the four keeping duties (Art 18(1), Art 19(1), Art 22(3)(b), Art 23(5)), the
  last day of the retention period from its start. Decided here: whether a duty applies,
  never what it asks or whether it is met. Out of scope, handed to the caller, a lawyer
  or a sibling order: the scope of the Regulation (Art 2), roles along the value chain
  (Art 25), the classification as high-risk (Art 6, Annexes I and III), the content
  of the duties and of Art 17, the Section 2 requirements, Art 79 risk, Annex X, the
  deployer duties of Arts 26 and 27, penalties, the Art 4 text before 27 July 2026
  and Regulation (EEC, Euratom) No 1182/71. Open-textured judgements (AI system, significant
  change, public authorities, the considers/has-reason-to-consider tests, Art 79(1)
  risk) are stated by the caller; an unsure one that matters is referred to a lawyer
  (needs_legal_review).'

sources:
  - 'Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June
    2024 laying down harmonised rules on artificial intelligence (Artificial Intelligence
    Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 (as amended
    by Regulation (EU) 2026/1744, valid from 27 July 2026): Art 3, points (1) and
    (3) to (7) (points (8) to (11), (26), (48) and (56) read into the keys); Art 4(1);
    Art 16, points (a) to (l); Art 18(1); Art 19(1); Art 20(1) and (2); Art 21(1)
    and (2); Art 22(1) to (4); Art 23(1) to (7); Art 24(1) to (6); Art 111(1) and
    (2); Art 113, third paragraph, points (a) and (c)(i) and (ii).'

