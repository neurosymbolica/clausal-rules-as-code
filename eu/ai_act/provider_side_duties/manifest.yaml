excluded_set:
- what: scope_of_the_regulation
  instrument: Regulation (EU) 2024/1689 Art 2 (not in this pin; the scope-and-roles
    order)
  cites:
  - 02024R1689-20260727#art_002
  reason: Art 2 says to whom and to which AI systems the Regulation applies and what
    it excludes (for example military, defence or national security uses, scientific
    research and development, research and testing before placing on the market).
    Art 2 is not pinned in this domain.
  consequence: The caller first checks that the Regulation applies to the case under
    Art 2; the answers assume it does.
- what: roles_along_the_value_chain
  instrument: Regulation (EU) 2024/1689 Art 25 (not in this pin; the scope-and-roles
    order)
  cites:
  - 02024R1689-20260727#art_025
  reason: Art 25 makes a distributor, importer, deployer or other third party a provider
    in the cases it lists, and treats a product manufacturer as the provider in the
    case of Art 25(3); who holds which role is a caller fact here (actor_role, reading
    (5)).
  consequence: 'The caller gives actor_role after applying Art 25: an actor that Art
    25 makes a provider is given as provider.'
- what: classification_as_high_risk
  instrument: Regulation (EU) 2024/1689 Art 6 and Annexes I and III (not in this pin;
    the high-risk classification order)
