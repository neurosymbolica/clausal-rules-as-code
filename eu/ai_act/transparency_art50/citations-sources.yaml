# text CELEX 02024R1689-20260727 (as amended by Regulation (EU) 2026/1744, valid
# from 27 July 2026). Source of record: the pinned Formex extract of that text
# (cut by the build process on 2026-11-14); each verbatim is an exact substring of it.
