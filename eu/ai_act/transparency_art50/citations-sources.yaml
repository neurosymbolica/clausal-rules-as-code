eu_reg_2024_1689_art_113:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 113, second sentence: the Regulation applies from 2 August 2026, that day
    included; no point of the third paragraph dates Art 50 (Chapter IV). Before that
    day the answer is not_applicable_on_date.
eu_reg_2024_1689_art_50_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 50(1): providers inform persons that they interact with an AI system unless
    obvious; law-enforcement exception unless available for the public to report a
    criminal offence.
eu_reg_2024_1689_art_50_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 50(2), first and third sentences: machine-readable marking of synthetic
    outputs; exceptions for assistive standard editing, no substantial alteration of
    the input, and authorisation by law. Second sentence not formalised.
eu_reg_2024_1689_art_50_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 50(3): deployers of emotion recognition or biometric categorisation systems
    inform the persons exposed; exception where permitted by law to detect, prevent or
    investigate criminal offences. Data-protection limb not formalised.
eu_reg_2024_1689_art_50_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 50(4): deep-fake disclosure (with the limited disclosure for evidently
    artistic works) and public-interest text disclosure (with the human review plus
    editorial responsibility exception).
eu_reg_2024_1689_art_50_5:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 50(5): the information of paragraphs 1 to 4 is clear and distinguishable, at
    the latest at the first interaction or exposure, and conforms to the applicable
    accessibility requirements. Not read for marking (Q9).
eu_reg_2024_1689_art_111_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 111(4): systems placed on the market before 2 August 2026 comply with Art
    50(2) by 2 December 2026; read (Q5) as in_transitional_period from 2026-08-02 to
    2026-12-01 inclusive.
eu_reg_2024_1689_art_3_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 3(1), definition of AI system: the judgement key ai_system, read only once
    the duty test is met (Q13). The pinned Formex text drops the quotation marks
    around the defined term (Q18); the verbatim avoids the defined term.
eu_reg_2024_1689_art_3_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
  retrieved: 2026-11-15
  note: >-
    Art 3(4), definition of deployer: use in the course of a personal
    non-professional activity takes the three deployer duties out (Q11).
