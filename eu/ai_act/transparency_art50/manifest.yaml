# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib,
# kit/deadline_lib) and library(reif), no shared domain backbone package.
uses: []

scope: "Whether, on a calendar day the caller gives, one of the five transparency
  duties of Article 50(1) to (4) of Regulation (EU) 2024/1689 (Artificial Intelligence
  Act), in the consolidated text 02024R1689-20260727 as amended by Regulation (EU)
  2026/1744, applies to one system the caller describes (interaction information,
  machine-readable marking, emotion recognition or biometric categorisation information,
  deep-fake disclosure, public-interest text disclosure), read with Article 3, points
  (1) and (4), the date of application of Article 113, second sentence (2 August 2026),
  and the transition of Article 111(4) for marking; and whether that duty is met under
  Article 50(5). Open-textured judgements (obviousness, assistive editing, substantial
  alteration, emotion recognition or biometric categorisation system, deep fake, public-interest
  text, artistic work, appropriate disclosure, clarity, accessibility, marking, AI system)
  are given by the caller and, when unsure and decisive, referred to a lawyer. Out of
  scope: who the provider or deployer is, whether the Regulation applies at all (Article
  2), the design and development limb of Article 50(1), the technical-solutions sentence
  of Article 50(2), the data-protection limb of Article 50(3), and penalties (Article
  99(4))."

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June
    2024 laying down harmonised rules on artificial intelligence (Artificial Intelligence
    Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 as amended
    by Regulation (EU) 2026/1744 (valid from 27 July 2026): Article 3, points (1) and
    (4); Article 50(1) to (5); Article 111(4); Article 113, second sentence"

query_interface:
  3: "transparency_duty_status/5"       # status_determination: which result the duty has on the day
  13: "transparency_compliance/5"       # compliance_check: whether the duty is met
  7: "transparency_art50_checklist/2"   # justification: one item(Id, Status, cite(Key)) per test item
  16: "transparency_art50_what_if/4"    # what_if: re-evaluate under an overridden key

