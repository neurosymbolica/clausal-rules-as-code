- what: definitions_applied_by_the_caller
  units:
  - 02024R1689-20260727#point_003_3
  - 02024R1689-20260727#point_003_9
  - 02024R1689-20260727#point_003_39
  - 02024R1689-20260727#point_003_40
  - 02024R1689-20260727#point_003_60
  - 02024R1689-20260727#point_003_66
  partial: true
  reason: The definitions of provider, placing on the market, emotion recognition
    system, biometric categorisation system, deep fake and general-purpose AI system
    are quoted because the keys use these terms; the caller applies them when it gives
    a key. The order does not formalise them.
  consequence: The answers rest on the caller's application of these definitions in
    the keys it gives.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: design_and_development_of_article_50_1
  units:
  - 02024R1689-20260727#parag_050.001
  partial: true
  reason: Art 50(1) requires providers to ensure that the AI system is 'designed and
    developed in such a way' that the natural persons concerned are informed; the
    order reads that duty only through whether the required information is given (Q17).
    How the system is designed and developed to that end is not checked.
  consequence: The answer compliant for interaction_information says that the information
    was given as Art 50(5) requires; it does not say how the system was designed and
    developed.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: technical_solutions_of_article_50_2
  units:
  - 02024R1689-20260727#parag_050.002
  partial: true
  reason: The second sentence of Art 50(2) (providers shall ensure their technical
    solutions are effective, interoperable, robust and reliable as far as technically
    feasible, taking into account the specificities and limitations of various types
    of content, the costs of implementation and the generally acknowledged state of
    the art, as may be reflected in relevant technical standards) gives no crisp test;
    the first sentence (the marking duty) and the third (its exceptions) are formalised
    (Q17).
  consequence: The answer compliant for machine_readable_marking says only that the
    outputs are marked and detectable; it does not say that the technical solutions
    meet the second sentence.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: data_protection_limb_of_article_50_3
  units:
  - 02024R1689-20260727#parag_050.003
  partial: true
  reason: The first sentence of Art 50(3) also requires deployers to process the personal
    data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive
    (EU) 2016/680, as applicable; that is judged under those acts, which are not pinned.
    The information duty and its exception are formalised.
  consequence: The answer compliant for emotion_recognition_or_biometric_categorisation_information
    does not say that the personal data were processed lawfully.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: relation_to_chapter_iii_and_other_law
  units:
  - 02024R1689-20260727#parag_050.006
  reason: 'Art 50(6): paragraphs 1 to 4 do not affect the requirements of Chapter
    III and are without prejudice to other transparency obligations in Union or national
    law; it adds no rule this order applies.'
  consequence: A system may have further duties under Chapter III or other law; the
    answers do not say.
  declaration: not_an_exception
  not_formalized_because: structural
- what: codes_of_practice_and_implementing_acts
  units:
  - 02024R1689-20260727#parag_050.007
  reason: 'Art 50(7): the Commission encourages codes of practice, assesses whether
    adherence is adequate and may adopt implementing acts; it binds the Commission
    and sets no duty of a provider or deployer.'
  consequence: The answers do not say whether a code of practice or an implementing
    act was followed.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: other_transitional_rules
  units:
  - 02024R1689-20260727#parag_111.001
  - 02024R1689-20260727#parag_111.002
  - 02024R1689-20260727#parag_111.003
  reason: Art 111(1) to (3) deal with large-scale IT systems, high-risk AI systems
    and general-purpose AI models placed on the market earlier; no limb of this order
    reads them.
  consequence: 'None for these answers: only Art 111(4) reaches Art 50.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: application_dates_of_other_provisions
  units:
  - 02024R1689-20260727#point_113_a
  - 02024R1689-20260727#point_113_b
  - 02024R1689-20260727#point_113_c
  - 02024R1689-20260727#point_113_c_i
  - 02024R1689-20260727#point_113_c_ii
  - 02024R1689-20260727#point_113_d
  reason: The points of the third paragraph of Art 113 date Chapters I and II, Chapter
    III, Chapters V, VII and XII, Art 78 and Arts 102 to 110; none dates Art 50, which
    is in Chapter IV (Q14).
  consequence: 'None for these answers: Art 50 is dated by the second sentence of
    Art 113.'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: scope_and_exclusions_of_article_2
  instrument: Regulation (EU) 2024/1689 Art 2 (not in this pin; the scope order)
  cites:
  - 02024R1689-20260727#art_002
  reason: Art 2 sets the scope of the Regulation and its exclusions (among others
    military, defence and national security, scientific research and development,
    and use by natural persons in a purely personal non-professional activity); Art
    2 is not pinned in this domain.
  consequence: The caller first checks that the Regulation applies to the system under
    Art 2; the answers assume it does.
- what: penalties_for_transparency_obligations
  instrument: Regulation (EU) 2024/1689 Art 99(4) (the penalties order)
  cites:
  - 02024R1689-20260727#parag_099.004
  reason: The fines for non-compliance with the obligations of providers and deployers
    under Art 50 are set in Art 99(4), the penalties order's; this order says only
    whether a duty applies and is met.
  consequence: For the fine the caller uses the penalties order.
