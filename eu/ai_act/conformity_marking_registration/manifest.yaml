uses: []

scope: >-
  For ONE AI system and its provider (and, for the registration of Art 49(3),
  one deployer of it), under Regulation (EU) 2024/1689 (Artificial
  Intelligence Act) as consolidated on 27 July 2026 (amended by Regulation (EU)
  2026/1744): which conformity assessment procedure Art 43(1) to (3) gives the
  system; who acts as notified body for the procedure of Annex VII (Art 43(1),
  third subparagraph); whether a change asks for a new conformity assessment
  (Art 43(4), Art 3(23)); which EU declaration of conformity Art 47(1) and (3)
  asks for and whether it must still be kept ten years on (Art 47(1)); which
  of five elements of the CE marking Art 48 asks for; which registration Art
  49 asks of the provider or a deployer; and the item lists of Annexes VI, VII
  (points 3.1 and 4.2), VIII and IX and of Art 49(4). Each answer is judged at
  its date (Art 113(c)(i) and (ii)) and through the transitions of Art 111(1)
  and (2). Out of scope: whether the system is an AI system, whether the
  Regulation applies (Art 2), who holds which role (order scope-and-roles),
  whether the system is high-risk (Art 6; the caller gives the classification
  keys), whether a procedure, declaration, marking or registration was made
  correctly, the standards themselves (Arts 40 to 42) and penalties (order
  penalties). Open-textured judgements (significant changes, intended use,
  substantial modification, affixing possible and warranted) are the caller's;
  an unsure one that matters goes to a lawyer as needs_legal_review.
  Drafter's readings, not a lawyer's.

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June 2024 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024; consolidated text 02024R1689-20260727 (as amended by Regulation (EU) 2026/1744): Art 3, points (9), (11), (20), (22), (23), (24), (26), (27), (28); Art 43(1) to (4); Art 47(1) and (3); Art 48(1) to (5); Art 49(1) to (5); Art 111(1) and (2); Art 113, second paragraph and third paragraph, point (c)(i) and (ii); Annex VI points 1 to 4; Annex VII point 1, points 3.1 and 4.2; Annex VIII Sections A, B and C; Annex IX points 1 to 5"

