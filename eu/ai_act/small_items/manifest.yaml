  declaration: not_an_exception
  not_formalized_because: institutional
- what: right_to_lodge_a_complaint
  units:
  - 02024R1689-20260727#art_085
  reason: 'Art 85: any natural or legal person having grounds to consider that there
    has been an infringement may submit complaints to the market surveillance authority,
    handled under Regulation (EU) 2019/1020; it sets no condition the order can test
    beyond the person''s own grounds.'
  consequence: The order gives no answer on complaints; every person with such grounds
