scope: "Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text
  02024R1689-20260727 (as amended by Regulation (EU) 2026/1744): six bounded
  questions, each the cumulative conditions of one Article on the assessment date:
  whether Art 4a(1) or (2) permits the processing of special categories of personal
  data for bias detection and correction; whether Art 59(1) and (2) permit the further
  processing of personal data in an AI regulatory sandbox; whether Art 60(1) and (4)
  permit testing of a high-risk AI system in real world conditions outside a sandbox,
  or Art 60a(1), (2) and (5) leave it to a Member State framework; whether a consent
  meets Art 61(1) and (2); whether Art 63(1) and (2) let an SME comply with elements of
  the quality management system in a simplified manner; whether a person has the right
  to explanation of Art 86(1) to (3). Application dates from Art 113 (first paragraph,
  third paragraph point (a)). Open-textured judgements are handed to the user or to a
  lawyer (needs_legal_review), never decided. Out of scope: the scope order of Art 2,
  the data protection acts, national law, the classification as high-risk (Art 6,
  Annexes I and III), Art 10 and Art 17, the content of the plan, registration,
  agreement, documentation, summary and Member State framework, Art 60(5) to (9),
  Art 60a(3), (4), (6) and Art 85 (deferred and excluded sets)."

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June
    2024 laying down harmonised rules on artificial intelligence (Artificial Intelligence
    Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 as amended
    by Regulation (EU) 2026/1744: Arts 4a(1), (2); 59(1), (2), (3); 60(1) to (9); 60a(1)
    to (6); 61(1), (2); 63(1), (2); 85; 86(1) to (3); 113."
  - "Regulation (EU) 2026/1744 amending Regulation (EU) 2024/1689 (inserting Arts 4a and
    60a, amending Arts 63(1) and 113)."

query_interface:
  3: "small_items_status/2"       # status determination: the RESULT of a query
  13: "decide_small_items/2"      # compliance check: permitted / not permitted with citations
  7: "small_items_checklist/2"    # justification: one item per condition with cite(Key)
  16: "small_items_what_if/4"     # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02024R1689-20260727#art_004A
  - 02024R1689-20260727#art_059
  - 02024R1689-20260727#art_060
  - 02024R1689-20260727#art_060A
  - 02024R1689-20260727#art_061
  - 02024R1689-20260727#art_063
  - 02024R1689-20260727#art_086
  reason: 'The titles of Articles 4a, 59, 60, 60a, 61, 63 and 86 carry no rule of
    their own: document structure. Deferred so every unit of the pinned extract is
    accounted for.'
  consequence: 'None for a caller: they carry no rule.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: data_protection_law_alongside_article_4a
  units:
  - 02024R1689-20260727#parag_004A.001
  partial: true
  reason: Art 4a(1) applies 'In addition to the provisions set out in Regulations
    (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680, as applicable';
    those acts are not pinned, and the order checks only the conditions of Art 4a.
  consequence: An answer bias_processing_permitted does not say that the processing
    meets the data protection acts; the caller checks them.
  declaration: not_an_exception
  not_formalized_because: structural
- what: no_obligation_to_detect_bias
  units:
  - 02024R1689-20260727#parag_004A.002
  partial: true
  reason: The last sentence of Art 4a(2) ('This paragraph does not create any obligation
    to conduct such bias detection and correction') adds no condition.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: structural
- what: content_of_sandbox_documentation_and_summary
  units:
  - 02024R1689-20260727#parag_059.001
  - 02024R1689-20260727#point_059.001_a
  - 02024R1689-20260727#point_059.001_a_i
  - 02024R1689-20260727#point_059.001_a_ii
  - 02024R1689-20260727#point_059.001_a_iii
  - 02024R1689-20260727#point_059.001_a_iv
  - 02024R1689-20260727#point_059.001_a_v
  - 02024R1689-20260727#point_059.001_b
  - 02024R1689-20260727#point_059.001_c
  - 02024R1689-20260727#point_059.001_d
  - 02024R1689-20260727#point_059.001_e
  - 02024R1689-20260727#point_059.001_f
  - 02024R1689-20260727#point_059.001_g
  - 02024R1689-20260727#point_059.001_h
  - 02024R1689-20260727#point_059.001_i
  - 02024R1689-20260727#point_059.001_j
  partial: true
  reason: Art 59(1) is listed whole because the order keys the paragraph and four
    of its points only; points (a) to (g) are formalised through the keys of the query.
    Points (h) to (j) are read as done or not; the order does not check the content
    of the logs, the technical documentation of Annex IV or the published summary,
    and reads the exception of point (j) for sensitive operational data into its key.
  consequence: An answer sandbox_processing_permitted does not say that the documentation
    or the summary is complete; the caller checks it.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: other_legal_bases_for_processing
  units:
  - 02024R1689-20260727#parag_059.003
  reason: 'Art 59(3): paragraph 1 is without prejudice to Union or national law that
    excludes or provides a basis for such processing; that law is not this Regulation''s.'
  consequence: An answer sandbox_processing_not_permitted does not say the processing
    lacks another legal basis.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: implementing_acts_and_other_law_on_testing
  units:
  - 02024R1689-20260727#parag_060.001
  partial: true
  reason: Art 60(1) second to fourth sentences (Commission implementing acts on the
    plan; Union or national law on testing of Annex I products) and the words 'without
    prejudice to the prohibitions under Article 5' add no condition the order checks;
    the first sentence's route is read.
  consequence: An answer real_world_testing_permitted does not say that the practice
    is not prohibited by Art 5 or that the plan follows the implementing acts.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: when_and_with_whom_testing_may_be_conducted
  units:
  - 02024R1689-20260727#parag_060.002
  reason: 'Art 60(2): testing may be conducted at any time before placing on the market
    or putting into service, alone or with deployers; it permits and sets no further
    condition the order checks.'
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: structural
- what: ethical_review
  units:
  - 02024R1689-20260727#parag_060.003
  reason: 'Art 60(3): the testing is without prejudice to any ethical review required
    by Union or national law, which is not pinned.'
  consequence: The answers do not say whether an ethical review was needed or done.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: content_of_plan_registration_and_agreement
  units:
  - 02024R1689-20260727#parag_060.004
  - 02024R1689-20260727#point_060.004_a
  - 02024R1689-20260727#point_060.004_b
  - 02024R1689-20260727#point_060.004_c
  - 02024R1689-20260727#point_060.004_d
  - 02024R1689-20260727#point_060.004_e
  - 02024R1689-20260727#point_060.004_f
  - 02024R1689-20260727#point_060.004_g
  - 02024R1689-20260727#point_060.004_h
  - 02024R1689-20260727#point_060.004_i
  - 02024R1689-20260727#point_060.004_j
  - 02024R1689-20260727#point_060.004_k
  partial: true
  reason: Art 60(4) points (a), (c) and (h) are read as done or not; the content of
    the plan, of the registration (Annex IX, Art 49) and of the agreement with deployers
    is not checked.
  consequence: An answer real_world_testing_permitted does not say that the plan,
    the registration or the agreement is complete.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: withdrawal_supervision_incidents_and_liability
  units:
  - 02024R1689-20260727#parag_060.005
  - 02024R1689-20260727#parag_060.006
  - 02024R1689-20260727#parag_060.007
  - 02024R1689-20260727#parag_060.008
  - 02024R1689-20260727#parag_060.009
  reason: 'Art 60(5) to (9): the subjects'' right to withdraw, the market surveillance
    powers, serious incidents during testing, notification of suspension or termination,
    and liability. They apply during or after the testing and are not conditions for
    it.'
  consequence: The answers do not say whether these duties were met.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: member_state_frameworks_notification_and_cooperation
  units:
  - 02024R1689-20260727#parag_060A.003
  - 02024R1689-20260727#parag_060A.004
  - 02024R1689-20260727#parag_060A.006
  reason: 'Art 60a(3), (4) and (6): notification of the framework to the Commission,
    cooperation of the national authorities, and the harmonisation legislation of
    Section B; they bind Member States and authorities.'
  consequence: None for a tester beyond the framework itself.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: content_of_the_member_state_framework
  units:
  - 02024R1689-20260727#parag_060A.005
  - 02024R1689-20260727#point_060A.005_a
  - 02024R1689-20260727#point_060A.005_b
  - 02024R1689-20260727#point_060A.005_c
  - 02024R1689-20260727#point_060A.005_d
  partial: true
  reason: Art 60a(5) lists what a real-world testing framework must lay down; the
    order answers subject_to_the_member_state_framework without checking the framework
    or the testing against it (Q4).
  consequence: That answer does not say whether the testing meets the framework or
    the provisions of Art 60 it names.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: commission_guidelines_on_simplified_compliance
  units:
  - 02024R1689-20260727#parag_063.001
  partial: true
  reason: 'Art 63(1) second sentence: the Commission develops guidelines on the elements
    that may be complied with in a simplified manner; which elements is for those
    guidelines, not pinned.'
  consequence: An answer may_comply_in_a_simplified_manner does not say which elements
