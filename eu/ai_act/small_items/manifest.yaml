excluded_set:
- what: scope_and_exclusions_of_article_2
  instrument: Regulation (EU) 2024/1689 Art 2 (not in this pin; the scope order)
  cites:
  - 02024R1689-20260727#art_002
  reason: 'Art 2 says to whom and to what the Regulation applies: Art 2(2) limits
    it, for high-risk AI systems related to products under Section B of Annex I, to
    Art 6(1), Art 60a and Arts 102 to 112 (Arts 57 to 59 only in so far as integrated),
    and Art 2(8) excludes research, testing and development before placing on the
    market, testing in real world conditions excepted; Art 2 is not pinned in this
    domain (Q11).'
  consequence: The caller first checks that the Regulation applies to the case under
    Art 2; the answers assume it does.
- what: data_governance_of_high_risk_systems
  instrument: Regulation (EU) 2024/1689 Art 10 (not in this pin)
  cites:
  - 02024R1689-20260727#art_010
  reason: Art 4a(1) refers to bias detection and correction 'in accordance with Article
    10(2), points (f) and (g)'; Art 10 is not pinned here.
  consequence: The caller applies Art 10(2)(f) and (g) when it gives the strict-necessity
    key of Art 4a(1).
- what: special_categories_of_personal_data
  instrument: Regulation (EU) 2016/679 Art 9
  cites:
  - 32016R0679#art_009
  reason: Which personal data are special categories, and the other conditions for
    processing them, are set by the data protection acts, which Art 4a(1) applies
    'In addition to'.
  consequence: The caller checks the processing under the data protection acts.
- what: classification_as_high_risk
  instrument: Regulation (EU) 2024/1689 Art 6 with Annexes I and III (not in this
    pin)
  cites:
  - 02024R1689-20260727#art_006
  reason: Whether a system is high-risk, listed in Annex III (and under which point)
    or covered by Section A or B of Annex I decides the keys of Arts 4a, 60 and 86;
    the classification rules are not pinned here.
  consequence: The caller takes those keys from the classification rules.
- what: quality_management_system
  instrument: Regulation (EU) 2024/1689 Art 17 (not in this pin)
  cites:
  - 02024R1689-20260727#art_017
  reason: Art 63(1) lets SMEs comply with elements of the quality management system
    of Art 17 in a simplified manner; Art 17 is not pinned here.
  consequence: The caller takes the quality management duties from Art 17.
- what: sme_definition
  instrument: Commission Recommendation 2003/361/EC (not pinned)
  cites:
  - 32003H0361#art_003
  reason: Whether an operator is an SME and whether it has partner or linked enterprises
    is defined by Recommendation 2003/361/EC.
  consequence: The caller applies the Recommendation when it gives the Art 63 keys.
