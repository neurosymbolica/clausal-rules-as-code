# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports none (only the kit's formalize_lib and the
# libraries reif, clpz and datetime).
uses: []

scope: "For one incident or malfunctioning of an AI system whose provider (or
  someone acting for it) asks, under Regulation (EU) 2024/1689 as consolidated
  on 27 July 2026 (amended by Regulation (EU) 2026/1744): whether the report of
  a serious incident under Art 73(1) is due (Art 3(49) and (61), Art 73(1) to
  (4), (9) and (10), Art 75(1a), Art 111(2), Art 113 third paragraph point (c)),
  to which recipient (the market surveillance authority, the national competent
  authority of Art 73(10), or the AI Office), within 2, 10 or 15 calendar days
  of awareness and by which last day, with the follow-up duties of Art 73(6)
  listed; and whether a first report made on a given day was in time (Art
  73(2) to (5)). Open-textured judgements (significant change in design, use by
  public authorities, equivalent Union reporting obligations, widespread
  infringement, immediacy) are handed to the caller or a lawyer. Out of scope:
  classification as high-risk (Art 6, Annexes I and III), whether Art 75(1)
  applies (attested outside fact), the severity rule of Art 73(2) second
  subparagraph, the content of reports and follow-up, the authorities' side of
  Art 73(7), (8) and (11), Art 111(1) and the period rules of Regulation
  1182/71."

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council of
    13 June 2024 laying down harmonised rules on artificial intelligence
    (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024, consolidated
    text 02024R1689-20260727 as amended by Regulation (EU) 2026/1744: Art 3
    points (49) and (61), Art 73(1) to (6), (9) and (10), Art 75(1) and (1a),
    Art 111(2), Art 113 second paragraph and third paragraph point (c)(i) and
    (ii)"

query_interface:
  2: "serious_incident_reporting_status/2"      # status verdict of a request term
  14: "serious_incident_report_duty/4"          # obligation_surfacing: is the report due, to whom, by when, with which follow-up
  15: "serious_incident_report_timeliness/5"    # deadline: was the report in time; consequence of missing the limit
  16: "serious_incident_reporting_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02024R1689-20260727#art_073
  - 02024R1689-20260727#art_075
  - 02024R1689-20260727#art_111
  reason: 'The titles of Articles 73, 75 and 111 carry no obligation: document structure.
    Deferred so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: authority_side_of_reporting
  units:
  - 02024R1689-20260727#parag_073.007
  - 02024R1689-20260727#parag_073.008
  - 02024R1689-20260727#parag_073.011
  reason: Art 73(7) (the market surveillance authority informs the national public
    authorities or bodies of Art 77(1) of a point (c) incident; the Commission develops
    guidance on the obligations of paragraph 1, to be issued by 2 August 2025 and
    assessed regularly), Art 73(8) (the market surveillance authority takes measures
    under Art 19 of Regulation (EU) 2019/1020 within seven days of the notification)
    and Art 73(11) (national competent authorities notify the Commission under Art
    20 of Regulation (EU) 2019/1020) bind the authorities and the Commission; none
    changes what the provider must report, to whom or by when.
  consequence: 'None for a provider caller: these paragraphs bind the authorities
    and the Commission; the answers do not say what an authority must do after a report.'
  declaration: not_an_exception
  not_formalized_because: institutional
- what: severity_of_the_serious_incident
  units:
  - 02024R1689-20260727#parag_073.002
  partial: true
  reason: The second subparagraph of Art 73(2) ('The period for the reporting referred
    to in the first subparagraph shall take account of the severity of the serious
    incident') sits in the same unit as the 15-day limit, which the order reads; it
    gives no measure of severity and no shorter period, so it is not formalised.
  consequence: The answers give the outer limit only; for a severe incident the caller
    must consider whether a shorter period is required.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: content_of_reports_and_follow_up
  units:
  - 02024R1689-20260727#parag_073.005
  - 02024R1689-20260727#parag_073.006
  partial: true
  reason: Art 73(5) allows an incomplete initial report followed by a complete report,
    and Art 73(6) lists the follow-up duties (investigations without delay, risk assessment,
    corrective action, cooperation, no altering investigation before informing the
    authorities). The order reads REPORT_DATE as the day of the first report and lists
    the five follow-up duties in the answer; it does not check the content of a report,
    whether a complete report followed, or how the follow-up duties are met.
  consequence: The answers do not say whether a report or its follow-up was adequate;
    the caller must check the content itself.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
- what: ai_office_competence_and_transmission
  units:
  - 02024R1689-20260727#parag_075.001
  - 02024R1689-20260727#point_075.001_a
  - 02024R1689-20260727#point_075.001_a_i
  - 02024R1689-20260727#point_075.001_a_ii
  - 02024R1689-20260727#point_075.001_a_iii
  - 02024R1689-20260727#point_075.001_a_iv
  - 02024R1689-20260727#point_075.001_b
  - 02024R1689-20260727#parag_075.001A
  partial: true
  reason: Art 75(1) (which AI systems are under the exclusive competence of the AI
    Office, points (a) and (b) with the exceptions (i) to (iv), and the second subparagraph
    on providers and deployers) is quoted for what the outside fact system_under_the_exclusive_competence_of_the_ai_office
    means; this order does not test it, the caller attests the fact. The third sentence
    of Art 75(1a) (the AI Office transmits the relevant information to the market
    surveillance authority of the Member State where the provider or its legal representative
    is situated) binds the AI Office and is not formalised.
  consequence: The answers take the exclusive competence of the AI Office as attested
    (absent reads as not under it); they do not say whether Art 75(1) applies, nor
    what the AI Office does with a report.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; whether Art 75(1) applies is for the order on Arts 74 to 78
    (powers and confidentiality) once it is promoted; to be taken up in a later change
    to the orders, not in this order's rules; the deferral stands for this run.
- what: other_paragraphs_of_article_75
  units:
  - 02024R1689-20260727#parag_075.001B
  - 02024R1689-20260727#parag_075.001C
  - 02024R1689-20260727#parag_075.001D
  - 02024R1689-20260727#parag_075.001E
  - 02024R1689-20260727#parag_075.002
  - 02024R1689-20260727#parag_075.002A
  - 02024R1689-20260727#point_075.002A_a
  - 02024R1689-20260727#point_075.002A_b
  - 02024R1689-20260727#point_075.002A_c
  - 02024R1689-20260727#parag_075.003
  reason: Art 75(1b) to (1e) (cooperation with and assistance to the AI Office, its
    notice before restrictive decisions, its conformity assessments), (2), (2a) with
    points (a) to (c) and (3) (market surveillance of general-purpose AI systems and
    requests to the AI Office) bind the authorities and the AI Office; none changes
    what the provider must report, to whom or by when.
  consequence: 'None for a provider caller: these paragraphs bind the authorities
    and the AI Office.'
  declaration: not_an_exception
  not_formalized_because: institutional
- what: division_headings_quoted
  units:
  - 02024R1689-20260727#division_chapter_iii
  - 02024R1689-20260727#division_chapter_iii-section_1
  - 02024R1689-20260727#division_chapter_ix
  - 02024R1689-20260727#division_chapter_ix-section_2
  partial: true
  reason: The headings of Chapter III and its Section 1, and of Chapter IX and its
    Section 2, are quoted only for where Art 6 and Art 73 sit (reading (2)); the other
    article lines under them (Art 7) and the headings themselves carry no obligation
    this order reads.
  consequence: 'None for a caller: the headings place Art 6 and Art 73 for the dates
    of reading (2); they carry no obligation.'
  declaration: not_an_exception
  debt: true
  open: formalisable; structure only; the deferral stands for this run.
- what: other_division_headings
  units:
  - 02024R1689-20260727#division_chapter_iii-section_2
  - 02024R1689-20260727#division_chapter_iii-section_3
  - 02024R1689-20260727#division_chapter_iii-section_4
  - 02024R1689-20260727#division_chapter_iii-section_5
  - 02024R1689-20260727#division_chapter_ix-section_1
  - 02024R1689-20260727#division_chapter_ix-section_3
  - 02024R1689-20260727#division_chapter_ix-section_4
  - 02024R1689-20260727#division_chapter_ix-section_5
  reason: The other section headings of Chapters III and IX, with their article lines,
    are pinned with the chapter extracts and carry no obligation; no limb of this
    order reads them.
  consequence: 'None for a caller: headings carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: application_dates_of_other_provisions
  units:
  - 02024R1689-20260727#point_113_a
  - 02024R1689-20260727#point_113_b
  - 02024R1689-20260727#point_113_d
  reason: Art 113 third paragraph points (a) (Chapters I and II from 2 February 2025,
    with later dates for some Art 5 points), (b) (Chapter III Section 4, Chapters
    V, VII and XII and Art 78 from 2 August 2025, except Art 101) and (d) (Arts 102
    to 110 from 27 July 2026) date provisions outside this order; no limb reads them.
  consequence: 'None for these answers: no limb of this order depends on those dates.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: general_date_of_application
  units:
  - 02024R1689-20260727#art_113
  partial: true
  reason: The first and second paragraphs of Art 113 (entry into force; application
    from 2 August 2026, the date of Chapter IX) are read only to place Art 73 (reading
    (2)); the general date is earlier than every Chapter III date of point (c), so it
    never decides an answer, and the order's citation vocabulary gives the unit no key
    that an answer returns.
  consequence: 'None for these answers: the later dates of Art 113 third paragraph
    point (c) govern every answer.'
  declaration: not_an_exception
  debt: true
  open: formalisable; structure of the dates only; the deferral stands for this run.
- what: harm_points_of_article_3_49
  units:
  - 02024R1689-20260727#point_003_49_a
  - 02024R1689-20260727#point_003_49_b
  - 02024R1689-20260727#point_003_49_d
  partial: true
  reason: Points (a), (b) and (d) of Art 3(49) are read through the caller's classification
    in the keys harm_to_health, critical_infrastructure_disruption and serious_harm_to_property_or_environment
    (open question Q6); whether the harm was serious, the disruption serious and irreversible,
    and whether the incident directly or indirectly led to it, are not decided here,
    and the order's citation vocabulary gives these points no key that an answer returns.
  consequence: The caller classifies each harm itself; the answers take the classification
    as given.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; the meaning of serious and irreversible is open-textured; the
    deferral stands for this run.
- what: points_of_article_3_61
  units:
  - 02024R1689-20260727#point_003_61_a
  - 02024R1689-20260727#point_003_61_a_i
  - 02024R1689-20260727#point_003_61_a_ii
  - 02024R1689-20260727#point_003_61_a_iii
  - 02024R1689-20260727#point_003_61_b
  partial: true
  reason: Points (a), (a)(i) to (iii) and (b) of Art 3(61) count Member States, but
    whether an act has harmed or is likely to harm the collective interests of individuals
    is open-textured, so no crisp test is built (reading (6)); widespread_infringement
    is a judgement of the caller, referred under Art 3(61) when unsure.
  consequence: The caller judges whether there is a widespread infringement; the answers
    take the judgement as given or refer it to a lawyer.
  declaration: answered_with_caveat
  debt: true
  open: the Member State counts are formalisable, the harm to collective interests
    is not; the deferral stands for this run.

excluded_set:
- what: classification_as_high_risk
  instrument: Regulation (EU) 2024/1689 Art 6 and Annexes I and III
  cites:
  - 02024R1689-20260727#art_006
  reason: Whether a system is high-risk, and under which of Art 6(1) and Annex I or
    Art 6(2) and Annex III, is decided by Art 6 and the Annexes (the order on high-risk
    classification); this order takes the class as the caller's input.
  consequence: The caller establishes the class first.
- what: incident_provider_and_placing_on_the_market
  instrument: Regulation (EU) 2024/1689 Art 3 points (3), (9) and (44) (not in this
    extract)
  cites:
  - 02024R1689-20260727#point_003_3
  - 02024R1689-20260727#point_003_9
  - 02024R1689-20260727#point_003_44
  reason: That the event is an incident or malfunctioning of an AI system, that the
    caller is its provider, and that the system is placed on the Union market are
    taken as given; the definitions of provider, placing on the market and incident
    are not pinned in this domain.
  consequence: The caller first checks that the provider of a high-risk AI system
    placed on the Union market faces an incident or malfunctioning of it.
- what: medical_device_regulations_and_equivalent_instruments
  instrument: Regulation (EU) 2017/745 (medical devices) Art 87 and Regulation (EU)
    2017/746 (in vitro diagnostic medical devices) Art 82 (vigilance reporting), and
    the Union legislative instruments with reporting obligations of Art 73(9)
  cites:
  - 32017R0745#art_087
  - 32017R0746#art_082
  reason: Whether a system is a device or a safety component of one under the device
    Regulations, and which Union instruments lay down equivalent reporting obligations,
    are not modelled; the first is a crisp input and the second a judgement of the
    caller.
  consequence: The caller establishes the device case, and judges equivalence, first;
    the reporting duties under those instruments themselves are not given.
- what: large_scale_it_systems_of_annex_x
  instrument: Regulation (EU) 2024/1689 Art 111(1) and Annex X
  cites:
  - 02024R1689-20260727#parag_111.001
  reason: Art 111(1) gives AI systems that are components of the large-scale IT systems
    of Annex X, placed on the market or put into service before 2 August 2027, until
    31 December 2030 to comply; Art 111(1) and Annex X are not pinned, and this order
    does not read them.
  consequence: For a component of an Annex X large-scale IT system the caller must
    apply Art 111(1) first; the answers do not.
- what: critical_infrastructure_and_period_rules
  instrument: Directive (EU) 2022/2557 Art 2 point (4) (through Art 3(62) of the Regulation)
    and Regulation (EEC, Euratom) No 1182/71 Art 3
  cites:
  - 32022L2557#art_002
  - 31971R1182#art_003
  reason: What counts as critical infrastructure is defined by reference to Directive
    (EU) 2022/2557, not pinned; the period rules of Regulation 1182/71 are not pinned
    either, so the order counts calendar days without a weekend or holiday shift (open
    question Q9).
  consequence: The caller classifies the disruption itself and checks whether a period
    ending on a holiday is extended.
- what: duties_of_deployers_and_market_surveillance_procedure
  instrument: Regulation (EU) 2024/1689 Art 26(5) and Regulation (EU) 2019/1020 Arts
    19 and 20
  cites:
  - 02024R1689-20260727#art_026
  reason: The deployer's duty to inform the provider of a serious incident and the
    procedures of Regulation (EU) 2019/1020 are not modelled; the order answers for
    the provider's report under Art 73 only.
  consequence: A deployer caller checks its own duties under Art 26 itself.
