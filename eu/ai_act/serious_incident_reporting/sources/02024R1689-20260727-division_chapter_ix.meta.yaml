# Statute pin: table of contents of CHAPTER IX of the AI Act (headings and article number/title lines, NO article bodies).
# One extract per chapter (the reader takes ONE subtree per extract); a shared pin per act, copied byte-identically into an order's pin folder by the order that quotes it.
# Why: a chapter or section heading is law text, and the structure says which articles sit under it. The reader gives each DIVISION a unit id (division_chapter_ix, division_chapter_ix-section_N) whose text carries the article number and title lines, so membership ("Art 8 sits in Chapter III Section 2") is quoted text.
