  7: "deployer_duties_fria_checklist/2"           # justification: items carry cite(...)
  13: "deployer_duties_fria_compliance_check/2"   # compliance_check: proposed log retention period
  14: "deployer_duties_fria_obligation_status/2"  # obligation_surfacing: does the duty apply
  15: "deployer_duties_fria_chapter_iii_date/2"   # deadline: the day Arts 26 and 27 apply
  16: "deployer_duties_fria_what_if/4"            # what_if: re-evaluate under an overridden key

