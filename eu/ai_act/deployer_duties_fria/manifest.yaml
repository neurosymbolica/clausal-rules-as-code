- what: log_period_appropriate_to_the_intended_purpose_and_financial_institutions
  units:
  - 02024R1689-20260727#parag_026.006
  debt: true
  partial: true
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  reason: Art 26(6) asks for 'a period appropriate to the intended purpose of the
    high-risk AI system, of at least six months'; the order checks only the minimum
    of six months, not whether the period is appropriate (an open word), nor which
    logs are under the deployer's control; and its second sentence (deployers that
    are financial institutions maintain the logs as part of the documentation kept
    under Union financial services law) is not formalised (reading (5), reading (6),
    Q14).
  consequence: An answer retention_period_of_at_least_six_months does not say that
    the period is appropriate to the intended purpose, nor how a financial institution
    keeps the logs.
