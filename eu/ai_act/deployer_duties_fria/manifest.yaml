# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This package imports only kit modules (formalize_lib).
uses: []

scope: "Whether, on an assessment day, one of five duties of the deployer of an AI system
  applies under Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text
  02024R1689-20260727: keeping the automatically generated logs (Art 26(6)), informing
  the workers' representatives and the affected workers (Art 26(7)), informing the natural
  persons subject to decisions (Art 26(11), with the Directive (EU) 2016/680 Art 13 rule
  for law enforcement), performing a fundamental rights impact assessment (Art 27(1), (2))
  and notifying its results (Art 27(3)); and whether a proposed log retention period of
  whole months meets the six-month minimum of Art 26(6). The dates of Art 113, third
  paragraph, point (c), and the transitional rules of Art 111(1) and (2) are applied; the
  role of deployer (Art 3(4)) and the high-risk classification are the caller's facts.
  Out of scope: the scope of the Regulation (Art 2), the classification itself (Art 6,
  Annexes I and III), the content of the assessment, the manner and timing of the
  information, which logs are kept and whether the period is appropriate to the intended
  purpose, and the other duties of Art 26 (deferred and excluded sets). Open-textured
  judgements (body governed by public law, public services, decisions related to natural
  persons, significant changes in design, intended use by public authorities) are the
  caller's and refer to a lawyer when unsure."

sources:
  - "Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June 2024 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 as amended by Regulation (EU) 2026/1744: Art 3 points (4), (9), (11) and (46); Art 26(6), (7) and (11); Art 27(1), (2) and (3); Art 111(1) and (2); Art 113, third paragraph, point (c)(i) and (ii); Annex III points 2, 5(b) and 5(c)"
  - "Directive (EU) 2016/680, Art 13 (referred to by Art 26(11), second sentence; not applied)"

