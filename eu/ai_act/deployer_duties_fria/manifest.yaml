    order's rules; the deferral stands for this run.
  reason: 'Art 26(7): the second sentence (the information is given, where applicable,
    under the rules and procedures of Union and national law and practice on information
    of workers and their representatives) and the check that the information came
    before the system was put into service or used are not formalised (reading (7),
