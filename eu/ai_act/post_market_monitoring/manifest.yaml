  # -- citations.clausal --
  - "citation/2"
  # -- post_market_monitoring.clausal --
  - "post_market_monitoring_duty_status/4"
  - "post_market_monitoring_integration_status/3"
  - "decide_post_market_monitoring/2"
  - "post_market_monitoring_status/2"
  - "post_market_monitoring_checklist/2"
  - "post_market_monitoring_decision_resolvable/1"
  - "post_market_monitoring_status_values/1"
  # -- queries.clausal --
  - "post_market_monitoring_profile_keys/1"
  - "post_market_monitoring_input_problems/2"
  - "post_market_monitoring_what_if/4"
  - "not_applicable_on_date/0"
  - "not_a_provider/0"
  - "not_a_high_risk_ai_system/0"
  - "compliance_required_by_31_december_2030/0"
  - "existing_system_without_significant_changes_not_covered/0"
  - "compliance_required_by_2_august_2030/0"
  - "duty_applies/0"
  - "integration_not_available/0"
  - "integration_available/0"
  - "date/3"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "open_textured/2"
