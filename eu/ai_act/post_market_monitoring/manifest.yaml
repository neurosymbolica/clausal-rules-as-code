- what: other_dates_of_article_113
  units:
  - 02024R1689-20260727#point_113_a
  - 02024R1689-20260727#point_113_b
  - 02024R1689-20260727#point_113_d
  debt: true
  declaration: not_an_exception
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  reason: 'Art 113, third paragraph, points (a), (b) and (d) are dating rules with
    substance: they date Chapters I and II (with later dates for parts of Art 5),
    Chapter III Section 4, Chapters V, VII and XII, Art 78 and Arts 102 to 110. None
    of them dates Art 72 or Art 6, so no step of this order reads them (reading (2)).'
  consequence: None for these answers.

excluded_set:
- what: scope_of_the_regulation
  instrument: Regulation (EU) 2024/1689 Art 2 (not in this pin; the order scope-and-roles)
  cites:
  - 02024R1689-20260727#art_002
  reason: Art 2 says to whom and to what the Regulation applies, including which articles
    apply to high-risk systems related to products covered by the legislation of Section
    B of Annex I; it is not pinned in this domain (reading (1)).
  consequence: The caller first checks that the Regulation, and Art 72, apply to the
    case; the answers assume they do.
- what: classification_of_high_risk_ai_systems
  instrument: Regulation (EU) 2024/1689 Art 6 and Annexes I and III (not in this pin;
    the order high-risk-classification)
  cites:
  - 02024R1689-20260727#art_006
  reason: Art 6 classifies AI systems as high-risk under Annex I (paragraph 1) and
    Annex III (paragraphs 2 and 3); the classification is the caller's fact (reading
    (4)).
  consequence: The caller gives the classification keys from the classification rules.
- what: technical_documentation
  instrument: Regulation (EU) 2024/1689 Art 11 and Annex IV (not in this pin; the
    order high-risk-requirements)
  cites:
  - 02024R1689-20260727#art_011
  reason: Art 72(3) places the plan in the technical documentation referred to in
    Annex IV; what that documentation holds and when it is drawn up are rules of Art
    11 and Annex IV (reading (6)).
  consequence: An answer duty_applies does not say what the technical documentation
    must hold.
- what: large_scale_it_systems_listed_in_annex_x
  instrument: Regulation (EU) 2024/1689 Annex X (not in this pin)
  cites:
  - 02024R1689-20260727#division_annex_x
  reason: Art 111(1) refers to the legal acts listed in Annex X; the Annex is not
    pinned, so membership is the caller's fact (reading (7)).
  consequence: The caller says whether the system is such a component.
- what: harmonisation_and_financial_services_legislation
  instrument: Regulation (EU) 2024/1689 Annex I, Section A, and Annex III, point 5
    (not in this pin); Union financial services law
  cites:
  - 02024R1689-20260727#division_annex_i
  reason: Art 72(4) refers to the Union harmonisation legislation listed in Section
    A of Annex I, to point 5 of Annex III and to Union financial services law; none
    is pinned, so coverage, the financial institution and the existing system and
    plan are the caller's facts (reading (9), reading (10)).
  consequence: The caller says whether the system is covered and whether a system
    and plan already exist under that law.
