  - "post_market_monitoring_profile_for/2"
  - "post_market_monitoring_assess/2"

# root_exports: bare atoms read by the caller as package-root module
# attributes; each is exported (as a bare atom) by queries.clausal.
root_exports:
  - provider_of_the_system
  - system_is_a_high_risk_ai_system_listed_in_annex_iii
  - system_is_a_high_risk_ai_system_under_article_6_1_and_annex_i
  - component_of_an_annex_x_large_scale_it_system_placed_on_the_market_or_put_into_service_before_2_august_2027
  - placed_on_the_market_or_put_into_service_before_the_chapter_iii_date
  - significant_changes_in_design_as_from_the_chapter_iii_date
  - intended_to_be_used_by_public_authorities
  - covered_by_union_harmonisation_legislation_listed_in_section_a_of_annex_i
  - point_5_annex_iii_system_of_a_financial_institution_under_union_financial_services_law
  - post_market_monitoring_system_and_plan_already_established_under_that_legislation
  - integration_achieves_an_equivalent_level_of_protection
  - unsure

# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only kit modules (formalize_lib,
# kit/deadline_lib), no shared backbone package.
uses: []

scope: >-
  Regulation (EU) 2024/1689 (Artificial Intelligence Act), consolidated text
  02024R1689-20260727. Decided here: whether, on a given assessment date, the
  actor named as provider of one AI system must establish and document a
  post-market monitoring system based on a post-market monitoring plan that is
  part of the technical documentation (Art 72(1) and 72(3), first and second
  sentences), judged at the Chapter III application dates of Art 113, third
  paragraph, point (c)(i) and (ii), with the transitional rules for Annex X
  large-scale IT system components (Art 111(1)) and for systems already placed
  on the market or put into service (Art 111(2)); and whether that provider has
  the choice of Art 72(4) to integrate into a post-market monitoring system and
  plan already established under Union harmonisation legislation of Annex I
  Section A or Union financial services law. Out of scope: scope of the
  Regulation (Art 2), the role of provider (Art 3(3), order scope-and-roles),
  high-risk classification (Art 6, Annexes I and III), what the system collects
  and analyses (Art 72(2)), proportionality, the technical documentation (Art 11,
  Annex IV), the Commission template, and serious-incident reporting (Art 73).
  Open-textured judgements (significant changes in design, intended use by
  public authorities, equivalent level of protection) are handed to the caller
  and, when unsure and decisive, referred to a lawyer.

sources:
  - 'Regulation (EU) 2024/1689 of the European Parliament and of the Council (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024, consolidated text 02024R1689-20260727 as amended by Regulation (EU) 2026/1744: Art 72(1), 72(3) and 72(4)'
  - 'Regulation (EU) 2024/1689, Art 111(1) and 111(2) (AI systems already placed on the market or put into service)'
  - 'Regulation (EU) 2024/1689, Art 113, third paragraph, point (c) with points (i) and (ii) (application of Chapter III, Sections 1 to 3)'
  - 'Regulation (EU) 2024/1689, Art 3, points (3), (8), (9), (11) and (25) (definitions read into the keys)'

query_interface:
  2: "post_market_monitoring_status/2"                  # status verdict through the facade
  7: "post_market_monitoring_checklist/2"               # justification: cite(...) per item
  13: "post_market_monitoring_integration_status/3"     # compliance check: is integration under Art 72(4) open
  14: "post_market_monitoring_duty_status/4"            # obligation surfacing: duty_applies
  15: "post_market_monitoring_duty_status/4"            # deadline: compliance_required_by_* then duty_applies
  16: "post_market_monitoring_what_if/4"                # what_if: re-evaluate under an overridden key

