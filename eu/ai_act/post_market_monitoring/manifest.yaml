    order's rules; the deferral stands for this run.
  reason: Art 3 is pinned whole; its title and lead words ('For the purposes of this
    Regulation, the following definitions apply') and its points other than (3), (8),
    (9), (11) and (25), which define terms no query of this order reads. 77 units.
  consequence: None for these answers.
