    order's rules; the deferral stands for this run.
  reason: Art 3, point (8) operator is read into reading (8) (a provider is an operator),
    points (9) placing on the market and (11) putting into service into the meaning
    of the key placed_on_the_market_or_put_into_service_before_the_chapter_iii_date,
    and point (25) post-market monitoring system into the meaning of duty_applies;
    they add no step of their own (reading (8), reading (5)).
  consequence: The caller applies the definitions when it gives those keys and reads
    the answer.
- what: proportionality_of_the_post_market_monitoring_system
  units:
  - 02024R1689-20260727#parag_072.001
  debt: true
  partial: true
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  reason: 'Art 72(1): the words ''in a manner that is proportionate to the nature
    of the AI technologies and the risks of the high-risk AI system'' are an open
    word the order does not judge; the order reads who must establish and document
    the system (reading (5), Q18).'
  consequence: An answer duty_applies does not say what a proportionate system is,
    nor that the provider has one.
- what: content_of_the_post_market_monitoring_system
  units:
  - 02024R1689-20260727#parag_072.002
  debt: true
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  reason: 'Art 72(2) says what the system does: actively and systematically collect,
    document and analyse relevant data on the performance of high-risk AI systems
    throughout their lifetime, which allow the provider to evaluate their continuous
    compliance with Chapter III, Section 2; where relevant, an analysis of the interaction
    with other AI systems; and it does not cover sensitive operational data of deployers
    which are law-enforcement authorities. No limb reads it (reading (5), Q19).'
  consequence: An answer duty_applies does not say what the system must collect or
    analyse.
- what: guidance_and_template_of_the_commission
  units:
  - 02024R1689-20260727#parag_072.003
  debt: true
  partial: true
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  reason: 'Art 72(3), third sentence: the Commission, taking utmost account of the
    opinion of the Board, adopts guidance, including a template, on the post-market
    monitoring plan by 2 September 2027. It binds the Commission; the order reads
    the first and second sentences (reading (12), Q15).'
  consequence: No answer says whether the guidance and template have been adopted.
- what: manner_and_extent_of_the_integration
  units:
  - 02024R1689-20260727#parag_072.004
  debt: true
  partial: true
  declaration: answered_with_caveat
  open: formalisable; to be formalised in a later change to the orders, not in this
    order's rules; the deferral stands for this run.
  reason: 'Art 72(4): the words ''as appropriate'', which elements are ''necessary'',
    the purposes ''in order to ensure consistency, avoid duplications and minimise
    additional burdens'' and the use of the template are not formalised; the order
    reads whether the choice is open (reading (9), Q17, Q15).'
  consequence: An answer integration_available does not say how far the integration
    must go or how it is done.
