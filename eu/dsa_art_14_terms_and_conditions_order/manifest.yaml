# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only the kit module formalize_lib, which is
# not a backbone package.
uses: []

scope: "Whether a provider of one intermediary service meets each of the six
  duties of Article 14 of Regulation (EU) 2022/2065 (Digital Services Act) on its
  terms and conditions: Art 14(1) content, language and availability of the terms
  and conditions (including the rules of procedure of an internal complaint handling
  system the provider has); Art 14(2) informing recipients of a significant change;
  Art 14(3) explaining conditions and restrictions in a way minors can understand
  where the service is primarily directed at or predominantly used by minors; Art
  14(4) diligent, objective and proportionate enforcement of restrictions with due
  regard to the rights of all parties; Art 14(5) the summary owed by designated very
  large online platforms and search engines; Art 14(6) publication in the official
  languages of every Member State of service by such platforms and engines. Each
  duty is answered separately; open-textured judgements are the caller's (unsure goes
  to a lawyer); the Commission designation under Art 33 enters only as an attested
  outside fact. Out of scope: Art 19 (it excludes micro and small enterprises only
  from Section 3), Art 20, Art 28, Art 33, the Charter, supervision and enforcement,
  the date of application, and corrigenda (none pinned). An answer is the drafter's
  formalisation, not a finding of a Digital Services Coordinator or the Commission."

sources:
  - "Regulation (EU) 2022/2065 of the European Parliament and of the Council of 19 October
    2022 on a Single Market For Digital Services (Digital Services Act), OJ L 277,
    27.10.2022, original English text (CELEX 32022R2065), Article 14(1) to 14(6)"
  - "Regulation (EU) 2022/2065, Chapter III section titles (Section 1, Articles 11 to
    15; Section 3, Articles 19 to 28) and Article 19(1) and (2), read for scope only"
  - "Regulation (EU) 2022/2065, Article 3 points (b), (g), (i), (j), (t) and (u),
    definitions applied by the caller"

query_interface:
  2: "dsa_art_14_terms_and_conditions_order_status/2"       # eligibility: roll-up verdict over the six cited duties
  7: "dsa_art_14_terms_and_conditions_order_checklist/2"    # justification: one item per paragraph, each with cite(...)
  16: "dsa_art_14_terms_and_conditions_order_what_if/4"     # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_heading
  units:
  - 32022R2065#art_014
  reason: 'The title of Article 14 carries no obligation: document structure. Deferred
    so every unit of the pinned extracts is accounted for.'
  consequence: 'None for a caller: a title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: exclusion_for_micro_and_small_enterprises_not_reaching_section_1
  units:
  - 32022R2065#art_019
  - 32022R2065#parag_019.001
  - 32022R2065#parag_019.002
  reason: 'Art 19(1) and (2) are quoted because the order''s reading on scope rests
    on them: Art 19 excludes micro and small enterprises from ''This Section'', which
    is Section 3 of Chapter III (Articles 19 to 28, pinned section titles), while
    Art 14 is in Section 1 (Articles 11 to 15). No limb of this order reads Art 19
    (reading (4), Q1); the sibling order dsa-art-28-minors-order formalises Art 19
    for Section 3. The title of Art 19 carries no obligation.'
  consequence: 'None for these answers: the exclusion does not reach Art 14, so a
    micro or small enterprise gets the same answer as any other provider.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: dsa-art-28-minors-order
- what: definitions_applied_by_the_caller
  units:
  - 32022R2065#point_003_b
  - 32022R2065#point_003_g
  - 32022R2065#point_003_i
  - 32022R2065#point_003_j
  - 32022R2065#point_003_t
  - 32022R2065#point_003_u
  reason: Art 3, points (b) (recipient of the service), (g) (intermediary service),
    (i) (online platform), (j) (online search engine), (t) (content moderation) and
    (u) (terms and conditions) are quoted because the premises and keys use these
    terms; the caller applies them when it states a premise, a finding or a judgement
    (reading (2), Q17). No limb reads a definition as a key.
  consequence: The answers rest on the caller's application of these definitions in
    the premises and keys it gives.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised in a later change if a key needs it.
- what: definitions_not_read_by_this_order
  units:
  - 32022R2065#point_003_a
  - 32022R2065#point_003_c
  - 32022R2065#point_003_d
  - 32022R2065#point_003_e
  - 32022R2065#point_003_f
  - 32022R2065#point_003_g_i
  - 32022R2065#point_003_g_ii
  - 32022R2065#point_003_g_iii
  - 32022R2065#point_003_h
  - 32022R2065#point_003_k
  - 32022R2065#point_003_l
  - 32022R2065#point_003_m
  - 32022R2065#point_003_n
  - 32022R2065#point_003_o
  - 32022R2065#point_003_p
  - 32022R2065#point_003_q
  - 32022R2065#point_003_r
  - 32022R2065#point_003_s
  - 32022R2065#point_003_v
  - 32022R2065#point_003_w
  - 32022R2065#point_003_x
  - 32022R2065#art_003
  reason: Art 3 is pinned whole because the pin tool cuts one article; its lead line
    and these points define terms that no limb of this order reads.
  consequence: 'None for these answers: no limb depends on them.'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: very_large_online_platform_and_search_engine_designation
  instrument: Regulation (EU) 2022/2065 Art 33
  cites:
  - 32022R2065#art_033
  reason: Art 33 sets the thresholds and procedure by which the Commission designates
    very large online platforms and very large online search engines. The order reads
    the designation only as the attested outside fact designated_as_very_large_online_platform_or_search_engine
    (reading (10), reading (11), Q4).
  consequence: A designation reaches the order as a statement of the outside fact.
- what: internal_complaint_handling_system
  instrument: Regulation (EU) 2022/2065 Art 20
  cites:
  - 32022R2065#art_020
  reason: Art 20 obliges providers of online platforms to provide an internal complaint-handling
    system. Whether the provider has an internal complaint handling system is the
    caller's crisp finding provider_has_internal_complaint_handling_system (reading
    (6), Q2); what Art 20 requires of the system is not read.
  consequence: The answers never say whether a complaint handling system meets Art
    20.
- what: rest_of_section_1
  instrument: Regulation (EU) 2022/2065 Arts 11, 12, 13 and 15
  cites:
  - 32022R2065#art_011
  - 32022R2065#art_012
  - 32022R2065#art_013
  - 32022R2065#art_015
  reason: The other articles of Section 1 of Chapter III (points of contact, legal
    representatives, transparency reporting) are not read by this order.
  consequence: The answers never say what Arts 11, 12, 13 and 15 require.
- what: protection_of_minors_on_online_platforms
  instrument: Regulation (EU) 2022/2065 Art 28
  cites:
  - 32022R2065#art_028
  reason: Art 28 protects minors on online platforms. It is not read here; it is the
    subject of the separate order dsa-art-28-minors-order (Q18).
  consequence: The answers say nothing about Art 28.
- what: date_of_application
  instrument: Regulation (EU) 2022/2065 Art 93
  cites:
  - 32022R2065#parag_093.002
  reason: Art 93(2) says the Regulation applies from 17 February 2024. The order has
    no date key and takes the profile to describe the terms and conditions and conduct
    on or after that date (reading (12), Q10).
  consequence: The caller does not use the order for conduct before 17 February 2024.
- what: charter_of_fundamental_rights
  instrument: Charter of Fundamental Rights of the European Union
  cites:
  - 12016P#art_11
  reason: Art 14(4) asks for due regard to the fundamental rights of the recipients
    'as enshrined in the Charter', naming freedom of expression and freedom and pluralism
    of the media. The Charter is not pinned; its application is in the caller's judgement
    restriction_applied_with_due_regard_to_rights_and_legitimate_interests_of_parties
    (reading (9), Q6).
  consequence: The caller applies the Charter in judging the regard to rights.
- what: supervision_and_enforcement
  instrument: Regulation (EU) 2022/2065 Chapter IV (Arts 49 to 88)
  cites:
  - 32022R2065#art_049
  - 32022R2065#art_051
  - 32022R2065#art_052
  reason: Digital Services Coordinators and the Commission supervise and enforce the
    Regulation; the order's answers are not their findings (reading (13), Q16).
  consequence: An answer is not a finding of an authority.
