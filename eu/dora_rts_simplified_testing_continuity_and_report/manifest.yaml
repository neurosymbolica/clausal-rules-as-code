# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: no shared backbone package is imported (only the
# kit's formalize_lib and library(reif)).
uses: []

scope: >-
  For ONE financial entity referred to in Article 16(1), first subparagraph, of
  Regulation (EU) 2022/2554 (DORA) -- the gate, stated by the caller -- which of
  the duties of the simplified ICT risk management framework in Title III,
  Articles 36 to 41, of Commission Delegated Regulation (EU) 2024/1774 (ICT
  security testing; ICT systems acquisition, development and maintenance; ICT
  project and change management; the components of the ICT business continuity
  plans; the testing of those plans; the format and content of the report on the
  review of the framework, owed only on the competent authority's request, DORA
  Art 16(2), third sentence) apply to it, whether it has performed all of them,
  and which are outstanding. Each duty is the caller's judgement true, false or
  unsure; an unsure judgement that decides is referred for legal review. Out of
  scope: whether the entity is within DORA or is an Article 16(1) entity (DORA
  order on scope and on proportionality), Articles 28 to 35 of the RTS (sibling
  order on the simplified framework's policies and controls), Article 16(1),
  second subparagraph, and the first two sentences of Article 16(2) of DORA,
  Title II of the RTS, and any date.

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), Article 16(1), first subparagraph, and Article 16(2), third sentence; original OJ text as published"
  - "Commission Delegated Regulation (EU) 2024/1774 specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework (CELEX 32024R1774), Title III, Articles 36, 37, 38, 39, 40 and 41; original OJ text as published"

