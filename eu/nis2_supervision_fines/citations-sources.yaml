  status: verified
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  retrieved: 2026-11-16
  note: >-
    Unit 32022L2555#parag_034.005; important entities. Fixed floor EUR 7 000 000 and
    turnover share 1,4 % (14/1000), whichever is higher; floors of the national maximum;
    Article 21 or 23 infringements only.
