  note: >-
    Essential entities infringing Article 21 or 23: the national MAXIMUM fine
    must be at least EUR 10 000 000 or 2 % of the total worldwide annual
    turnover of the undertaking, whichever is higher. A floor of the national
    maximum, not a Union ceiling and not a fine (reading 1).
