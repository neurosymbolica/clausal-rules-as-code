  status: verified
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  retrieved: 2026-11-16
  note: >-
    Unit 32022L2555#parag_035.001; duty to inform the GDPR Art 55 or 56 supervisory
