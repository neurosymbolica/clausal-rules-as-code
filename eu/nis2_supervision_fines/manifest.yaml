  # -- kernel.clausal --
  # -- citations.clausal --
  - "citation/2"
  # -- nis2_supervision_fines.clausal --
  - "fine_ceiling_floor/3"
  - "minimum_powers/2"
  - "escalation_powers_exercisable/3"
  - "fine_barred_by_gdpr_fine/3"
  - "data_protection_authority_information/2"
  - "exercisable/0"
  - "fine_barred/0"
  - "fine_not_barred/0"
  - "no_union_minimum/0"
  - "fixed_amount/0"
  - "turnover_percentage/0"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "open_textured/2"
  - "inputs_relied_on/1"
  - "provenance/2"
  - "input_problems/1"
  - "unknown_key/1"
  - "wrong_type/1"
  - "duplicate_key/1"
  - "minimum_national_maximum/2"
  - "power/3"
  - "not_exercisable/1"
  - "inform_gdpr_supervisory_authorities/1"
  - "inform_supervisory_authority_in_own_member_state/1"
  - "decide_nis2_supervision_fines/2"
  - "nis2_supervision_fines_status/2"
  - "nis2_supervision_fines_checklist/2"
  - "nis2_supervision_fines_decision_resolvable/1"
  - "nis2_supervision_fines_status_values/1"
  # -- queries.clausal --
  - "nis2_supervision_fines_profile_keys/1"
  - "nis2_supervision_fines_input_problems/2"
  - "nis2_supervision_fines_what_if/4"
  - "entity_class/0"
  - "infringed_provision/0"
  - "worldwide_annual_turnover_eur/0"
