  - "kernel"
  - "citations"
  - "parameters"
  - "nis2_supervision_fines"
  - "queries"
  - "fixtures"
# public_interface: name/arity PREDICATES only, grouped per submodule -- keep in
# sync with the :- module(...) export lists re-exported via the package facade
# __init__.clausal. The arity-0 entries are the result atoms and root_exports
# atoms the scorer reads as package-root attributes.
