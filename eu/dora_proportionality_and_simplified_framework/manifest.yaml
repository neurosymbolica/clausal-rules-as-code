id: eu/dora_proportionality_and_simplified_framework
shape_family: deontic
kit_version: "0.1.0"
# The domain's .clausal file set, in import-DAG order (determination slices
# over a shared kernel). SINGLE SOURCE OF TRUTH for the module list: the
# scaffold writes it, and auto/pkginit.py (package facade), auto/phases.py
# (per-phase file lists) and auto/gates.py (atom hints) all read it from
# here. Keep it exact -- a module you drop from this list stops being
# re-exported by the generated package facade (__init__.clausal).
modules:
  - kernel
  - citations
  - parameters
  - dora_proportionality_and_simplified_framework
  - queries
  - fixtures
# public_interface: name/arity PREDICATES only (atoms need no export), grouped
# per submodule -- keep in sync with the :- module(...) export lists re-exported
# via the package facade __init__.clausal.
public_interface:
  # -- kernel.clausal --
  # -- citations.clausal --
  - citation/2
  # -- dora_proportionality_and_simplified_framework.clausal --
  - simplified_framework_qualification/3
  - simplified_framework_duties_required/3
  - simplified_framework_duties_complete/3
  - simplified_framework_duties_outstanding/3
  - article_16_1_entity/0
  - not_article_16_1_entity/0
  - out_of_scope/0
  - not_a_financial_entity/0
  - complete/0
  - incomplete/0
  - none_outstanding/0
  - required/1
  - outstanding/1
  - indeterminate/1
  - needs_legal_review/2
  - open_textured/2
  - inputs_relied_on/1
  - provenance/2
  - input_problems/1
  - unknown_key/1
  - wrong_type/1
  - duplicate_key/1
  - decide_dora_proportionality_and_simplified_framework/2
  - dora_proportionality_and_simplified_framework_status/2
  - dora_proportionality_and_simplified_framework_checklist/2
  - dora_proportionality_and_simplified_framework_decision_resolvable/1
  - dora_proportionality_and_simplified_framework_status_values/1
  # -- queries.clausal --
  - dora_proportionality_and_simplified_framework_profile_keys/1
  - dora_proportionality_and_simplified_framework_input_problems/2
  - dora_proportionality_and_simplified_framework_what_if/4
  # -- fixtures.clausal --
  - dora_proportionality_and_simplified_framework_subject/1
  - dora_proportionality_and_simplified_framework_profile_for/2
  - dora_proportionality_and_simplified_framework_assess/2

# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only the kit's formalize_lib, which is
# not a backbone package.
uses: []

scope: >-
  Regulation (EU) 2022/2554 (Digital Operational Resilience Act, DORA), pinned
  original OJ text 32022R2554 (OJ L 333, 27.12.2022, p. 1). For ONE entity of
  ONE entity type this order decides: whether the entity is one of those
  referred to in Article 16(1), first subparagraph, to which Articles 5 to 15
  do not apply (simplified_framework_qualification/3, reading Art 2(1)(u),
  Art 2(2), Art 2(3)(c), Art 2(4), first sentence, and Article 3, points (32),
  (34), (36), (39) and (53)); which duties of the simplified ICT risk
  management framework of Art 16(1), second subparagraph, points (a) to (h)
  (point (h) as two duties), and Art 16(2) apply to it
  (simplified_framework_duties_required/3); whether it has performed all of
  them (simplified_framework_duties_complete/3, the compliance check); and
  which of them are outstanding (simplified_framework_duties_outstanding/3).
  The principle of proportionality of Art 4(1) is read inside the caller's
  judgement of each duty and removes no duty. This order gives the rule for
  the gate key financial_entity_is_article_16_1_entity of the other DORA
  orders. Out of scope: Articles 5 to 15 (their own orders), Art 4(2) and (3),
  Art 16(3) and the regulatory technical standards on the simplified
  framework (Commission Delegated Regulation (EU) 2024/1774), the conditions
  of Article 12(1) of Regulation (EU) 2019/2033, and the date of application;
  scope of the Regulation is presupposed except where a key read for
  Article 16(1) settles it. A duty the caller cannot judge (unsure) is handed
  to a lawyer as needs_legal_review; the readings are the drafter's, not a
  lawyer's.

sources:
  - >-
    Regulation (EU) 2022/2554 of the European Parliament and of the Council of
    14 December 2022 on digital operational resilience for the financial
    sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, original OJ
    text): Article 16(1), first and second subparagraphs, points (a) to (h);
    Article 16(2); Article 4(1).
  - >-
    Regulation (EU) 2022/2554 (DORA), OJ L 333, 27.12.2022, p. 1: Article 2(1),
    lead words and point (u); Article 2(2); Article 2(3)(c); Article 2(4),
    first sentence; Article 3, points (32), (34), (36), (39) and (53).

query_interface:
  2: simplified_framework_qualification/3        # eligibility: Article 16(1) entity or not, cited
  7: dora_proportionality_and_simplified_framework_checklist/2    # justification: cited checklist per duty
  13: simplified_framework_duties_complete/3     # compliance_check: complete | incomplete
  16: dora_proportionality_and_simplified_framework_what_if/4     # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_002
  - 32022R2554#art_003
  - 32022R2554#art_004
  - 32022R2554#art_016
  reason: The headings of Articles 2, 4 and 16, and the heading and lead words of
    Article 3 ('For the purposes of this Regulation, the following definitions shall
    apply'), carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: member_state_notice_and_publication
  units:
  - 32022R2554#parag_002.004
  partial: true
  reason: 'Art 2(4) is PARTLY FORMALISED. Its first sentence (a Member State may exclude
    the institutions of Article 2(5), points (4) to (23), of Directive 2013/36/EU)
    is read through the key exempted_from_dora_scope_by_member_state (reading (6)).
    Not formalised: its second and third sentences, by which the Member State informs
    the Commission and the Commission publishes the information.'
  consequence: No answer depends on whether the Commission was informed or the information
    published.
  declaration: answered_with_caveat
  debt: true
  open: formalisable but institutional; the deferral stands for this order (open question
    (Q3)).
- what: scope_rules_formalised_in_the_scope_order
