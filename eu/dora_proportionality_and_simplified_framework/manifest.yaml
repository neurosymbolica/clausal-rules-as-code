  - 32022R2554#parag_004.003
  reason: Art 4(2) applies the principle of proportionality to Chapters III, IV and
    V, Section I, which this order does not formalise; Art 4(3) binds the competent
    authorities when they review the framework on the reports of Article 6(5) and
    Article 16(2) (reading (15)).
  consequence: No answer of this order depends on them (open question (Q14)).
  declaration: answered_with_caveat
  debt: true
  instrument: Regulation (EU) 2022/2554 Article 4(2) and (3)
  open: Art 4(2) is read inside the judgements of the orders on Chapters III, IV and
    V, Section I; Art 4(3) gives the entity no duty; the deferral stands for this
    order.
