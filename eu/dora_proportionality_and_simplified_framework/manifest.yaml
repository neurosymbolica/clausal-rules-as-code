excluded_set:
- what: referenced_classification_rules
  instrument: Regulation (EU) 2019/2033 Article 12(1); Directive (EU) 2015/2366 Article
    32(1); Directive 2009/110/EC Article 9(1); Directive 2013/36/EU Article 2(5)
  cites:
  - 32019R2033#art_012
  - 32015L2366#art_032
  - 32009L0110#art_009
  - 32013L0036#art_002
  reason: Not pinned. The definitions of Article 3, points (32), (34), (36) and (39),
    point to these provisions; whether an entity meets them is the caller's classification,
    stated in the entity type and in investment_firm_is_small_and_non_interconnected
    (readings (3), (4)).
  consequence: The order does not check those conditions (open question (Q5)).
- what: ict_risk_management_articles
  instrument: Regulation (EU) 2022/2554 Articles 5 to 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain. Articles 5 to 15 do not apply to the entities
    of Article 16(1); for other financial entities they are formalised, or to be formalised,
    in their own orders (readings (2), (12)).
  consequence: not_article_16_1_entity says only that Article 16 does not apply; it
    gives none of the duties of Articles 5 to 15 (open question (Q8)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order answers on the Regulation as it applies and reads no date (reading (19)).
  consequence: No answer depends on a date (open question (Q18)).
- what: simplified_framework_technical_standards
  instrument: Commission Delegated Regulation (EU) 2024/1774, Title III (the simplified
    ICT risk management framework)
  cites:
  - 32024R1774#art_028
  reason: Not pinned in this domain. It specifies the simplified ICT risk management
    framework of Article 16 in detail; the order reads it as part of the caller's
    judgement (reading (16)).
  consequence: The order does not check the detail of the technical standards (open
    question (Q15)).
