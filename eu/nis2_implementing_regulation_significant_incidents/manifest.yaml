uses: []

scope: "Whether ONE incident of ONE relevant entity of Commission Implementing
  Regulation (EU) 2024/2690 (DNS service providers, TLD name registries, cloud
  computing, data centre, content delivery network, managed and managed security
  service providers, providers of online marketplaces, online search engines and
  social networking services platforms, trust service providers) is a significant
  incident for the purposes of Article 23(3) of Directive (EU) 2022/2555: Art 3(1)
  points (a) to (g) as alternative criteria (the money test, the four judgements,
  recurring incidents under Art 4, and the entity-type criteria of Arts 5 to 14),
  with Art 3(2) taking scheduled interruptions and planned maintenance consequences
  out of every criterion. Results: significant, not_significant, or a status
  (indeterminate naming one missing key, needs_legal_review for a decisive unsure
  judgement, input_problems). Out of scope: whether the event is an incident and
  the entity a relevant entity (Directive (EU) 2022/2555 Art 6), the trade-secret
  definition (Directive (EU) 2016/943 Art 2), the reporting steps (Directive (EU)
  2022/2555 Art 23), the security measures of Art 2 and the Annex, and the user
  counting method of Art 3(3), which the caller applies."

sources:
  - "Commission Implementing Regulation (EU) 2024/2690 of 17 October 2024 laying down
    rules for the application of Directive (EU) 2022/2555 as regards technical and
    methodological requirements of cybersecurity risk-management measures and further
    specification of the cases in which an incident is considered to be significant
    (OJ L, 2024/2690, 18.10.2024; CELEX 32024R2690, original act, source sha256
    1d10f42c31a2b3c6b929b4696a04093ee1d84a298c0c0437a22f8718a9ffb3cd), Art 1,
    Art 3(1) and (2), Art 4 and Arts 5 to 14."

query_interface:
  2: "significant_incident_criteria/3"      # eligibility: significant | not_significant | status, cited checklist via nis2_implementing_regulation_significant_incidents_checklist/2
  16: "nis2_implementing_regulation_significant_incidents_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: subject_matter
  units:
  - 32024R2690#art_001
  reason: Art 1 states the subject matter and lists the relevant entities; it sets
    no criterion. The order reads its list only for the eleven atoms of the entity-type
    key (reading (2)).
  consequence: 'None for a caller beyond reading (2): the article carries no rule
    of its own.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: technical_and_methodological_requirements
  units:
  - 32024R2690#art_002
  - 32024R2690#parag_002.001
  - 32024R2690#parag_002.002
  reason: Art 2 points to the Annex for the technical and methodological requirements
    of the cybersecurity risk-management measures of Directive (EU) 2022/2555 Art
    21(2), requires a level of security appropriate to the risks, and requires the
    entity to document why it considers a requirement 'where appropriate', 'where
    applicable' or 'to the extent feasible' not appropriate, not applicable or not
    feasible. It does not bear on whether an incident is significant.
  consequence: The answers never say which security measures an entity must take or
    document.
  declaration: answered_with_caveat
  debt: true
  instrument: Implementing Regulation (EU) 2024/2690 Art 2 and Annex
  open: formalisable in part (the documentation duty); a later order with the Annex.
- what: article_heading
  units:
  - 32024R2690#art_003
  reason: 'The title of Article 3 carries no rule: document structure. Deferred so
    every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the title carries no rule.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: counting_users_impacted
  units:
  - 32024R2690#parag_003.003
  - 32024R2690#point_003.003_a
  - 32024R2690#point_003.003_b
  reason: Art 3(3) tells the entity what to consider when it calculates the number
    of users impacted for Arts 7 and 9 to 14 (customers with a contract granting access;
    persons associated with business customers). The order takes the counts as the
    caller's, made that way (reading (9)).
  consequence: The user figures are the caller's; an answer is only as good as the
    count.
  declaration: answered_with_caveat
  debt: true
  instrument: Implementing Regulation (EU) 2024/2690 Art 3(3)
  open: 'not formalisable as a yes/no: it is a counting method; the caller applies
    it.'

excluded_set:
- what: definitions_of_incident_and_entities
  instrument: Directive (EU) 2022/2555 Art 6
  cites:
  - 32022L2555#art_006
  reason: Directive (EU) 2022/2555 Art 6 defines incident and the entity types named
    in Art 1 of the Regulation; not pinned in this domain. The order takes it as given
    that an incident occurred and which relevant entity the caller is (reading (2)).
  consequence: The caller first checks that the event is an incident and the entity
    a relevant entity, and names its type.
- what: trade_secret_definition
  instrument: Directive (EU) 2016/943 Art 2
  cites:
  - 32016L0943#art_002
  reason: Art 3(1)(b) refers to trade secrets 'as set out in Article 2 point (1),
    of Directive (EU) 2016/943'; not pinned here. The judgement key of reading (5)
    carries it.
  consequence: The caller applies that definition inside its judgement.
- what: reporting_duties
  instrument: Directive (EU) 2022/2555 Art 23
  cites:
  - 32022L2555#art_023
  reason: Art 23 of the Directive sets the reporting steps for a significant incident;
    the Regulation only says when an incident is significant for these entities. The
    steps and their limits are not read here.
  consequence: A significant answer does not say what to report or when.
