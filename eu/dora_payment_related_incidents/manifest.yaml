  reason: 'Art 18(1) and (2) set the criteria by which financial entities classify
    ICT-related incidents and cyber threats. This order does not classify: whether
    the incident is major is the caller''s judgement payment_related_incident_is_major
    (reading (4)).'
  consequence: The answers take the classification as given.
  declaration: answered_with_caveat
  debt: true
  open: the classification is the caller's; the deferral stands for this order (open
    question (Q6)).
- what: materiality_thresholds_and_mandate_of_article_18_3_a
  units:
  - 32022R2554#point_018.003_a
  partial: true
  reason: 'PARTLY FORMALISED. Art 18(3), point (a), is read for its words that major
    operational or security payment-related incidents are ''subject to the reporting
    obligation laid down in Article 19(1)'' (reading (5)). Not formalised: the criteria
    and materiality thresholds the regulatory technical standards are to specify.'
  consequence: The order computes no threshold; payment_related_incident_is_major
    carries the result.
  declaration: answered_with_caveat
  debt: true
  open: the thresholds are in technical standards not pinned here; the deferral stands
    for this order (open question (Q6)).
- what: mandates_and_authority_side_rules
