  - 32022R2554#point_019.006_e
  - 32022R2554#parag_019.007
  - 32022R2554#parag_019.008
  reason: The lead words of Art 18(3), its points (b) and (c), and Art 18(4) give
    the ESAs the mandate for regulatory technical standards; Art 19(6) to (8) say
    what the competent authority, the ESAs and the ECB do with a report. None is a
    rule on the entity's facts (readings (4), (7)).
  consequence: The answers say nothing of what the authorities do.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: authority_templates_and_content_words_of_article_19_1
  units:
  - 32022R2554#parag_019.001
  partial: true
  reason: 'PARTLY FORMALISED. Art 19(1) is read for the reporting obligation (reading
    (5)) and for the recipients of its first, third and sixth subparagraphs (reading
    (6)). Not formalised: the single competent authority a Member State designates
    where several supervise, the transmission to the ECB by the national competent
    authority, the templates, the alternative means, and the fifth subparagraph on
    the information the reports must include (reading (7)).'
  consequence: payment_related_incident_report_recipients names the recipients; it
    does not say what a report contains or which single authority is designated.
  declaration: answered_with_caveat
  debt: true
  open: the content of the reports and the templates are not pinned here; the deferral
    stands for this order (open question (Q8)).
- what: reports_time_limits_and_client_information
  units:
  - 32022R2554#parag_019.003
  - 32022R2554#parag_019.004
  - 32022R2554#point_019.004_a
  - 32022R2554#point_019.004_b
  - 32022R2554#point_019.004_c
  reason: Art 19(3) and (4) (the information of clients, and the initial notification,
    intermediate report and final report) are answered for a major ICT-related incident
    by the order dora-incident-reporting; this order does not repeat them (reading
    (5)).
  consequence: A caller with the answer chapter_requirements_and_article_19_reporting_apply
    asks that order's queries about the incident.
  declaration: answered_with_caveat
  not_formalized_because: in_sibling
  decided_in: dora-incident-reporting
- what: voluntary_notification_and_outsourcing
  units:
  - 32022R2554#parag_019.002
  - 32022R2554#parag_019.005
  reason: Art 19(2) lets financial entities notify significant cyber threats on a
    voluntary basis; Art 19(5) lets them outsource the reporting and keeps them fully
    responsible. Neither changes an answer of this order (reading (7)).
  consequence: None for these answers.
  declaration: answered_with_caveat
  debt: true
  open: a possibility rule and a responsibility rule with no effect on the answers;
    the deferral stands for this order.

excluded_set:
- what: payment_services_directive
  instrument: Directive (EU) 2015/2366 (payment services in the internal market)
  cites:
  - 32015L2366#art_096
  reason: Not pinned in this domain. Whether and how Directive (EU) 2015/2366 still
    applies to an incident Article 23 reaches is not decided here; this order relies
    on no word of that Directive.
  consequence: The answers say only what DORA requires (open question (Q5)).
