# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. This domain imports only kit modules (formalize_lib) and
# library(reif), none of which is a shared backbone package.
uses: []

scope: >-
  Article 23 of Regulation (EU) 2022/2554 (DORA), read with Article 2(1), points
  (a) to (d), Article 3, points (9), (11), (32) and (35) to (39), Article 18(3),
  point (a), and Article 19(1), first, third and sixth subparagraphs. For one
  incident of one financial entity it decides (1) payment_related_incident_status:
  whether Article 23 reaches the entity, whether the incident is an operational or
  security payment-related incident, and whether it is a major one subject to the
  reporting obligation of Article 19(1); and (2)
  payment_related_incident_report_recipients: for a major incident, to whom the
  entity reports (the relevant competent authority, or the national competent
  authority designated under Directive 2013/36/EU for a significant credit
  institution, and the Directive (EU) 2022/2555 authorities or CSIRTs where the
  Member State has so determined). Whether the incident is payment-related and
  whether it is major are the caller's judgements; unsure is referred to a lawyer
  as open_textured. Out of scope: the reports, time limits and client information
  (sibling order dora-incident-reporting), the content of reports, what the
  authorities do with them, the classification criteria and thresholds, the scope
  of the Regulation (presupposed), and Directive (EU) 2015/2366 (excluded).

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), Article 23"
  - "Regulation (EU) 2022/2554, Article 2(1), points (a) to (d) (entity terms; points (e) to (u) read only as values Article 23 does not reach)"
  - "Regulation (EU) 2022/2554, Article 3, points (9) and (11) (operational or security payment-related incident; major one) and points (32) and (35) to (39) (entity definitions)"
  - "Regulation (EU) 2022/2554, Article 18(3), point (a) (major payment-related incidents subject to the reporting obligation of Article 19(1))"
  - "Regulation (EU) 2022/2554, Article 19(1), first, third and sixth subparagraphs (recipients of the reports)"

query_interface:
  2: "decide_dora_payment_related_incidents/2"      # eligibility: the status verdict with its citations
  7: "dora_payment_related_incidents_checklist/2"   # justification: checklist items each carrying cite(...)
  16: "dora_payment_related_incidents_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_002
  - 32022R2554#art_003
  - 32022R2554#art_018
  - 32022R2554#art_019
  reason: The headings of Articles 2, 18 and 19, and the heading of Article 3 with
    the words introducing the definitions, carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: entity_terms_of_article_2_1
  units:
  - 32022R2554#parag_002.001
  - 32022R2554#point_002.001_a
  - 32022R2554#point_002.001_b
  - 32022R2554#point_002.001_c
  - 32022R2554#point_002.001_d
  reason: Art 2(1), lead words and points (a) to (d), are quoted and relied on for
    the reach of Article 23 (reading (2)); they set the scope of the Regulation, which
    this order does not formalise.
  consequence: The order reads them only to fix which values of dora_entity_type Article
    23 reaches; it does not say whether an entity is within the scope of the Regulation.
  declaration: answered_with_caveat
  debt: true
  open: the scope of the Regulation is presupposed; the deferral stands for this order
    (open question (Q4)).
- what: other_entity_types_of_article_2_1
  units:
  - 32022R2554#point_002.001_e
  - 32022R2554#point_002.001_f
  - 32022R2554#point_002.001_g
  - 32022R2554#point_002.001_h
  - 32022R2554#point_002.001_i
