  - 32022R2554#point_002.001_o
  - 32022R2554#point_002.001_p
  - 32022R2554#point_002.001_q
  - 32022R2554#point_002.001_r
  - 32022R2554#point_002.001_s
  - 32022R2554#point_002.001_t
  - 32022R2554#point_002.001_u
  reason: Art 2(1), points (e) to (u), name kinds of entity that Article 23 does not
    name. They are read only as values of dora_entity_type that give not_an_article_23_entity
    (reading (2)).
  consequence: None for a caller beyond that answer.
  declaration: not_an_exception
  not_formalized_because: structural
- what: scope_limits_of_article_2
  units:
  - 32022R2554#parag_002.002
  - 32022R2554#parag_002.003
  - 32022R2554#point_002.003_a
  - 32022R2554#point_002.003_b
  - 32022R2554#point_002.003_c
  - 32022R2554#point_002.003_d
  - 32022R2554#point_002.003_e
  - 32022R2554#point_002.003_f
  - 32022R2554#parag_002.004
  reason: Art 2(2) to (4) (financial entities collectively, the entities to which
    the Regulation does not apply, and the Member State option to exclude) decide
    the scope of the Regulation, which this order presupposes (reading (8)).
  consequence: An entity outside the scope of the Regulation gets the same answers
    as one inside it.
  declaration: answered_with_caveat
  debt: true
  open: the scope of the Regulation is presupposed; the deferral stands for this order
    (open question (Q4)).
- what: entity_definitions_read
  units:
  - 32022R2554#point_003_32
  - 32022R2554#point_003_35
  - 32022R2554#point_003_36
  - 32022R2554#point_003_37
  - 32022R2554#point_003_38
  - 32022R2554#point_003_39
  reason: Art 3, points (32) and (35) to (39), are quoted and relied on for the reach
    of Article 23 (reading (2)). Each defines its term by reference to another Union
    act, which is not pinned here; whether an entity meets the definition is the caller's
    classification, stated in dora_entity_type.
  consequence: The order takes the kind of entity as given; it does not test the definition
    in the act referred to.
  declaration: answered_with_caveat
  debt: true
  open: each definition needs its Union act pinned; the deferral stands for this order
    (open question (Q1)).
