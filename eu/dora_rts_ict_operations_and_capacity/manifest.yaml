  consequence: The order does not check the simplified framework (open question (Q2)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64 and Commission Delegated Regulation
    (EU) 2024/1774 Article 42
  cites:
  - 32022R2554#art_064
  - 32024R1774#art_042
  reason: Not pinned in this domain. The order answers on the RTS and DORA as they
    apply and reads no date (reading (14)).
  consequence: No answer depends on a date (open question (Q14)).
