    (12), (13)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q12)).
- what: simplified_framework_of_the_rts
  instrument: Commission Delegated Regulation (EU) 2024/1774 Articles 28 to 41 (Title
