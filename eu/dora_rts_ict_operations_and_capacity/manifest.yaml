independence: no_external_scorer

# Shared backbone packages this domain imports: none (kit modules only).
uses: []

scope: >-
  For ONE financial entity presupposed to be within the scope of DORA, which of
  the duties on ICT operations (Article 8(1) and 8(2), with its second
  subparagraph) and on capacity and performance management (Article 9(1) and
  9(2)) of Commission Delegated Regulation (EU) 2024/1774 apply to it, whether it
  has performed all of them, and which are outstanding, each duty judged by the
  caller (true, false or unsure; unsure is referred to a lawyer as open_textured).
  The rule of DORA Article 16(1), first subparagraph, is the gate of every query:
  an entity it lists answers simplified_framework_entity. Out of scope: who those
  entities are and the simplified framework (DORA Art 16(1) second subparagraph,
  16(2), 16(3), RTS Title III), the other articles of the RTS, DORA Articles 2 to
  15, proportionality as a relief, and dates of application.

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 (RTS on ICT risk management tools, methods, processes and policies and on the simplified ICT risk management framework), OJ original text 32024R1774, Articles 8(1), 8(2) with points (a) to (c) and its second subparagraph, 9(1) with points (a) to (c), and 9(2)"
  - "Regulation (EU) 2022/2554 (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, p. 1, original text 32022R2554, Article 16(1), first subparagraph"

query_interface:
  13: "rts_ict_operations_and_capacity_duties_complete/3"   # compliance_check: are the duties performed
  2: "dora_rts_ict_operations_and_capacity_status/2"        # eligibility/status verdict
  7: "dora_rts_ict_operations_and_capacity_checklist/2"     # justification: checklist with cite(...) per item
  16: "dora_rts_ict_operations_and_capacity_what_if/4"      # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_008
  - 32024R1774#art_009
  - 32022R2554#art_016
  reason: The headings of Articles 8 and 9 of the RTS and of Article 16 of DORA carry
    no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 of DORA do not apply
    to the entities it lists), is formalised as the gate of every query (reading (2)).
    Not formalised: who those entities are, which the caller states, and the lead
    words of the second subparagraph, which introduce the duties of the simplified
    ICT risk management framework; those are the subject of the order on proportionality
    and the simplified framework and of the order on Title III of the RTS.'
  consequence: simplified_framework_entity says only that Articles 8 and 9 of the
    RTS do not apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (reading (13)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)). The order on scope and entity
    types formalises Article 2.
  consequence: The answers presuppose a financial entity within scope (open question
    (Q3)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4 and Commission Delegated Regulation
    (EU) 2024/1774 Article 1
  cites:
  - 32022R2554#art_004
  - 32024R1774#art_001
  reason: Not pinned in this domain. The principle of proportionality and the overall
    risk profile and complexity of RTS Article 1 are read as removing no duty (reading
    (15)).
  consequence: No duty is removed for size (open question (Q15)).
- what: ict_risk_management_articles_of_dora
  instrument: Regulation (EU) 2022/2554 Articles 5 to 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain except as the gate. Articles 5 to 15 of DORA,
    among them Article 9(2) whose policies Articles 8 and 9 of the RTS further specify
    (reading (5)), are formalised, or to be formalised, in their own orders (reading
    (13)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q11)).
- what: other_articles_of_the_rts
  instrument: Commission Delegated Regulation (EU) 2024/1774 Articles 2 to 7 and 10
    to 27
  cites:
