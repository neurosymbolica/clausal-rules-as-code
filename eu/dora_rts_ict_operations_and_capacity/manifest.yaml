  - 32024R1774#art_021
  - 32024R1774#art_022
  - 32024R1774#art_023
  - 32024R1774#art_024
  - 32024R1774#art_025
  - 32024R1774#art_026
  - 32024R1774#art_027
  reason: Not pinned in this domain. The other articles of Title II of the RTS, among
