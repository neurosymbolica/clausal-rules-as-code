  cites:
  - 32024R1774#art_028
  - 32024R1774#art_029
  - 32024R1774#art_030
  - 32024R1774#art_031
  - 32024R1774#art_032
  - 32024R1774#art_033
  - 32024R1774#art_034
  - 32024R1774#art_035
  - 32024R1774#art_036
  - 32024R1774#art_037
  - 32024R1774#art_038
  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. Title III of the RTS sets out the simplified
    ICT risk management framework of the entities of DORA Article 16(1), for which
    every query answers simplified_framework_entity (reading (2)); it is formalised
