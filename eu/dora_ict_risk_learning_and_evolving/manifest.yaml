uses: []

scope: "Regulation (EU) 2022/2554 (DORA), Article 13 (learning and evolving), paragraphs (1) to (7) with points (a) to (d) of Article 13(2), gated by the rule of Article 16(1), first subparagraph, that Articles 5 to 15 do not apply to the entities it lists. For ONE financial entity, presupposed to be within the scope of the Regulation, the order decides which of the twenty Article 13 duties apply to it (ict_risk_learning_and_evolving_duties_required), whether it has performed all of them (ict_risk_learning_and_evolving_duties_complete) and which are outstanding (ict_risk_learning_and_evolving_duties_outstanding). Every duty is a caller judgement (true, false or unsure); an unsure judgement that decides is handed to a lawyer as needs_legal_review. Out of scope: entity scope and types (Articles 2 and 3), who the Article 16(1) entities are and their simplified framework (Article 16(1) second subparagraph, (2) and (3): deferred), Articles 5 to 12, 14 and 15, incident classification and reporting (Articles 17 to 20), testing (Articles 26 and 27), contractual provisions (Article 30), proportionality (Article 4), the date of application (Article 64) and the regulatory technical standards on ICT risk management."

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, original OJ text): Article 13(1) to (7), with Article 13(2) points (a) to (d)"
  - "Regulation (EU) 2022/2554 (DORA), OJ L 333, 27.12.2022, p. 1: Article 16(1), first subparagraph (the gate; the second subparagraph, (2) and (3) are deferred)"

query_interface:
  2: "dora_ict_risk_learning_and_evolving_status/2"            # eligibility: complete / incomplete / indeterminate
  7: "dora_ict_risk_learning_and_evolving_checklist/2"         # justification: one cited item per duty
  13: "dora_ict_risk_learning_and_evolving_compliance_check/3" # compliance check of one duty
  16: "dora_ict_risk_learning_and_evolving_what_if/4"          # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_013
  - 32022R2554#art_016
  reason: The headings of Articles 13 and 16 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the entities
    it lists), is formalised as the gate of every query (reading (2)). Not formalised:
    who those entities are, which the caller states, and the lead words of the second
    subparagraph, which introduce the duties of the simplified ICT risk management
    framework; those are the subject of the order on proportionality and the simplified
    framework.'
  consequence: simplified_framework_entity says only that Article 13 does not apply;
    it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: Art 16(1), second subparagraph, points (a) to (h), list the duties of the
    simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (reading (14)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of the Regulation is presupposed (reading (1)); whether it is a microenterprise
    (Article 3(60)) is the caller's statement (reading (4)). The order on scope and
    entity types formalises Article 2.
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (16)).
  consequence: No duty is removed for size beyond the text's own exceptions (open
    question (Q17)).
- what: other_ict_risk_management_articles
  instrument: Regulation (EU) 2022/2554 Articles 5 to 12, 14 and 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain. Articles 5 to 8 (governance; the framework of
    Article 6(1), named in Art 13(3); the strategy of Article 6(8), named in Art 13(4)),
    9 and 10 (protection and detection), 11 and 12 (the business continuity policy
    named in Art 13(2), the plans named in Art 13(3), backup), 14 (communication)
    and 15 (harmonisation) are formalised, or to be formalised, in their own orders
    (reading (14)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q15)).
- what: incident_management_classification_and_reporting
  instrument: Regulation (EU) 2022/2554 Articles 17 to 20
  cites:
  - 32022R2554#art_017
  - 32022R2554#art_018
  - 32022R2554#art_019
  - 32022R2554#art_020
  reason: Not pinned in this domain. Whether an ICT-related incident is major is the
    classification that the DORA order on incident reporting formalises; this order
    takes the caller's statement of it (reading (5)) and reads none of Articles 17
    to 20.
  consequence: The order does not classify or report incidents (open question (Q3)).
- what: threat_led_penetration_testing
  instrument: Regulation (EU) 2022/2554 Articles 26 and 27
  cites:
  - 32022R2554#art_026
  - 32022R2554#art_027
  reason: Not pinned in this domain. Art 13(3) names lessons from the testing carried
    out under Articles 26 and 27; the order reads only whether lessons are incorporated
    (reading (10)).
  consequence: The order does not check the testing (open question (Q9)).
- what: contractual_provisions_on_training
  instrument: Regulation (EU) 2022/2554 Article 30
  cites:
  - 32022R2554#art_030
  reason: Not pinned in this domain. Art 13(6) names Article 30(2), point (i), a contractual
    provision formalised in the DORA order on contractual provisions with ICT third-party
    service providers; it is not read here (reading (13)).
  consequence: The order does not check the contract (open question (Q12)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order answers on the Regulation as it applies and reads no date (reading (15)).
  consequence: No answer depends on a date (open question (Q16)).
