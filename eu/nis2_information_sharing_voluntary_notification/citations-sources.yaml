eu_dir_2022_2555_art_29_4:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#parag_029.004. Essential and important entities notify the
    competent authorities upon entering an arrangement, or of their withdrawal
    once it takes effect. Cited by every final answer of
    arrangement_notification_duty/3.
eu_dir_2022_2555_art_30_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#parag_030.001 (chapeau). Voluntary notifications are in
    addition to the Article 23 obligation, so a mandatory duty does not change
    the voluntary route (Q3). Marker only; never returned in a result.
eu_dir_2022_2555_art_30_1_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#point_030.001_a. Essential and important entities may
    notify incidents, cyber threats and near misses (every event kind).
eu_dir_2022_2555_art_30_1_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#point_030.001_b. Other entities, in scope or not, may
    notify significant incidents, cyber threats and near misses; a
    non-significant incident is not covered (Q2).
