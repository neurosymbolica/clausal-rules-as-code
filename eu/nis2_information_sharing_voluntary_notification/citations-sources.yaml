eu_dir_2022_2555_art_29_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#parag_029.001. Member States shall ensure that entities are
    able to exchange relevant cybersecurity information on a voluntary basis,
    where the sharing meets point (a) or point (b) (read as alternatives, Q1).
    Cited by every final answer of information_exchange_permitted/3 and by the
    referral on information_is_relevant_cybersecurity_information.
eu_dir_2022_2555_art_29_1_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#point_029.001_a. The sharing aims to prevent, detect,
    respond to or recover from incidents or to mitigate their impact. Referral
    citation for the unsure judgement on that point.
eu_dir_2022_2555_art_29_1_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#point_029.001_b. The sharing enhances the level of
    cybersecurity. Referral citation for the unsure judgement on that point.
eu_dir_2022_2555_art_29_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Unit 32022L2555#parag_029.002. The exchange is implemented through
    cybersecurity information-sharing arrangements. Referral citation for the
