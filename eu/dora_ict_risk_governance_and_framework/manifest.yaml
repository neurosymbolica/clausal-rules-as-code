# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: shared backbone domain packages this domain imports.
# It imports only kit modules (formalize_lib, library(reif)), no backbone package.
uses: []

scope: >-
  The ICT risk governance and framework duties of ONE financial entity under
  Regulation (EU) 2022/2554 (DORA): the internal governance and control framework
  and the duties of the management body (Article 5), the ICT risk management
  framework, its control function, review, internal audit, follow-up and the
  digital operational resilience strategy (Article 6(1) to (8)), the ICT systems,
  protocols and tools (Article 7) and the identification of functions, assets,
  sources of ICT risk and dependencies (Article 8), with Article 16(1), first
  subparagraph, read only for the rule that Articles 5 to 15 do not apply to the
  entities it lists. Three questions: which of the thirty-four duties apply
  (ict_risk_governance_duties_required), whether all are performed
  (ict_risk_governance_duties_complete), and which are outstanding
  (ict_risk_governance_duties_outstanding). Out of scope: whether the entity is a
  financial entity in scope and of which type (the order on DORA scope and entity
  types; the caller states the Article 16(1) and microenterprise facts), the
  options of Article 6(9) and (10), the simplified framework of Article 16, the
  proportionality principle of Article 4, Articles 9 to 15, Chapter IV testing and
  the date of application. Every open-textured judgement is the caller's; an
  unsure judgement that matters goes to a lawyer (needs_legal_review).

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, original OJ text): Article 5, Article 6(1) to (8), Article 7, Article 8(1) to (7)"
  - "Regulation (EU) 2022/2554, Article 16(1), first subparagraph (Articles 5 to 15 do not apply to the entities it lists; partly formalised)"

query_interface:
  2: "decide_dora_ict_risk_governance_and_framework/2"           # eligibility/status verdict (the complete query) with cited checklist
  7: "dora_ict_risk_governance_and_framework_checklist/2"        # justification: one item per duty, each with cite(...)
  13: "dora_ict_risk_governance_and_framework_compliance_check/3" # compliance check: omit_duty/perform_duty permitted or forbidden
  16: "dora_ict_risk_governance_and_framework_what_if/4"         # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_008
  - 32022R2554#art_016
  reason: 'The titles of Articles 5, 6, 8 and 16 carry no obligation: document structure.
    Deferred so every unit of the pinned extract is accounted for. (Article 7 has
    no heading unit of its own; its heading and lead words are formalised in duty
    27.)'
  consequence: 'None for a caller: the titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: options_of_article_6_9_and_6_10
  units:
  - 32022R2554#parag_006.009
  - 32022R2554#parag_006.010
  reason: 'Art 6(9) lets financial entities define a holistic ICT multi-vendor strategy,
    and Art 6(10) lets them outsource the verification of compliance with ICT risk
    management requirements while remaining fully responsible. Both are options: they
    impose no duty and yield no answer a query could return (reading (11)).'
  consequence: 'None: no duty is added or removed; the entity stays responsible for
    every duty of the list (open question (Q11)).'
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: simplified_framework_duties_not_formalised
  units:
  - 32022R2554#parag_016.001
  reason: 'Art 16(1) is PARTLY formalised. Its first subparagraph is read in one respect
    only: that Articles 5 to 15 do not apply to the entities it lists, which the caller
    states in the key financial_entity_is_article_16_1_entity, and the answer simplified_framework_entity
    cites it for that (reading (3)). Not formalised: which entities it lists, and
    the lead words of its second subparagraph (''Without prejudice to the first subparagraph,
    the entities listed in the first subparagraph shall:''), which introduce the duties
    of the simplified ICT risk management framework.'
  consequence: The answer simplified_framework_entity says only that the thirty-four
    duties of this order do not apply; it never lists the duties of the simplified
    framework (open question (Q1)).
  declaration: answered_with_caveat
  partial: true
  debt: true
  open: formalisable; the order on proportionality and the simplified framework is
    to formalise it, not this order; the deferral stands for this run.
- what: simplified_framework_duties_and_review
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: Art 16(1), points (a) to (h), and Art 16(2) set the duties and the review
    of the simplified ICT risk management framework of the entities of Art 16(1).
    This order answers only that Articles 5 to 8 do not apply to those entities (reading
    (3)).
  consequence: No answer of this order lists or checks a duty of the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalisable; to be formalised by the order on proportionality and the simplified
    framework, not in this order; the deferral stands for this run.
- what: simplified_framework_technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: Art 16(3) gives the European Supervisory Authorities, through the Joint
    Committee and in consultation with ENISA, a mandate to develop draft regulatory
    technical standards on the simplified framework. It binds the authorities and
    gives the entity no duty.
  consequence: None for an entity caller.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: article_7_heading_and_lead_words
  units:
  - 32022R2554#art_007
  reason: 'The unit holding the heading and lead words of Article 7 (''financial entities
    shall use and maintain updated ICT systems, protocols and tools that are:'') has
    no citation key of its own in the lexicon: the key eu_reg_2022_2554_art_7 names
    the points (a) to (d). The duty those lead words introduce is duty 27 (ict_systems_protocols_and_tools),
    formalised through the points (a) to (d) that carry its content (reading (9));
    the lead-words unit itself adds no condition.'
  consequence: 'None for a caller: duty 27 is required, checked and cited through
    Art 7, points (a) to (d), exactly as the order states.'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Article 2 and Article 3, points (60) and the
    definitions of the entity types
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of the Regulation, and of which type, is decided by the order on DORA
    scope and entity types; this order presupposes it (reading (1)). Microenterprise
    is the caller's fact (reading (4)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q9)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The proportionality principle, named in Art 7(a),
    is read inside each judgement key and removes no duty (reading (10)); it belongs
    to the order on proportionality and the simplified framework.
  consequence: No duty is removed for size or risk profile (open question (Q8)).
- what: protection_detection_response_and_learning
  instrument: Regulation (EU) 2022/2554 Articles 9 to 13
  cites:
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  reason: 'Not pinned in this domain. Protection and prevention, detection, response
    and recovery, backup, and learning and evolving are the subject of the orders
    on Articles 9 to 13: the order on ICT risk protection and detection, the order
    on ICT response and recovery, and the order on learning and evolving.'
  consequence: No answer of this order says anything about the duties of Articles
    9 to 13.
- what: communication_harmonisation_and_technical_standards
  instrument: Regulation (EU) 2022/2554 Articles 14 and 15; Commission Delegated Regulation
    (EU) 2024/1774
  cites:
  - 32022R2554#art_014
  - 32022R2554#art_015
  - 32024R1774#art_001
  reason: Not pinned in this domain. Communication, the further harmonisation of ICT
    risk management tools, methods, processes and policies, and the regulatory technical
    standards are the subject of a later order (open question (Q10)).
  consequence: The judgement keys are answered by Articles 5 to 8 alone.
- what: digital_operational_resilience_testing
  instrument: Regulation (EU) 2022/2554 Chapter IV (Articles 24 to 27)
  cites:
  - 32022R2554#art_024
  - 32022R2554#art_025
  - 32022R2554#art_026
  - 32022R2554#art_027
  reason: Not pinned in this domain. Art 6(8)(g) names testing as an element of the
    strategy (reading (9)); the testing programme and threat-led penetration testing
    are the subject of the testing orders.
  consequence: Duty 26 asks whether the strategy includes the implementation of testing,
    not whether the testing was done.
- what: ict_third_party_strategy_and_register
  instrument: Regulation (EU) 2022/2554 Article 28(2) and (3)
  cites:
  - 32022R2554#parag_028.002
  - 32022R2554#parag_028.003
  reason: Not pinned in this domain. Whether the entity must adopt the strategy on
    ICT third-party risk (Article 28(2)) is answered by the order on ICT third-party
    entity duties; the register of information (Article 28(3)) is the subject of the
    order on the register of information. Duty 10 (Art 5(2)(h)) and duty 32 (Art 8(5))
    are this order's own duties and do not answer either question (reading (13)).
  consequence: No answer of this order repeats an answer of those orders.
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order answers on the Regulation as it applies and reads no date (reading (15)).
  consequence: No answer depends on a date (open question (Q13)).
