eu_dir_2022_2555_art_28_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_028.001"
  retrieved: 2026-11-16
  note: >-
    Art 28(1): Member States require TLD name registries and entities providing
    domain name registration services to collect and maintain accurate and complete
    registration data in a dedicated database. Anchors the first duty of
    provider_duties/2 and the addressee test (who is addressed).
eu_dir_2022_2555_art_28_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_028.002"
  retrieved: 2026-11-16
  note: >-
    Art 28(2) chapeau: the database must contain the information to identify and
    contact holders and points of contact; 'Such information shall include' makes
    the list of points (a) to (d) a minimum. Second duty of provider_duties/2.
eu_dir_2022_2555_art_28_2_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_028.002_a"
  retrieved: 2026-11-16
  note: >-
    Art 28(2)(a): the domain name. Field domain_name of required_registration_data/2.
eu_dir_2022_2555_art_28_2_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_028.002_b"
  retrieved: 2026-11-16
  note: >-
    Art 28(2)(b): the date of registration. Field date_of_registration.
eu_dir_2022_2555_art_28_2_c:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_028.002_c"
  retrieved: 2026-11-16
  note: >-
    Art 28(2)(c): the registrant's name, contact email address and telephone number.
    Fields registrant_name, registrant_contact_email_address,
    registrant_telephone_number. Verbatim chosen to avoid the typographic apostrophe.
eu_dir_2022_2555_art_28_2_d:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_028.002_d"
  retrieved: 2026-11-16
  note: >-
    Art 28(2)(d): point of contact email and telephone 'in the event that they are
    different from those of the registrant', read per element (open question Q2).
eu_dir_2022_2555_art_28_3:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_028.003"
  retrieved: 2026-11-16
  note: >-
    Art 28(3): policies and procedures including verification procedures, and
    'such policies and procedures to be made publicly available'. Third and fourth
    duties of provider_duties/2. Adequacy is not judged (excluded set
    adequacy_of_procedures).
eu_dir_2022_2555_art_28_4:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_028.004"
  retrieved: 2026-11-16
  note: >-
    Art 28(4): publish, without undue delay after registration, the registration data
    which are not personal data. Anchors publication_duty/3 and the fifth duty.
eu_dir_2022_2555_art_28_5:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_028.005"
  retrieved: 2026-11-16
  note: >-
    Art 28(5): access on lawful and duly substantiated requests by legitimate access
    seekers (access_duty/3); reply 'without undue delay and in any event within 72
    hours of receipt of any requests for access' (access_reply_timeliness/3; 72 is
    within, 73 late; the 72-hour figure is a constant of the slice); disclosure
    policies made publicly available. Sixth to eighth duties.
eu_dir_2022_2555_art_28_6:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_028.006"
  retrieved: 2026-11-16
  note: >-
    Art 28(6): compliance shall not result in duplicate collection; registries and
    registration-service entities cooperate. Ninth duty of provider_duties/2.
