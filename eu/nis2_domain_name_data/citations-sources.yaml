# Citation sourcing manifest for eu/nis2_domain_name_data.
# Instrument: Directive (EU) 2022/2555 (NIS 2 Directive), CELEX 32022L2555,
# OJ L 333, 27.12.2022; raw sha256 6ee66d5c419d9a056fb98d94083cacf9b818803bd6b416435718e0d4919cb589.
# status: verified (verbatim is an exact substring of the pinned unit text)
eu_dir_2022_2555_art_28_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "For the purpose of contributing to the security, stability and resilience of the DNS, Member States shall require TLD name registries and entities providing domain name registration services to collect and maintain accurate and complete domain name registration data in a dedicated database with due diligence in accordance with Union data protection law as regards data which are personal data."
  note: >-
    Art 28(1), unit parag_028.001: the duty to collect and maintain accurate and complete data.
eu_dir_2022_2555_art_28_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "For the purposes of paragraph 1, Member States shall require the database of domain name registration data to contain the necessary information to identify and contact the holders of the domain names and the points of contact administering the domain names under the TLDs."
  note: >-
    Art 28(2), unit parag_028.002: the database must hold the information identifying and contacting holders and points of contact.
eu_dir_2022_2555_art_28_2_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "the domain name"
  note: >-
    Art 28(2)(a), unit point_028.002_a.
eu_dir_2022_2555_art_28_2_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "the date of registration"
  note: >-
    Art 28(2)(b), unit point_028.002_b.
eu_dir_2022_2555_art_28_2_c:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "name, contact email address and telephone number"
  note: >-
    Art 28(2)(c), unit point_028.002_c: the registrant's name, contact email address and telephone number.
eu_dir_2022_2555_art_28_2_d:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "the contact email address and telephone number of the point of contact administering the domain name in the event that they are different from those of the registrant"
  note: >-
    Art 28(2)(d), unit point_028.002_d: read per element (open question Q2).
eu_dir_2022_2555_art_28_3:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "Member States shall require the TLD name registries and the entities providing domain name registration services to have policies and procedures, including verification procedures, in place to ensure that the databases referred to in paragraph 1 include accurate and complete information. Member States shall require such policies and procedures to be made publicly available."
  note: >-
    Art 28(3), unit parag_028.003: policies, verification procedures and their publication.
eu_dir_2022_2555_art_28_4:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "Member States shall require the TLD name registries and the entities providing domain name registration services to make publicly available, without undue delay after the registration of a domain name, the domain name registration data which are not personal data."
  note: >-
    Art 28(4), unit parag_028.004: publication of non-personal registration data.
eu_dir_2022_2555_art_28_5:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "Member States shall require the TLD name registries and the entities providing domain name registration services to reply without undue delay and in any event within 72 hours of receipt of any requests for access."
  note: >-
    Art 28(5), unit parag_028.005: access on lawful and substantiated requests, the 72-hour reply and publication of disclosure policies.
eu_dir_2022_2555_art_28_6:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  verbatim: "Compliance with the obligations laid down in paragraphs 1 to 5 shall not result in a duplication of collecting domain name registration data."
  note: >-
    Art 28(6), unit parag_028.006: no duplicate collection, and cooperation between providers.
