independence: no_external_scorer

uses:
  - "formalize_lib"

scope: "What Directive (EU) 2022/2555 (NIS 2) Art 28(1) to (6) requires a Member State to require of TLD name registries and entities providing domain name registration services: the nine duties, the registration data to hold (Art 28(2)), whether non-personal data must be published (Art 28(4)), whether access to data must be provided (Art 28(5) first sentence), and whether a reply to an access request was within 72 hours (Art 28(5) second sentence). Out of scope, handed to a lawyer or a sibling order: who is a TLD name registry or registrar (Art 6), GDPR lawfulness, adequacy of procedures and data, national access procedures."

sources:
  - "Directive (EU) 2022/2555 (NIS 2 Directive), OJ L 333, 27.12.2022, Art 28(1) to (6), unit 32022L2555"

