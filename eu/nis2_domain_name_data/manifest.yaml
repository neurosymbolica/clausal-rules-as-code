scope: "Directive (EU) 2022/2555 (NIS 2) Article 28(1) to (6): what a Member State must require of a TLD name registry and of an entity providing domain name registration services as regards domain name registration data. Decided here: the nine duties of Art 28 for an addressed provider and none for any other entity; the registration data the database must hold (Art 28(2)(a) to (d), point (d) read per element); whether the non-personal registration data must be made publicly available (Art 28(4)); whether access to specific registration data must be provided (Art 28(5) first sentence); and whether a reply to any request for access was timely (Art 28(5) second sentence, within 72 hours of receipt, a part of an hour rounded up, and without undue delay). Out of scope: whether an entity is a TLD name registry or registrar (Art 6; the caller states it), lawfulness under Union data protection law, the adequacy of data and procedures, national access procedures, what counts as receipt of a request, and whether publication was in fact without undue delay. Open-textured judgements (personal data, legitimate access seeker, lawful and duly substantiated request, undue delay) are the caller's; an unsure one that decides is referred to a lawyer."

sources:
  - "Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December 2022 on measures for a high common level of cybersecurity across the Union (NIS 2 Directive), OJ L 333, 27.12.2022 (CELEX 32022L2555), Article 28(1), 28(2)(a) to (d), 28(3), 28(4), 28(5) and 28(6)"

query_interface:
  2: "decide_nis2_domain_name_data/2"      # eligibility: addressed provider verdict with cited duties
  7: "nis2_domain_name_data_checklist/2"   # justification: one cited checklist row per duty
  15: "access_reply_timeliness/3"          # deadline: the Art 28(5) 72-hour reply, late(hour_limit) when missed
  16: "nis2_domain_name_data_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_heading
  units:
  - 32022L2555#art_028
  reason: 'The title of Article 28 carries no obligation: document structure. Deferred
    so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: provider_definitions
  instrument: Directive (EU) 2022/2555 Art 6 (definitions of a TLD name registry and
    of an entity providing domain name registration services) and Arts 2 and 3
  cites:
  - 32022L2555#art_002
  - 32022L2555#art_003
  - 32022L2555#art_006
  reason: Whether an entity is a TLD name registry, a registrar or an agent of registrars
    (a privacy or proxy registration service provider, a reseller), and whether it
    is within the scope of the Directive, is decided by Art 6 and the sibling order
    on scope; this order takes provider_type as given.
  consequence: The caller establishes the provider type first; an entity that is neither
    has no Art 28 duty.
- what: data_protection_law
  instrument: Regulation (EU) 2016/679 (GDPR)
  cites:
  - 02016R0679-20160504#art_006
  reason: Art 28(1) and (5) say the duties are carried out with due diligence and
    in accordance with Union data protection law as regards personal data. Whether
    processing or disclosure of a personal data item is lawful is decided by the GDPR
    orders; this order takes whether the data are personal data, and whether the requester
    and the request meet the conditions of Art 28(5), as the caller's judgements.
  consequence: The answers say what Art 28 requires; the caller checks separately
    that the processing and the disclosure are lawful under the GDPR.
- what: adequacy_of_procedures
  instrument: national law of the Member States implementing Art 28(1) and (3)
  cites:
  - 32022L2555#art_036
  reason: Whether the data are accurate and complete, and whether a verification procedure
    is adequate, is a question of fact and of national implementation; this order
    lists the duty to have the data and the procedures, not their quality.
  consequence: The answers do not say whether a provider's data or procedures are
    adequate.
- what: national_access_procedures
  instrument: national law of the Member States implementing Art 28(5)
  cites:
  - 32022L2555#art_036
  reason: Who counts as a legitimate access seeker, what a duly substantiated request
    must contain and what the disclosure procedure is are for national law; the Directive
    requires Member States to make the procedures public and leaves their content
    to them.
  consequence: The answers give the Union requirement only; the country orders and
    national law give the procedure.
