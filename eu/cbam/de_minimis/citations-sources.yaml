  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  retrieved: 2026-11-13
  note: >-
    Art 2a(1) [parag_002A.001]: the exemption where the net mass in a
    calendar year 'does not cumulatively exceed' the single mass-based
    threshold (read as NOT MORE THAN: equal to the limit is within),
    aggregated over all CN codes per importer and per calendar year. Also
    the citation of the open-textured referral on year_date_basis (Q1).
