  retrieved: 2026-11-16
  note: >-
    Art 3(8), definition of continental shelf (Art 76 UNCLOS). Whose shelf is a caller fact
    (continental_shelf_or_eez_of, Q7).
eu_reg_2023_956_art_3_9:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#point_003_9"
  retrieved: 2026-11-16
  note: >-
    Art 3(9), definition of exclusive economic zone (Art 55 UNCLOS, declared by a Member
