eu_reg_2023_956_art_2_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#parag_002.001"
  retrieved: 2026-11-16
  note: >-
    Art 2(1): the Regulation applies to Annex I goods originating in a third country.
    Used for its negative side: goods of Member State origin give not_third_country_origin
    (reading (9)).
eu_reg_2023_956_art_2_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#parag_002.003"
  retrieved: 2026-11-16
  note: >-
    Art 2(3): goods to be moved or used in the context of military activities are outside
    the Regulation (excluded_military_activities). The definition in Delegated Regulation
    (EU) 2015/2446 is not pinned; the caller states military_activities (Q5).
eu_reg_2023_956_art_2_3a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#parag_002.003A"
  retrieved: 2026-11-16
  note: >-
    Art 2(3a), lead: the lead words of the continental shelf and exclusive economic zone
    exclusions.
eu_reg_2023_956_art_2_3a_a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#point_002.003A_a"
  retrieved: 2026-11-16
  note: >-
    Art 2(3a)(a): electricity generated on the shelf or zone of a Member State or of a
    country or territory listed in points 1 and 2 of Annex III, read as point 1 OR point 2
    (reading (7), Q1). Point 2 is empty on the pin.
eu_reg_2023_956_art_2_3a_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#point_002.003A_b"
  retrieved: 2026-11-16
  note: >-
    Art 2(3a)(b): hydrogen originating on the shelf or zone of a Member State or of a
    country or territory listed in point 1 of Annex III.
eu_reg_2023_956_art_2_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#parag_002.004"
  retrieved: 2026-11-16
  note: >-
    Art 2(4): goods originating in the countries and territories of Annex III point 1 are
    outside the Regulation (excluded_origin_annex_iii_point_1).
eu_reg_2023_956_art_2_5:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#parag_002.005"
  retrieved: 2026-11-16
  note: >-
    Art 2(5): origin is non-preferential origin under Art 59 of Regulation (EU) No 952/2013.
    Those rules are not pinned; the caller states non_preferential_origin (Q6).
eu_reg_2023_956_art_3_7:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
  unit: "02023R0956-20251020#point_003_7"
  retrieved: 2026-11-16
  note: >-
    Art 3(7), definition of third country: a country or territory outside the customs
    territory of the Union. A Member State is not a third country (reading (9)).
eu_reg_2023_956_art_3_8:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020"
