# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only the kit (formalize_lib), no backbone package.
uses: []

scope: >-
  Under the text of Directive 2002/58/EC (the ePrivacy Directive), consolidated
  text 02002L0058-20091219, only (no Member State's transposing law is read):
  which notifications of a personal data breach are due, to the competent
  national authority only or also to the subscriber or individual (Art 4(3),
  with Art 2(i)); whether one processing of traffic data for one purpose is
  permitted (Art 6(1) to (3), with Art 2(b), (f) and (g)); whether one
  processing of location data other than traffic data is permitted (Art 9(1)
  and (2), with Art 2(c) and (f)); whether one direct marketing communication
  may be sent, may not be sent, or is left to national law (Art 13(1), (2), (3)
  and (5), with Art 2(f) and (h)); and whether a direct marketing electronic
  mail practice is prohibited (Art 13(4)). Not decided here: the security
  duties of Art 4(1), (1a) and (2), Art 4(4) and (5), Art 6(4) to (6), Art 9(3),
  Art 13(6), the content and timing of notifications, and the transposing laws
  of the Member States. Every open-textured judgement is the caller's; an
  unsure judgement that matters is referred to a lawyer.

sources:
  - "Directive 2002/58/EC of the European Parliament and of the Council of 12 July 2002 concerning the processing of personal data and the protection of privacy in the electronic communications sector (Directive on privacy and electronic communications), OJ L 201, 31.7.2002, p. 37, consolidated text 02002L0058-20091219 as amended by Directive 2009/136/EC: Art 2 second paragraph points (b), (c), (f), (g), (h), (i); Art 4(3); Art 6(1) to (3); Art 9(1), (2); Art 13(1) to (5)"

query_interface:
  2: "decide_eprivacy_breach_traffic_location_marketing/2"      # eligibility verdict with cited checklist
  16: "eprivacy_breach_traffic_location_marketing_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 02002L0058-20091219#art4
  - 02002L0058-20091219#art6
  - 02002L0058-20091219#art9
  - 02002L0058-20091219#art13
  reason: Article titles carry no rule of their own. Deferred so every unit of the
    pinned extract is accounted for.
  consequence: 'None for a caller: a title carries no rule.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: security_duties_of_article_4
  units:
  - 02002L0058-20091219#art4_p1
  - 02002L0058-20091219#art4_p1a
  - 02002L0058-20091219#art4_p2
  reason: Art 4(1) and (1a) (appropriate technical and organisational measures, with
    the listed minimum) and Art 4(2) (informing subscribers of a particular risk of
    a breach of network security) turn on what is 'appropriate' or a 'particular risk';
    the text gives no rule to decide it beyond the assessor's own judgement, so a
    query would only repeat the caller's judgement. Not formalised (eu-data-law's
    word on the design).
  consequence: The order does not answer whether a provider's security measures are
    adequate or whether subscribers had to be informed of a risk.
  declaration: not_an_exception
  debt: true
- what: authority_guidelines_audit_and_breach_inventory
  units:
  - 02002L0058-20091219#art4_p4
  reason: Art 4(4) gives the competent national authorities power to adopt guidelines,
    issue instructions, audit and sanction, and requires providers to keep an inventory
    of personal data breaches; neither changes which notifications Art 4(3) makes
    due.
  consequence: The order does not answer what an authority may instruct or whether
    a breach inventory was kept.
  declaration: not_an_exception
  debt: true
- what: commission_implementing_measures
  units:
  - 02002L0058-20091219#art4_p5
  reason: Art 4(5) empowers the Commission to adopt technical implementing measures
    on the circumstances, format and procedures of the information and notification
    requirements; those measures are not pinned and not read (reading (4)).
  consequence: Any circumstance, format, procedure or time limit set by implementing
    measures is not read; an answer says which notifications are due, not by when.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: traffic_data_information_and_restriction
  units:
  - 02002L0058-20091219#art6_p4
  - 02002L0058-20091219#art6_p5
  reason: Art 6(4) (information on the types and duration of processing) and Art 6(5)
    (processing restricted to persons acting under the provider's authority and to
    what is necessary for their activities) are separate duties, read as not conditions
    of the permission (reading (14)).
  consequence: The order does not check whether the information was given or who processed
    the traffic data.
  declaration: not_an_exception
  debt: true
- what: competent_bodies_for_disputes
  units:
  - 02002L0058-20091219#art6_p6
  reason: Art 6(6) keeps the possibility for competent bodies to be informed of traffic
    data to settle disputes; it concerns those bodies, not the provider's permission
    answered here.
  consequence: The order does not answer when competent bodies may be informed of
    traffic data.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: location_data_restriction
  units:
  - 02002L0058-20091219#art9_p3
  reason: Art 9(3) restricts processing to persons acting under the authority of the
    provider or of the third party providing the value added service, and to what
    is necessary for providing it; read as a separate duty, not a condition of the
    permission (reading (14)).
  consequence: The order does not check who processed the location data.
  declaration: not_an_exception
  debt: true
- what: remedies_and_penalties_for_unsolicited_communications
  units:
  - 02002L0058-20091219#art13_p6
  reason: Art 13(6) requires the Member States to provide legal proceedings and allows
    them to lay down penalties; national law, not read.
  consequence: The order does not say who may sue or what penalty applies; a caller
    checks the national law.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: notification_content_and_information_and_refusal_means
  units:
  - 02002L0058-20091219#art4_p3
  - 02002L0058-20091219#art6_p3
  - 02002L0058-20091219#art9_p1
  - 02002L0058-20091219#art9_p2
  partial: true
  debt: true
  reason: 'These units are formalised for whether a notification is due or a processing
    is permitted; their other parts are not: the content of the notifications (the
    last two sentences of Art 4(3)); the duty to give the possibility to withdraw
    consent (Art 6(3), second sentence; Art 9(1), third sentence); the information
    to be given before consent (Art 9(1), second sentence); and the duty to keep a
    simple and free means of temporary refusal (Art 9(2)). A withdrawal or a refusal
    that happened is read.'
  consequence: An answer does not check the content of a notification, the information
    given, or whether the means to withdraw or refuse were offered.
  declaration: not_an_exception

excluded_set:
- what: national_transposition
  instrument: Member States' laws transposing Directive 2002/58/EC Arts 4, 6, 9 and
    13
  cites:
  - 02002L0058-20091219#art17
  reason: A directive binds the Member States; the transposing laws of the 27 Member
    States are not pinned and are not read (reading (1)). The cite is the Directive's
    transposition article, which is not in this order's pin.
  consequence: An answer states what the Directive's text requires; a caller checks
    the applicable national law, a matter for a lawyer.
- what: national_restrictions_under_article_15_1
  instrument: Directive 2002/58/EC Art 15(1) and the Member States' measures adopted
    under it
  cites:
  - 02002L0058-20091219#art15_p1
  reason: Art 6(1) applies without prejudice to Art 15(1), which lets Member States
    restrict the rights and obligations of Arts 6 and 9 by legislative measures; neither
    the Article nor any national measure is pinned (reading (13)).
  consequence: An answer does not account for a national retention or restriction
    measure; a caller checks it, a matter for a lawyer.
- what: definitions_of_the_framework_directive
  instrument: Directive 2002/21/EC Art 2 (taken over by Directive 2002/58/EC Art 2,
    first paragraph)
  cites:
  - 02002L0058-20091219#art2_t1
  - 32002L0021#art_002
  reason: '''Electronic communications service'', ''public communications network''
    and ''subscriber'' are defined by the Framework Directive, which is not pinned;
    the caller''s judgements on who is a provider and what data are in scope cover
    them (reading (3)).'
  consequence: The order takes the caller's judgements as given.
- what: consent_and_data_protection_law
  instrument: Directive 95/46/EC and Regulation (EU) 2016/679 Arts 4(11), 7 and 94(2)
  cites:
  - 02016R0679-20160504#point_004_11
  - 02016R0679-20160504#art_007
  - 02016R0679-20160504#parag_094.002
  reason: Art 2(f) and Art 13(2) refer to Directive 95/46/EC, read as the Regulation
    by its Art 94(2); not pinned here. The caller states valid consent, and that contact
    details were obtained in accordance with that law, as judgements.
  consequence: The order does not check the conditions of valid consent or lawful
    collection; the caller does.
- what: electronic_commerce_information_rules
  instrument: Directive 2000/31/EC Art 6
  cites:
  - 32000L0031#art_006
  reason: Art 13(4) prohibits electronic mail that contravenes Art 6 of that Directive,
    which is not pinned; the caller states it as the judgement email_contravenes_electronic_commerce_directive_article_6
    (reading (25)).
  consequence: The order does not check Art 6 of that Directive; the caller does.
