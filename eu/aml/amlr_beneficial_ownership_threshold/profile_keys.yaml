# Single source of truth for this domain's profile keys (AMLR Art 52 input).
# The sole key carries the person's ownership CHAINS: a list of chains, each a
# list of per-link holdings in basis points (1 BP = 0.01%, 10000 BP = 100%).
# Indirect holdings multiply along a chain; parallel chains add (see rulebase).
rulebase: beneficial_ownership.clausal
keys:
  ownership_chains: value   # Art 52: list of ownership chains (each a list of BP holdings)
# Input check (D80): ownership_chains is required, with no default. It must be a ground list
# of non-empty chains of integers 0..10000; anything else is indeterminate (amlr_bo_input_problem/2).
