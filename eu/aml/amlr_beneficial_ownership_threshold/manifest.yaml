id: eu/aml/amlr_beneficial_ownership_threshold
shape_family: numeric
kit_version: "0.1.0"
# The domain's .clausal file set, in import-DAG order (determination slices over
# a shared kernel, Wave C 2026-08-07; single source of truth for the module list,
# read by auto/layout.py:dag_order). Formerly schema/constants/computation/
# requirements/decision (Wave B horizontal layers); all five collapsed into the
# single beneficial_ownership.clausal slice -- this domain's sole determination
# (AMLR Art 52(1) ownership-interest test). kernel.clausal is EMPTY (one slice,
# and no domain-owned compound result constructor; see its header) but kept as
# the DAG root per the layout.
modules:
  - "kernel"                 # shared floor: EMPTY (one slice; the verdict shape is the kit's)
  - "citations"              # citation registry (shared; untouched)
  - "parameters"             # Part-B provenance sidecar (load-on-demand; never imported)
  - "beneficial_ownership"   # the sole determination: AMLR Art 52(1) ownership-interest test
  - "queries"                # query-taxonomy layer (top-layer consumer)
  - "fixtures"               # demo subjects + arity-2 projections (top-layer consumer)
public_interface:
  - "amlr_bo_assess/2"
  - "amlr_bo_checklist/2"
  - "amlr_bo_decision/2"
  - "amlr_bo_diff/3"
  - "amlr_bo_direct_boundary/1"
  - "amlr_bo_effective_holding/2"
  - "amlr_bo_effective_holding_bps/2"
  - "amlr_bo_gap_to_threshold/2"
  - "amlr_bo_minimum_holding_bps/1"
  - "amlr_bo_profile_for/2"
  - "amlr_bo_requirement_ids/1"
  - "amlr_bo_status/2"
  - "amlr_bo_subject/1"
  - "amlr_bo_threshold/1"
  - "amlr_bo_what_if/3"
  - "assess_amlr_bo/3"
  - "citation/2"
  - "cite/1"
  - "requirement/4"
scope: "Determines whether a natural person qualifies as a beneficial owner under AMLR Art 52 by computing their aggregate effective ownership percentage (direct and indirect) and comparing it to the 25% statutory threshold. Holdings are expressed in basis points (1 BP = 0.01%, so 25% = 2500 BP). Indirect holdings multiply across each level of an ownership chain; parallel chains are summed to produce the total effective holding. The profile must be complete: a ground dict whose ownership_chains is a list of non-empty chains of integer basis points 0..10000; any other profile is indeterminate, with the problem named by amlr_bo_input_problem/2 as the reason."
sources:
  - "Regulation (EU) 2024/1624 (AMLR) Art 52(1) — natural person holding 25% or more of shares, voting rights, or ownership interest is a beneficial owner"
  - "Regulation (EU) 2024/1624 Art 52 — indirect holdings multiply across each level of a chain and add across parallel chains"
query_interface:
  3: "amlr_bo_status/2"
  23: "amlr_bo_effective_holding/2"
  6: "amlr_bo_threshold/1"   # + empirical flip-located form: amlr_bo_direct_boundary/1
  5: "amlr_bo_diff/3"
  16: "amlr_bo_what_if/3"
  24: "amlr_bo_gap_to_threshold/2"

# Deferral register (provision tracking, 2026-10-18). Each entry names the units of the
# pinned AMLR Arts 51, 52 and 54 extract this domain does not implement. control_based_ubo
# and sectoral_15pct_lowering are the order's own deferrals. The order's third,
# trust_and_arrangement_ubo (Arts 55-56), is registered with no units: those articles are not
# in the pinned extract, so there is no unit of it here to defer.
deferred_set:
  - what: control_based_ubo
    reason: >-
      Beneficial ownership through control (Art 51, first paragraph, point (b), and its
      second paragraph; Art 52(4) for entities whose ownership cannot be calculated; Art 54
      where ownership interest and control coexist across the layers of a chain) is the
      separate Art 53 control test. This domain decides the Art 52(1) ownership-interest
      test only.
    consequence: >-
      A natural person below the 25 % line who controls the entity, or who reaches it only
      through a mix of ownership and control along a chain, is reported as not a beneficial
      owner here. A caller must run the control test separately and combine the results.
    units:
      - 32024R1624#art_051/2
      - 32024R1624#point_051_b
      - 32024R1624#parag_052.004
      - 32024R1624#art_054
      - 32024R1624#point_054_a
      - 32024R1624#point_054_b
  - what: sectoral_15pct_lowering
    reason: >-
      Art 52(2)-(3) empower the Commission to set lower thresholds (at most 15 %) for
      higher-risk categories of corporate entities by delegated act, and to review that act.
      No such delegated act is in force.
    consequence: >-
      Every corporate entity is tested against 25 %. If a delegated act lowers the threshold
      for a category, entities in that category are tested against the wrong line until this
      domain is updated.
    units:
      - 32024R1624#parag_052.002
      - 32024R1624#point_052.002_a
      - 32024R1624#point_052.002_b
      - 32024R1624#parag_052.003
  - what: article_headings
    reason: >-
      The heading of Art 52 carries no obligation. Deferred so that every unit of the pinned
      extract is accounted for.
    consequence: >-
      None. A heading states no rule.
    units:
      - 32024R1624#art_052
  - what: trust_and_arrangement_ubo
    instrument: >-
      Regulation (EU) 2024/1624 (AMLR) Arts 55-56 (beneficial owners of express trusts and
      similar legal arrangements) -- same instrument, outside this domain's pinned extract
    reason: >-
      Beneficial owners of express trusts, similar legal arrangements and similar legal
      entities (Arts 55-56) are identified by role, not by an ownership percentage. Those
      articles are not in this domain's pinned extract, so this entry names no units.
    consequence: >-
      A trust or similar arrangement handed to this domain is assessed as if it were a
      corporate entity with ownership chains, which is not the Arts 55-56 test. A caller must
      route trusts and arrangements to a domain that implements those articles.
    units: []

# Provision tracking is enforced (2026-10-18): coverage problems now block the gate.
provision_tracking: enforced
