      verbatim: '1.   For the purpose of Article 51, first paragraph, point (a), ‘an
        ownership interest in the corporate entity’ shall mean direct or indirect
        ownership of 25 % or more of the shares or voting rights or other ownership
        interest in the corporate entity, including rights to a share of profits,
        other internal resources or liquidation balance. The indirect ownership shall
        be calculated by multiplying the shares or voting rights or other ownership
        interests held by the intermediate entities in the chain of entities in which
        the beneficial owner holds shares or voting rights and by adding together
        the results from those various chains, unless Article 54 applies.

        For the purposes of assessing whether an ownership interest exists in the
        corporate entity, all shareholdings on every level of ownership shall be taken
        into account.'
      via: rule
  id: 32024R1624#parag_052.001
  state: GREEN
  text: 1. For the purpose of Article 51, first paragraph, point (a), ‘an ownership
    interest in the corporate entity’ shall mean direct or indirect ownership of 25
    % or more of the shares or voting rights or other ownership interest in the corporate
    entity, including rights to a share of profits, other internal resources or liquidation
    balance. The indirect ownership shall be calculated by multiplying the shares
    or voting rights or other ownership interests held by the intermediate entities
    in the chain of entities in which the beneficial owner holds shares or voting
    rights and by adding together the results from those various chains, unless Article
    54 applies. For the purposes of assessing whether an ownership interest exists
    in the corporate entity, all shareholdings on every level of ownership shall be
    taken into account.
