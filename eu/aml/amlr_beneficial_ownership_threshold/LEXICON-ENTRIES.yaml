# Domain-local citation lexicon entries -- verbatim text keyed by the snake_case
# citation atom, per the citation-identifier standard in docs/clausal-cheatsheet.md.
# PROPOSED entries for the shared _lexicon/citations.yaml (merged by an integrator;
# this domain does NOT edit the shared file directly).
# NB: eu_reg_2024_1624_art_52_1 is the eu_-prefixed adoption of the pre-existing
# reg_2024_1624_art_52_1 key; the en text is copied VERBATIM from the shared
# _lexicon/citations.yaml entry so the atom maps to ONE identical text across the
# sidecar and the shared lexicon (C7-coverage uniqueness).
eu_reg_2024_1624_art_52_1:
  en: "Regulation (EU) 2024/1624 (AMLR), Art 52(1): a natural person who holds, directly or indirectly, 25 % or more of the shares, voting rights or ownership interest in a legal entity is a beneficial owner"

# --- Phase-2b pass-2 (VOCABULARY) -------------------------------------------
# Declares the domain's public decision terminal. The verdict values
# eligible/ineligible/indeterminate are the tier-1 `_shared` terminal triple
# (covered globally in _lexicon/terms.yaml) and take NO per-module terms entry;
# likewise the checklist status met/unmet/unknown. The proposition MEANING lives
# on the public decision predicate amlr_bo_decision/2; the render composes
# "{amlr_bo_decision proposition}: {verdict}". See _tools/public_terminals_schema.md.
public_terminals:
  - amlr_bo_decision

terms:
  amlr_bo_decision: {en: "whether a natural person is a beneficial owner of the entity — holding, directly or through multiplied and aggregated ownership chains, 25% or more of the shares, voting rights or ownership interest (Reg (EU) 2024/1624 (AMLR) Art 52(1))"}
