# Domain-local lexicon sidecar for eu/aml/amlr-bo-chain.
# Phase-2b pass-2 (VOCABULARY): declares the domain's public decision terminal.
# The verdict values eligible/ineligible are the tier-1 `_shared` terminal triple
# (covered globally in _lexicon/terms.yaml) and take NO per-module terms entry.
# There is no `indeterminate` branch: HOLDINGS is a closed list argument with no
# missing-evidence channel (an empty list is evidenced 0 bp -> ineligible). The
# proposition MEANING lives on the public decision predicate ubo_status/4; the
# render composes "{ubo_status proposition}: {verdict}". Vocabulary matches the
# sibling module eu/aml/amlr-beneficial-ownership-threshold (D5 one-name-one-role).
# See _tools/public_terminals_schema.md.

public_terminals:
  - ubo_status

terms:
  ubo_status: {en: "whether a natural person is a beneficial owner of the entity via the Art 52(1) ownership limb — effective holding (chain products multiplied along each path, summed across parallel paths) of 25% or more (Reg (EU) 2024/1624 (AMLR) Art 52(1))"}
