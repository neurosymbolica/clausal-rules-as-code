  id: 32024R1624#parag_052.002
  state: GREY
  text: '2. Where Member States identify pursuant to Article 8(4), point (c), of Directive
    (EU) 2024/1640 categories of corporate entities that are exposed to higher money
    laundering and terrorist financing risks, including based on the sectors in which
    they operate, they shall inform the Commission thereof. By 10 July 2029, the Commission
    shall assess whether the risks associated with those categories of legal entities
    are relevant for the internal market and, where it concludes that a lower threshold
    is appropriate to mitigate those risks, adopt delegated acts in accordance with
    Article 85 to amend this Regulation by identifying: … The lower threshold referred
    to in the first subparagraph shall be set at a maximum of 15 % of ownership interest
    in the corporate entity, unless the Commission concludes, on the basis of risk,
    that a higher threshold would be more proportionate, which shall in any case be
    set at less than 25 %.'
