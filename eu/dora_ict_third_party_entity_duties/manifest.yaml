uses: []

scope: >-
  The financial entity's own duties for the management of ICT third-party risk
  under Regulation (EU) 2022/2554 (DORA), for ONE contractual arrangement on the
  use of ICT services: the assessments before entering into the arrangement
  (Art 28(4)(a)-(e)), the provider's information security standards (Art 28(5)),
  the exercise of access, inspection and audit rights (Art 28(6)), the exit
  strategies and plans for ICT services supporting critical or important
  functions (Art 28(8)), the preliminary assessment of ICT concentration risk and
  the considerations on subcontracting, insolvency, data recovery and third
  countries (Art 29(1), (2)); and, at entity level, who must adopt a strategy on
  ICT third-party risk (Art 28(2), first sentence). Four queries: which duties
  apply (entity_duties_required), whether all are performed
  (entity_duties_complete), which are outstanding (entity_duties_outstanding),
  and whether the strategy is required (ict_third_party_strategy_required). The
  open-textured judgements (each duty performed, critical or important function,
  high technical complexity) are the caller's; unsure is referred to a lawyer as
  needs_legal_review. Out of scope: whether the entity is a financial entity in
  scope or the arrangement one on the use of ICT services (Q1), the general
  principles of Art 28(1), the content of the strategy and policy and the
  management body review (rest of Art 28(2)), the register of information
  (Art 28(3)), the termination circumstances (Art 28(7)), the mandates for
  technical standards (Art 28(9), (10)) and the contract contents of Article 30.
  Every reading is the drafter's, not a lawyer's.

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, original OJ text): Article 28(2), first sentence; Article 28(4), points (a) to (e); Article 28(5); Article 28(6); Article 28(8), points (a) to (c)"
  - "Regulation (EU) 2022/2554 (DORA), OJ L 333, 27.12.2022, p. 1: Article 29(1), points (a) and (b), and Article 29(2)"
  - "Regulation (EU) 2022/2554 (DORA), OJ L 333, 27.12.2022, p. 1: Article 28(1) quoted for reading (9) only; Article 28(3), (7), (9) and (10) pinned and deferred"

query_interface:
  2: "dora_ict_third_party_entity_duties_status/2"      # eligibility: complete / incomplete / indeterminate / needs_legal_review / input_problems
  7: "dora_ict_third_party_entity_duties_checklist/2"   # justification: item(Duty, Status, cite(Key)) per open duty
  13: "entity_duties_complete/3"                        # compliance_check: are the duties for entering into the arrangement all performed
  16: "dora_ict_third_party_entity_duties_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_028
  - 32022R2554#art_029
  reason: The headings of Articles 28 and 29 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: general_principles
  units:
  - 32022R2554#parag_028.001
  - 32022R2554#point_028.001_a
  - 32022R2554#point_028.001_b
  - 32022R2554#point_028.001_b_i
  - 32022R2554#point_028.001_b_ii
  reason: Art 28(1) requires financial entities to manage ICT third-party risk within
    their ICT risk management framework, to remain fully responsible for their obligations
    (point (a)) and to apply the principle of proportionality (point (b)). It is quoted
    for reading (9) (proportionality removes no duty); it states principles with no
    condition and no output this order computes.
  consequence: No answer turns on it; proportionality removes no duty in this order
    (open question (Q9)).
  declaration: answered_with_caveat
  debt: true
  open: principles; not formalisable as a rule with an output in this order; the deferral
    stands for this run.
- what: strategy_content_basis_and_review
  units:
  - 32022R2554#parag_028.002
  partial: true
  reason: 'Art 28(2), first sentence, who must adopt and regularly review a strategy
    on ICT third-party risk (every financial entity other than the entities of Article
    16(1), first subparagraph, and microenterprises), is formalised by ict_third_party_strategy_required
    (reading (10)). Not formalised: the multi-vendor strategy of Article 6(9) the
    strategy takes into account, the policy on the use of ICT services supporting
    critical or important functions it includes, its application on an individual,
    sub-consolidated and consolidated basis (second sentence), and the regular review
    by the management body of the risks of arrangements on critical or important functions
    (third sentence). The content of the policy is specified by Delegated Regulation
    (EU) 2024/1773, which is named and not formalised.'
  consequence: strategy_required says only that the entity must adopt the strategy;
    it says nothing about the strategy's content, its basis of application, the management
    body's review or whether the entity has a strategy.
  declaration: answered_with_caveat
  debt: true
  open: an entity-level duty whose content needs the delegated regulation pinned;
    the deferral stands for this run (open question (Q10)).
- what: register_of_information
  units:
  - 32022R2554#parag_028.003
  reason: Art 28(3) requires a register of information on all contractual arrangements
    on the use of ICT services, yearly reporting, the register on request and timely
    information on planned arrangements for critical or important functions. The templates
    are in Implementing Regulation (EU) 2024/2956, which is named and not formalised.
  consequence: The order does not check the register, the reporting or the notice
    of a planned arrangement (reading (12)).
  declaration: answered_with_caveat
  debt: true
  open: an entity-level duty with its own technical standard; the deferral stands
    for this run (open question (Q12)).
- what: termination_circumstances
  units:
  - 32022R2554#parag_028.007
  - 32022R2554#point_028.007_a
  - 32022R2554#point_028.007_b
  - 32022R2554#point_028.007_c
  - 32022R2554#point_028.007_d
  reason: Art 28(7) lists the circumstances in which contractual arrangements must
    be capable of termination. It is a requirement on the contract, formalised in
    the order on the key contractual provisions of Art 28(7) and Article 30 (eu/dora-ict-third-party-contract-provisions);
    here it is named only because the second sentence of Art 28(8) refers to it.
  consequence: complete and none_outstanding say nothing about the termination rights
    in the contract (reading (14)).
  declaration: answered_with_caveat
  debt: true
  open: formalised in the contract-provisions order; the deferral stands for this
    order.
- what: technical_standards_mandates
  units:
  - 32022R2554#parag_028.009
  - 32022R2554#parag_028.010
  reason: Art 28(9) and (10) give the European Supervisory Authorities mandates to
    draft technical standards for the register of information and the policy on ICT
    services supporting critical or important functions, and the Commission power
    to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_definitions
  instrument: Regulation (EU) 2022/2554 Article 2 and Article 3, points (19), (21),
    (22) and (60)
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of the Regulation and the arrangement one on the use of ICT services
    is presupposed (reading (1)); critical or important function and microenterprise
    are the caller's judgement and fact (readings (4), (10)).
  consequence: The answers presuppose a financial entity within scope and an arrangement
    on the use of ICT services (open question (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The general principle of proportionality is read
    as removing no duty (reading (9)); the criteria of Article 4(2) named in Art 28(8)
    are part of the caller's judgement of the exit plans (reading (5)).
  consequence: No duty is removed for size (open question (Q9)).
- what: risk_management_framework_and_simplified_framework
  instrument: Regulation (EU) 2022/2554 Articles 6 and 16
  cites:
  - 32022R2554#art_006
  - 32022R2554#art_016
  reason: Not pinned in this domain. Art 28(1) and (2) name the ICT risk management
    framework of Article 6 and its multi-vendor strategy, and Art 28(2) the entities
    of Article 16(1), first subparagraph; whether an entity is one of them is the
    caller's fact (reading (10)).
  consequence: The order does not test the framework or the Article 16 status (open
    question (Q10)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order answers on the Regulation as it applies and reads no date (reading (11)).
  consequence: No answer depends on a date (open question (Q11)).
- what: policy_technical_standard
  instrument: Commission Delegated Regulation (EU) 2024/1773 (the detailed content
    of the policy on contractual arrangements on the use of ICT services supporting
    critical or important functions)
  cites:
  - 32024R1773#art_001
  reason: Not pinned in this domain. It specifies the content of the policy that Art
    28(2) requires; the order formalises only who must adopt the strategy (reading
    (10)).
  consequence: The order does not check the content of the strategy or policy.
