    Paragraph marker only (never in an answer). Chapeau of the significance
    test; the two limbs (a) and (b) are alternatives (reading (2), Q1).
eu_dir_2022_2555_art_23_3_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_023.003_a"
  retrieved: 2026-11-16
  note: >-
    Significance limb (a): severe operational disruption of the services or
    financial loss for the entity, actual or potential ('capable of'); a
    judgement key, no numeric test.
eu_dir_2022_2555_art_23_3_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_023.003_b"
  retrieved: 2026-11-16
  note: >-
    Significance limb (b): considerable material or non-material damage to
    other natural or legal persons, actual or potential; a judgement key.
eu_dir_2022_2555_art_23_4:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#parag_023.004"
  retrieved: 2026-11-16
  note: >-
    Second subparagraph of Art 23(4): a trust service provider whose trust
    services are affected notifies within 24 hours, replacing the 72-hour
    limit of point (b) only (reading (7), Q5).
eu_dir_2022_2555_art_23_4_a:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_023.004_a"
  retrieved: 2026-11-16
  note: >-
    Early warning: without undue delay and in any event within 24 hours of
    becoming aware; 24 is within, 25 is late (reading (4)); no reasons-for-delay
    exception (reading (5)).
eu_dir_2022_2555_art_23_4_b:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_023.004_b"
  retrieved: 2026-11-16
  note: >-
    Incident notification: without undue delay and in any event within 72
    hours of becoming aware; 72 is within, 73 is late.
eu_dir_2022_2555_art_23_4_c:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  unit: "32022L2555#point_023.004_c"
  retrieved: 2026-11-16
  note: >-
    Intermediate report, due only upon request of the CSIRT or competent
    authority.
eu_dir_2022_2555_art_23_4_d:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
