  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R1925"
  unit: "32022R1925#parag_006.010"
  retrieved: 2026-11-19
  note: >-
    Art 6(10): on request, free of charge, effective, high-quality,
    continuous and real-time access to and use of data; second subparagraph
    read as two cumulative limits for personal data (direct connection and
    opt-in consent) (Q3).
