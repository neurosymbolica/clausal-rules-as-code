  note: >-
    Art 6(1): Article 6 binds the gatekeeper for each core platform service
    listed in the designation decision under Article 3(9). The pinned text
    writes 'The Gatekeeper'; read as the gatekeeper. The listing is the
    outside fact designated_as_gatekeeper_for_core_platform_service.
