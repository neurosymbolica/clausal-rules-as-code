  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R1925"
  unit: "32022R1925#parag_006.009"
  retrieved: 2026-11-19
  note: >-
    Art 6(9): on request, free of charge, effective portability of end user
    data, including free tools and continuous and real-time access; the two
    'including by' clauses are read as parts of the duty (Q1).
