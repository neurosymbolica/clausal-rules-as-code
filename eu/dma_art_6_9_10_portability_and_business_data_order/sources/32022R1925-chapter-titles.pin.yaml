# Chapter headings of Regulation (EU) 2022/1925 (DMA), pinned so "Chapter III" and the article ranges can be cited.
# The DMA source has NO Section/DIVISION level below the Chapters (the XHTML carries only div#cpt_I .. div#cpt_VI),
# so there are no division titles to keep; Art 5 sits directly in CHAPTER III.
# NOT a .meta.yaml on purpose: provisions.units.load_sources reads only *.meta.yaml + *.xml in sources/;
# this file is the sidecar of 32022R1925-chapter-titles.txt and the loader ignores both.
doc_id: 32022R1925
celex: 32022R1925
format: xhtml
url: "https://publications.europa.eu/resource/celex/32022R1925"
fetched: 2026-11-16
file: 32022R1925-chapter-titles.txt
sha256: "cbf42b4a256db7590c6fd50cad996d10ef7b513621de033677c8f529b36bde0a"
extract:
  element_path: "html/body/div#cpt_I .. div#cpt_VI (each: its first <p> label and its div#cpt_N.tit_1 <p> title); articles = nested div#art_N inside each chapter div"
  source_sha256: "d6af21a4f11c2b001b0486391fbd0813deba32305fb0d3865fbceccd45b827eb"
  source_file: (content-negotiated -- see url)
  corrigenda: unread (original act only)
  method: >
    Text of each element is the whitespace-normalised itertext of the source element, one line per chapter:
    "<label> -- <title> -- Articles <first> to <last>", the range read from the nested div#art_N ids.
  chapters:
    - {id: cpt_I, label: "CHAPTER I", title: "SUBJECT MATTER, SCOPE AND DEFINITIONS", articles: "001-002"}
    - {id: cpt_II, label: "CHAPTER II", title: "GATEKEEPERS", articles: "003-004"}
    - {id: cpt_III, label: "CHAPTER III", title: "PRACTICES OF GATEKEEPERS THAT LIMIT CONTESTABILITY OR ARE UNFAIR", articles: "005-015"}
    - {id: cpt_IV, label: "CHAPTER IV", title: "MARKET INVESTIGATION", articles: "016-019"}
    - {id: cpt_V, label: "CHAPTER V", title: "INVESTIGATIVE, ENFORCEMENT AND MONITORING POWERS", articles: "020-043"}
    - {id: cpt_VI, label: "CHAPTER VI", title: "FINAL PROVISIONS", articles: "044-054"}
