  - 32022R1925#point_002_29
  - 32022R1925#point_002_30
  - 32022R1925#point_002_31
  - 32022R1925#point_002_33
  reason: Article 2 defines, among others, gatekeeper (point (1)), core platform service
    (point (2)), end user (point (20)), business user (point (21)), data (point (24))
    and non-personal data (point (26)). This order reads only point (25), personal
    data, and point (32), consent; that the undertaking is a gatekeeper and the service
    a core platform service, and who counts as an end user and as a business user,
    are the caller's premises (reading (2)), and the designation is an outside fact
    (reading (3)).
  consequence: The caller establishes the premises first; the answers rest on them
    without checking them.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in part (the defined terms as checks on the premises); a later
    order.

excluded_set:
- what: gatekeeper_designation_and_compliance_period
  instrument: Regulation (EU) 2022/1925 Art 3
  cites:
  - 32022R1925#art_003
  reason: 'Article 3(9) (the designation decision listing the core platform services)
    is named by Art 6(1) and by reading (3), and Article 3(10) may set a time to comply
    after a listing. Article 3 is not pinned in this order: the designation enters
    as an outside fact and no compliance period is read (Q9).'
  consequence: A changed designation reaches the order as a new statement of the outside
    fact; the answers never say from when Art 6(9) or (10) must be complied with.
- what: specification_of_obligations
  instrument: Regulation (EU) 2022/1925 Art 8
  cites:
  - 32022R1925#art_008
  reason: The heading of Article 6 refers to Article 8. Article 8 is not pinned in
    this order, and no measure specified under it is read (Q9).
  consequence: Where measures are specified for a gatekeeper under Article 8, the
    answers do not take them into account.
- what: consent_and_personal_data_of_regulation_2016_679
  instrument: Regulation (EU) 2016/679 Art 4
  cites:
  - 02016R0679-20160504#art_004
  reason: 'Art 2(25) and Art 2(32) define personal data and consent by Article 4,
    points (1) and (11), of Regulation (EU) 2016/679. This order does not formalise
    that Regulation: whether the data are personal data is the caller''s judgement
    and whether the end users opted in by consent enters as an outside fact (reading
    (8)).'
  consequence: The caller or another order answers the questions of Regulation (EU)
    2016/679 and states them.
