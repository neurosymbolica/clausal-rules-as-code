uses: []

scope: "Regulation (EU) 2022/1925 (Digital Markets Act), Art 6(1), 6(9) and 6(10),
  with Art 2(25) and 2(32). For one profile (one gatekeeper, one core platform
  service, one request by one requester, one set of requested data) the order
  decides three status questions with a cited answer: whether the obligations
  of Article 6 apply to the service (it is listed in a Commission designation
  decision, an attested outside fact); whether the gatekeeper meets the duty of
  Art 6(9) to provide effective portability of end user data, free of charge,
  with tools and continuous and real-time access, on request; and whether it
  meets the duty of Art 6(10) to provide a business user or a third party it
  authorised with free, effective, high-quality, continuous and real-time
  access to and use of data, with the personal-data limits of the second
  subparagraph (direct connection and end user opt-in consent, the consent an
  attested outside fact). Open-textured judgements are the caller's (true,
  false or unsure) and an unsure judgement that decides is referred to a
  lawyer. Out of scope: the other paragraphs of Article 6, Article 5, Article 3
  (designation, compliance period), Article 8 measures, Regulation (EU) 2016/679,
  and any corrigendum (none pinned)."

sources:
  - "Regulation (EU) 2022/1925 of the European Parliament and of the Council of 14 September 2022 on contestable and fair markets in the digital sector (Digital Markets Act), OJ L 265, 12.10.2022, p. 1 (CELEX 32022R1925, original act): Art 6(1), Art 6(9), Art 6(10), Art 2(25), Art 2(32)"

