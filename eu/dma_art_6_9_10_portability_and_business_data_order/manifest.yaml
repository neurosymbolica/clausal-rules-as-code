deferred_set:
- what: article_6_heading
  units:
  - 32022R1925#art_006
  reason: The heading of Article 6 names its obligations as obligations for gatekeepers
    'susceptible of being further specified under Article 8'. It sets no obligation
    itself, and Article 8 is not pinned here (see the excluded set).
  consequence: The answers never take account of any measure specified under Article
    8 (Q9).
  declaration: answered_with_caveat
  debt: true
  open: formalisable only with Article 8 and the decisions taken under it pinned;
    a later order.
- what: other_obligations_of_article_6
  units:
  - 32022R1925#parag_006.002
  - 32022R1925#parag_006.003
  - 32022R1925#parag_006.004
  - 32022R1925#parag_006.005
  - 32022R1925#parag_006.006
  - 32022R1925#parag_006.007
  - 32022R1925#parag_006.008
  - 32022R1925#parag_006.011
  - 32022R1925#parag_006.012
  - 32022R1925#parag_006.013
  reason: Art 6(2) to (8) and (11) to (13) set the other obligations of Article 6
    (no use of business users' non-public data in competition with them, un-installing
    applications and changing default settings, third-party applications and application
    stores, ranking, switching between applications and services, interoperability,
    access for advertisers and publishers to performance measuring tools and data,
    access for online search engines to ranking, query, click and view data, fair
    general conditions of access, and conditions of termination). They are formalisable
    but are not part of this order's questions.
  consequence: The answers never say whether the gatekeeper complies with Art 6(2)
    to (8) or (11) to (13).
  declaration: answered_with_caveat
  debt: true
  open: formalisable (each paragraph a duty or prohibition on facts); later orders.
- what: definitions_not_read
  units:
  - 32022R1925#art_002
  - 32022R1925#point_002_1
  - 32022R1925#point_002_2
