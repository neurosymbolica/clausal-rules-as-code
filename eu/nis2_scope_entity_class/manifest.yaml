# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: no shared backbone package is imported (only the
# kit's formalize_lib, which is not a domain backbone).
uses: []

scope: "Directive (EU) 2022/2555 (NIS 2) Art 2(1) to (4), (7), (9) and (10) and Art 3(1) and (2),
  with the size ceilings of Article 2 of the Annex to Commission Recommendation 2003/361/EC
  to which Art 2(1) refers. Decided here, from a profile of caller-stated facts and judgements:
  the size category of the entity (size_class/3), whether the Directive applies to it
  (scope_decision/3) and whether it is an essential or an important entity (entity_class/3).
  An absent fact that can change the answer is named (indeterminate, one key); an unsure
  judgement that decides is referred to a lawyer (needs_legal_review). Out of scope: whether
  an activity is of an Annex I or II type (a caller judgement), the SME aggregation rules of
  Arts 3 to 6 of the Annex to the Recommendation, the national definitions of public
  administration, the identification of critical entities under Directive (EU) 2022/2557,
  Member State extensions and exemptions under Art 2(5) and (8), whether national law applies
  the Directive (country orders), and jurisdiction and registration (sibling order)."

sources:
  - "Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December 2022
    (NIS 2 Directive), OJ L 333, 27.12.2022, p. 80, Article 2(1) to (4), (7), (9) and (10)
    and Article 3(1) and (2) (pinned unit text of 32022L2555)"
  - "Commission Recommendation 2003/361/EC of 6 May 2003 concerning the definition of micro,
    small and medium-sized enterprises, OJ L 124, 20.5.2003, p. 36, Annex Title I Article 2
    (raw pin 32003H0361, referred to by Directive Art 2(1); not a pinned unit of this domain)"

query_interface:
  2: "decide_nis2_scope_entity_class/2"      # eligibility: class verdict with citations
  7: "nis2_scope_entity_class_checklist/2"   # justification: one cited item per ground
  16: "nis2_scope_entity_class_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_headings
  units:
  - 32022L2555#art_002
  - 32022L2555#art_003
  reason: 'The titles of Articles 2 and 3 carry no obligation: document structure.
    Deferred so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the titles carry no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: member_state_extensions_and_exemptions
  units:
  - 32022L2555#parag_002.005
  - 32022L2555#point_002.005_a
  - 32022L2555#point_002.005_b
  - 32022L2555#parag_002.008
  reason: Art 2(5) (a Member State may apply the Directive to public administration
    entities at local level and to education institutions) and Art 2(8) (a Member
    State may exempt specific entities in the areas of national security, public security,
    defence or law enforcement from Articles 21 and 23, and in some cases from Articles
    3 and 27) are decisions of national law; whether a Member State made them is a
    fact for the country orders.
  consequence: The answers apply the Directive's own rules; they do not say whether
    a Member State extended the scope to local public administration or education
    institutions, or exempted an entity.
  declaration: answered_with_caveat
  not_formalized_because: national_law
- what: national_security_reservations
  units:
  - 32022L2555#parag_002.006
  - 32022L2555#parag_002.011
  reason: Art 2(6) (the Directive is without prejudice to the Member States' responsibility
    for national security) and Art 2(11) (obligations do not entail supplying information
    contrary to essential interests of national security, public security or defence)
    are safeguards that yield no answer a query of this order could return.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: relation_to_other_law_and_data_processing
  units:
  - 32022L2555#parag_002.012
  - 32022L2555#parag_002.014
  reason: Art 2(12) (the Directive applies without prejudice to the GDPR and other
    Union acts) and Art 2(14) (personal data are processed as necessary and in accordance
    with the GDPR) are rules of relation and of processing that change neither the
    scope nor the class.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: confidential_information_exchange
  units:
  - 32022L2555#parag_002.013
  reason: Art 2(13) binds the exchange of confidential information between the Commission
    and the authorities.
  consequence: 'None for an entity caller: it binds the authorities.'
  declaration: not_an_exception
  not_formalized_because: institutional
- what: lists_and_registers
  units:
  - 32022L2555#parag_003.003
  - 32022L2555#parag_003.005
  - 32022L2555#point_003.005_a
  - 32022L2555#point_003.005_b
  - 32022L2555#parag_003.006
  reason: Art 3(3) (Member States establish and review the list of entities), Art
    3(5) and (6) (notifications to the Commission and the Cooperation Group) bind
    the Member States and their authorities, not the entity.
  consequence: 'None for an entity caller: these paragraphs bind the authorities.'
  declaration: not_an_exception
  not_formalized_because: institutional
- what: information_to_submit_for_the_list
  units:
  - 32022L2555#parag_003.004
  - 32022L2555#point_003.004_a
  - 32022L2555#point_003.004_b
  - 32022L2555#point_003.004_c
  - 32022L2555#point_003.004_d
  reason: Art 3(4) (the information an entity submits for the list, and the two-week
    change limit) is formalized in the sibling order on jurisdiction and registration
    (nis2-jurisdiction-registration), which cites it.
  consequence: 'None for a caller of this order: see the sibling order.'
  declaration: not_an_exception
  not_formalized_because: in_sibling
  decided_in: nis2-jurisdiction-registration
- what: annex_types
  instrument: Directive (EU) 2022/2555 Annex I and Annex II (not pinned in this domain)
  units: []
  reason: 'Annex I (sectors of high criticality) and Annex II (other critical sectors)
    list the types of entity to which the Directive applies. This order takes whether
    the entity is of a type in Annex I or II as the two judgement keys annex_i_type
    and annex_ii_type; the Annex lists are formalisable (as sector and type enumerations)
    but no pinnable text yet: tools/pin_statute.py cannot cut this text (--annex is
    not implemented for xhtml; the Recommendation fails 404 through the celex route);
    the tool is to be extended; the debt is replaced by
    a pin, keys and bound units when it does.'
  consequence: The answers do not say which activities are of an Annex type; the caller
    judges that itself.
  declaration: answered_with_caveat
  debt: true
  open: 'no pinnable text yet: tools/pin_statute.py cannot cut this text (--annex
    is not implemented for xhtml; the Recommendation fails 404 through the celex route);
    the tool is to be extended; the debt is replaced by
    a pin, keys and bound units when it does.'
- what: sme_ceilings_pin
  instrument: Commission Recommendation 2003/361/EC, Annex Title I Article 2 (not
    pinned in this domain)
  units: []
  reason: 'Art 2 of the Annex to Recommendation 2003/361/EC (the staff and financial
    ceilings of the size categories) is read in this order from the raw pin quoted
    in sources, and no citation key names it; no pinnable text yet: tools/pin_statute.py
    cannot cut this text (--annex is not implemented for xhtml; the Recommendation
    fails 404 through the celex route); an extension of
    the tool has been requested; the debt is replaced by a pin, keys and bound units when it does.'
  consequence: The size answers cite the Directive Art 2(1) that refers to the Recommendation,
    not the Recommendation itself.
  declaration: answered_with_caveat
  debt: true
  open: 'no pinnable text yet: tools/pin_statute.py cannot cut this text (--annex
    is not implemented for xhtml; the Recommendation fails 404 through the celex route);
    the tool is to be extended; the debt is replaced by
    a pin, keys and bound units when it does.'
- what: article_3_1_chapeau
  units:
  - 32022L2555#parag_003.001
  reason: 'The chapeau of Art 3(1) ("For the purposes of this Directive, the following
    entities shall be considered to be essential entities") states no condition of
    its own: it introduces points (a) to (g), each formalized as its own essential
    ground E1 to E9 and cited by its own key (eu_dir_2022_2555_art_3_1_a to _g). No
    citation key of this order names the chapeau unit, so it is accounted for here.'
  consequence: 'None for a caller: every essential answer cites the point of Art 3(1)
    that decides it.'
  declaration: not_an_exception
  not_formalized_because: structural

excluded_set:
- what: sme_aggregation_rules
  instrument: Commission Recommendation 2003/361/EC, Annex Title I Articles 3 to 6
  cites:
  - 32003H0361#art_003
  - 32003H0361#art_004
  - 32003H0361#art_005
  - 32003H0361#art_006
  reason: Whether an enterprise is autonomous, a partner or a linked enterprise, which
    reference period applies and how persons employed are counted (Arts 3 to 6 of
    the Annex) decide the final staff, turnover and balance sheet figures; Art 2(1)
    of the Directive disapplies Art 3(4) of the Annex. The caller applies these rules
    and gives the final figures.
  consequence: The size answers are only as good as the figures given; the order does
    not aggregate the figures of partner or linked enterprises.
- what: national_definitions_of_public_administration
  instrument: national law of the Member States (Art 2(2)(f); the definition of a
    public administration entity is Directive Art 6, point (35))
  cites:
  - 32022L2555#art_006
  reason: Which bodies are public administration entities of central government or
    of regional level, and which regional entities provide risk-assessed services,
    is defined by each Member State in accordance with national law (Art 2(2)(f)).
  consequence: The caller states public_administration_kind; the country orders give
    the national definition.
- what: critical_entities_identification
  instrument: Directive (EU) 2022/2557 (Art 6, identification of critical entities)
  cites:
  - 32022L2557#art_006
  reason: Whether an entity is identified as a critical entity under Directive (EU)
    2022/2557 (Art 2(3) of this Directive, Art 3(1)(f)) is decided under that Directive;
    this order takes it as the crisp key critical_entity_under_directive_2022_2557.
  consequence: The caller states whether the entity was identified.
- what: entity_definitions_in_article_6
  instrument: Directive (EU) 2022/2555 Art 6
  cites:
  - 32022L2555#art_006
  reason: The definitions of a TLD name registry, a DNS service provider, a trust
    service provider, a qualified trust service provider and an entity providing domain
    name registration services are in Art 6 and in other Union acts and are not pinned
    in this domain; the caller states the crisp keys.
  consequence: The caller establishes the provider type under the definitions.
