jurisdiction: eu
name: European Union
legal_system: supranational
languages: [en]
status: researched
researched: 2026-06-27
sources:
  - name: EUR-Lex – EU Law Portal
    url: https://eur-lex.europa.eu/
    type: consolidated_legislation
    official: true
    verified: 2026-06-27
    authority: Publications Office of the European Union (operated on behalf of EU institutions)
    formats: [html, pdf, xml]
    access: free
    licensing: >
      Creative Commons Attribution 4.0 International (CC BY 4.0) for editorial content,
      summaries, and consolidated texts; CC0 1.0 Universal for metadata. Documents
      published in the Official Journal are EU copyright but freely reusable under the
      same CC BY 4.0 terms unless otherwise noted.
    coverage: >
      Single access point for the full body of EU law in all 24 official languages:
      treaties, the Official Journal (L and C series), consolidated texts of legislation,
      preparatory acts, case law from the Court of Justice, EU agreements, and legislative
      summaries. Consolidated texts incorporate all amendments into a single readable
      version (documentation only — not legally authentic). Coverage extends from 1952
      (ECSC founding) to the present day, with daily updates. XML downloads in Formex
      format available for Official Journal acts; Akoma Ntoso (AKN4EU) migration ongoing.
    update_cadence: continuous
    candidate_domains:
      - area: data-protection
        shape: deontic
        note: >
          GDPR (Regulation 2016/679) — data controller/processor obligations, lawful-basis
          conditions, data subject rights, and mandatory breach-notification duties are
          expressed as deontic rules (must/must-not/may).
      - area: banking-capital
        shape: numeric
        note: >
          Capital Requirements Regulation (CRR, Regulation 575/2013 as amended) — CET1,
          Tier 1, and Total Capital ratio minima; risk-weight formulas; LCR and NSFR
          thresholds are highly numeric and directly formalizable.
      - area: chemicals-registration
        shape: eligibility
        note: >
          REACH Regulation (1907/2006) — registration obligations depend on tonnage
          thresholds (1 t/y, 10 t/y, 100 t/y), substance classification, and use category;
          classic eligibility-gate structure.
      - area: single-market-freedom
        shape: eligibility
        note: >
          Services Directive (2006/123/EC) and freedom-of-establishment provisions —
          member-state authorisation schemes must meet necessity/proportionality tests,
          formalizable as multi-criterion eligibility gates.

  - name: Official Journal of the European Union
    url: https://eur-lex.europa.eu/oj/direct-access.html
    type: gazette
    official: true
    verified: 2026-06-27
    authority: Publications Office of the European Union
    formats: [html, pdf, xml]
    access: free
    licensing: >
      CC BY 4.0 for content. Since 1 July 2013, only the electronic edition published
      on EUR-Lex is legally authentic and produces legal effects (replaces the paper
      edition as the sole authentic source).
    coverage: >
      The sole legally authentic publication of binding EU secondary legislation and
      other official EU acts. Published Monday–Friday (and on urgent weekends/holidays)
      in all 24 official EU languages. Comprises two series: L series (Legislation) —
      regulations, directives, decisions, opinions, and international agreements — and
      C series (Information and Notices) — preparatory acts, institutional communications,
      Court of Justice notices, and calls for tender. Historical issues available from
      30 December 1952; acts from October 2023 published individually as standalone PDFs
      rather than collated daily volumes. XML in Formex format available via data.europa.eu
      for issues from 2004 onward.
    update_cadence: daily
    candidate_domains:
      - area: commencement-dates
        shape: temporal
        note: >
          Every binding act in the L series carries explicit entry-into-force and
          application dates, providing direct temporal signals for legislative
          commencement reasoning.
      - area: delegated-and-implementing-acts
        shape: deontic
        note: >
          Delegated regulations and implementing decisions published in the OJ impose
          mandatory obligations and prohibitions on member states and regulated entities,
          structured for deontic extraction.

  - name: InfoCuria – Court of Justice of the European Union Case-Law
    url: https://curia.europa.eu/
    type: case_law
    official: true
    verified: 2026-06-27
    authority: Court of Justice of the European Union (Court of Justice, General Court)
    formats: [html, pdf]
    access: free
    licensing: >
      EU copyright; documents freely accessible and reproducible for non-commercial
      informational purposes. No explicit Creative Commons licence; reproduction for
      commercial purposes requires prior authorisation.
    coverage: >
      Official case-law repository for all judgments, orders, and Opinions of the
      Advocate General issued by the Court of Justice (CJEU) and the General Court.
      Searchable via InfoCuria (infocuria.curia.europa.eu), which replaced the legacy
      curia.europa.eu search in 2024. Covers the full treaty-era corpus from 1954 to
      present; HTML from the 1990s, PDF throughout. Includes metadata such as case
      classifications, keywords (EUROVOC), CELEX numbers, and citations to acts
      interpreted. CJEU preliminary rulings binding on all national courts; General
      Court rulings subject to appeal to the CJEU.
    update_cadence: continuous
    candidate_domains:
      - area: competition-merger-control
        shape: constraint-satisfaction
        note: >
          CJEU/General Court merger and dominance rulings interpret the Significant
          Impediment to Effective Competition (SIEC) test — a multi-factor
          constraint-satisfaction problem over market definition and competitive effects.
      - area: data-protection-interpretation
        shape: classification
        note: >
          CJEU preliminary rulings under GDPR and predecessor Directive 95/46/EC classify
          key concepts (e.g. "personal data", "controller", "legitimate interest")
          determinative for downstream compliance classification models.

  - name: EDPB – European Data Protection Board
    url: https://www.edpb.europa.eu/
    type: regulator
    official: true
    verified: 2026-06-27
    authority: >
      European Data Protection Board (independent EU body established under GDPR
      Article 68; Regulation (EU) 2018/1725)
    formats: [html, pdf]
    access: free
    licensing: >
      EU copyright; EDPB guidelines and opinions are freely accessible and may be
      reproduced for non-commercial purposes with attribution to the EDPB.
    coverage: >
      Binding decisions, guidelines, recommendations, and best-practice documents
      on the application of GDPR (Regulation 2016/679) and the Law Enforcement
      Directive (2016/680). Issues consistency opinions on national supervisory
      authority draft decisions in cross-border cases. Key output types: guidelines
      on consent, data transfers (Standard Contractual Clauses, adequacy), data
      subject rights, Data Protection Impact Assessments, breach notification,
      legitimate interests, and AI/technology-specific guidance. Guidelines subject
      to public consultation before finalisation; final versions legally persuasive
      and followed by DPAs across the EEA.
    update_cadence: irregular
    candidate_domains:
      - area: data-protection-gdpr
        shape: deontic
        note: >
          EDPB guidelines formalise the deontic structure of GDPR — mandatory obligations
          (e.g. DPO appointment triggers, DPIA requirements), prohibition conditions
          (unlawful processing bases), and permissions (consent validity criteria).
      - area: international-data-transfers
        shape: eligibility
        note: >
          Transfer mechanism eligibility — adequacy decision coverage, SCCs applicability,
          Transfer Impact Assessment steps — maps cleanly onto a multi-gate eligibility
          model (Chapter V GDPR).

  - name: ESMA – European Securities and Markets Authority
    url: https://www.esma.europa.eu/
    type: regulator
    official: true
    verified: 2026-06-27
    authority: >
      European Securities and Markets Authority (Regulation (EU) No 1095/2010;
      independent EU authority)
    formats: [html, pdf]
    access: free
    licensing: >
      EU copyright; regulatory documents freely accessible for non-commercial
      informational purposes; reproduction requires attribution.
    coverage: >
      Regulatory Technical Standards (RTS), Implementing Technical Standards (ITS),
      guidelines, opinions, and Q&As covering EU securities and markets regulation.
      Principal legislative frameworks administered: MiFID II / MiFIR (markets in
      financial instruments), EMIR (derivatives / CCPs), Prospectus Regulation,
      Market Abuse Regulation (MAR), Short Selling Regulation, AIFMD, UCITS,
      Credit Rating Agency Regulation, MiCA (crypto-assets), and DORA (digital
      operational resilience). Endorsed technical standards published in EUR-Lex as
      Commission delegated/implementing regulations and therefore binding across the EU.
    update_cadence: continuous
    candidate_domains:
      - area: crypto-asset-classification
        shape: classification
        note: >
          MiCA (Regulation 2023/1114) classification of crypto-assets into ART,
          EMT, and "other" categories is a pure classification problem with
          defined criteria; ESMA guidance operationalises the tests.
      - area: prospectus-thresholds
        shape: numeric
        note: >
          Prospectus Regulation exemptions turn on quantitative thresholds (€8 M
          aggregate consideration over 12 months for exemption from full prospectus
          requirement); ESMA Q&As clarify calculation methods.
      - area: market-abuse
        shape: deontic
        note: >
          MAR (Regulation 596/2014) imposes mandatory disclosure obligations, closed
          periods, and insider-list maintenance duties — high deontic structure
          amenable to formalisation.

  - name: EBA – European Banking Authority
    url: https://www.eba.europa.eu/
    type: regulator
    official: true
    verified: 2026-06-27
    authority: >
      European Banking Authority (Regulation (EU) No 1093/2010; independent EU authority)
    formats: [html, pdf]
    access: free
    licensing: >
      EU copyright; freely accessible for non-commercial use with attribution.
    coverage: >
      Binding technical standards (RTS and ITS), guidelines, opinions, and the
      Interactive Single Rulebook covering EU banking and financial-institution
      regulation. Core legislative frameworks: Capital Requirements Regulation /
      Directive (CRR / CRD VI), Bank Recovery and Resolution Directive (BRRD),
      Deposit Guarantee Schemes Directive, Payment Services Directive (PSD2/PSD3),
      and AML/CFT requirements. The EBA Single Rulebook integrates Level 1
      legislation, Level 2 technical standards, and EBA Q&As in a searchable tool.
      Endorsed technical standards published as Commission delegated/implementing
      regulations in EUR-Lex and directly applicable across the EU.
    update_cadence: continuous
    candidate_domains:
      - area: banking-capital-adequacy
        shape: numeric
        note: >
          CRR / CRD capital adequacy framework — CET1 (4.5%), Tier 1 (6%), Total
          Capital (8%) minima plus buffer add-ons (CCyB, G-SII, O-SII); risk-weight
          formulas for credit, market, and operational risk are directly numeric.
      - area: mrel-tlac
        shape: numeric
        note: >
          Minimum Requirement for own funds and Eligible Liabilities (MREL) under
          BRRD Article 45 — institution-specific numeric targets expressed as % of
          Total Risk Exposure Amount and Leverage Ratio Exposure Measure.
      - area: fit-and-proper
        shape: eligibility
        note: >
          CRD Article 91 / EBA Guidelines on suitability — board member and key
          function holder fitness and propriety assessment is a multi-criterion
          eligibility gate (knowledge, skills, experience, reputation, time commitment).

  - name: EUR-Lex Cellar SPARQL Endpoint and Web Services
    url: https://publications.europa.eu/webapi/rdf/sparql
    type: bulk_data
    official: true
    verified: 2026-06-27
    authority: Publications Office of the European Union
    formats: [xml, api, bulk, csv, json]
    access: free
    licensing: >
      CC0 1.0 Universal for metadata (no restrictions); CC BY 4.0 for document
      content; both accessible without registration via SPARQL. EUR-Lex webservice
      (SOAP) requires EU Login registration; Data Dump (all CELEX sector 3 acts in
      force) also requires EU Login.
    coverage: >
      Machine-readable access to the entire EUR-Lex corpus via three interfaces:
      (1) Cellar SPARQL endpoint (https://publications.europa.eu/webapi/rdf/sparql) —
      public, no authentication, accepts SPARQL 1.1 over the Common Data Model (CDM)
      RDF ontology; queries metadata for all EU publications including acts, judgments,
      preparatory documents; 60-second timeout; (2) EUR-Lex Search Webservice (SOAP /
      REST) — registered users query EUR-Lex with expert syntax; (3) Data Dump — bulk
      download of all in-force acts (CELEX sector 3) per language in Formex XML via EU
      Login account. Official Journal acts from 2004 also downloadable as Formex XML
      via data.europa.eu CSV index.
    update_cadence: continuous
    candidate_domains: []
