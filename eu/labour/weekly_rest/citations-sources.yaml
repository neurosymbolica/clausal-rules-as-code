eu_dir_2003_88_art_2_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-14
  note: >-
    Art 2(1), unit parag_002.001: definition of working time. Shifts of kind work
    count as working time; whether on-call time counts is left to national laws
    and/or practice and handed to the caller (reading (3)); the referral row of
    needs_legal_review.
eu_dir_2003_88_art_2_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-14
  note: >-
    Art 2(2), unit parag_002.002: definition of rest period. Every minute that is
    not working time is rest: leave, sick leave, uncounted on-call time and time
    with no rota row (reading (3)).
eu_dir_2003_88_art_2_7:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-14
  note: >-
    Art 2(7), unit parag_002.007: definition of mobile worker, cited with Art 20(1)
    for weekly_rest_not_applied_to_worker. The caller states the category (reading (9)).
eu_dir_2003_88_art_5_first_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-14
  note: >-
    Art 5, first subparagraph, unit subpara_005_1: per each seven-day period a
    minimum uninterrupted rest of 24 hours plus the 11 hours of daily rest, read as
    one unbroken run of at least 2100 minutes; boundary at least (reading (5)).
eu_dir_2003_88_art_5_second_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-14
  note: >-
    Art 5, second subparagraph, unit subpara_005_2: the reduced minimum of 24 hours
    (1440 minutes), applied when the caller states reduced_rest_of_24_hours
    (reading (6)).
