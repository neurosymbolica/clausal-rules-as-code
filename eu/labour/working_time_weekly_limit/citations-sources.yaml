# Citation sourcing manifest for eu/labour/working_time_weekly_limit.
# Instrument: Directive 2003/88/EC (Working Time Directive), OJ L 299, 18.11.2003,
# CELEX 32003L0088 -- the original act (no English consolidation exists).
# Source of record: the EUR-Lex HTML of the original act, converted by
# the build process; raw sha256 0d23ad4953be900de8a614fea4022aa46086e0bdc2fdfd6d0fde0cd84429e4b6.
# Unit ids come from the printed numbering (reading (11)), not from the document.
# status: verified (verbatim is an exact substring of the fetched source at url)
#         | unverified (no verbatim yet)
# retrieved: 2026-11-13
eu_dir_2003_88_art_2_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#parag_002.001"]
  note: >-
    Definition of working time: any period during which the worker is working,
    at the employer's disposal and carrying out his activity or duties, in
    accordance with national laws and/or practice. Decides which shift minutes
    count; on-call time is the caller's judgement (reading (4), Q1, Q2). The
    verbatim quotes the run before the apostrophe.
eu_dir_2003_88_art_6_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#point_006_b"]
  note: >-
    The limit: the average for each seven-day period, including overtime, does
    not exceed 48 hours (2880 minutes; 'does not exceed' means exactly 2880 is
    within). Exact average, no rounding (reading (5); ruling 6 as scoped by the deadline-only rounding scope
    and the labour ruling).
eu_dir_2003_88_art_16_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#point_016_b", "32003L0088#subpara_016_1"]
  note: >-
    Reference period for Art 6 not exceeding four months; with the sentence
    printed after it (attached by position, Q5): paid annual leave and sick
    leave shall not be included or shall be neutral in the calculation of the
    average (reading (6)). The verbatim quotes point (b) only, since the two
    units may be separate paragraphs in the HTML.
eu_dir_2003_88_art_19_first_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#subpara_019_1"]
  note: >-
    A derogation from Art 16(b) under Art 17(3) or Art 18 may not give a
    reference period exceeding six months (reading (3)); the conditions of Art
    17(3) and Art 18 are not checked (Q8).
eu_dir_2003_88_art_19_second_subpara:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#subpara_019_2"]
  note: >-
    Collective agreements may set reference periods in no event exceeding 12
    months (reading (3)); the objective or technical reasons are not checked (Q8).
eu_dir_2003_88_art_20_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#parag_020.002"]
  note: >-
    The reference period of Art 16(b) may be extended to 12 months for workers
    who mainly perform offshore work (reading (3)); whether the worker does so is
    the caller's statement (Q8).
eu_dir_2003_88_art_22_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#parag_022.001"]
  note: >-
    The option of a Member State not to apply Art 6 (reading (8)); the measures
    of points (b) to (e) are not checked (Q7).
eu_dir_2003_88_art_22_1_a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  retrieved: 2026-11-13
  units: ["32003L0088#point_022.001_a"]
  note: >-
    Under the option, no employer requires more than 48 hours over a seven-day
    period on average for the Art 16(b) reference period unless he has first
    obtained the worker's agreement (reading (8)). The verbatim quotes the run
    before the apostrophe.
