eu_dir_2003_88_art_3:
  status: verified
  url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088'
  retrieved: 2026-11-14
  note: >-
    Art 3, the whole article. Units 32003L0088#art_003 and #subpara_003_1.
    It is the load-bearing duty: a minimum daily rest of 11 consecutive
    hours per 24-hour period. This is read as at least 660 unbroken minutes
    of rest inside each checked window, with exactly 660 enough (inclusive).
eu_dir_2003_88_art_2_1:
  status: verified
  url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088'
  retrieved: 2026-11-14
  note: >-
    Art 2(1), the definition of working time. Unit #parag_002.001.
    Work rows always count as working time. Whether on-call time counts is
    left to national laws and/or practice, and is given by the caller's
    judgement keys. This key is the citation of every on-call referral.
eu_dir_2003_88_art_2_2:
  status: verified
  url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088'
  retrieved: 2026-11-14
  note: >-
    Art 2(2), the definition of rest period. Unit #parag_002.002.
    Every minute that is not working time is rest. This includes leave,
    sick leave, on-call time that is not counted, and gaps in the rota.
