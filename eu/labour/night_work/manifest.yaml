- what: offshore_reference_period
  units:
  - 32003L0088#parag_020.002
  reason: Art 20(2) lets the Member States extend the reference period of Art 16(b)
    to 12 months for workers who mainly perform offshore work. It is a Member State
    option for another article and does not touch Art 8.
  consequence: None for the answers of this order.
  declaration: not_an_exception
  not_formalized_because: national_law
- what: review_of_offshore_provisions
  units:
  - 32003L0088#parag_020.003
  reason: Art 20(3) asks the Commission to review the provisions on offshore workers
    by 1 August 2005. It binds an institution and does not touch Art 8.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: institutional
