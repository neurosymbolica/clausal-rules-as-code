eu_dir_2003_88_art_2_1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#parag_002.001"
  retrieved: 2026-11-19
  note: >-
    Art 2(1), the definition of working time. A shift of kind work is working
    time. Whether on-call time is working time is left to national laws and/or
    practice, and is given by the caller's judgement keys. This is the referral
    citation for both on-call keys.
eu_dir_2003_88_art_2_3:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#parag_002.003"
  retrieved: 2026-11-19
  note: >-
    Art 2(3), the definition of night time: not less than seven hours (420
    minutes), and it must include midnight to 05:00 (minute 300). This is the
    source of THE NIGHT-TIME RULE of the input check.
eu_dir_2003_88_art_2_4:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#parag_002.004"
  retrieved: 2026-11-19
  note: >-
    Art 2(4), opening words of the definition of night worker. Night-worker
    status is the caller's judgement key night_worker. Points (a) and (b) are
    deferred. This is the referral citation for night_worker.
eu_dir_2003_88_art_2_7:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#parag_002.007"
  retrieved: 2026-11-19
  note: >-
    Art 2(7), the definition of mobile worker. It is cited with Art 20(1) when
    worker_category is mobile_worker.
eu_dir_2003_88_art_8:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#art_008"
  retrieved: 2026-11-19
  note: >-
    Art 8, opening words. The duty binds the Member States (reading (1)).
eu_dir_2003_88_art_8_a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#point_008_a"
  retrieved: 2026-11-19
  note: >-
    Art 8(a), the average of eight hours (480 minutes) in any 24-hour period.
    The limit is kept at a figure of at most 480 times the divisor.
eu_dir_2003_88_art_8_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0088"
  unit: "32003L0088#point_008_b"
  retrieved: 2026-11-19
  note: >-
    Art 8(b): no more than eight hours (480 minutes) in any 24-hour period
    during which night work is performed. Exactly 480 minutes keeps the limit.
