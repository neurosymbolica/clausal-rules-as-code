  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Art 26(1)(b): DNS, TLD, registration, cloud, data centre, CDN, managed service, managed security, marketplace, search engine and social network providers fall under the Member State of main establishment in the Union.
eu_dir_2022_2555_art_26_1_c:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Art 26(1)(c): public administration entities fall under the Member State which established them.
eu_dir_2022_2555_art_26_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Art 26(2): main establishment is where cybersecurity risk-management decisions are predominantly taken, else where cybersecurity operations are carried out, else where the establishment with most employees is.
