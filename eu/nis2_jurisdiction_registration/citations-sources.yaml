  url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
  retrieved: 2026-11-12
  note: >-
    Art 26(3): non-Union entity offering services in the Union designates a representative; jurisdiction of the Member State of the representative; without one, any Member State where services are provided may take legal action.
