# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports only the kit's formalize_lib, which is not a
# backbone package.
uses: []

scope: >-
  The duties of ONE financial entity under Commission Delegated Regulation (EU)
  2024/1774 (RTS on the ICT risk management framework) Articles 4 and 5 (ICT
  asset management policy and procedure) and Articles 6 and 7 (encryption,
  cryptographic controls and cryptographic key management), gated by Regulation
  (EU) 2022/2554 (DORA) Article 16(1), first subparagraph: an entity listed there
  answers simplified_framework_entity. Three queries: which duties apply
  (required), whether all are performed (complete / incomplete), and which are
  outstanding. Every duty is a caller judgement (true, false, unsure); an unsure
  judgement that decides is referred as needs_legal_review. The microenterprise
  exception of Art 4(2)(c) is the only condition. Out of scope: whether the entity
  is a financial entity within DORA (Articles 2 and 3), the simplified framework
  of DORA Art 16(1) second subparagraph, (2) and (3) and RTS Title III, the other
  RTS articles, and the DORA articles the text refers to (Articles 8, 9 and 10).

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 of 13 March 2024 (RTS on ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework), OJ original text, 32024R1774, Articles 4(1), 4(2), 5(1), 5(2), 6(1) to 6(5) and 7(1) to 7(5)"
  - "Regulation (EU) 2022/2554 (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, p. 1, 32022R2554, Article 16(1), first subparagraph"

query_interface:
  2: "dora_rts_asset_management_and_cryptography_status/2"      # eligibility: the completeness status verdict
  7: "dora_rts_asset_management_and_cryptography_checklist/2"   # justification: one cited item per duty
  13: "rts_asset_management_and_cryptography_duties_complete/3" # compliance_check: are the duties all performed
  16: "dora_rts_asset_management_and_cryptography_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_004
  - 32024R1774#art_005
  - 32024R1774#art_006
  - 32024R1774#art_007
  - 32022R2554#art_016
  reason: The headings of RTS Articles 4 to 7 and of DORA Article 16 carry no rule
    of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 of DORA do not apply
    to the entities it lists), is formalised as the gate of every query (reading (2)),
    standing for the rule that Title II of the RTS applies to financial entities other
    than those entities. Not formalised: who those entities are, which the caller
    states, and the lead words of the second subparagraph, which introduce the duties
    of the simplified ICT risk management framework; those are the subject of the
    order on proportionality and the simplified framework.'
  consequence: simplified_framework_entity says only that RTS Articles 4 to 7 do not
    apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, and Art 16(2) requires that framework
    to be documented and reviewed. They bind only the entities of Article 16(1), for
    which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order on proportionality and the simplified framework; the
    deferral stands for this order (reading (18)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); whether it is a microenterprise
    (Article 3(60)) is the caller's statement (reading (4)); the other terms of Article
    3 are read as the caller applies them (reading (15)). The order on scope and entity
    types formalises Article 2.
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4; Delegated Regulation (EU) 2024/1774
    Article 1
  cites:
  - 32022R2554#art_004
  - 32024R1774#art_001
  reason: Not pinned in this domain. The principle of proportionality and the elements
    RTS Article 1 says are taken into account are read as removing no duty (reading
    (20)).
  consequence: No duty is removed for size beyond the text's own exception (open question
    (Q18)).
- what: dora_articles_referred_to
  instrument: Regulation (EU) 2022/2554 Articles 8, 9 and 10
  cites:
  - 32022R2554#parag_008.001
  - 32022R2554#parag_008.007
  - 32022R2554#parag_009.002
  - 32022R2554#parag_010.002
  reason: Not pinned in this domain. The identification and classification of ICT
    assets (Article 8(1)), the risk assessment of legacy ICT systems (Article 8(7))
    and the ICT security policies (Article 9(2)) are named in RTS Articles 4 and 6
    and formalised in the orders on ICT risk governance and framework and on ICT risk
    protection and detection; Article 10 is listed because the reference 'Article
    10(2), point (a)' in RTS Art 6(4) may name it (readings (10), (17)).
  consequence: Their content is part of the caller's judgement of the duties that
    name them (open questions (Q15), (Q10)).
- what: european_standards_definition
  instrument: Regulation (EU) No 1025/2012 Article 2, point (1)
  cites:
  - 32012R1025#art_002
  reason: Not pinned in this domain. RTS Art 6(3) names the definition of standards
    in Article 2, point (1), of Regulation (EU) No 1025/2012; which standards there
    are is part of the caller's judgement (reading (17)).
  consequence: The order does not check the standards (open question (Q15)).
- what: other_rts_articles
  instrument: Delegated Regulation (EU) 2024/1774 Articles 1 to 3 and 8 to 41
  cites:
