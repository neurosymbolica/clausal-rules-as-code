  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. RTS Articles 1 to 3 and 8 to 27 (the rest of
    Title II) and Articles 28 to 41 (Title III, the simplified framework of the entities
    of DORA Article 16(1)) are formalised, or to be formalised, in their own orders;
