    (readings (10), (18)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q16)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64; Delegated Regulation (EU) 2024/1774
    Article 42
  cites:
  - 32022R2554#art_064
  - 32024R1774#art_042
  reason: Not pinned in this domain. DORA and the RTS apply from 17 January 2025;
    the order answers on the RTS as it applies and reads no date (reading (19)).
  consequence: No answer depends on a date (open question (Q17)).
