excluded_set:
- what: voluntary_reporting_platform_and_other_reporting_provisions
  instrument: Regulation (EU) 2024/2847 Articles 15, 16 and 17
  cites:
  - 32024R2847#art_015
  - 32024R2847#art_016
  - 32024R2847#art_017
  reason: Not pinned in this domain. Article 15 is voluntary reporting (no duty),
    Article 16 sets up ENISA's single reporting platform and the dissemination by
    CSIRTs, and Article 17 sets ENISA and CSIRT powers; none gives a manufacturer
    duty with a date or number this order computes.
  consequence: None for these answers; the reporting obligations of Article 14 are
    in the order for manufacturer reporting.
- what: annexes_named_by_article_13
  instrument: Regulation (EU) 2024/2847 Annexes I, II and VII
  cites:
  - 32024R2847#anx_I
  - 32024R2847#anx_II
  - 32024R2847#anx_VII
  reason: Not pinned in this domain. Article 13 refers to the essential cybersecurity
    requirements (Annex I), the information and instructions to the user (Annex II)
    and the technical documentation (Annex VII); the order computes periods, not content.
  consequence: The answers say how long items are kept, never what they must contain.
- what: authorised_representative_mandate
  instrument: Regulation (EU) 2024/2847 Article 18
  cites:
  - 32024R2847#art_018
  reason: Not pinned in this domain. Art 18(3)(a) gives an authorised representative
    the same ten-year period for keeping documentation; the order reads the manufacturer's
    duty only (reading (10)).
  consequence: The answers are for the manufacturer (open question (Q5)).
