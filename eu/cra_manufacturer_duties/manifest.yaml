# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports none (only the kit's formalize_lib and library(reif)).
uses: []

scope: >-
  Regulation (EU) 2024/2847 (Cyber Resilience Act), duties of manufacturers,
  three bounded questions at an ASSESSMENT_DATE: requirements_applicability,
  which requirements bind a product at that date (Art 69(2) and (3) with Art
  71(2): not_yet_applicable before 11 September 2026, article_14_only from 11
  September 2026 to 10 December 2027, and from 11 December 2027
  subject_to_requirements for a product placed on the market on or after that
  date or placed earlier and substantially modified on or after it, otherwise
  article_14_only; an unsure modification judgement goes to a lawyer);
  support_period_minimum, the five-year (60-month) floor of the support period
  or the shorter expected use time (Art 13(8), third subparagraph); and
  retention_end_date, the date until which the technical documentation and EU
  declaration of conformity (Art 13(13)), the information and instructions to
  the user (Art 13(18)) or a security update (Art 13(9)) must stay available,
  the later of ten calendar years after the start date and the support period
  end date. Out of scope: whether the product is within the scope of the
  Regulation (the order for product scope), the deadlines of Article 14 (the
  order for manufacturer reporting), the content of the essential
  cybersecurity requirements and of Annexes I, II and VII, the other duties of
  Article 13, delegated category minimums, and the authorised
  representative's mandate (see deferred_set and excluded_set). Every reading
  is the drafter's reading, not a lawyer's.

sources:
  - "Regulation (EU) 2024/2847 of the European Parliament and of the Council (Cyber Resilience Act), OJ L, 2024/2847, 20.11.2024, original OJ text 32024R2847 (pinned, raw sha256 fe0cca4a0caec50e7cf5a91432b94a19b211f86be8584fdba56372bdcea571ed): Art 71(2) (dates of application)"
  - "Regulation (EU) 2024/2847, Art 69(2) and (3) (products placed on the market before 11 December 2027; Article 14 for those products)"
  - "Regulation (EU) 2024/2847, Art 13(8) third subparagraph (support period of at least five years), Art 13(19) (end date of the support period)"
  - "Regulation (EU) 2024/2847, Art 13(9), (13), (18) (periods of availability: at least 10 years or the support period, whichever is longer)"
  - "Regulation (EU) 2024/2847, Art 3(20), (21), (30) (support period, placing on the market, substantial modification), read as the caller's inputs"

query_interface:
  3: "requirements_applicability/4"            # status determination
  7: "cra_manufacturer_duties_checklist/2"     # justification: item(STEP, STATUS, cite(KEY)) per ground
  16: "cra_manufacturer_duties_what_if/4"      # what_if: re-evaluate under an overridden key
  23: "support_period_minimum/4"               # calculation (retention_end_date/5 computes the date)

deferred_set:
- what: headings_and_lead_words
  units:
  - 32024R2847#art_003
  - 32024R2847#art_013
  - 32024R2847#art_069
  - 32024R2847#art_071
  reason: 'The headings of Articles 3, 13, 69 and 71 and the lead words of Article
    3 carry no rule of their own: they introduce the paragraphs and definitions, which
    are formalised, or deferred, one by one.'
  consequence: 'None for a caller: the answers come from the paragraphs.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: support_period_determination
  units:
  - 32024R2847#parag_013.008
  partial: true
  reason: Art 13(8) is read for its third subparagraph only (at least five years;
    the expected use time where it is less). Its other subparagraphs (the first, handling
    vulnerabilities for the support period; the second, determining the support period
    to reflect the expected use time, with the matters to be taken into account; the
    fourth, the delegated acts on category minimums; the fifth, the documentation
    of the determination; the sixth, the vulnerability policies) set duties and a
    manufacturer's determination with no computation this order makes (reading (5)).
  consequence: 'The answer gives the floor only: the caller checks that the support
    period reflects the expected use time and the other matters of Art 13(8), and
    whether a delegated act sets a higher minimum for the product''s category (open
    questions (Q6), (Q7)).'
  declaration: answered_with_caveat
  debt: true
  open: the determination is a judgement; formalisable only as one; the deferral stands
    for this run.
- what: information_and_instructions_content_and_form
  units:
  - 32024R2847#parag_013.018
  partial: true
  reason: Art 13(18) is read for its last two sentences only (kept at the disposal
    of users and authorities, and online where provided online, for at least 10 years
    or the support period, whichever is longer). Its first sentences (accompany the
    product with the Annex II information, in a language easily understood, clear
    and legible) set the content and form of the information, with no date (reading
    (7)).
  consequence: The answer gives the end of the period of availability only; the caller
    checks the content, language and form of the information (Annex II, not pinned).
  declaration: answered_with_caveat
  debt: true
  open: not a computation; the deferral stands for this run.
- what: support_period_end_date_statement
  units:
  - 32024R2847#parag_013.019
  reason: 'Art 13(19) requires the end date of the support period (at least month
    and year) to be specified at the time of purchase and, where feasible, an end-of-support
    notification. It is quoted for reading (6): the end date is the caller''s input,
    and the duty to state it has no computation.'
  consequence: The order does not check that the end date was stated; it takes the
    date given (open question (Q8)).
  declaration: answered_with_caveat
  debt: true
  open: not a computation; the deferral stands for this run.
- what: definitions_read_as_the_callers_input
  units:
  - 32024R2847#point_003_20
  - 32024R2847#point_003_21
  - 32024R2847#point_003_30
  reason: 'Art 3(20) (support period), 3(21) (placing on the market) and 3(30) (substantial
    modification) are quoted for readings (2), (5) and (6): the placing date and the
    support period end date are the caller''s dates, and substantial modification
    is the caller''s judgement substantially_modified_on_or_after_application_date;
    the order does not test the definitions.'
  consequence: The caller applies these definitions when it gives the dates and the
    judgement.
  declaration: answered_with_caveat
  debt: true
  open: formalisable only as inputs; the deferral stands for this run.
- what: other_manufacturer_duties
  units:
  - 32024R2847#parag_013.001
  - 32024R2847#parag_013.002
  - 32024R2847#parag_013.003
  - 32024R2847#parag_013.004
  - 32024R2847#parag_013.005
  - 32024R2847#parag_013.006
  - 32024R2847#parag_013.007
  - 32024R2847#parag_013.010
  - 32024R2847#parag_013.011
  - 32024R2847#parag_013.012
  - 32024R2847#parag_013.014
  - 32024R2847#parag_013.015
  - 32024R2847#parag_013.016
  - 32024R2847#parag_013.017
  - 32024R2847#parag_013.020
  - 32024R2847#parag_013.021
  - 32024R2847#parag_013.022
  - 32024R2847#parag_013.023
  - 32024R2847#parag_013.024
  - 32024R2847#parag_013.025
  reason: The other paragraphs of Article 13 set duties with no date or number this
    order computes (design and production to Part I of Annex I; risk assessment and
    its documentation; due diligence on components; reporting vulnerabilities in components;
    documentation; the version rule of paragraph 10; archives; technical documentation
    and conformity assessment; series production; identification; contact details;
    single point of contact; the declaration of conformity copy; corrective action;
    cooperation with authorities; cessation of operations) or Commission and ADCO
    powers (paragraphs 24 and 25). A checklist of them would restate the text with
    no logic.
  consequence: No answer says whether these duties are met; the caller checks them.
  declaration: not_an_exception
  debt: true
  open: paragraph 10 (three judgements) and the event-triggered duties of paragraphs
    6, 21 and 23 are formalisable as further queries in a later change to the orders;
    the deferral stands for this run.
- what: certificates_under_other_legislation
  units:
  - 32024R2847#parag_069.001
  reason: Art 69(1) keeps EU type-examination certificates and approval decisions
    under other Union harmonisation legislation valid until 11 June 2028; it concerns
    certificates, not the duties this order reads.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: structural
