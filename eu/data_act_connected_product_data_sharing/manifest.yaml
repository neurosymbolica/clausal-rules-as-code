# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: module paths of shared backbone packages this
# domain imports. The package imports only the kit's formalize_lib and
# library(reif); no shared domain backbone package.
uses: []

scope: "Regulation (EU) 2023/2854 (the Data Act), Chapter II: whether the design
  duty of Art 3(1) is met, whether the pre-contract information duty of Art 3(2)
  (purchase, rent or lease of a connected product) or Art 3(3) (provision of a
  related service) is met, whether a data holder's duty to make readily available
  data accessible to the user arises under Art 4 (with the security restriction of
  Art 4(2), the personal-data bar of Art 4(12) and the trade-secret grounds of Art
  4(6) to 4(8)), and whether its duty to share such data with a third party arises
  under Art 5 (with the testing-data exception of Art 5(2), the gatekeeper exclusion
  of Art 5(3), the personal-data bar of Art 5(7) and the trade-secret grounds of Art
  5(9) to 5(11)); read with the Art 2 definitions (5), (6), (12), (13), (15), (16)
  and (17), the small enterprise exemption of Art 7(1) and the application dates of
  Art 50, second and third paragraphs. An answer says whether a duty arises or a
  ground applies, not whether data were made available in the right manner or in
  time. Out of scope: Chapter III onward (fair terms, compensation, dispute
  settlement, authorities), penalties (Art 40), national law, the size classes of
  Recommendation 2003/361/EC, the GDPR and ePrivacy conditions, the trade secret
  definition of Directive 2016/943 and gatekeeper designation under Regulation
  2022/1925, each stated by the caller as a judgement. The exceptional trade-secret
  refusal of Art 4(8) and 5(11), and every unsure judgement that matters, goes to
  a lawyer. Every reading is the author's, not a lawyer's."

sources:
  - "Regulation (EU) 2023/2854 of the European Parliament and of the Council of 13 December 2023 on harmonised rules on fair access to and use of data (Data Act), OJ L, 2023/2854, 22.12.2023, CELEX 32023R2854, original act as published (extracted text sha256 f6f0f14921ebabb2373ebbc2adaa59bad66bf15d1216a842f5dcf56997b8c1ef): Art 2 points (5), (6), (12), (13), (15), (16), (17); Art 3(1), 3(2)(a)-(d), 3(3)(a)-(i); Art 4(1), 4(2), 4(6), 4(7), 4(8), 4(12); Art 5(1), 5(2), 5(3), 5(7), 5(9), 5(10), 5(11); Art 7(1) first and second subparagraphs; Art 50 second and third paragraphs"
  - "Corrigendum R(01) of 9 December 2024 to Regulation (EU) 2023/2854 (English; text sha256 e38248447eef21ae7f16b7289724b3ca91eb9d6b3089b26797e31b187509f4ca): corrects Art 48 only, none of the units read here"

query_interface:
  2: "decide_data_act_connected_product_data_sharing/2"      # eligibility verdict over Art 4 with cited checklist (data_act_connected_product_data_sharing_checklist/2)
  16: "data_act_connected_product_data_sharing_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings_and_definitions_lead_line
  units:
  - 32023R2854#art3
  - 32023R2854#art4
  - 32023R2854#art5
  - 32023R2854#art7
  - 32023R2854#art50
  - 32023R2854#art2_t1
  reason: Article titles and the lead line of Article 2 ('the following definitions
    apply') carry no rule of their own. Deferred so every unit of the pinned extract
    is accounted for.
  consequence: 'None for a caller: a title or a lead line carries no rule.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: redress_routes
  units:
  - 32023R2854#art4_p3
  - 32023R2854#art4_p3_a
  - 32023R2854#art4_p3_b
  - 32023R2854#art4_p9
  - 32023R2854#art4_p9_a
  - 32023R2854#art4_p9_b
  - 32023R2854#art5_p12
  - 32023R2854#art5_p12_a
  - 32023R2854#art5_p12_b
  reason: Art 4(3), 4(9) and 5(12) open complaint and dispute-settlement routes (Articles
    37 and 10, not pinned); they change no answer of this order.
  consequence: The order does not say how a user or third party may challenge a restriction
    or a refusal.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: verification_and_log_limits
  units:
  - 32023R2854#art4_p5
  - 32023R2854#art5_p4
  reason: Art 4(5) and 5(4) limit the information a data holder may ask for to verify
    a user or third party, and what it may keep; a separate duty this order does not
    answer.
  consequence: The order does not check what a data holder asked for or kept.
  declaration: not_an_exception
  debt: true
- what: duties_of_the_user_and_the_third_party
  units:
  - 32023R2854#art4_p10
  - 32023R2854#art4_p11
  - 32023R2854#art5_p5
  reason: Art 4(10) and 4(11) (the user may not use the data to develop a competing
    product, derive certain insights, or use coercive means) and 5(5) (the third party
    may not use coercive means) are duties of the requester, not conditions of the
    data holder's duty.
  consequence: The order does not answer whether a user or third party breached these
    limits.
  declaration: not_an_exception
  debt: true
- what: duties_of_the_data_holder_on_its_own_use
  units:
  - 32023R2854#art4_p4
  - 32023R2854#art4_p13
  - 32023R2854#art4_p14
  - 32023R2854#art5_p6
  reason: Art 4(4) (no unduly difficult choices), 4(13) and 4(14) (the data holder's
    own use of non-personal data and making them available to third parties) and 5(6)
    (no insights about the third party) are separate duties of the data holder that
    this order does not answer.
  consequence: The order does not check those duties.
  declaration: not_an_exception
  debt: true
- what: gatekeeper_conduct
  units:
  - 32023R2854#art5_p3_a
  - 32023R2854#art5_p3_b
  - 32023R2854#art5_p3_c
  reason: Points (a) to (c) of Art 5(3) list what a gatekeeper shall not do (solicit,
    incentivise, receive); the order reads only that a gatekeeper is not an eligible
    third party.
  consequence: The order does not answer whether a gatekeeper breached points (a)
    to (c).
  declaration: not_an_exception
  debt: true
- what: data_subject_rights_unaffected
  units:
  - 32023R2854#art5_p8
  - 32023R2854#art5_p13
  reason: Art 5(8) and 5(13) keep the data subject's rights under the data protection
    law unaffected; they add no condition to the sharing duty answered here.
  consequence: None for the answers of this order; a data subject's own rights are
    not read.
  declaration: not_an_exception
  debt: true
- what: contractual_terms_not_binding
  units:
  - 32023R2854#art7_p2
  reason: Art 7(2) makes contractual terms that exclude or vary the user's rights
    not binding on the user; this order takes the caller's facts as given and reads
    no contract term against it.
  consequence: A caller who relies on a contract term against the user's rights must
    check Art 7(2).
  declaration: not_an_exception
  debt: true
- what: manner_timing_notifications_and_written_decisions
  units:
  - 32023R2854#art4_p1
  - 32023R2854#art5_p1
  - 32023R2854#art4_p2
  - 32023R2854#art4_p7
  - 32023R2854#art4_p8
  - 32023R2854#art5_p10
  - 32023R2854#art5_p11
  partial: true
  debt: true
  reason: 'These units are formalised for whether the duty arises or the ground applies;
    their other parts are not: the manner and timing of making data available in Art
    4(1) and 5(1) (and Articles 8 and 9 named by Art 5(1)); the duty to notify the
    competent authority in Art 4(2), 4(7), 4(8), 5(10) and 5(11); and the written,
    substantiated decision and its content in Art 4(7), 4(8), 5(10) and 5(11).'
  consequence: An answer says whether a duty arises or a ground applies; it does not
    check the manner, timing, written decision or notification.
  declaration: not_an_exception

excluded_set:
- what: enterprise_size_classes
  instrument: Commission Recommendation 2003/361/EC, Annex Arts 2 and 3
  cites:
  - 32003H0361#annex_art_2
  - 32003H0361#annex_art_3
  reason: Art 7(1) reads the micro, small and medium-sized classes and the partner
    and linked enterprises of the Recommendation, which is not pinned; the caller
    states the exemption as the judgement small_enterprise_exemption_applies.
  consequence: The order does not compute an enterprise's size class; the caller does.
- what: data_protection_conditions
  instrument: Regulation (EU) 2016/679 Arts 6 and 9; Directive 2002/58/EC Art 5(3)
  cites:
  - 02016R0679-20160504#art_006
  - 02016R0679-20160504#art_009
  - 02002L0058-20091219#art5_p3_s1
  reason: Art 4(12) and 5(7) make personal data of someone other than the user available
    only on those conditions; they are not pinned here. The caller states them as
    the judgement gdpr_conditions_for_making_available_met.
  consequence: The order does not check the legal basis; the caller does.
- what: trade_secret_definition
  instrument: Directive (EU) 2016/943 Art 2(1) and (2)
  cites:
  - 32016L0943#art_002
  reason: Art 2(18) and (19) of the Data Act define 'trade secret' and 'trade secret
    holder' by that Directive, which is not pinned; whether data are identified as
    trade secrets is the caller's fact.
  consequence: The order does not test whether data are trade secrets.
- what: gatekeeper_designation
  instrument: Regulation (EU) 2022/1925 Art 3
  cites:
  - 32022R1925#art_003
  reason: Art 5(3) reads a designation as gatekeeper under that Article, not pinned
    here; the caller states it as the judgement third_party_is_designated_gatekeeper.
  consequence: The order does not check a designation; the caller does.
- what: chapter_iii_onward_and_penalties
  instrument: Regulation (EU) 2023/2854 Arts 8 to 50 (outside the units read), in
    particular Arts 8, 9, 10, 37 and 40
  cites:
  - 32023R2854#art8
  - 32023R2854#art9
  - 32023R2854#art10
  - 32023R2854#art37
  - 32023R2854#art40
  reason: Chapter III onward (the conditions and compensation for making data available,
    dispute settlement, competent authorities, penalties) is outside this order's
    scope (reading (1)).
  consequence: An answer says nothing about compensation, fair terms, authorities
    or penalties.
- what: national_law
  instrument: Member States' laws on penalties and procedure under Regulation (EU)
    2023/2854
  cites:
  - 32023R2854#art40
  reason: National rules (the penalties Member States lay down under Art 40) are not
    pinned and are not read. The cite is the Regulation's penalties article, which
    is not in this order's pin.
  consequence: A caller checks the applicable national law, a matter for a lawyer.
