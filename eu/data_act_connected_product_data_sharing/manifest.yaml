# attributes (the twenty-two profile keys, the judgement value unsure and
# the two pre_contract_contract_kind atoms). An export list holds only
# name/arity entries, so these are listed here and not in any :- module list.
root_atoms:
  - "connected_product_or_related_service"
  - "small_enterprise_exemption_applies"
  - "placed_on_market_after_12_september_2026"
  - "data_accessible_by_default_as_required"
  - "directly_accessible_where_relevant_and_feasible"
  - "pre_contract_contract_kind"
  - "required_information_provided_before_contract"
  - "requester_is_user"
  - "request_by_or_on_behalf_of_user"
  - "addressee_is_data_holder"
  - "requested_data_readily_available"
  - "data_directly_accessible_by_user"
  - "security_restriction_agreed_applies"
  - "testing_data_not_yet_on_market"
  - "third_party_use_contractually_permitted"
  - "third_party_is_designated_gatekeeper"
  - "other_persons_personal_data_requested"
