  # -- citations.clausal --
  - "citation/2"
  # -- data_act_connected_product_data_sharing.clausal --
  - "product_design_duty_status/3"
  - "pre_contract_information_duty_status/3"
  - "user_access_request_status/3"
  - "third_party_sharing_request_status/3"
  - "decide_data_act_connected_product_data_sharing/2"
  - "data_act_connected_product_data_sharing_status/2"
  - "data_act_connected_product_data_sharing_checklist/2"
  - "data_act_connected_product_data_sharing_decision_resolvable/1"
  - "data_act_connected_product_data_sharing_status_values/1"
  # -- queries.clausal --
  - "data_act_connected_product_data_sharing_profile_keys/1"
  - "data_act_connected_product_data_sharing_input_problems/2"
