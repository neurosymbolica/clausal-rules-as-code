  - 32024R1774#art_014
  - 32024R1774#art_015
  - 32024R1774#art_016
  - 32024R1774#art_017
  - 32024R1774#art_022
  - 32024R1774#art_023
  - 32024R1774#art_024
  - 32024R1774#art_025
  - 32024R1774#art_026
  - 32024R1774#art_027
  reason: Not pinned in this domain. The other articles of RTS Title II, among them
    the logging of Article 12 that the retention period of Art 21 touches, are formalised
    in their own orders (readings (7), (15), (20)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q20)).
- what: rts_simplified_framework
  instrument: Delegated Regulation (EU) 2024/1774 Title III, Articles 28 to 41
  cites:
  - 32024R1774#art_028
  - 32024R1774#art_029
  - 32024R1774#art_030
  - 32024R1774#art_031
  - 32024R1774#art_032
  - 32024R1774#art_033
  - 32024R1774#art_034
  - 32024R1774#art_035
  - 32024R1774#art_036
  - 32024R1774#art_037
  - 32024R1774#art_038
  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. Title III sets the simplified ICT risk management
    framework of the DORA Article 16(1) entities, for which this order answers simplified_framework_entity
    (reading (2)).
  consequence: The order gives none of the Title III duties (open question (Q2)).
- what: date_of_application
  instrument: Delegated Regulation (EU) 2024/1774 Article 42
  cites:
  - 32024R1774#art_042
  reason: Not pinned in this domain. The RTS applies from 17 January 2025; the order
    answers on the RTS as it applies and reads no date (reading (17)).
  consequence: No answer depends on a date (open question (Q17)).
