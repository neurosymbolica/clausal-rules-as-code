# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The domain imports only kit modules (formalize_lib), no
# shared backbone package.
uses: []

scope: "For ONE financial entity presupposed to be within the scope of DORA:
  which of the thirty-six duties of Commission Delegated Regulation (EU) 2024/1774
  Articles 18 (physical and environmental security policy), 19 (ICT security
  elements of the human resource policy), 20 (identity management) and 21 (access
  control) apply to it, whether it has performed all of them, and which are
  outstanding; with DORA Article 16(1), first subparagraph, as the gate that
  takes the entities it lists out of these Title II duties (simplified_framework_entity).
  Each duty is a caller judgement (true, false, unsure); an unsure judgement that
  decides is handed to a lawyer (needs_legal_review). Out of scope: whether the
  entity is a financial entity in scope (DORA Articles 2 and 3), who is an Article
  16(1) entity and the simplified framework (DORA Article 16(1) second subparagraph,
  16(2), 16(3); RTS Title III), DORA Articles 4 to 15, the other RTS articles and
  the date of application."

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 of 13 March 2024 supplementing Regulation (EU) 2022/2554 with regulatory technical standards specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework (CELEX 32024R1774, original OJ text), Articles 18, 19, 20 and 21"
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), Article 16(1), first subparagraph"

query_interface:
  2: "dora_rts_physical_hr_identity_and_access_status/2"             # eligibility: the complete query's verdict
  7: "dora_rts_physical_hr_identity_and_access_checklist/2"          # justification: cite(...) per checklist item
  13: "dora_rts_physical_hr_identity_and_access_compliance_check/3"  # compliance_check: one duty in the current state
  16: "dora_rts_physical_hr_identity_and_access_what_if/4"           # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_018
  - 32024R1774#art_020
  - 32022R2554#art_016
  reason: The headings of RTS Articles 18 and 20 and of DORA Article 16 carry no rule
    of their own (the heading units of RTS Articles 19 and 21 hold lead words and
    are cited).
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 of DORA do not apply
    to the entities it lists), is formalised as the gate of every query (reading (2)).
    Not formalised: who those entities are, which the caller states, and the lead
    words of the second subparagraph, which introduce the duties of the simplified
    ICT risk management framework; those are the subject of the order on proportionality
    and the simplified framework.'
  consequence: simplified_framework_entity says only that RTS Articles 18 to 21 do
    not apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, among them the protection of
    relevant physical components and infrastructures (point (a)), and DORA Art 16(2)
    requires that framework to be documented and reviewed. They bind only the entities
    of Article 16(1), for which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (reading (20)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); scope and entity types are formalised
    in the order on scope and entity types.
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4 and Delegated Regulation (EU) 2024/1774
    Article 1
  cites:
  - 32022R2554#art_004
  - 32024R1774#art_001
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (16)).
  consequence: No duty is removed for size (open question (Q16)).
- what: dora_ict_risk_management
  instrument: Regulation (EU) 2022/2554 Articles 5 to 15
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  - 32022R2554#art_009
  - 32022R2554#art_010
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_013
  - 32022R2554#art_014
  - 32022R2554#art_015
  reason: Not pinned in this domain. RTS Title II specifies DORA Articles 5 to 15
    (adopted under Article 15); Art 18(1), 21(f)(i) and 21 name the classification
    of DORA Article 8(1), and Art 20(1) and 21 specify the control of access management
    rights of DORA Article 9(4)(c). They are formalised in the DORA orders on ICT
    risk management (readings (14), (15), (20)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q15)).
- what: other_rts_title_ii_articles
  instrument: Delegated Regulation (EU) 2024/1774 Articles 2 to 17 and 22 to 27
  cites:
  - 32024R1774#art_002
  - 32024R1774#art_003
  - 32024R1774#art_004
  - 32024R1774#art_005
  - 32024R1774#art_006
