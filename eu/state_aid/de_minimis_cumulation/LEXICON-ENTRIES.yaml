# Domain-local lexicon sidecar for eu/state-aid/de-minimis-cumulation.
# Phase-2b pass-2 (VOCABULARY): declares the domain's public decision terminal.
# The verdict values eligible/ineligible/indeterminate are the tier-1 `_shared`
# terminal triple (covered globally in _lexicon/terms.yaml) and take NO per-module
# terms entry. The proposition MEANING lives on the public decision predicate
# de_minimis_verdict/3; the render composes "{de_minimis_verdict proposition}: {verdict}"
# (e.g. "…EUR 300 000 ceiling: meets the criteria"). See _tools/public_terminals_schema.md.

public_terminals:
  - de_minimis_verdict

terms:
  de_minimis_verdict: {en: "de minimis aid cumulated over the rolling 3-year window against the EUR 300 000 ceiling (Reg (EU) 2023/2831 Art 3(2))"}
