  text: 5. For the purposes of the ceiling laid down in paragraph 2, aid shall be
    expressed as a cash grant. All figures used shall be gross, that is, before any
    deduction of tax or other charge. When aid is granted in a form other than a grant,
    the aid amount shall be the gross grant equivalent of the aid.
