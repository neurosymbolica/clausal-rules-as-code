  id: 32023R2831#parag_003.009
  state: GREY
  text: 9. If one undertaking splits into two or more separate undertakings, de minimis
    aid granted before the split shall be allocated to the undertaking that benefited
    from it, which is in principle the undertaking taking over the activities for
    which the de minimis aid was used. If such an allocation is not possible, the
    de minimis aid shall be allocated proportionately on the basis of the book value
    of the equity capital of the new undertakings at the effective date of the split.
