  text: 8. In the case of mergers or acquisitions, all prior de minimis aid granted
    to any of the merging undertakings shall be taken into account when determining
    whether any new de minimis aid to the new or the acquiring undertaking exceeds
    the ceiling laid down in paragraph 2. De minimis aid lawfully granted before the
    merger or acquisition shall remain lawful.
