scope: "For one aid measure (a scheme, individual aid under a scheme, or ad hoc
  aid) and the undertaking receiving it, the GENERAL conditions of Chapter I of
  Commission Regulation (EU) No 651/2014 (GBER) in the text applicable from 1 July
  2023: scope and exclusions (Art 1(2) to (5), with Art 2(18)), a slice of eleven
  notification thresholds (Art 4(1) rows (c), (d), (e), (i)(i) to (iv), (i)(vi),
  (l), (m), (n), (s), with Art 8(1)), transparency (Art 5), incentive effect
  (Art 6) and cumulation (Art 8(3) and 8(5)), each answered alone and joined under
  Art 3. No answer says that aid is exempted: Chapter III, Art 9 (publication),
  the computation of amounts under Art 7, the other rows of Art 4(1), Art 8(4),
  8(6) and 8(7) are not tested. Open-textured judgements (excluded schemes, export
  aid, separation of activities, undertaking in difficulty, violation of Union law,
  the general transparency test) are handed to a lawyer when unsure; the size of
  the undertaking comes from the SME order's answer, passed by the caller."

sources:
  - "Commission Regulation (EU) No 651/2014 of 17 June 2014 declaring certain
    categories of aid compatible with the internal market in application of
    Articles 107 and 108 of the Treaty (General Block Exemption Regulation), OJ L
    187, 26.6.2014, p. 1; consolidated text 02014R0651-20230701 (as amended up to
    Regulation (EU) 2023/1315), Chapter I: Art 1(2) to (5), Art 2(18), Art 3,
    Art 4(1), Art 5, Art 6, Art 8(1), 8(3) and 8(5); definitions Art 2(2), 2(23),
    2(24), 2(26) and 2(28) read by the readings."

