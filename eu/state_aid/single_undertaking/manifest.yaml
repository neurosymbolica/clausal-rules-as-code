# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports only the kit (formalize_lib, library(reif),
# library(clpz)), no shared backbone package.
uses: []

scope: "Commission Regulation (EU) 2023/2831 (de minimis aid), Art 2(2): the definition
  of a single undertaking, its lead-in, points (a) to (d) and its closing sentence.
  Three questions are decided: whether one enterprise has a relationship of points
  (a) to (d) over another (direct_relationship/3: majority of voting rights, tested
  exactly as 2 x held greater than total; the right to appoint or remove a majority
  of the body; the right to dominant influence by contract or articles; sole control
  of a majority of voting rights by agreement); whether two named enterprises belong
  to one single undertaking on the caller's list of relationships, directly or
  through one or more other enterprises (same_single_undertaking/3); and which
  enterprises form the single undertaking of one named enterprise
  (single_undertaking_members/4). Open-textured judgements (whether an entity is an
  enterprise, dominant influence, an unsure relationship) are handed to a lawyer as
  needs_legal_review; a missing fact is asked for as indeterminate. Out of scope:
  the ceiling of Art 3(2), amounts and the period of 3 years, the count per Member
  State, mergers and splits, the scope and sector exclusions of Art 1, the dates of
  Art 8, and every rule recitals (4) and (5) state beyond Art 2(2) as printed
  (natural persons, public bodies, the same Member State, the linked-enterprise
  criteria of Recommendation 2003/361/EC)."

sources:
  - "Commission Regulation (EU) 2023/2831 of 13 December 2023 on the application of Articles
    107 and 108 of the Treaty on the Functioning of the European Union to de minimis aid,
    OJ L, 2023/2831, 15.12.2023 (CELEX 32023R2831, the original act as published), Art
    2(2) lead-in, points (a), (b), (c) and (d) and closing sentence; recitals (4) and (5)
    quoted for readings only."

query_interface:
  3: "single_undertaking_status/2"      # status_determination: the facade verdict's Status
  7: "single_undertaking_checklist/2"   # justification: one item per point of Art 2(2), each with cite(Key)
  16: "single_undertaking_what_if/4"    # what_if: re-evaluate under an overridden key

