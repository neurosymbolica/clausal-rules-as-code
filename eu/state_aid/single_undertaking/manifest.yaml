    criteria selected from the definition of linked enterprises) is not formalised
    (open questions Q1 to Q4, Q9 and Q15).'
  consequence: The answers follow Art 2(2) as printed; a lawyer who reads the recitals
    as narrowing or widening it gets a different group (open questions Q1 to Q4, Q9
    and Q15).
