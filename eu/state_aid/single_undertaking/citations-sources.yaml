eu_reg_2023_2831_art_2_2:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2831"
  unit: "32023R2831#art2_p2"
  retrieved: 2026-11-14
  note: >-
    Art 2(2) lead-in: the definition of single undertaking as all enterprises having at
    least one of the listed relationships 'with each other' (read as either direction).
    Cited on every settled answer of the three queries.
eu_reg_2023_2831_art_2_2_a:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2831"
  unit: "32023R2831#art2_p2_a"
  retrieved: 2026-11-14
  note: >-
    Art 2(2)(a): a majority of the shareholders' or members' voting rights, read as more
    than half, tested exactly as 2 x held greater than total (no percentage, no rounding).
eu_reg_2023_2831_art_2_2_b:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2831"
  unit: "32023R2831#art2_p2_b"
  retrieved: 2026-11-14
  note: >-
    Art 2(2)(b): the right to appoint or remove a majority of the members of the
    administrative, management or supervisory body; the right counts whether or not used.
eu_reg_2023_2831_art_2_2_c:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2831"
  unit: "32023R2831#art2_p2_c"
  retrieved: 2026-11-14
  note: >-
    Art 2(2)(c): the right to exercise a dominant influence under a contract or the
    memorandum or articles of association; 'dominant influence' is undefined, so a caller
    judgement; an unsure judgement refers to a lawyer under this key.
eu_reg_2023_2831_art_2_2_d:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2831"
  unit: "32023R2831#art2_p2_d"
  retrieved: 2026-11-14
  note: >-
    Art 2(2)(d): two conditions, both needed: the holder is a shareholder or member, and
    it controls alone, by agreement with other shareholders or members, a majority of the
    voting rights.
eu_reg_2023_2831_art_2_t1:
  status: verified
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2831"
  unit: "32023R2831#art2_t1"
  retrieved: 2026-11-14
  note: >-
    Art 2(2) closing sentence: relationships of points (a) to (d) through one or more other
    enterprises; read as a chain of listed relationships in either direction. Cited when an
    enterprise of the answer is reached only through another enterprise.
