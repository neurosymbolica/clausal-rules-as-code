# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports none (only the kit: formalize_lib, kit/deadline_lib,
# library(reif), library(clpz)).
uses: []

scope: >-
  The maximum administrative fines of Article 64 of Regulation (EU) 2024/2847
  (the Cyber Resilience Act), with the date from which Article 64 applies
  (Article 71(2)) and the open-source software steward derogation of
  Art 64(10)(b). One query, administrative_fine_maximum/4, answers for one
  infringement, named by the provision infringed, at the date of the
  infringement: which tier of Art 64(2), (3) or (4) applies and the maximum
  fine in euro cents (the higher of the fixed amount and, for an undertaking,
  the percentage of its total worldwide annual turnover; the fixed amount at a
  tie; the half cent of 2,5 percent dropped); or that Article 64 does not yet
  apply (before 11 December 2027), does not list the provision, or does not
  apply to an open-source software steward (middle and lowest tiers only, on
  the printed reading of 'paragraphs 3 to 9'). Undertaking and steward status
  are the caller's tri-state judgements (unsure refers to a lawyer). Out of
  scope: the fine itself (Art 64(5)), whether the offender is within the
  Regulation's scope or bound by the provision, whether the provision was
  infringed, national application (Art 64(6) to (9)), and the relation to
  other fining regimes. Every reading is the drafter's, not a lawyer's; open
  questions Q1 (reach of Art 64(10)) and Q2 (fining conduct before
  11 December 2027) are named for a lawyer.

sources:
  - "Regulation (EU) 2024/2847 of the European Parliament and of the Council of 23 October 2024 on horizontal cybersecurity requirements for products with digital elements (Cyber Resilience Act), OJ L, 2024/2847, 20.11.2024 (CELEX 32024R2847, original OJ text as published, raw sha256 fe0cca4a0caec50e7cf5a91432b94a19b211f86be8584fdba56372bdcea571ed): Art 64(1), (2), (3), (4), (10) lead words and points (a) and (b)"
  - "Regulation (EU) 2024/2847, Art 3(14) (open-source software steward) and Art 3(48) (free and open-source software), read as the caller's judgement"
  - "Regulation (EU) 2024/2847, Art 71(2) (date of application: 11 December 2027)"

query_interface:
  2: "cra_administrative_fines_status/2"      # status verdict of a request
  7: "cra_administrative_fines_checklist/2"   # justification: one item per ground with cite(...) list
  16: "cra_administrative_fines_what_if/4"    # what_if: re-evaluate under an overridden key or date
  23: "administrative_fine_maximum/4"         # calculation: the cap in euro cents

deferred_set:
- what: headings_and_lead_words
  units:
  - 32024R2847#art_003
  - 32024R2847#art_064
  - 32024R2847#art_071
  reason: 'The headings of Articles 3, 64 and 71 and the lead words of Article 3 carry
    no rule of their own: they introduce the definitions and paragraphs, which are
    formalised, or deferred, one by one.'
  consequence: 'None for a caller: the answers come from the paragraphs.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: amount_of_the_fine_in_each_case
  units:
  - 32024R2847#parag_064.005
  - 32024R2847#point_064.005_a
  - 32024R2847#point_064.005_b
  - 32024R2847#point_064.005_c
  reason: Art 64(5) lists what is taken into account when the amount of a fine is
    decided in each individual case (nature, gravity and duration; earlier fines for
    a similar infringement; size and market share). The order gives the maximum only
    (reading (1)); the amount within it is the authority's weighing of all relevant
    circumstances, with no rule this order could compute.
  consequence: No answer gives a fine; every final answer is a maximum.
  declaration: answered_with_caveat
  debt: true
  open: not formalisable as a computation; the deferral stands for this run.
- what: communication_between_authorities
  units:
  - 32024R2847#parag_064.006
  reason: Art 64(6) requires market surveillance authorities that apply fines to communicate
    them to those of other Member States through the system of Article 34 of Regulation
    (EU) 2019/1020; it is a duty of the authorities with no bearing on the maximum.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: fines_on_public_bodies
  units:
  - 32024R2847#parag_064.007
  reason: Art 64(7) leaves to each Member State whether and to what extent fines may
    be imposed on public authorities and public bodies (reading (11), open question
    (Q8)).
  consequence: The order gives the Union maximum even for a public body; whether any
    fine applies to it is for national rules.
  declaration: answered_with_caveat
  not_formalized_because: national_law
- what: imposition_by_courts_or_other_bodies
  units:
  - 32024R2847#parag_064.008
  reason: Art 64(8) lets Member States have the fines imposed by competent national
    courts or other bodies, with equivalent effect; it says who imposes the fine,
    not its maximum (reading (11)).
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: fines_in_addition_to_other_measures
  units:
  - 32024R2847#parag_064.009
  reason: Art 64(9) allows fines in addition to other corrective or restrictive measures
    for the same infringement; it gives no output for a maximum (reading (12)).
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: derogation_lead_words
  units:
  - 32024R2847#parag_064.010
  reason: 'The lead words of Art 64(10) (''By way of derogation from paragraphs 3
    to 9, the administrative fines referred to in those paragraphs shall not apply
    to the following:'') are read in reading (7): they limit point (b) to the middle
    and lowest tiers, which THE LIMBS formalise through step (F4); no citation key
    names this unit. Whether ''paragraphs 3 to 9'' is a slip for ''paragraphs 2 to
    9'' is open question (Q1).'
  consequence: For a provision of the highest tier the steward judgement is not read
    and no derogation applies.
  declaration: answered_with_caveat
  debt: true
  open: a lawyer's question (Q1); to be revisited in a later change to the orders,
    not in this order's rules; the deferral stands for this run.
- what: micro_and_small_enterprise_early_warning_derogation
  units:
  - 32024R2847#point_064.010_a
  reason: Art 64(10)(a) exempts manufacturers that qualify as microenterprises or
    small enterprises with regard to a failure to meet the deadline of Article 14(2),
    point (a), or Article 14(4), point (a). On the literal reading of the lead words
    (reading (7)) it decides no answer, because those deadlines are obligations of
    Article 14, fined under paragraph 2, which the derogation does not name; the order
    has no key for it.
  consequence: A micro or small manufacturer that missed the 24-hour early-warning
    deadline gets the highest-tier maximum, not an exemption, on this reading (open
    question (Q1)).
  declaration: answered_with_caveat
  debt: true
  open: a lawyer's question (Q1); formalisable with two more keys if the reading changes;
    the deferral stands for this run.
- what: steward_definitions_read_as_the_callers_judgement
  units:
  - 32024R2847#point_003_14
  - 32024R2847#point_003_48
  reason: Art 3(14) defines open-source software steward and Art 3(48) free and open-source
    software. They are quoted for reading (8); whether the offender is a steward is
    the caller's judgement offender_is_open_source_software_steward, true, false or
    unsure.
  consequence: The order does not test the definition; the caller states the judgement.
  declaration: answered_with_caveat
  debt: true
  open: formalisable only as a judgement; the deferral stands for this run.
