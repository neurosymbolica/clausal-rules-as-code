    Highest tier: Annex I, Articles 13 and 14; 'up to EUR 15 000 000 or, if
    the offender is an undertaking, up to 2,5 % of the its total worldwide
    annual turnover ... whichever is higher' ('of the its' as printed).
    1500000000 cents; percentage turnover x 5 // 2 in cents, half cent dropped.
