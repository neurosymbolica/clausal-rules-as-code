  retrieved: 2026-11-18
  note: >-
    Date of application: 'This Regulation shall apply from 11 December 2027.'
    Article 64 applies from that day; an infringement dated earlier gives
    not_yet_applicable (reading (10)). The earlier dates for Article 14 and
    Chapter IV are read as dates for the obligations, not for Article 64 (Q2).
