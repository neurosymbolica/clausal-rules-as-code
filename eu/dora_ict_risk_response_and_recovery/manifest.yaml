# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports none (formalize_lib is the kit, not a backbone).
uses: []

scope: >-
  Regulation (EU) 2022/2554 (DORA), Articles 11 and 12, with Article 16(1), first
  subparagraph, as the gate of every query. For ONE financial entity the order
  answers which of the duties of ICT response and recovery (Article 11) and of backup,
  restoration and recovery (Article 12) apply to it (duties_required), whether it has
  performed all of them as the caller judges (duties_complete), and which of them are
  outstanding (duties_outstanding). An entity listed in Article 16(1), first
  subparagraph, is answered simplified_framework_entity. Out of scope and handed to
  sibling orders or a lawyer - whether the entity is a financial entity within the
  scope of the Regulation (Articles 2 and 3), the simplified ICT risk management
  framework (Article 16(1), second subparagraph, (2) and (3)), the guidelines of
  Article 11(11), Articles 5 to 10, 13, 14 and 17 to 20, and Commission Delegated
  Regulation (EU) 2024/1774. Whether a duty is performed, and how well, is the
  caller's open-textured judgement; an unsure judgement that decides is referred
  as needs_legal_review.

sources:
  - 'Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (Digital Operational Resilience Act, DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554, the original OJ text as published) - Article 11(1) to (10), Article 12(1) to (7), Article 16(1), first subparagraph'

query_interface:
  2: dora_ict_risk_response_and_recovery_status/2
  7: dora_ict_risk_response_and_recovery_checklist/2
  13: ict_risk_response_and_recovery_duties_complete/3
  16: dora_ict_risk_response_and_recovery_what_if/4

deferred_set:
- what: headings
  units:
  - 32022R2554#art_011
  - 32022R2554#art_012
  - 32022R2554#art_016
  reason: The headings of Articles 11, 12 and 16 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: cost_and_loss_guidelines
  units:
  - 32022R2554#parag_011.011
  reason: Art 11(11) requires the European Supervisory Authorities, through the Joint
    Committee, to develop common guidelines on the estimation of the aggregated annual
    costs and losses of Art 11(10). It binds the authorities, not the financial entity.
  consequence: The order does not check the estimate against the guidelines (reading
    (17)).
  declaration: not_an_exception
  not_formalized_because: institutional
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the entities
    it lists), is formalised as the gate of every query (reading (2)). Not formalised:
    who those entities are, which the caller states, and the lead words of the second
    subparagraph, which introduce the duties of the simplified ICT risk management
    framework; those are the subject of the order on proportionality and the simplified
    framework.'
  consequence: simplified_framework_entity says only that Articles 11 and 12 do not
    apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: Art 16(1), second subparagraph, points (a) to (h), list the duties of the
    simplified ICT risk management framework, among them business continuity plans
    with back-up and restoration measures (point (f)) and their testing (point (g)),
    and Art 16(2) requires that framework to be documented and reviewed. They bind
    only the entities of Article 16(1), for which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (reading (21)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of the Regulation is presupposed (reading (1)); the entity type atoms
    are those of the order on scope and entity types, which formalises Article 2 (reading
    (11)); the size class of Article 3(60) is the caller's statement (reading (4)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (16)).
  consequence: No duty is removed for size beyond the microenterprise rules (open
    question (Q16)).
- what: ict_risk_governance_and_framework
  instrument: Regulation (EU) 2022/2554 Articles 5 to 8
  cites:
  - 32022R2554#art_005
  - 32022R2554#art_006
  - 32022R2554#art_007
  - 32022R2554#art_008
  reason: Not pinned in this domain. Art 11(1) and 11(3) place the policy and the
    plans in the framework of Article 6(1), based on the identification of Article
    8; Articles 5 to 8 are formalised in the order on ICT risk governance and framework
    (reading (21)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q21)).
- what: ict_risk_protection_and_detection
  instrument: Regulation (EU) 2022/2554 Articles 9 and 10
  cites:
  - 32022R2554#art_009
  - 32022R2554#art_010
  reason: Not pinned in this domain. Articles 9 and 10 are formalised in the order
    on ICT risk protection and detection (reading (21)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q21)).
- what: ict_risk_learning_and_evolving
  instrument: Regulation (EU) 2022/2554 Article 13
  cites:
  - 32022R2554#art_013
  reason: Not pinned in this domain. Article 13 (learning and evolving) is formalised
    in its own order (reading (21)).
  consequence: complete and none_outstanding say nothing about that article (open
    question (Q21)).
- what: communication
  instrument: Regulation (EU) 2022/2554 Article 14
  cites:
  - 32022R2554#art_014
  reason: Not pinned in this domain. Art 11(2)(e), 11(6)(b) and 11(7) name the communication
    of Article 14; the order reads only the duties of Article 11 (reading (13)).
  consequence: The order does not test the communication against Article 14 (open
    question (Q13)).
- what: incident_management_classification_and_reporting
  instrument: Regulation (EU) 2022/2554 Articles 17 to 20
  cites:
  - 32022R2554#art_017
  - 32022R2554#art_018
  - 32022R2554#art_019
  - 32022R2554#art_020
  reason: Not pinned in this domain. Art 11(2)(e) names the reporting of Article 19
    and Art 11(10) the major ICT-related incidents classified under Article 18; incident
    management, classification and reporting are formalised in the order on incident
    reporting (readings (13), (15)).
  consequence: The order decides no report and no classification (open question (Q13)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. The Regulation applies from 17 January 2025;
    the order answers on the Regulation as it applies and reads no date (reading (18)).
  consequence: No answer depends on a date (open question (Q18)).
- what: ict_risk_management_technical_standards
  instrument: Regulation (EU) 2022/2554 Article 15 and Commission Delegated Regulation
    (EU) 2024/1774 (the ICT risk management tools, methods, processes and policies
    and the simplified framework)
  cites:
  - 32022R2554#art_015
  - 32024R1774#art_001
  reason: Not pinned in this domain. They specify the elements of Articles 11 and
    12 in detail; the order reads them as part of the caller's judgement (reading
    (17)).
  consequence: The order does not check the detail of the technical standards (open
    question (Q17)).
