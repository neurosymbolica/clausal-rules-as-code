  - 32022R2554#parag_002.002
  partial: true
  reason: Art 2(1), points (a) to (u), and Art 2(2) of the Regulation are read only
    for the categories of financial entities to which THE CRITERIA REGULATION refers
    (reading (5)), for which types of THE PROVIDER are financial entities (reading
    (2)) and for the kinds of points (g) to (j) (reading (9)). Which entities the
    Regulation applies to is not formalised here.
  consequence: No answer says whether an entity is within the scope of the Regulation;
    THE PROVIDER's type is the caller's statement (open question (Q15)).
  declaration: answered_with_caveat
  debt: true
  open: which entities the Regulation applies to is not formalised in this order;
