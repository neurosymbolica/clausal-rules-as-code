excluded_set:
- what: register_of_information
  instrument: Regulation (EU) 2022/2554 Article 28
  cites:
  - 32022R2554#art_028
  reason: Not pinned in this domain. The registers of information of Art 28(3), the
    data source of the ESAs (Article 6 of THE CRITERIA REGULATION), are formalised
    in the order on the register of information.
  consequence: 'None for these answers: the figures are the caller''s.'
- what: oversight_framework
  instrument: Regulation (EU) 2022/2554 Articles 32 to 44
  cites:
  - 32022R2554#art_032
  - 32022R2554#art_033
  reason: Not pinned in this domain. The Oversight Forum (Article 32) and the tasks
    and powers of the Lead Overseer (Articles 33 to 44) follow the designation.
  consequence: No answer says what oversight a designated provider is subject to.
- what: referenced_union_acts
  instrument: Directive 2013/36/EU Article 131; Treaty on the Functioning of the European
    Union Article 127(2); Regulations (EU) No 1093/2010, 1094/2010 and 1095/2010;
    Regulation (EU) 2022/2554 Article 46
  cites:
  - 32013L0036#art_131
  - 12016E#art_127
  - 32010R1093#art_001
  reason: Not pinned in this domain. The identification and scores of G-SIIs and O-SIIs,
    the oversight frameworks of Article 127(2) TFEU, the responsibilities of the ESAs
    and the competent authorities that identify systemic entities are the caller's
    facts and figures (readings (3), (8), (9), (14)).
  consequence: The answers take those facts and figures as given.
