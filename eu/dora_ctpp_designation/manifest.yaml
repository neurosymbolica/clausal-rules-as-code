- what: article_2_4_member_state_option
  units:
  - 32022R2554#parag_002.004
  partial: true
  reason: 'Art 2(4) of the Regulation is read only for reading (5): the institutions
    exempted pursuant to Directive 2013/36/EU, which Member States may exclude from
    the scope of the Regulation, are named in no point of Article 2(1) and so are
    no category; the Member States'' option and the information of the Commission
    are not formalised.'
  consequence: No answer says whether a Member State has excluded an entity from the
    scope of the Regulation; institution_exempted_pursuant_to_directive_2013_36 is
    no value of this order (reading (5)).
  declaration: answered_with_caveat
  debt: true
  open: the Member State option is not formalised in this order; the deferral stands
    for this order.
- what: definitions_read_through_the_caller
  units:
  - 32022R2554#point_003_19
  - 32022R2554#point_003_20
  - 32022R2554#point_003_32
  reason: Art 3, points (19) (ICT third-party service provider), (20) (ICT intra-group
    service provider) and (32) (institution exempted pursuant to Directive 2013/36/EU)
    are quoted for readings (2), (3) and (5). Whether THE PROVIDER meets the definitions
    of points (19) and (20) is the caller's statement (the type and the intra-group
    fact); point (32) only names the institutions that reading (5) finds in no point
    of Article 2(1).
  consequence: The answers take THE PROVIDER's type and the intra-group fact as given
    (open question (Q15)).
  declaration: answered_with_caveat
  debt: true
  open: the definitions are applied where an order reads the defined terms as its
