  state: GREEN
  text: 2. The contracting authorities shall indicate, in the contract notice or in
    the invitation to confirm interest, the objective and non-discriminatory criteria
    or rules they intend to apply, the minimum number of candidates they intend to
    invite and, where appropriate, the maximum number. In the restricted procedure
    the minimum number of candidates shall be five. In the competitive procedure with
    negotiation, in the competitive dialogue procedure and in the innovation partnership
    the minimum number of candidates shall be three. In any event the number of candidates
    invited shall be sufficient to ensure genuine competition. The contracting authorities
    shall invite a number of candidates at least equal to the minimum number. However,
    where the number of candidates meeting the selection criteria and the minimum
    levels of ability as referred to in Article 58(5) is below the minimum number,
    the contracting authority may continue the procedure by inviting the candidates
    with the required capabilities. In the context of the same procedure, the contracting
    authority shall not include economic operators that did not request to participate,
    or candidates that do not have the required capabilities.
