exclusions:
- cites:
  - 02014L0024-20260101#art_058
  consequence: '`qualified_candidates` is a bare integer this domain accepts on trust.
    A caller that applies Art 58 wrongly -- setting a disproportionate minimum turnover,
    or admitting a candidate who fails the minimum levels of ability -- feeds a wrong
    count, and every number this domain computes from it (the invitation floor, the
    below-minimum continuation limb, the fewer-invited defect) is then wrong, with
    nothing here able to detect it. The error is silent and total, not partial.'
  label: authorized
  reason: 'Art 58 is qualitative selection -- suitability to pursue the professional
    activity, economic and financial standing, technical and professional ability
    -- and Art 58(5) is the source of the "minimum levels of ability" that Art 65(2)
    third sub-paragraph names. THIS IS THE ONLY OUTBOUND CROSS-REFERENCE IN THE PINNED
    BYTES: the extract contains the literal string "as referred to in Article 58(5)"
    and no reference to any other Article. This domain never asks WHO qualifies; it
    takes the COUNT of those who do. Formalized separately in eu/procurement/selection_criteria.'
  what: selection_criteria_and_minimum_levels_of_ability
- cites:
  - 02014L0024-20260101#art_028
  - 02014L0024-20260101#art_029
  - 02014L0024-20260101#art_030
  consequence: 'This domain answers "how many" and never "who", "when" or "on what
    published basis in this particular procedure". A caller must run the procedure''s
    own Article for everything except the count: a shortlist of exactly five in a
    restricted procedure is compliant HERE while being unlawful under Art 28 for a
    reason this domain cannot see -- an invitation issued to an operator that never
    submitted a request, a time limit not observed, or a stage skipped. Nothing in
    the profile describes the procedure''s conduct, so no such defect can surface.'
  label: authorized
  reason: 'Arts 28, 29 and 30 are the restricted procedure, the competitive procedure
    with negotiation and the competitive dialogue. Each carries, in its own words,
    the INBOUND hook that switches this Article on: "Contracting authorities may limit
    the number of suitable candidates to be invited to participate in the procedure
    in accordance with Article 65." Each also governs everything else about invitation
    -- who may submit a tender or join the dialogue, the time limits, the stages --
    none of which is modelled here. Art 65 supplies the NUMBER and nothing else.'
  what: procedure_specific_invitation_regimes
- cites:
  - 02014L0024-20260101#art_031
  consequence: A caller must not read this domain's three-candidate floor for `innovation_partnership`
    as a floor on the number of PARTNERS. Art 65 constrains how many candidates are
    invited to participate; Art 31 expressly permits a partnership with ONE partner.
    A package that used this domain to reject a single-partner innovation partnership
    would be applying Art 65 to a question it does not reach.
  label: authorized
  reason: 'Art 31 is the innovation partnership''s own regime and carries the same
    INBOUND hook as Arts 28-30 ("Contracting authorities may limit the number of suitable
    candidates to be invited to participate in the procedure in accordance with Article
    65"). It is entered separately from them because it alone creates a second, easily-confused
    number: Art 31(1) lets the authority "set up the innovation partnership with one
    partner or with several partners", which is a rule about PARTNERS AFTER AWARD,
    not about candidates before invitation.'
  what: innovation_partnership_regime
- cites:
  - 02014L0024-20260101#art_026
  consequence: This domain reads `procedure_type_key` as given and never asks whether
    the authority was entitled to run that procedure. A restricted procedure used
    where Art 26 permitted only an open one still receives a perfectly ordinary Art
    65 verdict here, including a five-candidate floor that has no lawful basis because
    the procedure itself has none.
  label: authorized
  reason: 'Art 26 governs which procedure a contracting authority may use, and in
    what circumstances. THE STATUTE DRAWS NO TEXTUAL LINK EITHER WAY: Art 65 does
    not mention Art 26 and Art 26 does not mention Art 65 -- both checked against
    the consolidated act. The boundary is conceptual, not a cross-reference, and is
    recorded as such rather than dressed up as one. Art 65(1)''s list of four procedures
    presupposes the choice has already been made lawfully.'
  what: choice_of_procedure
- cites:
  - 02014L0024-20260101#art_034
  consequence: 'This is the sharpest edge on this domain and it is UNDETECTABLE FROM
    INSIDE. Art 34(2) first sentence makes a DPS follow "the rules of the restricted
    procedure", so a DPS profile is naturally spelled with `procedure_type_key: restricted_procedure`
    -- whereupon this domain will impose a five-candidate floor, permit a limitation,
    and report defects, all of which Art 34(2) forbids. The profile carries no DPS
    flag and cannot be given one without pinning Art 34, so a DPS procurement MUST
    NOT BE ROUTED TO THIS DOMAIN AT ALL. Under the sibling''s chosen `prohibits_any_cap`
    reading the mis-routing is worse, not better: this domain would report a declared
    maximum as lawful whenever it sits above the declared minimum, while Art 34(2)
    condemns any declared maximum at all. The caller owns that routing decision; nothing
    here can notice the mistake.'
  label: authorized
  reason: 'Art 34(2) second sentence reaches INTO this Article in terms: "All the
    candidates satisfying the selection criteria shall be admitted to the system,
    and the number of candidates to be admitted to the system shall not be limited
    in accordance with Article 65." WHAT THAT SENTENCE DOES IS ITSELF CONTESTED, and
    it is not this domain''s question to settle: the concurrently-commissioned eu/procurement/dynamic_purchasing_system
    domain registers it as operative reading `art_34_2_number_limitation` and chooses
    `prohibits_any_cap` (any declared maximum on admissions is defective, whatever
    basis is named for it) over `disapplies_article_65_only`. THIS DOMAIN IS CONSISTENT
    WITH THAT CHOICE AND DOES NOT RE-DECIDE IT: on either reading, Art 65 shortlisting
    is unavailable in a dynamic purchasing system, which is the only proposition this
    entry needs. The stronger chosen reading only widens the exclusion.'
  what: dynamic_purchasing_systems
- cites:
  - 02014L0024-20260101#art_056
  consequence: 'This domain answers the Art 65 question ONCE, at the invitation stage,
    over counts. Art 56(1)(b) asks it again at award, about ONE tenderer and about
    the CONTENT of the published rules rather than their presence -- which is the
    same objectivity limb this domain expressly does not model. A caller that treats
    a `limitation_permitted` verdict here as discharging Art 56(1)(b) is wrong: this
    domain has not looked at the winning tenderer at all, and has not assessed whether
    the published rules were non-discriminatory.'
  label: authorized
  reason: 'Art 56(1)(b) reaches INTO this Article at the AWARD stage: a contract may
    be awarded only where the tender "comes from a tenderer that is not excluded in
    accordance with Article 57 and that meets the selection criteria set out by the
    contracting authority in accordance with Article 58 and, where applicable, the
    non-discriminatory rules and criteria referred to in Article 65." So Art 65 compliance
    is re-asked as a condition of award, on the winning tenderer, after this domain
    has finished. This entry was NOT in the commissioning brief''s list and was found
    by grepping the act.'
  what: award_stage_conditions
- cites:
  - 02014L0024-20260101#art_059
  - 02014L0024-20260101#art_060
  consequence: '`qualified_candidates` here is a count of candidates ALREADY DETERMINED
    to meet the selection criteria; this domain inspects no evidence and revisits
    no determination. Where the count rests on ESPD self-declarations and a supporting
    document later contradicts one, the true count falls retrospectively -- possibly
    from at-or-above the minimum to below it, which moves the verdict from `limitation_permitted`
    to `continuation_permitted` and changes the floor. This domain has no mechanism
    to revisit its answer; the caller must re-run it on the corrected count.'
  label: authorized
  reason: Arts 59-60 govern how an economic operator EVIDENCES that it meets the conditions
    -- the European Single Procurement Document as an updated self-declaration, and
    the means of proof. Art 59(1)(c) reaches INTO this Article expressly ("where applicable,
    it fulfils the objective rules and criteria that have been set out pursuant to
    Article 65"); ART 60 DOES NOT MENTION ART 65 and is cited here as a scope boundary
    only, which is stated so the register is not read as claiming a cross-reference
    the act does not contain.
  what: espd_preliminary_evidence
- cites:
  - 02014L0024-20260101#art_066
  consequence: 'Art 66''s own "genuine competition" sentence -- "In the final stage,
    the number arrived at shall make for genuine competition in so far as there are
    enough tenders, solutions or qualified candidates" -- is NOT this domain''s genuine_competition_not_ensured
    limb, and the two must not be wired to one profile key. A staged negotiation that
    lawfully reduces tenders under Art 66 is outside this domain entirely: `invited_candidates`
    here is the number invited to tender or to conduct a dialogue, counted ONCE at
    the invitation stage, and this domain models no stages at all.'
  label: authorized
  reason: 'Art 66 is the neighbouring Article in the same subsection ("Subsection
    2 -- Reduction of numbers of candidates, tenders and solutions") and is the one
    most easily confused with this one. NEITHER ARTICLE CITES THE OTHER -- checked
    both ways -- so the boundary is one of subject-matter: Art 66 reduces the number
    of TENDERS to be negotiated (Art 29(6)) or SOLUTIONS to be discussed (Art 30(4)),
    by applying the AWARD criteria; Art 65 reduces the number of CANDIDATES to be
    invited, by applying the SELECTION criteria. Different object, different criteria,
    different stage.'
  what: reduction_of_the_number_of_tenders_and_solutions
