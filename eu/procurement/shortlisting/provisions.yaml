operative_readings:
- attested: null
  authority: none
  awaiting_review: true
  chosen: unlawful_declaration
  label: authorized
  question: Art 65(2) first sub-paragraph obliges the contracting authority to indicate
    the minimum number of candidates it intends to invite; the second sub-paragraph
    fixes that minimum at five in the restricted procedure and three in the other
    three. Where an authority indicates a minimum BELOW the statutory one -- three
    candidates in a restricted procedure -- has it made an UNLAWFUL DECLARATION, so
    that the limitation it has configured is prohibited outright and no reduction
    is available at all, or merely an INOPERATIVE one, so that the statutory five
    substitutes silently and the procedure runs on lawfully at five?
  rationale: 'Art 65(2) sub-para 1''s duty is to indicate the minimum number the authority
    "intend[s] to invite", and sub-para 2 fixes what that minimum "shall be". A published
    figure below the floor is therefore a breach of the publication duty and not merely
    a mis-statement of a number the Directive supplies anyway: the sentence''s function
    is to let economic operators decide whether to request to participate, so the
    harm lands before any invitation is issued and substituting the correct figure
    afterwards cannot undo it. The reading is also the CONSERVATIVE one -- it reports
    a defect where the rival reports none -- which is the right default for a domain
    with no controlling authority. Its cost is stated plainly: it makes an authority
    that published three and then invited eight nonetheless defective, which the rival
    reading would not.'
  readings:
  - consequence: 'The declaration is a defect. STATUS is `limitation_prohibited`,
      DEFECT_IDS carries `declared_minimum_below_statutory_minimum`, and NUMBER_TO_INVITE
      is the FULL qualified count: with no lawful limitation available, every candidate
      meeting the selection criteria must be invited. A tenderer excluded from the
      shortlist has a defect to point at and the authority cannot cure it by inviting
      five after the fact, because what it published is what candidates relied on
      when deciding whether to request to participate.'
    conservative: true
    id: unlawful_declaration
  - consequence: The declaration is a nullity as to the number only. No defect is
      reported, STATUS is whatever the corrected minimum yields, and NUMBER_TO_INVITE
      is the STATUTORY five or three. The authority shortlists five and the procedure
      is clean; the under-declaration becomes invisible in the record, and a candidate
      who did not request to participate because it read "minimum three" and judged
      its chances poor has no defect to point at.
    id: inoperative_declaration
  reviewed: false
  units:
  - 02014L0024-20260101#parag_065.002
  what: art_65_2_declared_minimum_below_statutory_minimum
- attested: null
  authority: none
  awaiting_review: true
  chosen: declared_minimum
  label: authorized
  question: 'Art 65(2) third sub-paragraph: "where the number of candidates meeting
    the selection criteria and the minimum levels of ability as referred to in Article
    58(5) is below THE MINIMUM NUMBER, the contracting authority may continue the
    procedure by inviting the candidates with the required capabilities." Which minimum
    is "the minimum number" -- the one the authority INDICATED under sub-para 1 (which
    may be higher than the statutory floor), or the STATUTORY five or three of sub-para
    2?'
  rationale: '"The minimum number" is a definite reference and its nearest antecedent
    is the immediately preceding sentence of the SAME sub-paragraph: "The contracting
    authorities shall invite a number of candidates at least equal to the minimum
    number" -- which is unarguably the number indicated under sub-para 1, since that
    is the number sub-para 1 obliges them to publish. The "However" that opens the
    continuation sentence marks it as the exception to that immediately preceding
    duty, so it must be measured against the same figure. The rival reading also produces
    an absurdity the Directive plainly does not intend: an authority that voluntarily
    set a HIGHER minimum than the law requires would be worse off than one that set
    the floor, because the relief the sentence exists to give would be unavailable
    to it. NOT conservative-flagged: neither reading is systematically stricter --
    the chosen one relieves the authority more readily, the rival reports a defect
    more readily, and which is "safer" depends on whose interest is in issue.'
  readings:
  - consequence: 'The continuation limb opens whenever the qualified count falls below
      the authority''s OWN published minimum. A restricted procedure that published
      a minimum of eight and attracted six qualified candidates is in the continuation
      limb: STATUS is `continuation_permitted`, the floor is six, and inviting six
      is compliant. The authority is not trapped by its own ambition.'
    id: declared_minimum
  - consequence: 'The continuation limb opens only below five (or three). The same
      procedure -- published minimum eight, six qualified -- is NOT in the continuation
      limb, because six is at or above the statutory five, so the sub-para 1 duty
      to invite at least the published minimum stands unrelieved: the floor is eight,
      inviting six is `fewer_invited_than_minimum_number`, and the authority must
      either invite eight candidates it does not have or abandon the procedure.'
    id: statutory_minimum
  reviewed: false
  units:
  - 02014L0024-20260101#parag_065.002
  what: art_65_2_minimum_number_referent
- attested: null
  authority: none
  awaiting_review: true
  chosen: coextensive
  label: authorized
  question: The continuation sentence permits the authority to continue "by inviting
    the candidates with THE REQUIRED CAPABILITIES", and the following sentence bars
    it from including "candidates that do not have the required capabilities". Is
    that set the SAME as "the candidates meeting the selection criteria and the minimum
    levels of ability as referred to in Article 58(5)" named earlier in the same sentence,
    or a NARROWER set -- those who, over and above meeting the Art 58 selection criteria,
    are actually capable of performing this contract?
  rationale: 'The sentence''s own subject is "the number of candidates meeting the
    selection criteria and the minimum levels of ability as referred to in Article
    58(5)"; "the candidates with the required capabilities" appears in the SAME sentence
    as the thing the authority may invite, and reading it as a different set would
    give the authority a selection power the Directive confers nowhere and would let
    it defeat Art 65''s minima by declaring candidates capable-but-not-capable-enough.
    Art 58(5) is precisely where the "required conditions of participation ... expressed
    as minimum levels of ability" live, which makes the two phrases two names for
    one Art 58 test. STATED PLAINLY BECAUSE IT MATTERS FOR THE MEASUREMENT: this choice
    is made in the INPUT CONTRACT, not in a rule. The rejected reading needs a profile
    key this domain does not have, so NO perturbation over this domain''s input space
    can discriminate between the two -- the sealed oracle''s rival-reading battery
    covers the other two readings and CANNOT cover this one. The only discriminator
    is the profile-key set itself.'
  readings:
  - consequence: One number describes the candidate pool. The profile carries a single
      `qualified_candidates` key, the continuation floor is that count, and "shall
      not include candidates that do not have the required capabilities" is the same
      bar as "did not meet the selection criteria", expressed from the other side.
      The prohibition adds nothing to the arithmetic and exists to stop the authority
      topping up a short shortlist with candidates it has already rejected.
    id: coextensive
  - consequence: 'Two numbers describe the pool, and the INPUT CONTRACT changes: the
      profile would need a second key, the count of candidates with the required capabilities,
      always at most `qualified_candidates`. The continuation floor would be that
      smaller count, and the authority would hold a residual capability judgement
      over and above Art 58 that it could exercise to shrink the shortlist further
      -- which is exactly the "unrestricted freedom of choice" the Directive elsewhere
      forbids, but which this sentence''s separate wording arguably contemplates.'
    conservative: true
    id: narrower
  reviewed: false
  units:
