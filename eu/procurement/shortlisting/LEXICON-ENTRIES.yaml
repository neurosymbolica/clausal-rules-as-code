limitation_not_available:
  definition: >-
    The procedure type is not one of the four named in Art 65(1)
    (restricted, competitive with negotiation, competitive dialogue,
    innovation partnership). Art 65 confers no power to limit candidate
    numbers in this procedure; no Art 65 duty or defect applies.
  source: "Directive 2014/24/EU, Art 65(1)"

limitation_prohibited:
  definition: >-
    At least one of the eight Art 65(2) defect limbs fires. The
    contracting authority may not reduce the number of candidates
    it invites below the computed floor; every defect is reported.
  source: "Directive 2014/24/EU, Art 65(2)"

continuation_permitted:
  definition: >-
    No defect limb fires, but the number of qualified candidates is
    below the declared minimum. The authority MAY (not must) continue
    the procedure by inviting the candidates with the required
    capabilities. This is a permission, not an obligation.
  source: "Directive 2014/24/EU, Art 65(2) sub-para 3, sentence 2"

limitation_permitted:
  definition: >-
    No defect limb fires and the number of qualified candidates
    meets or exceeds the declared minimum. The authority may lawfully
    limit the number of candidates it invites to the declared minimum.
  source: "Directive 2014/24/EU, Art 65(1), Art 65(2) sub-para 3 sentence 1"
