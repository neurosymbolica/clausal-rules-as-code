# Citation sourcing manifest for eu/procurement/shortlisting.
# Instrument: Directive 2014/24/EU (public procurement), CELEX 32014L0024,
# consolidated CELEX 02014L0024-20260101, Article 65 (Reduction of the number
# of otherwise qualified candidates to be invited to participate).
#
# SOURCE OF RECORD IS THIS DOMAIN'S OWN PIN, not a web page and not a mirror:
#   sources/02014L0024-20260101-art065.fmx4.xml
#   sha256 97407c001e90251b35cbbc7490119e0aaa5e373d6e6e4a0048ab2c0be3b3be6a
# cut from CL2014L0024EN0060010.0001.xml
#   sha256 d732f7f9a547b315289cd7447c33f73ce63a3797ed299e4dad4ff3066e157772
# retrieved 2026-08-20 from
#   http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4
#
# WHY `verified` RATHER THAN THE PROCUREMENT FAMILY'S `unverified`. All six
# wave-1 eu/procurement domains mark every citation `unverified` with an empty
# verbatim, which is legal and which keeps the provision layer's T5
# verbatim-fidelity check silent on them. This domain pins its statute, so the
# text is on disk and hashed and there is nothing left to be unverified ABOUT.
# Every `verbatim` below was SLICED PROGRAMMATICALLY out of the named unit's own
# run in the pinned extract and asserted to be a substring of it -- not typed
# from a rendering -- so T5's containment check has something real to bite on.
#
# ONE RUN, SEVEN ATOMS. `parag_065.002` is a SINGLE unit carrying a SINGLE run:
# the whole of Art 65(2), all three sub-paragraphs, is one contiguous stretch of
# the document. Six of the seven atoms below therefore name the SAME unit and
# differ only in which sentence of it they quote. That is not a duplication to
# be tidied away -- Art 65(2) states six separate rules in six sentences, and a
# single citation atom for the paragraph would make T12 unanswerable (a green
# registry proving only that SOMETHING in the paragraph was quoted, not that the
# quoted sentence supports the clause that cites it).
#
# NEVER QUOTE ACROSS A RUN BOUNDARY. It does not arise here -- each of the three
# units of this extract has exactly ONE run -- but the rule stands for any
# re-cut: joining discontiguous runs fabricates an adjacency the statute does not
# have, and T5 and the label resolver are CONTAINMENT tests that would pass it.
#
# OBLIGATION ON WHOEVER AUTHORS `citations.clausal` AT STAGE 02a: each `verbatim`
# must be copied into the `citation/2` record BYTE-EXACT. check_citations.py only
# checks that a verified record's ref and verbatim are NON-EMPTY -- it will not
# notice a paraphrase. T5 will, but only once a provisions ledger is built.
#
# T12: a green citation registry does not mean the provision quoted SUPPORTS what
# cites it. Each `covers:` field states which rule of this domain the quoted
# sentence is the authority for; check it by reading, per clause.

eu_dir_2014_24_art_65_1:
  status: verified
  unit: "02014L0024-20260101#parag_065.001"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(1) (the power to limit the number of candidates, and the four procedures in which it exists)"
  retrieved: 2026-08-20
  covers: >-
    The Art 65(1) gate. `statutory_minimum_candidates/2` has a row for exactly
    the four procedures this sentence names and NO SOLUTION for the other two,
    and `shortlisting_limitation_modality/4` answers limitation_not_available
    for those two. Also the proviso -- the power is available only where the
    minimum number of qualified candidates is available.
  verbatim: "In restricted procedures, competitive procedures with negotiation, competitive dialogue procedures and innovation partnerships, contracting authorities may limit the number of candidates meeting the selection criteria that they will invite to tender or to conduct a dialogue, provided the minimum number, in accordance with paragraph 2, of qualified candidates is available."

eu_dir_2014_24_art_65_2_indication:
  status: verified
  unit: "02014L0024-20260101#parag_065.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(2) first sub-paragraph (what must be indicated in the contract notice or invitation to confirm interest)"
  retrieved: 2026-08-20
  covers: >-
    Three defect limbs:
    objective_and_non_discriminatory_criteria_not_indicated,
    minimum_number_not_indicated, and declared_maximum_below_declared_minimum
    (the maximum this sentence makes optional -- 'where appropriate' -- which
    is why a declared maximum of zero means none was declared rather than a
    maximum of zero).
  verbatim: "The contracting authorities shall indicate, in the contract notice or in the invitation to confirm interest, the objective and non-discriminatory criteria or rules they intend to apply, the minimum number of candidates they intend to invite and, where appropriate, the maximum number."

eu_dir_2014_24_art_65_2_minima:
  status: verified
  unit: "02014L0024-20260101#parag_065.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(2) second sub-paragraph, first two sentences (the minimum is five in the restricted procedure and three in the other three)"
  retrieved: 2026-08-20
  covers: >-
    The two statutory constants, keyed to procedure type:
    `statutory_minimum_candidates(restricted_procedure, 5)` and the three rows
    at 3. Also the declared_minimum_below_statutory_minimum defect limb.
  verbatim: "In the restricted procedure the minimum number of candidates shall be five. In the competitive procedure with negotiation, in the competitive dialogue procedure and in the innovation partnership the minimum number of candidates shall be three."

eu_dir_2014_24_art_65_2_genuine_competition:
  status: verified
  unit: "02014L0024-20260101#parag_065.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(2) second sub-paragraph, final sentence (sufficient to ensure genuine competition)"
  retrieved: 2026-08-20
  covers: >-
    The genuine_competition_not_ensured defect limb. This sentence is an OPEN-
    TEXTURED OVERLAY on top of the hard numeric floor and is carried by the
    atomic input number_invited_sufficient_for_genuine_competition; no crisp
    test for it is derived from the counts. 'In any event' is why the limb is
    evaluated for every profile in which Art 65 is engaged, not only where the
    numeric limbs pass.
  verbatim: "In any event the number of candidates invited shall be sufficient to ensure genuine competition."

eu_dir_2014_24_art_65_2_invitation_floor:
  status: verified
  unit: "02014L0024-20260101#parag_065.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(2) third sub-paragraph, first sentence (invite at least the minimum number)"
  retrieved: 2026-08-20
  covers: >-
    The obligation limb: `shortlisting_invitation_floor/4`'s NUMBER_TO_INVITE
    and the fewer_invited_than_minimum_number defect. 'At least equal to' is
    INCLUSIVE -- a shortlist exactly at the floor complies.
  verbatim: "The contracting authorities shall invite a number of candidates at least equal to the minimum number."

eu_dir_2014_24_art_65_2_continuation:
  status: verified
  unit: "02014L0024-20260101#parag_065.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(2) third sub-paragraph, second sentence (the below-minimum continuation permission)"
  retrieved: 2026-08-20
  covers: >-
    The continuation_permitted modality. 'MAY continue' is a PERMISSION, never
    an obligation, which is why it has its own modal atom rather than folding
    into limitation_permitted. This sentence also carries the Art 58(5) cross-
    reference that fixes what 'qualified' counts, and the phrase 'the
    candidates with the required capabilities' whose set identity is the
    registered operative reading art_65_2_required_capabilities_set_identity.
  verbatim: "However, where the number of candidates meeting the selection criteria and the minimum levels of ability as referred to in Article 58(5) is below the minimum number, the contracting authority may continue the procedure by inviting the candidates with the required capabilities."

eu_dir_2014_24_art_65_2_prohibition:
  status: verified
  unit: "02014L0024-20260101#parag_065.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 65(2) third sub-paragraph, third sentence (the prohibition on including non-requesting operators or incapable candidates)"
  retrieved: 2026-08-20
  covers: >-
    `shortlisting_inclusion_modality/2` and the two defect limbs
    non_requesting_economic_operator_included and
    candidate_without_required_capabilities_included. 'SHALL NOT include' is
    an absolute PROHIBITION, not a factor: either limb alone defeats the
    limitation.
  verbatim: "In the context of the same procedure, the contracting authority shall not include economic operators that did not request to participate, or candidates that do not have the required capabilities."
