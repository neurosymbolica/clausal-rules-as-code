# Parameter sourcing manifest for eu/procurement/shortlisting.
#
# EMPTY AT THE BASELINE, AND THAT IS THE FINDING, NOT AN OMISSION.
#
# `parameters.clausal` is the TRANSPOSITION / IMPLEMENTATION SEAM -- the place a
# Member State's or an implementing act's choices land. It is NOT the place for
# Directive figures.
#
# ARTICLE 65 CARRIES EXACTLY TWO FIGURES, AND NEITHER IS A SEAM. Art 65(2)
# second sub-paragraph fixes the minimum number of candidates at FIVE in the
# restricted procedure and at THREE in the competitive procedure with
# negotiation, the competitive dialogue and the innovation partnership. Both are
# HARMONISED Directive constants: Art 65 delegates nothing to Member States, sets
# no band inside which a Member State may choose, and refers to no implementing
# or delegated act. They are therefore statutory VALUE TABLE rows in the
# determination slice -- `statutory_minimum_candidates/2`, a PUBLIC predicate the
# sealed oracle probes directly -- and not parameters.
#
# THE UNIT IS IN THE NAME, DELIBERATELY (trap T3). A ground numeric fact with
# neither a statute-reference comment nor a unit-suffixed functor does not fire
# `check_parameters.py`'s numeric signal at all, and an untraced legal value then
# ships with no provenance while the gate stays green. `..._candidates` is the
# unit suffix here -- a plain non-negative COUNT OF CANDIDATES. There are no
# euro-cents, no percentages, no basis points and no periods in this domain, so
# `*_eur_cents` / `*_percent` / `*_bps` / `*_days` do not appear and their absence
# is a fact about Article 65, not an omission.
#
# EVERY OTHER NUMBER THIS DOMAIN HANDLES IS CALLER DATA, not a statutory
# constant: declared_minimum_candidates, declared_maximum_candidates,
# qualified_candidates and invited_candidates all arrive in the profile.
#
# Convention chosen, and it is a choice: this domain ships an EMPTY
# `-module(parameters, [])` plus this sidecar, which is what all six wave-1
# eu/procurement domains do. The alternative -- `parameters: none  # <reason>` in
# manifest.yaml -- satisfies the same gate and has zero users corpus-wide.
# Following the family keeps the wave-3 domains consistent with the six that
# exist. Do not do both.
#
# NO SEAM IS RECORDED HERE BECAUSE ARTICLE 65 HAS NONE. That is worth stating
# rather than leaving to inference: Art 67(2) has one (the Member-State
# restriction on price-only awards) and Art 57 has several, so an empty seam here
# is a substantive finding about this provision. If a transposition pack later
# discovers a national rule raising the minimum above five or three -- a Member
# State may impose stricter national procurement rules in some respects -- it
# would be expressed here as a seam predicate keyed on procedure type, and the
# determination slice would take the greater of the seam value and the Directive
# value. This baseline package does NOT model that and must not be read as
# having ruled it out.
#
# For an exported predicate whose table is EMPTY at the baseline, use the
# guarded-false stub idiom -- the engine needs at least one compiled clause per
# exported predicate:
#
#   national_minimum_candidates_override(_PROCEDURE_TYPE, _MINIMUM_CANDIDATES) <- (False),
#
# and add its entry below with status, ref, label and (if verified) verbatim.
# The key set of this file must equal the `parameter_source/2` key set in
# parameters.clausal EXACTLY, and every key must be a real fact functor that
# appears as `<name>(` in a NON-parameters.clausal file of this domain.
#
# status: verified (ref + verbatim + label all non-empty; the verbatim is an
#         exact substring of the source at ref and states the value in source
#         units) | unverified (verbatim MUST be empty)
#
# INTENTIONALLY EMPTY. Do not add a placeholder entry to make this file look
# populated: `check_parameters.py` compares this key set against
# parameters.clausal's `parameter_source/2` key set for EQUALITY, so an invented
# key fails the gate rather than satisfying it.
