operative_readings:
- attested: null
  authority: none
  awaiting_review: true
  chosen: points_ii_and_iii_only
  label: expansion
  question: The Art 50(c) proviso reads "The exceptions set out in points (ii) and
    (iii) shall only apply when no reasonable alternative or substitute exists and
    the absence of competition is not the result of an artificial narrowing down of
    the parameters of the procurement". Does it also condition point (i), a unique
    work of art or artistic performance?
  rationale: The sentence names points (ii) and (iii) and no others. This is the clearest
    textual signal in the article, and Directive 2014/24 Art 32(2)(b) attaches its
    identical proviso the same way -- one of the genuine points of continuity between
    the two instruments.
  readings:
  - consequence: A unique work of art is a complete ground on `only_particular_ operator_can_perform`
      alone. The proviso's own words name two points and the drafter listed them,
      so naming a third would be re-drafting.
    id: points_ii_and_iii_only
  - consequence: Every sole-operator plea would additionally need no reasonable alternative
      and no artificial narrowing. Stricter, and it would catch an entity commissioning
      a bespoke artwork to escape competition -- but it reads a restriction into a
      sentence that enumerates its own targets.
    conservative: true
    id: all_three_sub_points
  reviewed: false
  units:
  - 02014L0025-20260101#point_050_c/1
  - 02014L0025-20260101#point_050_c_i
  what: proviso_attaches_to_points_ii_and_iii_only
- attested: null
  authority: none
  awaiting_review: true
  chosen: limits
  label: expansion
  question: Four grounds open with a contract type -- "in the case of supply contracts"
    (e), "for supplies" (g) and (h), "where the service contract concerned" (j). Are
    those words a LIMIT on the ground's availability, or a description of the usual
    case?
  rationale: The article names a contract type in exactly four of ten grounds. A reading
    on which that choice changes nothing cannot explain why the drafter made it four
    times and not ten or zero. The permissive reading is also the one that expands
    a derogation, which cuts against the settled rule that derogations from the obligation
    to compete are strictly interpreted.
  readings:
  - consequence: A ground pleaded outside its type is unavailable however well its
      other conditions are made out, so contract_type_key is decisive on four of the
      ten grounds.
    id: limits
  - consequence: The type words would constrain nothing and the four grounds would
      be available for any contract. More permissive -- it would let an entity plead
      the bargain-purchase ground for a works contract -- and it would make the drafter's
      decision to name a type in four grounds and not in the other six meaningless.
    conservative: false
    id: descriptive
  reviewed: false
  units:
  - 02014L0025-20260101#point_050_e
  - 02014L0025-20260101#point_050_g
  - 02014L0025-20260101#point_050_h
  - 02014L0025-20260101#point_050_j
  what: contract_type_words_are_jurisdictional_limits
- attested: null
  authority: none
  awaiting_review: true
  chosen: plea_governs
  label: expansion
  question: If the entity pleads ground X and X is not made out, but the conditions
    of some other ground Y happen to be satisfied on the same facts, is the use lawful?
  rationale: The justification an entity files names a ground, and review of it is
    review of THAT ground; the burden of establishing a derogation lies on the party
    relying on it. Treating any latent ground as a save would also mean an entity
    that pleaded nothing coherent could be rescued by a ground it never invoked and
    may not have evidenced. RECORDED AS CONTESTABLE because an administrative court
    applying the objective-lawfulness of the award, rather than reviewing the stated
    reasons, might well take the other view.
  readings:
  - consequence: '`use_unlawful`. The verdict answers the ground actually relied on,
      and the interface returns `n_a` for GROUND. A reviewer can always re-run the
      domain pleading Y.'
    id: plea_governs
  - consequence: '`use_lawful` on Y. More permissive, and it would make the profile''s
      pleaded_ground_key inert -- the domain would answer "is ANY ground made out",
      which is a different question from the one an award notice''s justification
      poses.'
    conservative: false
    id: any_available_ground_saves_it
  reviewed: false
  units:
  - 02014L0025-20260101#art_050
  what: the_pleaded_ground_governs
- attested: null
  authority: none
  awaiting_review: true
  chosen: definitions
  label: expansion
  question: Art 50(a) is followed by two sentences defining when a tender, and when
    a request to participate, is "not suitable". Are those additional cumulative conditions
    of the ground, or definitions of the finding the ground already requires?
  rationale: The sentences are drafted as definitions ("shall be considered not to
    be suitable where...") and they define a term the ground uses, rather than adding
    a requirement to it. Treating them as limbs would import the Arts 78/80 determinations
    this domain defers, which would make the ground undecidable on the facts the profile
    carries.
  readings:
  - consequence: The ground has two conditions -- unsuitability and unaltered initial
      conditions -- and the definitions fix what the first one MEANS. The profile
      carries one finding, `no_suitable_tenders_or_requests_received`.
    id: definitions
  - consequence: The profile would carry separate findings for irrelevance, manifest
      incapability, exclusion under Arts 78(1)/80(1) and failure of selection criteria,
      each independently required. Stricter, and it would make the ground harder to
      establish -- but it would also require this domain to decide Arts 78/80 questions
      it explicitly defers.
    conservative: true
    id: additional_limbs
  reviewed: false
  units:
  - 02014L0025-20260101#point_050_a
  what: the_unsuitability_sentences_are_definitions_not_limbs
