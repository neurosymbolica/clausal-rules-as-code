#
# EVERY `verbatim` BELOW WAS EMITTED BY THE READER, NOT TYPED. This file was generated
# by reading `_tools/provisions/units.py` runs out of the pinned bytes and writing them
# straight to YAML, and each was checked for containment in its own run before the file
# was written. That removes the whole class of error where a hand-copied quote drifts
# from the statute -- `check_citations.py` only checks a verified record's ref and
# verbatim are NON-EMPTY and would not notice a paraphrase.
#
# ONE UNIT, TWO CITATION ATOMS, AND A RUN SELECTOR. `point_050_c` is a TWO-RUN unit: run
# 0 is the sole-operator chapeau and run 1 is the proviso that applies to points (ii) and
# (iii) only, with the three sub-points sitting between them as units of their own. They
# are cited separately (`..._art_50_c` and `..._art_50_c_proviso`) and the proviso's unit
# selector carries `/1`, because quoting the unit whole would join two spans the
# Directive separates -- the prohibition procedure_choice records.
#
# THE ARTICLE 32 WARNING IS IN THE `covers` FIELDS ON PURPOSE. Points (e), (f), (b) and
# (h) each say where Directive 2014/24 Art 32 differs, so a later reader who reaches for
# the familiar sibling meets the difference at the point of use rather than in a commit
# message. See todo/utilities-art-50-is-not-a-near-verbatim-copy-of-art-32-2026-08-25.md.

eu_dir_2014_25_art_50_a:
  covers: Carries its own definition of an unsuitable tender and of an unsuitable request; those fix what
    the atomic input MEANS and are not extra limbs.
  label: Directive 2014/25/EU, Art 50(a) -- no or no suitable tenders or requests, initial conditions
    not substantially altered
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_a
  verbatim: (a) where no tenders or no suitable tenders or no requests to participate or no suitable requests
    to participate have been submitted in response to a procedure with a prior call for competition, provided
    that the initial conditions of the contract are not substantially altered; A tender shall be considered
    not to be suitable where it is irrelevant to the contract, being manifestly incapable, without substantial
    changes, of meeting the contracting entity’s needs and requirements as specified in the procurement
    documents. A request for participation shall be considered not to be suitable where the economic operator
    concerned is to be or may be excluded pursuant to Articles 78(1) or 80(1), or does not meet the selection
    criteria laid down by the contracting entity pursuant to Articles 78 or 80;
eu_dir_2014_25_art_50_b:
  covers: THREE cumulative conditions and NOT confined to supply contracts -- the point where Directive
    2014/24 Art 32(3)(a), which is supply-only and turns on 'quantity production', states a different
    test.
  label: Directive 2014/25/EU, Art 50(b) -- contract purely for research, experiment, study or development
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_b
  verbatim: (b) where a contract is purely for the purpose of research, experiment, study or development,
    and not for the purpose of securing a profit or of recovering research and development costs, and
    insofar as the award of such contract does not prejudice the competitive award of subsequent contracts
    which do seek, in particular, those ends;
eu_dir_2014_25_art_50_c:
  covers: The chapeau of the sole-operator ground. Its proviso is a SEPARATE run of the same unit and
    has its own citation atom.
  label: Directive 2014/25/EU, Art 50(c) -- the works, supplies or services can be supplied only by a
    particular economic operator
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: "02014L0025-20260101#point_050_c/1"
  verbatim: '(c) where the works, supplies or services can be supplied only by a particular economic operator
    for any of the following reasons:'
eu_dir_2014_25_art_50_c_i:
  covers: One of the three exhaustive reasons the sole-operator ground admits.
  label: Directive 2014/25/EU, Art 50(c)(i) -- sole-operator reason
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_c_i
  verbatim: (i) the aim of the procurement is the creation or acquisition of a unique work of art or artistic
    performance;
eu_dir_2014_25_art_50_c_ii:
  covers: One of the three exhaustive reasons the sole-operator ground admits.
  label: Directive 2014/25/EU, Art 50(c)(ii) -- sole-operator reason
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_c_ii
  verbatim: (ii) competition is absent for technical reasons;
eu_dir_2014_25_art_50_c_iii:
  covers: One of the three exhaustive reasons the sole-operator ground admits.
  label: Directive 2014/25/EU, Art 50(c)(iii) -- sole-operator reason
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_c_iii
  verbatim: (iii) the protection of exclusive rights, including intellectual property rights.
eu_dir_2014_25_art_50_c_proviso:
  covers: THE DISCRIMINATING SENTENCE OF THIS GROUND. A unique work of art under (i) is not subject to
    it; attaching it to all three sub-points, or to none, is the most likely single error here.
  label: Directive 2014/25/EU, Art 50(c) proviso -- applies to points (ii) and (iii) ONLY
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: "02014L0025-20260101#point_050_c/2"
  verbatim: The exceptions set out in points (ii) and (iii) shall only apply when no reasonable alternative
    or substitute exists and the absence of competition is not the result of an artificial narrowing down
    of the parameters of the procurement;
eu_dir_2014_25_art_50_chapeau:
  covers: 'What makes the list closed, and what a use_unlawful verdict cites: no ground in it is made
    out. Note this unit is NOT a bare heading, unlike the Art 50 chapeau of Directive 2014/24.'
  label: Directive 2014/25/EU, Art 50 chapeau -- the exhaustive gateway
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#art_050
  verbatim: 'Contracting entities may use a negotiated procedure without prior call for competition in
    the following cases:'
eu_dir_2014_25_art_50_d:
  covers: 'Cumulative: the time limits cannot be met, the events were unforeseeable, and the circumstances
    are not attributable to the entity.'
  label: Directive 2014/25/EU, Art 50(d) -- extreme urgency brought about by unforeseeable events
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_d
  verbatim: (d) in so far as is strictly necessary where, for reasons of extreme urgency brought about
    by events unforeseeable by the contracting entity, the time limits laid down for open procedures,
    restricted procedures and negotiated procedures with prior call for competition cannot be complied
    with. The circumstances invoked to justify extreme urgency shall not in any event be attributable
    to the contracting entity;
eu_dir_2014_25_art_50_e:
  covers: SUPPLIES only, and the ground ENDS at 'operation and maintenance'. Directive 2014/24 Art 32(3)(b)
    adds a three-year general-rule duration cap; there is no such limit here and importing one manufactures
    a non-conformity.
  label: Directive 2014/25/EU, Art 50(e) -- supply contracts, additional deliveries by the original supplier
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_e
  verbatim: (e) in the case of supply contracts for additional deliveries by the original supplier which
    are intended either as a partial replacement of supplies or installations or as the extension of existing
    supplies or installations, where a change of supplier would oblige the contracting entity to acquire
    supplies having different technical characteristics which would result in incompatibility or disproportionate
    technical difficulties in operation and maintenance;
eu_dir_2014_25_art_50_f:
  covers: WORKS or SERVICES only. Directive 2014/24 Art 32(5) confines repetition to three years after
    the original contract; there is NO time window here.
  label: Directive 2014/25/EU, Art 50(f) -- repetition of similar works or services conforming to a basic
    project
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_f
  verbatim: (f) for new works or services consisting in the repetition of similar works or services assigned
    to the contractor to which the same contracting entities awarded an earlier contract, provided that
    such works or services conform to a basic project for which a first contract was awarded according
    to a procedure in accordance with Article 44(1). The basic project shall indicate the extent of possible
    additional works or services and the conditions under which they will be awarded. As soon as the first
    project is put up for tender, the possible use of this procedure shall be disclosed and the total
    estimated cost of subsequent works or services shall be taken into consideration by the contracting
    entities when they apply Articles 15 and 16;
eu_dir_2014_25_art_50_g:
  covers: SUPPLIES only. Single condition.
  label: Directive 2014/25/EU, Art 50(g) -- supplies quoted and purchased on a commodity market
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_g
  verbatim: (g) for supplies quoted and purchased on a commodity market;
eu_dir_2014_25_art_50_h:
  covers: SUPPLIES only. THIS GROUND HAS NO COUNTERPART IN DIRECTIVE 2014/24 ART 32 AT ALL -- a domain
    built by substitution from Art 32 could not express the pleaded ground.
  label: Directive 2014/25/EU, Art 50(h) -- bargain purchases
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_h
  verbatim: (h) for bargain purchases, where it is possible to procure supplies by taking advantage of
    a particularly advantageous opportunity available for a very short time at a price considerably lower
    than normal market prices;
eu_dir_2014_25_art_50_i:
  covers: SUPPLIES or SERVICES.
  label: Directive 2014/25/EU, Art 50(i) -- particularly advantageous conditions from a winding-up supplier
    or liquidator
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_i
  verbatim: (i) for purchases of supplies or services under particularly advantageous conditions from
    either a supplier which is definitively winding up its business activities or the liquidator in an
    insolvency procedure, an arrangement with creditors or a similar procedure under national laws or
    regulations;
eu_dir_2014_25_art_50_j:
  covers: SERVICES only.
  label: Directive 2014/25/EU, Art 50(j) -- service contract following a design contest
  ref: http://publications.europa.eu/resource/celex/02014L0025-20260101.ENG.fmx4
  retrieved: '2026-08-25'
  status: verified
  unit: 02014L0025-20260101#point_050_j
  verbatim: (j) where the service contract concerned follows a design contest organised in accordance
    with this Directive and is to be awarded, under the rules provided for in the design contest, to the
    winner or to one of the winners of that contest; in the latter case, all the winners shall be invited
    to participate in the negotiations.
