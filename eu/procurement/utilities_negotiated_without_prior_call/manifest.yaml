independence: tool_differential

# BACKBONE IMPORT OF THE CONTRACT-TYPE ATOMS. The rulebase, fixtures and queries import
# `works`, `supplies`, `services` from `eu.procurement.directive_2014_24.vocabulary`, which
# owns them as Directive 2014/24 concepts (that Directive's Art 4 scope rows). This domain
# is Directive 2014/25, whose contract-type words appear in Art 50 in their own right, so
# sharing the atoms treats the two Directives' categories as the same category -- a legal
# claim nobody here has checked. Declaring them locally instead would be a change to the
# rulebase, not to this file.
uses:
  - eu.procurement.directive_2014_24.vocabulary

scope: "EU Directive 2014/25/EU Article 50 -- may a contracting entity use the negotiated
  procedure WITHOUT a prior call for competition? The chapeau makes points (a) to (j) an
  exhaustive gateway; a pleaded ground makes the use lawful only if the article admits it
  for this contract type AND its own cumulative conditions are made out. Every evaluative
  limb is an atomic input finding and an absent finding is NOT established (fail closed).
  Answers lawfulness of the PROCEDURE CHOICE only -- never whether the award itself, the
  notice, or the conduct of any earlier procedure was lawful. Inputs must be complete
  (ground) and well typed: utilities_negotiated_without_prior_call_input_problem/2 names
  the first problem (unbound variable, missing pleaded ground, a non-atom selector, an
  unknown contract type, a present flag that is not exactly true or false), and every
  entry point then gives no answer."

sources:
  - "sources/02014L0025-20260101-art050.fmx4.xml -- Directive 2014/25/EU Art 50,
     consolidated 02014L0025-20260101, sha256
     4bcfc05971b631d1ead48a13a713b9e3bbc293b43815db58457a2bcbdf3e0815, spliced from
     CL2014L0025EN0060010.0001.xml (sha256 1ea78ff7...30d27b). FIRST 2014/25 pin in this
     corpus, so unlike the 2014/24 cuts the source hash has no independent second
     recording -- a re-fetch is the only corroboration."

query_interface:
  headline: "decide_utilities_negotiated_without_prior_call/2"
  what_if: "utilities_negotiated_without_prior_call_what_if/4"
  profile_keys: "utilities_negotiated_without_prior_call_profile_keys/1"

deferred_set:
  - what: unsuitability_determination_by_reference_to_arts_78_and_80
    units: ["02014L0025-20260101#point_050_a"]
    reason: "Art 50(a) defines an unsuitable REQUEST by reference to exclusion under Arts
      78(1)/80(1) or failure of the selection criteria laid down under Arts 78 or 80.
      Those are sibling determinations; here unsuitability is the atomic input the
      definition describes."
    consequence: "A caller must establish unsuitability itself, under Arts 78/80. This
      domain takes the finding as given and will report `use_lawful` on an (a) plea whose
      unsuitability claim would not survive those articles."

  - what: article_44_1_procedure_choice
    units: ["02014L0025-20260101#point_050_f"]
    reason: "Art 50(f) requires the first contract to have been awarded under a procedure
      in accordance with Article 44(1). Whether it was is a separate determination."
    consequence: "A caller must verify the earlier procedure itself. This domain reads
      `original_contract_followed_article_44_1_procedure` as an atomic finding and cannot
      detect a false one."

  - what: articles_15_and_16_estimated_value_aggregation
    units: ["02014L0025-20260101#point_050_f"]
    reason: "Art 50(f) requires the total estimated cost of subsequent works or services
      to be taken into consideration when the entity applies Arts 15 and 16. A
      threshold-aggregation duty attached to the ground, not a condition of it."
    consequence: "A caller must run the Arts 15-16 aggregation itself. Nothing here reads
      a value, so this domain cannot notice an entity that ignored it."

  - what: design_contest_conduct
    units: ["02014L0025-20260101#point_050_j"]
    reason: "Art 50(j) requires the contest to have been organised in accordance with this
      Directive and the award to follow the contest's own rules. The conduct of a design
      contest is a separate determination (cf. eu/procurement/design_contests for the
      Directive 2014/24 equivalent)."
    consequence: "A caller must check the contest's conduct itself; this domain reads it
      as an atomic finding."

  - what: national_transposition
    units: ["02014L0025-20260101#art_050"]
    reason: "A Member State may transpose narrower grounds or add procedural conditions.
      Directive level only."
    consequence: "A caller in a Member State with narrower grounds must apply those
      itself. This domain will report `use_lawful` on a ground the Directive allows and
      the national transposition does not."

excluded_set:
  - what: directive_2014_24_article_32
    cites: ["02014L0024-20260101#art_032"]
    instrument: "Directive 2014/24/EU (the public-sector Directive)"
    reason: "The public-sector Directive's equivalent gateway, already formalized as
      eu/procurement/negotiated_without_publication. A DIFFERENT article of a DIFFERENT
      instrument: measured over both pinned texts, `three years` occurs twice in Art 32
      and never in Art 50, Art 50(h) bargain purchases has no Art 32 counterpart, and the
      research grounds state different tests."
    consequence: "A caller must not use this domain to answer an Art 32 question, or the
      reverse. The two produce DIFFERENT answers on the same facts for the additional
      deliveries, repetition, research and bargain-purchase grounds -- and the difference
      is silent, because both return the same verdict vocabulary."

  - what: prior_call_for_competition_procedures
    cites: ["02014L0025-20260101#art_044"]
    reason: "Art 44 governs the procedures WITH a prior call for competition and the forms
      a call may take. This domain begins where that call is absent."
    consequence: "A caller must run Art 44 itself to establish that a call for competition
      was genuinely absent and that the earlier procedure (for grounds (a) and (f)) was
      what those grounds require."

  - what: qualification_and_selection
    cites: ["02014L0025-20260101#art_078", "02014L0025-20260101#art_080"]
    reason: "Arts 78 and 80 govern qualification and the selection criteria by reference
      to which Art 50(a) defines an unsuitable request."
    consequence: "A caller must run Arts 78/80 itself; see the
      `unsuitability_determination_by_reference_to_arts_78_and_80` deferral."

# Each of these is a reading this domain COMMITS TO and each is one a competent lawyer
# could contest. None is resolved in the ORDER's prose, so this domain remains
# FIRST-CONTACT class and carries no EPISTEMIC NOTE. `authority: none` throughout --
# COMMISSIONING.md H1 requires a human signature. They surface in _tools/review_queue.py.
operative_readings:
  - what: proviso_attaches_to_points_ii_and_iii_only
    units: ["02014L0025-20260101#point_050_c/1", "02014L0025-20260101#point_050_c_i"]
    question: "The Art 50(c) proviso reads \"The exceptions set out in points (ii) and
      (iii) shall only apply when no reasonable alternative or substitute exists and the
      absence of competition is not the result of an artificial narrowing down of the
      parameters of the procurement\". Does it also condition point (i), a unique work of
      art or artistic performance?"
    readings:
      - id: points_ii_and_iii_only
        consequence: "A unique work of art is a complete ground on `only_particular_
          operator_can_perform` alone. The proviso's own words name two points and the
          drafter listed them, so naming a third would be re-drafting."
      - id: all_three_sub_points
        conservative: true
        consequence: "Every sole-operator plea would additionally need no reasonable
          alternative and no artificial narrowing. Stricter, and it would catch an entity
          commissioning a bespoke artwork to escape competition -- but it reads a
          restriction into a sentence that enumerates its own targets."
    chosen: points_ii_and_iii_only
    rationale: "The sentence names points (ii) and (iii) and no others. This is the
      clearest textual signal in the article, and Directive 2014/24 Art 32(2)(b) attaches
      its identical proviso the same way -- one of the genuine points of continuity
      between the two instruments."
    authority: none

  - what: contract_type_words_are_jurisdictional_limits
    units: ["02014L0025-20260101#point_050_e", "02014L0025-20260101#point_050_g",
            "02014L0025-20260101#point_050_h", "02014L0025-20260101#point_050_j"]
    question: "Four grounds open with a contract type -- \"in the case of supply
      contracts\" (e), \"for supplies\" (g) and (h), \"where the service contract
      concerned\" (j). Are those words a LIMIT on the ground's availability, or a
      description of the usual case?"
    readings:
      - id: limits
        consequence: "A ground pleaded outside its type is unavailable however well its
          other conditions are made out, so contract_type_key is decisive on four of the
          ten grounds."
      - id: descriptive
        conservative: false
        consequence: "The type words would constrain nothing and the four grounds would
          be available for any contract. More permissive -- it would let an entity plead
          the bargain-purchase ground for a works contract -- and it would make the
          drafter's decision to name a type in four grounds and not in the other six
          meaningless."
    chosen: limits
    rationale: "The article names a contract type in exactly four of ten grounds. A
      reading on which that choice changes nothing cannot explain why the drafter made it
      four times and not ten or zero. The permissive reading is also the one that expands
      a derogation, which cuts against the settled rule that derogations from the
      obligation to compete are strictly interpreted."
    authority: none

  - what: the_pleaded_ground_governs
    units: ["02014L0025-20260101#art_050"]
    question: "If the entity pleads ground X and X is not made out, but the conditions of
      some other ground Y happen to be satisfied on the same facts, is the use lawful?"
    readings:
      - id: plea_governs
        consequence: "`use_unlawful`. The verdict answers the ground actually relied on,
          and the interface returns `n_a` for GROUND. A reviewer can always re-run the
          domain pleading Y."
      - id: any_available_ground_saves_it
        conservative: false
        consequence: "`use_lawful` on Y. More permissive, and it would make the profile's
          pleaded_ground_key inert -- the domain would answer \"is ANY ground made out\",
          which is a different question from the one an award notice's justification
          poses."
    chosen: plea_governs
    rationale: "The justification an entity files names a ground, and review of it is
      review of THAT ground; the burden of establishing a derogation lies on the party
      relying on it. Treating any latent ground as a save would also mean an entity that
      pleaded nothing coherent could be rescued by a ground it never invoked and may not
      have evidenced. RECORDED AS CONTESTABLE because an administrative court applying
      the objective-lawfulness of the award, rather than reviewing the stated reasons,
      might well take the other view."
    authority: none

  - what: the_unsuitability_sentences_are_definitions_not_limbs
    units: ["02014L0025-20260101#point_050_a"]
    question: "Art 50(a) is followed by two sentences defining when a tender, and when a
      request to participate, is \"not suitable\". Are those additional cumulative
      conditions of the ground, or definitions of the finding the ground already requires?"
    readings:
      - id: definitions
        consequence: "The ground has two conditions -- unsuitability and unaltered initial
          conditions -- and the definitions fix what the first one MEANS. The profile
          carries one finding, `no_suitable_tenders_or_requests_received`."
      - id: additional_limbs
        conservative: true
        consequence: "The profile would carry separate findings for irrelevance, manifest
          incapability, exclusion under Arts 78(1)/80(1) and failure of selection criteria,
          each independently required. Stricter, and it would make the ground harder to
          establish -- but it would also require this domain to decide Arts 78/80
          questions it explicitly defers."
    chosen: definitions
    rationale: "The sentences are drafted as definitions (\"shall be considered not to be
      suitable where...\") and they define a term the ground uses, rather than adding a
      requirement to it. Treating them as limbs would import the Arts 78/80 determinations
      this domain defers, which would make the ground undecidable on the facts the profile
      carries."
    authority: none

# ARMED 2026-09-05: 13 units, 0 unaccounted. The cross-instrument exclusion
# (Art 32 of Directive 2014/24) now NAMES its instrument, which is what makes a
