# COMMISSIONING TARGET, NOT A PRODUCED SURFACE. No `.clausal` exists yet: the rulebase is
# the producer's half and arrives via `clausify promote`. `public_interface` below is the
# shape the commission asks for; P3c re-authors it from what was actually built. Written
# out in full rather than stubbed because a name absent from `public_interface` is absent
# from the GENERATED facade (auto/pkginit.py).
#
# FIRST DIRECTIVE 2014/25 DOMAIN IN THIS CORPUS. Everything else under eu/procurement is
# Directive 2014/24. The two instruments are siblings and are NOT interchangeable -- see
# `uses:` below and todo/utilities-art-50-is-not-a-near-verbatim-copy-of-art-32-2026-08-25.md.

# Determination-slices layout. ONE legal determination, so ONE slice:
#   utilities_negotiated_without_prior_call.clausal -- Art 50: is the pleaded ground one
#     of the ten the chapeau admits, is it available for this contract type, and are its
#     own cumulative conditions made out? Owns the ten ground atoms, the three
#     contract-type atoms, the three sole-operator reason atoms, the two status atoms and
#     every atomic finding.
#
# kernel.clausal holds the result-shape constructor and nothing else.
