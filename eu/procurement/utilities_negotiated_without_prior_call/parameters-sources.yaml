# Parameter sourcing manifest for eu/procurement/utilities_negotiated_without_prior_call.
#
# EMPTY, AND THAT IS THE FINDING RATHER THAN AN OMISSION -- and here it is a finding with
# teeth, because the obvious sibling article is NOT empty.
#
# Article 50 of Directive 2014/25 carries NO FIGURE OF ANY KIND: no threshold, no
# percentage, no period, no cap, no date. Its ten grounds are made out on findings alone.
#
# THE CONTRAST IS THE POINT. Directive 2014/24 Article 32 -- the article a reader will
# reach for, and which this corpus already formalizes as
# eu/procurement/negotiated_without_publication -- carries TWO temporal figures:
#   Art 32(3)(b)  additional deliveries: "the duration of such contracts as well as that
#                 of recurrent contracts shall not, as a general rule, exceed three years"
#   Art 32(5)     repetition: "may be used only during the three years following the
#                 conclusion of the original contract"
# Measured over both pinned consolidated texts, the string `three years` occurs TWICE in
# Art 32 and ZERO times in Art 50, though Art 50(e) and Art 50(f) are the same two limbs.
# So an author who fills this file by analogy with the Art 32 domain will register a
# parameter the utilities Directive does not have, `parameters.clausal` will carry a
# three-year figure, and the rulebase will report `use_unlawful` on lawful awards.
#
# THIS FILE EXISTS TO SAY THAT THE ABSENCE IS DELIBERATE. See
# todo/utilities-art-50-is-not-a-near-verbatim-copy-of-art-32-2026-08-25.md.
#
# Convention: this domain ships an empty `-module(parameters, [])` plus this sidecar,
# which is what every existing eu/procurement domain does. The alternative
# (`parameters: none  # <reason>` in manifest.yaml) satisfies the same gate and has zero
# users corpus-wide. Do not do both.
