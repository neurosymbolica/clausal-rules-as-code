# =====================================================================
# PRE-2022 PERIODS -- added 2026-08-23.
#
# Why they were missing matters: the table began at 2022-01-01, so every
# contract awarded before then made art4_threshold/4 fail and decide_threshold
# yield no solution, on the gate every other procurement module depends on.
# Directive 2014/24/EU has applied since 18 April 2016.
#
# These figures are sourced more strongly than most entries above: the Formex
# text of each amending Regulation was fetched from CELLAR and its Article 1
# read verbatim, rather than a secondary summary. Route (the plain CELEX URL
# serves only an RDF NOTICE):
#   http://publications.europa.eu/resource/celex/<CELEX>.ENG.fmx4   -> notice
#   -> notice gives cellar/<uuid>.<manifestation>/DOC_2             -> the text
# =====================================================================

art4_threshold_value__works__2016_2017:
  status: verified
  value_eur: 5225000
  value_eur_cents: 522500000
  url: "http://publications.europa.eu/resource/celex/32017R2365.ENG.fmx4"
  retrieved: 2026-08-23
  celex: 32015R2170
  effective_from: 2016-01-01
  note: "READ FROM THE AMENDING INSTRUMENT, NOT FROM 32015R2170 ITSELF.
    Reg 2015/2170 could not be fetched -- every manifestation of that CELEX
    404s and its notice exposes none. But Reg 2017/2365 Art 1(1)(a) states
    verbatim: 'in point (a), the amount EUR 5225000 is replaced by EUR
    5548000'. An amending regulation reciting the amount it replaces is
    primary evidence of what Art 4(a) said immediately before 1 Jan 2018,
    which is exactly this period. Recorded so the weaker provenance is
    visible rather than implied: re-verify against 32015R2170 if it becomes
    reachable."

