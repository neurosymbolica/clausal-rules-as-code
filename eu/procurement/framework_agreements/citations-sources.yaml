# Citation sourcing manifest for eu/procurement/framework_agreements.
# Instrument: Directive 2014/24/EU (public procurement), CELEX 32014L0024,
# consolidated CELEX 02014L0024-20260101, Article 33 (Framework agreements).
#
# SOURCE OF RECORD IS THIS DOMAIN'S OWN PIN, not a web page and not a mirror:
#   sources/02014L0024-20260101-art033.fmx4.xml
#   sha256 707fc3dab41b3e351529cb3f331ceef7addaab9fb8a798aaa46c08ab67845b29
# cut from CL2014L0024EN0060010.0001.xml
#   sha256 d732f7f9a547b315289cd7447c33f73ce63a3797ed299e4dad4ff3066e157772
# retrieved 2026-08-20 from
#   http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4
#
# WHY `verified` RATHER THAN THE PROCUREMENT FAMILY'S `unverified`. The six
# pre-Wave-2 eu/procurement domains mark every citation `unverified` with an
# empty verbatim, which is legal and which keeps the provision layer's T5
# verbatim-fidelity check silent on them. This domain pins its statute, so the
# text is on disk and hashed and there is nothing left to be unverified ABOUT.
# Every `verbatim` below was taken from the parsed run of the named unit and
# checked to be an exact substring of it, mechanically, not by eye.
#
# TWO OBLIGATIONS THAT COME WITH THAT CHOICE, both on whoever authors
# `citations.clausal` at stage 02a:
#   1. Each `verbatim` must be copied into the `citation/2` record BYTE-EXACT.
#      check_citations.py only checks that a verified record's ref and verbatim
#      are NON-EMPTY -- it will not notice a paraphrase. T5 will, but only once
#      a provisions ledger is built.
#   2. NEVER quote across a RUN boundary. In THIS extract that risk does not
#      arise the way it did for Art 67: measured, every one of the 13 units has
#      exactly ONE run, even the three PARAGs that carry several <ALINEA>
#      subparagraphs (33(1), 33(2), 33(3)). So a subparagraph quote is a
#      substring of its unit's single run and `#parag_033.001/2` is OUT OF RANGE
#      rather than a way to address the definition sentence. Cite the PARAG.
#
# T12: a green citation registry does not mean the provision quoted SUPPORTS
# what cites it. Each `covers` field below states which limb of this domain the
# quoted sentence is the authority for; check it by reading, per clause.
#
# NOTE ON THE TEXT ITSELF, because a paraphrase in circulation differs from it.
# Art 33(1) as consolidated reads "in particular by the SUBJECT of the framework
# agreement", not "the subject-matter". And the 2004/18/EC Art 32(2) sentence
# "Contracting authorities may not use framework agreements improperly or in
# such a way as to prevent, restrict or distort competition" is NOT in Article
# 33 of this Directive at all -- see manifest.yaml
# operative_readings[anti_abuse_principle_is_not_an_operative_condition_of_art_33].

eu_dir_2014_24_art_33_1:
  status: verified
  unit: "02014L0024-20260101#parag_033.001"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(1) (framework agreements; the four-year term)"
  retrieved: 2026-08-20
  covers: >-
    The framework-term determination -- the four-year limit and its
    exceptional-case escape -- and the call-off award window, which rests on the
    definition sentence's "contracts to be awarded during a given period".
  verbatim: >-
    The term of a framework agreement shall not exceed four years, save in
    exceptional cases duly justified, in particular by the subject of the
    framework agreement.

eu_dir_2014_24_art_33_2:
  status: verified
  unit: "02014L0024-20260101#parag_033.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(2) (closed parties; no substantial modification of the framework's terms)"
  retrieved: 2026-08-20
  covers: >-
    The two closed-parties limbs -- the contracting authority must be clearly
    identified in the call for competition, the economic operator must be party
    to the framework as concluded -- and the no-substantial-modification limb.
  verbatim: >-
    Those procedures may be applied only between those contracting authorities
    clearly identified for this purpose in the call for competition or the
    invitation to confirm interest and those economic operators party to the
    framework agreement as concluded.

eu_dir_2014_24_art_33_3:
  status: verified
  unit: "02014L0024-20260101#parag_033.003"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(3) (single economic operator: within the limits of the terms laid down)"
  retrieved: 2026-08-20
  covers: >-
    The within-the-limits-of-the-terms limb, and its SCOPE: this sentence is why
    that limb is read only where the framework was concluded with a single
    economic operator.
  verbatim: >-
    Where a framework agreement is concluded with a single economic operator,
    contracts based on that agreement shall be awarded within the limits of the
    terms laid down in the framework agreement.

eu_dir_2014_24_art_33_4:
  status: verified
  units:
    - "02014L0024-20260101#parag_033.004"
    - "02014L0024-20260101#point_033.004_a"
    - "02014L0024-20260101#point_033.004_b"
    - "02014L0024-20260101#point_033.004_c"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(4) chapeau (several economic operators: one of the following ways)"
  retrieved: 2026-08-20
  covers: >-
    The route determination, and the reading that Art 33(4) is a CLOSED list --
    "shall be performed in one of the following ways". Also the limb that a
    single-operator framework cannot reopen competition, since Art 33(4) is what
    authorises a reopening and it is conditioned on more than one operator.
  verbatim: >-
    Where a framework agreement is concluded with more than one economic
    operator, that framework agreement shall be performed in one of the
    following ways:

eu_dir_2014_24_art_33_4_a:
  status: verified
  unit: "02014L0024-20260101#point_033.004_a"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(4)(a) (direct award without reopening competition)"
  retrieved: 2026-08-20
  covers: >-
    The two conditions on a direct award: the framework must set out all the
    terms, and the objective conditions for determining which operator performs
    must have been indicated in the procurement documents.
  verbatim: >-
    following the terms and conditions of the framework agreement, without
    reopening competition, where it sets out all the terms governing the
    provision of the works, services and supplies concerned and the objective
    conditions for determining which of the economic operators, party to the
    framework agreement, shall perform them; the latter conditions shall be
    indicated in the procurement documents for the framework agreement;

eu_dir_2014_24_art_33_4_b:
  status: verified
  unit: "02014L0024-20260101#point_033.004_b"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(4)(b) (partly without and partly with reopening of competition)"
  retrieved: 2026-08-20
  covers: >-
    The split-framework route and its two documentation limbs: the objective
    criteria governing the choice between the routes, and the specification of
    which terms may be subject to reopening.
  verbatim: >-
    The choice of whether specific works, supplies or services shall be acquired
    following a reopening of competition or directly on the terms set out in the
    framework agreement shall be made pursuant to objective criteria, which shall
    be set out in the procurement documents for the framework agreement. These
    procurement documents shall also specify which terms may be subject to
    reopening of competition.

eu_dir_2014_24_art_33_4_c:
  status: verified
  unit: "02014L0024-20260101#point_033.004_c"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(4)(c) (reopening competition where not all the terms are laid down)"
  retrieved: 2026-08-20
  covers: >-
    The reopening route, and the condition this domain reads as limiting it --
    "where not all the terms ... are laid down in the framework agreement" --
    which is what makes a reopening under a complete-terms, non-split framework
    a route Art 33(4) does not supply.
  verbatim: >-
    where not all the terms governing the provision of the works, services and
    supplies are laid down in the framework agreement, through reopening
    competition amongst the economic operators parties to the framework
    agreement.

eu_dir_2014_24_art_33_5:
  status: verified
  units:
    - "02014L0024-20260101#parag_033.005"
    - "02014L0024-20260101#point_033.005_a"
    - "02014L0024-20260101#point_033.005_b"
    - "02014L0024-20260101#point_033.005_c"
    - "02014L0024-20260101#point_033.005_d"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(5) chapeau (the reopened competition rests on the framework's terms)"
  retrieved: 2026-08-20
  covers: >-
    The same-terms limb, and the SCOPE of every Art 33(5) limb: this chapeau is
    why the six procedural conditions are read only on a competition referred to
    in points (b) and (c) of paragraph 4, and reach no direct award.
  verbatim: >-
    The competitions referred to in points (b) and (c) of paragraph 4 shall be
    based on the same terms as applied for the award of the framework agreement
    and, where necessary, more precisely formulated terms, and, where
    appropriate, other terms referred to in the procurement documents for the
    framework agreement, in accordance with the following procedure:

eu_dir_2014_24_art_33_5_a:
  status: verified
  unit: "02014L0024-20260101#point_033.005_a"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(5)(a) (written consultation of the operators capable of performing)"
  retrieved: 2026-08-20
  covers: "The written-consultation limb of a reopened competition."
  verbatim: >-
    for every contract to be awarded, contracting authorities shall consult in
    writing the economic operators capable of performing the contract;

eu_dir_2014_24_art_33_5_b:
  status: verified
  unit: "02014L0024-20260101#point_033.005_b"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(5)(b) (a sufficiently long time limit)"
  retrieved: 2026-08-20
  covers: >-
    The time-limit limb. Note that the provision names FACTORS and fixes no
    number, which is why sufficiency is an atomic input here and not a computed
    period.
  verbatim: >-
    contracting authorities shall fix a time limit which is sufficiently long to
    allow tenders for each specific contract to be submitted, taking into account
    factors such as the complexity of the subject-matter of the contract and the
    time needed to send in tenders;

eu_dir_2014_24_art_33_5_c:
  status: verified
  unit: "02014L0024-20260101#point_033.005_c"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(5)(c) (tenders in writing; contents unopened until the time limit expires)"
  retrieved: 2026-08-20
  covers: >-
    TWO limbs from one sentence, kept separate because the sentence has two
    conjuncts: written form, and confidentiality until the stipulated time limit
    for reply has expired.
  verbatim: >-
    tenders shall be submitted in writing, and their content shall not be opened
    until the stipulated time limit for reply has expired;

eu_dir_2014_24_art_33_5_d:
  status: verified
  unit: "02014L0024-20260101#point_033.005_d"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(5)(d) (award on the framework's award criteria)"
  retrieved: 2026-08-20
  covers: >-
    The award-criteria limb. The criteria themselves are Art 67's determination
    and are excluded; this limb asks only whether the award was made on the
    criteria set out in the framework's procurement documents.
  verbatim: >-
    contracting authorities shall award each contract to the tenderer that has
    submitted the best tender on the basis of the award criteria set out in the
    procurement documents for the framework agreement.
