    heading: Article 33 - Framework agreements
    method: 'The single <ARTICLE IDENTIFIER="033"> of the consolidated act, cut whole,
      with a PI-PRESERVING PARSER -- ET.XMLParser(target=ET.TreeBuilder(insert_pis=True,
      insert_comments=True)). THAT IS NOT A DETAIL: the default ElementTree TreeBuilder
      SILENTLY DROPS processing instructions, and this span carries one (<?PAGE NO=''44''?>).
      The consolidated act carries 217 of them across three targets -- PAGE, CLG.MDFO
      and CLG.MDFC -- and the CLG.MDF* pair are the consolidation modification-open/close
      markers that a repealed-or-modified-text guard reads. Dropping them destroys
      that evidence silently; measured at 8.3% of units on another instrument by the
      layer owner. This extract''s span carries no CLG.MDF* marker, but it is cut
      the safe way regardless. An ARTICLE carries the document''s own IDENTIFIER,
      so this is a boundary the document draws itself, not an article range chosen
      by hand. Re-parented under the original CONS.ACT > CONS.DOC > ENACTING.TERMS
      chain with INFO.CONSLEG and BIB.INSTANCE kept, so the extract is a well-formed,
      self-identifying Formex document rather than a detached fragment. The enclosing
      DIVISION shells (TITLE II > CHAPTER II) are NOT carried: their TITLEs would
      each become a unit of this domain''s ledger that no rule of this domain will
      ever cover, and the chapter title would slug into every unit id below it.

      '
    processing_instructions: 'ONE, preserved and checked: <?PAGE NO=''44''?>, inside
      the Art 33 span. The reader (_tools/provisions/units.py) IGNORES it -- verified,
      not assumed: all 13 units parse with run text identical to the PI-less cut,
      and no unit''s text contains "44" or "PAGE". So preserving it costs the ledger
      nothing and keeps the page-boundary evidence in the pinned bytes where a later
      guard can read it. The CONTROL cut of CHAPTER II carries 11 PIs on the same
      basis.

      '
    root: art_033
    runs: 'EVERY ONE OF THE 13 UNITS HAS EXACTLY ONE RUN, measured, not assumed. That
      matters for this article specifically: parag_033.001, parag_033.002 and parag_033.003
      each carry SEVERAL <ALINEA> subparagraphs (the four-year rule is the third subparagraph
      of 33(1); the closed-parties rule and the no-substantial-modification rule are
      the second and third of 33(2)), and the Formex reader joins them into ONE run
      per PARAG. So a `<doc>#parag_033.001/2` run selector does NOT address the definition
      sentence separately -- it is out of range. Deferrals and citations in this domain
      therefore address WHOLE PARAG units, and a citation''s `verbatim` that quotes
      one subparagraph is a substring of its unit''s single run, never a join across
      runs.

      '
