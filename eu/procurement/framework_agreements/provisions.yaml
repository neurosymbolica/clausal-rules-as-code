      terms set out, objective conditions indicated) and (b) supplies only the route-choice
      and reopening-terms duties, because the split route makes direct awards for
      part of its volume. (c) is then genuinely inapplicable here: it governs reopening
      where the framework does NOT lay down all terms, and the reopening limb this
      domain has is about the converse case. The unused import is dead weight to delete,
      and the chapeau citation on reopening_not_available_where_framework_sets_out_all_terms
      is right because no single sub-paragraph states that prohibition.'
    id: subparagraph_a_supplies_the_direct_award_conditions
  - consequence: 'Each route cites the sub-paragraph that names it. The split route''s
      limbs move from (a) to (b); the reopening-unavailable limb moves from the chapeau
      to (c); the unused import becomes used. A reader following a citation then lands
      on the sub-paragraph describing the route that actually fired rather than one
      describing a different way of awarding. Safer in the sense that matters for
      a citation: it cannot send a reader to a provision about a route the case did
      not take.'
