domain_id: eu/procurement/framework_agreements
enforced: true
exclusions:
- cites:
  - 02014L0024-20260101#art_004
  consequence: A caller must run Art 4 itself, BEFORE this domain. This domain will
    cheerfully report `call_off_lawful` on a framework agreement wholly below the
    threshold, where Article 33 does not apply at all and the answer is not "lawful"
    but "not governed by this Directive". Nothing here inspects any value, so it cannot
    notice.
  label: authorized
  reason: Art 4 sets the threshold amounts above which the Directive applies. This
    domain asks whether a framework agreement's term and a call-off under it comply
    with Article 33; it never asks whether the Directive reaches the procurement in
    the first place. Formalized separately in eu/procurement/thresholds.
  what: thresholds
- cites:
  - 02014L0024-20260101#art_005
  consequence: 'A caller must run Art 5(5) itself. THE SHARP EDGE: Coopservice C-216/17
    and Simonsen & Weel C-23/20 hold that a framework agreement must state the maximum
    quantity or value of the supplies capable of being ordered, and that once it is
    exhausted the agreement has spent its effects. This domain models no quantity
    and no value, so a call-off made ABOVE an exhausted maximum will be reported `call_off_lawful`
    here on facts the Court has held unlawful. That is the largest single hole in
    this domain and it is stated rather than hidden.'
  label: authorized
  reason: Art 5(5) says that for framework agreements the value to be taken into consideration
    is the maximum estimated value net of VAT of ALL the contracts envisaged for the
    total term. Computing that value, and the duty to state a maximum quantity that
    the CJEU has read out of it, is Art 5's determination and needs inputs this domain
    does not have.
  what: estimated_value_of_a_framework_agreement
- cites:
  - 02014L0024-20260101#art_018
  consequence: A caller must apply Art 18 itself, and must not read a `call_off_lawful`
    from this domain as a finding that the framework agreement was used properly.
    An authority that concludes a four-year framework with a single operator in order
    to avoid competing the work, and then calls off within the terms, satisfies every
    limb this domain tests. Art 18(1) second subparagraph is where that is answered,
    and it turns on INTENTION, which is not among this domain's 21 inputs. See operative_readings[anti_abuse_principle_is_not_an_operative_condition_of_art_33].
  label: authorized
  reason: 'Art 18(1) carries the equal-treatment, non-discrimination, transparency
    and proportionality principles, and its second subparagraph the rule that "the
    design of the procurement shall not be made with the intention of excluding it
    from the scope of this Directive or of artificially narrowing competition". THAT
    is where Directive 2014/24/EU puts the anti-abuse rule which Directive 2004/18/EC
    Art 32(2) put inside the framework-agreements article itself ("Contracting authorities
    may not use framework agreements improperly or in such a way as to prevent, restrict
    or distort competition"). That sentence is NOT in Article 33 of this Directive:
    searched exhaustively across the whole consolidated act, "improperly" does not
    occur and "distort competition" occurs once, in Art 30(6), about competitive dialogue.'
  what: principles_of_procurement_and_the_anti_abuse_rule
- cites:
  - 02014L0024-20260101#art_026
  consequence: 'A caller must run Art 26 itself, BEFORE this domain. A framework agreement
    concluded through a negotiated procedure without prior publication that did not
    qualify under Art 32 is unlawful at its root, and every one of its call-offs is
    unlawful with it -- and this domain will still report the call-off lawful, because
    the Art 33(1) first-subparagraph proviso is not among its limbs. Note the ordering:
    this is a defect the caller must exclude BEFORE the answer here means anything.'
  label: authorized
  reason: 'Art 33(1) first subparagraph permits framework agreements "provided that
    they apply the procedures provided for in this Directive". THAT PROVISO NAMES
    NO ARTICLE -- checked: Art 33 cites no article of the Directive anywhere -- so
    pointing it at Art 26 is THIS DOMAIN''s inference about where the question is
    answered, not a cross-reference the statute draws. WHICH procedures those are,
    and when each is available, is Art 26 and the articles it points at (Arts 27-32).
    This domain takes the framework as concluded and asks about its term and its call-offs.'
  what: choice_of_procedure_for_concluding_the_framework
- cites:
  - 02014L0024-20260101#art_034
  consequence: A caller must not route a dynamic purchasing system through this domain.
    Doing so imports a four-year term limit that Art 34 does not impose (a DPS has
    a stated period of validity and no statutory maximum) and a closed-parties rule
    that inverts the DPS's defining feature, which is that any operator meeting the
    selection criteria may join at any time. Every answer would be wrong in the direction
    of over-restriction.
  label: authorized
  reason: 'Art 34 governs dynamic purchasing systems -- the other technique in the
    same chapter for repeated purchasing. A DPS is NOT a framework agreement. CHECKED
    AGAINST ART 34''s OWN PINNED SPAN, not asserted: the strings "Article 33" and
    "framework agreement" each occur ZERO times in it, and Art 34(2) opens "In order
    to procure under a dynamic purchasing system, contracting authorities shall follow
    the rules of the restricted procedure." Art 34(1) requires the system to be "open
    throughout the period of validity of the purchasing system to any economic operator
    that satisfies the selection criteria", and the word "years" does not occur in
    Art 34 at all -- there is no four-year analogue. Formalized separately in eu/procurement/dynamic_purchasing_system.'
  what: dynamic_purchasing_systems
- cites:
  - 02014L0024-20260101#art_035
  consequence: A caller reopening competition BY ELECTRONIC AUCTION must run Art 35
    alongside this domain, on the same reopening. This domain's Art 33(5) limbs (written
    consultation, a sufficiently long time limit, written tenders, confidentiality
    until the time limit expires, award on the framework's criteria) do not include
    any of Art 35's conditions, and Art 35's own conditions -- that the specifications
    be established with precision, that the auction be announced in the contract notice,
    that the invitation state the mathematical formula -- are simply absent here.
    A `call_off_lawful` says nothing about the auction.
  label: authorized
  reason: 'Art 35 governs electronic auctions -- a repetitive electronic process for
    presenting new prices, used as a stage WITHIN a procedure rather than as a procurement
    technique of its own. THIS IS THE ONE NEIGHBOUR THAT REALLY DOES POINT BACK AT
    ARTICLE 33, and here is the sentence, verbatim from Art 35(2)''s own pinned span:
    "In the same circumstances, an electronic auction may be held on the reopening
    of competition among the parties to a framework agreement as provided for in points
    (b) or (c) of Article 33(4) and on the opening for competition of contracts to
    be awarded under the dynamic purchasing system referred to in Article 34." Note
    what it confirms in passing: Art 35 treats a reopening as arising under points
    (b) OR (c) of Art 33(4) and nowhere else, which is the structure this domain''s
    route rule implements. Formalized separately in eu/procurement/electronic_auction.'
  what: electronic_auctions
- cites:
  - 02014L0024-20260101#art_067
  consequence: A caller must run Art 67 itself on the framework's criteria, and must
    run its ranking to know which tender the Art 33(5)(d) limb is satisfied BY. This
    domain reads a single boolean, `award_made_on_framework_award_criteria`, which
    asserts only that the authority applied the framework's stated criteria; it neither
    checks that those criteria are lawful under Art 67 nor recomputes the ranking.
    A reopened competition awarded faithfully on criteria that Art 67 condemns passes
    this domain's limb.
  label: authorized
  reason: Art 33(5)(d) requires a reopened competition to be awarded to the best tender
    "on the basis of the award criteria set out in the procurement documents for the
    framework agreement". WHETHER those criteria are lawful, and which tender is in
    fact the most economically advantageous on them, is Art 67's determination. Formalized
    separately in eu/procurement/award_criteria_meat.
  what: award_criteria
- cites:
  - 02014L0024-20260101#art_072
  consequence: 'A caller must run Art 72 itself on any modification OF the framework
    agreement (an extension of its term, a change to its terms, a change of contractor),
    which this domain does not model at all -- it takes the framework as concluded
    and asks about ONE call-off under it. And it must resolve the Art 33(2) substantiality
    question for itself before calling: this domain reads `call_off_entails_substantial_modification`
    as an ATOMIC INPUT and does not run Art 72(4)''s limbs on it. See operative_readings[substantial_modification_limb_and_article_72],
    where that choice is the declared reading rather than an assumption. Feeding False
    for a call-off that in truth changes the economic balance in the contractor''s
    favour produces a confident `call_off_lawful` that is wrong, and nothing in this
    domain can detect it.'
  label: authorized
  reason: Art 72 governs when a contract or a framework agreement may be modified
    during its term without a new procurement procedure, including the Art 72(4) test
    of when a modification is SUBSTANTIAL. Art 33(2) third subparagraph carries its
    own prohibition -- a call-off "may under no circumstances entail substantial modifications
    to the terms laid down in that framework agreement" -- and the relation between
    the two is a genuine interpretive question, not a boundary that can simply be
    drawn.
  what: modification_of_contracts_during_their_term
