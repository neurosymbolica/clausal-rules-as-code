  id: 02014L0024-20260101#parag_033.001
  state: GREEN
  text: 1. Contracting authorities may conclude framework agreements, provided that
    they apply the procedures provided for in this Directive. A framework agreement
    means an agreement between one or more contracting authorities and one or more
    economic operators, the purpose of which is to establish the terms governing contracts
    to be awarded during a given period, in particular with regard to price and, where
    appropriate, the quantity envisaged. The term of a framework agreement shall not
    exceed four years, save in exceptional cases duly justified, in particular by
    the subject of the framework agreement.
- attribution:
    coverage:
    - atom: eu_dir_2014_24_art_33_2
      rules:
      - framework_agreements.seam:633
      - framework_agreements.seam:642
      - framework_agreements.seam:648
      - framework_agreements.seam:654
      verbatim: Contracts based on a framework agreement may under no circumstances
        entail substantial modifications to the terms laid down in that framework
        agreement, in particular in the case referred to in paragraph 3.
      via: rule
  id: 02014L0024-20260101#parag_033.002
  state: GREEN
  text: 2. Contracts based on a framework agreement shall be awarded in accordance
    with the procedures laid down in this paragraph and in paragraphs 3 and 4. Those
    procedures may be applied only between those contracting authorities clearly identified
    for this purpose in the call for competition or the invitation to confirm interest
    and those economic operators party to the framework agreement as concluded. Contracts
    based on a framework agreement may under no circumstances entail substantial modifications
    to the terms laid down in that framework agreement, in particular in the case
    referred to in paragraph 3.
- attribution:
    coverage:
    - atom: eu_dir_2014_24_art_33_3
      rules:
      - framework_agreements.seam:660
      verbatim: Where a framework agreement is concluded with a single economic operator,
        contracts based on that agreement shall be awarded within the limits of the
        terms laid down in the framework agreement.
      via: rule
  id: 02014L0024-20260101#parag_033.003
  state: GREEN
  text: 3. Where a framework agreement is concluded with a single economic operator,
    contracts based on that agreement shall be awarded within the limits of the terms
    laid down in the framework agreement. For the award of those contracts, contracting
    authorities may consult the economic operator party to the framework agreement
    in writing, requesting it to supplement its tender as necessary.
