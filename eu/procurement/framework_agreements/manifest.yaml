id: eu/procurement/framework_agreements
shape_family: constraint-satisfaction
kit_version: "0.1.0"

# Module layout. TWO legal determinations, both in ONE decision module,
# framework_agreements.seam (the module names below are the real files):
#   (A) Art 33(1): is the framework agreement's own TERM lawful? The four-year
#     limit, its exceptional-case escape, the anniversary arithmetic with the
#     29-February clamp, the two term limb ids and the pure boundary predicates.
#   (B) Art 33(2)-(5): given the framework's parameters and a proposed
#     call-off, is the call-off lawful, and by which ROUTE? The five route
#     atoms, the seventeen call-off limb ids, the award-window test and the two
#     call-off method atoms.
# The same module holds the input check, framework_agreements_input_problem/2
# (ruling D80, 2026-10-20).
# NEITHER DETERMINATION GATES THE OTHER, and that separation is a decision, not an
# accident: a call-off made under an over-long framework is still tested on its
# own Art 33(2)-(5) conditions, and an over-long term is a defect of the
# FRAMEWORK, reported once, not a defect re-reported on every call-off made
# under it. `decide_call_off/2` never reads `exceptional_case_duly_justified`
# and never consults `decide_framework_term/2`'s verdict.
#
# kernel.clausal holds the TWO result-shape constructors and nothing else -- no
# rules, no facts, no imports. Result-shape constructors are an unconditional
# kernel category regardless of slice count; the VALUE atoms live in whichever
# slice reads them (declare-where-used), and the kernel is for slice<->slice
# sharing only.
modules:
  - kernel
  - citations
  - parameters
  - framework_agreements
  - queries
  - fixtures

