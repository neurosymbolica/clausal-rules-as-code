# Parameter sourcing manifest for eu/procurement/framework_agreements.
#
# NOT EMPTY, AND THAT IS THE DIFFERENCE FROM ART 67. The Wave-2 Art 67 domain
# ships an empty parameters sidecar and records, correctly, that Article 67
# carries NO figure at all -- every number it handles is caller data. Article 33
# is the other case: it carries exactly ONE statutory figure, the FOUR YEARS of
# Art 33(1) third subparagraph, and that figure is the whole of one of this
# domain's two determinations. A domain whose headline rule is a number and
# whose parameters sidecar is empty has put the number somewhere unsourced.
#
# `check_parameters.py` is CONDITIONAL (corpus 47eaf941): it demands the file
# only where `parameter_signal` fires, which it does for a numeric ground fact
# commented with a statute reference (`Art`, `Directive`, ...) or carrying a
# value-unit functor suffix. `_years` is NOT in the suffix list, so the signal
# here fires on the COMMENT, not the name -- which is a thin thread to hang a
# gate on. This file is written whether or not the gate would have asked.
#
# THE KEY SET RULE, which is checked: the key set of this file must equal the
# `parameter_source/2` key set in parameters.clausal EXACTLY, and every key must
# be a real fact functor that appears as `<name>(` in a NON-parameters.clausal
# file of this domain. `framework_term_limit_years` is pinned in
# `_orders/framework-agreements.yaml` for exactly that reason: the producer must
# spell it in a clause body of framework_term.clausal, not only declare it.
#
# status: verified (ref + verbatim + label all non-empty; the verbatim is an
#         exact substring of the source at ref and states the value in source
#         units) | unverified (verbatim MUST be empty)
#
# WHAT IS NOT HERE, AND WHY.
#
#  * THE 29-FEBRUARY CLAMP AND THE INCLUSIVE BOUNDARY are not parameters. They
#    are the domain's declared date-arithmetic conventions, pinned in the
#    order's INTERFACE line, because the Directive states neither: "shall not
#    exceed four years" fixes the figure and says nothing about how a calendar
#    anniversary is computed or whether the boundary is reached or crossed. An
#    unstated arithmetic convention is a silent refutation generator, so it is
#    stated -- but in the interface, where the producer reads it, not here,
#    where it would look like something the statute supplied.
#
#  * THE SINGLE-VERSUS-SEVERAL SWITCH (Art 33(3) "a single economic operator" /
#    Art 33(4) "more than one economic operator") is a numeric boundary but not
#    a numeric parameter: the Directive expresses it in words, and reifying "2"
#    as a sourced constant would invent a figure the text does not carry. It is
#    a comparison in the route rule and its verbatim authority is the Art 33(4)
#    chapeau citation.
#
#  * THE TRANSPOSITION SEAM. Article 33 has none of the Art 67(2) kind -- there
#    is no "Member States may provide that ..." anywhere in it. Member States
#    may of course legislate more strictly around framework agreements, but Art
#    33 does not itself hand them a knob, so a national transposition pack
#    EXTENDS this domain rather than filling a seam left open in it.

framework_term_limit_years:
  status: verified
  unit: "02014L0024-20260101#parag_033.001"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 33(1) third subparagraph -- the maximum term of a framework agreement, in whole years"
  retrieved: 2026-08-20
  value: 4
  unit_of_measure: whole calendar years
  covers: >-
    The single statutory figure of this domain. It fixes the length of the
    period only; the ANNIVERSARY arithmetic that turns a start date and this
    figure into a limit date, and the inclusive/exclusive boundary, are the
    domain's declared conventions and are pinned in the order, not sourced here.
  verbatim: >-
    The term of a framework agreement shall not exceed four years, save in
    exceptional cases duly justified, in particular by the subject of the
    framework agreement.
