# Second statute pin for eu/procurement/life_cycle_costing: ANNEX XIII.
#
# WHY A SECOND EXTRACT, WHEN THE STANDARD IS ONE ARTICLE. Art 68(3) second
# alinea reads "A list of such legislative acts ... is set out in Annex XIII."
# The Art 68(3) determination therefore turns on the CONTENT of Annex XIII,
# which is a document-native element of the same act and which the Art 68 cut
# does not contain. Pinning it makes `annex_xiii_act/1` a fact table sourced
# from pinned text rather than an assertion about a document this domain never
# read. It is two units, both accounted for.
#
# SAME doc_id AS THE ARTICLE PIN, DELIBERATELY. `doc_id` names the DOCUMENT,
# never the cut: `load_sources_with_provenance` refuses a repeated UNIT id, not
# a repeated doc_id, and the two cuts' unit ids are disjoint because they are
# the document's own (eu/procurement/time_limits pins five ARTICLE extracts of
# one act the same way).
