  method: >
    The single <CONS.ANNEX> whose TITLE/TI reads "ANNEX XIII", cut whole. A
    CONS.ANNEX is a sibling of ENACTING.TERMS under CONS.DOC, so it is
    re-parented directly under CONS.DOC (not inside ENACTING.TERMS, which is
    where the ARTICLE pin's payload sits) with INFO.CONSLEG and BIB.INSTANCE
    kept. No processing instructions fall inside this element.
  verified: >
    Checked 2026-08-20. (1) Cut from the same fetched source as the Art 68 pin
    (source_sha256 above, verified there). (2) The extracted <CONS.ANNEX>
    subtree serialises BYTE-IDENTICALLY to the same 293-byte span of the full
    source. (3) Parsed with the real reader: 2 units,
    division_annex_xiii and
    division_annex_xiii-list_of_union_legal_acts_referred_to_in_article_68_3,
    both single-run. extract_roots() on the pinned bytes returns exactly
    ['division_annex_xiii'], which is what extract.root above declares. The
    second unit's own text is, verbatim and in full: "LIST OF UNION LEGAL ACTS
    REFERRED TO IN ARTICLE 68(3) Directive 2009/33/EC of the European
    Parliament and of the Council." -- one act, no delegated acts, in the
    consolidation in force on 2026-01-01.
