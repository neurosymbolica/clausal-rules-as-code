#
# WHY `verified` RATHER THAN THE PROCUREMENT FAMILY'S `unverified`. All six
# existing eu/procurement domains mark every citation `unverified` with an
# empty verbatim, which is legal and which keeps the provision layer's T5
# verbatim-fidelity check SILENT on them. This domain pins its statute, so the
# text is on disk and hashed and there is nothing left to be unverified ABOUT:
# each `verbatim` below was READ OUT OF THE PINNED BYTES by the real reader
# (_tools/provisions/units.py), not transcribed, so T5's containment check has
# something real to bite on.
#
# EVERY UNIT OF BOTH EXTRACTS IS SINGLE-RUN. Article 68 has no discontiguous
# unit text anywhere -- each PARAG's own words sit in one contiguous stretch --
# so no citation below needs a `<doc_id>#<eid>/<n>` run selector, and no
# verbatim here can fabricate an adjacency by joining across a gap. (Contrast
# Art 67, where parag_067.002 and parag_067.003 are two runs each.) This was
# checked, not assumed: the reader reports runs=1 for all fifteen units.
#
# TWO OBLIGATIONS THAT COME WITH `verified`, both on whoever authors
# citations.clausal at stage 02a:
#   1. Each `verbatim` must be copied into the `citation/2` record BYTE-EXACT.
#      check_citations.py only checks that a verified record's ref and verbatim
#      are NON-EMPTY -- it will not notice a paraphrase. T5 will, once a
#      provisions ledger with clauses exists.
#   2. `citation/2` takes a MAP, not a string.
#
# T12: a green citation registry does not mean the provision quoted SUPPORTS
# what cites it. Each `covers` field states which rule of this domain the
# quoted sentence is the authority for; check it by reading, per clause.


eu_dir_2014_24_art_68_1:
  status: verified
  unit: "02014L0024-20260101#parag_068.001"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 68(1) (what life-cycle costing covers)"
  retrieved: 2026-08-20
  covers: >-
    The scope rule: an approach covers the relevant costs 'to the extent
    relevant, parts or all' -- so an approach that covers acquisition alone
    is lawful, and no completeness requirement is derived. Also the outer
    gate: an empty component list is a procurement that assesses no life-
    cycle costs, on which Art 68 imposes nothing.
  verbatim: >-
    1. Life-cycle costing shall to the extent relevant cover parts or all of
    the following costs over the life cycle of a product, service or works:

