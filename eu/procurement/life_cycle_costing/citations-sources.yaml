eu_dir_2014_24_art_68_3:
  status: verified
  unit: "02014L0024-20260101#parag_068.003"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 68(3) (a mandatory Union common method displaces the authority's own)"
  retrieved: 2026-08-20
  covers: >-
    The whole Art 68(3) determination: lcc_mandatory_method_status/3, the
    defect mandatory_union_common_method_not_applied, and the second
    alinea's pointer to Annex XIII. Whether that list is constitutive or
    declaratory is registered at
    operative_readings[art_68_3_annex_xiii_is_declaratory].
  verbatim: >-
    3. Whenever a common method for the calculation of life-cycle costs has
    been made mandatory by a legislative act of the Union, that common
    method shall be applied for the assessment of life-cycle costs. A list
    of such legislative acts, and where necessary the delegated acts
    supplementing them, is set out in Annex XIII. The Commission shall be
    empowered to adopt delegated acts in accordance with Article 87
    concerning the update of that list, when an update of the list is
    necessary due to the adoption of new legislation making a common method
    mandatory or the repeal or modification of existing legal acts.

