eu_dir_2014_24_art_68_1_b:
  status: verified
  unit: "02014L0024-20260101#point_068.001_b"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 68(1)(b) (environmental externality costs, and the determinable-and-verifiable proviso)"
  retrieved: 2026-08-20
  covers: >-
    Two rules. (1) The environmental_externality_cost member of
    lcc_cost_category/1. (2) The proviso: a component of that category whose
    monetary value cannot be determined and verified is excluded from the
    total (lcc_component_admissibility/3) and is reported as the defect
    externality_cost_monetary_value_not_determinable. The proviso attaches
    to point (b) ALONE -- it is not read for any authority-side category.
  verbatim: >-
    (b) costs imputed to environmental externalities linked to the product,
    service or works during its life cycle, provided their monetary value
    can be determined and verified; such costs may include the cost of
    emissions of greenhouse gases and of other pollutant emissions and other
    climate change mitigation costs.

eu_dir_2014_24_art_68_2:
  status: verified
  unit: "02014L0024-20260101#parag_068.002"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  label: "Directive 2014/24/EU, Article 68(2) (duty to indicate the data and the method; chapeau to the three cumulative conditions)"
  retrieved: 2026-08-20
  covers: >-
    The two defects tenderer_data_not_indicated and
    costing_method_not_indicated, which fire on any life-cycle costing
    approach; and the chapeau word 'all', which makes the three conditions
    in points (a)-(c) CUMULATIVE, and the words 'the method used for the
    assessment of costs imputed to environmental externalities', which are
    the inner gate confining those conditions to an approach that actually
    assesses externality costs.
  verbatim: >-
    2. Where contracting authorities assess the costs using a life-cycle
    costing approach, they shall indicate in the procurement documents the
    data to be provided by the tenderers and the method which the
    contracting authority will use to determine the life-cycle costs on the
    basis of those data. The method used for the assessment of costs imputed
    to environmental externalities shall fulfil all of the following
    conditions:

