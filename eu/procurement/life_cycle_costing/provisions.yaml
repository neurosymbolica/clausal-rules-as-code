domain_id: eu/procurement/life_cycle_costing
enforced: true
exclusions:
- cites:
  - 02014L0024-20260101#point_002.001_20
  consequence: 'A caller must decide for itself, against Art 2(1)(20), whether a cost
    it is about to declare falls within the product''s, works'' or service''s life
    cycle at all, and must leave it out of `cost_components` if it does not. This
    domain sums what it is given: a cost incurred outside the life cycle, declared
    under any of the six categories, will be added to the total and nothing here can
    notice.'
  label: authorized
  reason: Art 2(1)(20) defines "life cycle" as all consecutive and/or interlinked
    stages, including research and development, production, trading and its conditions,
    transport, use and maintenance, from raw-material acquisition to disposal, clearance
    and end of service. Article 68 costs THE LIFE CYCLE, so that definition sets the
    outer edge of what this domain sums -- but the definition is a classification
    question about a particular cost, not a costing rule, and it is not in either
    pinned extract.
  what: definition_of_life_cycle
- cites:
  - 02014L0024-20260101#art_025
  consequence: A caller must resolve, under Art 25 and the GPA's own coverage schedules,
    which operators the Art 68(2)(c) extension actually reaches BEFORE setting `externality_data_obtainable_by_third_country_gpa_operators`.
    This domain takes that boolean as given; it has no list of covered countries and
    cannot tell an over-broad answer from a correct one.
  label: authorized
  reason: Art 68(2)(c) requires the data to be obtainable "including [by] economic
    operators from third countries party to the GPA or other international agreements
    by which the Union is bound". WHICH third countries and WHICH agreements those
    are is Art 25's subject, not Art 68's.
  what: gpa_and_international_agreements
- cites:
  - 02014L0024-20260101#art_042
  - 02014L0024-20260101#art_043
  consequence: 'A caller must run Arts 42-43 itself for any life-cycle requirement
    it imposes as a specification rather than costs. Note the sharp edge: a requirement
    imposed as a technical specification is a PASS/FAIL condition whose breach disqualifies
    a tender, whereas a cost declared here merely enters a sum. Mistaking one for
    the other silently converts a disqualification into a few euro-cents.'
  label: authorized
  reason: 'Arts 42 and 43 are the other place a life-cycle consideration enters a
    procurement: as a technical specification a tender must MEET, or as a label the
    authority may require. Art 68 is about putting a monetary value on life-cycle
    costs, which is a different operation with different conditions.'
  what: technical_specifications_and_labels
- cites:
  - 02014L0024-20260101#art_067
  consequence: 'A caller must run Art 67 itself, AFTER this domain, and must decide
    FOR ITSELF in what shape the figure crosses the boundary. THIS DOMAIN TAKES NO
    POSITION ON THAT and its output is a bare integer euro-cent quantity from `lcc_total/2`:
    it is neither a SCORE_POINTS value on a 0..100 scale nor a `fixed_price_or_cost_eur_cents`
    value, and converting it into either is the caller''s step, not this domain''s.
    A caller that feeds a euro-cent total into a points-scaled score criterion will
    produce a ranking whose arithmetic is meaningless and which nothing on either
    side of the boundary can detect. Note also the asymmetry: eu/procurement/award_criteria_meat
    excludes Art 68 and its excluded_set entry says the result arrives there as a
    SCORE_POINTS value on a cost-side criterion. That is ITS declared reading of ITS
    interface, not an agreement reached with this domain, which did not exist when
    it was written.'
  label: authorized
  reason: Art 67 governs the award criteria -- the basis on which the most economically
    advantageous tender is identified, and Art 67(2) names life-cycle costing as an
    example of a cost-effectiveness approach. This domain computes the life-cycle
    cost and validates the method; it never asks whether the resulting figure may
    lawfully be used to rank tenders, what weight it carries, or whether the criteria
    set as a whole is valid. Formalized separately in eu/procurement/award_criteria_meat.
  what: award_criteria
- cites:
  - 02014L0024-20260101#art_069
  consequence: A caller must run Art 69 itself. A tender whose life-cycle cost this
    domain computes as very low may be abnormally low and liable to rejection; nothing
    here inspects the tender or the tenderer at all.
  label: authorized
  reason: Art 69 obliges the authority to require explanations for a tender that appears
    abnormally low, and to reject it in defined cases. It operates on a tender's price,
    after the award criteria have been applied.
  what: abnormally_low_tenders
- cites:
  - 02014L0024-20260101#art_070
  consequence: A caller must run Art 70 itself for any environmental requirement it
    means to impose as a performance condition. An environmental externality this
    domain prices at zero, or excludes for want of a determinable monetary value,
    may still be perfectly capable of being imposed as an Art 70 condition -- and
    the two questions are unrelated, so an exclusion here is no reason to drop the
    requirement there.
  label: authorized
  reason: Art 70 lets an authority lay down environmental, social and employment-related
    conditions on the performance of the contract. Those are obligations that bind
    the winner, not costs entering a comparison.
  what: contract_performance_conditions
- cites:
  - 02014L0024-20260101#art_087
  consequence: 'A caller must check, against the Official Journal, whether Annex XIII
    has been updated since the consolidation this domain pins (02014L0024-20260101,
    in force 1 January 2026). `annex_xiii_act/1` is a snapshot of that pinned text
    and will not notice a delegated act adding or removing an entry; the way to update
    it is to re-pin the annex, whose sha256 mismatch then makes the change loud. THIS
    IS NOT HYPOTHETICAL: the power has never been exercised, and the one act on the
    list lost its costing methodology in 2019 (see the fourth `sources:` entry), so
    the list is out of date NOW.'
  label: authorized
  reason: Art 68(3) second alinea empowers the Commission to update the Annex XIII
    list by delegated act "in accordance with Article 87". Art 87 is the procedure
    -- duration of the delegation, revocation, objection periods -- and this domain
    models no procedure.
  what: delegated_acts_updating_annex_xiii
