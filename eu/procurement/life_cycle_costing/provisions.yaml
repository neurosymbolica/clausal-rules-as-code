  extract:
    heading: ANNEX XIII - LIST OF UNION LEGAL ACTS REFERRED TO IN ARTICLE 68(3)
    method: 'The single <CONS.ANNEX> whose TITLE/TI reads "ANNEX XIII", cut whole.
      A CONS.ANNEX is a sibling of ENACTING.TERMS under CONS.DOC, so it is re-parented
      directly under CONS.DOC (not inside ENACTING.TERMS, which is where the ARTICLE
      pin''s payload sits) with INFO.CONSLEG and BIB.INSTANCE kept. No processing
      instructions fall inside this element.

      '
    root: division_annex_xiii
    source_file: CL2014L0024EN0060010.0001.xml
    source_sha256: d732f7f9a547b315289cd7447c33f73ce63a3797ed299e4dad4ff3066e157772
    units: 2
    verified: 'Checked 2026-08-20. (1) Cut from the same fetched source as the Art
