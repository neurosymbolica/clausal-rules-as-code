shape_family: constraint-satisfaction
kit_version: "0.1.0"

# Determination-slices layout. THREE legal determinations, so THREE slices, and
# NO SLICE GATES ANOTHER. That separation is the domain's whole point:
#
#   lcc_method_validity.clausal -- Art 68(1)(b) + Art 68(2): is the contracting
#     authority's life-cycle costing method lawful? Owns the nine validity
#     limbs, the two applicability gates, the ten profile keys it reads and the
#     per-limb checklist.
#   mandatory_method.clausal -- Art 68(3) + Annex XIII: has a Union legislative
#     act made a common method mandatory, and was it applied? Owns the
#     three-atom Union-act vocabulary, the single-member Annex XIII fact table,
#     and the displacement rule.
#   lcc_computation.clausal -- Art 68(1): what does the life-cycle cost come
#     to? Owns the six-atom cost-category vocabulary, per-component
#     admissibility, and the exact integer sum.
#
# A method can be unlawful and the arithmetic still correct; a mandatory Union
# method can displace the authority's own without making that own method's
# defects disappear. `decide_lcc_method_validity/2` never reads the Art 68(3)
# keys (see operative_readings[art_68_3_displacement_does_not_switch_off_art_68_2]),
# `decide_lcc_mandatory_method/2` never reads the Art 68(2) flags, and
# `decide_lcc_computation/2` never reads either.
#
# kernel.clausal holds the THREE result-shape constructors and nothing else --
# no rules, no facts, no imports. Result-shape constructors are an
# unconditional kernel category regardless of slice count; the VALUE atoms live
# in whichever slice reads them (declare-where-used).
modules:
  - kernel
  - citations
  - parameters
  - queries
  - fixtures

