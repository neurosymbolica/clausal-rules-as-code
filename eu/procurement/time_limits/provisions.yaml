  state: AMBER
  text: 4. Contracting authorities may award contracts on the basis of the initial
    tenders without negotiation where they have indicated, in the contract notice
    or in the invitation to confirm interest, that they reserve the possibility of
    doing so.
- attribution:
    deferrals:
    - consequence: 'THE SHARP EDGE. Meeting the minimum in Arts 27-31 does NOT discharge
        Art 47: a limit can clear the floor and still be inadequate to the complexity
        of the procurement, or require extension because site visits were needed or
        documents changed late. A `minimum_days_prescribed` verdict is a floor, never
        a finding that the limit set was lawful.'
      label: authorized
      reason: Art 47 imposes a standalone duty to set ADEQUATE time limits and to
        EXTEND them in named circumstances. That is a separate deontic determination
        from the minimum-days tables the order scopes here.
      what: general_adequacy_and_extension_duties
  deferred_by:
