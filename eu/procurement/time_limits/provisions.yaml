  id: 02014L0024-20260101#parag_031.002
  state: AMBER
  text: 2. The innovation partnership shall aim at the development of an innovative
    product, service or works and the subsequent purchase of the resulting supplies,
    services or works, provided that they correspond to the performance levels and
    maximum costs agreed between the contracting authorities and the participants.
    The innovation partnership shall be structured in successive phases following
    the sequence of steps in the research and innovation process, which may include
    the manufacturing of the products, the provision of the services or the completion
    of the works. The innovation partnership shall set intermediate targets to be
    attained by the partners and provide for payment of the remuneration in appropriate
    instalments. Based on those targets, the contracting authority may decide after
    each phase to terminate the innovation partnership or, in the case of an innovation
    partnership with several partners, to reduce the number of partners by terminating
    individual contracts, provided that the contracting authority has indicated in
    the procurement documents those possibilities and the conditions for their use.
