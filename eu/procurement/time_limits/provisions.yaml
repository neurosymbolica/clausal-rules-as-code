  state: AMBER
  text: 6. In selecting candidates, contracting authorities shall in particular apply
    criteria concerning the candidates’ capacity in the field of research and development
    and of developing and implementing innovative solutions. Only those economic operators
    invited by the contracting authority following its assessment of the requested
    information may submit research and innovation projects aimed at meeting the needs
    identified by the contracting authority that cannot be met by existing solutions.
    In the procurement documents, the contracting authority shall define the arrangements
    applicable to intellectual property rights. In the case of an innovation partnership
    with several partners, the contracting authority shall not, in accordance with
    Article 21, reveal to the other partners solutions proposed or other confidential
    information communicated by a partner in the framework of the partnership without
    that partner’s agreement. Such agreement shall not take the form of a general
    waiver but shall be given with reference to the intended communication of specific
    information.
