  text: Article 29 Competitive procedure with negotiation
- attribution:
    coverage:
    - atom: eu_dir_2014_24_art_29
      rules:
      - time_limits.seam:268
      - time_limits.seam:273
      - time_limits.seam:278
      - time_limits.seam:284
      - time_limits.seam:290
      - time_limits.seam:295
      verbatim: The minimum time limit for receipt of requests to participate shall
        be 30 days from the date on which the contract notice or, where a prior information
        notice is used as a means of calling for competition, the invitation to confirm
        interest was sent. The minimum time limit for the receipt of initial tenders
        shall be 30 days from the date on which the invitation was sent. Article 28(3)
        to (6) shall apply.
      via: rule
  id: 02014L0024-20260101#parag_029.001
  state: GREEN
  text: 1. In competitive procedures with negotiation, any economic operator may submit
    a request to participate in response to a call for competition containing the
    information set out in Annex V parts B and C by providing the information for
    qualitative selection that is requested by the contracting authority. In the procurement
    documents, contracting authorities shall identify the subject-matter of the procurement
    by providing a description of their needs and the characteristics required of
    the supplies, works or services to be procured and specify the contract award
    criteria. They shall also indicate which elements of the description define the
    minimum requirements to be met by all tenders. The information provided shall
    be sufficiently precise to enable economic operators to identify the nature and
    scope of the procurement and decide whether to request to participate in the procedure.
    The minimum time limit for receipt of requests to participate shall be 30 days
    from the date on which the contract notice or, where a prior information notice
    is used as a means of calling for competition, the invitation to confirm interest
    was sent. The minimum time limit for the receipt of initial tenders shall be 30
    days from the date on which the invitation was sent. Article 28(3) to (6) shall
    apply.
- attribution:
    deferrals:
    - consequence: A conforming verdict from this domain says the day counts clear
        the Arts 27-31 floors. It says NOTHING about whether the negotiation or dialogue
        was lawfully conducted, staged or concluded; a caller must apply those provisions
        itself.
      label: authorized
      reason: 'Arts 29(2)-(4) and (6), 30(2)-(8) and 31(2)-(3) and (5)-(7) govern
        the CONDUCT and STRUCTURE of the competitive procedure with negotiation, the
        competitive dialogue and the innovation partnership: who may tender, the duty
        to negotiate, staging, confidentiality, prizes to dialogue participants, partnership
        phasing and its proportionality. Not one of them prescribes a day count. This
        domain''s entire input surface is (procedure, stage, three circumstance flags,
        observed days) and its outputs are a minimum day count, a status and a conformity,
        so none of these provisions is reachable by it (ruling 2026-09-08).'
      what: conduct_of_negotiation_dialogue_and_partnership
  deferred_by:
  - conduct_of_negotiation_dialogue_and_partnership
  id: 02014L0024-20260101#parag_029.002
  state: AMBER
  text: 2. Only those economic operators invited by the contracting authority following
    its assessment of the information provided may submit an initial tender which
    shall be the basis for the subsequent negotiations. Contracting authorities may
    limit the number of suitable candidates to be invited to participate in the procedure
    in accordance with Article 65.
