  text: 4. During the negotiations, contracting authorities shall ensure the equal
    treatment of all tenderers. To that end, they shall not provide information in
    a discriminatory manner which may give some tenderers an advantage over others.
    They shall inform all tenderers whose tenders have not been eliminated, pursuant
    to paragraph 5, in writing of any changes to the technical specifications or other
    procurement documents other than those setting out the minimum requirements. Following
    those changes, contracting authorities shall provide sufficient time for tenderers
    to modify and re-submit amended tenders, as appropriate. In accordance with Article
    21, contracting authorities shall not reveal to the other participants confidential
    information communicated by a candidate or tenderer participating in the negotiations
    without its agreement. Such agreement shall not take the form of a general waiver
    but shall be given with reference to the intended communication of specific information.
