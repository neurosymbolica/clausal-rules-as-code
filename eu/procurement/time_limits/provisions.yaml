- consequence: 'THE SHARP EDGE. Meeting the minimum in Arts 27-31 does NOT discharge
    Art 47: a limit can clear the floor and still be inadequate to the complexity
    of the procurement, or require extension because site visits were needed or documents
    changed late. A `minimum_days_prescribed` verdict is a floor, never a finding
    that the limit set was lawful.'
  label: authorized
  reason: Art 47 imposes a standalone duty to set ADEQUATE time limits and to EXTEND
    them in named circumstances. That is a separate deontic determination from the
    minimum-days tables the order scopes here.
  units:
  - 02014L0024-20260101#parag_029.005
  - 02014L0024-20260101#parag_029.007
  - 02014L0024-20260101#parag_031.004
  what: general_adequacy_and_extension_duties
- consequence: A caller must do the calendar arithmetic itself under Reg 1182/71.
    The commonest error this prevents is assuming the period starts on the dispatch
    date; it does not.
  label: authorized
  reason: This domain reports a minimum DAY COUNT. Turning that count plus a dispatch
    date into a calendar deadline is governed by the periods-and-dates Regulation
    -- which day the period starts, how weekends and public holidays fall, when it
    expires -- and the order scopes it out.
  units: []
  what: calendar_deadline_computation
- consequence: Where Art 32 is made out, no minimum from this domain applies. A caller
    must settle the Art 32 question first; asking this domain for a deadline presupposes
    a call for competition exists.
  label: authorized
  reason: Art 32 dispenses with the call for competition altogether, so there is no
    time-limit table to apply. Sibling determination.
  units: []
