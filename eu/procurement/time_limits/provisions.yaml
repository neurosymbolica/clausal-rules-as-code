  text: Article 31 Innovation partnership
- attribution:
    coverage:
    - atom: eu_dir_2014_24_art_31
      rules:
      - time_limits.seam:311
      - time_limits.seam:326
      verbatim: The minimum time limit for receipt of requests to participate shall
        be 30 days from the date on which the contract notice is sent.
      via: rule
  id: 02014L0024-20260101#parag_031.001
  state: GREEN
  text: 1. In innovation partnerships, any economic operator may submit a request
    to participate in response to a contract notice by providing the information for
    qualitative selection that is requested by the contracting authority. In the procurement
    documents, the contracting authority shall identify the need for an innovative
    product, service or works that cannot be met by purchasing products, services
    or works already available on the market. It shall indicate which elements of
    this description define the minimum requirements to be met by all tenders. The
    information provided shall be sufficiently precise to enable economic operators
    to identify the nature and scope of the required solution and decide whether to
    request to participate in the procedure. The contracting authority may decide
    to set up the innovation partnership with one partner or with several partners
    conducting separate research and development activities. The minimum time limit
    for receipt of requests to participate shall be 30 days from the date on which
    the contract notice is sent. Only those economic operators invited by the contracting
    authority following the assessment of the information provided may participate
    in the procedure. Contracting authorities may limit the number of suitable candidates
    to be invited to participate in the procedure in accordance with Article 65. The
    contracts shall be awarded on the sole basis of the award criterion of the best
    price-quality ratio in accordance with Article 67.
