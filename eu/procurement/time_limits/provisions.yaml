deferrals:
- consequence: A sub-central authority that HAS reached such an agreement is governed
    by the agreed deadline, not by the minimum this domain reports. The verdict here
    is the Directive's floor for the general case, and a caller in that position must
    not read it as binding.
  label: authorized
  reason: Art 28(4) lets a sub-central contracting authority set the tender deadline
    by mutual agreement with the candidates invited, in place of the Art 28(2) minimum.
    The order excludes it because the profile carries neither the contracting-authority
    type nor the agreement input the branch needs.
  units:
  - 02014L0024-20260101#parag_028.004
  what: subcentral_mutual_agreement_deadline
- consequence: A conforming verdict from this domain says the day counts clear the
    Arts 27-31 floors. It says NOTHING about whether the negotiation or dialogue was
    lawfully conducted, staged or concluded; a caller must apply those provisions
    itself.
  label: authorized
  reason: 'Arts 29(2)-(4) and (6), 30(2)-(8) and 31(2)-(3) and (5)-(7) govern the
    CONDUCT and STRUCTURE of the competitive procedure with negotiation, the competitive
    dialogue and the innovation partnership: who may tender, the duty to negotiate,
    staging, confidentiality, prizes to dialogue participants, partnership phasing
    and its proportionality. Not one of them prescribes a day count. This domain''s
    entire input surface is (procedure, stage, three circumstance flags, observed
    days) and its outputs are a minimum day count, a status and a conformity, so none
    of these provisions is reachable by it (ruling 2026-09-08).'
