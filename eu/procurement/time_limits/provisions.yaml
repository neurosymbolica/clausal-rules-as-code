  text: 7. The contracting authority shall ensure that the structure of the partnership
    and, in particular, the duration and value of the different phases reflect the
    degree of innovation of the proposed solution and the sequence of the research
    and innovation activities required for the development of an innovative solution
    not yet available on the market. The estimated value of supplies, services or
    works shall not be disproportionate in relation to the investment required for
    their development.
