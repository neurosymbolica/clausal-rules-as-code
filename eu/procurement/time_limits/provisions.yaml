  text: 3. Contracting authorities shall open, with the participants selected in accordance
    with the relevant provisions of Articles 56 to 66, a dialogue the aim of which
    shall be to identify and define the means best suited to satisfying their needs.
    They may discuss all aspects of the procurement with the chosen participants during
    this dialogue. During the dialogue, contracting authorities shall ensure equality
    of treatment among all participants. To that end, they shall not provide information
    in a discriminatory manner which may give some participants an advantage over
    others. In accordance with Article 21, contracting authorities shall not reveal
    to the other participants solutions proposed or other confidential information
    communicated by a candidate or tenderer participating in the dialogue without
    its agreement. Such agreement shall not take the form of a general waiver but
    shall be given with reference to the intended communication of specific information.
