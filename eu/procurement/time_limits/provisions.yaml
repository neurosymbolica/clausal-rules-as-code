  text: 6. Having declared that the dialogue is concluded and having so informed the
    remaining participants, contracting authorities shall ask each of them to submit
    their final tenders on the basis of the solution or solutions presented and specified
    during the dialogue. Those tenders shall contain all the elements required and
    necessary for the performance of the project. Those tenders may be clarified,
    specified and optimised at the request of the contracting authority. However,
    such clarification, specification, optimisation or additional information may
    not involve changes to the essential aspects of the tender or of the public procurement,
    including the needs and requirements set out in the contract notice or in the
    descriptive document, where variations to those aspects, needs and requirements
    are likely to distort competition or have a discriminatory effect.
