  text: 7. Contracting authorities shall assess the tenders received on the basis
    of the award criteria laid down in the contract notice or in the descriptive document.
    At the request of the contracting authority, negotiations with the tenderer identified
    as having submitted the tender presenting the best price-quality ratio in accordance
    with Article 67 may be carried out to confirm financial commitments or other terms
    contained in the tender by finalising the terms of the contract provided this
    does not have the effect of materially modifying essential aspects of the tender
    or of the public procurement, including the needs and requirements set out in
    the contract notice or in the descriptive document and does not risk distorting
    competition or causing discrimination.
