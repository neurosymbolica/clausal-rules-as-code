# Lexicon entries for eu/procurement/time_limits.
# One entry per public atom: definition (>-) + source.
minimum_days_prescribed:
  definition: >-
    The Directive prescribes a minimum time limit (in days) for the profiled
    (procedure, stage); the verdict's MINIMUM_DAYS slot carries the least
    lawful figure given the profile's circumstances.
  source: "Directive 2014/24/EU, Arts 27-31"
no_minimum_prescribed:
  definition: >-
    The (procedure, stage) pair exists but the Directive prescribes no minimum
    day count for it: the tender phases of competitive dialogue and innovation
    partnership run on invitations without an Art 27/28-style day table.
  source: "Directive 2014/24/EU, Arts 30-31"
stage_not_applicable:
  definition: >-
    The requested stage does not exist for the procedure: the open procedure is
    single-stage, so it has no receipt-of-requests-to-participate limit.
  source: "Directive 2014/24/EU, Art 27"
n_a:
  definition: >-
    Day-slot filler for the two non-numeric statuses (IC-11 numeric idiom):
    no integer minimum exists for the profile.
  source: "modelling convention (IC-11), not statutory text"
overall:
  definition: >-
    The single checklist row id: the time-limit decision is one total verdict
    per profile, exposed as a one-row checklist for API consistency.
  source: "modelling convention, not statutory text"
procedure_type_key:
  definition: >-
    Profile key: the procurement procedure, one of the Art 26 procedure-type
    atoms imported from eu.procurement.directive_2014_24.vocabulary.
  source: "Directive 2014/24/EU, Art 26"
stage_key:
  definition: >-
    Profile key: which time limit is asked for -- receipt_of_tenders or
    receipt_of_participation_requests.
  source: "Directive 2014/24/EU, Arts 27-31 (structure)"
prior_information_notice_published:
  definition: >-
    Profile flag (True/False): a prior information notice satisfying ALL
    Art 27(2)/28(3) conditions was published (itself not used as the call for
    competition; sent 35 days to 12 months before the contract notice; covering
    the contract's scope). A fuzzy/temporal judgment entering as an atomic input.
  source: "Directive 2014/24/EU, Arts 27(2), 28(3)"
electronic_submission_accepted:
  definition: >-
    Profile flag (True/False): the contracting authority accepts that tenders
    may be submitted by electronic means per Art 22(1), triggering the 5-day
    reduction of the base tender limit (Art 27(4) / Art 28(5)).
  source: "Directive 2014/24/EU, Arts 27(4), 28(5), 22(1)"
state_of_urgency_substantiated:
  definition: >-
    Profile flag (True/False): a state of urgency duly substantiated by the
    contracting authority renders the normal minimum impracticable
    (Art 27(3) / Art 28(6)). The substantiation judgment is the authority's;
    it enters as an atomic input.
  source: "Directive 2014/24/EU, Arts 27(3), 28(6)"
receipt_of_tenders:
  definition: >-
    Stage atom: the time limit for receipt of tenders (initial tenders, for
    the competitive procedure with negotiation).
  source: "Directive 2014/24/EU, Arts 27(1), 28(2), 29(1)"
receipt_of_participation_requests:
  definition: >-
    Stage atom: the time limit for receipt of requests to participate.
  source: "Directive 2014/24/EU, Arts 28(1), 29(1), 30(1), 31(1)"
baseline_minimum:
  definition: >-
    Reduction-condition atom: the unconditional base figure of the day table
    (applies to every profile of its (procedure, stage)).
  source: "Directive 2014/24/EU, Arts 27(1), 28(1)-(2), 29(1), 30(1), 31(1)"
with_prior_information_notice:
  definition: >-
    Reduction-condition atom: the shortened figure available when a qualifying
    prior information notice was published (15 days open / 10 days restricted
    and negotiation tenders).
  source: "Directive 2014/24/EU, Arts 27(2), 28(3), 29(1)"
with_electronic_submission:
  definition: >-
    Reduction-condition atom: the base tender figure less 5 days where
    electronic submission is accepted (30 open / 25 restricted and
    negotiation). Applies ONLY to the base figure -- no compounding.
  source: "Directive 2014/24/EU, Arts 27(4), 28(5), 29(1)"
under_state_of_urgency:
  definition: >-
    Reduction-condition atom: the accelerated figure under duly substantiated
    urgency (15 days open tenders; 15 days requests / 10 days tenders for
    restricted and negotiation). Not available for competitive dialogue or
    innovation partnership.
  source: "Directive 2014/24/EU, Arts 27(3), 28(6), 29(1)"
