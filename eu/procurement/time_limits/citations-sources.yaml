# Citation sourcing manifest for eu/procurement/time_limits.
# Instrument: Directive 2014/24/EU (Public Procurement), CELEX 32014L0024.
# Source of record: EUR-Lex official text (OJ L 94, 28.3.2014). Figures
# cross-checked 2026-07-24 against the article texts as published (open 35 /
# notice 15 / e-submission -5; restricted 30+30 / notice 10 / e-submission -5 /
# urgency 15+10; Art 29 applying Art 28(3)-(6); Arts 30-31 requests 30).
# retrieved: 2026-07-24
eu_dir_2014_24_art_27:
  status: "verified"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  units:
    - "02014L0024-20260101#parag_027.001"
    - "02014L0024-20260101#parag_027.002"
    - "02014L0024-20260101#point_027.002_a"
    - "02014L0024-20260101#point_027.002_b"
    - "02014L0024-20260101#parag_027.003"
    - "02014L0024-20260101#parag_027.004"
  retrieved: 2026-07-24
  note: >-
    Article 27 (open procedure): 27(1) minimum 35 days for receipt of tenders
    from contract-notice dispatch; 27(2) prior information notice published
    between 35 days and 12 months before the contract notice permits 15 days;
    27(3) duly substantiated state of urgency permits 15 days; 27(4)
    acceptance of electronic tender submission reduces the 27(1) figure -- and
    only that figure -- by 5 days (35 -> 30).
eu_dir_2014_24_art_28:
  status: "verified"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  units:
    - "02014L0024-20260101#parag_028.001"
    - "02014L0024-20260101#parag_028.002"
    - "02014L0024-20260101#parag_028.003"
    - "02014L0024-20260101#point_028.003_a"
    - "02014L0024-20260101#point_028.003_b"
    - "02014L0024-20260101#parag_028.005"
    - "02014L0024-20260101#parag_028.006"
    - "02014L0024-20260101#point_028.006_a"
    - "02014L0024-20260101#point_028.006_b"
  retrieved: 2026-07-24
  note: >-
    Article 28 (restricted procedure): 28(1) minimum 30 days for receipt of
    requests to participate; 28(2) minimum 30 days for receipt of tenders from
    invitation dispatch; 28(3) prior information notice permits 10 days for
    tenders; 28(5) electronic submission reduces the 28(2) figure -- and only
    that figure -- by 5 days (30 -> 25); 28(6) urgency: (a) requests not less
    than 15 days, (b) tenders not less than 10 days. 28(4) sub-central
    mutual-agreement deadlines are out of this domain's scope.
eu_dir_2014_24_art_29:
  status: "verified"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  unit: "02014L0024-20260101#parag_029.001"
  retrieved: 2026-07-24
  note: >-
    Article 29 (competitive procedure with negotiation): 29(1) subpara 4 --
    minimum 30 days for receipt of requests to participate and 30 days for
    receipt of initial tenders; Article 28(3) to (6) apply, importing the
    prior-information-notice (10), electronic-submission (25), and urgency
    (15 requests / 10 tenders) figures unchanged.
eu_dir_2014_24_art_30:
  status: "verified"
  ref: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
  unit: "02014L0024-20260101#parag_030.001"
  retrieved: 2026-07-24
  note: >-
    Article 30 (competitive dialogue): 30(1) subpara 2 -- minimum 30 days for
    receipt of requests to participate. No accelerated (urgency) variant and
    no reductions; the tender phase runs on invitations with no prescribed
    day minimum.
