# Statute pin for eu/procurement/time_limits -- ARTICLE 028 of five.
# This domain's scope is Arts 27-31, a contiguous run with NO single element covering
# exactly it: CHAPTER I -- Procedures has no sub-divisions and also carries Arts 25, 26
# and 32 (Art 32 being another domain's entire scope). So each article is pinned as its
# own extract and the domain's scope is their union -- every extract still ONE
# document-native subtree, which is what spec 13.15 requires.
#
# DOC_ID NAMES THE EXTRACT, NOT THE CONSOLIDATION. Unit ids are <doc_id>#<eid>, so five
# extracts of one consolidation sharing a doc_id collide and the loader keeps only the
# first -- it says so, and refuses the rest. Single-source domains here keep the plain
# consolidation id; only a domain pinning several documents needs to distinguish them.
doc_id: 02014L0024-20260101
celex: 02014L0024
consolidated: "2026-01-01"
format: fmx4
url: "http://publications.europa.eu/resource/celex/02014L0024-20260101.ENG.fmx4"
