# ── THE VERIFIED VALIDITY SPAN (spec §3.2, precondition P2) ──────────────────
# A CLAIM ABOUT THE STATUTE, made by comparison and falsifiable by re-running the
# comparison -- the same standing as `extract:` above, and recorded the same way: what
# was compared, how, against what, and what came back. Nothing here is inferred from the
# pin; the pin says which bytes this domain was formalized FROM, and the span says over
# which dates those bytes were the law.
#
# INCLUSIVE AT BOTH ENDS. `until` is the date of the pinned consolidation itself, which
# was in force on that date by construction.
#
# NOT AN APPLICABILITY FLOOR, and the coincidence of dates invites exactly that misreading.
# `from` is 2016-01-01 because that is the EARLIEST CONSOLIDATION CELLAR offers, so it is
# the earliest text there is anything to compare against. Whether Directive 2014/24/EU
# governed a given procedure at all is a different question with a different answer: Art
# 90 set the transposition deadline at 18 April 2016 and Art 91 repealed Directive
# 2004/18/EC from that date, so a procedure launched in March 2016 is governed by an
# instrument this corpus does not formalize. Neither Article is pinned and nothing in this
# system enforces that floor today (spec §15.2). A span inside which the text is verified
# is not a span inside which the instrument applies.
validity:
  from: "2016-01-01"
  until: "2026-01-01"
  basis: text_identical
  compared_with: 02014L0024-20160101
  compared_url: "http://publications.europa.eu/resource/celex/02014L0024-20160101.ENG.fmx4"
  compared_resolved_url: "http://publications.europa.eu/resource/cellar/5c33929b-3b42-4906-b060-00b88fa8901b.0020.01/DOC_1"
  compared_sha256: "08932c71fa5903f1668543d207315f50fba2c4d214fc95cd6cef74f08123d687"
  compared_bytes: 724467
  checked: 2026-08-23
  method: >
    Both sides reduced to normalised text -- XML comments dropped, every tag stripped,
    NBSP folded to a plain space, runs of whitespace collapsed -- then compared as
    strings. The left side is ARTICLE 028 of the consolidation named under
    `compared_with`; the right side is the ARTICLE in this sidecar's own pinned extract.

    THE SERIES WAS ENUMERATED FIRST, not assumed: CELLAR offers 02014L0024 consolidated
    at 20160101, 20180101, 20200101, 20220101, 20240101 and 20260101. There is no
    20160418 consolidation for the transposition deadline; 20160101 is the earliest that
    exists, and it is the text that was in force when the Directive became applicable.

    THE LIMIT OF THE METHOD, stated rather than glossed: only the two ENDS of that series
    were compared. The four intermediate consolidations return DOC wrappers or RDF
    needing further hops from the plain celex route and were not retrieved, so a change
    followed by a reversion inside the span would not be caught. Re-running this
    comparison against any intermediate consolidation is what would close that, and is
    the reason every identifier needed to do so is recorded below.
  verified: >
    Normalised ARTICLE 028 is IDENTICAL between the compared consolidation and this
    pinned extract -- 2907 characters on both sides, string equality, checked 2026-08-23.
    So a finding dated anywhere inside this span rests on the same statutory text this
    domain was formalized from.

    NOTHING AFTER `until` HAS BEEN CHECKED. The pinned consolidation is the latest CELLAR
