  consequence: not_article_16_1_entity gives none of the duties of Title II.
- what: rts_testing_continuity_and_review_report
  instrument: Delegated Regulation (EU) 2024/1774 Articles 36 to 41
  cites:
  - 32024R1774#art_036
  - 32024R1774#art_037
  - 32024R1774#art_038
  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. ICT security testing, ICT systems acquisition,
    project and change management, the ICT business continuity plan and its testing
    and the report on the review of the simplified framework are formalised in the
    sibling order on the simplified framework's testing, continuity and review report.
  consequence: complete and none_outstanding say nothing about Articles 36 to 41 (open
    question (Q14)).
- what: entry_into_force
  instrument: Delegated Regulation (EU) 2024/1774 Article 42
  cites:
  - 32024R1774#art_042
  reason: Not pinned in this domain. The order reads no date (reading (13)).
  consequence: No answer depends on a date (open question (Q13)).
