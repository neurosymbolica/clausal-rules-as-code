  - 32024R1774#art_015
  - 32024R1774#art_016
  - 32024R1774#art_017
  - 32024R1774#art_018
  - 32024R1774#art_019
  - 32024R1774#art_020
  - 32024R1774#art_021
  - 32024R1774#art_022
  - 32024R1774#art_023
  - 32024R1774#art_024
  - 32024R1774#art_025
  - 32024R1774#art_026
  - 32024R1774#art_027
  reason: Not pinned in this domain. Title I and Title II of the RTS (the ICT risk
    management framework of the financial entities other than those of Article 16(1))
