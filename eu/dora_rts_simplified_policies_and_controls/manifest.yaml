uses: []

scope: >-
  For ONE financial entity, which duties of the simplified ICT risk management
  framework in Commission Delegated Regulation (EU) 2024/1774 (the RTS), Title
  III, Articles 28 to 35 (governance and organisation, the information security
  policy and ICT security measures, classification of functions and assets, ICT
  risk management, physical and environmental security, access control, ICT
  operations security, data, system and network security) apply to it
  (simplified_policies_and_controls_duties_required), whether it has performed
  all of them (simplified_policies_and_controls_duties_complete) and which are
  outstanding (simplified_policies_and_controls_duties_outstanding). The gate is
  Regulation (EU) 2022/2554 (DORA), Article 16(1), first subparagraph, stated by
  the caller as a crisp fact. Each duty is a tri-state caller judgement; an
  unsure judgement is referred to a lawyer as open_textured, never decided by a
  crisp test. Out of scope: whether the entity is a financial entity within the
  scope of DORA and which entities are those of Article 16(1) (DORA orders on
  scope and on proportionality); the duties of Article 16(1), points (a) to (h),
  and Article 16(2) of DORA itself; Articles 36 to 41 of the RTS (sibling order
  on testing, continuity and the review report); Title II of the RTS; Article
  28(3) of the RTS (a permission, deferred). Every reading is the drafter's, not
  a lawyer's.

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 supplementing Regulation (EU) 2022/2554 with regard to regulatory technical standards specifying ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework (OJ L, 2024/1774), Title III, Articles 28 to 35; original OJ text as published (32024R1774)"
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council on digital operational resilience for the financial sector (DORA) (OJ L 333, 27.12.2022, p. 1), Article 16(1), first subparagraph, as the gate; original OJ text as published (32022R2554)"

query_interface:
  2: "dora_rts_simplified_policies_and_controls_eligibility/2"          # eligibility: is the entity bound by Title III, with a cited checklist
  7: "dora_rts_simplified_policies_and_controls_justification/3"        # justification: cite(...) provenance per checklist item
  13: "dora_rts_simplified_policies_and_controls_compliance_check/3"    # compliance check: is the entity in compliance with one duty now
  16: "dora_rts_simplified_policies_and_controls_what_if/4"             # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_016
  - 32024R1774#art_028
  - 32024R1774#art_029
  - 32024R1774#art_030
  - 32024R1774#art_031
  - 32024R1774#art_032
  reason: The heading of Article 16 of DORA and the headings of Articles 28 to 32
    of the RTS carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_entities
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'Art 16(1), first subparagraph (Articles 5 to 15 do not apply to the entities
    it lists), is formalised as the gate of every query (reading (1)). Not formalised:
    who those entities are, which the caller states, and the lead words of the second
    subparagraph, which introduce the duties of the simplified ICT risk management
    framework of DORA itself; those are the subject of the DORA order on proportionality
    and the simplified framework.'
  consequence: 'not_article_16_1_entity says only that Title III of the RTS does not
    bind the entity; it gives none of the duties of Title II. PARTLY FORMALISED: the
    first subparagraph as the gate only.'
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on proportionality and the simplified framework;
    the deferral stands for this order (open question (Q1)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: Art 16(1), second subparagraph, points (a) to (h), list the duties of the
    simplified ICT risk management framework in DORA, and Art 16(2) requires that
    framework to be documented and reviewed (reading (11)).
  consequence: complete and none_outstanding say nothing about these duties (open
    question (Q11)).
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on proportionality and the simplified framework;
    the deferral stands for this order.
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: outsourced_verification_of_compliance
  units:
  - 32024R1774#parag_028.003
  reason: Art 28(3) permits the outsourcing of the tasks of verifying compliance with
    ICT risk management requirements and keeps the entity fully responsible for that
    verification. It sets no duty with an output of its own (reading (10)).
  consequence: No answer turns on it; a verification done by a provider is judged
    under Art 28(5) and (6) as done by the entity (open question (Q10)).
  declaration: answered_with_caveat
  debt: true
  open: a permission and an allocation of responsibility; not formalisable as a rule
    with an output in this order; the deferral stands for this run.

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (2)); which entities are those of Article
    16(1) is decided in the DORA order on proportionality and the simplified framework
    (reading (1)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q2)).
- what: ict_risk_management_framework_of_dora
  instrument: Regulation (EU) 2022/2554 Articles 4 to 15
  cites:
  - 32022R2554#art_004
