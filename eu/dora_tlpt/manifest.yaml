uses: []

scope: "Who must carry out advanced testing by means of threat-led penetration
  testing (TLPT) under Regulation (EU) 2022/2554 (DORA), and how often: Article
  26(1) and Article 26(8), third subparagraph, points (a) to (c), of the
  Regulation, and Article 2(1) and (2) of Commission Delegated Regulation (EU)
  2025/1190 (the TLPT RTS). For one financial entity, tlpt_identification_basis
  answers whether a carve-out of Art 26(1) (an Article 16(1) entity, a
  microenterprise) excludes it from TLPT and otherwise whether it falls within a
  point (a) to (g) of Article 2(2) of the TLPT RTS (listed_for_tlpt, which is not
  the duty: the authority shall require TLPT unless its assessment shows it is
  not justified); tlpt_duty answers whether the entity, once identified by the
  authority, must carry out TLPT at least every three years or at the frequency
  the competent authority has set. Out of scope: the requirements for the test
  and the testers (Art 26(2) to (8), first and second subparagraphs, Article 27,
  Articles 7 and 15 of the TLPT RTS; order eu/dora-tlpt-testers-and-tests), the
  steps of the testing process (Articles 4 to 6 and 8 to 13 of the TLPT RTS;
  order eu/dora-tlpt-process), the authority's own assessment under Article 2(1)
  and its group decision under Article 2(3) (caller facts), and the due date of
  the next test. A financial entity within the scope of the Regulation is
  presupposed. Every reading is the drafter's, not a lawyer's."

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of
    14 December 2022 on digital operational resilience for the financial sector
    (DORA), OJ L 333, 27.12.2022, p. 1: Article 26(1) and Article 26(8), third
    subparagraph, points (a) to (c)"
  - "Commission Delegated Regulation (EU) 2025/1190 supplementing Regulation (EU)
    2022/2554 with regard to regulatory technical standards specifying the
    criteria used for identifying financial entities required to perform
    threat-led penetration testing (the TLPT RTS), OJ L series: Article 2(1)
    and Article 2(2), points (a) to (g) with their sub-points and closing
    subparagraphs"

query_interface:
  2: "dora_tlpt_status/2"      # eligibility: the RESULT of tlpt_duty/3
  7: "dora_tlpt_checklist/2"   # justification: checklist items each carry cite(...)
  16: "dora_tlpt_what_if/4"    # what_if: re-evaluate under an overridden key

