  - 32025R1190#art_002
  reason: The heading of Article 26 of the Regulation and the heading of Article 2
    of the TLPT RTS carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: article_26_8_testers
  units:
  - 32022R2554#parag_026.008
  partial: true
  reason: 'Art 26(8), third subparagraph (the competent authorities identify the financial
    entities required to perform TLPT), with its points (a) to (c), is formalised
    (readings (2), (11), (13)). Not formalised here: the first subparagraph (financial
    entities contract testers in accordance with Article 27, and contract external
    testers every three tests where they use internal testers) and the second subparagraph
    (significant credit institutions use only external testers). They are requirements
    for the testers, left to the order eu/dora-tlpt-testers-and-tests.'
  consequence: The answers say nothing on who may test; tlpt_required does not check
    the testers.
  declaration: answered_with_caveat
  debt: true
  open: formalised in the order eu/dora-tlpt-testers-and-tests (open question (Q16)).
