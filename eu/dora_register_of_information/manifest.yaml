uses: []

scope: >-
  The register-of-information duties of ONE financial entity under Regulation
  (EU) 2022/2554 (DORA) Article 28(3) and Commission Implementing Regulation
  (EU) 2024/2956 (the ITS) Articles 2 to 6: which of the thirty-four duties
  apply to it and at which levels (register_of_information_duties_required/3),
  whether it has performed all of them (register_of_information_duties_complete/3),
  and which are outstanding (register_of_information_duties_outstanding/3).
  Each duty applies always or on one crisp trigger the caller states; its
  performance is the caller's judgement (true, false or unsure), an unsure
  judgement that decides being referred as needs_legal_review. Out of scope:
  whether the entity is a financial entity within the scope of DORA (presupposed;
  the DORA order on scope and entity types), the content of each template
  (Annexes I to IV of the ITS), the rest of Article 28 (deferred, formalised
  where it is in the DORA orders on the financial entity's ICT third-party duties
  and on the key contractual provisions) and the permissive ITS Art 5(2).
  Every reading is the drafter's, not a lawyer's.

sources:
  - "Regulation (EU) 2022/2554 of the European Parliament and of the Council of 14 December 2022 on digital operational resilience for the financial sector (DORA), OJ L 333, 27.12.2022, p. 1 (CELEX 32022R2554), Article 28(3); Article 28(1) and (2) quoted for readings only"
  - "Commission Implementing Regulation (EU) 2024/2956 laying down implementing technical standards for the application of Regulation (EU) 2022/2554 with regard to standard templates for the register of information (CELEX 32024R2956), Articles 2, 3, 4, 5(1) and 6; Article 1 and Article 5(2) quoted for readings only"

query_interface:
  2: "dora_register_of_information_eligibility/2"        # eligibility: the decision with its cited checklist
  7: "dora_register_of_information_eligibility/2"        # justification: each checklist item carries cite(...)
  13: "dora_register_of_information_compliance_check/3"  # compliance check: may a duty be left unperformed
  16: "dora_register_of_information_what_if/4"           # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32022R2554#art_028
  - 32024R2956#art_003
  - 32024R2956#art_004
  - 32024R2956#art_005
  - 32024R2956#art_006
  reason: The heading of Article 28 of DORA and the headings of Articles 3 to 6 of
    the ITS carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: general_principles
  units:
  - 32022R2554#parag_028.001
  - 32022R2554#point_028.001_a
  - 32022R2554#point_028.001_b
  - 32022R2554#point_028.001_b_i
  - 32022R2554#point_028.001_b_ii
  reason: 'Art 28(1) requires financial entities to manage ICT third-party risk within
    their ICT risk management framework, to remain fully responsible for their obligations
    (point (a)) and to apply the principle of proportionality (point (b)). It is quoted
    for reading (3) only: proportionality is read as removing no duty.'
  consequence: No answer turns on it; proportionality removes no duty in this order
    (open question (Q3)).
  declaration: answered_with_caveat
  debt: true
  open: principles; not formalisable as a rule with an output in this order; the deferral
    stands for this run.
- what: strategy_on_ict_third_party_risk
  units:
  - 32022R2554#parag_028.002
  reason: 'Art 28(2) requires a strategy on ICT third-party risk with a policy on
    ICT services supporting critical or important functions, reviewed by the management
    body; the entities of Article 16(1), first subparagraph, and microenterprises
    are excepted. It is quoted for reading (2) only: its exceptions are not read into
    Art 28(3).'
  consequence: The order does not say whether the entity needs or has a strategy.
  declaration: answered_with_caveat
  debt: true
  open: its first sentence is formalised in the DORA order on the financial entity's
    ICT third-party duties; the deferral stands for this order.
- what: entity_duties_before_and_during_arrangements
  units:
  - 32022R2554#parag_028.004
  - 32022R2554#point_028.004_a
  - 32022R2554#point_028.004_b
  - 32022R2554#point_028.004_c
  - 32022R2554#point_028.004_d
  - 32022R2554#point_028.004_e
  - 32022R2554#parag_028.005
  - 32022R2554#parag_028.006
  reason: Art 28(4) lists the assessments before entering into an arrangement, Art
    28(5) limits arrangements to providers that comply with appropriate information
    security standards, and Art 28(6) governs how access, inspection and audit rights
    are exercised (reading (21)).
  consequence: complete and none_outstanding say nothing about these duties (open
    question (Q19)).
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on the financial entity's ICT third-party duties;
    the deferral stands for this order.
- what: termination_circumstances
  units:
  - 32022R2554#parag_028.007
  - 32022R2554#point_028.007_a
  - 32022R2554#point_028.007_b
  - 32022R2554#point_028.007_c
  - 32022R2554#point_028.007_d
  reason: Art 28(7) lists the circumstances in which contractual arrangements must
    be capable of termination; it is a requirement on the contract (reading (21)).
  consequence: complete and none_outstanding say nothing about the termination rights
    (open question (Q19)).
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on the key contractual provisions; the deferral
    stands for this order.
- what: exit_strategies_and_plans
  units:
  - 32022R2554#parag_028.008
  - 32022R2554#point_028.008_a
  - 32022R2554#point_028.008_b
  - 32022R2554#point_028.008_c
  reason: Art 28(8) requires exit strategies and plans for ICT services supporting
    critical or important functions (reading (21)).
  consequence: complete and none_outstanding say nothing about the exit strategies
    (open question (Q19)).
  declaration: answered_with_caveat
  debt: true
  open: formalised in the DORA order on the financial entity's ICT third-party duties;
    the deferral stands for this order.
- what: technical_standards_mandates
  units:
  - 32022R2554#parag_028.009
  - 32022R2554#parag_028.010
  reason: Art 28(9) and (10) give the European Supervisory Authorities mandates to
    draft technical standards for the register of information and for the policy on
    ICT services supporting critical or important functions, and the Commission power
    to adopt them. They bind the authorities, not the financial entity.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional
- what: definitions
  units:
  - 32024R2956#art_001
  - 32024R2956#point_001_a
  - 32024R2956#point_001_b
  reason: ITS Article 1 defines the direct ICT third-party service provider, the ICT
    service supply chain and the rank. The definitions are read as the meaning of
    the words of the duties and carry no key of their own (reading (16)).
  consequence: The order does not check that a provider meets a definition; the caller
    judges it (open question (Q16)).
  declaration: answered_with_caveat
  debt: true
  open: definitions with no output of their own; the deferral stands for this run.
- what: additional_information
  units:
  - 32024R2956#parag_005.002
  reason: ITS Art 5(2) allows financial entities to include additional information
    in the register, where relevant for their risk or contract management. It is permissive
    and sets no duty (reading (17)).
  consequence: No duty is added or removed; additional information never makes the
    register incomplete.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: entry_into_force
  units:
  - 32024R2956#art_007
  reason: ITS Article 7 fixes the entry into force of the ITS on the twentieth day
    following its publication.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: data_quality_principles_points
  units:
  - 32024R2956#point_003.004_a
  - 32024R2956#point_003.004_b
  - 32024R2956#point_003.004_c
  - 32024R2956#point_003.004_d
  - 32024R2956#point_003.004_e
  - 32024R2956#point_003.004_f
  reason: 'ITS Art 3(4), points (a) to (f), list the six principles of data quality
    (accuracy, completeness, consistency, integrity, uniformity, validity). They are
    read with Art 3(3), first sentence, as one set of qualities and one duty, data_quality,
    formalised through the paragraph key eu_reg_2024_2956_art_3_4 (reading (13)); no
    point carries a key of its own.'
  consequence: No answer turns on a single principle; whether the template information
    meets all six is the caller's one judgement (open question (Q13)).
  declaration: answered_with_caveat
  debt: true
  open: one key per requirement by reading (13); the deferral of the points stands
    for this run.

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); the critical or important functions
    of Article 3, point (22), are the caller's facts (reading (7)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4
  cites:
  - 32022R2554#art_004
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (3)).
  consequence: No duty is removed for size (open question (Q3)).
- what: simplified_framework_entities
  instrument: Regulation (EU) 2022/2554 Article 16
  cites:
  - 32022R2554#art_016
  reason: Not pinned in this domain. Article 16(1) disapplies Articles 5 to 15 only;
    the register of Art 28(3) binds its entities too (reading (2)).
  consequence: No answer turns on Article 16 (open question (Q2)).
- what: contract_terms
  instrument: Regulation (EU) 2022/2554 Article 30
  cites:
  - 32022R2554#art_030
  reason: Not pinned in this domain. The key contractual provisions are formalised
    in their own order (reading (21)).
  consequence: complete and none_outstanding say nothing about the contract terms
    (open question (Q19)).
- what: date_of_application
  instrument: Regulation (EU) 2022/2554 Article 64
  cites:
  - 32022R2554#art_064
  reason: Not pinned in this domain. DORA applies from 17 January 2025; the order
    reads no date (reading (18)).
  consequence: No answer depends on a date (open question (Q18)).
- what: templates_and_instructions
  instrument: Commission Implementing Regulation (EU) 2024/2956 Annexes I to IV
  cites:
  - 32024R2956#anx_I
  - 32024R2956#anx_II
  - 32024R2956#anx_III
  - 32024R2956#anx_IV
  reason: Not pinned in this domain. The templates and their instructions specify
    the content of each data element; the order reads, for each template of Art 5(1),
    whether the register includes it as specified, as the caller judges it (reading
    (5)).
  consequence: The order does not check the content of a template (open question (Q5)).
- what: european_unique_identifier
  instrument: Directive (EU) 2017/1132 Article 16
  cites:
  - 32017L1132#art_016
  reason: Not pinned in this domain. The EUID named in ITS Art 3(5) is the caller's
    matter (reading (15)).
  consequence: The order does not check an identifier (open question (Q15)).
