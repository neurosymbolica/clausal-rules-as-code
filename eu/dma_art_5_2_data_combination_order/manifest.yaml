  - 32022R1925#point_002_12
  - 32022R1925#point_002_13
  - 32022R1925#point_002_14
  - 32022R1925#point_002_15
  - 32022R1925#point_002_16
  - 32022R1925#point_002_17
  - 32022R1925#point_002_18
  - 32022R1925#point_002_19
  - 32022R1925#point_002_20
  - 32022R1925#point_002_21
  - 32022R1925#point_002_22
  - 32022R1925#point_002_23
  - 32022R1925#point_002_24
  - 32022R1925#point_002_25
  - 32022R1925#point_002_26
  - 32022R1925#point_002_27
  - 32022R1925#point_002_28
  - 32022R1925#point_002_29
  - 32022R1925#point_002_30
  - 32022R1925#point_002_31
  - 32022R1925#point_002_33
  reason: Article 2 defines, among others, gatekeeper (point (1)), core platform service
    (point (2)), end user (point (20)), business user (point (21)), personal data
    (point (25)) and profiling (point (31)). This order reads only point (32), consent;
    that the undertaking is a gatekeeper and the service a core platform service,
    and what counts as an end user and as personal data, are the caller's premises
    (reading (2)), and the designation is an outside fact (reading (3)).
  consequence: The caller establishes the premises first; the answers rest on them
    without checking them.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in part (the defined terms as checks on the premises); a later
    order.

excluded_set:
- what: gatekeeper_designation_and_compliance_period
  instrument: Regulation (EU) 2022/1925 Art 3
  cites:
  - 32022R1925#art_003
  reason: 'Article 3(9) (the designation decision listing the core platform services)
    and Article 3(10) (six months to comply after a listing) are named by Art 5(1)
    and by reading (3). Article 3 is not pinned in this order: the designation enters
    as an outside fact and the compliance period is not read (Q9).'
  consequence: A changed designation reaches the order as a new statement of the outside
    fact; the answers never say from when Art 5(2) must be complied with.
- what: consent_and_legal_bases_of_regulation_2016_679
  instrument: Regulation (EU) 2016/679 Arts 4, 6 and 7
  cites:
  - 02016R0679-20160504#art_004
  - 02016R0679-20160504#art_006
  - 02016R0679-20160504#art_007
  reason: 'Art 5(2) and Art 2(32) refer to Article 4, point (11), Article 6(1), points
    (c), (d) and (e), and Article 7 of Regulation (EU) 2016/679. This order does not
    formalise them: whether consent was given and whether one of the three points
    applies enter as outside facts (readings (5) and (6)).'
  consequence: The caller or another order answers the questions of Regulation (EU)
    2016/679 and states them.
- what: periods_dates_and_time_limits
  instrument: Regulation (EEC, Euratom) No 1182/71
  cites:
  - 31971R1182#art_003
  reason: Not pinned; whether it governs the one-year period of the second subparagraph
    of Art 5(2) is for legal review (Q2). The order counts the year by its own reading
    (8).
  consequence: If Regulation (EEC, Euratom) No 1182/71 governs the period, the answer
    of consent_request_repetition_status may differ on the anniversary day and where
    the period ends on a Saturday, Sunday or public holiday.
