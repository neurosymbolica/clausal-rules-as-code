scope: "Regulation (EU) 2022/1925 (Digital Markets Act), Art 5(1), Art 5(2) with
  its points (a) to (d), and Art 2(32). Three questions for one gatekeeper, one
  core platform service, one practice and one group of end users: whether the
  Article 5 obligations apply to the service (a Commission designation decision
  listing it, an attested outside fact); whether Art 5(2) prohibits the practice,
  allows it because the end user was presented with the specific choice and gave
  consent, allows it because the gatekeeper may rely on Article 6(1), point (c),
  (d) or (e), of Regulation (EU) 2016/679, or does not reach it; and whether,
  after a refusal or withdrawal of consent, the gatekeeper may repeat its request
  for the same purpose on a given day within the one-year period, counted from
  the refusal to its anniversary. Out of scope: Art 5(3) to (10); the other
  definitions of Art 2 (premises of the caller); Article 3 designation and its
  compliance period; whether consent or an Article 6(1) basis exists under
  Regulation (EU) 2016/679 (attested outside facts); Regulation (EEC, Euratom)
  No 1182/71 on periods. An unsure practice or an unsure specific choice is
  handed to a lawyer."

sources:
  - "Regulation (EU) 2022/1925 of the European Parliament and of the Council of 14 September 2022 on contestable and fair markets in the digital sector (Digital Markets Act), OJ L 265, 12.10.2022, p. 1 (original act, source xhtml sha256 d6af21a4f11c2b001b0486391fbd0813deba32305fb0d3865fbceccd45b827eb): Art 5(1) [32022R1925#parag_005.001], Art 5(2) [32022R1925#parag_005.002], Art 5(2)(a) to (d) [32022R1925#point_005.002_a to point_005.002_d], Art 2(32) [32022R1925#point_002_32]"

query_interface:
  2: "personal_data_practice_status/4"                       # eligibility/status: does Art 5(2) prohibit or allow the practice
  7: "dma_art_5_2_data_combination_order_checklist/2"        # justification: cited checklist, one item per condition
  15: "consent_request_repetition_status/6"                  # deadline: the one-year period for a repeated consent request
  16: "dma_art_5_2_data_combination_order_what_if/4"         # what_if: re-evaluate under an overridden key

deferred_set:
- what: article_heading
  units:
  - 32022R1925#art_005
  reason: 'The title of Article 5 carries no obligation: document structure. Deferred
    so every unit of the pinned extract is accounted for.'
  consequence: 'None for a caller: the title carries no obligation.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: other_obligations_of_article_5
  units:
  - 32022R1925#parag_005.003
  - 32022R1925#parag_005.004
  - 32022R1925#parag_005.005
  - 32022R1925#parag_005.006
  - 32022R1925#parag_005.007
  - 32022R1925#parag_005.008
  - 32022R1925#parag_005.009
  - 32022R1925#point_005.009_a
  - 32022R1925#point_005.009_b
  - 32022R1925#point_005.009_c
  - 32022R1925#parag_005.010
  - 32022R1925#point_005.010_a
  - 32022R1925#point_005.010_b
  - 32022R1925#point_005.010_c
  reason: Art 5(3) to (10) set the other obligations of Article 5 (prices and conditions
    offered elsewhere, communicating with end users, access through business users'
    applications, raising issues with authorities, identification, browser engine
    and payment services, tying of further core platform services, and information
    for advertisers and publishers). They are formalisable but are not part of this
    order's questions.
  consequence: The answers never say whether the gatekeeper complies with Art 5(3)
    to (10); practice_outside_article_5_2 says only that Art 5(2) does not reach the
    practice.
  declaration: answered_with_caveat
  debt: true
  open: formalisable (each paragraph a duty or prohibition on facts); later orders.
- what: definitions_not_read
  units:
  - 32022R1925#art_002
  - 32022R1925#point_002_1
  - 32022R1925#point_002_2
  - 32022R1925#point_002_2_a
  - 32022R1925#point_002_2_b
