eu_reg_2024_1774_art_17_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj"
  retrieved: 2026-11-23
  units: "32024R1774#parag_017.001, point_017.001_a to point_017.001_h, point_017.001_c_i to _c_iv, point_017.001_d_i to _d_iii"
  note: >-
    Art 17(1): the thirteen elements the ICT change management procedures of
    DORA Art 9(4)(e) must include, in respect of all changes to software,
    hardware, firmware components, systems, or security parameters. Applies to
    every entity type; duties 1 to 13 of the order.
eu_reg_2024_1774_art_17_2:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj"
  retrieved: 2026-11-23
  units: "32024R1774#parag_017.002, point_017.002_a~1 to _c~1, point_017.002_a~2 to _c~2, point_017.002_d, point_017.002_e"
  note: >-
    Art 17(2): after significant changes to their ICT systems, central
    counterparties and central securities depositories submit them to
    stringent testing simulating stressed conditions (one duty), and involve,
    as appropriate, the parties listed for their type (one duty per list).
    Duties 14 to 16 of the order; each needs the trigger true.
eu_reg_2022_2554_art_16_1:
  status: verified
  url: "https://eur-lex.europa.eu/eli/reg/2022/2554/oj"
  retrieved: 2026-11-23
  units: "32022R2554#parag_016.001"
  note: >-
    DORA Art 16(1), first subparagraph: Articles 5 to 15 do not apply to the
    entities it lists; Article 17 of the Delegated Regulation (Title II) does
    not apply to them. The gate financial_entity_is_article_16_1_entity; its
    true value answers simplified_framework_entity.
