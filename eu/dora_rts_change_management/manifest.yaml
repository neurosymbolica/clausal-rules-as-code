# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports only kit modules (formalize_lib,
# kit/query_combinators), which are not backbone packages.
uses: []

scope: >-
  The financial entity's duties of ICT change management under Article 17(1)
  and (2) of Commission Delegated Regulation (EU) 2024/1774 (RTS on ICT risk
  management under Article 15 of Regulation (EU) 2022/2554, DORA), with the
  rule of DORA Article 16(1), first subparagraph, that Articles 5 to 15 of
  DORA do not apply to the entities it lists (answered simplified_framework_entity).
  For ONE financial entity it decides which of the sixteen duties apply
  (thirteen elements of Art 17(1), always; the stringent testing of Art 17(2)
  and the involvement of parties, for central counterparties and central
  securities depositories after significant changes), whether all are
  performed as the caller judges, and which are outstanding. Out of scope:
  whether the entity is a financial entity within DORA (presupposed), the
  simplified framework of DORA Art 16 and Title III, DORA Art 9(4)(e) itself,
  the other articles of the Delegated Regulation, and every open-textured
  judgement (adequate, effective, stringent, as appropriate), which is the
  caller's or, when unsure, a lawyer's.

sources:
  - "Commission Delegated Regulation (EU) 2024/1774 of 13 March 2024 (RTS on ICT risk management tools, methods, processes and policies and the simplified ICT risk management framework), OJ text as published (32024R1774), Article 17(1) and 17(2)"
  - "Regulation (EU) 2022/2554 (Digital Operational Resilience Act), OJ L 333, 27.12.2022, p. 1 (32022R2554), Article 16(1), first subparagraph"

query_interface:
  2: "dora_rts_change_management_status/2"          # eligibility/status verdict
  7: "dora_rts_change_management_checklist/2"       # justification: cited checklist per duty
  13: "ict_change_management_duties_complete/3"     # compliance_check: are the duties performed
  16: "dora_rts_change_management_what_if/4"        # what_if: re-evaluate under an overridden key

deferred_set:
- what: headings
  units:
  - 32024R1774#art_017
  - 32022R2554#art_016
  reason: The heading of Article 17 of the Delegated Regulation and the heading of
    DORA Article 16 carry no rule of their own.
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
- what: simplified_framework_duties
  units:
  - 32022R2554#parag_016.001
  partial: true
  reason: 'DORA Art 16(1), first subparagraph (Articles 5 to 15 of DORA do not apply
    to the entities it lists), is formalised as the gate of every query (reading (2)).
    Not formalised: who those entities are, which the caller states, and the lead
    words of the second subparagraph, which introduce the duties of the simplified
    ICT risk management framework; those are the subject of the order on proportionality
    and the simplified framework.'
  consequence: simplified_framework_entity says only that Article 17 of the Delegated
    Regulation does not apply; it gives none of the duties the entity has instead.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (open question (Q2)).
- what: simplified_framework_duty_list
  units:
  - 32022R2554#point_016.001_a
  - 32022R2554#point_016.001_b
  - 32022R2554#point_016.001_c
  - 32022R2554#point_016.001_d
  - 32022R2554#point_016.001_e
  - 32022R2554#point_016.001_f
  - 32022R2554#point_016.001_g
  - 32022R2554#point_016.001_h
  - 32022R2554#parag_016.002
  reason: DORA Art 16(1), second subparagraph, points (a) to (h), list the duties
    of the simplified ICT risk management framework, and DORA Art 16(2) requires that
    framework to be documented and reviewed. They bind only the entities of DORA Article
    16(1), for which every query answers simplified_framework_entity.
  consequence: The order does not check the simplified framework.
  declaration: answered_with_caveat
  debt: true
  open: to be formalised in the order on proportionality and the simplified framework;
    the deferral stands for this order (reading (15)).
- what: technical_standards_mandate
  units:
  - 32022R2554#parag_016.003
  - 32022R2554#point_016.003_a
  - 32022R2554#point_016.003_b
  - 32022R2554#point_016.003_c
  - 32022R2554#point_016.003_d
  - 32022R2554#point_016.003_e
  reason: DORA Art 16(3) gives the European Supervisory Authorities a mandate to draft
    regulatory technical standards on the simplified framework, and the Commission
    power to adopt them.
  consequence: None for these answers.
  declaration: not_an_exception
  not_formalized_because: institutional

excluded_set:
- what: scope_and_entity_types
  instrument: Regulation (EU) 2022/2554 Articles 2 and 3
  cites:
  - 32022R2554#art_002
  - 32022R2554#art_003
  reason: Not pinned in this domain. Whether the entity is a financial entity within
    the scope of DORA is presupposed (reading (1)); the entity type atoms are those
    of the order on scope and entity types, which formalises Article 2 (reading (7)).
  consequence: The answers presuppose a financial entity within scope (open question
    (Q1)).
- what: proportionality_principle
  instrument: Regulation (EU) 2022/2554 Article 4 and Commission Delegated Regulation
    (EU) 2024/1774 Article 1
  cites:
  - 32022R2554#art_004
  - 32024R1774#art_001
  reason: Not pinned in this domain. The principle of proportionality is read as removing
    no duty (reading (11)).
  consequence: No duty is removed for size (open question (Q11)).
- what: ict_change_management_procedures_of_dora
  instrument: Regulation (EU) 2022/2554 Article 9 (point (e) of Article 9(4)) and
    Article 15
  cites:
  - 32022R2554#art_009
  - 32022R2554#art_015
  reason: Not pinned in this domain. Art 17(1) names the ICT change management procedures
    of DORA Art 9(4)(e), formalised in the order on ICT risk protection and detection;
    DORA Article 15 is the mandate under which the Delegated Regulation was adopted
    (readings (9), (15)).
  consequence: The order does not check DORA Art 9(4)(e) (open question (Q9)).
- what: other_articles_of_title_ii
  instrument: Commission Delegated Regulation (EU) 2024/1774 Articles 2 to 16 and
    18 to 27
  cites:
  - 32024R1774#art_002
  - 32024R1774#art_003
  - 32024R1774#art_004
  - 32024R1774#art_005
  - 32024R1774#art_006
  - 32024R1774#art_007
  - 32024R1774#art_008
  - 32024R1774#art_009
  - 32024R1774#art_010
  - 32024R1774#art_011
  - 32024R1774#art_012
  - 32024R1774#art_013
  - 32024R1774#art_014
  - 32024R1774#art_015
  - 32024R1774#art_016
  - 32024R1774#art_018
  - 32024R1774#art_019
  - 32024R1774#art_020
  - 32024R1774#art_021
  - 32024R1774#art_022
  - 32024R1774#art_023
  - 32024R1774#art_024
  - 32024R1774#art_025
  - 32024R1774#art_026
  - 32024R1774#art_027
  reason: Not pinned in this domain. They are formalised in their own orders; Article
    24 sets the components of the ICT business continuity policy named in Art 17(2),
    third subparagraph, point (e) (readings (10), (15)).
  consequence: complete and none_outstanding say nothing about those articles (open
    question (Q15)).
- what: simplified_framework_of_title_iii
  instrument: Commission Delegated Regulation (EU) 2024/1774 Articles 28 to 41
  cites:
  - 32024R1774#art_028
  - 32024R1774#art_029
  - 32024R1774#art_030
  - 32024R1774#art_031
  - 32024R1774#art_032
  - 32024R1774#art_033
  - 32024R1774#art_034
  - 32024R1774#art_035
  - 32024R1774#art_036
  - 32024R1774#art_037
  - 32024R1774#art_038
  - 32024R1774#art_039
  - 32024R1774#art_040
  - 32024R1774#art_041
  reason: Not pinned in this domain. Title III specifies the simplified ICT risk management
    framework of the entities of DORA Article 16(1), for which every query answers
    simplified_framework_entity (reading (2)); it is formalised in the order on the
    simplified framework.
  consequence: simplified_framework_entity gives none of the duties of Title III (open
    question (Q2)).
- what: ict_business_continuity_policy
  instrument: Regulation (EU) 2022/2554 Article 11
  cites:
  - 32022R2554#art_011
  reason: Not pinned in this domain. Art 17(2), third subparagraph, point (e), names
    the interdependencies identified in the ICT business continuity policy; the policy
    is formalised in the order on ICT risk response and recovery (reading (10)).
  consequence: The order does not read which institutions the policy identifies (open
    question (Q10)).
- what: entry_into_force
  instrument: Commission Delegated Regulation (EU) 2024/1774 Article 42
  cites:
  - 32024R1774#art_042
  reason: Not pinned in this domain. The Delegated Regulation applies from 17 January
    2025; the order answers on it as it applies and reads no date (reading (12)).
  consequence: No answer depends on a date (open question (Q12)).
