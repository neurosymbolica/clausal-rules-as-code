  consequence: None for a caller of this order.
  declaration: not_an_exception
  not_formalized_because: structural
- what: bureau_power_of_exemption
  units:
  - ae-pdpl-fdl-45-2021-en-uaelegislation#art3
  reason: 'Art 3 lets the Bureau [quotation omitted]
    [quotation omitted]
    [quotation omitted]''. The Executive
    Regulations are not known to be issued and no Bureau decision or list is known,
    so ''a large volume'' has no stated measure and whether an exemption was granted
    is unknown. A NAMED GAP, not formalised: no query reads it (reading (13), Q12);
    see the Executive Regulations.'
  consequence: applies and in_force never say whether the Bureau has exempted an establishment
    from part or all of the requirements.
  declaration: answered_with_caveat
  debt: true
