# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. None: only the kit's formalize_lib is used.
uses: []

scope: >-
  Whether Federal Decree by Law No. (45) of 2021 Concerning the Protection of
  Personal Data (UAE PDPL) applies to ONE processing of personal data on ONE
  day, processing_date (a date, year 1 to 9999, both ends): pdpl_applies reads
  Art 2(1) (three ways: a data subject residing or having a place of business
  in the State; a controller or processor residing in the State; one residing
  outside the State processing data of data subjects inside it) and Art 2(2)
  (seven exclusions, each a caller judgement), with the Art 1 definitions of
  Personal Data and Processing (a caller judgement) and Art 31 (in force as of
  2 January 2022, that day included); pdpl_in_force reads Art 31 only. An
  unsure judgement is handed to a lawyer (needs_legal_review, open_textured);
  a missing key is named first. Out of scope and NAMED GAPS: Art 3 (Bureau
  exemption), Art 28 (Executive Regulations, not known to be issued), Art 29
  (regularisation period), Art 30 (repeals); Arts 4 to 27 are left to other
  orders; the free-zone regimes (DIFC, ADGM) and the health, banking and credit
  legislation of Art 2(2)(e) to (g) are not read. The English translation is
  read; the Arabic text, which prevails, is not.

sources:
  - "Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data (UAE PDPL), English translation, UAE legislation portal https://uaelegislation.gov.ae/en/legislations/1972/download, saved 2026-11-25 (the Arabic text prevails; it is not read): Art 1 (Personal Data, Processing), Art 2(1)(a)-(c), Art 2(2)(a)-(g), Art 31"
  - "Same instrument, quoted as named gaps and not formalised: Art 1 (other definitions), Art 3, Art 28, Art 29, Art 30"

query_interface:
  2: "pdpl_applies/3"                                  # eligibility: applies / does_not_apply / not_in_force, or a status compound
  7: "uae_pdpl_scope_and_exclusions_checklist/2"       # justification: checklist items, each with cite(...)
  16: "uae_pdpl_scope_and_exclusions_what_if/4"        # what_if: re-evaluate under an overridden key

