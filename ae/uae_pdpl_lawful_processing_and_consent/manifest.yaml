scope: >-
  UAE Federal Decree by Law No. (45) of 2021 Concerning the Protection of
  Personal Data (PDPL), English translation from uaelegislation.gov.ae (the
  Arabic text prevails and was not read). For ONE processing of personal data
  on ONE processing date, three questions are decided: (a)
  pdpl_processing_lawful_basis - whether Art 4 prohibits the processing
  (allowed_with_consent when the consent meets the Art 1 definition of Consent
  and Art 6(1) and is not withdrawn under Art 6(2); else
  allowed_without_consent naming the first of the ten Art 4 cases that holds;
  else not_allowed); (b) pdpl_consent_valid - whether the consent is valid,
  naming the first unmet of six conditions; (c) pdpl_processing_controls -
  whether the Art 5 controls of items 1 to 7 are met, naming the first one
  failed. Every query gives not_in_force before 2 January 2022 (Art 31).
  Open-textured judgements (necessity, the cases, the controls, the quality of
  consent) are the caller's, and an unsure one is referred to a lawyer.
  Out of scope: Art 4 item 11 and Art 5 item 8 (Executive Regulations, not known
  to be issued: named gaps), Art 29 regularisation, Arts 2 and 3 (scope and
  Bureau exemptions), data subject rights, controller and processor duties,
  cross-border transfer, complaints and penalties, the free-zone regimes (DIFC,
  ADGM), and every other law the text refers to.

sources:
  - "UAE Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data, English translation, uaelegislation.gov.ae, saved 2026-11-25 (pinned unit text ae-pdpl-fdl-45-2021-en-uaelegislation; the Arabic text prevails and was not read)"
  - "PDPL Art 1, definition of Consent (and, read by readings only, Personal Data, Sensitive Personal Data, Data Subject, Controller, Processing, Anonymization)"
  - "PDPL Art 4, lead-in and items 1 to 10 (processing without the consent of its owner); item 11 a named gap"
  - "PDPL Art 5, lead-in and items 1 to 7 (processing controls); item 8 a named gap"
  - "PDPL Art 6(1)(a) to (c) and Art 6(2) (terms of consent and withdrawal)"
  - "PDPL Art 31 (in force as of 02 January 2022); Arts 28 and 29 read by readings only"

query_interface:
  2: "uae_pdpl_lawful_processing_and_consent_eligibility/3"      # eligibility: eligible/ineligible/indeterminate with the cited checklist
  7: "uae_pdpl_lawful_processing_and_consent_justification/4"    # justification: a checklist item's status and its cite(...) list
  16: "uae_pdpl_lawful_processing_and_consent_what_if/4"         # what_if: re-evaluate under an overridden key

