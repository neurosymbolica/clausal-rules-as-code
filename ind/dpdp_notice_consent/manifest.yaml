uses: []

scope: >-
  Digital Personal Data Protection Act, 2023 ss 2(g), 2(i), 4, 5, 6 and 7, with
  the Digital Personal Data Protection Rules, 2025 rules 1(4), 3, 4 and 5 and the
  First and Second Schedules. Decided here, one question per query: whether
  personal data may be processed on the ground of consent (s 4(1)(a), s 4(2),
  s 6(1), s 6(4)); whether it may be processed for a listed legitimate use
  (s 4(1)(b), s 7, one clause per question); which notice the Data Fiduciary owes
  (s 5(1), s 5(2)(a), s 5(3), with rule 3 from 13 May 2027 on the calculated date
  of rule 1(4)); what a withdrawal of consent requires of the Data Fiduciary
  (s 6(4) to (6)); whether a person may act as a Consent Manager (s 2(g), s 6(7)
  to (9), rule 4(2)(a), (3) and (5)(a)); and the fixed lists of notice contents,
  request requirements, legitimate uses, Second Schedule standards and Consent
  Manager conditions and obligations. Out of scope: when the Act's sections came
  into force (caller facts); the open-textured judgements (lawful purpose, the
  quality of consent under s 6(1), the conditions of a s 7 clause, Data Fiduciary
  status, processing required or authorised by law), which are handed to a
  lawyer; the Data Principal's rights (ss 11 to 14), breach intimation, penalties,
  burden of proof (s 6(10)), splitting a consent (s 6(2)); and checking any
  notice, request, standard, condition or obligation against the lists.

sources:
  - "Digital Personal Data Protection Act, 2023 (No. 22 of 2023), Gazette of India Extraordinary, ss 2(d), (g), (i), (j), (k), (x), (za), 4(1), 4(1)(a), 4(1)(b), 4(2), 5(1) to (3), 6(1) to (10) and 7(a) to (i), MeitY website PDF https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf, fetched 2026-11-13 (MeitY copy, not India Code, not compared with the gazette)"
  - "Digital Personal Data Protection Rules, 2025, G.S.R. 846(E), Gazette of India Extraordinary (English half only), rules 1(1) to (4), 3, 4(1) to (6), 5(1) and (2), First Schedule Parts A and B and Note, Second Schedule, MeitY website PDF https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf, fetched 2026-11-13 (MeitY copy, not India Code, not compared with the gazette)"

