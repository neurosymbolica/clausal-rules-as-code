  - in-dpdp-rules-2025-meity-pdf#r2_1_d
  - in-dpdp-rules-2025-meity-pdf#r2_2
  reason: Rule 1(1) is the short title; rule 1(2) brings other rules into force; rule
    2 defines the Act, techno-legal measures, user account and verifiable consent
    and carries the Act's definitions into the Rules. No limb reads them.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  debt: true
- what: commencement_of_rule_4
  units:
  - in-dpdp-rules-2025-meity-pdf#r1_3
  reason: Rule 1(3) dates rule 4 (13 November 2026 on the calculated date of reading
    (3)); consent_manager_status takes the registration as a caller fact and reads
    no date (Q11).
  consequence: An answer never says whether rule 4 was in force on a given day.
  declaration: answered_with_caveat
  debt: true
  open: a later order could add a date test if the product needs it.
- what: consent_before_commencement_may_continue
  units:
  - in-dpdp-act-2023-meity-pdf#s5_2_b
  reason: s 5(2)(b) lets processing on a consent given before commencement continue
    until she withdraws it; the order reads such a consent as consent_given (reading
    (6), Q8); no limb cites it.
  consequence: consent_ground treats the earlier consent like any other; it never
    cites s 5(2)(b).
  declaration: answered_with_caveat
  debt: true
- what: part_invalid_consent
  units:
  - in-dpdp-act-2023-meity-pdf#s6_2
  reason: s 6(2) makes the infringing part of a consent invalid to that extent; the
    order does not split a consent (Q7).
  consequence: A caller with a partly invalid consent asks per purpose; no answer
    says which part is invalid.
  declaration: answered_with_caveat
  debt: true
- what: burden_of_proof_in_a_proceeding
  units:
  - in-dpdp-act-2023-meity-pdf#s6_10
  reason: s 6(10) puts on the Data Fiduciary, in a proceeding, the burden of proving
    that a notice and a consent were given in accordance with the Act and the rules;
    it governs proof before the Board and gives no answer of its own.
  consequence: 'None for a caller: no query answers a question of proof.'
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
