  - in-dpdp-rules-2025-meity-pdf#sch1_partB
  reason: These units hold only a section or rule number, a heading, or the lead-in
    words of a definition list; each limb cites the sub-section, clause, rule or item
    it reads. Document structure.
  consequence: 'None for a caller: the units they introduce are cited or deferred
    on their own.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: lead_in_words_of_listed_items
  units:
  - in-dpdp-rules-2025-meity-pdf#r3_c
  - in-dpdp-rules-2025-meity-pdf#sch1_partA_9
  - in-dpdp-rules-2025-meity-pdf#sch1_partB_3
  - in-dpdp-rules-2025-meity-pdf#sch1_partB_4
  - in-dpdp-rules-2025-meity-pdf#sch1_partB_11
  reason: 'These units hold the lead-in words of the items listed under them (rule
    3(c): the communication link and other means; First Schedule Part A item 9: independent
    certification; Part B items 3, 4 and 11: the record, access to it and publication);
    each item is a content_item of provision_lists with its own citation, and its
    NAME atom carries the lead-in sense. The lead-in words are substantive (for example
    the duty to maintain a record, to publish, to be independently certified) but
    have no limb of their own beyond the items.'
  consequence: 'None beyond the items: the items they introduce are listed with their
    own citations; no query checks a record, a publication or a certification.'
  declaration: answered_with_caveat
  debt: true
- what: substantive_lead_in_words
  units:
  - in-dpdp-rules-2025-meity-pdf#sch1_partB_12
  - in-dpdp-rules-2025-meity-pdf#sch2
  reason: First Schedule Part B item 12 (effective audit mechanisms, with the outcome
    reported to the Board periodically and on such other occasions as the Board may
    direct) and the Second Schedule lead-in (its heading and the duty to implement
    appropriate technical and organisational measures, in accordance with applicable
    law, to ensure effective observance of the standards listed) carry words of their
    own beyond their items; their items are content_items of provision_lists (audit_...
    and the eleven standards), but the lead-in duties have no item and no limb.
  consequence: The audit items do not say that the outcome is reported to the Board
    periodically and when the Board directs; the Second Schedule items do not say
    that technical and organisational measures are to be implemented. No query decides
    either.
  declaration: answered_with_caveat
  debt: true
  open: a later order could add these as items or duties if the product needs them.
