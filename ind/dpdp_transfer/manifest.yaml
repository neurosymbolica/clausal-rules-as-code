# SPDX-License-Identifier: EUPL-1.2
id: ind/dpdp_transfer
shape_family: deontic
kit_version: "0.1.0"
# The domain's .clausal file set, in import-DAG order (determination slices
# over a shared kernel). SINGLE SOURCE OF TRUTH for the module list: the
# scaffold writes it, and auto/pkginit.py (package facade), auto/phases.py
# (per-phase file lists) and auto/gates.py (atom hints) all read it from
# here. Keep it exact -- a module you drop from this list stops being
# re-exported by the generated package facade (__init__.clausal).
modules:
  - "kernel"
  - "citations"
  - "parameters"
  - "dpdp_transfer"
  - "queries"
  - "fixtures"
# public_interface: name/arity PREDICATES (and the root_exports bare atoms),
# grouped per submodule -- keep in sync with the :- module(...) export lists
# re-exported via the package facade __init__.clausal.
public_interface:
  # -- kernel.clausal --
  # (dpdp_transfer_input_problems/2 is defined here and re-exported by queries)
  # -- citations.clausal --
  - "citation/2"
  # -- dpdp_transfer.clausal --
  - "decide_dpdp_transfer/2"
  - "dpdp_transfer_status/2"
  - "dpdp_transfer_checklist/2"
  - "dpdp_transfer_decision_resolvable/1"
  - "dpdp_transfer_status_values/1"
  # -- queries.clausal --
  - "restriction_status/4"
  - "dpdp_transfer_profile_keys/1"
  - "dpdp_transfer_input_problems/2"
  - "dpdp_transfer_what_if/4"
  - "restricted_see_notification"
  - "requirements_apply_see_order"
  - "not_restricted"
  - "not_in_force"
  - "notified_destination"
  - "foreign_state_requirements"
  - "section_16_in_force_on_reference_date"
  - "destination_restricted_by_notification"
  - "reference_date"
  - "recipient_is_foreign_state_or_its_entity"
  - "foreign_state_requirements_specified"
  - "unsure"
  - "indeterminate/1"
  - "needs_legal_review/2"
  - "open_textured/2"
  - "inputs_relied_on/1"
  - "provenance/2"
  - "input_problems/1"
  - "unknown_key/1"
  - "wrong_type/1"
  - "duplicate_key/1"
  # -- fixtures.clausal --
  - "dpdp_transfer_subject/1"
  - "dpdp_transfer_profile_for/2"
  - "dpdp_transfer_assess/2"

# Independence classification: no external scorer yet -- the only check is a
# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports none (formalize_lib is a kit module).
uses: []

scope: "Restrictions on the transfer of personal data outside India under the Digital Personal Data Protection Act 2023 s 16 (s 16(1) the notified restriction, s 16(2) other laws saved) and rule 15 of the Digital Personal Data Protection Rules 2025, with rule 1(4) for the day rule 15 starts (13 May 2027, calculated by the drafter). For ONE transfer of personal data by ONE Data Fiduciary to ONE country or territory outside India on ONE reference day, it answers for each restriction on its own whether it reaches the transfer: notified_destination (restricted_see_notification, not_restricted, not_in_force) and foreign_state_requirements (requirements_apply_see_order, not_restricted, not_in_force), or names the one missing key, or refers an unsure open-textured judgement to a lawyer. Out of scope and never guessed: the commencement notifications of the Act, any notification under s 16(1), any order under rule 15 and their terms, and any other law saved by s 16(2); the breach, consent, security, rights, children and Significant Data Fiduciary rules. Drafter's reading, not a lawyer's."

sources:
  - "Digital Personal Data Protection Act, 2023 (No. 22 of 2023), Gazette of India Extraordinary, s 16(1) and s 16(2) (s 2(i), (r), (t), (x), (zb) quoted for the readings); MeitY website PDF fetched 2026-11-13, not India Code, not compared with the gazette"
  - "Digital Personal Data Protection Rules, 2025, G.S.R. 846(E), Gazette of India Extraordinary (header dated 13 November 2025), English text, rule 15 and rule 1(4); MeitY website PDF fetched 2026-11-13, not India Code, not compared with the gazette"

query_interface:
  2: "restriction_status/4"           # eligibility: the verdict of the called contract
  7: "dpdp_transfer_checklist/2"      # justification: checklist items each carry cite(Key)
  16: "dpdp_transfer_what_if/4"       # what_if: re-evaluate under an overridden key

deferred_set:
- what: definitions_not_read
  units:
  - in-dpdp-act-2023-meity-pdf#s2_a
  - in-dpdp-act-2023-meity-pdf#s2_b
  - in-dpdp-act-2023-meity-pdf#s2_c
  - in-dpdp-act-2023-meity-pdf#s2_d
  - in-dpdp-act-2023-meity-pdf#s2_e
  - in-dpdp-act-2023-meity-pdf#s2_f
  - in-dpdp-act-2023-meity-pdf#s2_g
  - in-dpdp-act-2023-meity-pdf#s2_h
  - in-dpdp-act-2023-meity-pdf#s2_j
  - in-dpdp-act-2023-meity-pdf#s2_j_i
  - in-dpdp-act-2023-meity-pdf#s2_j_ii
  - in-dpdp-act-2023-meity-pdf#s2_k
  - in-dpdp-act-2023-meity-pdf#s2_l
  - in-dpdp-act-2023-meity-pdf#s2_m
  - in-dpdp-act-2023-meity-pdf#s2_n
  - in-dpdp-act-2023-meity-pdf#s2_o
  - in-dpdp-act-2023-meity-pdf#s2_o_i
  - in-dpdp-act-2023-meity-pdf#s2_o_ii
  - in-dpdp-act-2023-meity-pdf#s2_p
  - in-dpdp-act-2023-meity-pdf#s2_p_i
  - in-dpdp-act-2023-meity-pdf#s2_p_ii
  - in-dpdp-act-2023-meity-pdf#s2_q
  - in-dpdp-act-2023-meity-pdf#s2_s
  - in-dpdp-act-2023-meity-pdf#s2_s_i
  - in-dpdp-act-2023-meity-pdf#s2_s_ii
  - in-dpdp-act-2023-meity-pdf#s2_s_iii
  - in-dpdp-act-2023-meity-pdf#s2_s_iv
  - in-dpdp-act-2023-meity-pdf#s2_s_v
  - in-dpdp-act-2023-meity-pdf#s2_s_vi
  - in-dpdp-act-2023-meity-pdf#s2_s_vii
  - in-dpdp-act-2023-meity-pdf#s2_u
  - in-dpdp-act-2023-meity-pdf#s2_v
  - in-dpdp-act-2023-meity-pdf#s2_w
  - in-dpdp-act-2023-meity-pdf#s2_y
  - in-dpdp-act-2023-meity-pdf#s2_z
  - in-dpdp-act-2023-meity-pdf#s2_za
  reason: The definitions of s 2 other than clauses (i), (r), (t), (x) and (zb) are
    not read by any limb or reading of this order; the words they define, where used,
    are read in their ordinary sense or by the caller.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  debt: true
- what: definitions_relied_on_by_readings
  units:
  - in-dpdp-act-2023-meity-pdf#s2_i
  - in-dpdp-act-2023-meity-pdf#s2_r
  - in-dpdp-act-2023-meity-pdf#s2_t
  - in-dpdp-act-2023-meity-pdf#s2_x
  - in-dpdp-act-2023-meity-pdf#s2_zb
  reason: 's 2(i) (Data Fiduciary), (r) (notification), (t) (personal data), (x) (processing)
    and (zb) (State) are quoted because readings (2), (11) and (12) rely on them;
    no limb cites them: the caller states the facts they define (readings (2), (8),
    (12)), and rule 15''s foreign State is not the State of s 2(zb) (reading (11)).'
  consequence: 'None for a caller: the keys destination_restricted_by_notification
    and recipient_is_foreign_state_or_its_entity carry them.'
  declaration: not_an_exception
  debt: true
- what: headings_and_lead_in
  units:
  - in-dpdp-act-2023-meity-pdf#s2
  - in-dpdp-act-2023-meity-pdf#s16
  - in-dpdp-rules-2025-meity-pdf#r1
  - in-dpdp-rules-2025-meity-pdf#r2
  reason: These units hold only the lead-in words of s 2 or the number or heading
    of s 16, rule 1 and rule 2; every limb cites the sub-section or rule it reads.
    Document structure.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  not_formalized_because: structural
- what: short_title_of_the_rules
  units:
  - in-dpdp-rules-2025-meity-pdf#r1_1
  reason: Rule 1(1) gives the short title of the Rules. Document structure.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  not_formalized_because: structural
- what: commencement_of_other_rules
  units:
  - in-dpdp-rules-2025-meity-pdf#r1_2
  - in-dpdp-rules-2025-meity-pdf#r1_3
  reason: Rule 1(2) and (3) bring other rules into force (rules 1, 2 and 17 to 21
    on publication; rule 4 after one year); only rule 1(4), which dates rule 15, is
    read.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  debt: true
- what: definitions_of_the_rules
  units:
  - in-dpdp-rules-2025-meity-pdf#r2_1
  - in-dpdp-rules-2025-meity-pdf#r2_1_a
  - in-dpdp-rules-2025-meity-pdf#r2_1_b
  - in-dpdp-rules-2025-meity-pdf#r2_1_c
  - in-dpdp-rules-2025-meity-pdf#r2_1_d
  - in-dpdp-rules-2025-meity-pdf#r2_2
  reason: Rule 2 defines terms of the Rules (Act, techno-legal measures, user account,
    verifiable consent) and carries the Act's definitions into the Rules; none of
    the terms it defines is read by a limb of this order.
  consequence: None for a caller of this order.
  declaration: not_an_exception
  debt: true
