# Citation sourcing manifest for ind/dpdp_transfer.
# Instruments: Digital Personal Data Protection Act, 2023 (No. 22 of 2023) and
# Digital Personal Data Protection Rules, 2025 (G.S.R. 846(E)), English text.
# Source of record: the pinned units, text extracts of the MeitY website PDFs
# fetched 2026-11-13 and converted by _tools/provisions/india_to_akn.py
# (MeitY copy, not India Code, not compared with the gazette).
# status: verified (verbatim is an exact substring of the fetched source at url)
#         | unverified (no verbatim yet)
# retrieved: 2026-11-13
in_dpdp_act_2023_s_16_1:
  status: verified
  url: "https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf"
  unit: "in-dpdp-act-2023-meity-pdf#s16_1"
  retrieved: 2026-11-13
  note: >-
    DPDP Act 2023 s 16(1): the Central Government may, by notification,
    restrict transfers by a Data Fiduciary to notified countries or territories
    outside India (a negative list; nothing is restricted until a notification
    restricts it). Anchors the notified_destination ladder, its not_in_force,
    not_restricted and restricted_see_notification results, the open_textured
    referral on destination_restricted_by_notification, and the s 16 leg of
    not_in_force for rule 15 (reading (7), Q1).
in_dpdp_act_2023_s_16_2:
  status: verified
  url: "https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf"
  unit: "in-dpdp-act-2023-meity-pdf#s16_2"
  retrieved: 2026-11-13
  note: >-
    DPDP Act 2023 s 16(2): s 16 does not restrict the applicability of any
    other law in force in India giving a higher degree of protection for or
    restriction on transfer outside India. Cited beside s 16(1) on
    not_restricted for notified_destination, so that answer is never read as
    free under every law of India (reading (4), Q6).
in_dpdp_rules_2025_r_15:
  status: verified
  url: "https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf"
  unit: "in-dpdp-rules-2025-meity-pdf#r15"
  retrieved: 2026-11-13
  note: >-
    DPDP Rules 2025 rule 15: a transfer outside India is subject to meeting
    requirements the Central Government specifies by general or special order
    for making the data available to a foreign State, or a person or entity
    under its control, or an agency of it. Anchors the
    foreign_state_requirements ladder, its not_restricted and
    requirements_apply_see_order results, and the open_textured referral on
    recipient_is_foreign_state_or_its_entity (readings (8) to (11)).
in_dpdp_rules_2025_r_1_4:
  status: verified
  url: "https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf"
  unit: "in-dpdp-rules-2025-meity-pdf#r1_4"
  retrieved: 2026-11-13
  note: >-
    DPDP Rules 2025 rule 1(4): rules 3, 5 to 16, 22 and 23 come into force
    eighteen months after the date of publication of the Gazette. The Gazette
    header is dated 13 November 2025 (pin label); the drafter CALCULATES the
    start of rule 15 as 13 May 2027 (main reading, reading (6), Q4). Boundary
    direction: a reference day before date(2027, 5, 13) is not_in_force; that
    day and later days are in force.
