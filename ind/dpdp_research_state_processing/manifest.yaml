# same-author differential one. Upgrade when an external anchor lands.
independence: no_external_scorer

# Shared backbone packages this domain imports.
uses:
  - "formalize_lib"

scope: >-
  Three determinations under the Digital Personal Data Protection Act 2023 and
  the Digital Personal Data Protection Rules 2025, each asked about ONE
  processing activity of personal data on ONE reference day and each answered
  on its own: (a) research_exemption -- whether the Act does not apply to the
  processing under s 17(2)(b) read with rule 16 and Second Schedule items (a),
  (c), (d), (e), (f) and (h) (exempt_from_act, not_exempt, not_in_force);
  (b) state_processing_standards -- whether processing by the State or an
  instrumentality for a use under s 7(b) follows the Second Schedule standards
  rule 5(1) requires (follows_second_schedule, does_not_follow_second_schedule,
  not_applicable, not_in_force); (c) state_processing_disapplied_provisions --
  which of s 8(7), s 12(2) and s 12(3) s 17(4) disapplies for processing by the
  State or an instrumentality. Rules 5 and 16 are read as in force from 13 May
  2027 (calculated from rule 1(4)); the commencement of s 7 and s 17 is stated
  by the caller. Open-textured judgements (research purpose, s 7(b) use, the
  seven open-textured standards, State or instrumentality, decision affecting
  the Data Principal) are stated by the caller and referred to a lawyer when
  unsure. Out of scope: the other exemptions of s 17 (s 17(1), s 17(2)(a),
  s 17(3), s 17(5)), the other legitimate uses of s 7 (sibling order
  ind/dpdp-notice-consent), the content of s 8(7), s 12(2) and s 12(3), any
  Central Government notification or policy and any other law the Second
  Schedule refers to.

sources:
  - "Digital Personal Data Protection Act, 2023 (No. 22 of 2023), Gazette of India Extraordinary, MeitY website PDF fetched 2026-11-13 (not India Code, not compared with the gazette): s 7(b), s 17(2), s 17(2)(b), s 17(4); definitions s 2(i), (j), (k), (t), (u), (x), (zb) relied on by readings."
  - "Digital Personal Data Protection Rules, 2025, G.S.R. 846(E), Gazette of India Extraordinary (header dated 13 November 2025), English text, MeitY website PDF fetched 2026-11-13: rule 1(4), rule 5(1), rule 16 and the Second Schedule items (a) to (h) with (g)(i) to (iii)."

query_interface:
  2: "dpdp_research_state_processing_status/2"      # eligibility/status verdict: the three contract results
  7: "dpdp_research_state_processing_checklist/2"   # justification: one cited row per query
  16: "dpdp_research_state_processing_what_if/4"    # what_if: re-evaluate under an overridden key

