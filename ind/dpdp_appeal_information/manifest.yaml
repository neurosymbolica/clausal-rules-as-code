independence: no_external_scorer

# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. The package imports only the kit (formalize_lib), no shared
# backbone package.
uses: []

scope: >-
  Two procedures of the Digital Personal Data Protection Act 2023 with the
  Digital Personal Data Protection Rules 2025 (drafter's reading, not a
  lawyer's). (a) The appeal to the Appellate Tribunal against an order or
  direction of the Data Protection Board of India (s 29(1) to (3), (6) and
  (7) with rule 22(1) and (2)): whether an appeal lies and is filed within
  the sixty days of s 29(2) (appeal_period, a late appeal answered as
  needing sufficient cause, never as barred), what the filing must meet
  under rule 22 (appeal_filing_requirements) and the six-month target of
  s 29(6) with the duty of s 29(7) to record reasons
  (appeal_disposal_target). (b) The Central Government's call for
  information (s 36 with rule 23(1) and (2) and the Seventh Schedule):
  whether the recipient must furnish it (information_call_status) and
  whether rule 23(2) bars disclosure of the furnishing
  (non_disclosure_status). Rule 1(4) dates rules 22 and 23 (13 May 2027, a
  calculated date). The commencement of s 29 and s 36, the open-textured
  judgements and the identity of an intermediary or authorised person are
  stated by the caller; a call outside the Seventh Schedule and every
  unsure judgement go to a lawyer. Out of scope: the Board's procedure
  (s 28), the Tribunal's powers and procedure, the Telecom Regulatory
  Authority of India Act 1997 (the fee amount), the Information Technology
  Act 2000, the General Clauses Act 1897, the Limitation Act 1963 and the
  commencement notifications.

sources:
  - "Digital Personal Data Protection Act, 2023 (No. 22 of 2023), Gazette of India Extraordinary, MeitY website copy fetched 2026-11-13: s 29(1), (2), (3), (6), (7); s 36; definitions s 2(a), (c), (i), (s), (v), (z) relied on by readings"
  - "Digital Personal Data Protection Rules, 2025, G.S.R. 846(E), Gazette of India Extraordinary (header dated 13 November 2025), English text, MeitY website copy fetched 2026-11-13: rule 1(4); rule 22(1), (2); rule 23(1), (2), (3); Seventh Schedule rows 1, 2 (i) and (ii), 3"

query_interface:
  2: "decide_dpdp_appeal_information/2"      # eligibility verdict (eligible | ineligible | indeterminate) from appeal_period/3
  7: "dpdp_appeal_information_checklist/2"   # justification: one cite(...) per checklist item
  16: "dpdp_appeal_information_what_if/4"    # what_if: re-evaluate under an overridden key

