  - uk-eur-2016-679-revised-2026-09-30#article-22D-4
  - uk-eur-2016-679-revised-2026-09-30#article-22D-5
  reason: 'UK GDPR Art 22D(1) to (5) give the Secretary of State power to make regulations
    about meaningful human involvement, similarly significant effects and the Art
    22C safeguards, subject to the affirmative resolution procedure: a power to make
    law, not a rule on facts. Whether any such regulations were made by the fetch
    date is not checked (reading (9)).'
  consequence: An answer does not apply any regulations under Art 22D (open question
    Q9).
  declaration: not_an_exception
  not_formalized_because: institutional
- what: eu_safeguard_duty
  units:
  - 02016R0679-20160504#parag_022.003
  instrument: Regulation (EU) 2016/679 Art 22(3)
  reason: EU Art 22(3) requires the controller, in the cases of Art 22(2)(a) and (c),
    to implement suitable measures, at least the right to obtain human intervention,
    to express his or her point of view and to contest the decision. This order compares
    whether the decision may be taken; it does not compare the EU safeguard duty with
    UK Art 22C.
  consequence: No EU answer says whether the Art 22(3) measures are implemented.
  declaration: answered_with_caveat
  debt: true
  open: formalisable as an EU safeguards query beside uk_automated_decision_safeguards/3;
    the deferral stands for this run.
