excluded_set:
- what: article_9_conditions
  instrument: UK GDPR Art 9 and Data Protection Act 2018 Sch 1; Regulation (EU) 2016/679
    Art 9
  cites:
  - uk-eur-2016-679#article-9
  - ukpga-2018-12#schedule-1
  - 32016R0679#art_009
  reason: Art 9(1) (special categories) and Art 9(2)(a) and (g), UK and EU, are named
    by Art 22B and EU Art 22(4) but not pinned; whether the data is special-category
    data and whether a point of Art 9(2) applies are the caller's (decision_based_entirely_or_partly_on_special_category_data,
    uk_article_9_2_g_applies, article_9_2_a_applies, eu_article_9_2_g_applies).
  consequence: The caller states those facts and judgements; the order does not test
    the Art 9 conditions.
- what: recognised_legitimate_interests
  instrument: UK GDPR Art 6(1)(ea), Art 6(5) and Annex 1
  cites:
  - uk-eur-2016-679#article-6-1-ea
  reason: Art 22B(4) turns on reliance on Art 6(1)(ea); which lawful basis the decision-maker
    relies on is a fact the caller states (processing_for_the_decision_relies_on_article_6_1_ea);
    this order does not decide whether Art 6(1)(ea) applies.
  consequence: The caller states whether the processing relies on Art 6(1)(ea).
- what: code_of_practice_on_automated_decision_making
  instrument: S.I. 2026/425 (Data Protection Act 2018 (Code of Practice on Artificial
    Intelligence and Automated Decision-Making) Regulations 2026)
  cites:
  - uksi-2026-425#regulation-2
  reason: S.I. 2026/425, made under sections 124A and 124B of the Data Protection
    Act 2018, requires the Commissioner to prepare a code of practice on automated
    decision-making (decision-making to which Art 22C(1) applies); it is guidance-making,
    not a rule on facts, and it is not made under Art 22D (reading (9)).
  consequence: No answer applies the code of practice.
- what: transparency_and_access_duties
  instrument: UK GDPR Arts 12 to 15 (as amended by Sch 6 of the 2025 Act)
  cites:
  - uk-eur-2016-679#article-13-2-f
  - uk-eur-2016-679#article-14-2-g
  - uk-eur-2016-679#article-15-1-h
  reason: The information about automated decision-making a controller must give on
    collection or on access (Arts 13(2)(f), 14(2)(g), 15(1)(h)) is not pinned for
    this order.
  consequence: No answer says what information must be given under Arts 13 to 15.
