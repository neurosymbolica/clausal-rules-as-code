uses: []

scope: >-
  UK law in force, not a proposal; drafter's reading, not a lawyer's.
  UK GDPR Chapter III Section 4A (automated individual decision-making), as
  substituted for the old Art 22 by section 80(1) of the Data (Use and Access)
  Act 2025, for a decision taken on or after 5 February 2026 (S.I. 2026/82
  reg 2(j) and (z8), with reg 5), under the legislation.gov.uk 'Latest
  available (Revised)' text fetched 2026-11-15. Decided here: whether a
  decision is a significant decision based solely on automated processing
  (Art 22A); whether Art 22B lets it be taken based solely on automated
  processing (special categories of personal data, Art 22B(1) to (3); reliance
  on Art 6(1)(ea), Art 22B(4)); whether Art 22C requires safeguards and, if so,
  whether the four measures of Art 22C(2) are in place; and, for comparison,
  this order's own reading of EU GDPR Art 22(1), (2)(a) to (c) and (4) (Formex
  consolidation 02016R0679-20160504) set beside the UK Art 22B answer on the
  same profile. Open-textured judgements (meaningful human involvement, legal
  or similarly significant effect, explicit consent, necessity, authorisation
  by law, Art 9(2) points, the safeguard measures) are the caller's: unsure
  goes to a lawyer (needs_legal_review). Out of scope: Art 22D powers and any
  regulations under them (read as not made); EU Art 22(3); the lawfulness of
  processing under Arts 6 and 9; the Art 9 and DPA 2018 Sch 1 conditions;
  transparency duties under Arts 13 to 15; DPA 2018 ss 50A to 50D (law
  enforcement); any decision taken before 5 February 2026.

sources:
  - "UK GDPR (retained Regulation (EU) 2016/679) Art 22A(1), (1)(a), (1)(b), (1)(b)(i), (1)(b)(ii), (2), as substituted by s 80(1) Data (Use and Access) Act 2025; legislation.gov.uk Latest available (Revised), fetched 2026-11-15, pin uk-eur-2016-679-revised-2026-09-30"
  - "UK GDPR Art 22B(1), (2), (3)(a)(i), (3)(a)(ii), (3)(b), (4); same pin"
  - "UK GDPR Art 22C(1)(a), (1)(b), (2)(a) to (d); same pin"
  - "UK GDPR Art 22D(1) to (5) (quoted and deferred: powers of the Secretary of State); same pin"
  - "Regulation (EU) 2016/679 Art 22(1), (2)(a), (2)(b), (2)(c), (4); Formex consolidation 02016R0679-20160504, Article 22 extract (comparison limb); Art 22(3) quoted and deferred"
  - "S.I. 2026/82 (Data (Use and Access) Act 2025 (Commencement No. 6) Regulations 2026) reg 2(j), 2(z8) and reg 5 (deferred: commencement and saving)"
  - "Data (Use and Access) Act 2025 (c. 18) s 142(1), (2), (2)(h) (deferred: commencement of regulation-making powers)"

query_interface:
  3: "uk_automated_decision_restriction/3"          # status_determination: the UK Art 22B status (also uk_significant_automated_decision/3, uk_automated_decision_safeguards/3, eu_automated_decision/3)
  5: "compare_uk_eu_automated_decision/5"           # comparison: UK Art 22B beside EU Art 22 on one profile
  7: "uk_automated_decision_making_checklist/2"     # justification: item(Id, Status, cite(Key)) per ground
  16: "uk_automated_decision_making_what_if/4"      # what_if: re-evaluate under an overridden key

