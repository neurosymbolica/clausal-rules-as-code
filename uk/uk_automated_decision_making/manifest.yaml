- what: uk_secretary_of_state_powers
  units:
  - uk-eur-2016-679-revised-2026-09-30#article-22D-1
  - uk-eur-2016-679-revised-2026-09-30#article-22D-2
  - uk-eur-2016-679-revised-2026-09-30#article-22D-3
