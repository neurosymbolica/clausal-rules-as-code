  - uk-eur-2016-679-revised-2026-09-30#article-22D
  - 02016R0679-20160504#art_022
  reason: 'The titles of UK GDPR Arts 22A to 22D and of EU GDPR Art 22 carry no rule:
    document structure. Deferred so every unit of the pinned extracts is accounted
