scope: >-
  UK law in force (the drafter's reading, not a lawyer's), under the 'Latest
  available (Revised)' texts of legislation.gov.uk fetched 2026-11-15. Three
  rules of the Privacy and Electronic Communications (EC Directive) Regulations
  2003 (PECR, S.I. 2003/2426) as amended by the Data (Use and Access) Act 2025:
  (1) COOKIES: whether storing information in, or gaining access to information
  stored in, the terminal equipment of a subscriber or user is permitted,
  not_permitted or not_applicable under reg 6(1) and (2) and the six exceptions
  of Schedule A1 paragraphs 2 to 7 (in force from 5 February 2026), with an own
  comparison limb under Directive 2002/58/EC Art 5(3) and a same/differs
  comparison of the two answers; (2) BREACH TIME: whether a service provider's
  notification of a personal data breach to the Information Commission is in
  time under reg 5A(2) and (3A) (for a breach the provider became aware of on or
  after 20 August 2025), the 72 hours counted as Regulation (EU) No 611/2013
  Art 2(2) and Regulation No 1182/71 Art 3 count them; (3) FINES: the tier and
  the statutory MAXIMUM amount, in pence, of a PECR penalty under Data Protection
  Act 2018 s.157 as applied by PECR Schedule 1 paragraphs 1 and 18, for an act
  or omission on or after 5 February 2026 (S.I. 2026/82 reg 11). Out of scope:
  the earlier texts (an earlier breach or act goes to a lawyer), whether a
  penalty may be imposed and the amount the Commission sets, subscriber
  notification and notification content, reg 5C and reg 6A, the meaning of
  consent, personal data breach and information society service (caller
  judgements), and any Member State's transposing law.

sources:
  - "Privacy and Electronic Communications (EC Directive) Regulations 2003, S.I. 2003/2426, revised text (expression 2026-09-30, fetched 2026-11-15): reg 5(1), reg 5A(1), (2), (3A), reg 6(1), (2), Schedule A1 paras 1 to 7, Schedule 1 paras 1 and 18"
  - "Data Protection Act 2018 c.12, revised text (expression 2026-09-30): s.157(2), (4), (5), (6)"
  - "Data (Use and Access) Act 2025 (Commencement) Regulations, S.I. 2025/904, as made: reg 2(p)"
  - "Data (Use and Access) Act 2025 (Commencement No. 6 and Transitional and Saving Provisions) Regulations 2026, S.I. 2026/82, as made: reg 2(w), (y), (z13), (z14) and reg 11"
  - "Commission Regulation (EU) No 611/2013 as it has effect in the United Kingdom: Art 2(2)"
  - "Regulation (EEC, Euratom) No 1182/71 as it has effect in the United Kingdom: Art 3(1) and (2)(a)"
  - "Directive 2002/58/EC (consolidated 2009-12-19), Art 5(3) and Art 2 second paragraph point (f), for comparison only (pin copied from the EU order eprivacy-art-5-3-terminal-equipment)"

