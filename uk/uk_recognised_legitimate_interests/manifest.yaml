excluded_set:
- what: civil_contingencies_emergency
  instrument: Civil Contingencies Act 2004 Part 2
  cites:
  - ukpga-2004-36#part-2
  reason: Annex 1 paragraph 4 gives 'emergency' the meaning of Part 2 of the Civil
    Contingencies Act 2004; that Act is not pinned, and whether an event is such an
    emergency is a judgement of the caller (event_is_an_emergency_within_part_2_of_the_civil_contingencies_act_2004).
  consequence: The caller states whether the event is an emergency in that meaning.
- what: public_authority_meaning
  instrument: Data Protection Act 2018 s.7
  cites:
  - ukpga-2018-12#section-7
  reason: Who is a public authority for the UK GDPR is set by section 7 of the Data
    Protection Act 2018, not pinned; the order reads it as the judgement processing_by_a_public_authority_in_the_performance_of_its_tasks
    (reading (4)).
  consequence: The caller judges whether the controller is a public authority performing
    its tasks.
- what: eu_right_to_object
  instrument: Regulation (EU) 2016/679 Art 21
  cites:
  - 32016R0679#art_021
  reason: The EU right to object is not pinned for this order and is not compared;
    the EU text has no point (ea) to which it could reach.
  consequence: uk_right_to_object/3 answers under the UK text only.
- what: amending_provisions_as_enacted
  instrument: Data (Use and Access) Act 2025 s.70 and Sch 4
  cites:
  - ukpga-2025-18#section-70
  - ukpga-2025-18#schedule-4
  reason: The order reads the UK GDPR as amended (the revised text); the amending
    section and schedule as enacted are provenance only.
  consequence: 'None for a caller: the amended text is read.'
