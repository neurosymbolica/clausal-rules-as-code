scope: >-
  UK law in force, not a proposal (author's reading, not a lawyer's). Whether UK GDPR
  Art 6(1)(ea) read with Art 6(5) and Annex 1 (recognised legitimate interests, inserted
  by the Data (Use and Access) Act 2025 s.70 and Sch 4, in force from 5 February 2026
  under S.I. 2026/82 reg 2(c) and (z6)) gives a lawful basis; whether UK GDPR Art 6(1)(f)
  legitimate interests does; whether either does; whether EU GDPR Art 6(1)(f) does on
  the same profile, set beside the UK answer (same, differs or not_comparable, with the
  UK provisions that make a difference); and what UK GDPR Art 21(1) gives when the data
  subject objects to processing based on point (e), (ea) or (f). The Art 6(1) second
  subparagraph bars (ea) and (f) in the UK and (f) in the EU for public authorities in
  the performance of their tasks. Every answer states the law as it applies from
  5 February 2026, under the UK 'Latest available (Revised)' text fetched 2026-11-13 and
  the EU Formex consolidation 02016R0679-20160504. Out of scope: the other bases of
  Art 6(1) (points (a) to (e)), Art 6(3) beyond what a request states, the power to
  amend Annex 1, Art 21(2) to (6), the EU Art 21, the meaning of emergency under the
  Civil Contingencies Act 2004 Part 2 and of public authority under the Data Protection
  Act 2018 s.7 (both judged by the caller). Open-textured judgements (necessity, the
  balance, at risk, public authority) are handed to the user as tri-state keys and an
  unsure judgement that decides is referred as needs_legal_review.

sources:
  - "UK GDPR (retained Regulation (EU) 2016/679 as revised), Art 6(1) points (ea) and (f) and the second subparagraph, Art 6(5), Annex 1 paragraphs 1 to 8, Art 21(1); legislation.gov.uk Latest available (Revised) text, Akoma Ntoso, fetched 2026-11-13 (pin uk-eur-2016-679-revised-2026-09-30)"
  - "Regulation (EU) 2016/679 (General Data Protection Regulation), OJ L 119, 4.5.2016, p. 1, Art 6(1) point (f) and the second subparagraph; Formex consolidation 02016R0679-20160504, Article 6 extract"
  - "S.I. 2026/82, Data (Use and Access) Act 2025 (Commencement No. 6) Regulations 2026, reg 2(c) and (z6), as made (commencement: deferred, stated once in scope)"
  - "Data (Use and Access) Act 2025 (c. 18), s.142(1), (2) and (2)(h), as enacted (commencement: deferred, stated once in scope)"

