# Reuse-declaration lever: dotted module paths of shared backbone packages this
# domain imports. It imports only kit modules (formalize_lib) and libraries
# (clpz, reif), no shared domain backbone package.
uses: []

scope: "UK law in force (drafter's reading, not a lawyer's). Two rules of the UK GDPR for requests by data subjects: (a) the search limit of Art 15(1A) (inserted by the Data (Use and Access) Act 2025 s.78), read per item: an item not described in Art 15(1) is not within the right; a described item that a reasonable and proportionate search would not let the controller provide is not due; otherwise it is due, the reasonable-and-proportionate judgement being the caller's (unsure goes to a lawyer); (b) the time for responding, Art 12(3) and (4) with the applicable time period of Art 12A (one month from the relevant time, extendable to three months by a timely notice with reasons where necessary for complexity or number; clock stopped while further information reasonably required is awaited), applying to requests received on or after 5 February 2026 (S.I. 2026/82 reg 2(h), reg 4(a)); earlier requests are reported as saved and no date is computed. For comparison, the order's own EU limb counts EU GDPR Art 12(3) by Regulation 1182/71 Art 3 for a plain request. Out of scope: DUAA s.77 (Arts 13 and 14), DPA 2018 Parts 3 and 4, whether a fee or identity information may be asked for (Art 12(5), (6)), the copy of Art 15(3), DPA 2018 exemptions, the pre-5 February 2026 time limits, and bank holidays on either side."

sources:
  - "UK GDPR (retained Regulation (EU) 2016/679 as revised), legislation.gov.uk Latest available (Revised) text fetched 2026-11-15: Art 15(1), 15(1A); Art 12(3), 12(4); Art 12A(1) to (5); Art 12(5), (6) quoted for context (deferred)"
  - "The Data (Use and Access) Act 2025 (Commencement No. 6 and Transitional and Saving Provisions) Regulations 2026, S.I. 2026/82 (C. 10), as made: reg 2(h), reg 4(a)"
  - "Data (Use and Access) Act 2025 (c. 18), as enacted: s.78(5), s.142(2)(b) (deferred: when the search limit applies)"
  - "Regulation (EU) 2016/679 (EU GDPR), OJ L 119, 4.5.2016, consolidation 2016-05-04: Art 12(3) (comparison limb)"
  - "Regulation (EEC, Euratom) No 1182/71, OJ L 124, 8.6.1971: Art 3(1), 3(2)(c), 3(4) (counting of the EU period)"

query_interface:
  2: "uk_subject_access_requests_status/2"      # status verdict of the facade (access entitlement)
  3: "uk_access_entitlement/3"                  # status_determination (also uk_applicable_time_period/3, uk_clock_stop/3, uk_time_rules_regime/3)
  5: "compare_uk_eu_response_deadline/6"        # comparison: UK last day against EU last day
  7: "uk_subject_access_requests_checklist/2"   # justification: cite(...) per checklist row
  15: "uk_response_deadline/5"                  # deadline: last day of the applicable time period
  16: "uk_subject_access_requests_what_if/4"    # what_if: re-evaluate under an overridden key
  23: "uk_paused_days/4"                        # calculation: days that do not count (Art 12A(5)(b))

