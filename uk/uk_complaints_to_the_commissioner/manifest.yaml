  - ukpga-2018-12-revised-2026-09-30#section-165-4
  - ukpga-2018-12-revised-2026-09-30#section-165-4-a
  - ukpga-2018-12-revised-2026-09-30#section-165-4-b
  - ukpga-2018-12-revised-2026-09-30#section-165-4-c
  - ukpga-2018-12-revised-2026-09-30#section-165-4-d
  - ukpga-2018-12-revised-2026-09-30#section-165-5
  - ukpga-2018-12-revised-2026-09-30#section-165-5-a
  - ukpga-2018-12-revised-2026-09-30#section-165-5-b
  - ukpga-2018-12-revised-2026-09-30#section-165-7
  reason: s.165(3) to (5) set the Commission's duties on a complaint (facilitating
    complaints, responding, informing of the outcome and of the rights under s.166,
    further information on request, investigating to the extent appropriate and informing
    of progress); s.165(7) defines 'foreign designated authority' used by s.165(5)(b).
