  - ukpga-2018-12-revised-2026-09-30#section-164B-4-c
  - ukpga-2018-12-revised-2026-09-30#section-164B-5
  reason: s.164B gives the Secretary of State power to make regulations requiring
    a controller to notify the Commission of the number of complaints under s.164A,
    with their form, timing and counting; no such regulations are pinned, so there
    is no duty to formalise.
  consequence: No answer says whether a controller must notify the number of complaints.
  declaration: not_an_exception
  not_formalized_because: institutional
