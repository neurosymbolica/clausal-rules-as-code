- what: dpa_164a_facilitation_and_response_duties
  units:
  - ukpga-2018-12-revised-2026-09-30#section-164A-2
  - ukpga-2018-12-revised-2026-09-30#section-164A-4
  - ukpga-2018-12-revised-2026-09-30#section-164A-4-a
  - ukpga-2018-12-revised-2026-09-30#section-164A-4-b
  - ukpga-2018-12-revised-2026-09-30#section-164A-5
  - ukpga-2018-12-revised-2026-09-30#section-164A-5-a
  - ukpga-2018-12-revised-2026-09-30#section-164A-5-b
  instrument: Data Protection Act 2018 s.164A(2), (4) and (5)
  reason: s.164A(2) requires the controller to facilitate complaints by steps such
    as an electronic complaint form; s.164A(4) requires it, without undue delay, to
    take appropriate steps to respond and to inform the complainant of the outcome;
    s.164A(5) says those steps include enquiries to the extent appropriate and informing
    the complainant about progress. These are open-textured duties ('steps such as',
    'without undue delay', 'appropriate') with no fixed time; this small order does
    not formalise them. Quoted for context with the deferred marker.
  consequence: No answer says whether a controller facilitated, responded to or reported
    the outcome of a complaint as s.164A(2), (4) and (5) require.
  declaration: answered_with_caveat
  debt: true
  open: formalisable in a later UK order with caller judgements; the deferral stands
    for this run.
- what: dpa_164b_complaint_number_regulations
  units:
