scope: >-
  UK law in force (drafter's reading, not a lawyer's): the Data Protection Act 2018
  as amended by the Data (Use and Access) Act 2025 s.103, in force from 19 June 2026
  (S.I. 2026/82 reg 3(a)). Decided here: (a) whether a complaint is one a data
  subject makes to the controller under s.164A(1) - a data subject, about personal
  data relating to them, considering an infringement of the UK GDPR or Part 3, made
  to the controller (controller_complaint_right/3); (b) whether a complaint is one a
  data subject may make to the Commission under s.165(2) as amended - UK GDPR or
  Part 3 or 4, no prior complaint to the controller required
  (commission_complaint_right/3); (c) the last day of the period of 30 days beginning
  when the controller receives a s.164A complaint within which it must acknowledge
  receipt (s.164A(3)), the day of receipt counted as day one and no weekend or bank
  holiday shift, and the transitional limit of S.I. 2026/82 reg 7 (the duty applies
  only to a complaint received on or after 19 June 2026)
  (acknowledgement_last_day/3); with a cited checklist for s.164A(1). Out of scope
  (deferred or excluded set): the controller's duties of s.164A(2), (4) and (5); the
  s.164B regulations; the Commission's duties under s.165(3) to (5) and (7); UK GDPR
  Art 57; Schedule 10 of the Act of 2025; complaints made before 19 June 2026 under
  the earlier rules (UK GDPR Art 77, s.165(1)); any EU GDPR comparison; any
  consequence of missing the acknowledgement period (the pinned text states none).

sources:
  - "Data Protection Act 2018 (c. 12) s.164A(1), (3) and s.165(2), legislation.gov.uk Latest available (Revised) text, expression dated 2026-09-30, fetched 2026-11-15"
  - "Data (Use and Access) Act 2025 (c. 18) s.103(3), (6) and s.142(1), (2)(h), as enacted (provenance of the amendments; deferred)"
  - "UK GDPR Art 77 (omitted by the Data (Use and Access) Act 2025 s.103(6); deferred)"
  - "The Data (Use and Access) Act 2025 (Commencement No. 6 and Transitional and Saving Provisions) Regulations 2026 (S.I. 2026/82 (C. 10)) reg 3, reg 3(a) and reg 7, as made"

query_interface:
  2: "controller_complaint_right/3"                      # eligibility: s.164A(1) verdict (commission_complaint_right/3 serves s.165(2))
  7: "uk_complaints_to_the_commissioner_checklist/2"     # justification: checklist items carry cite(...) per item
  15: "acknowledgement_last_day/3"                       # deadline: last day to acknowledge receipt (s.164A(3), S.I. 2026/82 reg 7)
  16: "uk_complaints_to_the_commissioner_what_if/4"      # what_if: re-evaluate under an overridden key

