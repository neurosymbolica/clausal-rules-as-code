uk_si_2026_82_reg_7:
  status: verified
  url: "https://www.legislation.gov.uk/uksi/2026/82/regulation/7/made"
  retrieved: 2026-11-16
  note: >-
    Unit uksi-2026-82-made#regulation-7. The s 164A(3) and (4) duties apply only to a
