uk_dpa_2018_s_164a_1:
  status: verified
  url: "https://www.legislation.gov.uk/ukpga/2018/12/section/164A"
  retrieved: 2026-11-16
  note: >-
    Unit ukpga-2018-12-revised-2026-09-30#section-164A-1. Permission of the data subject
    to complain to the controller; the test turns on what the data subject CONSIDERS;
    names the UK GDPR and Part 3 only (not Part 4). Anchors controller_complaint_right/3.
uk_dpa_2018_s_164a_3:
  status: verified
  url: "https://www.legislation.gov.uk/ukpga/2018/12/section/164A"
  retrieved: 2026-11-16
  note: >-
    Unit ukpga-2018-12-revised-2026-09-30#section-164A-3. The controller's duty to
    acknowledge receipt within the period of 30 days beginning when the complaint is
    received; read as day of receipt = day 1, last day = receipt + 29 calendar days
    (open question Q1). Anchors acknowledgement_last_day/3.
uk_dpa_2018_s_165_2:
  status: verified
  url: "https://www.legislation.gov.uk/ukpga/2018/12/section/165"
  retrieved: 2026-11-16
  note: >-
    Unit ukpga-2018-12-revised-2026-09-30#section-165-2, as amended by DUAA 2025
    s 103(3)(b) (inserting 'the UK GDPR or'). Permission to complain to the Commission;
    names the UK GDPR, Part 3 and Part 4; states no prior complaint to the controller
    (open question Q4). Anchors commission_complaint_right/3.
