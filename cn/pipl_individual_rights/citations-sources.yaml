cn_pipl_art_44_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_44_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors restriction_or_refusal_right (right to restrict or refuse; the
    other-law exception). Pinned wording: 个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理；法律、行政法规另有规定的除外。
cn_pipl_art_45_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_45_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors access_and_copy_duty (right to consult and copy; exceptions of
    Art 18(1) and Art 35, stated by the caller). Pinned wording: 个人有权向个人信息处理者查阅、复制其个人信息；有本法第十八条第一款、第三十五条规定情形的除外。
cn_pipl_art_45_p2:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_45_p2"
  retrieved: 2026-11-16
  note: >-
    Anchors provide_in_time ('in time' carries no number). Pinned wording: 个人请求查阅、复制其个人信息的，个人信息处理者应当及时提供。
cn_pipl_art_45_p3:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_45_p3"
  retrieved: 2026-11-16
  note: >-
    Anchors portability_duty (cyberspace department conditions stated by the
    caller). Pinned wording: 个人请求将个人信息转移至其指定的个人信息处理者，符合国家网信部门规定条件的，个人信息处理者应当提供转移的途径。
cn_pipl_art_46_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_46_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors the right to request correction or supplementing (discovery not
    tested). Pinned wording: 个人发现其个人信息不准确或者不完整的，有权请求个人信息处理者更正、补充。
cn_pipl_art_46_p2:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_46_p2"
  retrieved: 2026-11-16
  note: >-
    Anchors correction_duty (verify, then correct or supplement in time; the
    verification outcome is a judgement). Pinned wording: 个人请求更正、补充其个人信息的，个人信息处理者应当对其个人信息予以核实，并及时更正、补充。
cn_pipl_art_47_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors deletion_duty chapeau (delete on own initiative; closed list of
    five cases). Pinned wording: 有下列情形之一的，个人信息处理者应当主动删除个人信息；个人信息处理者未删除的，个人有权请求删除：
cn_pipl_art_47_p1_i1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p1_i1"
  retrieved: 2026-11-16
  note: >-
    Deletion case item (1), a judgement. Pinned wording: 处理目的已实现、无法实现或者为实现处理目的不再必要；
cn_pipl_art_47_p1_i2:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p1_i2"
  retrieved: 2026-11-16
  note: >-
    Deletion case item (2), crisp. Pinned wording: 个人信息处理者停止提供产品或者服务，或者保存期限已届满；
cn_pipl_art_47_p1_i3:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p1_i3"
  retrieved: 2026-11-16
  note: >-
    Deletion case item (3), crisp. Pinned wording: 个人撤回同意；
cn_pipl_art_47_p1_i4:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p1_i4"
  retrieved: 2026-11-16
  note: >-
    Deletion case item (4), a judgement. Pinned wording: 个人信息处理者违反法律、行政法规或者违反约定处理个人信息；
cn_pipl_art_47_p1_i5:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p1_i5"
  retrieved: 2026-11-16
  note: >-
    Deletion case item (5), crisp ('see the law'). Pinned wording: 法律、行政法规规定的其他情形。
cn_pipl_art_47_p2:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_47_p2"
  retrieved: 2026-11-16
  note: >-
    Anchors stop_processing_except_storage_and_security (applies only where a
    case of Art 47(1) holds). Pinned wording: 法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，个人信息处理者应当停止除存储和采取必要的安全保护措施之外的处理。
cn_pipl_art_48_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_48_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors explanation_duty. Pinned wording: 个人有权要求个人信息处理者对其个人信息处理规则进行解释说明。
cn_pipl_art_49_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_49_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors deceased_person_rights (near relative, own lawful and legitimate
    interests, contrary arrangement). Pinned wording: 自然人死亡的，其近亲属为了自身的合法、正当利益，可以对死者的相关个人信息行使本章规定的查阅、复制、更正、删除等权利；死者生前另有安排的除外。
cn_pipl_art_50_p1:
  status: unverified
  url: "http://www.npc.gov.cn/"
  pin: "cn-pipl-2021#art_50_p1"
  retrieved: 2026-11-16
  note: >-
    Anchors request_mechanism (convenient mechanism, a judgement) and the
