# SPDX-License-Identifier: EUPL-1.2
id: cn/pipl_individual_rights
shape_family: deontic
kit_version: "0.1.0"
# The domain's .clausal file set, in import-DAG order (determination slices
# over a shared kernel). SINGLE SOURCE OF TRUTH for the module list: the
# scaffold writes it, and auto/pkginit.py (package facade), auto/phases.py
# (per-phase file lists) and auto/gates.py (atom hints) all read it from
# here. Keep it exact -- a module you drop from this list stops being
# re-exported by the generated package facade (__init__.clausal).
modules:
  - "kernel"
  - "citations"
  - "parameters"
  - "pipl_individual_rights"
  - "queries"
  - "fixtures"
# public_interface: name/arity PREDICATES only, grouped per submodule -- kept in
# sync with the :- module(...) export lists re-exported via the package facade
# __init__.clausal. The result atoms (arity 0) and the result constructors are
# listed because the scorer reads them as package-root attributes.
public_interface:
  # -- kernel.clausal --
  # (the input check is re-exported by queries.clausal, listed there)
  # -- citations.clausal --
  - "citation/2"
  # -- pipl_individual_rights.clausal --
  - "restriction_or_refusal_right/3"
  - "access_and_copy_duty/3"
  - "portability_duty/3"
  - "correction_duty/3"
  - "deletion_duty/3"
  - "explanation_duty/3"
  - "deceased_person_rights/3"
  - "request_mechanism/3"
  - "refusal_status/3"
  - "decide_pipl_individual_rights/2"
  - "pipl_individual_rights_status/2"
  - "pipl_individual_rights_checklist/2"
  - "pipl_individual_rights_decision_resolvable/1"
  - "pipl_individual_rights_status_values/1"
  - "pinned_text_not_applicable/0"
  - "right_available/0"
  - "excluded_by_other_law/0"
  - "not_owed/0"
  - "provide_in_time/0"
  - "provide_transfer_route/0"
  - "correct_or_supplement_in_time/0"
