site_name: Clausal Rules as Code
site_description: EU law as executable, tested, traceable logic programs
repo_url: https://github.com/neurosymbolica/clausal-rules-as-code
repo_name: clausal-rules-as-code
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/scale-balance
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Why this matters: why.md
  - For lawyers and policy makers: questions.md
  - How it is checked: validation.md
  - From statute to rule: traceability.md
  - Lawyers in the loop: lawyers.md
  - Standards and openness: standards.md
  - The domains:
    - domains/index.md
    - amlr beneficial ownership threshold: domains/eu-aml-amlr_beneficial_ownership_threshold.md
    - amlr bo chain: domains/eu-aml-amlr_bo_chain.md
    - framework agreements: domains/eu-procurement-framework_agreements.md
    - life cycle costing: domains/eu-procurement-life_cycle_costing.md
    - shortlisting: domains/eu-procurement-shortlisting.md
    - time limits: domains/eu-procurement-time_limits.md
    - utilities negotiated without prior call: domains/eu-procurement-utilities_negotiated_without_prior_call.md
    - de minimis cumulation: domains/eu-state_aid-de_minimis_cumulation.md
  - Status of each domain: status.md
  - Run it yourself: run.md
  - Building on it: building-on-it.md
  - Open calls: open-calls.md
