id: sg/companies/csp_registration
provision_tracking_note: "Provision tracking is informal: the deferred set below is a first scope map, and the units it does not defer are not accounted unit by unit. There is no provision-tracking ledger."
deferred_set:
- what: registered_qualified_individuals
  units:
  - sg-cspa-2024#pr2-ps3-p1b
  reason: 'Order deferred_set: ss 10-11, 15 (registered qualified individuals) and the registration criteria
    in s 9 are out of scope; these definitions and s 2(3)(b) serve only that regime.'
  consequence: Any RQI requirement attached to the CSP's registration must be checked separately.
- what: transitional_registrations
  units:
  - sg-cspa-2024#pr2-ps1-pdregisteredcorporateserviceprovider-p1b
  reason: 'Order deferred_set: Part 9 saving and transitional provisions (filing agents, ACRA RQIs) are
    out of scope; registered_service_types is asserted current. Limb (b) covers persons treated as registered
    under s 42(3).'
  consequence: A transitionally registered CSP must itself include those types in registered_service_types.
- what: fit_and_proper_judgment
  units:
  - sg-cspa-2024#pr16-ps2
  - sg-cspa-2024#pr16-ps2-p1a
  - sg-cspa-2024#pr16-ps2-p1b
  reason: 'Order deferred_set: whether the CSP WAS satisfied and what the prescribed factors are is supplied as
    booleans. s 16(2) and (a)-(b) say how the fit-and-proper determination is made; this domain does not make it.
    s 16(1) stays in scope. (Mapped 2026-10-04.)'
  consequence: The caller must determine fit-and-proper status under s 16(2) and supply it.
scope_map_unsure:
- 'sg-cspa-2024#pr7-ps3: kept in scope; it states the effect of a suspended/cancelled deemed registration,
  which the rules read via deemed_registration_suspended_or_cancelled, but the order does not quote s
  7(3).'
- 'sg-cspa-2024#pr2-ps1-pdaccountingcorporation / pdpublicaccountant: kept in scope as components of ''accounting
  entity'', though is_accounting_entity is asserted.'
- 'sg-cspa-2024#pr2-ps1-pdregistration: kept in scope (registration of a CSP is what the rules test);
  it also covers RQI registration.'
- 'sg-cspa-2024#pr2-ps1-pdlegalarrangement: deferred with activity_characterisation (used only by designated
  activity (e)); could be definitions_not_used.'
- 'sg-cspa-2024#pr2-ps1-pdacratransaction and related ACRA definitions: deferred because limb (f) activity
  is asserted; the order quotes limb (f) itself, which stays in scope.'
operative_readings:
- what: section_16_binds_registered_providers_only
  units:
  - sg-cspa-2024#pr16-ps1
  question: s 16(1) imposes the fit-and-proper nominee-director duty on 'a registered corporate service
    provider'. Does it bind a person providing that corporate service WITHOUT being registered (itself
    an offence under s 7)?
  readings:
  - id: registered_only
    consequence: 'An unregistered provider''s nominee arrangements are outside s 16 (it is caught by s
      7 instead): NOMINEE_DUTY n_a.'
  - id: any_provider_of_the_service
    consequence: The s 16 duty applies to anyone acting as a nominee-director arranger, registered or
      not.
    conservative: true
  chosen: registered_only
  rationale: 'The subsection names its subject: ''A registered corporate service provider''.'
  authority: none
  attested:
    by: owner
    role: owner
    date: '2026-10-03'
scope: "Whether a person or entity must be registered as a corporate service provider under the Corporate Service Providers Act 2024 (ss 2, 7 and 16): which corporate services it provides, whether a registration is missing, and whether the nominee-director duty applies. For ONE person or entity on ONE reference date. Drafter's reading, not a lawyer's."
