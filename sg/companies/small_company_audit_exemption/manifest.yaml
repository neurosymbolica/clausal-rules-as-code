# SPDX-License-Identifier: EUPL-1.2
id: sg/companies/small_company_audit_exemption
provision_tracking_note: "Provision tracking is informal: the deferred set below is a first scope map, and the units it does not defer are not accounted unit by unit. There is no provision-tracking ledger."
deferred_set:
- what: s205b_4_consequences
  units:
  - sg-coa-1967#pr205C-ps2
  reason: 'Order deferred_set: the filing consequences of an exemption (s 205B(4) via 205C(2)) are not decided
    here. s 205C(2) only applies s 205B(4), (6) and (7) to an exempt small company. (Mapped 2026-10-04.)'
  consequence: An exempt small company must work out its own filing consequences under s 205B(4)/(6)/(7).
scope_map_unsure:
- 'sg-coa-1967#pr205B-ps6: kept in scope (the notice and its timing are decided), though the 5% holding
  test inside the same unit is the deferred notice_holding_threshold.'
- 'sg-coa-1967#pr205C-ps2: kept in scope because it imports s 205B(6)-(7); it also imports s 205B(4),
  whose consequences are deferred (s205b_4_consequences).'
- 'sg-coa-1967#pr205C-ps6: kept in scope for the 1 July 2015 disapplication; its trailing clause on preparing
  accounts under the old regime overlaps transitional_accounts_regime.'
- 'sg-coa-1967#Sc13-s11: para 1 (definition chapeau tying 205C to paras 2-11) kept in scope as the definition
  the rules use.'
operative_readings:
- what: para_6_carve_out_applied_literally
  units:
  - sg-coa-1967#Sc13-s15
  - sg-coa-1967#Sc13-s16
  question: Para 6 disapplies para 5 (ceasing to be small) for [quotation omitted]
    [quotation omitted]. Does a company small in year 1 that stops being private in year 2 stay small, or does
    ceasing to be private end small status regardless, as ACRA's summary page says?
  readings:
  - id: literal_para_6
    consequence: 'Small in FY1 stays small in FY2 even if it stopped being private: exempt.'
  - id: acra_summary
    consequence: 'Ceasing to be private ends small status in any year: not exempt (regulator case audit-11).'
    conservative: true
  chosen: literal_para_6
  rationale: Para 6's text has no exception for ceasing to be private; ACRA's page is guidance and omits
    the carve-out.
  authority: Companies Act 1967 Thirteenth Schedule para 6; ruling 2026-10-02 (regulator case
    audit-11)
  attested:
    by: owner
    role: owner
    date: '2026-10-02'
- what: any_2_criteria_judged_per_year
  units:
  - sg-coa-1967#Sc13-s12-p1b
  question: Para 2(b) requires '[quotation omitted]'. Must
    the SAME 2 criteria hold in both years, or may each year satisfy a different 2?
  readings:
  - id: per_year_any_2
    consequence: A year qualifies when any 2 of its 3 criteria are met; the pair may differ between years.
  - id: same_2_in_both_years
    consequence: Only a pair met in BOTH years counts; fewer companies are small.
    conservative: true
  chosen: per_year_any_2
  rationale: '''for each of the 2 financial years'' attaches the test to each year; ACRA practice reads
    it per year.'
  authority: none
  attested:
    by: owner
    role: owner
    date: '2026-10-03'
- what: one_month_before_the_end_same_day_number
  units:
  - sg-coa-1967#pr205B-ps6
  question: 's 205B(6): a members'' audit notice must be given ''[quotation omitted]
    [quotation omitted]''. Is the cutoff the same day number in the previous month (clamped to that month''s
    last day), or a fixed 30 days?'
  readings:
  - id: same_day_previous_month_clamped
    consequence: 31 Dec year end -> cutoff 30 Nov; 31 Mar -> 28/29 Feb.
  - id: thirty_days_before
    consequence: 31 Dec -> 1 Dec; 31 Mar -> 1 Mar. A different last day in most months.
  chosen: same_day_previous_month_clamped
  rationale: A calendar month counts by calendar, not by days (Interpretation Act 1965 s 2 'month' means
    calendar month); clamping handles shorter months.
  authority: none
  attested:
    by: owner
    role: owner
    date: '2026-10-03'
scope: "Whether a Singapore company is exempt from audit under the Companies Act 1967 (ss 205B and 205C and the Thirteenth Schedule): whether it is a small company or a small group, judged on the figures of its financial years. For ONE company and its assessed financial year. Drafter's reading, not a lawyer's."
