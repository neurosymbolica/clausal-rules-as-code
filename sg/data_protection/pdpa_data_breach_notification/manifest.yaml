uses: []

scope: "Singapore PDPA 2012 Part 6A (ss 26A to 26E) with the Personal Data Protection
  (Notification of Data Breaches) Regulations 2021 (S 64/2021) regs 3 to 6 and the
  Schedule: for a caller-described data breach, whether it is a notifiable data breach
  (deemed significant harm under reg 3(1)(a) with Schedule Parts 1 and 2 and reg 3(1)(b)
  with reg 3(2); deemed significant scale at 500 affected individuals under reg 4; the
  judgements of likely significant harm or scale; the s 26B(4) within-organisation
  exclusion; the s 26C(1) commencement of 1 February 2021), whether notice to affected
  individuals is required, prohibited, waived or not required (s 26D(2), (5), (6), (7),
  in the drafter's priority, Q2), the assessment or notice duty of an organisation or
  data intermediary (s 26C(2), (3), s 26E), the end of the 3-calendar-day period to
  notify the Commission (s 26D(1), main reading Q1: every day counts) and the fixed
  content lists of regs 5 and 6. Out of scope and handed to the caller or a lawyer:
  whether an incident is a data breach, 'likely' significant harm or scale, 'reason to
  believe', 'renders it unlikely' (judgements), the classification of data into the
  data class atoms, Schedule Part 2 public availability, 'as soon as is practicable',
  the form and manner of notice, sector rules (MAS notices, Cybersecurity Act) and
  penalties."

sources:
  - "Personal Data Protection Act 2012 (Singapore), Part 6A, ss 26A, 26B, 26C, 26D and 26E; SSO, https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P16A-, current version as at 13 Nov 2026 (saved 2026-11-12)"
  - "Personal Data Protection (Notification of Data Breaches) Regulations 2021, S 64/2021, regs 1 to 6 and the Schedule Parts 1 and 2; SSO, https://sso.agc.gov.sg/SL/S64-2021, current version as at 13 Nov 2026 (saved 2026-11-12)"
  - "Interpretation Act 1965 (Singapore), s 50 (computation of time), quoted for open question Q1 only; SSO, https://sso.agc.gov.sg/Act/IA1965?ProvIds=pr50-, current version as at 13 Nov 2026 (saved 2026-11-12)"

query_interface:
  2: "pdpa_data_breach_notification_status/2"      # eligibility: notifiable / not_notifiable / not_applicable / status compound
  7: "pdpa_data_breach_notification_checklist/2"   # justification: every checklist item carries its cite(...) list
  16: "pdpa_data_breach_notification_what_if/4"    # what_if: re-evaluate under an overridden key

deferred_set:
