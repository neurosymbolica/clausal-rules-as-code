  - sg-s64-2021#Sc-S11_1
  - sg-s64-2021#Sc-S12_1
  - sg-s64-2021#pr2
  - sg-s64-2021#pr3
  - sg-s64-2021#pr3-ps1
  - sg-s64-2021#pr5
  - sg-s64-2021#pr5-ps1
  - sg-s64-2021#pr6
  reason: The section, subsection and Schedule-part units hold headings and the lead-in
    words of their paragraphs; every limb cites the paragraph or item it reads (s
    26B(1)(a) and (b), reg 3(1)(a) and (b), the Schedule items), so the lead units
    carry no separate limb. Document structure.
  consequence: 'None for a caller: the paragraphs and items they introduce are cited.'
  declaration: not_an_exception
  not_formalized_because: structural
- what: data_breach_definition_limbs_and_account_pair_parts
  units:
  - sg-pdpa-2012#pr26A-pdaffectedindividual
  - sg-pdpa-2012#pr26A-pddatabreach-p1a
  - sg-pdpa-2012#pr26A-pddatabreach-p1b
  - sg-s64-2021#pr3-ps1-p1b-p2i
  - sg-s64-2021#pr3-ps1-p1b-p2ii
  reason: The definition of affected individual and the two limbs of the data breach
    definition (s 26A) are read inside the judgement is_data_breach and the breach
    kinds (readings (3), (4)); the two parts of reg 3(1)(b) are the atoms account_identifier
    and account_access_credential, cited through reg 3(1)(b).
  consequence: The answers never say whether an incident is a data breach; the caller's
    judgement does.
  declaration: answered_with_caveat
  debt: true
  open: 'open-textured by design: ''unauthorised'' and ''likely to occur'' stay a
    judgement.'
- what: other_prescribed_circumstances
  units:
  - sg-pdpa-2012#pr26B-ps2-p1b
  - sg-pdpa-2012#pr26B-ps3-p1b
  reason: s 26B(2)(b) and (3)(b) allow 'other prescribed circumstances'; the pinned
    Regulations prescribe none beyond regs 3 and 4 (reading (5), (7); Q11).
  consequence: A circumstance prescribed later would add a deemed ground the order
    does not know.
  declaration: answered_with_caveat
  debt: true
  open: 'Q11: a later order adds a limb if a circumstance is prescribed.'
- what: prescribed_assessment_requirements
  units:
  - sg-pdpa-2012#pr26C-ps4
  reason: s 26C(4) requires the assessment to follow 'any prescribed requirements';
    none found in the pinned Regulations (reading (8); Q11).
  consequence: The answers never say whether an assessment was carried out correctly.
  declaration: answered_with_caveat
  debt: true
  open: Q11.
- what: notice_knowledge_standard_form_and_sub_items
  units:
  - sg-pdpa-2012#pr26D-ps3
  - sg-pdpa-2012#pr26D-ps4
  - sg-s64-2021#pr5-ps1-p1g-p2i
  - sg-s64-2021#pr5-ps1-p1g-p2ii
  - sg-s64-2021#pr5-ps4
  - sg-s64-2021#pr6-p1d-p2i
  - sg-s64-2021#pr6-p1d-p2ii
  reason: s 26D(3) is read only through the fixed content lists of regs 5 and 6 ('[quotation omitted]
    [quotation omitted]' is not checked); s 26D(4) and reg 5(4) leave
    the form and manner to the Commission's website, outside the pinned text; the
    sub-items (i) and (ii) of reg 5(1)(g) and reg 6(d) are read as part of their item.
  consequence: The answers list what a notice must contain; they never check a notice,
    its form or the knowledge behind it.
  declaration: answered_with_caveat
  debt: true
  open: formalisable only with the Commission's form, which is not pinned.
- what: secrecy_protection_and_concurrent_duties
  units:
  - sg-pdpa-2012#pr26D-ps8
  - sg-pdpa-2012#pr26D-ps8-p1a
  - sg-pdpa-2012#pr26D-ps8-p1b
  - sg-pdpa-2012#pr26D-ps9
  reason: s 26D(8) says notifying is not by itself a breach of a secrecy duty or professional
    rule; s 26D(9) says the duties apply alongside notice duties under other written
    law. Neither has a decision output in this order.
  consequence: The answers never say whether another law requires another notice.
  declaration: not_an_exception
  not_formalized_because: procedural_no_output
- what: commencement_of_the_regulations
  units:
  - sg-s64-2021#pr1
  reason: Reg 1 brings the Regulations into operation on 1 February 2021, the date
    s 26C(1) already gives; the order reads the date from s 26C(1).
  consequence: None for a caller.
  declaration: not_an_exception
  not_formalized_because: structural
