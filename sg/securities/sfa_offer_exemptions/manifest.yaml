id: sg/securities/sfa_offer_exemptions
provision_tracking_note: "Provision tracking is informal: the deferred set below is a first scope map, and the units it does not defer are not accounted unit by unit. There is no provision-tracking ledger."
deferred_set:
- what: amount_substitution_orders
  units:
  - sg-sfa-2001#pr272A-ps1-p1a-p2ii
  reason: 'Order deferred_set: s 272A(1)(a)(ii), s 272B(2), s 275(4): the Authority may substitute the
    amounts; the statutory figures are used.'
  consequence: If the Authority has prescribed a substitute amount or number, the caller must apply it
    instead of this domain's statutory figure.
- what: closely_related_offers
  units:
  - sg-sfa-2001#pr272A-ps5-p1b
  - sg-sfa-2001#pr272B-ps3-p1b
  reason: 'Order deferred_set: s 272A(5)-(6) / s 272B(3)-(4) aggregation of closely related offers by
    prescribed factors; the supplier lists the offers to aggregate.'
  consequence: The caller must identify closely related offers (including CIS offers under ss 302B/302C)
    and include them in prior_small_offers / prior_private_placement_offerees.
scope_map_unsure:
- 'sg-sfa-2001#pr275-ps2-pdrelevantperson: deferred as investor_classification because the order names
  s 275(2) there, although the order''s sources also quote the relevant-person list; arguably in scope.'
- 'sg-sfa-2001#pr275-ps2: the ''(2) In this section —'' chapeau is deferred as a heading shell because
  every definition under it is deferred; move it back in scope if pdrelevantperson is brought in.'
- 'sg-sfa-2001#pr272A-ps1-p1d-p2i: with p2ii, p2iii (and the parallel lists under pr272B-ps1-p1c, pr275-ps1-p1b,
  pr275-ps1A-p1c) the permitted-commission recipient lists are kept in scope because the order quotes
  them, though ''which selling expenses are permitted'' is a deferred characterisation.'
- 'sg-sfa-2001#pr272A-ps4: kept in scope because the order quotes s 272A(4), though amount_raised_cents
  is supplied pre-computed.'
- 'sg-sfa-2001#pr272A-ps1-p1b-p2i-p3A / -p3B: the prescribed statement texts are kept in scope with s
  272A(1)(b), though the domain only reads a boolean.'
- 'sg-sfa-2001#pr272A-ps1-p1e-p2ii: with pr272B-ps1-p1d-p2ii, pr275-ps1-p1c-p2ii, pr275-ps1A-p1d-p2ii
  kept in scope; they define the prospectus_state notification limbs.'
operative_readings:
- what: twelve_month_window_ends_on_the_offer_date
  units:
  - sg-sfa-2001#pr272A-ps1-p1a
  - sg-sfa-2001#pr272B-ps1-p1a
  question: ss 272A(1)(a) / 272B(1)(a) aggregate offers 'within any period of 12 months'. Is the window
    the 12 months ending on the offer date (backward-looking only), or any 12-month period containing
    the offer, including later offers?
  readings:
  - id: backward_from_offer_date
    consequence: Only offers in the 12 months up to and including offer_date count; the window starts
      the same calendar day one year before, plus one day (29 Feb rounds up to 1 Mar).
  - id: any_period_containing_the_offer
    consequence: Later offers within 12 months also count, so an exemption could be lost retrospectively.
    conservative: true
  chosen: backward_from_offer_date
  rationale: Exemption status must be decidable when the offer is made; MAS's aggregation guideline examples
    count prior offers.
  authority: MAS Guidelines on the Aggregation of Offers (2005)
  attested:
    by: owner
    role: owner
    date: '2026-10-03'
scope: "Whether an offer of securities in Singapore is exempt from the prospectus requirement under the Securities and Futures Act 2001 (ss 272A, 272B, 274 and 275), on the size of the offer, the status of the investors and the offers made in the preceding window. For ONE offer. Drafter's reading, not a lawyer's."
